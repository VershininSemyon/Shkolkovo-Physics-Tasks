2c7b080f316.svg", "index-550d4dc94cdd46aa0292d3fddd62b207.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433366/index-550d4dc94cdd46aa0292d3fddd62b207.svg", "index-183d3270a42b63fcb3b1e3be283b35d6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433366/index-183d3270a42b63fcb3b1e3be283b35d6.svg", "index-f0a61bd6a3f0988a5516e0739b7aa94f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433366/index-f0a61bd6a3f0988a5516e0739b7aa94f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T00:42:57Z", "updated_at": "2026-08-17T00:46:53Z"}, {"id": 195580, "name": "Копия #102054 - Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Тонкая, упругая и мягкая оболочка герметичного воздушного шара наполнена водородом. Как изменяется с высотой при быстром\nподъёме объём водорода и средняя кинетическая энергия теплового движения молекул водорода? Оболочку считать\nтеплоизолирующей.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилось<br/>2) уменьшилось<br/>3) не изменилось<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------------------------|\n|О бъём водорода|Средняя кинетическая энергия теплового\n|               |     движения м олекул водорода     |\n|---------------|----------------------------------|\n---------------------------------------------------|\n\" class=\"math-display\" src=\"index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg\"/></div>", "solution_html": "<p class=\"noindent\">1)Давление водорода складывается из:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"pвод = pатм +pупр,\n\" class=\"math-display\" src=\"index-6cac0ee007925d3d67f5cd130cdcebb6.svg\"/></div>\n<p class=\"indent\">   С увеличением высоты атмосферное давление уменьшается. В начальный момент давление водорода внутри шара оказывается\nбольше внешнего давления:\n</p> <div class=\"math-display\">\n<img alt=\"pвод &gt; pатм +pупр,\n\" class=\"math-display\" src=\"index-7e0330b6872ca592e58051221753d364.svg\"/></div>\n<p class=\"indent\">   поэтому газ растягивает оболочку и <span class=\"labx-0900\">оболочка шара в объеме увеличивается</span>. <br/>Объём водорода – 1.<br/>\n</p><p class=\"indent\">   2)Т.к. оболочка теплоизолирующая, процесс адиабатический: <img alt=\"Q = 0  \" class=\"math\" src=\"index-a460a382d05ca6ace2e1d07aed6d2ec4.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A.\n\" class=\"math-display\" src=\"index-b62c1e39130a9efb9c7437294ff32a56.svg\"/></div>\n<p class=\"indent\">   При расширении газ совершает положительную работу <img alt=\"(A &gt; 0)  \" class=\"math\" src=\"index-5ae2b91b7889e8181eba83586629c836.svg\"/>, поэтому <img alt=\"ΔU &lt; 0  \" class=\"math\" src=\"index-21dda10209fc03ed66160e0a687555ed.svg\"/>. Внутренняя энергия идеального газа зависит\nтолько от температуры, значит температура уменьшается.<br/>Средняя кинетическая энергия молекул:\n</p> <div class=\"math-display\">\n<img alt=\"¯Ek = 3kT.\n    2\n\" class=\"math-display\" src=\"index-c741de17e07ebbb1f89eff8cbf554843.svg\"/></div>\n<p class=\"indent\">   Так как уменьшается температура, то средняя кинетическая энергия молекул тоже уменьшается.<br/>Средняя кинетическая энергия теплового движения молекул –2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433537/index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg", "index-6cac0ee007925d3d67f5cd130cdcebb6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-6cac0ee007925d3d67f5cd130cdcebb6.svg", "index-7e0330b6872ca592e58051221753d364.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-7e0330b6872ca592e58051221753d364.svg", "index-a460a382d05ca6ace2e1d07aed6d2ec4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-a460a382d05ca6ace2e1d07aed6d2ec4.svg", "index-b62c1e39130a9efb9c7437294ff32a56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-b62c1e39130a9efb9c7437294ff32a56.svg", "index-5ae2b91b7889e8181eba83586629c836.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-5ae2b91b7889e8181eba83586629c836.svg", "index-21dda10209fc03ed66160e0a687555ed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-21dda10209fc03ed66160e0a687555ed.svg", "index-c741de17e07ebbb1f89eff8cbf554843.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433538/index-c741de17e07ebbb1f89eff8cbf554843.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T07:03:14Z", "updated_at": "2026-08-17T07:04:10Z"}, {"id": 14074, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Как изменяется внутренняя энергия идеального газа и его давление при его изотермическом расширении? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------|---------|\n|Внутренняя энергия|Д-авление-|\n-----------------------------\n\" class=\"math-display\" src=\"index-30a5cc8b75c725f2177aa62bf99f61ea.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия — 3 <br/>1) Изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2νR ΔT,\n\" class=\"math-display\" src=\"index-08cee1242b0ef83a81a4afeeb24f0c94.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-3c38f79329030919bc7c4ce5ef9a6ddb.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-e727f6ca5e285e08fcbffd4cd221c7d3.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-419e13d69b4fbcb53c86dc74db7bb34e.svg\"/> — изменение температуры газа.\n<br/>Так как процесс изотермический, то <img alt=\"ΔT  = 0  \" class=\"math\" src=\"index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg\"/>, то есть <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-f303acfb47f9a71aba7b02d66ed087a4.svg\"/>.<br/><br/>Давление — 2 <br/>2)Так как процесс изотермический, то по закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const\n\" class=\"math-display\" src=\"index-3ea30816da08073c537387b1906b03f7.svg\"/></div>\n<p class=\"indent\">   Значит, при увеличении объема давление газа уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-30a5cc8b75c725f2177aa62bf99f61ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28341/index-30a5cc8b75c725f2177aa62bf99f61ea.svg", "index-08cee1242b0ef83a81a4afeeb24f0c94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-08cee1242b0ef83a81a4afeeb24f0c94.svg", "index-3c38f79329030919bc7c4ce5ef9a6ddb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-3c38f79329030919bc7c4ce5ef9a6ddb.svg", "index-e727f6ca5e285e08fcbffd4cd221c7d3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-e727f6ca5e285e08fcbffd4cd221c7d3.svg", "index-419e13d69b4fbcb53c86dc74db7bb34e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-419e13d69b4fbcb53c86dc74db7bb34e.svg", "index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg", "index-f303acfb47f9a71aba7b02d66ed087a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-f303acfb47f9a71aba7b02d66ed087a4.svg", "index-3ea30816da08073c537387b1906b03f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28342/index-3ea30816da08073c537387b1906b03f7.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": [], "created_at": "2021-12-10T09:20:07Z", "updated_at": "2026-04-07T20:22:51Z"}, {"id": 195471, "name": "Копия #14074 - Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Идеальный газ изотермически расширяется. Что произойдёт при этом с его внутренней энергией и давлением? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------|---------|\n|Внутренняя энергия|Д-авление-|\n-----------------------------\n\" class=\"math-display\" src=\"index-30a5cc8b75c725f2177aa62bf99f61ea.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия — 3 <br/>1) Изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2νR ΔT,\n\" class=\"math-display\" src=\"index-08cee1242b0ef83a81a4afeeb24f0c94.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-3c38f79329030919bc7c4ce5ef9a6ddb.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-e727f6ca5e285e08fcbffd4cd221c7d3.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-419e13d69b4fbcb53c86dc74db7bb34e.svg\"/> — изменение температуры газа.\n<br/>Так как процесс изотермический, то <img alt=\"ΔT  = 0  \" class=\"math\" src=\"index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg\"/>, то есть <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-f303acfb47f9a71aba7b02d66ed087a4.svg\"/>.<br/><br/>Давление — 2 <br/>2)Так как процесс изотермический, то по закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const\n\" class=\"math-display\" src=\"index-3ea30816da08073c537387b1906b03f7.svg\"/></div>\n<p class=\"indent\">   Значит, при увеличении объема давление газа уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-30a5cc8b75c725f2177aa62bf99f61ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433315/index-30a5cc8b75c725f2177aa62bf99f61ea.svg", "index-08cee1242b0ef83a81a4afeeb24f0c94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-08cee1242b0ef83a81a4afeeb24f0c94.svg", "index-3c38f79329030919bc7c4ce5ef9a6ddb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-3c38f79329030919bc7c4ce5ef9a6ddb.svg", "index-e727f6ca5e285e08fcbffd4cd221c7d3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-e727f6ca5e285e08fcbffd4cd221c7d3.svg", "index-419e13d69b4fbcb53c86dc74db7bb34e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-419e13d69b4fbcb53c86dc74db7bb34e.svg", "index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-c6acd5cc81d9ad4781ca8e15f73ed0aa.svg", "index-f303acfb47f9a71aba7b02d66ed087a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-f303acfb47f9a71aba7b02d66ed087a4.svg", "index-3ea30816da08073c537387b1906b03f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433316/index-3ea30816da08073c537387b1906b03f7.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T22:56:06Z", "updated_at": "2026-08-16T22:57:46Z"}, {"id": 160748, "name": "Задача на термодинамику. Первая часть", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан график изменения состояния постоянного количества одноатомного идеального газа.<br/>Установите соответствие между участками графика и значениями физических величин, характеризующих процессы на этих\nучастках (<img alt=\"ΔU  \" class=\"math\" src=\"index-e42004bf3b56feabf1dc3b4c7fbbf4c3.svg\"/> – изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-31ca8dd7ab2028015dea50682c6e8f93.svg\"/> – работа газа).<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"160748.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"УЧА СТКИ ГР АФИ КА  ЗН АЧЕН ИЯ Ф ИЗИЧ ЕСК ИХ ВЕЛ ИЧИ Н\nА) 1                1) ΔU = 0; A &gt; 0\n\nБ) 3                2) ΔU &lt; 0; A = 0\n                    3) ΔU = 0; A &lt; 0\n                    4) ΔU &gt; 0; A &gt; 0\n\" class=\"math-display\" src=\"index-789a93b9b4a3c5ed5d2f7b3a09755bf1.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-717696ee6ffda0128087186546d6b189.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Участок 1: так как продолжение отрезка данного процесса проходит через начало координат на <img alt=\"pT− \" class=\"math\" src=\"index-9821976eeac106a8748a2bb2dca43b17.svg\"/>диаграмме, процесс\nявляется изохорным. Объем газа не изменяется, а температура уменьшается. Если объем не ментся, то работа газа равна нулю\n<img alt=\"A = 0  \" class=\"math\" src=\"index-53d0d835dd35f69a9b7486fe475d8353.svg\"/>. Внутренняя энергия пропорциональна температуре <img alt=\"(         )\n U = 3νRT\n     2 \" class=\"math\" src=\"index-ded46b9baf641530ff3b36c6fe2d39e6.svg\"/>, тогда если температура уменьшается, то и внутренняя\nэнергия тоже будет уменьшатья <img alt=\"ΔU &lt; 0  \" class=\"math\" src=\"index-8f814c57f55fb71aa1643cd581fd7ee2.svg\"/>. Ответ – 2.<br/>Б) Участок 3: процесс является изотермическим. Согласно уравнению Менделеева-Клапейрона <img alt=\"(pV =νRT )  \" class=\"math\" src=\"index-94fc29bb822ca25a04d78d32e9406eac.svg\"/>, если давление растет\nпри постоянных количестве вещества и температуре, то объём будет уменьшаться. Работа газа зависит от <img alt=\"ΔV,  \" class=\"math\" src=\"index-b8acef837e23c2bd53a5ba3fb3fd2738.svg\"/> так как <img alt=\"ΔV &lt; 0,  \" class=\"math\" src=\"index-edcae7f60100ef6b047ec6df9ccc8737.svg\"/> то\n<img alt=\"A &lt; 0  \" class=\"math\" src=\"index-f03a4a051b99d7dfc387c8ae19e29830.svg\"/>. Поскольку температура не изменяется, внутренняя энергия газа тоже не будет изменяться <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-c6bd4b64363f93c74500d8110852889f.svg\"/>. Ответ –\n3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e42004bf3b56feabf1dc3b4c7fbbf4c3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/343529/index-e42004bf3b56feabf1dc3b4c7fbbf4c3.svg", "index-31ca8dd7ab2028015dea50682c6e8f93.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/343529/index-31ca8dd7ab2028015dea50682c6e8f93.svg", "160748.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/343529/16074 106703, "name": "Задача по термодинамике с графиком", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">С постоянным количеством газа провели процесс <img alt=\"a→ b → c→ d → e→  f  \" class=\"math\" src=\"index-9e5d6603674f593803bbb83170193258.svg\"/>, в течение которого вычисляли внутреннюю энергию <img alt=\"     U  \" class=\"math\" src=\"index-f12838853d3954fcc542beb53ba2222d.svg\"/>\nгаза и измеряли работу <img alt=\"A  \" class=\"math\" src=\"index-356d0c0e45b296c59c64cc3487b07b2e.svg\"/>, совершенную газом от момента начала процесса. <img alt=\"AU  \" class=\"math\" src=\"index-3a5b43eb873322707f6df875bc0b67dc.svg\"/> - диаграмма процесса приведена на\nрисунке.<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"106703.png\" width=\"394\"/></p></div>\n<p class=\"indent\">   Установите соответствие между названием процесса и участком на диаграмме, на котором он представлен.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Н АЗВА НИЕ П РОЦ ЕССА   У ЧАС ТОК Н А Д ИА ГРАМ МЕ\nА ) Адиабатное сжатие   1)b → c\n                        2)c → d\n\nБ ) Адиабатное расширение 3)d → e\n                        4)e → f\n\" class=\"math-display\" src=\"index-eb2e9c5f4b8967a0407207bc568f6cd1.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-03edbf539da5b2651d8aa929ff649c24.svg\"/></div>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU,\n\" class=\"math-display\" src=\"index-21412eaf3137c0d27c50f059bd9e0c98.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-45eb2575097a1a2158a01eeb407c7155.svg\"/> – работа газа, <img alt=\"ΔU  \" class=\"math\" src=\"index-2922097590880fc28fb31eca90a2780e.svg\"/> – изменение внутренней энергии.<br/>А) В процессе адиабатного сжатия <img alt=\"Q = 0  \" class=\"math\" src=\"index-0e9cf9d044d13c10f23fc3d4d3376a8f.svg\"/>, <img alt=\"A &lt; 0  \" class=\"math\" src=\"index-8291d4160af123ea255497d859fb927c.svg\"/>, <img alt=\"ΔU = −A &gt; 0  \" class=\"math\" src=\"index-dfa7b8912d492cb852ba24a354d82808.svg\"/>. Под данное описание подходит <img alt=\"d→  e  \" class=\"math\" src=\"index-b750b29d2358e17db5a95557decf1d05.svg\"/> (3).<br/>Б) В процессе адиабатного расширения <img alt=\"Q = 0  \" class=\"math\" src=\"index-506605bc52f06190e1c09c38ce3d3eb5.svg\"/>, <img alt=\"A &gt;0  \" class=\"math\" src=\"index-6fc87ed7a4197b2e89a760c4130848e0.svg\"/>, <img alt=\"ΔU = −A &lt; 0  \" class=\"math\" src=\"index-5dc1b73e66bc74545408fdaf7ad126fb.svg\"/>. Под данное описание подходит <img alt=\"b→ c  \" class=\"math\" src=\"index-08bc3727ceab65cc1b4482f52b8b76b3.svg\"/> (1).<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9e5d6603674f593803bbb83170193258.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221013/index-9e5d6603674f593803bbb83170193258.svg", "index-f12838853d3954fcc542beb53ba2222d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221013/index-f12838853d3954fcc542beb53ba2222d.svg", "index-356d0c0e45b296c59c64cc3487b07b2e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221013/index-356d0c0e45b296c59c64cc3487b07b2e.svg", "index-3a5b43eb873322707f6df875bc0b67dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221013/index-3a5b43eb873322707f6df875bc0b67dc.svg", "106703.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221013/106703.png", "index-eb2e9c5f4b8967a0407207bc568f6cd1.svg": "https://3.shkolkovo.online/api/latex- ат ЕГЭ"], "sources": ["Отличник"], "created_at": "2025-02-25T21:29:00Z", "updated_at": "2026-04-12T20:20:48Z"}, {"id": 195445, "name": "Копия #106703 - Задача по термодинамике с графиком", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">С неизменным количеством газа был проведён процесс <img alt=\"a → b→  c→ d→  e→ f.  \" class=\"math\" src=\"index-01e95855ab938728b766eb8a3610f9c3.svg\"/> В ходе процесса определяли внутреннюю энергию\nгаза <img alt=\"U  \" class=\"math\" src=\"index-3bc0ce4cacaf9ac2aa745e6cbc2c33b3.svg\"/> и измеряли работу <img alt=\"A  \" class=\"math\" src=\"index-fc267e66ed312e45a23677f509530f90.svg\"/>, совершённую газом с начала процесса. Диаграмма зависимости <img alt=\"A  \" class=\"math\" src=\"index-75db3ddbbfb61d8b0c9e4fb47cdce5fe.svg\"/> от <img alt=\"U  \" class=\"math\" src=\"index-dfe42ef2722714f39a72cdeee53b2ad1.svg\"/> представлена на\nрисунке.<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"106703.png\" width=\"394\"/></p></div>\n<p class=\"noindent\">Установите соответствие между названием процесса и участком на диаграмме, на котором он представлен.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Н АЗВА НИЕ П РОЦ ЕССА   У ЧАС ТОК Н А Д ИА ГРАМ МЕ\nА ) Адиабатное сжатие   1)b → c\n                        2)c → d\nБ ) Адиабатное расширение 3)d → e\n                        4)e → f\n\" class=\"math-display\" src=\"index-12c083f241ac8523624f6954265b6f9f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А |Б |\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-c5af7ce80ebee7e1c15ba92ccf2078a9.svg\"/></div>", "solution                     1\n                                      4)Q1η\n\" class=\"math-display\" src=\"index-ac5c45465d7086f51c438a24a172d260.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-749eaacbfee7d2bc0bc62daac62ca4c2.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД равно\n</p> <div class=\"math-display\">\n<img alt=\"       Q2\nη = 1− Q1-\n\" class=\"math-display\" src=\"index-9334c8fa33453c37cd2ae0feef18eaaa.svg\"/></div>\n<p class=\"indent\">   Откуда искомая величина\n</p> <div class=\"math-display\">\n<img alt=\"Q2 =Q1 (1 − η)\n\" class=\"math-display\" src=\"index-dcd18f6cafab85e9b127c5d4b97f8284.svg\"/></div>\n<p class=\"indent\">   Б) КПД равно\n</p> <div class=\"math-display\">\n<img alt=\"η = 1− T2\n      T1\n\" class=\"math-display\" src=\"index-19abb4dd7ad1d5730b8f31840fe71eab.svg\"/></div>\n<p class=\"indent\">   Откуда искомая величина\n</p> <div class=\"math-display\">\n<img alt=\"T2 =T1(1− η)\n\" class=\"math-display\" src=\"index-3b5fb6777f64c837094793788d26c925.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-057e746ed153dddbb08f5f3434028b70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28329/index-057e746ed153dddbb08f5f3434028b70.svg", "index-cdebae5b5198c49d909fdaecc740a20a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28329/index-cdebae5b5198c49d909fdaecc740a20a.svg", "index-3944b288220b873c2099e8cb403d918a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28329/index-3944b288220b873c2099e8cb403d918a.svg", "index-ac5c45465d7086f51c438a24a172d260.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28329/index-ac5c45465d7086f51c438a24a172d260.svg", "index-749eaacbfee7d2bc0bc62daac62ca4c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28329/index-749eaacbfee7d2bc0bc62daac62ca4c2.svg", "index-9334c8fa33453c37cd2ae0feef18eaaa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28330/index-9334c8fa33453c37cd2ae0feef18eaaa.svg", "index-dcd18f6cafab85e9b127c5d4b97f8284.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28330/index-dcd18f6cafab85e9b127c5d4b97f8284.svg", "index-19abb4dd7ad1d5730b8f31840fe71eab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28330/index-19abb4dd7ad1d5730b8f31840fe71eab.svg", "index-3b5fb6777f64c837094793788d26c925.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28330/index-3b5fb6777f64c837094793788d26c925.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2021", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демоверсия 2021"], "created_at": "2021-12-10T09:16:27Z", "updated_at": "2026-04-20T16:57:24Z"}, {"id": 24181, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показаны pT-диаграммы двух циклических процессов, совершаемых с одним и тем же постоянным количеством\nидеального газа. Некоторая тепловая машина сначала осуществляет цикл 1-2-3-4-1, а затем - цикл 5-6-7-8-5.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-12-2-pict8.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Используя рисунок, определите, как изменятся указанные в таблице физические величины при переходе тепловой машины от\nфункционирования по циклу 1-2-3-4-1 к функционированию по циклу 5-6-7-8-5.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличится;\n</p><p class=\"indent\">   2) уменьшится;\n</p><p class=\"indent\">   3) не изменится.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------------|---------------------------|\n|Работа, соверш ённая газом за весь Модуль работы газа в процесс&amp;\n|------циклический-процесс------|------изобарного сжатия-----|\n|                             |                           |\n-----------------------------------------------------------\n\" class=\"math-display\" src=\"index-f3bd4f67407edb5b2dc0e2941dd03be3.svg\"/></div>\n<p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>", "solution_html": "<p class=\"noindent\">Для процессов, проходящих через начало координат имеем зависимость:\n</p> <div class=\"math-display\">\n<img alt=\"p= αT,\n\" class=\"math-display\" src=\"index-2c4b924add494d8a8dcbce4cf9986d34.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-89af2741459786a9afa9489078600245.svg\"/> некоторый коэффициент.<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-023f8cc6090bf99fef9421ccd13da6a9.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-0df65449d25b8eb008a87da6f066795f.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-1ee3aed8a3d2f6764b309d1f3e8ec61a.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-062da595a4b9bb1a78e3245d0a805945.svg\"/> —температура.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"pV-= νR = const\n T\n\" class=\"math-display\" src=\"index-a2edb05723b7f4e9b6e55b719d20b867.svg\"/></div>\n<p class=\"indent\">   Или\n</p> <div class=\"math-display\">\n<img alt=\"αT ⋅V-= const⇒ V = const,\n T\n\" class=\"math-display\" src=\"index-2db7847d41996996a40e58f882b40768.svg\"/></div> <p class=\"indent\">   То есть в процессах 1-2, 3-4, 5-6, 7-8 объём постоянен.\n</p><p class=\"indent\">   Тогда на графике, оба цикла состоят из двух изобар и двух изохор.\n</p><p class=\"indent\">   Используя уравнение Менделеева – Клапейрона, изобразим эти процессы на pV-диаграмме:\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-12-2-pict9.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Работа ЧИСЛЕННО равна площади под графиком в координатах <img alt=\"p − V,  \" class=\"math\" src=\"index-2a1ce4d9426515e682b1ddaf03337bee.svg\"/> и она не изменяется. Изобарное сжатие это процессы\n4-1 и 8-5, при этом модули работы равны:\n</p> <div class=\"math-display\">\n<img alt=\"A4−1 = 2p0(4V0 − V0)= 6p0V0\n\" class=\"math-display\" src=\"index-2ec9e64566460b1c3ace0f7d3a829288.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A8−5 = p0(3V0− 2V0)= p0V0\n\" class=\"math-display\" src=\"index-5dc45f706e1eb1bbd92781c5e3458b37.svg\"/></div>\n<p class=\"indent\">   То есть модуль работы уменьшится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-12-2-pict8.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45994/f-12-2-pict8.png", "index-f3bd4f67407edb5b2dc0e2941dd03be3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45994/index-f3bd4f67407edb5b2dc0e2941dd03be3.svg", "index-2c4b924add494d8a8dcbce4cf9986d34.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-2c4b924add494d8a8dcbce4cf9986d34.svg", "index-89af2741459786a9afa9489078600245.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-89af2741459786a9afa9489078600245.svg", "index-023f8cc6090bf99fef9421ccd13da6a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-023f8cc6090bf99fef9421ccd13da6a9.svg", "index-0df65449d25b8eb008a87da6f066795f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-0df65449d25b8eb008a87da6f066795f.svg", "index-1ee3aed8a3d2f6764b309d1f3e8ec61a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-1ee3aed8a3d2f6764b309d1f3e8ec61a.svg", "index-062da595a4b9bb1a78e3245d0a805945.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-062da595a4b9bb1a78e3245d0a805945.svg", "index-a2edb05723b7f4e9b6e55b719d20b867.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-a2edb05723b7f4e9b6e55b719d20b867.svg", "index-2db7847d41996996a40e58f882b40768.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-2db7847d41996996a40e58f882b40768.svg", "f-12-2-pict9.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/f-12-2-pict9.png", "index-2a1ce4d9426515e682b1ddaf03337bee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-2a1ce4d9426515e682b1ddaf03337bee.svg", "index-2ec9e64566460b1c3ace0f7d3a829288.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-2ec9e64566460b1c3ace0f7d3a829288.svg", "index-5dc45f706e1eb1bbd92781c5e3458b37.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45995/index-5dc45f706e1eb1bbd92781c5e3458b37.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": [], "created_at": "2022-04-13T16:28:05Z", "updated_at": "2026-04-15T05:06:51Z"}, {"id": 64221, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ изобарно расширяется, переходя из состояния 1 в состояние 2. Чему равны изменение его внутренней\nэнергии и полученное им количество теплоты в этом процессе?\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"64221_1.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Установите соответствие между физическими величинами и формулами, по которым их можно рассчитать.\n</p> <div class=\"math-display\">\n<img alt=\"ФИ ЗИЧ ЕСК АЯ ВЕЛ ИЧИ НА                  ФО РМ УЛА\nА) изм енение внутренней энергии при переходе 1)p0(V2− V1)\n\nиз состояния 1 в состояние 2                2)1p0(V2− V1)\n                                            2\n\nБ) количество теплоты, полученное при переходе 3)3p0(V2− V1)\n                                            2\n                                            5\nиз состояния 1 в состояние 2                4)2p0(V2− V1)\n\" class=\"math-display\" src=\"index-3add385807900e3620d6ccba8289b5a0.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-206010bf6e9a5e9f705c52b84ef74ef4.svg\"/></div>", "solution_html": "<p class=\"noindent\">Изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2νR ΔT,\n\" class=\"math-display\" src=\"index-31c0c7e412f9712b79ef3e1bd8785924.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-338cde7431f7a75390c7b433a308aaa0.svg\"/> – количество вещества.<br/>По уравнению Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-896fdf234f02037995436bf8a4b638cc.svg\"/></div>\n<p class=\"indent\">   для нашего случая\n</p> <div class=\"math-display\">\n<img alt=\"p0(V2− V1)= νRΔT\n\" class=\"math-display\" src=\"index-d6ab94d9051b285b7af38a92e989fcde.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 3p0(V2− V1).\n     2\n\" class=\"math-display\" src=\"index-9ea38c9b981fc8ded1c74914f7f92c8d.svg\"/></div>\n<p class=\"indent\">   По первому началу термодинамики:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-bdacd2ad2e8678ef73d1436dca66b208.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-d90aa7b4dba4a93236abf61415910f9e.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-f97e194813051edc7866f63b62b0bfa1.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-81eeef9e3380f93a130f1e298b01c4c9.svg\"/> – работа газа.<br/>Процесс изобарный, значит\n</p> <div class=\"math-display\">\n<img alt=\"A= p0(V2− V1)\n\" class=\"math-display\" src=\"index-639f160b7b5a4f7909664accda9ab2b7.svg\"/></div>\n<p class=\"indent\">   Тогда из первого начала термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 3p0(V2− V1)+ p0(V2− V1) = 5p0(V2− V1)\n    2                       2\n\" class=\"math-display\" src=\"index-b519d671a843f7a695b4563eb5dfc9ff.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"64221_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115992/64221_1.png", "index-3add385807900e3620d6ccba8289b5a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115992/index-3add385807900e3620d6ccba8289b5a0.svg", "index-206010bf6e9a5e9f705c52b84ef74ef4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115992/index-206010bf6e9a5e9f705c52b84ef74ef4.svg", "index-31c0c7e412f9712b79ef3e1bd8785924.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115993/index-31c0c7e412f9712b79ef3e1bd8785924.svg", "index-338cde7431f7a75390c7b433a308aaa0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115993/index-338cde7431f7a75390c7b433a308aaa0.svg", "index-896fdf234f02037995436bf8a4b638cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115993/index-896fdf234f02037995436bf8a4b638cc.svg", "index-d6ab94d9051b285b7af38a92e989fcde.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115993/index-d6ab94d9051b285b7af38a92e989fcde.svg", "index-9ea38c9b981fc8ded1c74914f7f92c8d.svg": "https://3.shkolkovo.online/api/latex-s on_html": "<p class=\"noindent\">В изолированной системе тело А имеет температуру <img alt=\"   ∘\n+ 15 C,  \" class=\"math\" src=\"index-97044d417031227ffcc9b11985519a27.svg\"/> а тело Б — температуру <img alt=\"    ∘\n+ 43C.  \" class=\"math\" src=\"index-f4101a8711e34ddeb04e322f61f7905b.svg\"/> Эти тела привели в тепловой\nконтакт друг с другом. Через некоторое время наступило тепловое равновесие. Как в результате изменились температура тела Б и\nсуммарная внутренняя энергия тел А и Б? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|--------------------|\n| Температура  |С уммарная внутренняя\n|    тела Б    |   энергия тел А и Б |\n|-------------|--------------------|\n------------------------------------\n\" class=\"math-display\" src=\"index-a9e46cc32ff90b604b9e8ea807cdb235.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура Б — 2 <br/>1) При контакте температура тела А будет увеличиваться, температура тела Б уменьшаться, так как тепло передается от более\nтеплого, к более холодному. <br/><br/>Суммарная внутренняя энергия — 3. <br/>2) Из первого начала термодинамики следует, что изменение внутренней энергии системы зависит от количества теплоты и работы,\nсовершенной системой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= A + ΔU   ⇒   ΔU = Q − A,\n\" class=\"math-display\" src=\"index-55aa5b077e188e07be5104e24d9a1839.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-aa85eb36ce0d67a0073234c9337a1f90.svg\"/> — количество теплоты, полученное системой, <img alt=\"A  \" class=\"math\" src=\"index-03e8f58252511e0347c73ba171c0c3eb.svg\"/> — работа, совершенная системой, <img alt=\"ΔU  \" class=\"math\" src=\"index-6a49e837b61bbe18565aed83e9a99093.svg\"/> — изменение внутренней энергии\nсистемы.<br/>Данная система является изолированной (по условию), то есть она не взаимодействует с окружающей средой. Следовательно,\nколичество теплоты <img alt=\"Q  \" class=\"math\" src=\"index-f4d8273ca87b9bd6ec0dc06bbd20f1f9.svg\"/> равно нулю. <br/>Также система не совершает работы, то есть <img alt=\"A = 0  \" class=\"math\" src=\"index-0af859bd32dec74830d0b16007c2c886.svg\"/>.<br/>Таким образом, изменение внутренней энергии системы равно нулю. Следовательно, она постоянна.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-97044d417031227ffcc9b11985519a27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28371/index-97044d417031227ffcc9b11985519a27.svg", "index-f4101a8711e34ddeb04e322f61f7905b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28371/index-f4101a8711e34ddeb04e322f61f7905b.svg", "index-a9e46cc32ff90b604b9e8ea807cdb235.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28371/index-a9e46cc32ff90b604b9e8ea807cdb235.svg", "index-55aa5b077e188e07be5104e24d9a1839.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-55aa5b077e188e07be5104e24d9a1839.svg", "index-aa85eb36ce0d67a0073234c9337a1f90.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-aa85eb36ce0d67a0073234c9337a1f90.svg", "index-03e8f58252511e0347c73ba171c0c3eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-03e8f58252511e0347c73ba171c0c3eb.svg", "index-6a49e837b61bbe18565aed83e9a99093.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-6a49e837b61bbe18565aed83e9a99093.svg", "index-f4d8273ca87b9bd6ec0dc06bbd20f1f9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-f4d8273ca87b9bd6ec0dc06bbd20f1f9.svg", "index-0af859bd32dec74830d0b16007c2c886.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28372/index-0af859bd32dec74830d0b16007c2c886.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": [], "created_at": "2021-12-10T09:55:41Z", "updated_at": "2026-07-14T12:35:27Z"}, {"id": 14085, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Тепловые явления", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится твёрдое вещество. Цилиндр поместили в раскалённую печь. На рисунке показан график\nизменения температуры <img alt=\"T  \" class=\"math\" src=\"index-672524905edf5b522eb15340d5d92226.svg\"/> вещества по мере поглощения им количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-d1aec540d71f1011b16ccb608f2ccadc.svg\"/>. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"236\" src=\"14085.png\" width=\"236\"/></p></div>\n<p class=\"noindent\">Какие формулы соответствуют каким физическим величинам? <br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ФОР МУЛ Ы  Ф ИЗИ ЧЕС КИЕ ВЕ ЛИЧ ИНЫ\nА)-Q1      1) Удельная теплоёмкость твёрдого вещ ества\n  m Δt\n  Q4       2) Удельная теплоёмкость ж идкого вещ ества\nБ)-m       3) Удельная теплота плавления вещ ества\n           4) Удельная теплота парообразования вещества\n\" class=\"math-display\" src=\"index-04ca0a8ceb57b41f166035ccb84df01b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-717696ee6ffda0128087186546d6b189.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) <img alt=\"Q1  \" class=\"math\" src=\"index-480fd0e4513b2fb736411de49a98dc30.svg\"/> – это количество теплоты, полученное телом при нагреве. Формула количества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm Δt\n\" class=\"math-display\" src=\"index-9618090e291303f6cbbf706798193797.svg\"/></div>\n<p class=\"indent\">   Следовательно, это удельная теплоёмкость твёрдого вещества.<br/>Б) Процесс 3 – парообразование, формула количества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"              Q\nQ = Lm ⇒  L= m-\n\" class=\"math-display\" src=\"index-52def1c7683ea687ce019006627fde71.svg\"/></div>\n<p class=\"indent\">   Следовательно, Удельная теплота парообразования вещества\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-672524905edf5b522eb15340d5d92226.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28363/index-672524905edf5b522eb15340d5d92226.svg", "index-d1aec540d71f1011b16ccb608f2ccadc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28363/index-d1aec540d71f1011b16ccb608f2ccadc.svg", "14085.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28363/14085.png", "index-04ca0a8ceb57b41f166035ccb84df01b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28363/index-04ca0a8ceb57b41f166035ccb84df01b.svg", "index-717696ee6ffda0128087186546d6b189.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28363/index-717696ee6ffda0128087186546d6b189.svg", "index-480fd0e4513b2fb736411de49a98dc30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28364/index-480fd0e4513b2fb736411de49a98dc30.svg", "index-9618090e291303f6cbbf706798193797.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28364/index-9618090e291303f6cbbf706798193797.svg", "index-52def1c7683ea687ce019006627fde71.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28364/index-52def1c7683ea687ce019006627fde71.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "2019", "Досрочная волна", "Задача с реального ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Досрочная волна 2019"], "created_at": "2021-12-10T09:50:07Z", "updated_at": "2026-05-09T14:00:28Z"}, {"id": 14092, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Тепловые явления", "question_html": "<p class=\"noindent\">Установите соответствие между физическими величинами и приборами для их измерения.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ФИ ЗИЧЕ СКИ Е В ЕЛИ ЧИН Ы П РИБО РЫ Д ЛЯ ИХ И ЗМЕ РЕНИ Я\nА) Д авление               1) К алорим етр\nБ) Температура            2) Т ермом етр\n                          3) М анометр\n                          4) Д инамометр\n\" class=\"math-display\" src=\"index-fe94e68fb3ab746f099961caad1a1002.svg\"/></div>\n<p class=\"indent\">   К каждой позиции первого столбца подберите нужную позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-e29dc50c3b0d6e4064d9a0fd244c1aa9.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Давление — манометр<br/>Б) Температура — термометр\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fe94e68fb3ab746f099961caad1a1002.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28377/index-fe94e68fb3ab746f099961caad1a1002.svg", "index-e29dc50c3b0d6e4064d9a0fd244c1aa9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28377/index-e29dc50c3b0d6e4064d9a0fd244c1aa9.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-12-10T09:57:25Z", "updated_at": "2026-05-09T14:06:19Z"}, {"id": 195515, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В закрытом сосуде неизменного объёма содержится воздух с ненасыщенным водяным паром. Температуру воздуха повысили\nна 20 К. Установите, как при этом изменились концентрация молекул водяного пара и относительная влажность\nвоздуха.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения.\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|-----------------------|\n|К онцентрация молекул воды |О тносительная влажность|\n|         в сосуде        |    воздуха в сосуде    |\n|-------------------------|-----------------------|\n--------------------------------------------------|\n\" class=\"math-display\" src=\"index-56c62959834249b8c9c6232c3b795a96.svg\"/></div>", "solution_html": "<p class=\"noindent\">A) Концентрацию найдем по формуле <img alt=\"   N-\nn= V  \" class=\"math\" src=\"index-21b1516305a8e4a860d30e40dcee4cbb.svg\"/>, где <img alt=\"N  \" class=\"math\" src=\"index-007dca51ef6af7ad5fa641333077a1c5.svg\"/> - число молекул газа, <img alt=\"V  \" class=\"math\" src=\"index-f805629a87fc710bfc421f4bf308c6d4.svg\"/> - объём, занимаемый газом. Так как число молекул\nи объём сосуда неизменны, то концентрация не изменяется. А — 3.<br/>Б) Относительная влажность находится по формуле <img alt=\"φ=  ρпара⋅100%\n    ρн.п  \" class=\"math\" src=\"index-68a759e0231a0a547b286c018da40e2c.svg\"/>, здесь <img alt=\"ρпара  \" class=\"math\" src=\"index-848bfb62093f997ffcbc694bc7e2eff3.svg\"/> – плотность пара, <img alt=\"ρн.п  \" class=\"math\" src=\"index-c324d14dd65730c52934632be5000717.svg\"/> – плотность\nнасыщенного пара при данной температуре. При увеличении температуры в сосуде, плотность насыщенного пара увеличивается. Так\nкак масса водяного пара и объём сосуда неизменны, поэтому его плотность не меняется, следовательно, относительная влажность\nуменьшается. Б — 2\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-56c62959834249b8c9c6232c3b795a96.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433405/index-56c62959834249b8c9c6232c3b795a96.svg", "index-21b1516305a8e4a860d30e40dcee4cbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-21b1516305a8e4a860d30e40dcee4cbb.svg", "index-007dca51ef6af7ad5fa641333077a1c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-007dca51ef6af7ad5fa641333077a1c5.svg", "index-f805629a87fc710bfc421f4bf308c6d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-f805629a87fc710bfc421f4bf308c6d4.svg", "index-68a759e0231a0a547b286c018da40e2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-68a759e0231a0a547b286c018da40e2c.svg", "index-848bfb62093f997ffcbc694bc7e2eff3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-848bfb62093f997ffcbc694bc7e2eff3.svg", "index-c324d14dd65730c52934632be5000717.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433406/index-c324d14dd65730c52934632be5000717.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T01:52:26Z", "updated_at": "2026-08-17T01:56:01Z"}, {"id": 172014, "name": " Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится жидкость и её насыщенный пар (см. рисунок). </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"172014.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Как будут изменяться давление и масса пара при медленном перемещении поршня вверх при постоянной температуре? До конца\nпроцесса на дне сосуда остаётся некоторая масса жидкости.<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|-----------|\n|Давление пара|-Масса пара|\n--------------------------|\n\" class=\"math-display\" src=\"index-c24078d88637f8a993d31f2b0d53d48d.svg\"/></div>", "solution_html": "<p class=\"noindent\">При медленном увеличении объема (перемещение поршня вверх) при постоянной температуре пар остается насыщенным, значит\nдавления пара и насыщенного пара равны. Так как в сосуде продолжает оставаться жидкость. Давление насыщенного пара зависит\nтолько от температуры и не изменяется, пока температура остается постоянной. Следовательно, давление пара не\nизменится.\n</p><p class=\"indent\">   Увеличение объема вызывает испарение дополнительной части жидкости, чтобы поддерживать равновесие между жидкостью и\nнасыщенным паром при постоянном давлении. Плотность насыщенного пара при данной температуре остается неизменной, но объем\nувеличивается. Так как масса пара равна произведению его плотности на объем (<img alt=\"m = ρV  \" class=\"math\" src=\"index-9d46ee595a98c1ed53eada98cada83b2.svg\"/>), а плотность постоянна, то при\nувеличении объема масса пара будет увеличиваться.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"172014.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/371386/172014.png", "index-c24078d88637f8a993d31f2b0d53d48d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/371386/index-c24078d88637f8a993d31f2b0d53d48d.svg", "index-9d46ee595a98c1ed53eada98cada83b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/371387/index-9d46ee595a98c1ed53eada98cada83b2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["Апробация 2026"], "created_at": "2026-03-05T02:30:37Z", "updated_at": "2026-05-09T12:33:46Z"}, {"id": 111141, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В неглубоком сосуде наблюдают установившийся процесс кипения воды, при этом со дна сосуда к поверхности поднимается\nгазовый пузырёк. Как изменяется при подъёме давление внутри пузырька и концентрация молекул пара внутри\nпузырька?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|------------------------|\n|Д авление внутри |К онцентрация м олекул пара|\n|----пузырька----|-----внутри пузырька----|\n|               |                        |\n------------------------------------------\n\" class=\"math-display\" src=\"index-2c993f94bdf170d49d05a9b696316efc.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Давление столба жидкости:\n</p> <div class=\"math-display\">\n<img alt=\"P = ρgh\n\" class=\"math-display\" src=\"index-9fbca6b776e376e1596e15d0321b4cce.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ρ  \" class=\"math\" src=\"index-8fe253ddd7b08c622c98a19baaaf136e.svg\"/> – плотность воды, <img alt=\"h  \" class=\"math\" src=\"index-429fe8d8c4b59a3795a66c960b9e08c4.svg\"/> – высота столба воды. Давление внутри пузырька должно быть равно давлению снаруже. При\nподъеме шарика внешнее давление уменьшается, значит, уменьшается и давление внутри пузырька<br/>2) Так как в сосуде установившийся процесс кипения воды, то число вылетевших из жидкости молекул воды, в среднем, равно числу\nих поглощения водой. Следовательно, температура пара, примерно постоянна, так как при подъеме давление на пузырек\nуменьшается, то объём пузырька будет увеличиваться при неизменном количестве молекул, что означает, что концентрация\nпадает.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2c993f94bdf170d49d05a9b696316efc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/228787/index-2c993f94bdf170d49d05a9b696316efc.svg", "index-9fbca6b776e376e1596e15d0321b4cce.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/228788/index-9fbca6b776e376e1596e15d0321b4cce.svg", "index-8fe253ddd7b08c622c98a19baaaf136e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/228788/index-8fe253ddd7b08c622c98a19baaaf136e.svg", "index-429fe8d8c4b59a3795a66c960b9e08c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/228788/index-429fe8d8c4b59a3795a66c960b9e08c4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Гидростатика", "Давление жидкости", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-03-19T23:02:31Z", "updated_at": "2026-04-29T09:14:30Z"}, {"id": 195557, "name": "Копия #14083 - Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В стеклянном сосуде находится небольшое количество воды и некоторое количество водяного пара. Как изменится масса воды и\nплотность водяного пара при увеличении температуры? Считать, что в процессе эксперимента в сосуде всегда остается немного воды\nв жидком состоянии.<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|----------------------|\n|Масса воды|П-лотность водяного пара\n-----------------------------------\n\" class=\"math-display\" src=\"index-ea4e1e4a41f97af088fe59f14097881d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Относительная влажность водяных паров определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"     ρ\nφ = ρн.п.,\n\" class=\"math-display\" src=\"index-927f08c59a4b4bd61fe250d42b4220b6.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ρ  \" class=\"math\" src=\"index-db086b9433a3f391c52b2ac8f35446e0.svg\"/> – плотность водяных паров при заданной температуре, <img alt=\"ρн.п.  \" class=\"math\" src=\"index-cde4f7bfd5ecc46ec7178745528a8971.svg\"/> – плотность насыщенных водяных паров при той же\nтемпературе. <br/>Плотность насыщенных водяных паров <img alt=\"ρ\n н.п.  \" class=\"math\" src=\"index-015de235add8d7aea8e1e41da9f3d06f.svg\"/> является функцией только температуры, следовательно, при увеличении\nтемпературы она будет расти. Получается, относительная влажность <img alt=\"φ  \" class=\"math\" src=\"index-33470e427e4ac07e1eb22bc8bcf75135.svg\"/> должна была бы уменьшаться в такой ситуации.\n<br/>В нашем же случае водяной пар находится в герметично закрытом сосуде постоянного объема вместе с водой, то есть он в самом\nначале уже насыщенный и находится в динамическом равновесии с водой. При увеличении температуры это равновесие будет\nнарушаться, но система все равно будет стремиться к новому состоянию равновесия. <br/>Увеличение температуры приводит к увеличению кинетической энергии молекул. В таком случае, скорость испарения воды будет\nпревышать скорость конденсации паров, то есть масса воды будет уменьшаться. Это будет приводить к тому, что система\nснова будет находиться в состоянии равновесия, но все это будет происходить до тех пор, пока в сосуде есть вода.\n<br/>Так как водяные пары находятся в закрытом сосуде постоянного объема, то и объем, который занимают водяные пары, будет\nпостоянен. Плотность паров определяется по формуле: <img alt=\"    m-\nρ = V  \" class=\"math\" src=\"index-24785b42ee3daf0d19888d5a955f5e8f.svg\"/>, где <img alt=\"m  \" class=\"math\" src=\"index-e8b6212a8023e49bd039194d3a67d32c.svg\"/> – масса водяных паров, <img alt=\"V  \" class=\"math\" src=\"index-4909439bc8e239541aa2eb19260f70e3.svg\"/> – объем, занимаемый водяными\nпарами. Выше было сказано, что масса воды будет уменьшаться из-за увеличения испарения воды при росте температуры,\nследовательно, масса водяных паров <img alt=\"m  \" class=\"math\" src=\"index-685eb08ba3674fc1e9cf677406cd1d02.svg\"/> будет расти. Так как объем <img alt=\"V = const  \" class=\"math\" src=\"index-beb38fc19b15b51d32557bf2736ffb3d.svg\"/>, то плотность водяных паров <img alt=\"ρ  \" class=\"math\" src=\"index-449279032a14b65e107efbd0419ad924.svg\"/> будет\nрасти.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ea4e1e4a41f97af088fe59f14097881d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433491/index-ea4e1e4a41f97af088fe59f14097881d.svg", "index-927f08c59a4b4bd61fe250d42b4220b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-927f08c59a4b4bd61fe250d42b4220b6.svg", "index-db086b9433a3f391c52b2ac8f35446e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-db086b9433a3f391c52b2ac8f35446e0.svg", "index-cde4f7bfd5ecc46ec7178745528a8971.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-cde4f7bfd5ecc46ec7178745528a8971.svg", "index-015de235add8d7aea8e1e41da9f3d06f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-015de235add8d7aea8e1e41da9f3d06f.svg", "index-33470e427e4ac07e1eb22bc8bcf75135.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-33470e427e4ac07e1eb22bc8bcf75135.svg", "index-24785b42ee3daf0d19888d5a955f5e8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-24785b42ee3daf0d19888d5a955f5e8f.svg", "index-e8b6212a8023e49bd039194d3a67d32c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-e8b6212a8023e49bd039194d3a67d32c.svg", "index-4909439bc8e239541aa2eb19260f70e3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-4909439bc8e239541aa2eb19260f70e3.svg", "index-685eb08ba3674fc1e9cf677406cd1d02.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-685eb08ba3674fc1e9cf677406cd1d02.svg", "index-beb38fc19b15b51d32557bf2736ffb3d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-beb38fc19b15b51d32557bf2736ffb3d.svg", "index-449279032a14b65e107efbd0419ad924.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433492/index-449279032a14b65e107efbd0419ad924.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Свойства паров. Влажность"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T06:51:13Z", "updated_at": "2026-08-17T06:51:33Z"}, {"id": 111142, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В стеклянном сосуде находится небольшое количество воды и некоторое количество ненасыщенного водяного пара. Как изменится\nдавление насыщенных паров и масса водяного пара через длительное время? Считать, что температура в сосуде не\nизменялась<br/><br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры под соответствующими буквами.\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------|-------------|\n|Д авление насыщ енных |Масса водяного\n|-------паров--------|----пара-----|\n|                    |             |\n------------------------------------\n\" class=\"math-display\" src=\"index-254b2bc34ee65690b0ed1b4d262ba883.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Давление насыщенных паров зависит только от температуры. Если температура не меняется, то и давление насыщенных паров не\nизменяется (3)<br/>2) Поскльку часть воды испарится, масса пара увеличится (1)\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-254b2bc34ee65690b0ed1b4d262ba883.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/228789/index-254b2bc34ee65690b0ed1b4d262ba883.svg"}, "tags": [], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-03-19T23:32:47Z", "updated_at": "2026-04-29T09:15:21Z"}, {"id": 14081, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">Как изменится давление А) насыщенного пара, Б) ненасыщенного пара при небольшом изотермическом уменьшении объема сосуда?\n<br/>1) уменьшиться <br/>2) увеличится <br/>3) вначале увеличится, а затем уменьшится <br/>4) не изменится <br/>Запишите в таблицу выбранные цифры под соответствующими буквами.\n</p> <div class=\"math-display\">\n<img alt=\"|----|---|\n|-A--|Б--|\n---------|\n\" class=\"math-display\" src=\"index-cd9a20122f0969a1cf5ffc53a8bb6740.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Давление насыщенного пара не зависит от объема, занимаемого паром (с уменьшением объема насыщенного пара часть пара\nконденсируется в жидкость), т.е. ответ 4. <br/>Б) Давление ненасыщенного пара подчиняется закону <img alt=\"PV = const  \" class=\"math\" src=\"index-1e37622073c0a2c00f9c6dea432c30db.svg\"/>. При небольшом изотермическом уменьшение объема (пока пар\nне стал насыщенным) <img alt=\"P  \" class=\"math\" src=\"index-f3b162605d516eb64de3eeaf5d36d4dd.svg\"/> увеличивается, т.е. ответ 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cd9a20122f0969a1cf5ffc53a8bb6740.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28355/index-cd9a20122f0969a1cf5ffc53a8bb6740.svg", "index-1e37622073c0a2c00f9c6dea432c30db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28356/index-1e37622073c0a2c00f9c6dea432c30db.svg", "index-f3b162605d516eb64de3eeaf5d36d4dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28356/index-f3b162605d516eb64de3eeaf5d36d4dd.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Свойства паров. Влажность"], "sources": [], "created_at": "2021-12-10T09:33:25Z", "updated_at": "2026-01-25T08:13:10Z"}, {"id": 14084, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Водяной пар. Влажность", "question_html": "<p class=\"noindent\">В герметично закрытом сосуде находится воздух с паром. Как изменится относительная и абсолютная влажность воздуха в сосуде,\nесли понизить температуру воздуха в следующих случаях?\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"А) насыщ енного пара   1) абсолютная влажность увеличится, а относ&amp;\nБ) ненасыщенного пара 2) абсолютная влажность уменьшится, а отн&amp;#\n                      3) относительная влаж ность увеличится, а абсолютная останет&amp;#x0\n                      4) относительная влаж ность уменьш ится, а абсолю тная останет&amp;#x04\n\" class=\"math-display\" src=\"index-8a4f5653b19c9e90ee5b74526a92abf8.svg\"/></div>\n<p class=\"indent\">   Запишите в таблицу выбранные цифры под соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-A--|Б--|\n|----|---|\n---------|\n\" class=\"math-display\" src=\"index-bbd7c19e1d96f21f93a160f94663bad3.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) В случае, когда в сосуде насыщенный пар (А) при понижении температуры начнётся конденсация насыщенного\nпара, плотность пара (т.е. абсолютная влажность) уменьшится, а относительная останется равной 100%, т.е. ответ 2.\n<br/>2) В случае, когда в сосуде ненасыщенный пар (Б) плотность пара в закрытом сосуде не меняется, а плотность\nнасыщенного пара с понижением температуры уменьшается, так как <img alt=\"φ = ρ  ⋅\n    ρнп \" class=\"math\" src=\"index-182388d88a84df450267af45d7e3d3cc.svg\"/> 100% <img alt=\"⇒ \" class=\"math\" src=\"index-6f88c1561823ce2b659e881355fe7ac1.svg\"/><img alt=\"φ  \" class=\"math\" src=\"index-f6532449c4e60ef1496dfd9ff9fc07fc.svg\"/> увеличивается, т.е. ответ\n3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8a4f5653b19c9e90ee5b74526a92abf8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28361/index-8a4f5653b19c9e90ee5b74526a92abf8.svg", "index-bbd7c19e1d96f21f93a160f94663bad3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28361/index-bbd7c19e1d96f21f93a160f94663bad3.svg", "index-182388d88a84df450267af45d7e3d3cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28362/index-182388d88a84df450267af45d7e3d3cc.svg", "index-6f88c1561823ce2b659e881355fe7ac1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28362/index-6f88c1561823ce2b659e881355fe7ac1.svg", "index-f6532449c4e60ef1496dfd9ff9fc07fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28362/index-f6532449c4e60ef1496dfd9ff9fc07fc.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Свойства паров. Влажность"], "sources": [], "created_at": "2021-12-10T09:35:26Z", "updated_at": "2026-01-25T08:14:19Z"}, {"id const ALL_MODE = false;

const searchTypeEl = document.getElementById('searchType');
const searchInput  = document.getElementById('searchInput');
const searchBtn    = document.getElementById('searchBtn');
const resetBtn     = document.getElementById('resetBtn');
const countEl      = document.getElementById('count');
const noResults    = document.getElementById('noResults');
const noResMsg     = document.getElementById('noResultsMsg');
const listEl       = document.getElementById('list');
const initMsg      = document.getElementById('initialMessage');

const PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const MAX_CONCURRENT = 6;
let activeLoads = 0;
const loadQueue = [];

function pumpQueue() {
  while (activeLoads < MAX_CONCURRENT && loadQueue.length > 0) {
    const img = loadQueue.shift();
    if (!img.isConnected || !img.hasAttribute('data-src')) continue;
    activeLoads++;
    startLoad(img);
  }
}

function startLoad(img) {
  const url = img.getAttribute('data-src');
  const attempt = Number(img.getAttribute('data-attempt') || 0);
  img.onload = function () {
    img.removeAttribute('data-src');
    activeLoads--;
    pumpQueue();
  };
  img.onerror = function () {
    activeLoads--;
    if (attempt < 3) {
      img.setAttribute('data-attempt', String(attempt + 1));
      setTimeout(function () {
        loadQueue.unshift(img);
        pumpQueue();
      }, 400 * (attempt + 1));
    } else {
      img.removeAttribute('data-src');
    }
    pumpQueue();
  };
  img.src = url;
}

const lazyObserver = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (entry.isIntersecting) {
      lazyObserver.unobserve(entry.target);
      loadQueue.push(entry.target);
      pumpQueue();
    }
  });
}, { rootMargin: '400px 0px' });

function observeImages(root) {
  root.querySelectorAll('img[data-src]').forEach(function (img) {
    lazyObserver.observe(img);
  });
}

tasksData.questions.forEach((task, idx) => {
  task._seq = String(idx + 1);
  task._id = String(task.id);
  task._ege = String(task.ege || '');
  
  let searchText = '';
  searchText += (task.name || '') + ' ';
  searchText += (task.theme_path || '') + ' ';
  searchText += (task.tags || []).join(' ') + ' ';
  searchText += (task.sources || []).join(' ') + ' ';
  
  const parser = new DOMParser();
  const extractText = (html) => {
    if (!html) return '';
    const doc = parser.parseFromString(html, 'text/html');
    return doc.body.textContent || '';
  };
  
  searchText += extractText(task.question_html) + ' ';
  searchText += extractText(task.solution_html) + ' ';
  searchText += extractText(task.answer_html) + ' ';
  searchText += extractText(task.grade_criteria_html) + ' ';
  
  task._search = searchText.toLowerCase().replace(/\s+/g, ' ');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function rewriteImages(html, images) {
  if (!html) return '';
  const imgMap = {};
  for (const [fname, url] of Object.entries(images || {})) {
    imgMap[fname] = url;
  }
  return html.replace(/src=(["'])([^"']+)\1/g, function (match, quote, src) {
    const fname = src.split('/').pop();
    const url = imgMap[fname] || (src.startsWith('http') ? src : '');
    if (!url) return match;
    return 'src=' + quote + PLACEHOLDER + quote +
           ' data-src=' + quote + url + quote +
           ' referrerpolicy="no-referrer" loading="lazy"';
  });
}

function renderTask(task) {
  const tid = task.id;
  const name = escapeHtml(task.name || 'Без названия');
  const themePath = escapeHtml(task.theme_path || '');

  const tags = task.tags || [];
  const tagChips = tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
  
  const sources = task.sources || [];
  const srcChips = sources.map(s => `<span class="chip chip-src">${escapeHtml(s)}</span>`).join('');

  const qHtml = rewriteImages(task.question_html || '', task.images);
  const sHtml = rewriteImages(task.solution_html || '', task.images);
  const aHtml = rewriteImages(task.answer_html || '', task.images);
  const cHtml = rewriteImages(task.grade_criteria_html || '', task.images);

  function section(title, content, opened = false) {
    if (!content.trim()) return '';
    const openAttr = opened ? ' open' : '';
    return `
      <details class="section"${openAttr}>
        <summary>${title}</summary>
        <div class="tex-content">${content}</div>
      </details>
    `;
  }

  const sections = 
    section('Условие', qHtml, true) +
    section('Решение', sHtml) +
    section('Ответ', aHtml) +
    section('Критерии оценивания', cHtml);

  const egeBadge = (ALL_MODE && task._ege) ? `<span class="badge badge-ege">ЕГЭ №${task._ege}</span>` : '';

  return `
    <div class="task-card" data-seq="${task._seq}" data-id="${tid}">
      <div class="task-head">
        ${egeBadge}
        <span class="badge badge-num">№${task._seq}</span>
        <span class="badge badge-id">ID ${tid}</span>
        <span class="task-name">${name}</span>
      </div>
      ${themePath ? `<div class="theme-path">${themePath}</div>` : ''}
      <div class="task-meta">
        ${tagChips ? `<div class="chips">${tagChips}</div>` : ''}
        ${srcChips ? `<div class="chips">${srcChips}</div>` : ''}
      </div>
      ${sections}
    </div>
  `;
}

function updatePlaceholder() {
  const t = searchTypeEl.value;
  if (t === 'number') {
    searchInput.placeholder = 'Номер задачи (№ или ID)';
  } else if (t === 'ege') {
    searchInput.placeholder = 'Номер задания ЕГЭ (1-26)';
  } else {
    searchInput.placeholder = 'Текст для поиска…';
  }
}

function doSearch() {
  const type  = searchTypeEl.value;
  const query = searchInput.value.trim();

  if (!query) {
    listEl.innerHTML = '';
    initMsg.style.display = 'block';
    noResults.style.display = 'none';
    countEl.textContent = '';
    return;
  }

  initMsg.style.display = 'none';

  const filtered = tasksData.questions.filter(task => {
    if (type === 'number') {
      return (task._seq === query) || (task._id === query) ||
             task._id.startsWith(query) || task._seq.startsWith(query);
    }
    if (type === 'ege') {
      return task._ege === query;
    }
    return task._search.includes(query.toLowerCase());
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResults.style.display = 'block';
    if (type === 'number') {
      noResMsg.textContent = `Задачи с номером «${query}» нет`;
    } else if (type === 'ege') {
      noResMsg.textContent = `Задачи ЕГЭ №${query} не найдены`;
    } else {
      noResMsg.textContent = `По запросу «${query}» ничего не найдено`;
    }
    countEl.textContent = `Показано 0 из ${tasksData.questions.length}`;
  } else {
    noResults.style.display = 'none';
    listEl.innerHTML = filtered.map(renderTask).join('');
    observeImages(listEl);
    countEl.textContent = `Показано ${filtered.length} из ${tasksData.questions.length}`;
  }
}

function doReset() {
  searchInput.value = '';
  listEl.innerHTML = '';
  initMsg.style.display = 'block';
  noResults.style.display = 'none';
  countEl.textContent = '';
  searchInput.focus();
}

searchTypeEl.addEventListener('change', updatePlaceholder);
searchBtn.addEventListener('click', doSearch);
resetBtn.addEventListener('click', doReset);

searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch();
  }
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = true);
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = false);
});

updatePlaceholder();
initMsg.style.display = 'block';
noResults.style.display = 'none';
</script>
</body>
</html>
