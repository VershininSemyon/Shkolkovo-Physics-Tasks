. МКТ"], "sources": ["База ФИПИ"], "created_at": "2023-07-07T09:24:22Z", "updated_at": "2026-07-08T11:39:15Z"}, {"id": 14070, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках А и Б приведены графики двух процессов: 1–2 и 3–4, в каждом из которых участвует 1 моль гелия. Графики построены\nв координатах V–T и p–T, где p – давление, V – объём и T – абсолютная температура газа.\n</p><p class=\"indent\">   Установите соответствие между графиками и утверждениями, характеризующими изображённые на графиках\nпроцессы.\n</p><p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"14070_1.png\" width=\"368\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|А-|Б-|\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-9b3a8ed1e5048426907162cc3b11d9d8.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Температура постоянна, следовательно, внутренняя энергия не изменяется. Объем уменьшается, газ\nсовершает отрицательную работу, газ отдает количество теплоты. (4)<br/>Б) Температура уменьшается, следовательно, внутренняя энергия газа уменьшается. Давление\nпостоянно, поэтому по закону Гей-Люссака объем также уменьшается. Следовательно, газ отдает\nположительное количество теплоты. (2)\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14070_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28333/14070_1.png", "index-9b3a8ed1e5048426907162cc3b11d9d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28333/index-9b3a8ed1e5048426907162cc3b11d9d8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Задача с реального ЕГЭ", "2020", "Основная волна", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["Основная волна 2020"], "created_at": "2021-12-10T09:17:31Z", "updated_at": "2026-07-06T13:36:39Z"}, {"id": 39726, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль одноатомного идеального газа участвует в процессе 1-2-3, график которого изображён на рисунке в\nкоординатах p-V, где <img alt=\"p  \" class=\"math\" src=\"index-c76cbafca5a5062e0b44aad5f0888e8c.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-d5e7c1d50ebb1117da05e847fc043195.svg\"/> – объём газа.\n</p><p class=\"indent\">   Как изменяются абсолютная температура газа <img alt=\"T  \" class=\"math\" src=\"index-4d0b4386e1c6fa2952e1da1335f1ce42.svg\"/> в ходе процесса 2-3 и концентрация молекул газа <img alt=\"n  \" class=\"math\" src=\"index-cfa4eb7f44936168e86965b9fe96e925.svg\"/> в ходе процесса\n2-3?\n</p><p class=\"indent\">   Масса газа остаётся постоянной.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"105\" src=\"39726.png\" width=\"105\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|----------------------------|-------------------------|\n|А бсолютная температура газа|Концентрация молекул газа |\n|-----в-ходе процесса-2- 3----|----в ходе-процесса-2-3---|\n|                            |                         |\n-------------------------------------------------------\n\" class=\"math-display\" src=\"index-51b7ee94cc5a6c4faa1c34b564209a3e.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Изменение температуры в процессе 2–3:<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-dc05ec6751459af4bb764f8627c6964f.svg\"/></div>\n<p class=\"indent\">   Поскольку в процессе 2–3 объём не изменяется <img alt=\"(V = const)  \" class=\"math\" src=\"index-5f681d9affbb8307c05b0376a6306b4e.svg\"/>, а давление увеличивается, то, по закону Шарля:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"p2= p3\nT2  T3\n\" class=\"math-display\" src=\"index-7f50eb72d63d8630ac289f13b9b67bc0.svg\"/></div>\n<p class=\"indent\">   Так как <img alt=\"p3 &gt; p2  \" class=\"math\" src=\"index-b2996b830c17c55f774d5579a4ba4bb2.svg\"/>, то <img alt=\"T3 &gt; T2.  \" class=\"math\" src=\"index-4911efef8e0b6ab4ef7d323855c38d9d.svg\"/><br/>Следовательно, абсолютная температура увеличивается. А–1.<br/>Б) Изменение концентрации молекул в процессе 2–3:<br/>Концентрация молекул определяется формулой:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"n=  N,\n    V\n\" class=\"math-display\" src=\"index-1a343d172caffa5d12ee8bece7efbb71.svg\"/></div>\n<p class=\"indent\">   где N – число молекул.<br/>Так как масса газа постоянна, число молекул N не изменяется. В процессе 2–3 объём постоянен. Следовательно,<br/> </p> <div class=\"math-display\">\n<img alt=\"    N\nn=  V-= const\n\" class=\"math-display\" src=\"index-84d66b019817dea98ae278b8e7abac1e.svg\"/></div>\n<p class=\"indent\">   Концентрация не изменяется. Б–3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c76cbafca5a5062e0b44aad5f0888e8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/index-c76cbafca5a5062e0b44aad5f0888e8c.svg", "index-d5e7c1d50ebb1117da05e847fc043195.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/index-d5e7c1d50ebb1117da05e847fc043195.svg", "index-4d0b4386e1c6fa2952e1da1335f1ce42.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/index-4d0b4386e1c6fa2952e1da1335f1ce42.svg", "index-cfa4eb7f44936168e86965b9fe96e925.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/index-cfa4eb7f44936168e86965b9fe96e925.svg", "39726.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/39726.png", "index-51b7ee94cc5a6c4faa1c34b564209a3e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76594/index-51b7ee94cc5a6c4faa1c34b564209a3e.svg", "index-dc05ec6751459af4bb764f8627c6964f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-dc05ec6751459af4bb764f8627c6964f.svg", "index-5f681d9affbb8307c05b0376a6306b4e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-5f681d9affbb8307c05b0376a6306b4e.svg", "index-7f50eb72d63d8630ac289f13b9b67bc0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-7f50eb72d63d8630ac289f13b9b67bc0.svg", "index-b2996b830c17c55f774d5579a4ba4bb2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-b2996b830c17c55f774d5579a4ba4bb2.svg", "index-4911efef8e0b6ab4ef7d323855c38d9d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-4911efef8e0b6ab4ef7d323855c38d9d.svg", "index-1a343d172caffa5d12ee8bece7efbb71.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-1a343d172caffa5d12ee8bece7efbb71.svg", "index-84d66b019817dea98ae278b8e7abac1e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/76595/index-84d66b019817dea98ae278b8e7abac1e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2022-10-22T08:03:56Z", "updated_at": "2026-07-28T11:17:16Z"}, {"id": 92300, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль одноатомного идеального газа участвует в процессе <img alt=\"1 − 2− 3  \" class=\"math\" src=\"index-f91ef8ef3200d182f64671931a2e29cb.svg\"/>, график которого изображён на рисунке в\nкоординатах <img alt=\"p− V  \" class=\"math\" src=\"index-2be05a0cad772b37167baf8413f829c8.svg\"/>, где <img alt=\"p  \" class=\"math\" src=\"index-ef62001221d26fffaa80546b9018c952.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-91b15e99355f7968c3ee76ad6e0d8125.svg\"/> – объём газа. Как изменяются абсолютная температура газа <img alt=\"T  \" class=\"math\" src=\"index-0c19a811ec096387432bc5938b8702ce.svg\"/> в ходе\nпроцесса 1-2 и плотность газа <img alt=\"ρ  \" class=\"math\" src=\"index-70ae7b11a6c0988b2449d8190a542837.svg\"/> в ходе процесса 2-3? Масса газа остаётся постоянной.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"105\" src=\"39726.png\" width=\"105\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------------------|---------------------------------|\n|Абсолю тная температура газа в ходе П лотн ость газа в ход е проц&amp;#x04\n|-----------процесса-1-2-----------|---------------------------------|\n|                                 |                                 |\n--------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-e3a6f3e0269f1010346041a8fce73ba2.svg\"/></div>", "solution_html": "<p class=\"noindent\">В процессе 1-2 давление постоянно, тогда по закону изобарного процесса:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const,\n\" class=\"math-display\" src=\"index-315f893187998394733095068935344c.svg\"/></div>\n<p class=\"indent\">   так как объем увеличивается, то увеличивается и температура.\n</p><p class=\"indent\">   Формула плотности имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"ρ= m-,\n    V\n\" class=\"math-display\" src=\"index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-185cd450ef0c20c0b81f3df0479a2df9.svg\"/> – масса газа, <img alt=\"V  \" class=\"math\" src=\"index-3e8ceec8f73e79bda01a08ce432f71db.svg\"/> – объём газа.<br/>Так как в процессе 2-3 объём не меняется, то плотность тоже не меняется.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f91ef8ef3200d182f64671931a2e29cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-f91ef8ef3200d182f64671931a2e29cb.svg", "index-2be05a0cad772b37167baf8413f829c8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-2be05a0cad772b37167baf8413f829c8.svg", "index-ef62001221d26fffaa80546b9018c952.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-ef62001221d26fffaa80546b9018c952.svg", "index-91b15e99355f7968c3ee76ad6e0d8125.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-91b15e99355f7968c3ee76ad6e0d8125.svg", "index-0c19a811ec096387432bc5938b8702ce.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-0c19a811ec096387432bc5938b8702ce.svg", "index-70ae7b11a6c0988b2449d8190a542837.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-70ae7b11a6c0988b2449d8190a542837.svg", "39726.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/39726.png", "index-e3a6f3e0269f1010346041a8fce73ba2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184866/index-e3a6f3e0269f1010346041a8fce73ba2.svg", "index-315f893187998394733095068935344c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195298/index-315f893187998394733095068935344c.svg", "index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195298/index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg", "index-185cd450ef0c20c0b81f3df0479a2df9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195298/index-185cd450ef0c20c0b81f3df0479a2df9.svg", "index-3e8ceec8f73e79bda01a08ce432f71db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195298/index-3e8ceec8f73e79bda01a08ce432f71db.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2024-07-20T08:32:50Z", "updated_at": "2026-04-18T16:37:32Z"}, {"id": 102390, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках А и Б приведены графики двух процессов: 1–2 и 3–4, в каждом из которых участвует 1 моль гелия. Графики построены\nв координатах V–T и p–T, где p – давление, V – объём и T – абсолютная температура газа.\n</p><p class=\"indent\">   Установите соответствие между графиками и утверждениями, характеризующими изображённые на графиках\nпроцессы.\n</p><p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"102390_1.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg\"/></div>", "solution_html": "<p class=\"noindent\">Рассмотрим график под буквой А. Заметим, что <img alt=\"T1 = T2   \" class=\"math\" src=\"index-6670accd47f4bbe2e186d2bd3b840c8c.svg\"/> и объём уменьшается.Работа газа зависит от\n<img alt=\"ΔV,  \" class=\"math\" src=\"index-c633dfc124029fb14e5eb558ae513095.svg\"/> так как <img alt=\"ΔV  &lt;  0,  \" class=\"math\" src=\"index-745fdae6c8daa32c084aeedb30f52b41.svg\"/> то <img alt=\"Aгаза &lt; 0  \" class=\"math\" src=\"index-f7a550cf70fe3bc6b252fe5a8c105127.svg\"/> , значит <img alt=\"A над газом = − Aгаза &gt; 0  \" class=\"math\" src=\"index-e7c1cf88c2b05c4c488048bd5945fe43.svg\"/>.<br/>По первому закону Термодинамики:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"Q     =  A    + ΔU,\n получ     газа\n\" class=\"math-display\" src=\"index-60971037648c8090643552de97fe39b8.svg\"/></div>\n<p class=\"indent\">   так как <img alt=\"T1 = T2   \" class=\"math\" src=\"index-18d2cda895aa0732db9e01060fcef600.svg\"/> , то <img alt=\"       3\nΔU  =  -νR ΔT   = 0.\n       2  \" class=\"math\" src=\"index-d628d0d48f11ff2bac870eb70da5c52b.svg\"/> <br/>Получается, что <img alt=\"Q      = A    &lt;  0\n  получ     газа  \" class=\"math\" src=\"index-0370cc44bc628e333a340ff8352ec3af.svg\"/> или <img alt=\"Q    = − Q      &gt; 0\n отд      получ  \" class=\"math\" src=\"index-26370e5584d7d1430ccf400f5ec79a72.svg\"/> . Таким образом, над газом совершают\nположительную работу, при этом газ отдает положительное количество теплоты - это утверждение №4.\n<br/>\n</p><p class=\"indent\">   Рассмотрим график под буквой Б. <img alt=\"p3 = p4   \" class=\"math\" src=\"index-2a69f6db7ba1a8e41fa8dfc8bc16e16d.svg\"/> и <img alt=\"T4 &lt; T3   \" class=\"math\" src=\"index-19c2c0867ba6a944c1d5e7ee89a1ad8f.svg\"/> , значит, что <img alt=\"U4  &lt; U3   \" class=\"math\" src=\"index-6036b3496e446465df39057e715b1313.svg\"/> - внутренняя энергия\nгаза уменьшается.<br/>Из уравнения Менделеева-Клапейрона\n</p> <div class=\"math-display\">\n<img alt=\"pV =  νRT\n\" class=\"math-display\" src=\"index-8acf480e1254b6330247a51e68950fbb.svg\"/></div>\n<p class=\"indent\">   следует, что <img alt=\"     νRT--\nV =    p  \" class=\"math\" src=\"index-fbd07196b6caef1c5a5c28fb7901c440.svg\"/> . Давление постоянно и внутренняя энергия газа уменьшается, поэтому\nобъем газа уменьшается, следовательно <img alt=\"A газа &lt; 0  \" class=\"math\" src=\"index-e483fb273385bd6c50f8223c14e0a823.svg\"/> . <img alt=\"Q получ = A газа + ΔU  &lt; 0  \" class=\"math\" src=\"index-255230b7c96130b5b3b31f787de2d0b3.svg\"/> , значит, что\n<img alt=\"Q отд = − Q получ &gt; 0  \" class=\"math\" src=\"index-755d655c7270bcbc8dcb81db86866432.svg\"/> .<br/>Таким образом, газ отдает положительное количество теплоты, при этом его внутренняя энергия\nуменьшается - это утверждение №2.\n                                                                                                    \n                                                                                                    \n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"102390_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210834/102390_1.png", "index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210834/index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg", "index-6670accd47f4bbe2e186d2bd3b840c8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-6670accd47f4bbe2e186d2bd3b840c8c.svg", "index-c633dfc124029fb14e5eb558ae513095.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-c633dfc124029fb14e5eb558ae513095.svg", "index-745fdae6c8daa32c084aeedb30f52b41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-745fdae6c8daa32c084aeedb30f52b41.svg", "index-f7a550cf70fe3bc6b252fe5a8c105127.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-f7a550cf70fe3bc6b252fe5a8c105127.svg", "index-e7c1cf88c2b05c4c488048bd5945fe43.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-e7c1cf88c2b05c4c488048bd5945fe43.svg", "index-60971037648c8090643552de97fe39b8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-60971037648c8090643552de97fe39b8.svg", "index-18d2cda895aa0732db9e01060fcef600.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-18d2cda895aa0732db9e01060fcef600.svg", "index-d628d0d48f11ff2bac870eb70da5c52b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-d628d0d48f11ff2bac870eb70da5c52b.svg", "index-0370cc44bc628e333a340ff8352ec3af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-0370cc44bc628e333a340ff8352ec3af.svg", "index-26370e5584d7d1430ccf400f5ec79a72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-26370e5584d7d1430ccf400f5ec79a72.svg", "index-2a69f6db7ba1a8e41fa8dfc8bc16e16d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-2a69f6db7ba1a8e41fa8dfc8bc16e16d.svg", "index-19c2c0867ba6a944c1d5e7ee89a1ad8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-19c2c0867ba6a944c1d5e7ee89a1ad8f.svg", "index-6036b3496e446465df39057e715b1313.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-6036b3496e446465df39057e715b1313.svg", "index-8acf480e1254b6330247a51e68950fbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-8acf480e1254b6330247a51e68950fbb.svg", "index-fbd07196b6caef1c5a5c28fb7901c440.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-fbd07196b6caef1c5a5c28fb7901c440.svg", "index-e483fb273385bd6c50f8223c14e0a823.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-e483fb273385bd6c50f8223c14e0a823.svg", "index-255230b7c96130b5b3b31f787de2d0b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-255230b7c96130b5b3b31f787de2d0b3.svg", "index-755d655c7270bcbc8dcb81db86866432.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210835/index-755d655c7270bcbc8dcb81db86866432.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Задача с реального ЕГЭ", "2020", "Основная волна", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["Демидова 2020"], "created_at": "2024-12-20T12:03:16Z", "updated_at": "2026-04-22T08:08:12Z"}, {"id": 195375, "name": "Копия #92300 - Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Одноатомный идеальный газ количеством вещества 1 моль проходит через состояния 1, 2 и 3 в соответствии с графиком на\n<img alt=\"pV  \" class=\"math\" src=\"index-82f130e03150ae76b46379c6b471be51.svg\"/>-диаграмме, где <img alt=\"p  \" class=\"math\" src=\"index-b6eefbbb13365781abd52c7b241278b1.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-0856e2e89ebb3d6e57ea4f7d254f4d72.svg\"/> – объём газа. Как изменяются температура газа <img alt=\"T  \" class=\"math\" src=\"index-a1a03688e1e357ee70586b08bd6a2b1f.svg\"/> в процессе <img alt=\"1 − 2  \" class=\"math\" src=\"index-145d20fde7e8b88ae9781ec60efc77c1.svg\"/> и его\nплотность <img alt=\"ρ  \" class=\"math\" src=\"index-01500019db735a7b09dd2c940099bfb5.svg\"/> в процессе <img alt=\"2 − 3?  \" class=\"math\" src=\"index-8e16afa778a3fc49a320f742476f6286.svg\"/> Масса газа постоянна. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"105\" src=\"39726.png\" width=\"105\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------------------|---------------------------------|\n|Абсолю тная температура газа в ходе П лотн ость газа в ход е проц&amp;#x04\n|-----------процесса-1-2-----------|---------------------------------|\n|                                 |                                 |\n--------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-0773c3d87cc7cbeaf00f619d4ddc1880.svg\"/></div>", "solution_html": "<p class=\"noindent\">В процессе 1-2 давление постоянно, тогда по закону изобарного процесса:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const,\n\" class=\"math-display\" src=\"index-315f893187998394733095068935344c.svg\"/></div>\n<p class=\"indent\">   так как объем увеличивается, то увеличивается и температура.\n</p><p class=\"indent\">   Формула плотности имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"ρ= m-,\n    V\n\" class=\"math-display\" src=\"index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-185cd450ef0c20c0b81f3df0479a2df9.svg\"/> – масса газа, <img alt=\"V  \" class=\"math\" src=\"index-3e8ceec8f73e79bda01a08ce432f71db.svg\"/> – объём газа.<br/>Так как в процессе 2-3 объём не меняется, то плотность тоже не меняется.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-82f130e03150ae76b46379c6b471be51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-82f130e03150ae76b46379c6b471be51.svg", "index-b6eefbbb13365781abd52c7b241278b1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-b6eefbbb13365781abd52c7b241278b1.svg", "index-0856e2e89ebb3d6e57ea4f7d254f4d72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-0856e2e89ebb3d6e57ea4f7d254f4d72.svg", "index-a1a03688e1e357ee70586b08bd6a2b1f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-a1a03688e1e357ee70586b08bd6a2b1f.svg", "index-145d20fde7e8b88ae9781ec60efc77c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-145d20fde7e8b88ae9781ec60efc77c1.svg", "index-01500019db735a7b09dd2c940099bfb5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-01500019db735a7b09dd2c940099bfb5.svg", "index-8e16afa778a3fc49a320f742476f6286.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-8e16afa778a3fc49a320f742476f6286.svg", "39726.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/39726.png", "index-0773c3d87cc7cbeaf00f619d4ddc1880.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433107/index-0773c3d87cc7cbeaf00f619d4ddc1880.svg", "index-315f893187998394733095068935344c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433108/index-315f893187998394733095068935344c.svg", "index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433108/index-f8e9d4e3de4ad8bea43d8776a8b4ff92.svg", "index-185cd450ef0c20c0b81f3df0479a2df9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433108/index-185cd450ef0c20c0b81f3df0479a2df9.svg", "index-3e8ceec8f73e79bda01a08ce432f71db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433108/index-3e8ceec8f73e79bda01a08ce432f71db.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T16:54:25Z", "updated_at": "2026-08-16T17:02:42Z"}, {"id": 29306, "name": "Задача на МКТ и термодинамику. Выбор верных утверждений", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках А и Б приведены графики двух процессов: 1-2 и 3-4, в каждом из которых участвует 1 моль\nгелия. Графики построены в координатах V-T и p-V, где p – давление, V – объём и T – абсолютная\nтемпература газа. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"29306.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---|---|\n|А--|Б--|\n|   |   |\n--------\n\" class=\"math-display\" src=\"index-616d95e5093e257855c15898005c730f.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) По первому началу термодинамики:\n</p> <center class=\"math-display\">\n<img src=\"index-58882d6d37df9fe32c052f8e7f52f772.svg\" alt=\"Q  = ΔU  + A,  \" class=\"math-display\"/></center> где\n<img src=\"index-3edb52fc3a6e840d442aa16704cc8415.svg\" alt=\"Q  \" class=\"math\"/> – количество теплоты, полученное газом, <img src=\"index-ef55d5dd27008b0eea2366489d2b01f6.svg\" alt=\"ΔU  \" class=\"math\"/> – изменение внутренней энергии, <img src=\"index-36d361518b071ab8caad07c81d099d28.svg\" alt=\"A  \" class=\"math\"/> – работа\nгаза.<br/>Процесс 3-4 изобарный с уменьшением объёма, значит, <img src=\"index-b795f690f5a016b441618f74b81a6539.svg\" alt=\"A &lt; 0  \" class=\"math\"/>.<br/>По закону Гей-Люссака:\n   <center class=\"math-display\">\n<img src=\"index-72d3afbca06fb678e080873066504719.svg\" alt=\"V\nT-=  const,  \" class=\"math-display\"/></center> то\nесть температура <img src=\"index-04c4b2beaa64c8a6bcddf4a3f9009b6f.svg\" alt=\"T  \" class=\"math\"/> уменьшается вместе с объёмом.<br/>Изменение внутренней энергии равно:\n   <center class=\"math-display\">\n<img src=\"index-7552a904982d8f6dea589ac20328acb7.svg\" alt=\"ΔU   = 3-νR ΔT,\n       2  \" class=\"math-display\"/></center> где\n<img src=\"index-b448570ab3900bf78a2fa36c7db4ee20.svg\" alt=\"ν  \" class=\"math\"/> – количество вещества.<br/>То есть <img src=\"index-2e0c6e27f13b02a004ad43ecaa482014.svg\" alt=\"ΔU  &lt; 0  \" class=\"math\"/>, тогда <img src=\"index-deac83e6c0d9995c827189fa06de3f98.svg\" alt=\"Q &lt; 0  \" class=\"math\"/>. Над газом совершают положительную работу (<img src=\"index-4a125b334ca3289d6dc9dd2fa8e1c2c7.svg\" alt=\"A &lt;  0  \" class=\"math\"/>), при этом его\nвнутренняя энергия уменьшается (<img src=\"index-e1acf9246a16041654bacb4672dcc149.svg\" alt=\"ΔU   &lt; 0  \" class=\"math\"/>). (3)<br/>Б) Процессе 1-2 изотермический <img src=\"index-54ecdbd5e6cde3d78db42870700c2371.svg\" alt=\"ΔU   = 0  \" class=\"math\"/>, <img src=\"index-985c0ef4a576346bb26f3a4369d9b4c5.svg\" alt=\"Q =  A  \" class=\"math\"/>. Объём газа увеличивается, значит, <img src=\"index-6c02635dbc43ba7a5fcbf3ce0a0e2d78.svg\" alt=\"A &gt; 0  \" class=\"math\"/>, <img src=\"index-02b73cb2e21c9e70efaf2355705a52cc.svg\" alt=\"Q  &gt; 0  \" class=\"math\"/>.\n                                                                                                    \n                                                                                                    \nГаз получает положительное количество теплоты (<img src=\"index-feb77f55916809acc1a1ed5de170f71e.svg\" alt=\"Q  &gt; 0  \" class=\"math\"/>), при этом его внутренняя энергия не\nизменяется (<img src=\"index-2f4e8f7ab0fa38404ec2518b93d87117.svg\" alt=\"ΔU   = 0  \" class=\"math\"/>). (2)", "answer_html": "", "grade_criteria_html": "", "images": {"29306.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54093/29306.png", "index-616d95e5093e257855c15898005c730f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54093/index-616d95e5093e257855c15898005c730f.svg", "index-58882d6d37df9fe32c052f8e7f52f772.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-58882d6d37df9fe32c052f8e7f52f772.svg", "index-3edb52fc3a6e840d442aa16704cc8415.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-3edb52fc3a6e840d442aa16704cc8415.svg", "index-ef55d5dd27008b0eea2366489d2b01f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-ef55d5dd27008b0eea2366489d2b01f6.svg", "index-36d361518b071ab8caad07c81d099d28.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-36d361518b071ab8caad07c81d099d28.svg", "index-b795f690f5a016b441618f74b81a6539.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-b795f690f5a016b441618f74b81a6539.svg", "index-72d3afbca06fb678e080873066504719.  "index-2f4e8f7ab0fa38404ec2518b93d87117.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54094/index-2f4e8f7ab0fa38404ec2518b93d87117.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики"], "sources": ["ФИПИ"], "created_at": "2022-05-28T08:21:48Z", "updated_at": "2026-04-22T08:08:29Z"}, {"id": 169033, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль одноатомного идеального газа участвует в процессе 1-2-3, график которого изображён на рисунке в координатах p-V, где\n<img alt=\"p  \" class=\"math\" src=\"index-3ce5ac9ddfeb7217d6a73bd84eb61008.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-b15a9cbefafe111c28012f0604b42038.svg\"/> – объём газа. Как изменяются абсолютная температура газа <img alt=\"T  \" class=\"math\" src=\"index-733a8895033ba93c6715c7ba16381134.svg\"/> в ходе процесса 1-2 и концентрация молекул\nгаза <img alt=\"n  \" class=\"math\" src=\"index-aa90bfa96c2732762aa061953f9fb4ce.svg\"/> в ходе процесса 2-3? Масса газа остаётся постоянной. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"169033.png\" width=\"526\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличивается <br/>2) уменьшается <br/>3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|А-бсолютная-тем-пература-|Концентрация-молекул газа\n|                      |                       |\n|-газа-в ходе процесса-1- 2|---в-ходе процесса-2- 3--|\n------------------------------------------------\n\" class=\"math-display\" src=\"index-fe684d4a37109b84f5d4be549ed97bdc.svg\"/></div>", "solution_html": "<p class=\"noindent\">Процесс 1-2 – процесс изобарного сжатия. Запишем закон Гей-Люссака:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const.\n\" class=\"math-display\" src=\"index-7f7f7bad85d8df705f5da75c56e2f342.svg\"/></div>\n<p class=\"indent\">   При уменьшении объема <img alt=\"V  \" class=\"math\" src=\"index-a81e6f75bbed1a3b7b2e90aec68acfbb.svg\"/> температура <img alt=\"T  \" class=\"math\" src=\"index-50edb61738a3c76ae9ac4fc41de1dc6c.svg\"/> тоже уменьшается. <br/>В ходе процесса 2-3 объем газа не меняется, тогда согласно формуле концентрация газа <img alt=\"n= N-\n   V  \" class=\"math\" src=\"index-86e1e1dcafd3ee11ea4fb0a64df53370.svg\"/> не изменяется.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3ce5ac9ddfeb7217d6a73bd84eb61008.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/index-3ce5ac9ddfeb7217d6a73bd84eb61008.svg", "index-b15a9cbefafe111c28012f0604b42038.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/index-b15a9cbefafe111c28012f0604b42038.svg", "index-733a8895033ba93c6715c7ba16381134.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/index-733a8895033ba93c6715c7ba16381134.svg", "index-aa90bfa96c2732762aa061953f9fb4ce.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/index-aa90bfa96c2732762aa061953f9fb4ce.svg", "169033.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/169033.png", "index-fe684d4a37109b84f5d4be549ed97bdc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363197/index-fe684d4a37109b84f5d4be549ed97bdc.svg", "index-7f7f7bad85d8df705f5da75c56e2f342.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363198/index-7f7f7bad85d8df705f5da75c56e2f342.svg", "index-a81e6f75bbed1a3b7b2e90aec68acfbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363198/index-a81e6f75bbed1a3b7b2e90aec68acfbb.svg", "index-50edb61738a3c76ae9ac4fc41de1dc6c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363198/index-50edb61738a3c76ae9ac4fc41de1dc6c.svg", "index-86e1e1dcafd3ee11ea4fb0a64df53370.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/363198/index-86e1e1dcafd3ee11ea4fb0a64df53370.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2026-02-16T09:04:04Z", "updated_at": "2026-04-18T16:38:11Z"}, {"id": 65073, "name": "Задача на электродинамику. Первая часть", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На графиках А и Б приведены диаграммы <img alt=\"p − V  \" class=\"math\" src=\"index-04be1539e8531524737e9e99027dc5db.svg\"/> и <img alt=\"V − T  \" class=\"math\" src=\"index-a42ac521ff15dc8fe1f998992c43dfbe.svg\"/> для процессов 1-2 и 3-4, проводимых с 1 моль неона. На диаграммах <img alt=\"      p  \" class=\"math\" src=\"index-b91c51d872b5505416388ff5b0a34f22.svg\"/>\n– давление, <img alt=\"V  \" class=\"math\" src=\"index-d9f22519f3a9fe130c3ee4d5de77eeab.svg\"/> – объём и <img alt=\"T  \" class=\"math\" src=\"index-a3dde2bd9d0a22f029d6e9eb6c57e12c.svg\"/> – абсолютная температура газа.\n</p><p class=\"indent\">   Установите соответствие между графиками и утверждениями, характеризующими изображённые на графиках\nпроцессы.\n</p><p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"65073.png\" width=\"368\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|А-|Б-|\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-9b3a8ed1e5048426907162cc3b11d9d8.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) На графике зависимость <img alt=\"p = αV  \" class=\"math\" src=\"index-4ff90644daea2207cb4db214fadc3de2.svg\"/>, где <img alt=\"α  \" class=\"math\" src=\"index-31c69fd153e29250712db9335beada12.svg\"/> – некоторый коэффициент.<br/>Из уравнения Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"           pV\npV = νRT ⇒ -T-= νR = const.\n\" class=\"math-display\" src=\"index-5f1d602371e597904f910cb95475cc4f.svg\"/></div>\n<p class=\"indent\">   Значит\n</p> <div class=\"math-display\">\n<img alt=\"                      2\npV-= const⇒  αV-⋅V-= αV--= const.\nT             T      T\n\" class=\"math-display\" src=\"index-2fb8e1c918ea5c9ee800c7d4912671db.svg\"/></div>\n<p class=\"indent\">   так как объём увеличивается, то температура <img alt=\"T  \" class=\"math\" src=\"index-2cea635bf1b2fef6fa1a14ff380f7529.svg\"/> увеличивается, значит, внутренняя энергия газа увеличивается. По первому\nзакону термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU,\n\" class=\"math-display\" src=\"index-85edbe8563bfddf57bc4a192a9c1a58f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-1d5e312a36cacee77849341cd1d66c14.svg\"/> – работа газа, <img alt=\"ΔU  \" class=\"math\" src=\"index-c1efd233edd2dc3def3cc4ed80ca985b.svg\"/> – изменение внутренней энергии.<br/>Так как объём увеличивается, то <img alt=\"A &gt; 0  \" class=\"math\" src=\"index-6376b8d8e58ada7a64287d47f76c52cc.svg\"/>, значит, газ получает положительное количество теплоты.<br/>Б) По первому закону термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU,\n\" class=\"math-display\" src=\"index-aaaf960bf1abc05cad99835b0de71e73.svg\"/></div>\n<p class=\"indent\">   так как объём уменьшается <img alt=\"A &lt; 0  \" class=\"math\" src=\"index-8ca85481c73c725868c140ceae87375d.svg\"/>, так как температура уменьшается, то <img alt=\"ΔU  &lt;0  \" class=\"math\" src=\"index-71f2162256cc91fd3db6ec8c62617525.svg\"/>, значит, <img alt=\"Q &lt; 0  \" class=\"math\" src=\"index-a51f1b8003c59cdae44993e805cd4865.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-04be1539e8531524737e9e99027dc5db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-04be1539e8531524737e9e99027dc5db.svg", "index-a42ac521ff15dc8fe1f998992c43dfbe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-a42ac521ff15dc8fe1f998992c43dfbe.svg", "index-b91c51d872b5505416388ff5b0a34f22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-b91c51d872b5505416388ff5b0a34f22.svg", "index-d9f22519f3a9fe130c3ee4d5de77eeab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-d9f22519f3a9fe130c3ee4d5de77eeab.svg", "index-a3dde2bd9d0a22f029d6e9eb6c57e12c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-a3dde2bd9d0a22f029d6e9eb6c57e12c.svg", "65073.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/65073.png", "index-9b3a8ed1e5048426907162cc3b11d9d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117571/index-9b3a8ed1e5048426907162cc3b11d9d8.svg", "index-4ff90644daea2207cb4db214fadc3de2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-4ff90644daea2207cb4db214fadc3de2.svg", "index-31c69fd153e29250712db9335beada12.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-31c69fd153e29250712db9335beada12.svg", "index-5f1d602371e597904f910cb95475cc4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-5f1d602371e597904f910cb95475cc4f.svg", "index-2fb8e1c918ea5c9ee800c7d4912671db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-2fb8e1c918ea5c9ee800c7d4912671db.svg", "index-2cea635bf1b2fef6fa1a14ff380f7529.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-2cea635bf1b2fef6fa1a14ff380f7529.svg", "index-85edbe8563bfddf57bc4a192a9c1a58f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-85edbe8563bfddf57bc4a192a9c1a58f.svg", "index-1d5e312a36cacee77849341cd1d66c14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-1d5e312a36cacee77849341cd1d66c14.svg", "index-c1efd233edd2dc3def3cc4ed80ca985b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-c1efd233edd2dc3def3cc4ed80ca985b.svg", "index-6376b8d8e58ada7a64287d47f76c52cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-6376b8d8e58ada7a64287d47f76c52cc.svg", "index-aaaf960bf1abc05cad99835b0de71e73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-aaaf960bf1abc05cad99835b0de71e73.svg", "index-8ca85481c73c725868c140ceae87375d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-8ca85481c73c725868c140ceae87375d.svg", "index-71f2162256cc91fd3db6ec8c62617525.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-71f2162256cc91fd3db6ec8c62617525.svg", "index-a51f1b8003c59cdae44993e805cd4865.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117572/index-a51f1b8003c59cdae44993e805cd4865.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона", "Первый закон термодинамики"], "sources": ["Демидова 2020"], "created_at": "2023-07-07T08:06:41Z", "updated_at": "2026-05-20T16:55:35Z"}, {"id": 65194, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">1 моль одноатомного идеального газа участвует в процессе 1-2-3, график которого изображён на рисунке в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-90e8ecf0497182a758d828cdc578cdb1.svg\"/>, где\n<img alt=\"p  \" class=\"math\" src=\"index-bc3f6d2271b5aa02cd9459632ea02f26.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-135d5025a1d74b7879e88fdf3f1cf8d9.svg\"/> – объём газа. Как изменяются плотность газа в ходе процесса 1-2 и абсолютная температура <img alt=\"T  \" class=\"math\" src=\"index-20c0fa095485b3009a55c477ea4c045e.svg\"/> газа в ходе\nпроцесса 2-3? Масса газа остаётся постоянной.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"447\" src=\"65194.png\" width=\"447\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|--------------------------|\n| П лотность газа  |А бсолю тная температура газа |\n|в ходе процесса 1-2---в ходе процесса 2- 3---|\n--------------------------------------------|\n\" class=\"math-display\" src=\"index-ecbd33ae36203a4df84d593097679690.svg\"/></div>", "solution_html": "<p class=\"noindent\">Формула плотности имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"   m\nρ= -V ,\n\" class=\"math-display\" src=\"index-9b47013cda4d006821400cff40eb68d8.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-51524549f74ef3244fefcebbcefd5551.svg\"/> – масса газа, <img alt=\"V  \" class=\"math\" src=\"index-96a9495aa6d4c6a76ac04998962e8efb.svg\"/> – объём газа.\n</p><p class=\"indent\">   Так как в процессе 1-2 объём уменьшается, то плотность увеличивается.\n</p><p class=\"indent\">   В процессе 2-3 объём постоянен, тогда по закону Шарля:\n</p> <div class=\"math-display\">\n<img alt=\"p-= const\nT\n\" class=\"math-display\" src=\"index-7454ea82f5073335e9ab04fd080a4ee6.svg\"/></div>\n<p class=\"indent\">   Так как давление уменьшается, то уменьшается и температура.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-90e8ecf0497182a758d828cdc578cdb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/index-90e8ecf0497182a758d828cdc578cdb1.svg", "index-bc3f6d2271b5aa02cd9459632ea02f26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/index-bc3f6d2271b5aa02cd9459632ea02f26.svg", "index-135d5025a1d74b7879e88fdf3f1cf8d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/index-135d5025a1d74b7879e88fdf3f1cf8d9.svg", "index-20c0fa095485b3009a55c477ea4c045e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/index-20c0fa095485b3009a55c477ea4c045e.svg", "65194.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/65194.png", "index-ecbd33ae36203a4df84d593097679690.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117868/index-ecbd33ae36203a4df84d593097679690.svg", "index-9b47013cda4d006821400cff40eb68d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117869/index-9b47013cda4d006821400cff40eb68d8.svg", "index-51524549f74ef3244fefcebbcefd5551.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117869/index-51524549f74ef3244fefcebbcefd5551.svg", "index-96a9495aa6d4c6a76ac04998962e8efb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117869/index-96a9495aa6d4c6a76ac04998962e8efb.svg", "index-7454ea82f5073335e9ab04fd080a4ee6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117869/index-7454ea82f5073335e9ab04fd080a4ee6.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2023-07-08T07:18:51Z", "updated_at": "2026-04-18T16:38:30Z"}, {"id": 20561, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках приведены графики А и Б двух процессов: 1-2 и 3-4, происходящих с 1 моль гелия. Графики построены в координатах\nV-T и p-V, где р – давление; <img alt=\"V  \" class=\"math\" src=\"index-df7a7af30a5fe9350948017b1282e2e8.svg\"/> – объём и <img alt=\"T  \" class=\"math\" src=\"index-5e0422a812b464ce00b3ade78bcb9b9d.svg\"/> – абсолютная температура газа. Установите соответствие между графиками и\nутверждениями, характеризующими изображённые на графиках процессы.<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"20561_1.png\" width=\"157\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-b9d7f3429dcf047fd82fe14cef562d4f.svg\"/></div>", "solution_html": "<p class=\"noindent\">На графике А изображен процесс с постоянным объемом и увеличивающейся температурой. На графике Б имеет место\nлинейная зависимость между давлением и объемом вида <img alt=\"p =αV  \" class=\"math\" src=\"index-6c1d3bf43f15972f14e4e9e67f950aa2.svg\"/>, где <img alt=\"α  \" class=\"math\" src=\"index-914df60f9b6dd09b519f2d07e6609178.svg\"/> – угловой коэффициент. Тогда из уравнения\nМенделеева-Клайперона для состояния газа в точках 3 и 4 имеем:\n</p> <div class=\"math-display\">\n<img alt=\"p3V3 = αV23 = νRT3.\n\" class=\"math-display\" src=\"index-28c179e20c3f2b983c6070a0dfd1b393.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"p4V4 = αV24 = νRT4\n\" class=\"math-display\" src=\"index-fe09616318724109384f06efe20dce3b.svg\"/></div>\n<p class=\"indent\">   И так как <img alt=\"V3 &gt; V4  \" class=\"math\" src=\"index-e4a43f175fa0e1ecb5eeb8dab6462457.svg\"/>, то температура <img alt=\"T3 &gt; T4  \" class=\"math\" src=\"index-38571ca6ce4d70338d8ef022714afe14.svg\"/>, то есть температура уменьшается.<br/>1) Над газом совершают работу, то есть объем газа должен уменьшаться. Внутренняя энергия газа увеличивается, значит,\nтемпература газа должна также увеличиваться. Этому не соответствует ни один из графиков.\n</p><p class=\"indent\">   2) Над газом совершают работу и газ отдаёт положительное количество теплоты. На рисунке Б видим, что при уменьшении\nобъема газа (над ним совершили работу) температура газа также уменьшается (он отдает тепло). Подходит.\n</p><p class=\"indent\">   3) Газ получает положительное количество теплоты, то есть его температура увеличивается, и газ совершает работу, то есть его\nобъем увеличивается. Этим условиям не соответствует ни один из графиков.\n</p><p class=\"indent\">   4) Газ получает положительное количество теплоты, то есть его температура увеличивается, при этом его внутренняя энергия\nувеличивается. Это график под буквой А.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-df7a7af30a5fe9350948017b1282e2e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39985/index-df7a7af30a5fe9350948017b1282e2e8.svg", "index-5e0422a812b464ce00b3ade78bcb9b9d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39985/index-5e0422a812b464ce00b3ade78bcb9b9d.svg", "20561_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39985/20561_1.png", "index-b9d7f3429dcf047fd82fe14cef562d4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39985/index-b9d7f3429dcf047fd82fe14cef562d4f.svg", "index-6c1d3bf43f15972f14e4e9e67f950aa2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-6c1d3bf43f15972f14e4e9e67f950aa2.svg", "index-914df60f9b6dd09b519f2d07e6609178.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-914df60f9b6dd09b519f2d07e6609178.svg", "index-28c179e20c3f2b983c6070a0dfd1b393.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-28c179e20c3f2b983c6070a0dfd1b393.svg", "index-fe09616318724109384f06efe20dce3b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-fe09616318724109384f06efe20dce3b.svg", "index-e4a43f175fa0e1ecb5eeb8dab6462457.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-e4a43f175fa0e1ecb5eeb8dab6462457.svg", "index-38571ca6ce4d70338d8ef022714afe14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39986/index-38571ca6ce4d70338d8ef022714afe14.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["Демоверсия 2015"], "created_at": "2022-02-26T18:25:18Z", "updated_at": "2026-07-03T09:16:55Z"}, {"id": 65214, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Установите соответствие между процессами, в которых участвует 1 моль одноатомного идеального газа, и физическими величинами\n(<img alt=\"ΔU  \" class=\"math\" src=\"index-cc9f64b66d41639b29929827f69c96ba.svg\"/> – изменение внутренней энергии; <img alt=\"A  \" class=\"math\" src=\"index-9de84f0c39371e1890a157250045b589.svg\"/> – работа газа), которые их характеризуют\n</p><p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"65214.png\" width=\"368\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия газа:\n</p> <div class=\"math-display\">\n<img alt=\"   3\nU = 2 νRT\n\" class=\"math-display\" src=\"index-643684402f720e628a7b1f132536c2cf.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-338cde7431f7a75390c7b433a308aaa0.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-ac05826497be7e383a3f041c09750a9e.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-e5bca6d4021b9c023a096716012e7001.svg\"/> — температура.\n</p><p class=\"indent\">   Запишем уравнение Менделеева-Клапейрона:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-056a26e2be71dba595dbdc0cfc9b8100.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-30e4293fd14968db811324789d526202.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-202a8ea575224463669c07510718d3ef.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-f7b57e7e92d1ff9d6050d51ae4730d77.svg\"/> — температура.\n</p><p class=\"indent\">   А) Температура уменьшается, значит, <img alt=\"ΔU &lt; 0  \" class=\"math\" src=\"index-cb58bb29a59464f8ed0c06aa3f1d9b29.svg\"/>. При этом из графика <img alt=\"p= αT  \" class=\"math\" src=\"index-00a0eb589552a782abb962f8c13ad2f8.svg\"/>.\n</p><p class=\"indent\">   Из уравнения Менделеева-Клапейрона\n</p> <div class=\"math-display\">\n<img alt=\"pV               αTV\n-T-= νR = const⇒  -T--= const⇒ V = const\n\" class=\"math-display\" src=\"index-511a8e5bf0b2653fde4253d6fcc3dd64.svg\"/></div>\n<p class=\"indent\">   Так как объём постоянен, то <img alt=\"A = 0  \" class=\"math\" src=\"index-81a09cae9ed189a5e6fb075ce28dcbe9.svg\"/>. А) – 1.\n</p><p class=\"indent\">   Б) По графику <img alt=\"p∼ V  \" class=\"math\" src=\"index-387f8ea2409b0dcf81b877d7d969e152.svg\"/>. Из уравнения Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-29306c2b668ff0056733ad41f8bf05d2.svg\"/></div>\n<p class=\"indent\">   Левая часть увеличивается, значит увеличивается и температура. <img alt=\"ΔT &gt; 0 ⇒ ΔU &gt; 0.  \" class=\"math\" src=\"index-97220fdefeb41cbd5274a2c7b080f316.svg\"/><br/>Работа газа зависит от <img alt=\"ΔV,  \" class=\"math\" src=\"index-550d4dc94cdd46aa0292d3fddd62b207.svg\"/> так как <img alt=\"ΔV &gt; 0,  \" class=\"math\" src=\"index-183d3270a42b63fcb3b1e3be283b35d6.svg\"/> то работа газа также положительная <img alt=\"(A &gt; 0)  \" class=\"math\" src=\"index-f0a61bd6a3f0988a5516e0739b7aa94f.svg\"/>, Б) – 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cc9f64b66d41639b29929827f69c96ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117908/index-cc9f64b66d41639b29929827f69c96ba.svg", "index-9de84f0c39371e1890a157250045b589.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117908/index-9de84f0c39371e1890a157250045b589.svg", "65214.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117908/65214.png", "index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117908/index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg", "index-643684402f720e628a7b1f132536c2cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-643684402f720e628a7b1f132536c2cf.svg", "index-338cde7431f7a75390c7b433a308aaa0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-338cde7431f7a75390c7b433a308aaa0.svg", "index-ac05826497be7e383a3f041c09750a9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-ac05826497be7e383a3f041c09750a9e.svg", "index-e5bca6d4021b9c023a096716012e7001.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-e5bca6d4021b9c023a096716012e7001.svg", "index-056a26e2be71dba595dbdc0cfc9b8100.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-056a26e2be71dba595dbdc0cfc9b8100.svg", "index-30e4293fd14968db811324789d526202.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-30e4293fd14968db811324789d526202.svg", "index-202a8ea575224463669c07510718d3ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117909/index-202a8ea575224463669c07510718d3ef.svg", "index-f
