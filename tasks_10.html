/GetSession/301831/index-c0b2586205dbd3d6c7d1641fb1438353.svg", "index-d39564cff34edef33ae8f3f2201673f1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-d39564cff34edef33ae8f3f2201673f1.svg", "index-e0a9d23f8c6bc889787789319d23686b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-e0a9d23f8c6bc889787789319d23686b.svg", "index-376b9d3e69dfe8768aa879444325ff46.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-376b9d3e69dfe8768aa879444325ff46.svg", "index-9a972cef14187a83bd92e6346dc7a808.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-9a972cef14187a83bd92e6346dc7a808.svg", "index-ce9ad79be9500872e29af0842c612903.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-ce9ad79be9500872e29af0842c612903.svg", "index-635b4e7dcb30e74dea25666db5d5d631.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-635b4e7dcb30e74dea25666db5d5d631.svg", "index-28dbafdc849bf2eb50a9cc6641d94e72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-28dbafdc849bf2eb50a9cc6641d94e72.svg", "index-449cc2b823294edc7f8823d46323fdea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-449cc2b823294edc7f8823d46323fdea.svg", "index-e99b29b1f0274ae675ad5313dadca331.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-e99b29b1f0274ae675ad5313dadca331.svg", "index-52f470fcda609ce7f7383979c1c0cda0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-52f470fcda609ce7f7383979c1c0cda0.svg", "index-5a4e74c1f513907583be420f3acabb1c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301831/index-5a4e74c1f513907583be420f3acabb1c.svg"}, "tags": ["СтатГрад ЕГЭ 14.12.2020 2 вариант"], "sources": ["СтатГрад ЕГЭ 14.12.2020 2 вариант"], "created_at": "2025-09-25T20:11:20Z", "updated_at": "2026-06-15T08:36:27Z"}, {"id": 143770, "name": "Задача на МКТ и термодинамику. Установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках А) и Б) приведены графики двух процессов 1–2 и 3–4, каждый из которых проводится с одним молем аргона.\nГрафики построены в координатах <img alt=\"p − V  \" class=\"math\" src=\"index-58fb556c01da81f1fa5b61304c53a019.svg\"/> и <img alt=\"V − T,  \" class=\"math\" src=\"index-360bd97d91a3ceafe572604e13bc5b20.svg\"/> где <img alt=\"p  \" class=\"math\" src=\"index-a544472f777069b86fed83f320b6de51.svg\"/> – давление, <img alt=\"V  \" class=\"math\" src=\"index-b48d45f10a9aba4cef2b866a02e84415.svg\"/> – объём и <img alt=\"T  \" class=\"math\" src=\"index-8d51830668a295e951e67efc3982a783.svg\"/> – абсолютная температура\nгаза. Установите соответствие между графиками и утверждениями, характеризующими изображённые на графиках\nпроцессы.<br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.<br/></p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"143770_1.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Запишем уравнение Менделеева-Клайперона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-e883d248326a194051db5cec315ad015.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-fbc0a14946078813a0163a19e784d211.svg\"/> - количество вещества;<br/><img alt=\"T  \" class=\"math\" src=\"index-18edc9e5ba332a4fb568bc8257a2c20f.svg\"/> - температура газа.<br/>Будем считать, что смещения на одну клетку по оси y равно <img alt=\"p0  \" class=\"math\" src=\"index-041d0ba62a982d905c002941d7629513.svg\"/>, а по x - <img alt=\"V0  \" class=\"math\" src=\"index-71f4da2b5ff4b3b6377a1567b4401cbc.svg\"/>. Работу можно найти как площадь под\nграфиком\n</p> <div class=\"math-display\">\n<img alt=\"A = p0+-4p0⋅3V0 = 7,5p0V0.\n       2\n\" class=\"math-display\" src=\"index-bc8f9666bad690713ade801d81c6996b.svg\"/></div>\n<p class=\"indent\">   Если провести изотермы через точки 1 и 2, то по тому, какая из изотерм лежит выше можно понять, где температура выше. В\nнашем случае <img alt=\"T1 &gt; T2  \" class=\"math\" src=\"index-07f417be10f33821b5a7a3c25d90321d.svg\"/>. Тогда в процессе внутренняя энергия уменьшается. По первому закону термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A.\n\" class=\"math-display\" src=\"index-e6de38cd31a6989c4f45a8d1a8a9f598.svg\"/></div>\n<p class=\"indent\">   Поскольку и работа, и изменение внутренней энергии отрицательны, то газ отдает теплоту.<br/>Б) Поскольку <img alt=\"V ∼ T  \" class=\"math\" src=\"index-087f535e589633bb6024f2598be1e920.svg\"/>, то по закону Гей-Люссака это изобарный процесс. Поскольку и объём, и температура увеличиваются,\nто работа газа и изменение внутренней энергии положительны. По первому закону термодинамикии газ получает\nтеплоту.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-58fb556c01da81f1fa5b61304c53a019.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-58fb556c01da81f1fa5b61304c53a019.svg", "index-360bd97d91a3ceafe572604e13bc5b20.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-360bd97d91a3ceafe572604e13bc5b20.svg", "index-a544472f777069b86fed83f320b6de51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-a544472f777069b86fed83f320b6de51.svg", "index-b48d45f10a9aba4cef2b866a02e84415.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-b48d45f10a9aba4cef2b866a02e84415.svg", "index-8d51830668a295e951e67efc3982a783.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-8d51830668a295e951e67efc3982a783.svg", "143770_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/143770_1.png", "index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302526/index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg", "index-e883d248326a194051db5cec315ad015.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-e883d248326a194051db5cec315ad015.svg", "index-fbc0a14946078813a0163a19e784d211.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-fbc0a14946078813a0163a19e784d211.svg", "index-18edc9e5ba332a4fb568bc8257a2c20f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-18edc9e5ba332a4fb568bc8257a2c20f.svg", "index-041d0ba62a982d905c002941d7629513.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-041d0ba62a982d905c002941d7629513.svg", "index-71f4da2b5ff4b3b6377a1567b4401cbc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-71f4da2b5ff4b3b6377a1567b4401cbc.svg", "index-bc8f9666bad690713ade801d81c6996b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-bc8f9666bad690713ade801d81c6996b.svg", "index-07f417be10f33821b5a7a3c25d90321d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-07f417be10f33821b5a7a3c25d90321d.svg", "index-e6de38cd31a6989c4f45a8d1a8a9f598.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-e6de38cd31a6989c4f45a8d1a8a9f598.svg", "index-087f535e589633bb6024f2598be1e920.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302527/index-087f535e589633bb6024f2598be1e920.svg"}, "tags": ["Статград 09.12.2022 Физика 2"], "sources": ["CтатГрад 09.12.2022 Физика 2"], "created_at": "2025-09-27T18:17:33Z", "updated_at": "2026-06-15T08:49:40Z"}, {"id": 146773, "name": "Задача на МКТ и термодинамику. Изменение величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">С одним молем идеального одноатомного газа последовательно проводят четыре различных циклических процесса, каждый\nраз измеряя совершённую за цикл работу и количество теплоты, отданное за цикл холодильнику. Этим процессам\nсоответствуют пронумерованные точки на диаграмме. Вдоль горизонтальной оси этой диаграммы откладываются КПД\nциклических процессов, а вдоль вертикальной оси – количества теплоты Q, полученной газом от нагревателя за один цикл.\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"136569.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">   Как изменится работа, совершённая газом за цикл, при переходе от цикла 3 к циклу 4? Как изменится модуль количества\nтеплоты, отдаваемой газом за цикл холодильнику, при переходе от цикла 1 к циклу 2?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины.<br/>Цифры в ответе могут повторяться.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------------------|-----------------------------------------------------------|\n|Работа газа за цикл при переходе от 3 к 4|Модуль количества теплоты, &amp;#x04\n|                                   |                                                           |\n-------------------------------------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-e2672221a7a0f8e77d50ee21d358567f.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Работу газа за цикл найдем из формулы <img alt=\"   A-\nη = Q  \" class=\"math\" src=\"index-cffadf36de57bc66540a41fa8129851a.svg\"/>, <img alt=\"A = ηQ  \" class=\"math\" src=\"index-295c37186c560593c5e159233947bbc1.svg\"/><br/>Найдем работу в первом и в четвертом цикле:\n</p> <div class=\"math-display\">\n<img alt=\"A3 = 0,5 ⋅103 =500 Дж\n\" class=\"math-display\" src=\"index-fd898f4355f2f1f69bb719887a547eff.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A4 = 0,6⋅5⋅103 = 3000 Д ж\n\" class=\"math-display\" src=\"index-aa8679afc232c8fe468737664739d2a0.svg\"/></div>\n<p class=\"indent\">   То есть, при переходе от цикла 3 к циклу 4 работа увеличивается.<br/>Б) Из формулы <img alt=\"      Q\nη = 1−-Qx  \" class=\"math\" src=\"index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg\"/> можем выразить количество теплоты, отданное холодильнику:\n</p> <div class=\"math-display\">\n<img alt=\"Qx = Q(1− η)\n\" class=\"math-display\" src=\"index-16cdad42a7946afed0134f5c716a294d.svg\"/></div>\n<p class=\"indent\">   Найдем количество теплоты, отданное холодильнику, при переходе от 1 цикла к 2:\n</p> <div class=\"math-display\">\n<img alt=\"Qx1 = 2⋅0,7 = 1,4 кДж\n\" class=\"math-display\" src=\"index-ca4938c9ffe8f66a2584ef2d59d1b9c9.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Qx2 = 4⋅0,6 = 2,4 кДж\n\" class=\"math-display\" src=\"index-4375d411f2f4cf6abaa21d5559da46cb.svg\"/></div>\n<p class=\"indent\">   То есть, при переходе от цикла 1 к циклу 2 количество теплоты уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"136569.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309643/136569.png", "index-e2672221a7a0f8e77d50ee21d358567f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309643/index-e2672221a7a0f8e77d50ee21d358567f.svg", "index-cffadf36de57bc66540a41fa8129851a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-cffadf36de57bc66540a41fa8129851a.svg", "index-295c37186c560593c5e159233947bbc1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-295c37186c560593c5e159233947bbc1.svg", "index-fd898f4355f2f1f69bb719887a547eff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-fd898f4355f2f1f69bb719887a547eff.svg", "index-aa8679afc232c8fe468737664739d2a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-aa8679afc232c8fe468737664739d2a0.svg", "index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg", "index-16cdad42a7946afed0134f5c716a294d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-16cdad42a7946afed0134f5c716a294d.svg", "index-ca4938c9ffe8f66a2584ef2d59d1b9c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-ca4938c9ffe8f66a2584ef2d59d1b9c9.svg", "index-4375d411f2f4cf6abaa21d5559da46cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309644/index-4375d411f2f4cf6abaa21d5559da46cb.svg"}, "tags": ["Статград 19.10.2021 Физика 2"], "sources": ["CтатГрад 19.10.2021 Физика 2"], "created_at": "2025-10-14T06:42:22Z", "updated_at": "2026-04-18T17:00:33Z"}, {"id": 155612, "name": "Статград 2.12 Вар 1 №10", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В процессе сжатия 1 моля разреженного неона его внутренняя энергия всё время остаётся неизменной. Как изменяются при этом\nдавление неона и концентрация его молекул?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|-------------------------|\n|Давление-неона-|К-онцентрация м-олекул-неона|\n|             |                         |\n-----------------------------------------\n\" class=\"math-display\" src=\"index-c0949004c3c0038a7cf1ca20a60b78a0.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT   (1)\n\" class=\"math-display\" src=\"index-820357ab91f079a58f3b796a9937c6ab.svg\"/></div>\n<p class=\"indent\">   Формула внутренней энергии идеального газа:\n</p> <div class=\"math-display\">\n<img alt=\"   3\nU = 2 νRT (2)\n\" class=\"math-display\" src=\"index-bc6d830e10a875acf2ed2e62a9130a5e.svg\"/></div>\n<p class=\"indent\">   Так как внутренняя энергия остаётся неизменной, значит температура неона тоже не меняется. Следовательно:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT = const⇒ p ∼ 1∕V\n\" class=\"math-display\" src=\"index-eb3e71d590dff48ae916fc82588f1f9b.svg\"/></div>\n<p class=\"indent\">   Получается, что при сжатии неона, его давление увеличивается.<br/>Концентрация молекул газа равна:\n</p> <div class=\"math-display\">\n<img alt=\"n = N-\n    V\n\" class=\"math-display\" src=\"index-9cd68915b55f6231adecc1c08415a4a3.svg\"/></div> <p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-e667ff70255082f8dbac64f3a477d9a9.svg\"/> - количество молекул, <img alt=\"V  \" class=\"math\" src=\"index-b0efdf6fd6e26d9b5e8981ccb7f998dc.svg\"/> - объём газа.<br/>Так как объём неона уменьшается, значит его концентрация увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c0949004c3c0038a7cf1ca20a60b78a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330827/index-c0949004c3c0038a7cf1ca20a60b78a0.svg", "index-820357ab91f079a58f3b796a9937c6ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-820357ab91f079a58f3b796a9937c6ab.svg", "index-bc6d830e10a875acf2ed2e62a9130a5e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-bc6d830e10a875acf2ed2e62a9130a5e.svg", "index-eb3e71d590dff48ae916fc82588f1f9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-eb3e71d590dff48ae916fc82588f1f9b.svg", "index-9cd68915b55f6231adecc1c08415a4a3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-9cd68915b55f6231adecc1c08415a4a3.svg", "index-e667ff70255082f8dbac64f3a477d9a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-e667ff70255082f8dbac64f3a477d9a9.svg", "index-b0efdf6fd6e26d9b5e8981ccb7f998dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330858/index-b0efdf6fd6e26d9b5e8981ccb7f998dc.svg"}, "tags": ["Уровень ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["СтатГрад 02.12.2025"], "created_at": "2025-12-02T06:30:10Z", "updated_at": "2026-04-18T17:01:01Z"}, {"id": 155753, "name": "Статград 2.12 Вар 2 №10", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В процессе расширения 1 моля разреженного гелия его внутренняя энергия всё время остаётся неизменной. Как изменяются при\nэтом температура гелия и его давление?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|--------------|\n|Температура-гелия-|Д-авление гелия|\n|                |              |\n---------------------------------\n\" class=\"math-display\" src=\"index-69a70c792554eb16a85d43cfe8dc72ce.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT   (1)\n\" class=\"math-display\" src=\"index-820357ab91f079a58f3b796a9937c6ab.svg\"/></div>\n<p class=\"indent\">   Формула внутренней энергии идеального газа:\n</p> <div class=\"math-display\">\n<img alt=\"   3\nU = 2 νRT (2)\n\" class=\"math-display\" src=\"index-bc6d830e10a875acf2ed2e62a9130a5e.svg\"/></div>\n<p class=\"indent\">   Так как внутренняя энергия остаётся неизменной, значит температура гелия тоже не меняется. Следовательно:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT = const⇒ p ∼ 1∕V\n\" class=\"math-display\" src=\"index-eb3e71d590dff48ae916fc82588f1f9b.svg\"/></div>\n<p class=\"indent\">   Получается, что при расширении гелия, его давление уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-69a70c792554eb16a85d43cfe8dc72ce.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331113/index-69a70c792554eb16a85d43cfe8dc72ce.svg", "index-820357ab91f079a58f3b796a9937c6ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331115/index-820357ab91f079a58f3b796a9937c6ab.svg", "index-bc6d830e10a875acf2ed2e62a9130a5e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331115/index-bc6d830e10a875acf2ed2e62a9130a5e.svg", "index-eb3e71d590dff48ae916fc82588f1f9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331115/index-eb3e71d590dff48ae916fc82588f1f9b.svg"}, "tags": ["Уровень ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["СтатГрад 02.12.2025"], "created_at": "2025-12-02T18:44:41Z", "updated_at": "2026-04-18T17:01:09Z"}, {"id": 175135, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">В вертикальном цилиндрическом сосуде под поршнем находится 1 моль аргона. Поршень не закреплён и может перемещаться в\nсосуде без трения (см. рисунок). В сосуд добавляют ещё 1 моль аргона. Как изменяются в результате этого давление газа и его\nплотность, если температура газа поддерживается постоянной? Для каждой величины определите соответствующий характер\nизменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14053.png\" width=\"157\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|--------------|\n|Давление газа|П-лотность-газа|\n|            |              |\n----------------------------\n\" class=\"math-display\" src=\"index-4a55a5f605740706923361eeab9d4709.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку поршень не закреплён, то условие равновесия для поршня выглядит так:\n</p> <div class=\"math-display\">\n<img alt=\"        mg\nP = P0 + S-\n\" class=\"math-display\" src=\"index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"P0  \" class=\"math\" src=\"index-7b8067163bf2651b1ed6f873865d1d32.svg\"/> - давление атмосферы, <img alt=\"mg\n-S-  \" class=\"math\" src=\"index-bed35293f79414b91b764265af6d1c4a.svg\"/> - давление на газ со стороны поршня. Так как эти величины не меняются, то и давление газа\n<img alt=\"P  \" class=\"math\" src=\"index-e48a5124169139be5379c75037f02f76.svg\"/> не изменится (ответ - 3).<br/>Б) По условию температура не изменяется. При постоянных давлении и температуре объем пропорционален массе газа (ур.\nМенделеева-Клапейрона: <img alt=\"     m-\npV = μ RT  \" class=\"math\" src=\"index-82f748395eba7fdaaf9c78050f2c584e.svg\"/>). Если масса газа увеличивается в два раза, то и объем увеличивается в два раза. Плотность\nпропорциональна массе и обратно пропорциональна объему <img alt=\"(ρ = m-)\n    V  \" class=\"math\" src=\"index-169948eb3a0ce6c1c0b784ecec5b3ff3.svg\"/>, значит, плотность газа не изменяется (ответ -\n3).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14053.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379725/14053.png", "index-4a55a5f605740706923361eeab9d4709.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379725/index-4a55a5f605740706923361eeab9d4709.svg", "index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg", "index-7b8067163bf2651b1ed6f873865d1d32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-7b8067163bf2651b1ed6f873865d1d32.svg", "index-bed35293f79414b91b764265af6d1c4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-bed35293f79414b91b764265af6d1c4a.svg", "index-e48a5124169139be5379c75037f02f76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-e48a5124169139be5379c75037f02f76.svg", "index-82f748395eba7fdaaf9c78050f2c584e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-82f748395eba7fdaaf9c78050f2c584e.svg", "index-169948eb3a0ce6c1c0b784ecec5b3ff3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379726/index-169948eb3a0ce6c1c0b784ecec5b3ff3.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГКР 954 Физика 26.03.2026"], "created_at": "2026-03-26T10:02:28Z", "updated_at": "2026-05-20T16:01:24Z"}, {"id": 14065, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">В сосуде неизменного объема находится идеальный газ. Часть газа выпускали из сосуда так, что давление оставалось неизменным.\nКак изменились при этом температура газа, оставшегося в сосуде, и его плотность? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|---------------|\n|Температура газа-Плотность газа|\n---------------------------------\n\" class=\"math-display\" src=\"index-bdb28b1b2b13e9258ba419e406fc01ba.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура газа — 1 <br/>1)Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-cfb4e78b25ad2fd407485a36bfe1c109.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-202bb1f9a5e5be79400fb8477a3e53b9.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-2b118245ba49aa63647eb06979ffce56.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-8f76e830b44b94cb2deccf6f12f03ed7.svg\"/> — количество вещества, <img alt=\"R  \" class=\"math\" src=\"index-57cbd30a89d38c4bdd57ffeabf7fa2c4.svg\"/> — универсальная газовая постоянная, <img alt=\"       T  \" class=\"math\" src=\"index-73254b5d12fafa23ee748a8c705cf87c.svg\"/>\n— абсолютная температура. <br/>Выразим температуру газа:\n</p> <div class=\"math-display\">\n<img alt=\"T = pV--\n    νR\n\" class=\"math-display\" src=\"index-24bb44fcc71503c04fe45114685530ab.svg\"/></div>\n<p class=\"indent\">   При уменьшении количества газа (<img alt=\"V = const  \" class=\"math\" src=\"index-34d8cd2fc2ab106a06dc2112784aad72.svg\"/>, <img alt=\"p= const  \" class=\"math\" src=\"index-3a1c2ee7e410672118d0d749bf0d06f0.svg\"/>) его температура увеличится.<br/><br/>Плотность — 2 <br/>2) Плотность газа:\n</p> <div class=\"math-display\">\n<img alt=\"ρ= m-,\n    V\n\" class=\"math-display\" src=\"index-c392627cbe7b7f91957581cf2f7437a8.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-749fc4a8ce1950640ac426cda4aab22f.svg\"/> — масса газа.<br/>Так как объем газа не изменяется, а его масса уменьшается, то плотность газа также уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bdb28b1b2b13e9258ba419e406fc01ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28323/index-bdb28b1b2b13e9258ba419e406fc01ba.svg", "index-cfb4e78b25ad2fd407485a36bfe1c109.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-cfb4e78b25ad2fd407485a36bfe1c109.svg", "index-202bb1f9a5e5be79400fb8477a3e53b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-202bb1f9a5e5be79400fb8477a3e53b9.svg", "index-2b118245ba49aa63647eb06979ffce56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-2b118245ba49aa63647eb06979ffce56.svg", "index-8f76e830b44b94cb2deccf6f12f03ed7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-8f76e830b44b94cb2deccf6f12f03ed7.svg", "index-57cbd30a89d38c4bdd57ffeabf7fa2c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-57cbd30a89d38c4bdd57ffeabf7fa2c4.svg", "index-73254b5d12fafa23ee748a8c705cf87c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-73254b5d12fafa23ee748a8c705cf87c.svg", "index-24bb44fcc71503c04fe45114685530ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-24bb44fcc71503c04fe45114685530ab.svg", "index-34d8cd2fc2ab106a06dc2112784aad72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-34d8cd2fc2ab106a06dc2112784aad72.svg", "index-3a1c2ee7e410672118d0d749bf0d06f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-3a1c2ee7e410672118d0d749bf0d06f0.svg", "index-c392627cbe7b7f91957581cf2f7437a8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-c392627cbe7b7f91957581cf2f7437a8.svg", "index-749fc4a8ce1950640ac426cda4aab22f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28324/index-749fc4a8ce1950640ac426cda4aab22f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:01:34Z", "updated_at": "2026-04-07T20:10:18Z"}, {"id": 110403, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находилась при комнатной температуре смесь двух идеальных газов, по 2 моль каждого.\nПоловину содержимого сосуда выпустили, а затем добавили в сосуде 1 моль второго газа. Температура в сосуде\nподдерживалась неизменной. Как изменились в результате парциальное давление первого газа и суммарное давление смеси\nгазов?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилось\n</p><p class=\"indent\">   2) уменьшилось\n</p><p class=\"indent\">   3) не изменилось\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|---------------|\n|Парциальное давление|Д авление см еси |\n|    первого газа     |     газов      |\n|-------------------|---------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-94e817d1c8445f3f34341f887955de5b.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-99b1bb3f1103af29670d00aff837769a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-9184266533a9e9c7417bd7f172083fbb.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-e40d9d1e9de84b7630b0f0f3670754a9.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-67e84213b69e240a582cfb1cc61c8db6.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-5af90d17cc2fc70af548942438d89dd2.svg\"/> — абсолютная температура.\n</p><p class=\"indent\">   Когда выпустили половину смеси, то количество первого газа уменьшилось, поэтому и парциальное давление первого газа\nуменьшилось.\n</p><p class=\"indent\">   Количество вещества в сосуде в итоге уменьшилось, следовательно, суммарное давление смеси газов уменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-94e817d1c8445f3f34341f887955de5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227406/index-94e817d1c8445f3f34341f887955de5b.svg", "index-99b1bb3f1103af29670d00aff837769a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-99b1bb3f1103af29670d00aff837769a.svg", "index-9184266533a9e9c7417bd7f172083fbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-9184266533a9e9c7417bd7f172083fbb.svg", "index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg", "index-e40d9d1e9de84b7630b0f0f3670754a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-e40d9d1e9de84b7630b0f0f3670754a9.svg", "index-67e84213b69e240a582cfb1cc61c8db6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-67e84213b69e240a582cfb1cc61c8db6.svg", "index-5af90d17cc2fc70af548942438d89dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/227409/index-5af90d17cc2fc70af548942438d89dd2.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Школково. Тренировочные задания"], "created_at": "2 aec627051c748c6c589baac39.svg\"/></div>\n<p class=\"indent\">   Т.к. число молекул в процессе постоянно и объём газа постоянен, то концентрация постоянна на процессе 1-2.<br/>Т.к. процесс 2-3 <img alt=\"V ∼T  \" class=\"math\" src=\"index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg\"/>, то по закону Гей-Люссака это изобарный процесс.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aa64dc908a0c342d9a95e91ae634ae50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-aa64dc908a0c342d9a95e91ae634ae50.svg", "index-74f51652de24d5a962e39634666f55b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-74f51652de24d5a962e39634666f55b9.svg", "index-67db464d12b3ead2240700a11c706b8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-67db464d12b3ead2240700a11c706b8b.svg", "index-5daa2d4e748c9ce2c41d14a00fed1a89.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-5daa2d4e748c9ce2c41d14a00fed1a89.svg", "index-813d8530e40dcf850c554b658b169d61.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-813d8530e40dcf850c554b658b169d61.svg", "103129 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/103129 (1).png", "index-939efc48601396e627080d3734b6b74c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433590/index-939efc48601396e627080d3734b6b74c.svg", "index-2c78f45aec627051c748c6c589baac39.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433591/index-2c78f45aec627051c748c6c589baac39.svg", "index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433591/index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T07:23:49Z", "updated_at": "2026-08-17T07:24:34Z"}, {"id": 168101, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 М =\"index-992399c8727610056d85ae72a629683c.svg\"/>), температура в его ходе увеличивается, следовательно, увеличивается и\nдавление.<br/>Концентрация вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"n=  N.\n    V\n\" class=\"math-display\" src=\"index-1f070eca2bb7d08ff91024e0534a37b2.svg\"/></div>\n<p class=\"indent\">   Т.к. число молекул в процессе постоянно, а объём в процессе 2-3 увеличивается, то концентрация уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aa64dc908a0c342d9a95e91ae634ae50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-aa64dc908a0c342d9a95e91ae634ae50.svg", "index-787a15f12850b651787f94575cc21e50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-787a15f12850b651787f94575cc21e50.svg", "index-a741447056e54677dd323090b9661ade.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-a741447056e54677dd323090b9661ade.svg", "index-18a019b8facad69843068ba9de1a2d80.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-18a019b8facad69843068ba9de1a2d80.svg", "index-1986d28e8b5802d6da2c8034a5351969.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-1986d28e8b5802d6da2c8034a5351969.svg", "103129 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/103129 (1).png", "index-90a984beb92f53c0ef7d308d666e379c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360415/index-90a984beb92f53c0ef7d308d666e379c.svg", "index-d773afda0015c859dd595b43cb4c55ee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360416/index-d773afda0015c859dd595b43cb4c55ee.svg", "index-992399c8727610056d85ae72a629683c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360416/index-992399c8727610056d85ae72a629683c.svg", "index-1f070eca2bb7d08ff91024e0534a37b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360416/index-1f070eca2bb7d08ff91024e0534a37b2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["ЕГЭ 2026 основная волна, Центр"], "created_at": "2026-02-08T22:18:48Z", "updated_at": "2026-06-14T14:25:09Z"}, {"id": 170678, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">В отсутствии теплопередачи газ, находящийся в сосуде с подвижным поршнем, сжали. Как в процессе сжатия изменились давление\nи температура газа.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|----------------|\n|Давление газа|Т-ем-пература газа\n------------------------------|\n\" class=\"math-display\" src=\"index-3ab8bd13539efbbdb9498ac6a69a0e14.svg\"/></div>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q = 0  \" class=\"math\" src=\"index-a90da0315fde57e17beb3943b8e2ad27.svg\"/> – количество теплоты, так как теплопередачи не было, процесс адиабатный, <img alt=\"     3\nΔU = 2νR ΔT  \" class=\"math\" src=\"index-75b538daecfe3bc090173fc1e92982c7.svg\"/> – изменение внутренней\nэнергии, <img alt=\"ΔT  \" class=\"math\" src=\"index-cf45b089aa0fe0eca32c7b72bd85d800.svg\"/> – изменение температуры, <img alt=\"A  \" class=\"math\" src=\"index-c226547047c99f7b11872f284177e949.svg\"/> – работа газа. Так как газ сжали, его объем уменьшился, а так как работа\nпропорциональна изменению объема, то <img alt=\"A &lt; 0.  \" class=\"math\" src=\"index-7274fadb12ace5893dfd21c2a6239172.svg\"/><br/>Тогда <img alt=\"− A =ΔU,  \" class=\"math\" src=\"index-9e50c934beffe5f8d339cf92b0586869.svg\"/> поскольку работа газа отрицательна, то изменение внутренней энергии положительно, следовательно, по\nформуле внутренней энергии температура газа растет – 1.<br/>Выразим давление из уравнения Клапейрона-Менделеева:\n</p> <div class=\"math-display\">\n<img alt=\"              νRT-\npV =νRT ⇒  p=  V\n\" class=\"math-display\" src=\"index-ced87c21526c94fe152f486924fcc553.svg\"/></div>\n<p class=\"indent\">   Так как температура растет и объем уменьшается, то давление также будет расти – 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3ab8bd13539efbbdb9498ac6a69a0e14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368033/index-3ab8bd13539efbbdb9498ac6a69a0e14.svg", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-bd94ff284644b2773b552a8c5529b561.svg", "index-a90da0315fde57e17beb3943b8e2ad27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-a90da0315fde57e17beb3943b8e2ad27.svg", "index-75b538daecfe3bc090173fc1e92982c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-75b538daecfe3bc090173fc1e92982c7.svg", "index-cf45b089aa0fe0eca32c7b72bd85d800.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-cf45b089aa0fe0eca32c7b72bd85d800.svg", "index-c226547047c99f7b11872f284177e949.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-c226547047c99f7b11872f284177e949.svg", "index-7274fadb12ace5893dfd21c2a6239172.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368034/index-7274fadb12ace5893dfd21c2a6239172.svg", "index-9e50c934beffe5f8d339cf92b0586869.svg": "https://3.shkolkovo.online/a re\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"14055.png\" width=\"526\"/> </p> </figure>\n<p class=\"indent\">   Запишите в таблицу выбранные цифры для каждого процесса в указанном порядке.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|---------|\n|-Процесс 1|П-роцесс-2|\n----------------------\n\" class=\"math-display\" src=\"index-42087af3da6b33c4f67df6fb6d768ce7.svg\"/></div>", "solution_html": "<p class=\"noindent\">Распишем, как должны выглядеть процессы в координатах <img alt=\"p − V  \" class=\"math\" src=\"index-7129a83f840b1a06557129b5df78345c.svg\"/>.<br/><br/>Процесс 1:<br/>Газ сначала нагревался при постоянном давлении, значит на графике это будет горизонтальная прямая. Потом его давление\nувеличивалось при постоянном объеме — это будет вертикальная прямая. Затем при постоянной температуре давление газа\nуменьшилось до первоначального значения — на графике это будет гипербола.<br/>Нам подходит первый вариант.<br/><br/>Процесс 2: <br/>Объем газа с давлением сначала увеличивались, значит на графике это прямая, направленная под углом к осям. Затем его объем\nуменьшался при постоянном давлении — на графике это будет горизонтальная прямая. Потом давление газа уменьшалось при\nпостоянном объеме – это будет вертикальная прямая.<br/>Нам подходит график 4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-14e15fa2ec020460e72ccf3c8359ea3e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28302/index-14e15fa2ec020460e72ccf3c8359ea3e.svg", "14055.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28302/14055.png", "index-42087af3da6b33c4f67df6fb6d768ce7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28302/index-42087af3da6b33c4f67df6fb6d768ce7.svg", "index-7129a83f840b1a06557129b5df78345c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28303/index-7129a83f840b1a06557129b5df78345c.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2021-12-10T08:53:34Z", "updated_at": "2026-04-21T20:03:34Z"}, {"id": 14056, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">Идеальный газ совершает два процесса. В процессе 1 газ сначала охлаждался при постоянном давлении, потом его давление\nуменьшалось при постоянном объеме, затем при постоянной температуре объем газа уменьшался до первоначального значения\nдавления. В процессе 2 температура газа уменьшалась при постоянном давлении, потом давление газа увеличивалось при\nпостоянном объеме, а затем температура газа оставалась неизменной при уменьшении давления. Какие из графиков в координатных\nосях <img alt=\"p − T  \" class=\"math\" src=\"index-f4fb9043e610637a68bd95ba7ea7ed90.svg\"/> соответствует этим изменениям состояния газа? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"14056.png\" width=\"526\"/></p></div>\n<p class=\"noindent\">Запишите в таблицу выбранные цифры для каждого процесса в указанном порядке.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|---------|\n| Процесс 1|П роцесс 2|\n|----------|---------|\n----------------------\n\" class=\"math-display\" src=\"index-d10962ba1fa716bfb73f12bbcba2eb03.svg\"/></div>", "solution_html": "<p class=\"noindent\">Распишем, как должны выглядеть процессы в координатах <img alt=\"p − T  \" class=\"math\" src=\"index-54936e52097a15bb5c488e4b9d55781a.svg\"/>.<br/><br/>Процесс 1:<br/>Газ сначала охлаждался при постоянном давлении — горизонтальная прямая. Потом его давление уменьшалось при постоянном\nобъеме — прямая, направленная под углом к осям. Затем при постоянной температуре объем газа уменьшился до первоначального\nзначения давления — вертикальная прямая. Нам подходит вариант 2.<br/><br/>Процесс 2: <br/>Температура газа уменьшалась при постоянном давлении — горизонтальная прямая. Потом давление газа увеличивалось при\nпостоянном объеме — прямая, направленная под углом к осям. А затем температура газа оставалась неизменной при уменьшении\nдавления — вертикальная прямая.<br/>Нам подходит вариант 3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f4fb9043e610637a68bd95ba7ea7ed90.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28304/index-f4fb9043e610637a68bd95ba7ea7ed90.svg", "14056.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28304/14056.png", "index-d10962ba1fa716bfb73f12bbcba2eb03.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28304/index-d10962ba1fa716bfb73f12bbcba2eb03.svg", "index-54936e52097a15bb5c488e4b9d55781a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28305/index-54936e52097a15bb5c488e4b9d55781a.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2021-12-10T08:54:40Z", "updated_at": "2026-04-28T14:23:30Z"}, {"id": 14057, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">Идеальный газ совершал два процесса. В процессе 1 газ сначала охлаждался при постоянном давлении, потом его давление\nуменьшалось при постоянном объеме, затем при увеличении температуры давление газа увеличилось до первоначального значения.\nВ процесс 2 сначала давление газа уменьшалось при постоянной температуре, потом газ расширялся при постоянном давлении,\nзатем увеличивал давление до первоначального, при постоянном объеме. Какие из графиков в координатных осях <img alt=\"p − V  \" class=\"math\" src=\"index-5bda832b2966ecd866712bf4aa8ab28c.svg\"/>\nсоответствует этим изменениям состояния газа? </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"14057.png\" width=\"526\"/> </p> </figure>\n<p class=\"indent\">   Запишите в таблицу выбранные цифры для каждого процесса в указанном порядке.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|---------|\n|-Процесс 1|П-роцесс-2|\n----------------------\n\" class=\"math-display\" src=\"index-42087af3da6b33c4f67df6fb6d768ce7.svg\"/></div>", "solution_html": "<p class=\"noindent\">Распишем, как должны выглядеть процессы в координатах <img alt=\"p − V  \" class=\"math\" src=\"index-7129a83f840b1a06557129b5df78345c.svg\"/>.<br/><br/>Процесс 1:<br/>Газ сначала охлаждался при постоянном давлении — горизонтальная прямая. Потом его давление уменьшалось при постоянном\nобъеме — вертикальня прямая. Затем при увеличении температуры давление газа увеличилось до первоначального значения —\nпрямая, направленная под углом к осям. <br/>Это график 4. <br/><br/>Процесс 2: <br/>Сначала давление газа уменьшалось при постоянной температуре — гипербола. Потом газ расширялся при постоянном давлении —\nгоризонтальная прямая. Затем увеличивал давление, до первоначального, при постоянном объеме — вертикальная\nпрямая.<br/>Таким образом, нам подходит вариант 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5bda832b2966ecd866712bf4aa8ab28c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28306/index-5bda832b2966ecd866712bf4aa8ab28c.svg", "14057.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28306/14057.png", "index-42087af3da6b33c4f67df6fb6d768ce7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28306/index-42087af3da6b33c4f67df6fb6d768ce7.svg", "index-7129a83f840b1a06557129b5df78345c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28307/index-7129a83f840b1a06557129b5df78345c.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": [], "created_at": "2021-12-10T08:55:24Z", "updated_at": "2026-04-21T20:04:09Z"}, {"id": 14058, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Молекулярно-кинетическая теория", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ совершает два процесса. В процессе 1 газ сначала нагревался при постоянном давлении, потом его\nдавление уменьшалось при постоянном объеме, затем при постоянной температуре давление газа увеличилось до первоначального\nзначения. В процессе 2 газ адиабатически расширялся, затем давление газа увеличивалось при постоянной температуре, а в конце\nтемпература газа увеличивалась при увеличении объема газа. Какие из графиков в координатных осях <img alt=\"p− T  \" class=\"math\" src=\"index-58b3302a5275be06788857b841b14090.svg\"/> соответствует этим\nизменениям состояния газа? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"f-ege-10-2-6.png\" width=\"526\"/></p></div>\n<p class=\"noindent\">Запишите в таблицу выбранные цифры для каждого процесса в указанном порядке.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|---------|\n| Процесс 1|П роцесс 2|\n|----------|---------|\n----------------------\n\" class=\"math-display\" src=\"index-d10962ba1fa716bfb73f12bbcba2eb03.svg\"/></div>", "solution_html": "<p class=\"noindent\">Распишем, как должны выглядеть процессы в координатах <img alt=\"p − T  \" class=\"math\" src=\"index-54936e52097a15bb5c488e4b9d55781a.svg\"/>.<br/><br/>Процесс 1:<br/>Газ сначала нагревался при постоянном давлении — горизонтальная прямая. Потом его давление уменьшалось при постоянном\nобъеме — прямая, направленная под углом к осям. Затем при постоянной температуре давление газа увеличилось до\nпервоначального значения — вертикальня прямая. <br/>Подходит график 1. <br/><br/>Процесс 2: <br/>Газ адиабатически расширялся. Если мы будем рассматривать в координатах <img alt=\"p− V,  \" class=\"math\" src=\"index-321198e5410aaedfed6ab9eed8864836.svg\"/> то график представляет из себя гиперболу,\nпричем наклон больше, чем у изотермического процесса, который подчиняется закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const\n\" class=\"math-display\" src=\"index-83fa12ffa602f4a917025e989b5b72d1.svg\"/></div>\n<p class=\"indent\">   То есть зависимость имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"    α-\np=  V ,\n\" class=\"math-display\" src=\"index-8a918bdfdb15ec8a4f6322d274572a9c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-198d170c928719d45d2f2fb22fb8fcb1.svg\"/> – постоянный коэффициент. <br/>Можно сделать вывод, что у адиабатного процесса зависимоть будет иметь тот же вид, но объем в какой-то степени <img alt=\"γ &gt; 1:  \" class=\"math\" src=\"index-155fc170f38dd5d17bf8b762f9e783cf.svg\"/> Тогда\nмы можем записать уравнение для адиабаты: <br/>\n</p> <div class=\"math-display\">\n<img alt=\"pVγ = const\n\" class=\"math-display\" src=\"index-a6e2c34c5d07d1e43d948b8570a8f078.svg\"/></div>\n<p class=\"indent\">   Запишем уравнение Менделеева-Клапейрона:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-269093794cc99dc5ebafc51d0fe41f8a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"νR  \" class=\"math\" src=\"index-47a90cac1e608a7e179a34a8b5237a9d.svg\"/> – постоянные величины. А значит можем переписать следующим образом:\n</p> <div class=\"math-display\">\n<img alt=\"pV\n-T-= const\n\" class=\"math-display\" src=\"index-d11674bea5987eab13fecc293cecbe98.svg\"/></div p∼ T2 .\n\" class=\"math-display\" src=\"index-3ac1df00335e76806812bf885054886f.svg\"/></div>\n<p class=\"indent\">   Затем давление газа увеличивалось при постоянной температуре — вертикальная прямая. А в конце температура газа\nувеличивалась при увеличении объема газа — горизонтальная прямая. <br/>Таким образом, подходит график 4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-58b3302a5275be06788857b841b14090.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28308/index-58b3302a5275be06788857b841b14090.svg", "f-ege-10-2-6.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28308/f-ege-10-2-6.png", "index-d10962ba1fa716bfb73f12bbcba2eb03.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28308/index-d10962ba1fa716bfb73f12bbcba2eb03.svg", "index-54936e52097a15bb5c488e4b9d55781a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-54936e52097a15bb5c488e4b9d55781a.svg", "index-321198e5410aaedfed6ab9eed8864836.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-321198e5410aaedfed6ab9eed8864836.svg", "index-83fa12ffa602f4a917025e989b5b72d1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-83fa12ffa602f4a917025e989b5b72d1.svg", "index-8a918bdfdb15ec8a4f6322d274572a9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-8a918bdfdb15ec8a4f6322d274572a9c.svg", "index-198d170c928719d45d2f2fb22fb8fcb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-198d170c928719d45d2f2fb22fb8fcb1.svg", "index-155fc170f38dd5d17bf8b762f9e783cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-155fc170f38dd5d17bf8b762f9e783cf.svg", "index-a6e2c34c5d07d1e43d948b8570a8f078.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-a6e2c34c5d07d1e43d948b8570a8f078.svg", "index-269093794cc99dc5ebafc51d0fe41f8a.svg": "https://3.shkolkovo.online/api/late vg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28309/index-3ac1df00335e76806812bf885054886f.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": [], "created_at": "2021-12-10T08:56:09Z", "updated_at": "2026-04-29T05:06:46Z"}, {"id": 168618, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-6e2444f1288077ea1c3313a11df67df6.svg\"/> – внутренняя энергия\nгаза; <img alt=\"V  \" class=\"math\" src=\"index-05b1bf4d3fcf42e723952cfdc8fa5172.svg\"/> – занимаемый им объем). Как изменяются в ходе этого процесса давление и абсолютная температура газа?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"168618.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|--------------------------|\n|-Давление газа-Абсолютная температура газа\n------------------------------------------\n\" class=\"math-display\" src=\"index-9fe258f5dd3c7a540c757d81fa56049c.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия идеального одноатомного газа определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT,\n\" class=\"math-display\" src=\"index-0bcc2eaa68667b39daacc812403b7861.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"R  \" class=\"math\" src=\"index-30c7e0ae88b0ee7f56fbc01f64733c51.svg\"/> – универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-5b64947b52547240eb97b894c9c51a99.svg\"/> – абсолютная температура газа. <br/>При уменьшении внутренней энергии газа его абсолютная температура уменьшается. Для идеального газа справедливо уравнение\nМенделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-c2e85273a84ad98aa50d6a7c745ed866.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-7319bfe63349c89a45f034ba3235bf87.svg\"/> – давление газа, <img alt=\"nu  \" class=\"math\" src=\"index-449e7d7b57576fe1c614031b932bc446.svg\"/> – количество вещества газа. <br/>Тогда мы можем записать внутреннюю энергию как функцию от занимаемого газом объема <img alt=\"V  \" class=\"math\" src=\"index-8a1d55b199d4ee0ec9b86cfadaca033d.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2pV.\n\" class=\"math-display\" src=\"index-ba2506e58e869b1bba13c447f0c9fe74.svg\"/></div>\n<p class=\"indent\">   Мы получили зависимость между внутреннней энергией газа и его объемом как прямую пропорциональность, в таком случае\nпроцесс получается изобарным, давление не изменяется. <br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6e2444f1288077ea1c3313a11df67df6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361973/index-6e2444f1288077ea1c3313a11df67df6.svg", "index-05b1bf4d3fcf42e723952cfdc8fa5172.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361973/index-05b1bf4d3fcf42e723952cfdc8fa5172.svg", "168618.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361973/168618.png", "index-9fe258f5dd3c7a540c757d81fa56049c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361973/index-9fe258f5dd3c7a540c757d81fa56049c.svg", "index-0bcc2eaa68667b39daacc812403b7861.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-0bcc2eaa68667b39daacc812403b7861.svg", "index-30c7e0ae88b0ee7f56fbc01f64733c51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-30c7e0ae88b0ee7f56fbc01f64733c51.svg", "index-5b64947b52547240eb97b894c9c51a99.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-5b64947b52547240eb97b894c9c51a99.svg", "index-c2e85273a84ad98aa50d6a7c745ed866.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-c2e85273a84ad98aa50d6a7c745ed866.svg", "index-7319bfe63349c89a45f034ba3235bf87.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-7319bfe63349c89a45f034ba3235bf87.svg", "index-449e7d7b57576fe1c614031b932bc446.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-449e7d7b57576fe1c614031b932bc446.svg", "index-8a1d55b199d4ee0ec9b86cfadaca033d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-8a1d55b199d4ee0ec9b86cfadaca033d.svg", "index-ba2506e58e869b1bba13c447f0c9fe74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361974/index-ba2506e58e869b1bba13c447f0c9fe74.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа"], "sources": [], "created_at": "2026-02-12T19:27:43Z", "updated_at": "2026-04-07T20:26:30Z"}, {"id": 14073, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Некоторая масса идеального газа переведена из состояния 2 в состояние 1. Как изменялся объем газа и его внутренняя энергия в\nэтом процессе? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14073.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|------------------|\n|Объем-газа-|Внутренняя энергия|\n------------------------------|\n\" class=\"math-display\" src=\"index-65086daa91bc984abc043b90f735be40.svg\"/></div>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14073.1.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Объем газа — 1 <br/>1) Проведем две изохоры через точку 1 и 2. Чем положение изохоры на графике в <img alt=\"pT  \" class=\"math\" src=\"index-1a4a96544943a1966deb6bb1e6c1b065.svg\"/> — координатах ниже, тем больше объем газа.\nЗначит, объем в процессе 2-1 увеличился.<br/><br/>Внутренняя энергия — 2 <br/>2) Внутренняя энергия газа находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT,\n\" class=\"math-display\" src=\"index-e4adbfed6d610eaa7323dfce78a5e2b3.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-02a2a510e30164136985d9f3e55b332a.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-aec66ff26da19b4b4bbfdb05da5711a7.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-73a72cc990231f3fe03d282b7edf7633.svg\"/> — абсолютная температура\nгаза.<br/>Так как температура газа в процессе 2-1 уменьшилась, то и внутренняя энергия также уменьшилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14073.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28339/14073.png", "index-65086daa91bc984abc043b90f735be40.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28339/index-65086daa91bc984abc043b90f735be40.svg", "14073.1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/14073.1.png", "index-1a4a96544943a1966deb6bb1e6c1b065.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/index-1a4a96544943a1966deb6bb1e6c1b065.svg", "index-e4adbfed6d610eaa7323dfce78a5e2b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/index-e4adbfed6d610eaa7323dfce78a5e2b3.svg", "index-02a2a510e30164136985d9f3e55b332a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/index-02a2a510e30164136985d9f3e55b332a.svg", "index-aec66ff26da19b4b4bbfdb05da5711a7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/index-aec66ff26da19b4b4bbfdb05da5711a7.svg", "index-73a72cc990231f3fe03d282b7edf7633.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28340/index-73a72cc990231f3fe03d282b7edf7633.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": [], "created_at": "2021-12-10T09:19:33Z", "updated_at": "2026-05-20T16:53:10Z"}, {"id": 177707, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия) -> Термодинамика", "question_html": "<p class=\"noindent\">Некоторая масса идеального газа переведена из состояния 2 в состояние 1. Как изменялись концентрация молекул газа и их средняя\nкинетическая энергия хаотического движения в этом процессе? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14073.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------|----------------------------------------------|\n|Концентрация молекул газа|Средняя кинетическая энергия хаот&amp;#x0\n|------------------------|-----------------молекул газа-----------------|\n------------------------------------------------------------------------|\n\" class=\"math-display\" src=\"index-4ad1f904ea2f1af797b4f0fea6f07c9d.svg\"/></div>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14073.1.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Концентрация газа — 2 <br/>1) Проведем две изохоры через точку 1 и 2. Чем положение изохоры на графике в <img alt=\"pT  \" class=\"math\" src=\"index-1a4a96544943a1966deb6bb1e6c1b065.svg\"/> — координатах ниже, тем больше объем газа.\nЗначит, объем в процессе 2-1 увеличился, значит, концентрация <img alt=\"(n = N-)\n    V  \" class=\"math\" src=\"index-71a8edf702dd9d74f0e6a1bd2928353a.svg\"/> уменьшилась.<br/><br/>Средняя кинетическая энергия хаотического движения — 2 <br/>2) Среднюю кинетическую энергию можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nEk = 2kT,\n\" class=\"math-display\" src=\"index-7f58543320fa7e27faa9d4b5b2de8ace.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-61a3eaa97651c77a1ba3c5dd22a29772.svg\"/> — постоянная Больцмана, <img alt=\"T  \" class=\"math\" src=\"index-17ae7d2467b77aeb943e67f148817840.svg\"/> — абсолютная температура газа.<br/>Так как температура газа в процессе 2-1 уменьшилась, то и <img alt=\"Ek  \" class=\"math\" src=\"index-427159176cae771cc6b191d45b92da1f.svg\"/> также уменьшилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14073.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387151/14073.png", "index-4ad1f904ea2f1af797b4f0fea6f07c9d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387151/index-4ad1f904ea2f1af797b4f0fea6f07c9d.svg", "14073.1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387152/14073.1.pn
