olkovo.online/api/latex-service/v1/GetSession/387158/index-5c604531d73427dbd1e926e6162b76e1.svg", "145535.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387158/145535.png", "index-54b20f3f6ae63b6965f187bd5abc73dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387158/index-54b20f3f6ae63b6965f187bd5abc73dd.svg", "index-d773afda0015c859dd595b43cb4c55ee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-d773afda0015c859dd595b43cb4c55ee.svg", "index-35f6209b70b96c79f537d781bfdd5545.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-35f6209b70b96c79f537d781bfdd5545.svg", "index-ebc0e0a2d98d4b0613a91a707fcb3e4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-ebc0e0a2d98d4b0613a91a707fcb3e4f.svg", "index-e4bdfa2290cfd4cb5e4969bed3d149fa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-e4bdfa2290cfd4cb5e4969bed3d149fa.svg", "index-d858f910c9480f9b7b1b74a35c120e89.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-d858f910c9480f9b7b1b74a35c120e89.svg", "index-bab165249baa1bca17acfd0d71e3f43a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-bab165249baa1bca17acfd0d71e3f43a.svg", "index-29382ed0c3ea0a240b6090f37fe915fe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-29382ed0c3ea0a240b6090f37fe915fe.svg", "index-909733684c30b1e784573ce107f8e9bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-909733684c30b1e784573ce107f8e9bd.svg", "index-3db5a0e6a089a751ceed6b23d7086810.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-3db5a0e6a089a751ceed6b23d7086810.svg", "index-e1ca34be308b6d8036c86edc07f5c8d6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387159/index-e1ca34be308b6d8036c86edc07f5c8d6.svg"}, "tags": [], "sources": ["Демидова 2026"], "created_at": "2026-04-12T19:59:25Z", "updated_at": "2026-04-28T11:40:23Z"}, {"id": 14083, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В стеклянном сосуде находится небольшое количество воды и некоторое количество водяного пара. Как изменится масса воды и\nплотность водяного пара при увеличении температуры? Считать, что в процессе эксперимента в сосуде всегда остается немного воды\nв жидком состоянии.<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|----------------------|\n|Масса воды|П-лотность водяного пара\n-----------------------------------\n\" class=\"math-display\" src=\"index-ea4e1e4a41f97af088fe59f14097881d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Относительная влажность водяных паров определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"     ρ\nφ = ρн.п.,\n\" class=\"math-display\" src=\"index-927f08c59a4b4bd61fe250d42b4220b6.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ρ  \" class=\"math\" src=\"index-db086b9433a3f391c52b2ac8f35446e0.svg\"/> – плотность водяных паров при заданной температуре, <img alt=\"ρн.п.  \" class=\"math\" src=\"index-cde4f7bfd5ecc46ec7178745528a8971.svg\"/> – плотность насыщенных водяных паров при той же\nтемпературе. <br/>Плотность насыщенных водяных паров <img alt=\"ρ\n н.п.  \" class=\"math\" src=\"index-015de235add8d7aea8e1e41da9f3d06f.svg\"/> является функцией только температуры, следовательно, при увеличении\nтемпературы она будет расти. Получается, относительная влажность <img alt=\"φ  \" class=\"math\" src=\"index-33470e427e4ac07e1eb22bc8bcf75135.svg\"/> должна была бы уменьшаться в такой ситуации.\n<br/>В нашем же случае водяной пар находится в герметично закрытом сосуде постоянного объема вместе с водой, то есть он в самом\nначале уже насыщенный и находится в динамическом равновесии с водой. При увеличении температуры это равновесие будет\nнарушаться, но система все равно будет стремиться к новому состоянию равновесия. <br/>Увеличение температуры приводит к увеличению кинетической энергии молекул. В таком случае, скорость испарения воды будет\nпревышать скорость конденсации паров, то есть масса воды будет уменьшаться. Это будет приводить к тому, что система\nснова будет находиться в состоянии равновесия, но все это будет происходить до тех пор, пока в сосуде есть вода.\n<br/>Так как водяные пары находятся в закрытом сосуде постоянного объема, то и объем, который занимают водяные пары, будет\nпостоянен. Плотность паров определяется по формуле: <img alt=\"    m-\nρ = V  \" class=\"math\" src=\"index-24785b42ee3daf0d19888d5a955f5e8f.svg\"/>, где <img alt=\"m  \" class=\"math\" src=\"index-e8b6212a8023e49bd039194d3a67d32c.svg\"/> – масса водяных паров, <img alt=\"V  \" class=\"math\" src=\"index-4909439bc8e239541aa2eb19260f70e3.svg\"/> – объем, занимаемый водяными\nпарами. Выше было сказано, что масса воды будет уменьшаться из-за увеличения испарения воды при росте температуры,\nследовательно, масса водяных паров <img alt=\"m  \" class=\"math\" src=\"index-685eb08ba3674fc1e9cf677406cd1d02.svg\"/> будет расти. Так как объем <img alt=\"V = const  \" class=\"math\" src=\"index-beb38fc19b15b51d32557bf2736ffb3d.svg\"/>, то плотность водяных паров <img alt=\"ρ  \" class=\"math\" src=\"index-449279032a14b65e107efbd0419ad924.svg\"/> будет\nрасти.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ea4e1e4a41f97af088fe59f14097881d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28359/index-ea4e1e4a41f97af088fe59f14097881d.svg", "index-927f08c59a4b4bd61fe250d42b4220b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-927f08c59a4b4bd61fe250d42b4220b6.svg", "index-db086b9433a3f391c52b2ac8f35446e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-db086b9433a3f391c52b2ac8f35446e0.svg", "index-cde4f7bfd5ecc46ec7178745528a8971.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-cde4f7bfd5ecc46ec7178745528a8971.svg", "index-015de235add8d7aea8e1e41da9f3d06f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-015de235add8d7aea8e1e41da9f3d06f.svg", "index-33470e427e4ac07e1eb22bc8bcf75135.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-33470e427e4ac07e1eb22bc8bcf75135.svg", "index-24785b42ee3daf0d19888d5a955f5e8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-24785b42ee3daf0d19888d5a955f5e8f.svg", "index-e8b6212a8023e49bd039194d3a67d32c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-e8b6212a8023e49bd039194d3a67d32c.svg", "index-4909439bc8e239541aa2eb19260f70e3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-4909439bc8e239541aa2eb19260f70e3.svg", "index-685eb08ba3674fc1e9cf677406cd1d02.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-685eb08ba3674fc1e9cf677406cd1d02.svg", "index-beb38fc19b15b51d32557bf2736ffb3d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-beb38fc19b15b51d32557bf2736ffb3d.svg", "index-449279032a14b65e107efbd0419ad924.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28360/index-449279032a14b65e107efbd0419ad924.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Свойства паров. Влажность"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:34:35Z", "updated_at": "2026-05-20T17:18:34Z"}, {"id": 119088, "name": "МКТ. Термодинамика. Первая часть.", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Объём сосуда с идеальным газом уменьшили вдвое, выпустив половину газа и поддерживая температуру в сосуде постоянной. Как\nизменились при этом давление газа в сосуде и его внутренняя энергия?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в ответ выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|-----------------------------|\n|Давление газа-в сосуде|В-нутренняя-энергия-газа в-сосуде\n---------------------------------------------------\n\" class=\"math-display\" src=\"index-ce1eb34a6d30af1d0a908e37332d41de.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура постоянна <img alt=\"T = const  \" class=\"math\" src=\"index-b1ba7bc0c34449085f267dafbc800131.svg\"/>, объём газа уменьшился в 2 раза, количество вещества уменьшилось в 2 раза.<br/>Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-c4f1e53a17b748ebc41f5a0665416dd2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-d34d6445ee5837ae2ffc9f475764733b.svg\"/> — количество вещества, <img alt=\"T  \" class=\"math\" src=\"index-a4c04978be1264c3c9a9f403e9cb8328.svg\"/> — температура в Кельвинах, <img alt=\"p  \" class=\"math\" src=\"index-398efcfa6925610097ba664047ada5e5.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-4d86d64bdcd005f0ced0c0d9479950a1.svg\"/> — объем, занимаемый газом, <img alt=\"R  \" class=\"math\" src=\"index-bdf608355743a3fc07ba68f3b2e8b374.svg\"/> —\nуниверсальная газовая постоянная.<br/>Давление газа будет постоянно.<br/>Внутренняя энергия равна\n</p> <div class=\"math-display\">\n<img alt=\"U = 3νRT,\n    2\n\" class=\"math-display\" src=\"index-8f1c1bce580f1ff9cef8283aadfad103.svg\"/></div>\n<p class=\"indent\">   так как количество вещества уменьшается в 2 раза, то внутренняя энергия уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ce1eb34a6d30af1d0a908e37332d41de.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244445/index-ce1eb34a6d30af1d0a908e37332d41de.svg", "index-b1ba7bc0c34449085f267dafbc800131.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-b1ba7bc0c34449085f267dafbc800131.svg", "index-c4f1e53a17b748ebc41f5a0665416dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-c4f1e53a17b748ebc41f5a0665416dd2.svg", "index-d34d6445ee5837ae2ffc9f475764733b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-d34d6445ee5837ae2ffc9f475764733b.svg", "index-a4c04978be1264c3c9a9f403e9cb8328.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-a4c04978be1264c3c9a9f403e9cb8328.svg", "index-398efcfa6925610097ba664047ada5e5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-398efcfa6925610097ba664047ada5e5.svg", "index-4d86d64bdcd005f0ced0c0d9479950a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-4d86d64bdcd005f0ced0c0d9479950a1.svg", "index-bdf608355743a3fc07ba68f3b2e8b374.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-bdf608355743a3fc07ba68f3b2e8b374.svg", "index-8f1c1bce580f1ff9cef8283aadfad103.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244446/index-8f1c1bce580f1ff9cef8283aadfad103.svg"}, "tags": ["Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["Демоверсия 2015"], "created_at": "2025-04-20T08:13:41Z", "updated_at": "2026-04-18T16:31:00Z"}, {"id": 64487, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится твёрдое вещество массой <img alt=\"m  \" class=\"math\" src=\"index-291ec806b989e874c3e5915434578134.svg\"/>. Цилиндр поместили в печь. На рисунке схематично\nпоказан график изменения температуры <img alt=\"t  \" class=\"math\" src=\"index-77530e90da7d782d8f417246331dd302.svg\"/> вещества по мере поглощения им количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-a441f0da4b90b7e79497e94e0bf0443e.svg\"/>. Формулы А\nИ Б позволяют рассчитать значения физических величин, характеризующих происходящее с вещество тепловые\nпроцессы.\n</p><p class=\"indent\">   Установите соответствие между физическими формулами и физическими величинами, значение которых можно рассчитать по\nэтим формулам. К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные\nцифры под соответствующими буквами. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"236\" src=\"f-12-4-pict2.png\" width=\"236\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\" ФО РМ УЛЫ   ФИ ЗИЧЕ СКИ Е В ЕЛИ ЧИН Ы\n А) ΔQm2      1) Удельная теплоём кость жидкости\n             2)удельная теплота плавления\nБ ) ΔQ3-     3) Удельная теплоём кость твердого вещества\n   m Δt2\n             4) Удельная теплота парообразования\n\" class=\"math-display\" src=\"index-aebd3731429d1bb425916e2c928f7168.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-4d345222b4ddaf784380df5a40205a30.svg\"/></div>", "solution_html": "<p class=\"noindent\"><img alt=\"ΔQ1  \" class=\"math\" src=\"index-18b6836f401d0e68c26a36e0613319d4.svg\"/> – это количество теплоты, полученное телом при нагреве, <img alt=\"ΔQ2  \" class=\"math\" src=\"index-d3955a4f558bf77403f19fc3b07b9590.svg\"/> – количество вещества, полученное при плавлении, <img alt=\"ΔQ3  \" class=\"math\" src=\"index-61d12f4a6624226022e3be9fb5035357.svg\"/> –\nколичество вещества, полученное при нагреве жидкого вещества, <img alt=\"ΔQ4  \" class=\"math\" src=\"index-aaafed1d804b17c5fc2c78f02f4b83f1.svg\"/> – количество теплоты, необходимое для парообразования,\n<img alt=\"ΔQ5  \" class=\"math\" src=\"index-ab6e0760a659158c90b94783388c3ddc.svg\"/> – количество вещества, полученное при нагреве парообразного вещества.<br/>А) <img alt=\"ΔQ2  \" class=\"math\" src=\"index-1ded91fd83c19be49646c609a28106a2.svg\"/> – количество вещества, полученное при плавлении, значит, по этой формуле определяют удельную теплоту плавления А –\n2.<br/>Б) <img alt=\"ΔQ3  \" class=\"math\" src=\"index-529a48e2b280cde304f32a297ffc5b94.svg\"/> – количество вещества, полученное при нагреве жидкого вещества, значит, по этой формуле определяют удельную\nтеплоемкость жидкости Б – 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-291ec806b989e874c3e5915434578134.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/index-291ec806b989e874c3e5915434578134.svg", "index-77530e90da7d782d8f417246331dd302.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/index-77530e90da7d782d8f417246331dd302.svg", "index-a441f0da4b90b7e79497e94e0bf0443e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/index-a441f0da4b90b7e79497e94e0bf0443e.svg", "f-12-4-pict2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/f-12-4-pict2.png", "index-aebd3731429d1bb425916e2c928f7168.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/index-aebd3731429d1bb425916e2c928f7168.svg", "index-4d345222b4ddaf784380df5a40205a30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116496/index-4d345222b4ddaf784380df5a40205a30.svg", "index-18b6836f401d0e68c26a36e0613319d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-18b6836f401d0e68c26a36e0613319d4.svg", "index-d3955a4f558bf77403f19fc3b07b9590.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-d3955a4f558bf77403f19fc3b07b9590.svg", "index-61d12f4a6624226022e3be9fb5035357.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-61d12f4a6624226022e3be9fb5035357.svg", "index-aaafed1d804b17c5fc2c78f02f4b83f1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-aaafed1d804b17c5fc2c78f02f4b83f1.svg", "index-ab6e0760a659158c90b94783388c3ddc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-ab6e0760a659158c90b94783388c3ddc.svg", "index-1ded91fd83c19be49646c609a28106a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-1ded91fd83c19be49646c609a28106a2.svg", "index-529a48e2b280cde304f32a297ffc5b94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116497/index-529a48e2b280cde304f32a297ffc5b94.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["досрок 2023"], "created_at": "2023-06-26T07:35:50Z", "updated_at": "2026-05-09T13:51:25Z"}, {"id": 169651, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Со дна равномерно прогретого водоёма медленно поднимается пузырёк воздуха. Как изменяются при подъёме давление воздуха в\nпузырьке и средняя кинетическая энергия теплового движения молекул воздуха в пузырьке? Испарением воды внутрь пузырька\nпренебречь. <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличивается <br/>2) уменьшается <br/>3) не изменяется <br/>Запишите в таблицу выбранные цифры для каждой физической величины. <br/>Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|--------------------------|\n|Д авление воздуха в пузы рьке|С редняя кинетическая энергия\n|                         |     теплового движения    |\n|                         | м олекул воздуха в пузырьке|\n|-------------------------|--------------------------|\n------------------------------------------------------\n\" class=\"math-display\" src=\"index-44f0d9317dd8c7991f4c1e378a8c5032.svg\"/></div>", "solution_html": "<p class=\"noindent\">Давление внутри пузырька <img alt=\"p  \" class=\"math\" src=\"index-d2d6b3ea59f2e36a020b496f18f92f9f.svg\"/> уравновешивается атмосферным давлением <img alt=\"pатм  \" class=\"math\" src=\"index-c0e22ba3179c3e691e5075e933084a13.svg\"/> и гидростатическим давлением <img alt=\"pгидро =ρgh  \" class=\"math\" src=\"index-e27526ebfcabca27af834c578106d771.svg\"/>,\nт.е.\n</p> <div class=\"math-display\">\n<img alt=\"p= pатм + ρgh.\n\" class=\"math-display\" src=\"index-eab478205b9fa73922054927bc19bf13.svg\"/></div>\n<p class=\"indent\">   При подъёме пузырька его глубина будет уменьшаться, следовательно, будет уменьшаться гидростатическое давление. Тогда и\nдавление внутри пузырька так же будет уменьшаться. <br/>Ключевая фраза – водоём равномерно прогрет, т.е. при подъёме температура остается постоянной. Средняя кинетическая энергия\nтеплового движения молекул воздуха в пузырьке можно определить по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"E = 3kT.\n    2\n\" class=\"math-display\" src=\"index-bdf9c9e1abecb7b7fc547de8b67ae121.svg\"/></div>\n<p class=\"indent\">   Температура остается постоянной, следовательно, и кинетическая энергия остается постоянной.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-44f0d9317dd8c7991f4c1e378a8c5032.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364707/index-44f0d9317dd8c7991f4c1e378a8c5032.svg", "index-d2d6b3ea59f2e36a020b496f18f92f9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364708/index-d2d6b3ea59f2e36a020b496f18f92f9f.svg", "index-c0e22ba3179c3e691e5075e933084a13.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364708/index-c0e22ba3179c3e691e5075e933084a13.svg", "index-e27526ebfcabca27af834c578106d771.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364708/index-e27526ebfcabca27af834c578106d771.svg", "index-eab478205b9fa73922054927bc19bf13.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364708/index-eab478205b9fa73922054927bc19bf13.svg", "index-bdf9c9e1abecb7b7fc547de8b67ae121.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364708/index-bdf9c9e1abecb7b7fc547de8b67ae121.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГКР 21.12.2023-1"], "created_at": "2026-02-20T17:24:22Z", "updated_at": "2026-04-18T16:48:10Z"}, {"id": 14082, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находятся жидкость и её насыщенный пар. Как будут изменяться давление пара и масса жидкости при\nнебольшом медленном перемещении поршня вниз при постоянной температуре? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличилась <br/>2) уменьшилась <br/>3) не изменилась <br/>Запишите в ответ выбранные цифры для каждой физической величины.\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|----------------|\n|-Давление-пара-|-Масса ж-идкости-|\n--------------------------------|\n\" class=\"math-display\" src=\"index-2c155a45ab9f7001984b8cf89c05b3b6.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Поскольку пар насыщенный, то его давление при данной температуре невозможно увеличить, т.е. давление в данном процессе\nостается неизменным, ответ 3. <br/>2) Когда мы сжимаем поршень происходит кратковременное &#34;увеличение&#34;давления, за счет чего часть пара сразу же\nконденсируется, увеличивая массу жидкости, т.е. ответ 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2c155a45ab9f7001984b8cf89c05b3b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28357/index-2c155a45ab9f7001984b8cf89c05b3b6.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Свойства паров. Влажность"], "sources": ["Демоверсия 2016"], "created_at": "2021-12-10T09:34:00Z", "updated_at": "2026-04-29T09:13:52Z"}, {"id": 14086, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Дан график зависимости температуры двух килограмм «незамерзайки» для автомобилей от сообщаемой теплоты <img alt=\"Q  \" class=\"math\" src=\"index-cb8609461b96c11cdd34fdf8c6e0fedf.svg\"/>.\nНачальное состояние – твёрдое. Установите соответствие между физическими величинами и их числовыми значениями.\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"14086_1.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.\n</p> <div class=\"math-display\">\n<img alt=\" А) Удельная теплоемкость     1) 30 кД ж/кг\n жидкости                    2) 833 Д ж/(кг*К )\nБ ) Удельная теплота плавления  3) 15 кД ж/кг\n                             4) 417 Д ж/(кг*К )\n\" class=\"math-display\" src=\"index-6d94b3d0ec4e544de255fdf7028306b8.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"-------\n|А |Б |\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-3725de75dec97cccb06f6632325df097.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) За 150 кДж жидкость нагрелась на 180 <img alt=\"∘\nC  \" class=\"math\" src=\"index-f34da2d41d89f17f5c04948128cc8d9f.svg\"/>, значит удельная теплоемкость жидкости будет равна:\n</p> <div class=\"math-display\">\n<img alt=\"               Q     150000 Дж             ∘\nQ = cm Δt ⇒ c= m-Δt = 2 К-г⋅180∘C-≈ 417 Д ж/(кг⋅ C)\n\" class=\"math-display\" src=\"index-c88e6cd484cd7819d31c8a07ee02641b.svg\"/></div>\n<p class=\"indent\">   Б) За время плавления было передано 30 кДж энергии, это потребовалось для плавки 2 кг, значит удельная теплота плавления 15\nкДж/кг\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cb8609461b96c11cdd34fdf8c6e0fedf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28365/index-cb8609461b96c11cdd34fdf8c6e0fedf.svg", "14086_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28365/14086_1.png", "index-6d94b3d0ec4e544de255fdf7028306b8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28365/index-6d94b3d0ec4e544de255fdf7028306b8.svg", "index-3725de75dec97cccb06f6632325df097.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28365/index-3725de75dec97cccb06f6632325df097.svg", "index-f34da2d41d89f17f5c04948128cc8d9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28366/index-f34da2d41d89f17f5c04948128cc8d9f.svg", "index-c88e6cd484cd7819d31c8a07ee02641b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28366/index-c88e6cd484cd7819d31c8a07ee02641b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "2019", "Досрочная волна", "Задача с реального ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["досрок 2019"], "created_at": "2021-12-10T09:50:50Z", "updated_at": "2026-04-21T20:01:33Z"}, {"id": 104252, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Вертикальный гладкий цилиндр закрыт подвижным поршнем. Под поршнем в цилиндре находится 1 моль неона. Объём цилиндра\nмедленно уменьшают, сохраняя температуру неона неизменной. Как изменяются в этом процессе внутренняя энергия неона и\nконцентрация его молекул?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------|-------------------------|\n|Внутренняя энергия неона|Концентрация-молекул неона\n--------------------------------------------------|\n\" class=\"math-display\" src=\"index-eceec46356293e010851ff0e2b06b9db.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия раза\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2RT.\n\" class=\"math-display\" src=\"index-d2b91801dc3edf44f6df88d5eac2ff2a.svg\"/></div>\n<p class=\"indent\">   Так как по условию температура не изменяется, то внутренняя энергия также постоянна.<br/>Концентрация молекул газа вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"n=  N.\n    V\n\" class=\"math-display\" src=\"index-bc4dd2049b259a2f2228101cfa1cb521.svg\"/></div>\n<p class=\"indent\">   Т.к. количество вещества не изменяется, то за счёт уменьшения объёма концентрация молекул увелчивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-eceec46356293e010851ff0e2b06b9db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215152/index-eceec46356293e010851ff0e2b06b9db.svg", "index-d2b91801dc3edf44f6df88d5eac2ff2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215153/index-d2b91801dc3edf44f6df88d5eac2ff2a.svg", "index-bc4dd2049b259a2f2228101cfa1cb521.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215153/index-bc4dd2049b259a2f2228101cfa1cb521.svg"}, "tags": ["Статград 2025 декабрь №1", "Статград 2025 декабрь №4"], "sources": ["CтатГрад 2025 декабрь №1", "CтатГрад 2025 декабрь №4"], "created_at": "2025-01-26T20:43:54Z", "updated_at": "2026-04-18T16:49:13Z"}, {"id": 104253, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Вертикальный гладкий цилиндр закрыт подвижным поршнем. Под поршнем в цилиндре находится 1 моль неона. Объём цилиндра\nмедленно уменьшают, сохраняя температуру неона неизменной. Как изменяются в этом процессе средняя кинетическая энергия\nнеона и концентрация его молекул?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------------------|------------------------|\n|   Средняя кинетическая энергия     |Концентрация молекул неона|\n|хаотического движ-ения-молекул неона------------------------|\n|                                 |                        |\n------------------------------------------------------------\n\" class=\"math-display\" src=\"index-2c1461b3a3f4d11f15bfe4ac3bc90e5a.svg\"/></div>", "solution_html": "<p class=\"noindent\">Средняя кинетическая энергия\n</p> <div class=\"math-display\">\n<img alt=\"    3\nE = 2kT.\n\" class=\"math-display\" src=\"index-289a449bc7d22d55e3b103b6cdfe2187.svg\"/></div>\n<p class=\"indent\">   Так как по условию температура не изменяют, то cредняя кинетическая энергия также не изменяется .<br/>Объем уменьшается.<br/>Концентрация молекул газа вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"n=  N.\n    V\n\" class=\"math-display\" src=\"index-44e989f8730502dc661edbedc77bd9c7.svg\"/></div>\n<p class=\"indent\">   Т.к. количество вещества не изменяется, то за счёт уменьшения объёма концентрация молекул увелчивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2c1461b3a3f4d11f15bfe4ac3bc90e5a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215154/index-2c1461b3a3f4d11f15bfe4ac3bc90e5a.svg", "index-289a449bc7d22d55e3b103b6cdfe2187.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215156/index-289a449bc7d22d55e3b103b6cdfe2187.svg", "index-44e989f8730502dc661edbedc77bd9c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215156/index-44e989f8730502dc661edbedc77bd9c7.svg"}, "tags": ["Статград 2025 декабрь №3", "Статград 2025 декабрь №2"], "sources": ["CтатГрад 2025 декабрь №3", "CтатГрад 2025 декабрь №2"], "created_at": "2025-01-26T20:47:50Z", "updated_at": "2026-04-18T16:49:21Z"}, {"id": 120742, "name": "Молекулярно-кинетическая теория. Изменение физических величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости внутренней энергии U двух молей идеального одноатомного газа от его давления p. Как\nменяются в этом процессе при переходе от состояния 1 к состоянию 2 объём газа и средняя энергия теплового движения его\nмолекул?<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"120742.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|----------|-------------------------------------------|\n|О-бъём-газа|-Средняя-энергия-теплового движ-ения-молекул газа\n--------------------------------------------------------\n\" class=\"math-display\" src=\"index-c6efb0022fef9c58d7b13ed4bc05d006.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия идеального одноатомного газа определяется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT.  (1)\n\" class=\"math-display\" src=\"index-5236c76c02ee43df7f96fcfeb446e911.svg\"/></div>\n<p class=\"indent\">   Уравнение Мендлеева-Клайперона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT.  (2)\n\" class=\"math-display\" src=\"index-47c579581bd3942e15b9b8f77016a27d.svg\"/></div>\n<p class=\"indent\">   Объединяя (1) и (2), получим\n</p> <div class=\"math-display\">\n<img alt=\"U = 3pV.\n    2\n\" class=\"math-display\" src=\"index-cd7bc4715b84afdafc362d8c187a466c.svg\"/></div>\n<p class=\"indent\">   Из графика видим, что внутренняя энергия прямо пропорциональна давлению, а значит объем не изменяется.<br/>Так как увеличивается внутренняя энергия, значит увеличивается и температура газа, так как внутренняя энергия напрямую\nзависит от температуры. Скорость теплового движения молекул прямо пропорциональна температуре. Поскольку увеличивается\nскорость движения молекул, то и средняя энергия теплового движения также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"120742.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/248110/120742.png", "index-c6efb0022fef9c58d7b13ed4bc05d006.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/248110/index-c6efb0022fef9c58d7b13ed4bc05d006.svg", "index-5236c76c02ee43df7f96fcfeb446e911.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249074/index-5236c76c02ee43df7f96fcfeb446e911.svg", "index-47c579581bd3942e15b9b8f77016a27d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249074/index-47c579581bd3942e15b9b8f77016a27d.svg", "index-cd7bc4715b84afdafc362d8c187a466c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249074/index-cd7bc4715b84afdafc362d8c187a466c.svg"}, "tags": ["СтатГрад 11.02.2022 Физика 1"], "sources": ["СтатГрад 11.02.2022 Физика 1"], "created_at": "2025-04-27T14:54:45Z", "updated_at": "2026-04-18T16:49:29Z"}, {"id": 121347, "name": "Молекулярно-кинетическая теория. Изменение физических величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости внутренней энергии <img alt=\"U  \" class=\"math\" src=\"index-c0fe1b7f540a95af76f27a70c1326bbc.svg\"/> двух молей идеального одноатомного газа от его объёма <img alt=\" V.  \" class=\"math\" src=\"index-746dde2e8e7f902511e7541eec26dc42.svg\"/> Как\nменяются в этом процессе при переходе от состояния 1 к состоянию 2 давление газа и его концентрация?<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"121347 (1).png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|----------------|\n|Д-авление-газа-|Концентрация газа|\n--------------------------------\n\" class=\"math-display\" src=\"index-d5cc113cc0e87aad3b0610f8e9ec47b7.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия идеального одноатомного газа определяется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT.  (1)\n\" class=\"math-display\" src=\"index-5236c76c02ee43df7f96fcfeb446e911.svg\"/></div>\n<p class=\"indent\">   Уравнение Мендлеева-Клайперона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT.  (2)\n\" class=\"math-display\" src=\"index-47c579581bd3942e15b9b8f77016a27d.svg\"/></div>\n<p class=\"indent\">   Объединяя (1) и (2), получим\n</p> <div class=\"math-display\">\n<img alt=\"U = 3pV.\n    2\n\" class=\"math-display\" src=\"index-cd7bc4715b84afdafc362d8c187a466c.svg\"/></div>\n<p class=\"indent\">   Из графика видим, что внутренняя энергия прямо пропорциональна объему, а значит давление не изменяется.<br/>Концентрация выражается по формуле\n</p> <div class=\"math-display\">\n<img alt=\"    N-\nn=  V ,\n\" class=\"math-display\" src=\"index-69049c05ecf71a91cf51eb4e93297fbc.svg\"/></div> <p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-e667ff70255082f8dbac64f3a477d9a9.svg\"/> - количество частиц в объёме <img alt=\"V  \" class=\"math\" src=\"index-80e2a469a54837f23c75ea762de3670a.svg\"/>.<br/>Поскольку количество частиц постоянно, а объём уменьшается. то концентрация увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c0fe1b7f540a95af76f27a70c1326bbc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249295/index-c0fe1b7f540a95af76f27a70c1326bbc.svg", "index-746dde2e8e7f902511e7541eec26dc42.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249295/index-746dde2e8e7f902511e7541eec26dc42.svg", "121347 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249295/121347 (1).png", "index-d5cc113cc0e87aad3b0610f8e9ec47b7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249295/index-d5cc113cc0e87aad3b0610f8e9ec47b7.svg", "index-5236c76c02ee43df7f96fcfeb446e911.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249326/index-5236c76c02ee43df7f96fcfeb446e911.svg", "index-47c579581bd3942e15b9b8f77016a27d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249326/index-47c579581bd3942e15b9b8f77016a27d.svg", "index-cd7bc4715b84afdafc362d8c187a466c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249326/index-cd7bc4715b84afdafc362d8c187a466c.svg", "index-69049c05ecf71a91cf51eb4e93297fbc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249326/index-69049c05ecf71a91cf51eb4e9
