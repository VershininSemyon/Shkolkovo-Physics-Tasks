амику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде постоянного объёма при комнатной температуре находится воздух, содержащий ненасыщенный водяной пар.\nТемпературу воздуха увеличили на 20 К. Как изменились при этом концентрация молекул воды и относительная влажность воздуха\nв сосуде?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения.\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|-----------------------|\n|К онцентрация молекул воды |О тносительная влажность|\n|         в сосуде        |    воздуха в сосуде    |\n|-------------------------|-----------------------|\n--------------------------------------------------|\n\" class=\"math-display\" src=\"index-56c62959834249b8c9c6232c3b795a96.svg\"/></div>", "solution_html": "<p class=\"noindent\">A) Концентрацию найдем по формуле <img alt=\"   N-\nn= V  \" class=\"math\" src=\"index-21b1516305a8e4a860d30e40dcee4cbb.svg\"/>, где <img alt=\"N  \" class=\"math\" src=\"index-007dca51ef6af7ad5fa641333077a1c5.svg\"/> - число молекул газа, <img alt=\"V  \" class=\"math\" src=\"index-f805629a87fc710bfc421f4bf308c6d4.svg\"/> - объём, занимаемый газом. Так как число молекул\nи объём сосуда неизменны, то концентрация не изменяется. А — 3.<br/>Б) Относительная влажность находится по формуле <img alt=\"φ=  ρпара⋅100%\n    ρн.п  \" class=\"math\" src=\"index-68a759e0231a0a547b286c018da40e2c.svg\"/>, здесь <img alt=\"ρпара  \" class=\"math\" src=\"index-848bfb62093f997ffcbc694bc7e2eff3.svg\"/> – плотность пара, <img alt=\"ρн.п  \" class=\"math\" src=\"index-c324d14dd65730c52934632be5000717.svg\"/> – плотность\nнасыщенного пара при данной температуре. При увеличении температуры в сосуде, плотность насыщенного пара увеличивается. Так\nкак масса водяного пара и объём сосуда неизменны, поэтому его плотность не меняется, следовательно, относительная влажность\nуменьшается. Б — 2\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-56c62959834249b8c9c6232c3b795a96.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35135/index-56c62959834249b8c9c6232c3b795a96.svg", "index-21b1516305a8e4a860d30e40dcee4cbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-21b1516305a8e4a860d30e40dcee4cbb.svg", "index-007dca51ef6af7ad5fa641333077a1c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-007dca51ef6af7ad5fa641333077a1c5.svg", "index-f805629a87fc710bfc421f4bf308c6d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-f805629a87fc710bfc421f4bf308c6d4.svg", "index-68a759e0231a0a547b286c018da40e2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-68a759e0231a0a547b286c018da40e2c.svg", "index-848bfb62093f997ffcbc694bc7e2eff3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-848bfb62093f997ffcbc694bc7e2eff3.svg", "index-c324d14dd65730c52934632be5000717.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35137/index-c324d14dd65730c52934632be5000717.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2022-01-16T14:26:06Z", "updated_at": "2026-07-13T20:45:58Z"}, {"id": 94214, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем первоначально находилось твёрдое вещество. Цилиндр сначала нагревали в печи,\nа затем охлаждали. На рисунке показан график изменения температуры t вещества с течением времени\n<img alt=\"τ.  \" class=\"math\" src=\"index-1e10ee3e111680611744d297cb80d46b.svg\"/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"236\" src=\"94214.png\" width=\"236\"/></p></div>\n<p class=\"noindent\">Какие формулы соответствуют каким физическим величинам? <br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры\nпод соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"У ЧА СТК И ГРА ФИ КА  П РО ЦЕ ССЫ\n\nА ) CD                1) охлаждение пара\n                      2) нагреван ие ж идкости\nБ ) GH                3) конденсация\n\n                      4) плавление\n\" class=\"math-display\" src=\"index-4a0c251b9208d8837d436d806cd0018e.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А |Б |\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-be3472428c113b2c3f56a13407a761c7.svg\"/></div>", "solution_html": "<p class=\"noindent\">В начальный момент времени тело находилось в твердом агрегатном состоянии. Тогда процесс <img alt=\"AB  \" class=\"math\" src=\"index-ac49da523346441cc6e058cc70925a14.svg\"/> – это нагрев твердого вещества.\nВ процессе <img alt=\"BC  \" class=\"math\" src=\"index-01c3a291330151269700154c404db564.svg\"/> не изменяется температура, значит, происходит процесс фазового перехода из твердого состояния в жидкое -\nплавление. Процесс <img alt=\"CD  \" class=\"math\" src=\"index-02c8a64352370e2e7b3af30a9d423e05.svg\"/> – нагрев жидкого вещества. В процессе <img alt=\"DE  \" class=\"math\" src=\"index-d079eacecb7b57965680ad3973c54ba3.svg\"/> не изменяется температура, значит, происходит процесс\nфазового перехода из жидкого состояния в газообразное - кипение. Процесс <img alt=\"EF  \" class=\"math\" src=\"index-50a2fa95592541d5147172e48cebe836.svg\"/> – нагрев пара. Процесс <img alt=\"F G  \" class=\"math\" src=\"index-4cb4f399467d7cb238f355dd1864a071.svg\"/> – охлаждение пара. В\nпроцессе <img alt=\"GH  \" class=\"math\" src=\"index-9d140f2b78022490078b83a8c81b77f3.svg\"/> не изменяется температура, значит, происходит процесс фазового перехода из газообразного состояния в жидкое -\nконденсация. Процесс <img alt=\"HK  \" class=\"math\" src=\"index-19b15523af32d621fa90cff4b4ea7675.svg\"/> – охлаждение жидкости. В процессе <img alt=\"KL  \" class=\"math\" src=\"index-209c05de400ce1e4e4023ae16a866bbb.svg\"/> не изменяется температура, значит, происходит\nпроцесс фазового перехода из жидкого состояния в твердое - кристаллизация. Процесс <img alt=\"LM  \" class=\"math\" src=\"index-ef5d2bb010fda507b2e6295475df9ae4.svg\"/> – охлаждение твердого\nвещества.<br/>Тогда:<br/>А) CD - нагрев жидкости.<br/>Б) GH - конденсация.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1e10ee3e111680611744d297cb80d46b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190296/index-1e10ee3e111680611744d297cb80d46b.svg", "94214.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190296/94214.png", "index-4a0c251b9208d8837d436d806cd0018e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190296/index-4a0c251b9208d8837d436d806cd0018e.svg", "index-be3472428c113b2c3f56a13407a761c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190296/index-be3472428c113b2c3f56a13407a761c7.svg", "index-ac49da523346441cc6e058cc70925a14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-ac49da523346441cc6e058cc70925a14.svg", "index-01c3a291330151269700154c404db564.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-01c3a291330151269700154c404db564.svg", "index-02c8a64352370e2e7b3af30a9d423e05.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-02c8a64352370e2e7b3af30a9d423e05.svg", "index-d079eacecb7b57965680ad3973c54ba3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-d079eacecb7b57965680ad3973c54ba3.svg", "index-50a2fa95592541d5147172e48cebe836.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-50a2fa95592541d5147172e48cebe836.svg", "index-4cb4f399467d7cb238f355dd1864a071.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-4cb4f399467d7cb238f355dd1864a071.svg", "index-9d140f2b78022490078b83a8c81b77f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-9d140f2b78022490078b83a8c81b77f3.svg", "index-19b15523af32d621fa90cff4b4ea7675.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-19b15523af32d621fa90cff4b4ea7675.svg", "index-209c05de400ce1e4e4023ae16a866bbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-209c05de400ce1e4e4023ae16a866bbb.svg", "index-ef5d2bb010fda507b2e6295475df9ae4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/203534/index-ef5d2bb010fda507b2e6295475df9ae4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2019"], "created_at": "2024-08-07T14:54:01Z", "updated_at": "2026-05-09T13:47:21Z"}, {"id": 146316, "name": "Терма", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Постоянная масса идеального одноатомного газа в изохорном процессе получает количество теплоты <img alt=\"Q &gt; 0  \" class=\"math\" src=\"index-781aa1a4bc0c19961e20ac5a8477b9b4.svg\"/>. Как меняются в\nэтом процессе давление и внутренняя энергия газа? Для каждой величины определите соответствующий характер\nизменения:\n    </p><dl class=\"enumerate-enumitem\"><dt class=\"enumerate-enumitem\">\n  1) </dt><dd class=\"enumerate-enumitem\">увеличивается\n    </dd><dt class=\"enumerate-enumitem\">\n  2) </dt><dd class=\"enumerate-enumitem\">уменьшается\n    </dd><dt class=\"enumerate-enumitem\">\n  3) </dt><dd class=\"enumerate-enumitem\">не изменяется</dd></dl>\n<p class=\"noindent\">Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|------------|----------------------|\n|Давление газа|В-нутренняя-энергия-газа|\n------------------------------------|\n\" class=\"math-display\" src=\"index-ba5bb8d2eab56c83868634c44224b487.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) В изохорном процессе работа газа равна нулю, тогда по первому закону термодинамики:\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-464925392dd522af206b7a7dcdb638b6.svg\"/></div> <div class=\"align\"><img alt=\"pict\" src=\"index-b59f41abc7cd0d6ba5fd8903a7cd8747.svg\"/></div>\n<p class=\"indent\">   2) Внутренняя энергия одноатомного газа равна:\n</p> <table class=\"equation\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"      3\nΔU  = 2νRΔT  &gt;0\n\" class=\"math-display\" src=\"index-746f3eb054ef5c17928fa20d91fd99bf.svg\"/><a id=\"x1-2r1\"></a></div> </td><td class=\"equation-label\">(1)</td></tr></tbody></table>\n<p class=\"nopar\">По условию, масса идеального газа в процессе постоянна:\n</p> <table class=\"equation\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"m = μ⋅ν =const⇒ ν = const\n\" class=\"math-display\" src=\"index-eaa1ca4866596151b25427a703f8a851.svg\"/><a id=\"x1-3r2\"></a></div> </td><td class=\"equation-label\">(2)</td></tr></tbody></table>\n<p class=\"nopar\">Из уравенний (1) и (2) следует, что <img alt=\"ΔT &gt; 0⇒ T  \" class=\"math\" src=\"index-5d0a73f11b01df3fa704584d3f7f2bb1.svg\"/> увеличивается.\n</p><p class=\"indent\">   Запишем закон Шарля для изохорного процесса с нашими условиями:\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-fc28d829b81e44a0155879163af4e24f.svg\"/></div>\n<p class=\"indent\">   Очевидно, что тогда и <img alt=\"p  \" class=\"math\" src=\"index-414eb7c1da91a0ddc82979aa8dde4c08.svg\"/> увеличивается. <!--  tex4ht:inline  --></p><div class=\"tabular\"> <table class=\"tabular\" id=\"TBL-1\"><colgroup id=\"TBL-1-1g\"><col id=\"TBL-1-1\"/></colgroup><colgroup id=\"TBL-1-2g\"><col id=\"TBL-1-2\"/></colgroup><tbody><tr class=\"hline\"><td></td><td></td></tr><tr id=\"TBL-1-1-\" style=\"vertical-align:baseline;\"><td class=\"td11\" id=\"TBL-1-1-1\" style=\"white-space:nowrap; text-align:center;\"> Давление газа  </td><td class=\"td11\" id=\"TBL-1-1-2\" style=\"white-space:nowrap; text-align:center;\"> Внутренняя энергия газа  </td>\n</tr><tr class=\"hline\"><td></td><td></td></tr><tr id=\"TBL-1-2-\" style=\"vertical-align:baseline;\"><td class=\"td11\" id=\"TBL-1-2-1\" style=\"white-space:nowrap; text-align:center;\">        1            </td><td class=\"td11\" id=\"TBL-1-2-2\" style=\"white-space:nowrap; text-align:center;\">            1                   </td></tr><tr class=\"hline\"><td></td><td></td></tr></tbody></table> </div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-781aa1a4bc0c19961e20ac5a8477b9b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308525/index-781aa1a4bc0c19961e20ac5a8477b9b4.svg", "index-ba5bb8d2eab56c83868634c44224b487.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308525/index-ba5bb8d2eab56c83868634c44224b487.svg", "index-464925392dd522af206b7a7dcdb638b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-464925392dd522af206b7a7dcdb638b6.svg", "index-b59f41abc7cd0d6ba5fd8903a7cd8747.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-b59f41abc7cd0d6ba5fd8903a7cd8747.svg", "index-746f3eb054ef5c17928fa20d91fd99bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-746f3eb054ef5c17928fa20d91fd99bf.svg", "index-eaa1ca4866596151b25427a703f8a851.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-eaa1ca4866596151b25427a703f8a851.svg", "index-5d0a73f11b01df3fa704584d3f7f2bb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-5d0a73f11b01df3fa704584d3f7f2bb1.svg", "index-fc28d829b81e44a0155879163af4e24f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-fc28d829b81e44a0155879163af4e24f.svg", "index-414eb7c1da91a0ddc82979aa8dde4c08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/308526/index-414eb7c1da91a0ddc82979aa8dde4c08.svg"}, "tags": [], "sources": ["Демидова 2026"], "created_at": "2025-10-11T20:12:12Z", "updated_at": "2026-04-28T11:37:27Z"}, {"id": 186825, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде постоянного объёма при комнатной температуре находится воздух, содержащий насыщенный\nводяной пар, на стенках сосуда капли воды. Температуру воздуха увеличили на 8 К, при этом капли воды остаются\nна стенках сосуда. Как изменились при этом концентрация молекул воды и относительная влажность воздуха в\nсосуде?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения.\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------------------|-----------------------|\n| Концентрация молекул водяного пара|О тносительная влажност&amp;#x04\n|             в сосуде            |    воздуха в сосуде    |\n|---------------------------------|-----------------------|\n----------------------------------------------------------|\n\" class=\"math-display\" src=\"index-498202bd01765835581057f791886fb4.svg\"/></div>", "solution_html": "<p class=\"noindent\">A) Пока в сосуде есть капли воды, пар над ними остаётся насыщенным при любой температуре. Концентрация насыщенного пара\nсвязана с давлением насыщенного пара формулой:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"n = pнас(T-)\n     kT\n\" class=\"math-display\" src=\"index-d56c54cfb18d65f020f07426f532d0a4.svg\"/></div>\n<p class=\"indent\">   При увеличении температуры давление насыщенного пара <img alt=\"pнас(T)  \" class=\"math\" src=\"index-5d0d84d4c8ba7b25514384dd32b01c2a.svg\"/> растёт значительно быстрее, чем сам множитель T в\nзнаменателе (зависимость близка к экспоненциальной). Поэтому при нагревании на <img alt=\"ΔT = 8  \" class=\"math\" src=\"index-88e3995181d9a48fd2d17905b8c94793.svg\"/> К концентрация насыщенного пара n\nувеличивается.<br/>Б) Относительная влажность насыщенного пара по определению равна <img alt=\"100%  \" class=\"math\" src=\"index-0bbc3e91bc92711eb351ff0999121727.svg\"/> независимо от температуры — пока пар остаётся\nнасыщенным (капли есть), она не меняется.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-498202bd01765835581057f791886fb4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/411787/index-498202bd01765835581057f791886fb4.svg", "index-d56c54cfb18d65f020f07426f532d0a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/411788/index-d56c54cfb18d65f020f07426f532d0a4.svg", "index-5d0d84d4c8ba7b25514384dd32b01c2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/411788/index-5d0d84d4c8ba7b25514384dd32b01c2a.svg", "index-88e3995181d9a48fd2d17905b8c94793.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/411788/index-88e3995181d9a48fd2d17905b8c94793.svg", "index-0bbc3e91bc92711eb351ff0999121727.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/411788/index-0bbc3e91bc92711eb351ff0999121727.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2026-06-24T14:34:11Z", "updated_at": "2026-07-17T12:46:59Z"}, {"id": 18702, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В результате некоторого процесса, совершаемого с постоянным количеством газа, давление газа в сосуде увеличивается в 3 раза, а\nплотность газа увеличивается в 2 раза.\n</p><p class=\"indent\">   Как в результате этого изменяются объём газа и температура газа?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины.\n</p><p class=\"indent\">   Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|----------------|\n|О бъ ём газа |Температура газа|\n|----------|----------------|\n----------------------------|\n\" class=\"math-display\" src=\"index-694a942e56182430c11eff40ea5209a4.svg\"/></div>", "solution_html": "<p class=\"noindent\">Формула плотности имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"   m\nρ= -V ,\n\" class=\"math-display\" src=\"index-9b47013cda4d006821400cff40eb68d8.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-e78b1992cf00a7eca68d76c6d81da38a.svg\"/> – объём газа.<br/>При этом <img alt=\"m  =const  \" class=\"math\" src=\"index-80c46013d03c1ba66e26c2cf53b26744.svg\"/>, то есть для увеличения плотности в 2 раза объём должен уменьшится в 2 раза.<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = mRT-,\n      μ\n\" class=\"math-display\" src=\"index-6cc92e5169747ef5d3a35a196a491c8b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-69bf703577c29fa225ffac494b89fe1d.svg\"/> – давление, <img alt=\"T  \" class=\"math\" src=\"index-032b1197d0070cf45a6c6f22123bca4d.svg\"/> – температура газа, <img alt=\"μ  \" class=\"math\" src=\"index-253bb680a28c3fb39fc6bdf70d102507.svg\"/> – молярная масса.<br/>Откуда\n</p> <div class=\"math-display\">\n<img alt=\"T = μp-.\n    R ρ\n\" class=\"math-display\" src=\"index-bb66aabf0dba32716dc54ca5d42a3bf9.svg\"/></div>\n<p class=\"indent\">   Одновременное увеличение давления газа в сосуде в 3 раза и увеличивается плотности газа в 2 раза должно привести к\nувеличению температуры в 1,5 раза.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-694a942e56182430c11eff40ea5209a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36755/index-694a942e56182430c11eff40ea5209a4.svg", "index-9b47013cda4d006821400cff40eb68d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-9b47013cda4d006821400cff40eb68d8.svg", "index-e78b1992cf00a7eca68d76c6d81da38a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-e78b1992cf00a7eca68d76c6d81da38a.svg", "index-80c46013d03c1ba66e26c2cf53b26744.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-80c46013d03c1ba66e26c2cf53b26744.svg", "index-6cc92e5169747ef5d3a35a196a491c8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-6cc92e5169747ef5d3a35a196a491c8b.svg", "index-69bf703577c29fa225ffac494b89fe1d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-69bf703577c29fa225ffac494b89fe1d.svg", "index-032b1197d0070cf45a6c6f22123bca4d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-032b1197d0070cf45a6c6f22123bca4d.svg", "index-253bb680a28c3fb39fc6bdf70d102507.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-253bb680a28c3fb39fc6bdf70d102507.svg", "index-bb66aabf0dba32716dc54ca5d42a3bf9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36756/index-bb66aabf0dba32716dc54ca5d42a3bf9.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2022-01-30T15:52:37Z", "updated_at": "2026-05-20T16:19:40Z"}, {"id": 30735, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится твёрдое вещество. Цилиндр поместили в горячую печь, а затем выставили на холод. На рисунке\nпоказан график изменения температуры <img alt=\"t  \" class=\"math\" src=\"index-aa29238ae21e0e8de4cfd4e865b72637.svg\"/> вещества с течением времени <img alt=\"τ  \" class=\"math\" src=\"index-50a4ed1284934f66f31ba493ae50792f.svg\"/>\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"236\" src=\"94084.png\" width=\"236\"/> </p> </figure>\n<p class=\"indent\">   Какие формулы соответствуют каким физическим величинам? <br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"У ЧАС ТКИ ГРА ФИ КА  П РОЦЕ ССЫ\nА ) KL               1) кристаллизация\n\n                     2) охлаждение пара\nБ ) FG               3) плавление\n                     4) конденсация\n\" class=\"math-display\" src=\"index-82b226dba2a2ab5e8d5f9c80c5312d32.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-e29dc50c3b0d6e4064d9a0fd244c1aa9.svg\"/></div>", "solution_html": "<p class=\"noindent\">Участки на графике имеют следующее значение:<br/><img alt=\"AB  \" class=\"math\" src=\"index-ca219ffae0baf27d972454fd338c5f7f.svg\"/> – нагрев твердого вещества;<br/><img alt=\"BC  \" class=\"math\" src=\"index-2127bfc1ee1acf930c402d4edf0d77b8.svg\"/> – плавление твердого вещества (температура не изменяется);<br/><img alt=\"CD  \" class=\"math\" src=\"index-43c89d0769366c98b12cdb03eaf60814.svg\"/> – нагрев жидкого вещества;<br/><img alt=\"DE  \" class=\"math\" src=\"index-e218ec86ef319a9ee11edccac75c7968.svg\"/> – парообразование;<br/><img alt=\"EF  \" class=\"math\" src=\"index-f1044c9ea2fe476d476ccde7ca4a8c4d.svg\"/> – нагрев пара;<br/><img alt=\"F G  \" class=\"math\" src=\"index-371663c73e4496fa1f83fa8b01f25cc9.svg\"/> – охлаждение пара;<br/><img alt=\"GH  \" class=\"math\" src=\"index-272fba0098df311b4d0620fdab0d2a45.svg\"/> – конденсация пара;<br/><img alt=\"HK  \" class=\"math\" src=\"index-e9293d2c234e39e6059fbc6dc87e59d9.svg\"/> – охлаждение жидкости;<br/><img alt=\"KL  \" class=\"math\" src=\"index-c8452fc97a1c047558df20d2b3146cef.svg\"/> – кристаллизация жидкости;<br/><img alt=\"LM  \" class=\"math\" src=\"index-d688a4c55755216043f5d0a3d7c0d364.svg\"/> – охлаждение твердого тела.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aa29238ae21e0e8de4cfd4e865b72637.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/56851/index-aa29238ae21e0e8de4cfd4e865b72637.svg", "index-50a4ed1284934f66f31ba493ae50792f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/56851/index-50a4ed1284934f66f31ba493ae50792f.svg", "94084.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/56851/94084.png", "index-82b226dba2a2ab5e8d5f9c80c5312d32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/56851/index-82b226dba2a2ab5e8d5f9c80c5312d32.svg", "index-e29dc50c3b0d6e4064d9a0fd24
