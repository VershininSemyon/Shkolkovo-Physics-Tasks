у\nфизическими величинами, характеризующими газ, и формулами, по которым их можно рассчитать (<img alt=\"μ  \" class=\"math\" src=\"index-c0b61c6df153b0249472ffbb72924bd0.svg\"/> – молярная масса газа, <img alt=\"     R  \" class=\"math\" src=\"index-0b9adcd492d8052ac67eea68edd6e513.svg\"/> –\nуниверсальная газовая постоянная, <img alt=\"Na  \" class=\"math\" src=\"index-4175da9014cd56be485d63cd3dc9e180.svg\"/> – число Авогадро).<br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные\nцифры.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ФИЗ ИЧЕС КИЕ В ЕЛИЧ ИН Ы  Ф ОРМ УЛЫ\n\n                             RT-\nА) плотность газа           1) μV\n                          2) μp-\n                             RT\n                             pV Na\nБ) количество молекул газа   3) -RT--\n\n                          4) μNaV\n\" class=\"math-display\" src=\"index-f8ab0fd7627c1ddfff57d7e088ea3604.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-01c2e0004b91c2feb9264e18e2b3853b.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Из уравнения Менделеева-Клапейрона <img alt=\"     m-\npV = μRT  \" class=\"math\" src=\"index-c36ec8890ef65b49af4a23a568431429.svg\"/> выразим давление:\n</p> <div class=\"math-display\">\n<img alt=\"   mRT\np= -μV--\n\" class=\"math-display\" src=\"index-e2f9ba9302add74f9cdb629bbe2f8fb4.svg\"/></div>\n<p class=\"indent\">   Заметим, что\n</p> <div class=\"math-display\">\n<img alt=\"m- = ρ\n V\n\" class=\"math-display\" src=\"index-633486d3c69f8a2b237c670ab3ebb23d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    ρRT-\np =  μ\n\" class=\"math-display\" src=\"index-41130af1b981015ca0865fa22f7ebb6c.svg\"/></div>\n<p class=\"indent\">   Выразим плотность:\n</p> <div class=\"math-display\">\n<img alt=\"ρ= -pμ-\n   RT\n\" class=\"math-display\" src=\"index-8f31ffc1e945fe0df27fd21f91cc035c.svg\"/></div>\n<p class=\"indent\">   Б) Число молекул распишем как:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"N = νNa\n\" class=\"math-display\" src=\"index-27f10bb08aa39021bd2a50712e5ec479.svg\"/></div>\n<p class=\"indent\">   Из уравнения Менделеева-Клапейрона <img alt=\"pV = νRT  \" class=\"math\" src=\"index-b7310fbc304feb4802c6fb8c00a06843.svg\"/> выразим <img alt=\"ν  \" class=\"math\" src=\"index-4658bb631c6d00a8bd5989e99fa08b28.svg\"/> и подставим в число молекул:\n</p> <div class=\"math-display\">\n<img alt=\"     pV Na\nN =  -RT--\n\" class=\"math-display\" src=\"index-b1f1192c0d62136d7738828147583235.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-be5625df49c8c1a452d07189e574a1bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-be5625df49c8c1a452d07189e574a1bf.svg", "index-f6d2b8e9dbd931f30a440b6056a36be6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-f6d2b8e9dbd931f30a440b6056a36be6.svg", "index-f62de2f8e0ab26b412908803277e9ee9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-f62de2f8e0ab26b412908803277e9ee9.svg", "index-c0b61c6df153b0249472ffbb72924bd0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-c0b61c6df153b0249472ffbb72924bd0.svg", "index-0b9adcd492d8052ac67eea68edd6e513.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-0b9adcd492d8052ac67eea68edd6e513.svg", "index-4175da9014cd56be485d63cd3dc9e180.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-4175da9014cd56be485d63cd3dc9e180.svg", "index-f8ab0fd7627c1ddfff57d7e088ea3604.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-f8ab0fd7627c1ddfff57d7e088ea3604.svg", "index-01c2e0004b91c2feb9264e18e2b3853b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261726/index-01c2e0004b91c2feb9264e18e2b3853b.svg", "index-c36ec8890ef65b49af4a23a568431429.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-c36ec8890ef65b49af4a23a568431429.svg", "index-e2f9ba9302add74f9cdb629bbe2f8fb4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-e2f9ba9302add74f9cdb629bbe2f8fb4.svg", "index-633486d3c69f8a2b237c670ab3ebb23d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-633486d3c69f8a2b237c670ab3ebb23d.svg", "index-41130af1b981015ca0865fa22f7ebb6c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-41130af1b981015ca0865fa22f7ebb6c.svg", "index-8f31ffc1e945fe0df27fd21f91cc035c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-8f31ffc1e945fe0df27fd21f91cc035c.svg", "index-27f10bb08aa39021bd2a50712e5ec479.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-27f10bb08aa39021bd2a50712e5ec479.svg", "index-b7310fbc304feb4802c6fb8c00a06843.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-b7310fbc304feb4802c6fb8c00a06843.svg", "index-4658bb631c6d00a8bd5989e99fa08b28.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-4658bb631c6d00a8bd5989e99fa08b28.svg", "index-b1f1192c0d62136d7738828147583235.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261836/index-b1f1192c0d62136d7738828147583235.svg"}, "tags": ["Статград 20.10.2022 Физика 2"], "sources": ["CтатГрад 20.10.2022 Физика 2"], "created_at": "2025-06-15T09:00:28Z", "updated_at": "2026-07-08T08:50:12Z"}, {"id": 130527, "name": " Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В ходе адиабатного процесса внутренняя энергия идеального газа увеличивается. Как изменяются в этом процессе давление газа и\nего температура? <br/>Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|----------------|\n|О-бъ-ём-газа-|Температура газа|\n|          |                |\n----------------------------\n\" class=\"math-display\" src=\"index-ad587fea71112bba513c16449cb382c4.svg\"/></div>", "solution_html": "<p class=\"noindent\">При адиабатном процессе <img alt=\"A= − ΔU  \" class=\"math\" src=\"index-5667d4df1d96fd882b3ef982ff893231.svg\"/>. Так как внутренняя энергия увеличивается, то газ совершает отрицательную работу.\nСледовательно, объем газа уменьшается, а давление увеличивается (1).<br/>Увеличение внутренней энергии приводит к увеличению температуры газа (1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ad587fea71112bba513c16449cb382c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270244/index-ad587fea71112bba513c16449cb382c4.svg", "index-5667d4df1d96fd882b3ef982ff893231.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270245/index-5667d4df1d96fd882b3ef982ff893231.svg"}, "tags": ["Статград 28.03.2022 Физика 2"], "sources": ["CтатГрад 28.03.2022 Физика 2"], "created_at": "2025-07-17T17:51:36Z", "updated_at": "2026-04-18T16:50:14Z"}, {"id": 131005, "name": "Влажность. Изменение физических величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде под подвижным поршнем находятся влажный воздух и немного воды. Перемещая поршень, объём сосуда\nмедленно увеличивают при постоянной температуре. Как изменяются в этом процессе относительная влажность воздуха и\nконцентрация пара? Известно, что в конечном состоянии в сосуде остаётся вода.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------------|-----------------|\n|Относительная-влаж-ность-воздуха-|Концентрация пара|\n|                             |                 |\n-------------------------------------------------\n\" class=\"math-display\" src=\"index-ee3b64e3274cdba867e059169cab0712.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку в закрытом сосуде находятся влажный воздух и вода, то они будут в динамическом равновесии. Следовательно, пар в\nсосуде насыщенный. Давление насыщенного пара не зависит от объема, а температура по условию неизменна. Следовательно,\nотносительная влажность воздуха не будет меняться (3).\n</p><p class=\"indent\">   Б) Поскольку давление насыщенного пара не изменяется, то по формуле <img alt=\"p= nkT  \" class=\"math\" src=\"index-d200201cf8269f44d22bbc013bc83196.svg\"/> при постоянной температуре концентрация\nпара не изменится (3).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ee3b64e3274cdba867e059169cab0712.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271281/index-ee3b64e3274cdba867e059169cab0712.svg", "index-d200201cf8269f44d22bbc013bc83196.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271282/index-d200201cf8269f44d22bbc013bc83196.svg"}, "tags": ["Статград 07.03.2023 Физика 1"], "sources": ["CтатГрад 07.03.2023 Физика 1"], "created_at": "2025-07-20T14:59:34Z", "updated_at": "2026-04-18T16:50:26Z"}, {"id": 132436, "name": "Влажность. Изменение физических величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде под подвижным поршнем находятся влажный воздух и немного воды. Перемещая поршень, объём сосуда\nмедленно уменьшают при постоянной температуре. Как изменяются в этом процессе относительная влажность воздуха и плотность\nпара?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------------|-------------|\n|О-тносительная влажность воздуха|Плотность-пара|\n|                              |             |\n----------------------------------------------\n\" class=\"math-display\" src=\"index-f361898ded354f4f7779c1b7d32b0af9.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку в закрытом сосуде находятся влажный воздух и вода, то они будут в динамическом равновесии. Следовательно, пар в\nсосуде насыщенный. Давление насыщенного пара не зависит от объема, а температура по условию неизменна. Следовательно,\nотносительная влажность воздуха не будет меняться (3).\n</p><p class=\"indent\">   Б) При неизменной температуре плотность насыщенного пара не зависит от его объёма (3).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f361898ded354f4f7779c1b7d32b0af9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274445/index-f361898ded354f4f7779c1b7d32b0af9.svg"}, "tags": ["Статград 07.03.2023 Физика 2"], "sources": ["CтатГрад 07.03.2023 Физика 2"], "created_at": "2025-07-27T17:46:43Z", "updated_at": "2026-04-18T16:50:36Z"}, {"id": 132874, "name": "МКТ. Изменение физических величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В ходе адиабатического процесса внутренняя энергия одного моля разреженного гелия увеличивается. Как изменяются при этом\nтемпература гелия и его объём? Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|------------|\n|Температура-гелия-|О-бъём гелия|\n------------------------------|\n\" class=\"math-display\" src=\"index-ad9653c359bde16494eac4eb4bdea7fb.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку внутренняя энергия гелия увеличивается, то температура увеличивается (1).<br/>\n</p><p class=\"indent\">   Б) По первому закону термодинамики для адиабатного процесса: <img alt=\"ΔU = − A  \" class=\"math\" src=\"index-1e59d4253de68cd92771e1eb59f21c07.svg\"/>. При увеличении внутренней энергии\nидеального газа работа совершается газом отрицательная. Следовательно, происходит сжатие и объем газа уменьшается\n(2).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ad9653c359bde16494eac4eb4bdea7fb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275652/index-ad9653c359bde16494eac4eb4bdea7fb.svg", "index-1e59d4253de68cd92771e1eb59f21c07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275653/index-1e59d4253de68cd92771e1eb59f21c07.svg"}, "tags": ["Статград 20.04.2023 Физика 1"], "sources": ["CтатГрад 20.04.2023 Физика 1"], "created_at": "2025-07-30T08:01:14Z", "updated_at": "2026-04-18T16:51:22Z"}, {"id": 134186, "name": "Задача на МКТ и термодинамику. Установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунках А) и Б) приведены графики двух процессов 1–2 и 3–4, каждый из которых проводится с одним молем аргона.\nГрафики построены в координатах <img alt=\"p − V  \" class=\"math\" src=\"index-58fb556c01da81f1fa5b61304c53a019.svg\"/> и <img alt=\"V − T,  \" class=\"math\" src=\"index-360bd97d91a3ceafe572604e13bc5b20.svg\"/> где <img alt=\"p  \" class=\"math\" src=\"index-a544472f777069b86fed83f320b6de51.svg\"/> – давление, <img alt=\"V  \" class=\"math\" src=\"index-b48d45f10a9aba4cef2b866a02e84415.svg\"/> – объём и <img alt=\"T  \" class=\"math\" src=\"index-8d51830668a295e951e67efc3982a783.svg\"/> – абсолютная температура\nгаза. Установите соответствие между графиками и утверждениями, характеризующими изображённые на графиках\nпроцессы.<br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры под\nсоответствующими буквами.<br/></p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"134186_1.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Газ совершает положительную работу, так как на графике показано изобарное расширение (нагревание), внутренняя энергия\nувеличивается. Следовательно, по первому началу термодинамики <img alt=\"Q = A +ΔU  \" class=\"math\" src=\"index-827e414eade0b02c7dc5a31ee0b74846.svg\"/>, газ получает теплоту.<br/>\n</p><p class=\"indent\">   Б) На графике показано изотермическое сжатие, внутренняя энергия не изменяется, так как не изменяется температура, работа\nгаза отрицательная, тогда, по первому началу термодинамики <img alt=\"Q =A + ΔU  \" class=\"math\" src=\"index-0b2a01ddbb2d1b3e37955b678a51a9d7.svg\"/>, газ отдает теплоту.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-58fb556c01da81f1fa5b61304c53a019.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-58fb556c01da81f1fa5b61304c53a019.svg", "index-360bd97d91a3ceafe572604e13bc5b20.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-360bd97d91a3ceafe572604e13bc5b20.svg", "index-a544472f777069b86fed83f320b6de51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-a544472f777069b86fed83f320b6de51.svg", "index-b48d45f10a9aba4cef2b866a02e84415.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-b48d45f10a9aba4cef2b866a02e84415.svg", "index-8d51830668a295e951e67efc3982a783.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-8d51830668a295e951e67efc3982a783.svg", "134186_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/134186_1.png", "index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/278868/index-4e858cd9eb3df1c93be7052fe1e5b0cf.svg", "index-827e414eade0b02c7dc5a31ee0b74846.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280695/index-827e414eade0b02c7dc5a31ee0b74846.svg", "index-0b2a01ddbb2d1b3e37955b678a51a9d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280695/index-0b2a01ddbb2d1b3e37955b678a51a9d7.svg"}, "tags": ["Статград 09.12.2022 Физика 1"], "sources": ["CтатГрад 09.12.2022 Физика 1"], "created_at": "2025-08-06T13:13:19Z", "updated_at": "2026-05-18T07:52:49Z"}, {"id": 135335, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">С одним молем гелия проводят процесс <img alt=\"1− 2− 3  \" class=\"math\" src=\"index-75741c4e580169a51526c0d5fdf539cd.svg\"/>, показанный на <img alt=\"pV  \" class=\"math\" src=\"index-ed6ef4edee8e13757d44c113406cb7c5.svg\"/>-диаграмме (<img alt=\"p  \" class=\"math\" src=\"index-2a0ba92c1577251ed8a8a08a5bcf536c.svg\"/> - давление гелия, <img alt=\"V  \" class=\"math\" src=\"index-118c5eedea8aa658f2a0f19a62ed0808.svg\"/> - его объём). Начальное\nдавление гелия <img alt=\"p0  \" class=\"math\" src=\"index-71bcbbc8becb02fc830f51f0d63519dd.svg\"/> и его начальный объём <img alt=\"V0  \" class=\"math\" src=\"index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg\"/> являются известными величинами.<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"135335.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Установите соответствие между физическими величинами и формулами, выражающими их в рассматриваемой\nзадаче.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Ф изическая величина                                 Ф орм ула\nА ) работа гелия на участке 1 − 2                   1) 0,5pV\n                                                         00\n\nБ ) количество теплоты, полученное гелием на участке 2 − 3 2) 1,5p0V0\n\n                                                   3) 10p0V0\n\n\n                                                   4) 6p0V0\n\" class=\"math-display\" src=\"index-d5e3ac553e896ede7270dde7950560c2.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|А-|Б-|\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-f71b68d4a13350e7ebcd34eae895846a.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Работа газа на участке 1-2 равна площади трапеции\n</p> <div class=\"math-display\">\n<img alt=\"      p0+ 2p0\nA12 = --2---V0 = 1,5p0V0 (2)\n\" class=\"math-display\" src=\"index-826aac000ffb051733c28ad3f5582203.svg\"/></div>\n<p class=\"indent\">   Б) По первому закону термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q23 = A23+ ΔU23 =p2(V2− V1)+1,5p2(V2 − V1)= 2,5⋅2p0⋅2V0 = 10p0V0 (3)\n\" class=\"math-display\" src=\"index-b7406d3c9a55bfb976c7b5e0407dbcdf.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-75741c4e580169a51526c0d5fdf539cd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-75741c4e580169a51526c0d5fdf539cd.svg", "index-ed6ef4edee8e13757d44c113406cb7c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-ed6ef4edee8e13757d44c113406cb7c5.svg", "index-2a0ba92c1577251ed8a8a08a5bcf536c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-2a0ba92c1577251ed8a8a08a5bcf536c.svg", "index-118c5eedea8aa658f2a0f19a62ed0808.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-118c5eedea8aa658f2a0f19a62ed0808.svg", "index-71bcbbc8becb02fc830f51f0d63519dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-71bcbbc8becb02fc830f51f0d63519dd.svg", "index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg", "135335.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/135335.png", "index-d5e3ac553e896ede7270dde7950560c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-d5e3ac553e896ede7270dde7950560c2.svg", "index-f71b68d4a13350e7ebcd34eae895846a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282224/index-f71b68d4a13350e7ebcd34eae895846a.svg", "index-826aac000ffb051733c28ad3f5582203.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282225/index-826aac000ffb051733c28ad3f5582203.svg", "index-b7406d3c9a55bfb976c7b5e0407dbcdf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282225/index-b7406d3c9a55bfb976c7b5e0407dbcdf.svg"}, "tags": ["Статград 16.05.2022 Физика 1"], "sources": ["CтатГрад 16.05.2022 Физика 1"], "created_at": "2025-08-13T07:10:41Z", "updated_at": "2026-04-18T16:51:41Z"}, {"id": 135533, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">С одним молем гелия проводят процесс <img alt=\"1− 2− 3  \" class=\"math\" src=\"index-75741c4e580169a51526c0d5fdf539cd.svg\"/>, показанный на <img alt=\"pV  \" class=\"math\" src=\"index-ed6ef4edee8e13757d44c113406cb7c5.svg\"/>-диаграмме (<img alt=\"p  \" class=\"math\" src=\"index-2a0ba92c1577251ed8a8a08a5bcf536c.svg\"/> - давление гелия, <img alt=\"V  \" class=\"math\" src=\"index-118c5eedea8aa658f2a0f19a62ed0808.svg\"/> - его объём). Начальное\nдавление гелия <img alt=\"p0  \" class=\"math\" src=\"index-71bcbbc8becb02fc830f51f0d63519dd.svg\"/> и его начальный объём <img alt=\"V0  \" class=\"math\" src=\"index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg\"/> являются известными величинами.<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"135335.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Установите соответствие между физическими величинами и формулами, выражающими их в рассматриваемой\nзадаче.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Физическая величина                               Формула\nА) изменение внутренней энергии гелия на участке 1− 2 1) 4p V\n                                                    0 0\n\nБ) работа гелия на участке 2 − 3                 2) 4,5p0V0\n\n                                                3) 8p0V0\n\n\n                                                4) 1,5p0V0\n\" class=\"math-display\" src=\"index-8445fb23d2a9cfdd3bb12e3fae1a5334.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|А-|Б-|\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-f71b68d4a13350e7ebcd34eae895846a.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Изменение внутренней энергии на участке 1-2 равно\n</p> <div class=\"math-display\">\n<img alt=\"                3\nΔU12 = U2− U1 = 2(4p0V0− p0V0) =4,5p0V0 (2)\n\" class=\"math-display\" src=\"index-02b518a51c66363ca906e7e2fac135bc.svg\"/></div>\n<p class=\"indent\">   Б) Работа газа на участке 2-3, который является изобарным\n</p> <div class=\"math-display\">\n<img alt=\"A23 = p2(V3− V2)= 2p0⋅2V0 = 4p0V0 (1)\n\" class=\"math-display\" src=\"index-a241abf4c7618247c784067a5d3d16ab.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-75741c4e580169a51526c0d5fdf539cd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-75741c4e580169a51526c0d5fdf539cd.svg", "index-ed6ef4edee8e13757d44c113406cb7c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-ed6ef4edee8e13757d44c113406cb7c5.svg", "index-2a0ba92c1577251ed8a8a08a5bcf536c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-2a0ba92c1577251ed8a8a08a5bcf536c.svg", "index-118c5eedea8aa658f2a0f19a62ed0808.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-118c5eedea8aa658f2a0f19a62ed0808.svg", "index-71bcbbc8becb02fc830f51f0d63519dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-71bcbbc8becb02fc830f51f0d63519dd.svg", "index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-7e4bb2d85b98a3bfed61a799f5b6bbd5.svg", "135335.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/135335.png", "index-8445fb23d2a9cfdd3bb12e3fae1a5334.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-8445fb23d2a9cfdd3bb12e3fae1a5334.svg", "index-f71b68d4a13350e7ebcd34eae895846a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282749/index-f71b68d4a13350e7ebcd34eae895846a.svg", "index-02b518a51c66363ca906e7e2fac135bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282750/index-02b518a51c66363ca906e7e2fac135bc.svg", "index-a241abf4c7618247c784067a5d3d16ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282750/index-a241abf4c7618247c784067a5d3d16ab.svg"}, "tags": ["Статград 16.05.2022 Физика 2"], "sources": ["CтатГрад 16.05.2022 Физика 2"], "created_at": "2025-08-14T05:24:32Z", "updated_at": "2026-04-18T16:51:50Z"}, {"id": 136569, "name": "Задача на МКТ и термодинамику. Изменение величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">С одним молем идеального одноатомного газа последовательно проводят четыре различных циклических процесса, каждый\nраз измеряя совершённую за цикл работу и количество теплоты, отданное за цикл холодильнику. Этим процессам\nсоответствуют пронумерованные точки на диаграмме. Вдоль горизонтальной оси этой диаграммы откладываются КПД\nциклических процессов, а вдоль вертикальной оси – количества теплоты Q, полученной газом от нагревателя за один цикл.\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"136569.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">   Как изменится работа, совершённая газом за цикл, при переходе от цикла 1 к циклу 4? Как изменится модуль количества\nтеплоты, отдаваемой газом за цикл холодильнику, при переходе от цикла 2 к циклу 3?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины.<br/>Цифры в ответе могут повторяться.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------------------|-----------------------------------------------------------|\n|Работа газа за цикл при переходе от 1 к 4|Модуль количества теплоты, &amp;#x04\n|                                   |                                                           |\n-------------------------------------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-b64764a5c1b80e7941bcd1f552d600b4.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Работу газа за цикл найдем из формулы <img alt=\"   A-\nη = Q  \" class=\"math\" src=\"index-cffadf36de57bc66540a41fa8129851a.svg\"/>, <img alt=\"A = ηQ  \" class=\"math\" src=\"index-295c37186c560593c5e159233947bbc1.svg\"/><br/>Найдем работу в первом и в четвертом цикле:\n</p> <div class=\"math-display\">\n<img alt=\"A1 = 0,3 ⋅2 ⋅103 = 600 Дж\n\" class=\"math-display\" src=\"index-83327558c2aff6cc1d2b8320a9f76a68.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A4 = 0,6 ⋅5 ⋅103 = 300 Дж\n\" class=\"math-display\" src=\"index-d65bbcc0c1fc59b03ac8d0f9164e2bb1.svg\"/></div>\n<p class=\"indent\">   То есть, при переходе от цикла 1 к циклу 4 работа уменьшается.<br/>Б) Из формулы <img alt=\"      Q\nη = 1−-Qx  \" class=\"math\" src=\"index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg\"/> можем выразить количество теплоты, отданное холодильнику:\n</p> <div class=\"math-display\">\n<img alt=\"Qx = Q(1− η)\n\" class=\"math-display\" src=\"index-16cdad42a7946afed0134f5c716a294d.svg\"/></div>\n<p class=\"indent\">   Найдем количество теплоты, отданное холодильнику, при переходе от 2 цикла к 3:\n</p> <div class=\"math-display\">\n<img alt=\"Qx3 = 103(1− 0,5) = 500 Дж\n\" class=\"math-display\" src=\"index-77e98885b91e8d55033558204860ba24.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"         3\nQx2= 4⋅10 (1− 0,4)= 2400 Д ж\n\" class=\"math-display\" src=\"index-51574e75a76dd46863c0b7129dd2be90.svg\"/></div>\n<p class=\"indent\">   То есть, при переходе от цикла 2 к циклу 3 количество теплоты уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"136569.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/285725/136569.png", "index-b64764a5c1b80e7941bcd1f552d600b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/285725/index-b64764a5c1b80e7941bcd1f552d600b4.svg", "index-cffadf36de57bc66540a41fa8129851a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-cffadf36de57bc66540a41fa8129851a.svg", "index-295c37186c560593c5e159233947bbc1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-295c37186c560593c5e159233947bbc1.svg", "index-83327558c2aff6cc1d2b8320a9f76a68.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-83327558c2aff6cc1d2b8320a9f76a68.svg", "index-d65bbcc0c1fc59b03ac8d0f9164e2bb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-d65bbcc0c1fc59b03ac8d0f9164e2bb1.svg", "index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-78b7d4c36f8ebe2ec4b3cf496796ad85.svg", "index-16cdad42a7946afed0134f5c716a294d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-16cdad42a7946afed0134f5c716a294d.svg", "index-77e98885b91e8d55033558204860ba24.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-77e98885b91e8d55033558204860ba24.svg", "index-51574e75a76dd46863c0b7129dd2be90.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290843/index-51574e75a76dd46863c0b7129dd2be90.svg"}, "tags": ["Статград 19.10.2021 Физика 1"], "sources": ["CтатГрад 19.10.2021 Физика 1"], "created_at": "2025-08-21T15:06:02Z", "updated_at": "2026-04-18T16:52:01Z"}, {"id": 136869, "name": "СтатГрад ЕГЭ 18.10.2023 Задача на МКТ и Термодинамику. Изменение величин в процессах 1 вариант", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния одного моля идеального газа. Как изменяются\nобъём и температура газа при переходе из состояния 1 в состояние 2?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"136869.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины.<br/>Цифры в ответе могут повторяться.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|О-бъ-ём-газа-|Температура газа|\n|----------|----------------|\n----------------------------|\n\" class=\"math-display\" src=\"index-3412f04e48d510ed3595c599bd1c24cb.svg\"/></div>", "solution_html": "<p class=\"noindent\">Из графика видно, что при переходе из состояния 1 в состояние 2 объем газа увеличивается. <br/>На участке 1-2 газ подчиняется уравнению Менделеева-Клапейрона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-e998f86b866355f2a55b2c71cdc965d7.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-b6d2364858b97b36e62a43c3de94cd32.svg\"/> – объем газа, <img alt=\"ν  \" class=\"math\" src=\"index-b41a8e08444d01f6d1f9475c8b19aa5b.svg\"/> – количество вещества, <img alt=\"R  \" class=\"math\" src=\"index-c875f007852c52c4406914225e7543ea.svg\"/> – универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-c6c459cd6ed9104a51c41e664622f35a.svg\"/> – температура\nгаза. <br/>Видно, что при переходе из состояния 1 в состояние 2 давление газа увеличивается, объем газа увеличивается. Тогда в силу\nуравнения Менделеева-Клапейрона температура газа тоже будет увеличиваться.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"136869.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286380/136869.png", "index-3412f04e48d510ed3595c599bd1c24cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286380/index-3412f04e48d510ed3595c599bd1c24cb.svg", "index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg", "index-e998f86b866355f2a55b2c71cdc965d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-e998f86b866355f2a55b2c71cdc965d7.svg", "index-b6d2364858b97b36e62a43c3de94cd32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-b6d2364858b97b36e62a43c3de94cd32.svg", "index-b41a8e08444d01f6d1f9475c8b19aa5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-b41a8e08444d01f6d1f9475c8b19aa5b.svg", "index-c875f007852c52c4406914225e7543ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-c875f007852c52c4406914225e7543ea.svg", "index-c6c459cd6ed9104a51c41e664622f35a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286383/index-c6c459cd6ed9104a51c41e664622f35a.svg"}, "tags": ["СтатГрад ЕГЭ 18.10.2023 1 вариант"], "sources": ["СтатГрад ЕГЭ 18.10.2023 1 вариант"], "created_at": "2025-08-22T18:06:50Z", "updated_at": "2026-04-18T16:52:22Z"}, {"id": 136968, "name": "СтатГрад ЕГЭ 18.10.2023 Задача на МКТ и Термодинамику. Изменение величин в процессах 2 вариант", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния одного моля идеального газа. Как изменяются\nдавление и температура газа при переходе из состояния 2 в состояние 3?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"136968.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины.<br/>Цифры в ответе могут повторяться.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|Давление газа|Т-ем-пература газа\n|------------|----------------|\n------------------------------|\n\" class=\"math-display\" src=\"index-85657b79a3c7c0755b8184f1f9881e18.svg\"/></div>", "solution_html": "<p class=\"noindent\">Из графика видно, что при переходе из состояния 2 в состояние 3 давление и объем газа увеличиваются. <br/>На участке 2-3 газ подчиняется уравнению Менделеева-Клапейрона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-e998f86b866355f2a55b2c71cdc965d7.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-b6d2364858b97b36e62a43c3de94cd32.svg\"/> – объем газа, <img alt=\"ν  \" class=\"math\" src=\"index-b41a8e08444d01f6d1f9475c8b19aa5b.svg\"/> – количество вещества, <img alt=\"R  \" class=\"math\" src=\"index-c875f007852c52c4406914225e7543ea.svg\"/> – универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-c6c459cd6ed9104a51c41e664622f35a.svg\"/> – температура\nгаза. <br/>Так как давление газа и объем газа увеличиваются, то в силу уравнения Менделеева-Клапейрона температура газа тоже должна\nувеличиться.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"136968.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286605/136968.png", "index-85657b79a3c7c0755b8184f1f9881e18.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286605/index-85657b79a3c7c0755b8184f1f9881e18.svg", "index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-73ad556fb1a6b42baefd2e2b2c74d9cd.svg", "index-e998f86b866355f2a55b2c71cdc965d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-e998f86b866355f2a55b2c71cdc965d7.svg", "index-b6d2364858b97b36e62a43c3de94cd32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-b6d2364858b97b36e62a43c3de94cd32.svg", "index-b41a8e08444d01f6d1f9475c8b19aa5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-b41a8e08444d01f6d1f9475c8b19aa5b.svg", "index-c875f007852c52c4406914225e7543ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-c875f007852c52c4406914225e7543ea.svg", "index-c6c459cd6ed9104a51c41e664622f35a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286606/index-c6c459cd6ed9104a51c41e664622f35a.svg"}, "tags": ["СтатГрад ЕГЭ 18.10.2023 2 вариант"], "sources": ["СтатГрад ЕГЭ 18.10.2023 2 вариант"], "created_at": "2025-08-23T07:57:03Z", "updated_at": "2026-04-18T16:52:33Z"}, {"id": 137117, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости объёма <img alt=\"V  \" class=\"math\" src=\"index-2b7f12fa4c35b0cccd62158ba25e9b7b.svg\"/> одного моля идеального одноатомного газа от температуры <img alt=\"T  \" class=\"math\" src=\"index-2a3d5594100b4cf4dbf81584485a823b.svg\"/>.\nКак изменяются в этом процессе при переходе от состояния 1 к состоянию 2 концентрация газа и его внутренняя\nэнергия?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"137117.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|----------------------|\n|Концентрация газа|В-нутренняя-энергия-газа|\n|                |                      |\n----------------------------------------\n\" class=\"math-display\" src=\"index-ddeba018d31ce4dbf74f693cd017de05.svg\"/></div>", "solution_html": "<p class=\"noindent\">Из диаграммы следует, что давление газа постоянно. Из формулы <img alt=\"p= nkT  \" class=\"math\" src=\"index-3d90e0e7150dde88d37ce463324fb6ce.svg\"/> следует, что <img alt=\"    -p-\nn = kT  \" class=\"math\" src=\"index-b10eb9a10903c35abeecc1335a36670a.svg\"/>. При увеличении температуры\nконцентрация молекул уменьшается (2).<br/>Внутренняя энергия одноатомного идеального газа <img alt=\"U = 3 νRT\n    2  \" class=\"math\" src=\"index-9e0ad5c39e7a3fb88ea74c398059f7a9.svg\"/>, откуда при увеличении температуры внутренняя энергия\nувеличивается (1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2b7f12fa4c35b0cccd62158ba25e9b7b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286987/index-2b7f12fa4c35b0cccd62158ba25e9b7b.svg", "index-2a3d5594100b4cf4dbf81584485a823b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286987/index-2a3d5594100b4cf4dbf81584485a823b.svg", "137117.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286987/137117.png", "index-ddeba018d31ce4dbf74f693cd017de05.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286987/index-ddeba018d31ce4dbf74f693cd017de05.svg", "index-3d90e0e7150dde88d37ce463324fb6ce.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286988/index-3d90e0e7150dde88d37ce463324fb6ce.svg", "index-b10eb9a10903c35abeecc1335a36670a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286988/index-b10eb9a10903c35abeecc1335a36670a.svg", "index-9e0ad5c39e7a3fb88ea74c398059f7a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286988/index-9e0ad5c39e7a3fb88ea74c398059f7a9.svg"}, "tags": ["Статград 20.12.2021 Физика 1"], "sources": ["CтатГрад 20.12.2021 Физика 1"], "created_at": "2025-08-24T08:16:00Z", "updated_at": "2026-04-28T11:39:05Z"}, {"id": 137119, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости давления <img alt=\"p  \" class=\"math\" src=\"index-5d6597f5265658cddffaa9dfc42dbae3.svg\"/> одного моля идеального одноатомного газа от температуры <img alt=\"T  \" class=\"math\" src=\"index-f54c609c9ffbbdc355da62af5e1254c0.svg\"/>. Как\nизменяются в этом процессе при переходе от состояния 1 к состоянию 2 плотность газа и средняя кинетическая энергия теплового\nдвижения его молекул?<br/>Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"137119.png\" width=\"315\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|К-онцентрация-газа-|---В-нутренняя-энергия-газа----|\n|                 |                            |\n|-----------------|теплового движ-ения-молекул газа\n------------------------------------------------\n\" class=\"math-display\" src=\"index-f0d94183d63368108ede23520f05dff6.svg\"/></div>", "solution_html": "<p class=\"noindent\">Из диаграммы следует, что объем газа постоянный. При неизменных массе и объеме плотность не меняется (3).<br/>Средняя кинетическая энергия теплового движения молекул одноатомного идеального газа <img alt=\"-- 3\nE = 2 kT  \" class=\"math\" src=\"index-0c0d92d3c522b9caabcab0e4bb35d825.svg\"/>, откуда при увеличении\nтемпературы средняя кинетическая энергия молекул увеличивается (1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5d6597f5265658cddffaa9dfc42dbae3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286990/index-5d6597f5265658cddffaa9dfc42dbae3.svg", "index-f54c609c9ffbbdc355da62af5e1254c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286990/index-f54c609c9ffbbdc355da62af5e1254c0.svg", "137119.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286990/137119.png", "index-f0d94183d63368108ede23520f05dff6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286990/index-f0d94183d63368108ede23520f05dff6.svg", "index-0c0d92d3c522b9caabcab0e4bb35d825.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286991/index-0c0d92d3c522b9caabcab0e4bb35d825.svg"}, "tags": ["Статград 20.12.2021 Физика 2"], "sources": ["CтатГрад 20.12.2021 Физика 2"], "created_at": "2025-08-24T08:21:00Z", "updated_at": "2026-04-18T16:52:57Z"}, {"id": 138148, "name": "Задача на МКТ и Термодинамику. Изменение величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится вещество в твёрдом агрегатном состоянии. Цилиндр поместили в раскалённую печь. На рисунке\nпоказан график зависимости температуры <img alt=\"  \" class=\"math\" src=\"index-565ea80e4ee937efe6f2307ab47e6a2c.svg\"/> этого вещества от поглощенного им количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-680dab5e8a01062beac65abc088ee5fc.svg\"/>. Какие участки графика\nсоответствуют нагреванию вещества в газообразном состоянии и плавлению вещества?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"138148.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Установите соответствие между тепловыми процессами и участками графика.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ТЕ ПЛО ВОЙ П РОЦ ЕСС                       УЧ АСТО К ГРАФ ИКА\nА) нагревание вещества в газообразном состоянии 1) 1\nБ) плавление вещ ества                       2) 2\n\n                                           3) 3\n                                           4) 4\n\" class=\"math-display\" src=\"index-c95d08a743bfac7ffb168126b20acfc7.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|A-|Б-|\n-------\n\" class=\"math-display\" src=\"index-10b757bb3e1351a687a18f0bac90e0ad.svg\"/></div>", "solution_html": "<p class=\"noindent\">Поскольку изначально тело находилось в твердом состоянии, то участок до 1 (поскольку температура возрастает) соответствует\nнагреванию твердого тела. Участок 1 характеризуется постоянной температурой и происходит после нагревания тела, поэтому\nэто участок плавления. Участок 2 расположен после участка плавления, то есть тело расплавилось и находится\nв жидком состоянии, поэтому это нагревания жидкости. Участок 3 характеризуется постоянной температурой и\nпроисходит после нагревания тела в жидком состоянии, поэтому это участок испарения. Участок 4 расположен\nпосле участка испарения, то есть тело испарилось и находится в газообразном состоянии, поэтому это нагревания\nгаза.<br/>А) Нагреванию вещества в газообразном состоянии соответствует участок 4.<br/>Б) Плавлению вещества соответствует участок 1.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-565ea80e4ee937efe6f2307ab47e6a2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289234/index-565ea80e4ee937efe6f2307ab47e6a2c.svg", "index-680dab5e8a01062beac65abc088ee5fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289234/index-680dab5e8a01062beac65abc088ee5fc.svg", "138148.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289234/138148.png", "index-c95d08a743bfac7ffb168126b20acfc7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289234/index-c95d08a743bfac7ffb168126b20acfc7.svg", "index-10b757bb3e1351a687a18f0bac90e0ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289234/index-10b757bb3e1351a687a18f0bac90e0ad.svg"}, "tags": ["Статград 07.12.2023 Физика 1"], "sources": ["CтатГрад 07.12.2023 Физика 1"], "created_at": "2025-08-27T15:52:28Z", "updated_at": "2026-05-09T13:10:30Z"}, {"id": 138149, "name": "Задача на МКТ и Термодинамику. Изменение величин в процессах", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находится вещество в твёрдом агрегатном состоянии. Цилиндр поместили в раскалённую печь. На рисунке\nпоказан график зависимости температуры <img alt=\"  \" class=\"math\" src=\"index-565ea80e4ee937efe6f2307ab47e6a2c.svg\"/> этого вещества от поглощенного им количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-680dab5e8a01062beac65abc088ee5fc.svg\"/>. Какие участки графика\nсоответствуют нагреванию вещества в жидком состоянии и кипению жидкости?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"138148.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Установите соответствие между тепловыми процессами и участками графика.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"Т ЕПЛО ВОЙ П РОЦ ЕСС                   УЧА СТО К ГРАФИ КА\nА ) нагревание вещества в жидком состоянии 1) 1\nБ ) кипение жидкости                    2) 2\n                                       3) 3\n\n                                       4) 4\n\" class=\"math-display\" src=\"index-032d4ee6f82fe4a093fad54e49efbe41.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|A-|Б-|\n-------\n\" class=\"math-display\" src=\"index-6b132f0a05ec63bb194e4f5f13030da0.svg\"/></div>", "solution_html": "<p class=\"noindent\">Поскольку изначально тело находилось в твердом состоянии, то участок до 1 (поскольку температура возрастает) соответствует\nнагреванию твердого тела. Участок 1 характеризуется постоянной температурой и происходит после нагревания тела, поэтому\nэто участок плавления. Участок 2 расположен после участка плавления, то есть тело расплавилось и находится\nв жидком состоянии, поэтому это нагревания жидкости. Участок 3 характеризуется постоянной температурой и\nпроисходит после нагревания тела в жидком состоянии, поэтому это участок испарения. Участок 4 расположен\nпосле участка испарения, то есть тело испарилось и находится в газообразном состоянии, поэтому это нагревания\nгаза.<br/>А) Нагревание вещества в жидком состоянии происходило на участке 2.<br/>Б) Кипение жидкости (парообразование) происходило на участке 3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-565ea80e4ee937efe6f2307ab47e6a2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289237/index-565ea80e4ee937efe6f2307ab47e6a2c.svg", "index-680dab5e8a01062beac65abc088ee5fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289237/index-680dab5e8a01062beac65abc088ee5fc.svg", "138148.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289237/138148.png", "index-032d4ee6f82fe4a093fad54e49efbe41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289237/index-032d4ee6f82fe4a vg\"/>.\nВ точке 2 – давление <img alt=\"p  \" class=\"math\" src=\"index-b81b477144fd9ccf1d22e12b93efb0c8.svg\"/> и объем <img alt=\"4V  \" class=\"math\" src=\"index-c747e1db03a1ef37ad0a43afee97cf23.svg\"/>. Как можно заметить, объем в процессе 1-2 увеличился, значит работа положительна <img alt=\" A &gt; 0  \" class=\"math\" src=\"index-0737af562c40f60e91bb296dbb65a0ca.svg\"/>.\n<br/>Запишем уравнение состояния идеального газа\n</p> <div class=\"math-display\">\n<img alt=\"pV-= const. (1)\n T\n\" class=\"math-display\" src=\"index-c9203503e1a38df2f99c3bf67e53a356.svg\"/></div>\n<p class=\"indent\">   Из (1) для точки 1 получим: <img alt=\"4pV-\n T1 = const  \" class=\"math\" src=\"index-9f5b070213eef9a8c907858cf2e84ceb.svg\"/>. Для 2 точки имеем: <img alt=\"p4V-\n T2 = const  \" class=\"math\" src=\"index-607e0a385bf3357e6815391db7e211fb.svg\"/>. Можно заметить, что эти выражения\nидентичные, значит <img alt=\"T1 = T2 =T  \" class=\"math\" src=\"index-42576374ed47a7d21798c0f790b7a36e.svg\"/>. В ходе процесса температура неизменна, следовательно, <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-478075accef94ffb966e19cd753732de.svg\"/>. Ответ – 1.\n<br/>Б) Это график изобарного процесса, т.е. <img alt=\"p= const  \" class=\"math\" src=\"index-7a07d805eed7045897ad69ec7ea28602.svg\"/>. Температура увеличивается, следовательно, <img alt=\"ΔU &gt; 0  \" class=\"math\" src=\"index-c80344ccb6c66baf99cd21cd333b4fdc.svg\"/>. Объем увеличивается,\nследовательно, <img alt=\"A &gt; 0  \" class=\"math\" src=\"index-364567204f63de74c92856cd9e3d4373.svg\"/>. Ответ – 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-da49b229e2d1ac9ae441260e25cd4d48.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290252/index-da49b229e2d1ac9ae441260e25cd4d48.svg", "index-6811d1e1b52fa1429ad8459e6f9a7f71.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290252/index-6811d1e1b52fa1429ad8459e6f9a7f71.svg", "138600_1.png": "https://3.shkolkovo ля и холодильника оставляют\nпрежними.<br/>Определите, как в результате этого изменятся работа, совершаемая над газом при адиабатическом сжатии, и КПД тепловой\nмашины.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится;<br/>2) уменьшится;<br/>3) не изменится.<br/>Запишите в таблицу выбранные цифры для каждой физической величины.<br/>Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|Работа, совершаемая над-газом-при адиабатическом-сжатии|КПД----------------\n|--------------------------------------------------|--------------------|\n-------------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-bfd2ad776e7a49a3094236f0a7e3f0fc.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) При адиабатном расширении одноатомного идеального газа <img alt=\"            3\nA =− ΔU = − 2νRΔT  \" class=\"math\" src=\"index-421899ee22fefe6b0328bbe6a188b98f.svg\"/>. Изменение температуры одинаково,\nколичество вещества уменьшилось, следовательно, работа при расширении уменьшилась.<br/>2) КПД тепловой машины равно <img alt=\"η = 1− Tx\n       Tн  \" class=\"math\" src=\"index-995e487f809b2f10da195f0dc1ee2999.svg\"/>. Так как температуры холодильника и нагревателя не меняются, то КПД остается\nпрежним.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bfd2ad776e7a49a3094236f0a7e3f0fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291384/index-bfd2ad776e7a49a3094236f0a7e3f0fc.svg", "index-421899ee22fefe6b0328bbe6a188b98f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/294993/index-421899ee22fefe6b0328bbe6a188b98f.svg", "index-995e487f809b2f10da195f0dc1ee2999.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/294993/index-995e487f809b2f10da195f0dc1ee2999.svg"}, "tags": ["Статград 01.04.2021 Физика 2"], "sources": ["CтатГрад 01.04.2021 Физика 2"], "created_at": "2025-08-31T11:21:12Z", "updated_ "math-display\" src=\"index-478aeef1662bd78d541347780e187ced.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Процесс 1-2 – изотермический, т.е. <img alt=\"T = const  \" class=\"math\" src=\"index-504d1172510bbc3d5b3040887b721cc2.svg\"/> <img alt=\"⇒  ΔU = 0  \" class=\"math\" src=\"index-f10166bbde39933d108239966c73467a.svg\"/>. Процесс 2-3 – изохорный, следовательно, <img alt=\"A =0  \" class=\"math\" src=\"index-4cccef39b73d07b48d7e6b31778f2022.svg\"/>. Процесс 3-1 –\nизобарный. <br/>Из всех утверждений, указанных в условии задачи, подходит только 1. <br/>Б) Процесс 1-2 – изохорный. Процесс 2-3 – изотермический, т.е. <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-f5c96de5b48ccf05baa691ebd56ea7e2.svg\"/>. Процесс 3-1 – изобарный. <br/>Из всех утверждений, указанных в условии задачи, подходит только 4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"141131_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296157/141131_2.png", "index-478aeef1662bd78d541347780e187ced.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296157/index-478aeef1662bd78d541347780e187ced.svg", "index-504d1172510bbc3d5b3040887b721cc2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296158/index-504d1172510bbc3d5b3040887b721cc2.svg", "index-f10166bbde39933d108239966c73467a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296158/index-f10166bbde39933d108239966c73467a.svg", "index-4cccef39b73d07b48d7e6b31778f2022.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296158/index-4cccef39b73d07b48d7e6b31778f2022.svg", "index-f5c96de5b48ccf05baa691ebd56ea7e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296158/index-f5c96de5b48ccf05baa691ebd56ea7e2.svg"}, "tags": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "sources": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "created_at": "2025-09-11T09:38:38Z", "updated_at": "2026-05-27T13:22:07Z"}, {"id": 141699, "name": "СтатГрад ЕГЭ 14.12.2020 МКТ и Термодинамика. Изменение величин в процессах 1 вариант", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В таблице изображены графики зависимостей внутренней энергии <img alt=\"U  \" class=\"math\" src=\"index-e0eaf00a92db3aa7d75b555e44362b88.svg\"/> идеального газа от его объёма <img alt=\"V  \" class=\"math\" src=\"index-331cd87546451b4d9ec98a49ac1ba698.svg\"/>, а также среднего значения\nквадрата скорости хаотического движения молекул идеального газа от его давления <img alt=\"p  \" class=\"math\" src=\"index-738d395aa2bdaccf92c4b4401107aaea.svg\"/>. В обоих случаях количество газа является\nпостоянным. <br/>Установите соответствие между графиками и названиями термодинамических процессов, в которых участвует газ.\n<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"141699.png\" width=\"315\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-41b22acf5967177109e1111abb948e86.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) По вертикальной оси отложена внутренняя энергия, следовательно, можно считать, что по вертикальной оси отложена\nтемпература. По горизонтальной оси отложен объем. Вспоминая графики термодинамических процессов, можем легко установить,\nчто это изобарный процесс, так как он исходит из начала координат. <br/>Б) По вертикальной оси отоложен средний квадрат скорости теплового движения молекул газа, следовательно, по вертикальной оси\nотложена температура. По горизонтальной оси отложено давление. Легко определяем, что это изохорный процесс, так как он\nисходит из начала координат.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e0eaf00a92db3aa7d75b555e44362b88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297379/index-e0eaf00a92db3aa7d75b555e44362b88.svg", "index-331cd87546451b4d9ec98a49ac1ba698.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297379/index-331cd87546451b4d9ec98a49ac1ba698.svg", "index-738d395aa2bdaccf92c4b4401107aaea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297379/index-738d395aa2bdaccf92c4b4401107aaea.svg", "141699.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297379/141699.png", "index-41b22acf5967177109e1111abb948e86.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297379/index-41b22acf5967177109e1111abb948e86.svg"}, "tags": ["СтатГрад ЕГЭ 14.12.2020 1 вариант"], "sources": ["СтатГрад ЕГЭ 14.12.2020 1 вариант"], "created_at": "2025-09-14T09:34:54Z", "updated_at": "2026-05-18T07:37:52Z"}, {"id": 143451, "name": "СтатГрад ЕГЭ 14.12.2020 МКТ и Термодинамика. Изменение величин в процессах 2 вариант", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В таблице изображены графики зависимостей внутренней энергии <img alt=\"U  \" class=\"math\" src=\"index-e0edddb16b769252c08e4ab8299be12b.svg\"/> идеального газа от его давления <img alt=\"p  \" class=\"math\" src=\"index-e169f1614d1d3b9f1fc7bbcb7bb6fe91.svg\"/>, а также среднего\nзначения квадрата скорости хаотического движения молекул идеального газа от его обратной плотности. В обоих случаях\nколичество газа является постоянным. <br/>Установите соответствие между графиками и названиями термодинамических процессов, в которых участвует газ.\n<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"143451.png\" width=\"315\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-41b22acf5967177109e1111abb948e86.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) По вертикальной оси отложена внутренняя энергия, следовательно, можно считать, что по вертикальной оси отложена\nтемпература. По горизонтальной оси отложено давление. Вспоминая графики термодинамических процессов, можем легко\nустановить, что это изохорный процесс, так как он исходит из начала координат. <br/>Б) По вертикальной оси отоложен средний квадрат скорости теплового движения молекул газа, следовательно, по вертикальной оси\nотложена температура. По горизонтальной оси отложена велична обратная плотности идеального газа. Вспомним формулу для\nсреднего квадрата скорости теплового движения молекул газа:\n</p> <div class=\"math-display\">\n<img alt=\"-2  3kT   3RT\nv = -m--= -μ--,\n\" class=\"math-display\" src=\"index-edf0c0d909cbf7d7c0f6b585f60ba0f7.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-c0b2586205dbd3d6c7d1641fb1438353.svg\"/> – постоянная Больцмана, <img alt=\"R  \" class=\"math\" src=\"index-d39564cff34edef33ae8f3f2201673f1.svg\"/> – универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-e0a9d23f8c6bc889787789319d23686b.svg\"/> – абсолютная температура, <img alt=\"m  \" class=\"math\" src=\"index-376b9d3e69dfe8768aa879444325ff46.svg\"/> – масса газа, <img alt=\"   μ  \" class=\"math\" src=\"index-9a972cef14187a83bd92e6346dc7a808.svg\"/> –\nмолярная масса газа. <br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"     m-\npV = μ RT.\n\" class=\"math-display\" src=\"index-ce9ad79be9500872e29af0842c612903.svg\"/></div>\n<p class=\"indent\">   Выразим из него величину <img alt=\"RT    pV\n-μ- = m--  \" class=\"math\" src=\"index-635b4e7dcb30e74dea25666db5
