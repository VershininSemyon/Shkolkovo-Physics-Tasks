вете могут повторяться.\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-0e2c8a451107eb16d7c3c1f9b9a6a484.svg\"/></div>", "solution_html": "<p class=\"noindent\">КПД цикла Карно равен\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-f58fbad1174662a3473bcb9172d5048a.svg\"/></div>\n<p class=\"indent\">   Температура нагревателя увеличилась, температура холодильника не изменилась, следовательно, отношение <img alt=\"Tхол\nTнаг  \" class=\"math\" src=\"index-dfce89fd86bd74f2018f0dd418580f53.svg\"/> уменьшилось,\nа КПД увеличился.\n</p><p class=\"indent\">   Для цикла Карно\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-edb16cbf5390404fb21ed4f5aeb1f137.svg\"/></div>\n<p class=\"indent\">   При увеличении <img alt=\"Tнаг  \" class=\"math\" src=\"index-ed1a9e33f8c4cdfcfdbcc9b9c6648c2b.svg\"/> и неизменном <img alt=\"Tхол  \" class=\"math\" src=\"index-c2199a7b0ef815c985edbad7da25cc5b.svg\"/> отношение <img alt=\"Qхол-\nQнаг  \" class=\"math\" src=\"index-c9a56d18c304e6b98bea12bfcf38180b.svg\"/> уменьшается. Так как <img alt=\"Qхол  \" class=\"math\" src=\"index-ab30f86e5065595d9dd1288bf68e8ba7.svg\"/> по условию не изменилось, то <img alt=\"  Qнаг  \" class=\"math\" src=\"index-dce4cae955505d029cc677012e8e2301.svg\"/>\nувеличилось.\n</p><p class=\"indent\">   Работа газа за цикл:\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-5de480bdf2fa4b7bd15a7f421650437a.svg\"/></div>\n<p class=\"indent\">   Следовательно, работа за цикл тоже увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0e2c8a451107eb16d7c3c1f9b9a6a484.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418221/index-0e2c8a451107eb16d7c3c1f9b9a6a484.svg", "index-f58fbad1174662a3473bcb9172d5048a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418222/index-f58fbad1174662a3473bcb9172d5048a.svg", "index-dfce89fd86bd74f2018f0dd418580f53.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418222/index-df ины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|----------|\n|К ПД тепловой |Работа газа\n|   машины    |  за цикл |\n|-------------|----------|\n--------------------------\n\" class=\"math-display\" src=\"index-544738941d73b19932bdc718a1f846c9.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру холодильника повысили, а нагревателя не изменили, то КПД уменьшился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"    A-\nη = Q\n\" class=\"math-display\" src=\"index-a472a0b7b073acd8e7fb2950abbd2f91.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя за цикл, не изменилось, то работа газа уменьшилась\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-544738941d73b19932bdc718a1f846c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28325/index-544738941d73b19932bdc718a1f846c9.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28326/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28326/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28326/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-a472a0b7b073acd8e7fb2950abbd2f91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28326/index-a472a0b7b073acd8e7fb2950abbd2f91.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2018", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демоверсия 2018"], "created_at": "2021-12-10T09:15:14Z", "updated_at": "2026-04-28T11:40:51Z"}, {"id": 178846, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">При постоянной температуре объём сосуда с одноатомным идеальным газом увеличили в 2 раза и количество газа в\nсосуде увеличили в 2 раза. Как изменились в результате этого давление газа в сосуде и его внутренняя энергия?\n<br/>Для каждой величины определите соответствующий характер её изменения: <br/>1) увеличилась <br/>2) уменьшилась <br/>3) не изменилась <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|------------|------------------|\n|Давление газа|В нутренняя энергия|\n|--в-сосуде---|---газа в-сосуде---|\n|            |                  |\n---------------------------------\n\" class=\"math-display\" src=\"index-49fde5d8f8d739250b439696d33ef1c5.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия газа определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT.\n\" class=\"math-display\" src=\"index-793cd671c48fae6e38da65224bf547d2.svg\"/></div>\n<p class=\"indent\">   Так как температура постоянна, а количество газа <img alt=\"ν  \" class=\"math\" src=\"index-a213bf4dae8f611cf697bf628303bf94.svg\"/> увеличили в 2 раза, то и внутренняя энергия увеличилась в 2 раза.\n<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT.\n\" class=\"math-display\" src=\"index-e4384fcb1989224bf2222b7cb3a5c8a9.svg\"/></div>\n<p class=\"indent\">   Тогда давление газа <img alt=\"p  \" class=\"math\" src=\"index-7e33945225ced08a8801c9ddb64b2b6c.svg\"/> будет равняться:\n</p> <div class=\"math-display\">\n<img alt=\"p= νRT-.\n     V\n\" class=\"math-display\" src=\"index-1e2651cd93a822b88121794d700dd761.svg\"/></div>\n<p class=\"indent\">   Объём <img alt=\"V  \" class=\"math\" src=\"index-cd5c91f8aa4b9dc549166de40d58dc8e.svg\"/> увеличили в 2 раза, а количество газа <img alt=\"ν  \" class=\"math\" src=\"index-131d615084ddf537b1007fe5d4a2aad4.svg\"/> тоже увеличили в 2 раза. Следовательно, давление газа не\nизменилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-49fde5d8f8d739250b439696d33ef1c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390127/index-49fde5d8f8d739250b439696d33ef1c5.svg", "index-793cd671c48fae6e38da65224bf547d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-793cd671c48fae6e38da65224bf547d2.svg", "index-a213bf4dae8f611cf697bf628303bf94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-a213bf4dae8f611cf697bf628303bf94.svg", "index-e4384fcb1989224bf2222b7cb3a5c8a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-e4384fcb1989224bf2222b7cb3a5c8a9.svg", "index-7e33945225ced08a8801c9ddb64b2b6c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-7e33945225ced08a8801c9ddb64b2b6c.svg", "index-1e2651cd93a822b88121794d700dd761.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-1e2651cd93a822b88121794d700dd761.svg", "index-cd5c91f8aa4b9dc549166de40d58dc8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-cd5c91f8aa4b9dc549166de40d58dc8e.svg", "index-131d615084ddf537b1007fe5d4a2aad4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390128/index-131d615084ddf537b1007fe5d4a2aad4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГКР 21.12.2023-2"], "created_at": "2026-04-20T17:39:23Z", "updated_at": "2026-04-20T17:44:37Z"}, {"id": 158958, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В тепловом двигателе, работающем по циклу Карно, температуру холодильника повысили. Температура нагревателя и количество\nтеплоты, сообщённое нагревателем рабочему телу за цикл, остались прежними. Как изменились при этом количество теплоты,\nотданное рабочим телом холодильнику за цикл, и КПД теплового двигателя? <br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------------|----------------------|\n|Количество теплоты, отданное |КПД теплового двигателя |\n|   холодильнику за цикл   |                      |\n|--------------------------|----------------------|\n---------------------------------------------------\n\" class=\"math-display\" src=\"index-d49f3d332ed8d9bd9703541627d7a693.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Количество теплоты, отданное холодильнику за цикл зависит от температуры холодильника, а значит оно увеличится (ответ - 1).\n<br/>2) КПД тепловой машины Карно равно:\n</p> <div class=\"math-display\">\n<img alt=\"η = 1− Tх\n      Tн\n\" class=\"math-display\" src=\"index-f673665902f6111527a532cecef2d640.svg\"/></div>\n<p class=\"indent\">   Так как температуру холодильника увеличили, значит КПД уменьшилось (ответ - 2).<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d49f3d332ed8d9bd9703541627d7a693.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338910/index-d49f3d33 h\" src=\"index-bed35293f79414b91b764265af6d1c4a.svg\"/> - давление на газ со стороны поршня. Так как эти величины не меняются, то и давление газа\n<img alt=\"P  \" class=\"math\" src=\"index-e48a5124169139be5379c75037f02f76.svg\"/> не изменится (ответ - 3).<br/>Б) По условию температура уменьшается. В изобарном процессе, по закону Гей-Люссака <img alt=\"(V-= const)\n T  \" class=\"math\" src=\"index-b92bbd85b0679362032d9f8f7d245758.svg\"/>, с уменьшением температуры\nуменьшается и объем. Плотность обратно пропорциональна объему <img alt=\"    m\n(ρ = V-)  \" class=\"math\" src=\"index-98aa0bd271d77038230752cba3810565.svg\"/>, значит, плотность газа увеличится (ответ -\n1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14053.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379686/14053.png", "index-bd227453211dc68156c42df82d8f8cd4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379686/index-bd227453211dc68156c42df82d8f8cd4.svg", "index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg", "index-7b8067163bf2651b1ed6f873865d1d32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-7b8067163bf2651b1ed6f873865d1d32.svg", "index-bed35293f79414b91b764265af6d1c4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-bed35293f79414b91b764265af6d1c4a.svg", "index-e48a5124169139be5379c75037f02f76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-e48a5124169139be5379c75037f02f76.svg", "index-b92bbd85b0679362032d9f8f7d245758.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-b92bbd85b0679362032d9f8f7d245758.svg", "index-98aa0bd271d77038230752cba3810565.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379687/index-98aa0bd271d77038230752cba3810565.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГКР 956 Физика 26.03.2026"], "created_at": "2026-03-26T08:32:42Z", "updated_at": "2026-05-20T15:58:09Z"}, {"id": 159032, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В тепловом двигателе, работающем по циклу Карно, температуру холодильника понизили. Температура нагревателя и количество\nтеплоты, сообщённое нагревателем рабочему телу за цикл, остались прежними. Как изменились при этом количество теплоты,\nотданное рабочим телом холодильнику за цикл, и КПД теплового двигателя? <br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------------|----------------------|\n|Количество теплоты, отданное |КПД теплового двигателя |\n|   холодильнику за цикл   |                      |\n|--------------------------|----------------------|\n---------------------------------------------------\n\" class=\"math-display\" src=\"index-d49f3d332ed8d9bd9703541627d7a693.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Количество теплоты, отданное холодильнику за цикл зависит от температуры холодильника, а значит оно уменьшится (ответ - 2).\n<br/>2) КПД тепловой машины Карно равно:\n</p> <div class=\"math-display\">\n<img alt=\"η = 1− Tх\n      Tн\n\" class=\"math-display\" src=\"index-f673665902f6111527a532cecef2d640.svg\"/></div>\n<p class=\"indent\">   Так как температуру холодильника уменьшили, значит КПД увеличился (ответ - 1).<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d49f3d332ed8d9bd9703541627d7a693.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339100/index-d49f3d332ed8d9bd9703541627d7a693.svg", "index-f673665902f6111527a532cecef2d640.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339101/index-f673665902f6111527a532cecef2d640.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["ЕГКР 18.12.25"], "created_at": "2025-12-19T15:11:15Z", "updated_at": "2026-04-18T16:47:05Z"}, {"id": 175125, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В вертикальном цилиндрическом сосуде под поршнем находится газ. Поршень не закреплён и может перемещаться в сосуде без\nтрения (см. рисунок). Газ в сосуде охлаждают на 25 К. Как изменяются в результате этого давление газа и концентрация его\nмолекул? Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14053.png\" width=\"157\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|------------------------|\n|Давление газа|К-онцентрация м-олекул-газа|\n---------------------------------------\n\" class=\"math-display\" src=\"index-de8b882ab8a4ba17ac13fa01ad817b94.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку поршень не закреплён, то условие равновесия для поршня выглядит так:\n</p> <div class=\"math-display\">\n<img alt=\"        mg\nP = P0 + S-\n\" class=\"math-display\" src=\"index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"P0  \" class=\"math\" src=\"index-7b8067163bf2651b1ed6f873865d1d32.svg\"/> - давление атмосферы, <img alt=\"mg\n-S-  \" class=\"math\" src=\"index-bed35293f79414b91b764265af6d1c4a.svg\"/> - давление на газ со стороны поршня. Так как эти величины не меняются, то и давление газа\n<img alt=\"P  \" class=\"math\" src=\"index-e48a5124169139be5379c75037f02f76.svg\"/> не изменится (ответ - 3).<br/>Б) Так как процесс изобарный, то выполняется закон Гей-Люссака: <img alt=\"V-= const\nT  \" class=\"math\" src=\"index-45d0d91ad478c4887b41164b64d1d4b2.svg\"/>, - так как температура уменьшается, то и объём газа\nбудет уменьшаться. Концентрация газа равняется <img alt=\"   N\nn= V-  \" class=\"math\" src=\"index-7ea71d945f1f15a2dfbef3a4294b02a1.svg\"/>, так как объём уменьшается, то <img alt=\"n  \" class=\"math\" src=\"index-ea2d809d914ab989c9766c6252380673.svg\"/> будет увеличиваться (ответ -\n1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14053.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379705/14053.png", "index-de8b882ab8a4ba17ac13fa01ad817b94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379705/index-de8b882ab8a4ba17ac13fa01ad817b94.svg", "index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg", "index-7b8067163bf2651b1ed6f873865d1d32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-7b8067163bf2651b1ed6f873865d1d32.svg", "index-bed35293f79414b91b764265af6d1c4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-bed35293f79414b91b764265af6d1c4a.svg", "index-e48a5124169139be5379c75037f02f76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-e48a5124169139be5379c75037f02f76.svg", "index-45d0d91ad478c4887b41164b64d1d4b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-45d0d91ad478c4887b41164b64d1d4b2.svg", "index-7ea71d945f1f15a2dfbef3a4294b02a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-7ea71d945f1f15a2dfbef3a4294b02a1.svg", "index-ea2d809d914ab989c9766c6252380673.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379706/index-ea2d809d914ab989c9766c6252380673.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГКР 955 Физика 26.03.2026"], "created_at": "2026-03-26T09:24:04Z", "updated_at": "2026-04-18T16:27:51Z"}, {"id": 158784, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В тепловом двигателе, работающем по циклу Карно, температуру холодильника повысили. Температура нагревателя и количество\nтеплоты, сообщённое нагревателем рабочему телу за цикл, остались прежними. Как изменились при этом КПД теплового двигателя\nи работа теплового двигателя за цикл?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------------|------------------------|\n|КП Д теплового двигателя|Работа теплового двигателя|\n|                      |        за цикл         |\n|----------------------|------------------------|\n------------------------------------------------|\n\" class=\"math-display\" src=\"index-183f39a7fb77de54b041ffb64f40039b.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) КПД тепловой машины Карно равно:\n</p> <div class=\"math-display\">\n<img alt=\"      Tх\nη = 1− Tн\n\" class=\"math-display\" src=\"index-e840918b8b47c9a07b68ab9ebe146362.svg\"/></div>\n<p class=\"indent\">   Так температуру холодильника увеличили, значит КПД уменьшилось (ответ - 2).<br/>2) КПД можно вычислить как отношение работы за цикл к количеству теплоты, полученному от нагревателя:\n</p> <div class=\"math-display\">\n<img alt=\"η =-A-\n   Q+\n\" class=\"math-display\" src=\"index-2741f3bd928eb60b3cbb9a855e53673b.svg\"/></div>\n<p class=\"indent\">   Откуда работа:\n</p> <div class=\"math-display\">\n<img alt=\"A = ηQ+\n\" class=\"math-display\" src=\"index-3ab02350ae85df72e3a894739f9531ae.svg\"/></div>\n<p class=\"indent\">   Если КПД уменьшается, а параметры нагревателя не изменяются, то работа за цикл уменьшается (ответ - 2).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-183f39a7fb77de54b041ffb64f40039b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338427/index-183f39a7fb77de54b041ffb64f40039b.svg", "index-e840918b8b47c9a07b68ab9ebe146362.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338428/index-e840918b8b47c9a07b68ab9ebe146362.svg", "index-2741f3bd928eb60b3cbb9a855e53673b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338428/index-2741f3bd928eb60b3cbb9a855e53673b.svg", "index-3ab02350ae85df72e3a894739f9531ae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338428/index-3ab02350ae85df72e3a894739f9531ae.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["ЕГКР 18.12.25"], "created_at": "2025-12-18T10:12:09Z", "updated_at": "2026-04-18T16:47:14Z"}, {"id": 96095, "name": "Задача на МКТ и термодинамику. Изменение физических величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под поршнем находится газ. Поршень может перемещаться в сосуде без трения. Из сосуда медленно\nвыпускается половина массы газа при неизменной температуре. Как изменятся в результате этого объём газа и сила, действующая\nна поршень со стороны газа?\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"96095_1.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|------------------------|\n|Объём газа |    Сила, действующ ая   |\n|----------|на-порш-ень со стороны-газа\n------------------------------------|\n\" class=\"math-display\" src=\"index-f91392771c6c589bb4aeeac665c4e7d2.svg\"/></div>", "solution_html": "<p class=\"noindent\">Расставив все силы, действующие на поршень, можно увидеть, что сила тяжести и сила атмосферного давления уравновешивают\nсилу давления газа, но эти силы неизменны, следовательно, сила давления и само давление постоянны.<br/>Выразим объем из уравнения Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"V = mRT--\n    Mp\n\" class=\"math-display\" src=\"index-f655b4d70ff32de59cd76ad925c26126.svg\"/></div>\n<p class=\"indent\">   Учитывая, что температура и давление постоянны, а масса газа уменьшается, то можно сделать вывод, что объем\nуменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"96095_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195849/96095_1.png", "index-f91392771c6c589bb4aeeac665c4e7d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195849/index-f91392771c6c589bb4aeeac665c4e7d2.svg", "index-f655b4d70ff32de59cd76ad925c26126.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205918/index-f655b4d70ff32de59cd76ad925c26126.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["Демидова 2019"], "created_at": "2024-09-07T13:30:51Z", "updated_at": "2026-05-09T13:49:15Z"}, {"id": 102721, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру нагревателя тепловой машины Карно понизили, оставив температуру холодильника прежней. Количество\nтеплоты, полученное газом от нагревателя за цикл, не изменилось. Как изменились при этом КПД тепловой машины и\nколичество теплоты, отданное газом холодильнику за цикл? Для каждой величины определите соответствующий характер\nизменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|--------------------------|\n|К ПД тепловой |К оличество теплоты, отданное\n|---маш-ины---|-газом за-цикл холодильнику|\n|             |                          |\n-----------------------------------------\n\" class=\"math-display\" src=\"index-2c00da607ca4204964114599238f41bd.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру нагревателя понизили, а холодильника не изменили, то КПД уменьшился (2)<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"       Qх-\nη = 1− Qн\n\" class=\"math-display\" src=\"index-903430908139625c1da94a65acfc72f3.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя за цикл, не изменилось, а КПД меньшился, то количество\nтеплоты, отданное газом холодильнику за цикл, увеличилось (1)<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2c00da607ca4204964114599238f41bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211664/index-2c00da607ca4204964114599238f41bd.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211665/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211665/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211665/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-903430908139625c1da94a65acfc72f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211665/index-903430908139625c1da94a65acfc72f3.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2020"], "created_at": "2024-12-25T09:58:36Z", "updated_at": "2026-05-20T16:44:45Z"}, {"id": 14053, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под массивным поршнем находится газ. Поршень не закреплён и может перемещаться в сосуде без трения\n(см. рисунок). В сосуд закачивается ещё такое же количество газа при неизменной температуре. Как изменятся в результате\nэтого давление газа и концентрация его молекул? Для каждой величины определите соответствующий характер\nизменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14053.png\" width=\"157\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|------------------------|\n|Давление газа|К онцентрация м олекул газа|\n|------------|------------------------|\n---------------------------------------\n\" class=\"math-display\" src=\"index-970596429405984a4a7e084e2be34d69.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) Поскольку поршень не закреплён, то давление газа равно сумме атмосферного давления и давления поршня, а значит, оно не\nзависит от количества вещества газа. Давление газа не изменится.\n</p><p class=\"indent\">   Б) По условию температура неизменна, значит, из уравнения состояния идеального газа:\n</p> <div class=\"math-display\">\n<img alt=\"p= nkT\n\" class=\"math-display\" src=\"index-f19b8f7dd773bf9b3441292bfff3f60f.svg\"/></div>\n<p class=\"indent\">   концентрация молекул газа тоже не изменится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14053.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28298/14053.png", "index-970596429405984a4a7e084e2be34d69.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28298/index-970596429405984a4a7e084e2be34d69.svg", "index-f19b8f7dd773bf9b3441292bfff3f60f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28299/index-f19b8f7dd773bf9b3441292bfff3f60f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["Демоверсия 2017", "ЕГЭ 2026 основная волна, Дальний Восток"], "created_at": "2021-12-10T08:51:49Z", "updated_at": "2026-06-14T14:23:33Z"}, {"id": 14069, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия. База ФИПИ 9D022C", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру нагревателя тепловой машины Карно понизили, оставив температуру холодильника прежней. Количество теплоты,\nотданное газом холодильнику за цикл, не изменилось. Как изменились при этом КПД тепловой машины и работа газа за цикл? Для\nкаждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|----------|\n|К ПД тепловой |Работа газа\n|---машины----|--за цикл-|\n|             |          |\n--------------------------\n\" class=\"math-display\" src=\"index-c8ca49b4885d77a7a5f82dc9e8eb85c5.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру нагревателя понизили, то дробь увеличится, значит КПД уменьшился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"   A-  ---A--   A-+Qx-−-Qx-     --Qx--\nη = Q = A + Qx =  A + Qx   = 1− A + Qx\n\" class=\"math-display\" src=\"index-45f3756925a2b8edd43ef9e6ae730e4b.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, отданное газом холодильнику, не изменилось, то работа газа уменьшилась, так как КПД\nуменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c8ca49b4885d77a7a5f82dc9e8eb85c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28331/index-c8ca49b4885d77a7a5f82dc9e8eb85c5.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28332/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg":  может перемещаться без трения, давление газа равно сумме атмосферного давления и\nдавления поршня: <img alt=\"p = pатм+ mgS  \" class=\"math\" src=\"index-a9c527a247012cefe02b0c70a9d55109.svg\"/>, где <img alt=\"m  \" class=\"math\" src=\"index-0ff399db4683f2c7a206b5dbbe864ae7.svg\"/> – масса поршня. При добавлении такого же количества газа при неизменной температуре\nэти величины не изменяются. Следовательно, давление газа не изменится.\n</p><p class=\"indent\">   Б) Температура газа остаётся неизменной, поэтому из уравнения <img alt=\"p = nkT  \" class=\"math\" src=\"index-069cbd604e36a783083d885971f1deb6.svg\"/> следует, что концентрация молекул <img alt=\"n = pkT-  \" class=\"math\" src=\"index-c7dadceaed1c983b3bbe158416c1be23.svg\"/> также не\nизменяется (так как <img alt=\"p  \" class=\"math\" src=\"index-8fb26c8c2914e7d968dd46449635bcab.svg\"/> и <img alt=\"T  \" class=\"math\" src=\"index-f6f4765a13b8d827070e6405a84c05fe.svg\"/> постоянны).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14053.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386272/14053.png", "index-970596429405984a4a7e084e2be34d69.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386272/index-970596429405984a4a7e084e2be34d69.svg", "index-a9c527a247012cefe02b0c70a9d55109.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386273/index-a9c527a247012cefe02b0c70a9d55109.svg", "index-0ff399db4683f2c7a206b5dbbe864ae7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386273/index-0ff399db4683f2c7a206b5dbbe864ae7.svg", "index-069cbd604e36a783083d885971f1deb6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386273/index-069cbd604e36a783083d885971f1deb6.svg", "index-c7dadceaed1c983b3bbe158416c1be23.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386273/index-c7dadceaed1c983b3bbe158416c1be23.svg", "index-8fb26c8c2914e7d968dd46449635bcab.svg": "https://3.shkolkovo.online/api/latex-servi , <img alt=\"mg\nS--  \" class=\"math\" src=\"index-ac0e4e2850a7e5b65d65e9c70c4bee0f.svg\"/> - давление на газ со стороны поршня, так как эти величины не меняются, то и давление\nгаза <img alt=\"P  \" class=\"math\" src=\"index-55414f8fc50339971d0ccaa9c1d110a6.svg\"/> не изменится.\n</p><p class=\"indent\">   Так как процесс изобарный, то выполняется закон Гей-Люссака: <img alt=\"V- =const\nT  \" class=\"math\" src=\"index-3bc6a2690242fb19fdebc51bb0bbab2e.svg\"/>, так как температура уменьшается, то и объём газа\nбудет уменьшаться.\n</p><p class=\"indent\">   Концентрация газа равняется <img alt=\"   N\nn= V-  \" class=\"math\" src=\"index-59fac7d89a80f497f60bf19d9edf6701.svg\"/>, так как объём уменьшается, то <img alt=\"n  \" class=\"math\" src=\"index-1bcfa4ab6a27b9d49d1bde89aa499b89.svg\"/> будет увеличиваться\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"96095_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28300/96095_1.png", "index-590cb820c31fd5ef4e72e90230f16b61.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28300/index-590cb820c31fd5ef4e72e90230f16b61.svg", "index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28301/index-2334d2799fb5b8b53e12cb9d6c1abc4a.svg", "index-4f2a709e55701af17154ebc3f518a74a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28301/index-4f2a709e55701af17154ebc3f518a74a.svg", "index-ac0e4e2850a7e5b65d65e9c70c4bee0f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28301/index-ac0e4e2850a7e5b65d65e9c70c4bee0f.svg", "index-55414f8fc50339971d0ccaa9c1d110a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28301/index-55414f8fc50339971d0ccaa9c1d110a6.svg", "index-3bc6a2690242fb19fdebc51bb0bbab2e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28301/index-3bc6a2690242fb19fdebc51bb0bbab2e.svg", "index-59fac7d89a80f497f60bf19d9edf6701.svg": "https://3.shkolkovo.online " src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру нагревателя понизили, то КПД уменьшился<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"    A-  Q-н−-Qx      Qx-\nη = Q =   Q н   =1 − Qн\n\" class=\"math-display\" src=\"index-e7700af0b8607127ff56af6c58ea5f26.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, отданное газом холодильнику, не изменилось, то количество теплоты, принятое газом,\nуменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-455bc6e4f0585681918e7a07c890c74c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/194153/index-455bc6e4f0585681918e7a07c890c74c.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205314/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205314/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205314/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-e7700af0b8607127ff56af6c58ea5f26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205314/index-e7700af0b8607127ff56af6c58ea5f26.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-08-29T15:36:05Z", "updated_at": "2026-04-18T16:34:30Z"}, {"id": 65305, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под массивным поршнем находится газ (см. рисунок).\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"105\" src=\"96095.png\" width=\"105\"/> </p> </figure>\n<p class=\"indent\">   Поршень может перемещаться в сосуде без трения. Из сосуда медленно выпускается половина массы газа при неизменной\nтемпературе. Как изменятся в результате этого давление газа и сила, действующая на дно сосуда со стороны газа? Масса газа\nпренебрежимо мала по сравнению с массой поршня.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|-----------------------|\n| Давление газа |Сила, действую щая на дно\n|             |  сосуда со стороны газа  |\n|-------------|-----------------------|\n--------------------------------------|\n\" class=\"math-display\" src=\"index-7e3bcfcf83259a201b55de8170f915cf.svg\"/></div>", "solution_html": "<p class=\"noindent\">Так как поршень подвижный (не закреплен), то процесс будет происходить при постоянном давлении.<br/>Сила давления равна\n</p> <div class=\"math-display\">\n<img alt=\"F = pS,\n\" class=\"math-display\" src=\"index-61d8d8ef65f6a799596369b78063ca18.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-b757ba17037e63d6317945799bfd41c1.svg\"/> – давление газа, <img alt=\"S  \" class=\"math\" src=\"index-031d53cac32431d3f5ae534e47c4c1b4.svg\"/> – площадь дна сосуда.<br/>Так как обе величины постоянны, то и сила давления не изменяется\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"96095.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118124/96095.png", "index-7e3bcfcf83259a201b55de8170f915cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118124/index-7e3bcfcf83259a201b55de8170f915cf.svg", "index-61d8d8ef65f6a799596369b78063ca18.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118125/index-61d8d8ef65f6a799596369b78063ca18.svg", "index-b757ba17037e63d6317945799bfd41c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118125/index-b757ba17037e63d6317945799bfd41c1.svg", "index-031d53cac32431d3f5ae534e47c4c1b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118125/index-031d53cac32431d3f5ae534e47c4c1b4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["Демидова 2018"], "created_at": "2023-07-09T08:32:15Z", "updated_at": "2026-06-01T08:39:45Z"}, {"id": 96015, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру нагревателя тепловой машины Карно увеличили, оставив температуру холодильника прежней. Количество\nтеплоты, отданное газом холодильнику за цикл, не изменилось. Как изменились при этом КПД тепловой машины и\nколичество теплоты, полученное газом за цикл от нагревателя?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|------------------------------------|\n|К ПД тепловой |К оличество теплоты, полученное газом |\n----маш-ины---------от нагревателя за-цикл-работы---|\n|              |                                    |\n----------------------------------------------------|\n\" class=\"math-display\" src=\"index-c1e2b207a8dc408763636c0008b86967.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру нагревателя увеличили, то КПД увеличился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"    A-  Q-н−-Qx      Qx-\nη = Q =   Q н   =1 − Qн\n\" class=\"math-display\" src=\"index-e7700af0b8607127ff56af6c58ea5f26.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, отданное газом холодильнику, не изменилось, то количество теплоты, принятое газом,\nувеличилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c1e2b207a8dc408763636c0008b86967.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195644/index-c1e2b207a8dc408763636c0008b86967.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205446/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205446/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205446/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-e7700af0b8607127ff56af6c58ea5f26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205446/index-e7700af0b8607127ff56af6c58ea5f26.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-09-05T16:56:48Z", "updated_at": "2026-04-18T16:34:55Z"}, {"id": 195175, "name": "Копия #96015 - Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру нагревателя тепловой машины Карно повысили, а температура холодильника осталась неизменной. При этом\nколичество теплоты, переданное газом холодильнику за один цикл, не изменилось. Как изменились КПД тепловой машины\nи количество теплоты, полученное газом от нагревателя за цикл?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|------------------------------------|\n|К ПД тепловой |К оличество теплоты, полученное газом |\n----маш-ины---------от нагревателя за-цикл-работы---|\n|              |                                    |\n----------------------------------------------------|\n\" class=\"math-display\" src=\"index-c1e2b207a8dc408763636c0008b86967.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру нагревателя увеличили, то КПД увеличился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"    A-  Q-н−-Qx      Qx-\nη = Q =   Q н   =1 − Qн\n\" class=\"math-display\" src=\"index-e7700af0b8607127ff56af6c58ea5f26.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, отданное газом холодильнику, не изменилось, то количество теплоты, принятое газом,\nувеличилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c1e2b207a8dc408763636c0008b86967.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432467/index-c1e2b207a8dc408763636c0008b86967.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432468/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432468/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432468/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-e7700af0b8607127ff56af6c58ea5f26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432468/index-e7700af0b8607127ff56af6c58ea5f26.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-15T12:02:40Z", "updated_at": "2026-08-15T12:05:28Z"}, {"id": 14064, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под поршнем находится газ. Поршень не закреплён и может перемещаться в сосуде без трения (см.\nрисунок). В сосуд закачивается ещё такое же количество газа при неизменной температуре. Как изменится в результате этого\nдавление газа и концентрация его молекул? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"14064_1.png\" width=\"368\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|---------------------|\n|-Давление газа|-Концентрация-молекул-|\n------------------------------------|\n\" class=\"math-display\" src=\"index-10669665952b9e3d7e43bd7264e5a77d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Давление — 3 <br/>1) Так как поршень подвижный (не закреплен), то процесс будет происходить при постоянном давлении. <br/><br/>Концентрация — 3 <br/>2) Давление газа связано с его концентрацией:\n</p> <div class=\"math-display\">\n<img alt=\"p = nkT,\n\" class=\"math-display\" src=\"index-45b2e7ea17b61c4cabd026ba355f0b8b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-60150c83dc770456c58e205abdb6bc31.svg\"/> — постоянная Больцмана, <img alt=\"n  \" class=\"math\" src=\"index-2cdf2c0f8954868015de5065ecc631d6.svg\"/> — концентрация молекул газа, <img alt=\"T  \" class=\"math\" src=\"index-b877a0d3ef217efac61aa358bbcdb8da.svg\"/> — абсолютная температура газа.<br/>Выразим концентрацию газа:\n</p> <div class=\"math-display\">\n<img alt=\"   -p-\nn= kT\n\" class=\"math-display\" src=\"index-a815b062b114589bd18799c0f2434f69.svg\"/></div>\n<p class=\"indent\">   Так как давление и температура постоянны, то концентрация не изменится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14064_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28321/14064_1.png", "index-10669665952b9e3d7e43bd7264e5a77d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28321/index-10669665952b9e3d7e43bd7264e5a77d.svg", "index-45b2e7ea17b61c4cabd026ba355f0b8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28322/index-45b2e7ea17b61c4cabd026ba355f0b8b.svg", "index-60150c83dc770456c58e205abdb6bc31.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28322/index-60150c83dc770456c58e205abdb6bc31.svg", "index-2cdf2c0f8954868015de5065ecc631d6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28322/index-2cdf2c0f8954868015de5065ecc631d6.svg", "index-b877a0d3ef217efac61aa358bbcdb8da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSessi  КПД увеличился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"    A-\nη = Q\n\" class=\"math-display\" src=\"index-a472a0b7b073acd8e7fb2950abbd2f91.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя за цикл, не изменилось, то работа газа увеличилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c8ca49b4885d77a7a5f82dc9e8eb85c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28327/index-c8ca49b4885d77a7a5f82dc9e8eb85c5.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28328/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28328/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28328/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-a472a0b7b073acd8e7fb2950abbd2f91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28328/index-a472a0b7b073acd8e7fb2950abbd2f91.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2020", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демоверсия 2020"], "created_at": "2021-12-10T09:15:43Z", "updated_at": "2026-05-20T16:45:41Z"}, {"id": 14060, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под поршнем находится газ. Поршень может перемещаться в сосуде без трения. На дне сосуда лежит\nстальной шарик. Из сосуда выпускается половина газа при неизменной температуре. Как изменится в результате этого объём газа и\nего давление?<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\" КТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру холодильника идеальной тепловой машины уменьшили, оставив температуру нагревателя прежней. Количество\nтеплоты, полученное газом от нагревателя за цикл, не изменилось. Как изменились при этом КПД тепловой машины и количество\nтеплоты, отданное газом за цикл холодильнику? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------|--------------------------------|\n|К ПД тепловой машины | Количество теплоты, отданное газом|\n|                    |    холодильнику за цикл работы  |\n|--------------------|--------------------------------|\n-------------------------------------------------------\n\" class=\"math-display\" src=\"index-b94191a6b1e566eb97ff29d2b1677cec.svg\"/></div>", "solution_html": "<p class=\"noindent\">КПД тепловой машины — 1 <br/>1)КПД цикла Карно:\n</p> <div class=\"math-display\">\n<img alt=\"       T\nη = 1− Tх,\n        н\n\" class=\"math-display\" src=\"index-025070c51220170d2e2ddddd46972c0b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"T х  \" class=\"math\" src=\"index-e1038492da107528e8f686d16cba9a3d.svg\"/> — температура холодильника, <img alt=\"T н  \" class=\"math\" src=\"index-a2eacf351d9e7d45660f584d4844c0ee.svg\"/> — температура нагревателя.<br/>При уменьшении температуры холодильника КПД увеличивается.<br/><br/>Количество теплоты, отданное газом — 2 <br/>2) КПД также можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"η =1 − Qх,\n       Qн\n\" class=\"math-display\" src=\"index-69bd731225aaf656255acc4a50d96f1a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q\n х  \" class=\"math\" src=\"index-279 еделите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------------------|-----------------|\n| Количество теплоты, отданное газом|Р абота газа за цикл\n|    холодильнику за цикл работы  |                 |\n|--------------------------------|-----------------|\n----------------------------------------------------\n\" class=\"math-display\" src=\"index-2be3d51e7314c22f41a0a2db7cb25841.svg\"/></div>", "solution_html": "<p class=\"noindent\">Количество теплоты, отданное газом — 2 <br/>1)КПД цикла Карно:\n</p> <div class=\"math-display\">\n<img alt=\"       Q\nη =1 − Qх,\n        н\n\" class=\"math-display\" src=\"index-d03e2440c2e178178eb224a7aea7e65a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q х  \" class=\"math\" src=\"index-c9f7b5372f0fb1fd8eec4e80850e9f39.svg\"/> — количество теплоты, переданное холодильнику, <img alt=\"Q н  \" class=\"math\" src=\"index-1328f09cf9be2e4e7dfa517b00695544.svg\"/> — количество теплоты, полученное от нагревателя.<br/>Так как КПД увеличился и количество теплоты, полученное газом от нагревателя за цикл, не изменилось, то количество теплоты,\nотданное газом — уменьшилось.<br/><br/>Работа газа за цикл — 1 <br/>2) Работу, совершенную газом за цикл, можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"A ц = Qн− Q х\n\" class=\"math-display\" src=\"index-57608b145258bda70c2752c76e2fc8b1.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя за цикл, не изменилось, а количество теплоты, переданное\nхолодильнику, уменьшилось, то работа газа за цикл увеличилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2be3d51e7314c22f41a0a2db7cb25841.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28337/index-2be3d51e7314c22f41a0a2db7cb25841.svg", "index-d03e2440c2e178178eb224a7aea7e65a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28338/index-d03e2440c2e178178eb224a7aea7e65a.svg", "index-c9f7b5372f0fb1fd8eec4e80850e9f39.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28338/index-c9f7b5372f0fb1fd8eec4e80850e9f39.svg", "index-1328f09cf9be2e4e7dfa517b00695544.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28338/index-1328f09cf9be2e4e7dfa517b00695544.svg", "index-57608b145258bda70c2752c76e2fc8b1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28338/index-57608b145258bda70c2752c76e2fc8b1.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2018"], "created_at": "2021-12-10T09:18:43Z", "updated_at": "2026-04-18T16:35:44Z"}, {"id": 94356, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру холодильника тепловой машины, работающей по циклу Карно, понизили, оставив температуру нагревателя прежней.\nКоличество теплоты, полученное газом от нагревателя за цикл, не изменилось. Как изменились при этом КПД тепловой машины и\nработа газа за цикл?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|----------|\n|К ПД тепловой |Работа газа\n|   машины    |  за цикл |\n|-------------|----------|\n--------------------------\n\" class=\"math-display\" src=\"index-544738941d73b19932bdc718a1f846c9.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру холодильника понизили, то КПД увеличился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"   -A-\nη = Q н\n\" class=\"math-display\" src=\"index-31a1a538abfa55a1c6e0311536734d2b.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя, не изменилось, то работа газа увеличилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-544738941d73b19932bdc718a1f846c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190772/index-544738941d73b19932bdc718a1f846c9.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199712/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199712/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199712/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-31a1a538abfa55a1c6e0311536734d2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199712/index-31a1a538abfa55a1c6e0311536734d2b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-08-11T06:01:12Z", "updated_at": "2026-05-20T16:46:26Z"}, {"id": 119087, "name": "МКТ. Термодинамика. Первая часть.", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндрическом сосуде под поршнем находится газ. Поршень не закреплён и может перемещаться в сосуде без трения. На дне\nсосуда лежит стальной шарик (см. рисунок). Газ нагревают. Как изменятся в результате этого давление газа и действующая на\nшарик сила Архимеда? Атмосферное давление неизменно.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"1.png\" width=\"263\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличится\n</p><p class=\"indent\">   2) уменьшится\n</p><p class=\"indent\">   3) не изменится\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|--------------|\n|Давление газа|С ила Архимеда|\n|------------|--------------|\n-----------------------------\n\" class=\"math-display\" src=\"index-bf269a8cabfbad22992c2dd859dc8f45.svg\"/></div>", "solution_html": "<p class=\"noindent\">Поскольку поршень не закреплён и может перемещаться в сосуде без трения, давление газа не изменится. <br/>Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-dc05ec6751459af4bb764f8627c6964f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-d34d6445ee5837ae2ffc9f475764733b.svg\"/> — количество вещества, <img alt=\"T  \" class=\"math\" src=\"index-a4c04978be1264c3c9a9f403e9cb8328.svg\"/> — температура в Кельвинах, <img alt=\"p  \" class=\"math\" src=\"index-398efcfa6925610097ba664047ada5e5.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-4d86d64bdcd005f0ced0c0d9479950a1.svg\"/> — объем, занимаемый газом, <img alt=\"R  \" class=\"math\" src=\"index-bdf608355743a3fc07ba68f3b2e8b374.svg\"/> —\nуниверсальная газовая постоянная.<br/>Так как <img alt=\"p = const  \" class=\"math\" src=\"index-875797f6ebcf7d4a9fb8210c824be917.svg\"/>, температура газа увеличивается, то объём увеличивается. Плотность газа\n</p> <div class=\"math-display\">\n<img alt=\"ρ= m-,\n    V\n\" class=\"math-display\" src=\"index-3fdf8577a8d1728997c21e7fb91d429f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-99bf86281017d98c98cc698965ebf503.svg\"/> – масса газа.<br/>То есть плотность уменьшается.<br/>Сила Архимеда равна:\n</p> <div class=\"math-display\">\n<img alt=\"FАрх = ρgVш,\n\" class=\"math-display\" src=\"index-5d3a05c2afcc7b4384a9ecf671f50c63.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"g  \" class=\"math\" src=\"index-a5e9e04884d639690728332e2f34d89b.svg\"/> — ускорение свободного падения, <img alt=\"Vш  \" class=\"math\" src=\"index-7add4fb6d76814b6359c6e3f83466b6e.svg\"/> — объем шарика.<br/>Так как плотность уменьшается, то сила Архимеда уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244443/1.png", "index-bf269a8cabfbad22992c2dd859dc8f45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244443/index-bf269a8cabfbad22992c2dd859dc8f45.svg", "index-dc05ec6751459af4bb764f8627c6964f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244444/index-dc05ec6751459af4bb764f8627c6964f.svg", "index-d34d6445ee5837ae2ffc9f475764733b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244444/index-d34d6445ee5837ae2ffc9f475764733b.svg", "index-a4c04978be1264c3c9a9f403e9cb8328.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244444/index-a4c04978be1264c3c9a9f403e9cb8328.svg", "index-398efcfa6925610097ba664047ada5e5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244444/index-398efcfa6925610097ba664047ada5e5.svg", "index-4d86d64bdcd005f0ced0c0d9479950a1.svg": "ht апишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|-------------------|\n|Температура газа|-Количество-вещества-|\n-------------------------------------\n\" class=\"math-display\" src=\"index-3f97f4fbdf22eb6c5fbc8a21f658cf31.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура — 1 <br/>1)Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-cfb4e78b25ad2fd407485a36bfe1c109.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-fa978ff5e27f55aa78043ce54d457854.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-ef318698379dacca329bc57a33093cf8.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-6795242219330dfbabba236a1b7bf5bd.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-06f50a66cfae8a880604d4a7c1dceaf1.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-7a3fb291fde4dfe31a8a33854556b6ec.svg\"/> — абсолютная температура.<br/>Выразим температуру газа:\n</p> <div class=\"math-display\">\n<img alt=\"T = pV--\n    νR\n\" class=\"math-display\" src=\"index-24bb44fcc71503c04fe45114685530ab.svg\"/></div>\n<p class=\"indent\">   При уменьшении количества газа (<img alt=\"V = const  \" class=\"math\" src=\"index-34d8cd2fc2ab106a06dc2112784aad72.svg\"/>, <img alt=\"p= const  \" class=\"math\" src=\"index-3a1c2ee7e410672118d0d749bf0d06f0.svg\"/>) температура увеличится. <br/><br/>Количество вещества — 2 <br/>2) Так как из сосуда выпустили часть газа, то количество вещества уменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3f97f4fbdf22eb6c5fbc8a21f658cf31.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28310/index-3f97f4fbdf22eb6c5fbc8a21f658cf31.svg", "index-cfb4e78b25ad2fd407485a36bfe1c109.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-cfb4e78b25ad2fd407485a36bfe1c109.svg", "index-fa978ff5e27f55aa78043ce54d457854.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-fa978ff5e27f55aa78043ce54d457854.svg", "index-ef318698379dacca329bc57a33093cf8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-ef318698379dacca329bc57a33093cf8.svg", "index-6795242219330dfbabba236a1b7bf5bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-6795242219330dfbabba236a1b7bf5bd.svg", "index-06f50a66cfae8a880604d4a7c1dceaf1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-06f50a66cfae8a880604d4a7c1dceaf1.svg", "index-7a3fb291fde4dfe31a8a33854556b6ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-7a3fb291fde4dfe31a8a33854556b6ec.svg", "index-24bb44fcc71503c04fe45114685530ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-24bb44fcc71503c04fe45114685530ab.svg", "index-34d8cd2fc2ab106a06dc2112784aad72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-34d8cd2fc2ab106a06dc2112784aad72.svg", "index-3a1c2ee7e410672118d0d749bf0d06f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28311/index-3a1c2ee7e410672118d0d749bf0d06f0.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2021-12-10T08:56:43Z", "updated_at": "2026-05-20T16:04:15Z"}, {"id": 94466, "name": "Задача на МКТ и термодинамику. Изменение физических величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Температуру холодильника тепловой машины, работающей по циклу Карно, повысили, оставив температуру нагревателя\nпрежней. Количество теплоты, полученное газом от нагревателя за цикл, не изменилось. Как изменились при этом КПД\nтепловой машины и количество теплоты, отданное холодильнику за цикл?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|----------------------------|\n|КП Д тепловой |Количество теп лоты, отданное|\n----маш-ины---------холод-ильнику за-цикл----|\n|              |                            |\n--------------------------------------------|\n\" class=\"math-display\" src=\"index-984ad75902e8242eeeb80896188859e3.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) КПД находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       TX\nη = 1 − TH,\n\" class=\"math-display\" src=\"index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"TX  \" class=\"math\" src=\"index-f8c89968d18ba7789a0926ba95aba9a6.svg\"/> и <img alt=\"TH  \" class=\"math\" src=\"index-9bf0eff391bb4d8d5d8c7d874018431b.svg\"/> – температуры холодильника и нагревателя соответственно.<br/>Так как температуру холодильника повысили, то КПД уменьшился.<br/>Б) С другой стороны КПД равен:\n</p> <div class=\"math-display\">\n<img alt=\"       Qх-\nη =1 − Qн,\n\" class=\"math-display\" src=\"index-192a145c76703e248b27e2e97522b3ca.svg\"/></div>\n<p class=\"indent\">   Так как количество теплоты, полученное газом от нагревателя, не изменилось, то количество теплоты, отданное газом,\nувеличилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-984ad75902e8242eeeb80896188859e3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/191135/index-984ad75902e8242eeeb80896188859e3.svg", "index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200526/index-2e17e6eaa3e53b73ef186e83e8c2d7bc.svg", "index-f8c89968d18ba7789a0926ba95aba9a6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200526/index-f8c89968d18ba7789a0926ba95aba9a6.svg", "index-9bf0eff391bb4d8d5d8c7d874018431b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200526/index-9bf0eff391bb4d8d5d8c7d874018431b.svg", "index-192a145c76703e248b27e2e97522b3ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200526/index-192a145c76703e248b27e2e97522b3ca.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-08-17T09:46:20Z", "updated_at": "2026-04-18T16:36:12Z"}, {"id": 103128, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния 1 моль одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-8379c06f8e9bb00ee44745b4a00628e7.svg\"/> – внутренняя энергия газа; <img alt=\"p  \" class=\"math\" src=\"index-7b9d09814aa2b9c2f2ef1e483d13a2d4.svg\"/> –\nдавление газа). Как изменяются в ходе этого процесса абсолютная температура и объём газа? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"103128.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-Абсолютная-температура газа-Объём-газа-|\n|--------------------------|-----------|\n---------------------------------------|\n\" class=\"math-display\" src=\"index-28d0bd980d7392c041769db5a5635856.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия одноатомного газа вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT.\n\" class=\"math-display\" src=\"index-793cd671c48fae6e38da65224bf547d2.svg\"/></div>\n<p class=\"indent\">   То есть, во сколько раз увеличилась внутренняя энергия, во столько раз увеличилась температура. То есть,\n<img alt=\"p ∼T  \" class=\"math\" src=\"index-2baedabea7f22ab8d02ec99a3e934a2c.svg\"/>.<br/>Запишем уравнение Мендлеева-Клайперона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-c2e85273a84ad98aa50d6a7c745ed866.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"V = νRT-.\n     p\n\" class=\"math-display\" src=\"index-f61a9c566583f491b6cb4990238eb023.svg\"/></div>\n<p class=\"indent\">   Тогда т.к. <img alt=\"p∼ T  \" class=\"math\" src=\"index-b303a0bda6b61c446d82eb93eabcc4ec.svg\"/>, то объём не изменится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8379c06f8e9bb00ee44745b4a00628e7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212609/index-8379c06f8e9bb00ee44745b4a00628e7.svg", "index-7b9d09814aa2b9c2f2ef1e483d13a2d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212609/index-7b9d09814aa2b9c2f2ef1e483d13a2d4.svg", "103128.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212609/103128.png", "index-28d0bd980d7392c041769db5a5635856.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212609/index-28d0bd980d7392c041769db5a5635856.svg", "index-793cd671c48fae6e38da65224bf547d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212610/index-793cd671c48fae6e38da65224bf547d2.svg", "index-2baedabea7f22ab8d02ec99a3e934a2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212610/index-2baedabea7f22ab8d02ec99a3e934a2c.svg", "index-c2e85273a84ad98aa50d6a7c745ed866.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212610/index-c2e85273a84ad98aa50d6a7c745ed866.svg", "index-f61a9c566583f491b6cb4990238eb023.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212610/index-f61a9c566583f491b6cb4990238eb023.svg", "index-b303a0bda6b61c446d82eb93eabcc4ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212610/index-b303a0bda6b61c446d82eb93eabcc4ec.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T19:15:34Z", "updated_at": "2026-07-08T12:09:01Z"}, {"id": 14078, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-35c92df854acf159e64f148d03772325.svg\"/> — внутренняя\nэнергия газа; <img alt=\"p  \" class=\"math\" src=\"index-238be91df727571d220bbc13cbcbffb4.svg\"/> — его давление). Как изменяются в ходе этого процесса объём и абсолютная температура газа?\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14078.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|О-бъ-ём-газа-|-Температура-газа-|\n|----------|----------------|\n-----------------------------\n\" class=\"math-display\" src=\"index-2d8fad4cc148a294314aa2a29dd7ab14.svg\"/></div>", "solution_html": "<p class=\"noindent\">Объем — 3 <br/>1) Из графика видно, что зависимость внутренней энергии газа от его давления прямая: <img alt=\"U ∼ p  \" class=\"math\" src=\"index-c7baab8369483cc92426aada183718f4.svg\"/>. <br/>Внутренняя энергия одноатомного газа:\n</p> <div class=\"math-display\">\n<img alt=\"U = 3νRT,\n    2\n\" class=\"math-display\" src=\"index-9c806742c35a122535f7c860cee01dba.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-9df5d30dd051bdf049162877fbcd5f47.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-bc7e26d276afb76b81427dd9923a2da4.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-fd1548bb445408476441261de7c60f1f.svg\"/> —температура.<br/>Так как <img alt=\"U ∼ p  \" class=\"math\" src=\"index-f61ced51ed5c3c5a7117d7e0e1ada1b2.svg\"/> и <img alt=\"U ∼ T  \" class=\"math\" src=\"index-a876f3ccda2047ecf42aeb430dd9d806.svg\"/>, то давление прямо пропорционально температуре: <img alt=\"T ∼ p  \" class=\"math\" src=\"index-4b3e70cd14dc095fa8906a584d59509f.svg\"/>. Это соответствует изохорному процессу\n(<img alt=\"V = const  \" class=\"math\" src=\"index-035af90b3e832296544fc5db43b3e67e.svg\"/>).<br/><br/>Температура – 1 <br/>2) Так как внутренняя энергия газа увеличивается, то его температура также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-35c92df854acf159e64f148d03772325.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28349/index-35c92df854acf159e64f148d03772325.svg", "index-238be91df727571d220bbc13cbcbffb4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28349/index-238be91df727571d220bbc13cbcbffb4.svg", "14078.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28349/14078.png", "index-2d8fad4cc148a294314aa2a29dd7ab14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28349/index-2d8fad4cc148a294314aa2a29dd7ab14.svg", "index-c7baab8369483cc92426aada183718f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28350/index-c7baab8369483cc92426aada183718f4.svg", "index-9c806742c35a122535f7c860cee01dba.svg": "https://3.shko
