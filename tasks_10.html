№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде постоянного объёма при комнатной температуре долгое время находится влажный воздух. На стенках внутри\nсосуда видна обильная роса. Температуру воздуха медленно увеличили на 20 К. Роса на стенках сосуда при этом не\nпропала. Как изменились при этом концентрация молекул водяного пара и относительная влажность воздуха в\nсосуде?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения.\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------|-----------------------|\n|К онцентрация молекул | Относительная влаж ность |\n| водяного пара в сосуде     воздуха в сосуде    |\n|--------------------|-----------------------|\n---------------------------------------------|\n\" class=\"math-display\" src=\"index-cc22cff7860bb02014b3baa3d53d07c9.svg\"/></div>", "solution_html": "<p class=\"noindent\">Из того, что на стенках видна обильная роса следует, что пар в сосуде является насыщенным. Т.е. относительная влажность 100 %.\nТ.к. после увеличения температуры роса так и осталось, то относительная влажность не изменилась и осталась равной 100 %. При\nувеличении температуры все больше и больше молекул могут «вырваться» с поверхности воды и все больше молекул может\nнаходиться в состоянии пара (газа) за счёт увеличения их кинетической энергии.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cc22cff7860bb02014b3baa3d53d07c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200195/index-cc22cff7860bb02014b3baa3d53d07c9.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["Демидова 2019"], "created_at": "2024-10-06T16:54:37Z", "updated_at": "2026-04-18T16:42:24Z"}, {"id": 168647, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Количество теплоты, полученное рабочим телом идеальной тепловой машины Карно от нагревателя за цикл, увеличили. Количество\nтеплоты, отданное рабочим телом холодильнику за цикл, не изменилось. Температура холодильника осталась прежней. Как\nизменились при этом КПД тепловой машины и работа тепловой машины за цикл? <br/>Для каждой величины определите соответствующий характер её изменения: <br/>1) увеличилась <br/>2) уменьшилась <br/>3) не изменилась <br/>Запишите в таблицу выбранные цифры для каждой физической величины. <br/>Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------|----------------------|\n|КП Д тепловой м ашины|Работа тепловой маш ины\n|                    |       за цикл        |\n|--------------------|----------------------|\n--------------------------------------------|\n\" class=\"math-display\" src=\"index-cf3f0f3ef5ad14ce9bb2a2abbfafcfb9.svg\"/></div>", "solution_html": "<p class=\"noindent\">КПД тепловой машины определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    A    Q+ − Q−      Q −\nη = Q+-= --Q+----= 1− Q+-.\n\" class=\"math-display\" src=\"index-9848902b67920e684d6eee2bdee1b06c.svg\"/></div>\n<p class=\"indent\">   Так как <img alt=\"Q+  \" class=\"math\" src=\"index-df6d3ea95dd644fe00b2b77a45c09643.svg\"/> увеличили, то <img alt=\"η  \" class=\"math\" src=\"index-2e9ab3565ff8f419ce58584c2f662f0a.svg\"/> уменьшилось. <br/>Работа <img alt=\"A  \" class=\"math\" src=\"index-0173fa525f25f681592b90d7b1c91946.svg\"/> тепловой машины за цикл определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q  − Q .\n     +    −\n\" class=\"math-display\" src=\"index-a29d3392f4b850165d9b599c6f54afc8.svg\"/></div>\n<p class=\"indent\">   Если <img alt=\"Q+  \" class=\"math\" src=\"index-38d7f6f6e1d01c8b42a4d9ba793f6015.svg\"/> увеличили, то при неизменном <img alt=\"Q − \" class=\"math\" src=\"index-fc6b4bb9579342ba86b6e1f6254c3511.svg\"/> работа <img alt=\"A  \" class=\"math\" src=\"index-4167048f06b51507fd31c4d4e10eabc5.svg\"/> увеличится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cf3f0f3ef5ad14ce9bb2a2abbfafcfb9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362055/index-cf3f0f3ef5ad14ce9bb2a2abbfafcfb9.svg", "index-9848902b67920e684d6eee2bdee1b06c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-9848902b67920e684d6eee2bdee1b06c.svg", "index-df6d3ea95dd644fe00b2b77a45c09643.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-df6d3ea95dd644fe00b2b77a45c09643.svg", "index-2e9ab3565ff8f419ce58584c2f662f0a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-2e9ab3565ff8f419ce58584c2f662f0a.svg", "index-0173fa525f25f681592b90d7b1c91946.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-0173fa525f25f681592b90d7b1c91946.svg", "index-a29d3392f4b850165d9b599c6f54afc8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-a29d3392f4b850165d9b599c6f54afc8.svg", "index-38d7f6f6e1d01c8b42a4d9ba793f6015.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-38d7f6f6e1d01c8b42a4d9ba793f6015.svg", "index-fc6b4bb9579342ba86b6e1f6254c3511.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-fc6b4bb9579342ba86b6e1f6254c3511.svg", "index-4167048f06b51507fd31c4d4e10eabc5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362056/index-4167048f06b51507fd31c4d4e10eabc5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ФИПИ"], "created_at": "2026-02-12T21:43:22Z", "updated_at": "2026-04-18T16:42:32Z"}, {"id": 14087, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В калориметр с водой, имеющей температуру 60<img alt=\"∘\nC  \" class=\"math\" src=\"index-aa937aab3b2b1b6822fa7821f1a3e624.svg\"/>, кладут металлический брусок, имеющий температуру 20<img alt=\"∘\n C  \" class=\"math\" src=\"index-839435dd6a2164766ea892bc14213c3f.svg\"/>. Через некоторое\nвремя в калориметре устанавливается тепловое равновесие. Как в результате изменятся следующие физические величины:\nвнутренняя энергия бруска и внутренняя энергия воды? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------|------------------|\n| Внутренняя энергия |Внутренняя энергия|\n|      бруска      |       воды        |\n|------------------|------------------|\n--------------------------------------|\n\" class=\"math-display\" src=\"index-40c37d41849423962646da90dd72162f.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия бруска — 1 <br/>1) Внутренняя энергия тела прямо пропорциональна его температуре. После установления теплового равновесия температура бруска\nувеличится (он нагреется) по сравнению с его начальной температурой. Следовательно, внутренняя энергия бруска также\nувеличится.<br/><br/>Внутренняя энергия воды — 2 <br/>2) После установления теплового равновесия температура воды уменьшится (она остынет) по сравнению с ее начальной\nтемпературой. Следовательно, внутренняя энергия воды также уменьшится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aa937aab3b2b1b6822fa7821f1a3e624.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28367/index-aa937aab3b2b1b6822fa7821f1a3e624.svg", "index-839435dd6a2164766ea892bc14213c3f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28367/index-839435dd6a2164766ea892bc14213c3f.svg", "index-40c37d41849423962646da90dd72162f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28367/index-40c37d41849423962646da90dd72162f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2020"], "created_at": "2021-12-10T09:53:53Z", "updated_at": "2026-05-20T17:11:11Z"}, {"id": 136719, "name": "Демка ЕГЭ 2026 - 10", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем долгое время находится жидкость и её насыщенный пар (см. рисунок). Как изменятся давление и\nконцентрация молекул пара при медленном перемещении поршня вниз, если температура останется неизменной? В процессе\nдвижения поршень не касается поверхности жидкости. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-10-4-1.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|------------------------|\n|Д-авление-пара-|К-онцентрация м-олекул-пара\n----------------------------------------\n\" class=\"math-display\" src=\"index-b4d700e7f001813b83af5367e89af9d8.svg\"/></div>", "solution_html": "<p class=\"noindent\">При медленном уменьшении объема (перемещение поршня вниз) при постоянной температуре пар остается насыщенным. Давление\nи концентрация насыщенного пара зависят только от температуры и не изменяются, пока температура остается\nпостоянной.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-10-4-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286084/f-ege-10-4-1.png", "index-b4d700e7f001813b83af5367e89af9d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286084/index-b4d700e7f001813b83af5367e89af9d8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["Демоверсия 2026"], "created_at": "2025-08-22T12:51:43Z", "updated_at": "2026-04-18T16:30:32Z"}, {"id": 14076, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде находится идеальный газ. Как при охлаждении сосуда с газом изменятся величины: давление газа и внутренняя\nэнергия?<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|-------------------|\n|Д-авление-газа-|-Внутренняя энергия-|\n-----------------------------------\n\" class=\"math-display\" src=\"index-e9abcc170f83a4e42175a5d821826bd4.svg\"/></div>", "solution_html": "<p class=\"noindent\">Давление — 2 <br/>1) Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-cfb4e78b25ad2fd407485a36bfe1c109.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-fa978ff5e27f55aa78043ce54d457854.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-ef318698379dacca329bc57a33093cf8.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-6795242219330dfbabba236a1b7bf5bd.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-06f50a66cfae8a880604d4a7c1dceaf1.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-7a3fb291fde4dfe31a8a33854556b6ec.svg\"/> — абсолютная температура.<br/>Выразим отсюда давление:\n</p> <div class=\"math-display\">\n<img alt=\"p = νRT-\n     V\n\" class=\"math-display\" src=\"index-3c96b8af5f65df58162fb3ad3fa6036c.svg\"/></div>\n<p class=\"indent\">   Так как <img alt=\"V = const  \" class=\"math\" src=\"index-014026bbcd3623480d8e4ad73cb86e14.svg\"/>, а температура уменьшается, значит, давление газа уменьшается (изохорный процесс). <br/><br/>Внутренняя энергия — 2 <br/>2) Внутренняя энергия газа:\n</p> <div class=\"math-display\">\n<img alt=\"U = iνRT,\n    2\n\" class=\"math-display\" src=\"index-1ec859d6074a98ae7b6e91f5e49f3404.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"i  \" class=\"math\" src=\"index-44b68cb44e2d747f516ed250e1f96341.svg\"/> — число степеней свободы.<br/>Температура уменьшается, то есть внутренняя энергия газа также уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e9abcc170f83a4e42175a5d821826bd4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28345/index-e9abcc170f83a4e42175a5d821826bd4.svg", "index-cfb4e78b25ad2fd407485a36bfe1c109.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-cfb4e78b25ad2fd407485a36bfe1c109.svg", "index-fa978ff5e27f55aa78043ce54d457854.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-fa978ff5e27f55aa78043ce54d457854.svg", "index-ef318698379dacca329bc57a33093cf8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-ef318698379dacca329bc57a33093cf8.svg", "index-6795242219330dfbabba236a1b7bf5bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-6795242219330dfbabba236a1b7bf5bd.svg", "index-06f50a66cfae8a880604d4a7c1dceaf1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-06f50a66cfae8a880604d4a7c1dceaf1.svg", "index-7a3fb291fde4dfe31a8a33854556b6ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-7a3fb291fde4dfe31a8a33854556b6ec.svg", "index-3c96b8af5f65df58162fb3ad3fa6036c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-3c96b8af5f65df58162fb3ad3fa6036c.svg", "index-014026bbcd3623480d8e4ad73cb86e14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-014026bbcd3623480d8e4ad73cb86e14.svg", "index-1ec859d6074a98ae7b6e91f5e49f3404.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-1ec859d6074a98ae7b6e91f5e49f3404.svg", "index-44b68cb44e2d747f516ed250e1f96341.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28346/index-44b68cb44e2d747f516ed250e1f96341.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона", "Внутренняя энергия газа"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:21:35Z", "updated_at": "2026-04-18T16:42:53Z"}, {"id": 14088, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В калориметр с водой, имеющей температуру <img alt=\"  ∘\n60C  \" class=\"math\" src=\"index-13051c4e120c3b8f5d4e17699ff0cdd9.svg\"/>, кладут металлический брусок, имеющий температуру <img alt=\"  ∘\n20 C  \" class=\"math\" src=\"index-faf10160724729f4735466482aa23d3f.svg\"/>. Через некоторое\nвремя в калориметре устанавливается тепловое равновесие. Как в результате изменятся следующие физические величины:\nвнутренняя энергия бруска и суммарная внутренняя энергия системы? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|--------------------|\n| Внутренняя энергия|Сум марная внутренняя |\n|       бруска       |   энергия системы    |\n|-------------------|--------------------|\n-----------------------------------------|\n\" class=\"math-display\" src=\"index-29e7a8248c9a8056ca832898716e845e.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия бруска – 1 <br/>1) Внутренняя энергия тела прямо пропорциональна его температуре. После установления теплового равновесия температура бруска\nувеличится (он нагреется) по сравнению с его начальной температурой. Следовательно, внутренняя энергия бруска также\nувеличится.<br/><br/>Суммарная внутренняя энегия системы — 3<br/>2) Из первого начала термодинамики следует, что изменение внутренней энергии системы зависит от количества теплоты и работы,\nсовершенной над системой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= A + ΔU   ⇒   ΔU = Q − A,\n\" class=\"math-display\" src=\"index-11d0ce3f4184ca64a8f141b6ee8ec757.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-373de80c17c7ba1404c4ec4b95e852c4.svg\"/> — количество теплоты, полученное системой, <img alt=\"A  \" class=\"math\" src=\"index-8e2ea9955f52ad1864b444b20bf27022.svg\"/> — работа, совершенная над системой, <img alt=\"ΔU  \" class=\"math\" src=\"index-9d97350d45eb6c3fb6682e658bf35756.svg\"/> — изменение внутренней\nэнергии системы.<br/>Данную систему можно считать изолированной (из-за калориметра), то есть она не взаимодействует с окружающей средой.\nСледовательно, количество теплоты <img alt=\"Q  \" class=\"math\" src=\"index-62f2f7cbdfc87b810a8803e2ac7fd5bd.svg\"/> равно нулю. <br/>Также над системой не совершается работы, то есть <img alt=\"A= 0  \" class=\"math\" src=\"index-ff40c2413bcc7718a9fa60430721f875.svg\"/>.<br/>Таким образом, изменение внутреней энергии системы равно нулю. Следовательно, она постоянна.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-13051c4e120c3b8f5d4e17699ff0cdd9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28369/index-13051c4e120c3b8f5d4e17699ff0cdd9.svg", "index-faf10160724729f4735466482aa23d3f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28369/index-faf10160724729f4735466482aa23d3f.svg", "index-29e7a8248c9a8056ca832898716e845e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28369/index-29e7a8248c9a8056ca832898716e845e.svg", "index-11d0ce3f4184ca64a8f141b6ee8ec757.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-11d0ce3f4184ca64a8f141b6ee8ec757.svg", "index-373de80c17c7ba1404c4ec4b95e852c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-373de80c17c7ba1404c4ec4b95e852c4.svg", "index-8e2ea9955f52ad1864b444b20bf27022.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-8e2ea9955f52ad1864b444b20bf27022.svg", "index-9d97350d45eb6c3fb6682e658bf35756.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-9d97350d45eb6c3fb6682e658bf35756.svg", "index-62f2f7cbdfc87b810a8803e2ac7fd5bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-62f2f7cbdfc87b810a8803e2ac7fd5bd.svg", "index-ff40c2413bcc7718a9fa60430721f875.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28370/index-ff40c2413bcc7718a9fa60430721f875.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики", "Тепловые явления"], "sources": ["Демидова 2020"], "created_at": "2021-12-10T09:54:35Z", "updated_at": "2026-05-03T11:15:35Z"}, {"id": 100675, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем находятся жидкость и её насыщенный пар (см. рисунок). </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"896228.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Как изменятся масса пара и давление пара при медленном перемещении поршня вниз при постоянной температуре, пока поршень не\nкоснётся поверхности жидкости?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|-------------|\n|М-асса-пара|-Давление-пара|\n--------------------------\n\" class=\"math-display\" src=\"index-a12de9128aa211e00177c8fdd4089809.svg\"/></div>", "solution_html": "<p class=\"noindent\">При медленном уменьшении объема (перемещение поршня вниз) при постоянной температуре пар остается насыщенным. Давление\nнасыщенного пара зависит только от температуры и не изменяется, пока температура остается постоянной.<br/>Уменьшение объема вызывает конденсацию части пара, чтобы поддерживать равновесие между жидкостью и насыщенным паром\nпри постоянном давлении. Таким образом, масса пара уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"896228.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/207040/896228.png", "index-a12de9128aa211e00177c8fdd4089809.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/207040/index-a12de9128aa211e00177c8fdd4089809.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Свойства паров. Влажность"], "sources": ["Демидова 2017"], "created_at": "2024-11-22T16:59:28Z", "updated_at": "2026-04-22T19:14:24Z"}, {"id": 14062, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В закрытом сосуде находится идеальный газ. Как при охлаждении сосуда с газом изменятся величины: давление газа и его\nплотность? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|----------|\n|-Давление газа|-Плотность|\n--------------------------\n\" class=\"math-display\" src=\"index-d3a9a44b1a21cc413773122f977ca85b.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-e883d248326a194051db5cec315ad015.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-2c35ff53f4264fa481ce5a9a05d2f1cb.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-1f17a8ee9141854416d0bcd0176015f9.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-ee7a858bdbda0beca659ac20899d4a01.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-d6a4b463a38a3b247df36f4f9ad96545.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-5c23e8b480d5659b6929cba15148682a.svg\"/> — абсолютная температура.<br/>Выразим отсюда давление:\n</p> <div class=\"math-display\">\n<img alt=\"p = νRT-\n     V\n\" class=\"math-display\" src=\"index-1f1ffd7dbd280c093bd97febdc47c41b.svg\"/></div>\n<p class=\"indent\">   Так как <img alt=\"V = const  \" class=\"math\" src=\"index-7ec9f58e1a3bdd9b389a4e1dc3a63388.svg\"/>, а температура уменьшается, значит, давление газа уменьшается (изохорный процесс). <br/><br/>2) Плотность газа:\n</p> <div class=\"math-display\">\n<img alt=\"   m\nρ= -V ,\n\" class=\"math-display\" src=\"index-753361c0f06fad20b99a29a5a78d5190.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-7f30696f24e4ab6c6a2ee205a1c9486d.svg\"/> — масса газа. <br/>Так как никакие величины не изменяются, то плотность газа также остается неизменной.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d3a9a44b1a21cc413773122f977ca85b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28317/index-d3a9a44b1a21cc413773122f977ca85b.svg", "index-e883d248326a194051db5cec315ad015.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-e883d248326a194051db5cec315ad015.svg", "index-2c35ff53f4264fa481ce5a9a05d2f1cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-2c35ff53f4264fa481ce5a9a05d2f1cb.svg", "index-1f17a8ee9141854416d0bcd0176015f9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-1f17a8ee9141854416d0bcd0176015f9.svg", "index-ee7a858bdbda0beca659ac20899d4a01.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-ee7a858bdbda0beca659ac20899d4a01.svg", "index-d6a4b463a38a3b247df36f4f9ad96545.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-d6a4b463a38a3b247df36f4f9ad96545.svg", "index-5c23e8b480d5659b6929cba15148682a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-5c23e8b480d5659b6929cba15148682a.svg", "index-1f1ffd7dbd280c093bd97febdc47c41b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-1f1ffd7dbd280c093bd97febdc47c41b.svg", "index-7ec9f58e1a3bdd9b389a4e1dc3a63388.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-7ec9f58e1a3bdd9b389a4e1dc3a63388.svg", "index-753361c0f06fad20b99a29a5a78d5190.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-753361c0f06fad20b99a29a5a78d5190.svg", "index-7f30696f24e4ab6c6a2ee205a1c9486d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28318/index-7f30696f24e4ab6c6a2ee205a1c9486d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2021-12-10T08:59:43Z", "updated_at": "2026-04-28T11:37:08Z"}, {"id": 26305, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В ходе адиабатного процесса внутренняя энергия идеального газа уменьшается. Как изменяются в этом процессе объём газа и его\nтемпература? Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------|----------------|\n|О-бъ-ём-газа-|Температура газа|\n----------------------------|\n\" class=\"math-display\" src=\"index-048ba199dc0b27ffe954e6999568e97d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Запишем первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = A+ ΔU\n\" class=\"math-display\" src=\"index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, <img alt=\"A  \" class=\"math\" src=\"index-42606c2010d3a2322f7d5adf90ca199c.svg\"/> — работа газа, <img alt=\"ΔU  \" class=\"math\" src=\"index-c59fab83cb986a59eb7c47cb6127e5b2.svg\"/> — изменение внутренней энергии газа.<br/>При адиабатном процессе <img alt=\"Q =0  \" class=\"math\" src=\"index-ac8f5a320998b5f6dbd4730453bc2e96.svg\"/>, тогда\n</p> <div class=\"math-display\">\n<img alt=\"A = −ΔU\n\" class=\"math-display\" src=\"index-1b99af08f0cc3f3e441d2507fba95b9e.svg\"/></div>\n<p class=\"indent\">   Изменение его внутренней энергии равны:\n</p> <div class=\"math-display\">\n<img alt=\"     3m\nΔU = 2-μRΔT\n\" class=\"math-display\" src=\"index-eec1b64e9fcf87dd50ea855ecd005fd9.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-a8ca8dc3dc920326803eb149a160536f.svg\"/> — давление газа под поршнем, <img alt=\"ΔV  \" class=\"math\" src=\"index-feb86429fac1bfcfce93ce67a6ed5e69.svg\"/> — изменение объема газа, <img alt=\"m  \" class=\"math\" src=\"index-3ff42e760f0983eb551b9eff09da49f4.svg\"/> – масса газа, <img alt=\"μ  \" class=\"math\" src=\"index-d4e27e5a6e286252877b6e636fb57a4f.svg\"/> — молярная масса газа, <img alt=\"R  \" class=\"math\" src=\"index-7485e08e4b9d851e21503c2607a7614e.svg\"/> —\nуниверсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-3abc344ef09410c9951384c8497da3da.svg\"/> — изменение температуры газа.<br/>Тогда при уменьшении внутренней энергии уменьшается температура, но увеличивается объём, так как работа газа\nпропорциональная изменению объёма.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-048ba199dc0b27ffe954e6999568e97d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48920/index-048ba199dc0b27ffe954e6999568e97d.svg", "index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-42606c2010d3a2322f7d5adf90ca199c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-42606c2010d3a2322f7d5adf90ca199c.svg", "index-c59fab83cb986a59eb7c47cb6127e5b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-c59fab83cb986a59eb7c47cb6127e5b2.svg", "index-ac8f5a320998b5f6dbd4730453bc2e96.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-ac8f5a320998b5f6dbd4730453bc2e96.svg", "index-1b99af08f0cc3f3e441d2507fba95b9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-1b99af08f0cc3f3e441d2507fba95b9e.svg", "index-eec1b64e9fcf87dd50ea855ecd005fd9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-eec1b64e9fcf87dd50ea855ecd005fd9.svg", "index-a8ca8dc3dc920326803eb149a160536f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-a8ca8dc3dc920326803eb149a160536f.svg", "index-feb86429fac1bfcfce93ce67a6ed5e69.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-feb86429fac1bfcfce93ce67a6ed5e69.svg", "index-3ff42e760f0983eb551b9eff09da49f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-3ff42e760f0983eb551b9eff09da49f4.svg", "index-d4e27e5a6e286252877b6e636fb57a4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-d4e27e5a6e286252877b6e636fb57a4f.svg", "index-7485e08e4b9d851e21503c2607a7614e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-7485e08e4b9d851e21503c2607a7614e.svg", "index-3abc344ef09410c9951384c8497da3da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/48921/index-3abc344ef09410c9951384c8497da3da.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["CтатГрад 28.03.2022 Физика 1"], "created_at": "2022-04-28T12:11:19Z", "updated_at": "2026-04-18T16:48:31Z"}, {"id": 103104, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В калориметр со льдом, имеющим температуру <img alt=\"  ∘\n0 C  \" class=\"math\" src=\"index-99840c9b8d7e92dbe580f99dc975fa0d.svg\"/>, добавили воду при комнатной температуре. Как изменятся в результате\nустановления теплового равновесия удельная теплоёмкость воды и масса льда в калориметре?<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|----------|\n|У-дельная-теплоёмкость воды|М-асса-льда-|\n-------------------------------------|\n\" class=\"math-display\" src=\"index-4f008df5eff91ca7c84e5584ba28fa1f.svg\"/></div>", "solution_html": "<p class=\"noindent\">Удельная теплоемкость воды не зависит от изменения температуры, массы и количества отданной теплоты.<br/>В результате теплообмена вода будет охлаждаться и будет передавать теплоту льду, в результате лёд будет плавиться.\nСледовательно, масса льда будет уменьшаться.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-99840c9b8d7e92dbe580f99dc975fa0d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212558/index-99840c9b8d7e92dbe580f99dc975fa0d.svg", "index-4f008df5eff91ca7c84e5584ba28fa1f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212558/index-4f008df5eff91ca7c84e5584ba28fa1f.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T10:52:09Z", "updated_at": "2026-04-18T16:43:29Z"}, {"id": 195431, "name": "Копия #103104 - Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В калориметр, содержащий лёд температуры <img alt=\" ∘\n0 C  \" class=\"math\" src=\"index-53524567130ea36f38f7fb333584e6f8.svg\"/>,долили воду комнатной температуры. Как изменятся в результате достижения\nтеплового равновесия удельная теплоёмкость воды и масса льда в калориметре?<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|----------|\n|У-дельная-теплоёмкость воды|М-асса-льда-|\n-------------------------------------|\n\" class=\"math-display\" src=\"index-4f008df5eff91ca7c84e5584ba28fa1f.svg\"/></div>", "solution_html": "<p class=\"noindent\">Удельная теплоемкость воды не зависит от изменения температуры, массы и количества отданной теплоты.<br/>В результате теплообмена вода будет охлаждаться и будет передавать теплоту льду, в результате лёд будет плавиться.\nСледовательно, масса льда будет уменьшаться.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-53524567130ea36f38f7fb333584e6f8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433235/index-53524567130ea36f38f7fb333584e6f8.svg", "index-4f008df5eff91ca7c84e5584ba28fa1f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433235/index-4f008df5eff91ca7c84e5584ba28fa1f.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T19:47:05Z", "updated_at": "2026-08-16T19:49:36Z"}, {"id": 14077, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В вертикальном цилиндрическом сосуде под подвижным поршнем массой <img alt=\"M  \" class=\"math\" src=\"index-9bc14dcbcab5898341e6ffbf97ba0b22.svg\"/>, способным скользить без трения вдоль стенок сосуда,\nнаходится идеальный одноатомный газ. Газу сообщают некоторое количество теплоты. Как в этом процессе изменяются следующие\nфизические величины: внутренняя энергия газа и средняя кинетическая энергия хаотического движения молекул газа?\n<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------|--------------------------------|\n| Внутренняя энергия газа   Средняя кинетическая энергия    |\n|                       | хаотического движ ения молекул газа |\n|-----------------------|--------------------------------|\n---------------------------------------------------------|\n\" class=\"math-display\" src=\"index-f1d566aca0660347c74ad1bc1b1812a8.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия — 1 <br/>1) Так как поршень подвижный, то процесс можно считать изобарным (<img alt=\"p = const  \" class=\"math\" src=\"index-e28a82c79758bf1c3a3c8e6e95d2ae25.svg\"/>). Запишем первое начало термодинамики для\nизобарного процесса:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-b0ba47c14cd0636b23c61bcf57f1c735.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-e459759f07d199d71736563c3784b61a.svg\"/> — количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-e5b41b3aa8cb2e77a8855ed9d54f75c2.svg\"/> — изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-2edd5fabc5ef38faced7392151264e59.svg\"/> — работа газа.<br/>Сообщенное газу количество теплоты в изобарном процессе идет на изменение внутренней энергии и совершение работы.\n<br/><br/>Средняя кинетическая энергия хаотического движения молекул газа — 1 <br/>2) Среднюю кинетическую энергию можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"Ek = 3kT,\n    2\n\" class=\"math-display\" src=\"index-b0285c7640e2324c7b934ff085020128.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-278cacc800c3855fc18d24a558aeff2b.svg\"/> — постоянная Больцмана, <img alt=\"T  \" class=\"math\" src=\"index-72daff36c962bf49890b2f4388fbf949.svg\"/> — абсолютная температура газа.<br/>Так как температура увеличивается, то <img alt=\"Ek  \" class=\"math\" src=\"index-d16467e675b187849150511423f785b8.svg\"/> также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9bc14dcbcab5898341e6ffbf97ba0b22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28347/index-9bc14dcbcab5898341e6ffbf97ba0b22.svg", "index-f1d566aca0660347c74ad1bc1b1812a8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28347/index-f1d566aca0660347c74ad1bc1b1812a8.svg", "index-e28a82c79758bf1c3a3c8e6e95d2ae25.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-e28a82c79758bf1c3a3c8e6e95d2ae25.svg", "index-b0ba47c14cd0636b23c61bcf57f1c735.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-b0ba47c14cd0636b23c61bcf57f1c735.svg", "index-e459759f07d199d71736563c3784b61a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-e459759f07d199d71736563c3784b61a.svg", "index-e5b41b3aa8cb2e77a8855ed9d54f75c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-e5b41b3aa8cb2e77a8855ed9d54f75c2.svg", "index-2edd5fabc5ef38faced7392151264e59.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-2edd5fabc5ef38faced7392151264e59.svg", "index-b0285c7640e2324c7b934ff085020128.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-b0285c7640e2324c7b934ff085020128.svg", "index-278cacc800c3855fc18d24a558aeff2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-278cacc800c3855fc18d24a558aeff2b.svg", "index-72daff36c962bf49890b2f4388fbf949.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-72daff36c962bf49890b2f4388fbf949.svg", "index-d16467e675b187849150511423f785b8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28348/index-d16467e675b187849150511423f785b8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:22:12Z", "updated_at": "2026-04-18T16:44:07Z"}, {"id": 14090, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Кусок льда аккуратно опускают в калориметр с тёплой водой и отмечают уровень воды. Затем лёд полностью тает.\nУдельная теплоёмкость калориметра пренебрежимо мала. Как изменяются в ходе этого процесса следующие физические\nвеличины: уровень воды в калориметре по сравнению с отмеченным и внутренняя энергия содержимого калориметра?\n<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|-----------------------|\n|Уровень воды в калориметре   Внутренняя энергия  |\n| по сравнению с отм еченным | содерж имого калориметра |\n|-------------------------|-----------------------|\n---------------------------------------------------\n\" class=\"math-display\" src=\"index-986d80e09e8584bfbea1f52d05e2be22.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уровень воды — 3 <br/>1) Так как плотность льда меньше плотности воды, то лед будет плавать на ее поверхности. По условию плавания тел, в этом случае\nсила тяжести уравновешивается силой Архимеда:\n</p> <div class=\"math-display\">\n<img alt=\"m лg = ρвgV  ⇒   V = mл-,     (1)\n                    ρв\n\" class=\"math-display\" src=\"index-17b31c5c188941dd0fb2caf3e89b6d7b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-a7fef743403ac69d8cb92c9e82c3d1b8.svg\"/> — масса льда, <img alt=\"g  \" class=\"math\" src=\"index-86fcd2f3ecfec2d05385f3befbae0315.svg\"/> — ускорение свободного падения, <img alt=\"ρ\n в  \" class=\"math\" src=\"index-f2e2e62674378cacbcbe3dc55cd18945.svg\"/> — плотность воды, <img alt=\"V  \" class=\"math\" src=\"index-95902dc86d03f0bca5d3970c258664a7.svg\"/> — объём воды, вытесненной\nльдом.<br/>После того как лёд растает, он займёт объём:\n</p> <div class=\"math-display\">\n<img alt=\"     m\nV ′ = ρл     (2)\n      в\n\" class=\"math-display\" src=\"index-f5084eebad1fecb914b6e85c7dcbe6bc.svg\"/></div>\n<p class=\"indent\">   Сравнив (1) и (2), можно заметить, что объём воды, вытесняемой льдом до таяния, равен объёму, который займет лед после\nтаяния. То есть суммарный объём вещества не изменится. Следовательно, уровень воды в калориметре также не\nизменится.<br/><br/>Суммарная внутренняя энергия — 3 <br/>2) Из первого начала термодинамики следует, что изменение внутренней энергии системы зависит от количества теплоты и работы,\nсовершенной над системой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= A + ΔU   ⇒   ΔU = Q − A,\n\" class=\"math-display\" src=\"index-0b464612a635b6620b817153825dd17d.svg\"/></div> <p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-dba045577af3ceca9cbc9f3fbe44accc.svg\"/> — количество теплоты, полученное системой, <img alt=\"A  \" class=\"math\" src=\"index-332a5ebe7776b6bf7ea964c5ba62e002.svg\"/> — работа, совершенная над системой, <img alt=\"ΔU  \" class=\"math\" src=\"index-9a0378722a1b1ec70be9e9c61f564552.svg\"/> — изменение внутренней\nэнергии системы.<br/>Данную систему можно считать изолированной (из-за калориметра), то есть она не взаимодействует с окружающей средой.\nСледовательно, количество теплоты <img alt=\"Q  \" class=\"math\" src=\"index-64d5e96ba1b70187f38a2e9f8e3dae10.svg\"/> равно нулю. <br/>Также над системой не совершается работы, то есть <img alt=\"A= 0  \" class=\"math\" src=\"index-93e5131c5240429d40fbd79f3793293f.svg\"/>.<br/>Таким образом, изменение внутренней энергии системы равно нулю. Следовательно, она постоянна.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-986d80e09e8584bfbea1f52d05e2be22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28373/index-986d80e09e8584bfbea1f52d05e2be22.svg", "index-17b31c5c188941dd0fb2caf3e89b6d7b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-17b31c5c188941dd0fb2caf3e89b6d7b.svg", "index-a7fef743403ac69d8cb92c9e82c3d1b8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-a7fef743403ac69d8cb92c9e82c3d1b8.svg", "index-86fcd2f3ecfec2d05385f3befbae0315.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-86fcd2f3ecfec2d05385f3befbae0315.svg", "index-f2e2e62674378cacbcbe3dc55cd18945.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-f2e2e62674378cacbcbe3dc55cd18945.svg", "index-95902dc86d03f0bca5d3970c258664a7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-95902dc86d03f0bca5d3970c258664a7.svg", "index-f5084eebad1fecb914b6e85c7dcbe6bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-f5084eebad1fecb914b6e85c7dcbe6bc.svg", "index-0b464612a635b6620b817153825dd17d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-0b464612a635b6620b817153825dd17d.svg", "index-dba045577af3ceca9cbc9f3fbe44accc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-dba045577af3ceca9cbc9f3fbe44accc.svg", "index-332a5ebe7776b6bf7ea964c5ba62e002.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-332a5ebe7776b6bf7ea964c5ba62e002.svg", "index-9a0378722a1b1ec70be9e9c61f564552.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-9a0378722a1b1ec70be9e9c61f564552.svg", "index-64d5e96ba1b70187f38a2e9f8e3dae10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-64d5e96ba1b70187f38a2e9f8e3dae10.svg", "index-93e5131c5240429d40fbd79f3793293f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28374/index-93e5131c5240429d40fbd79f3793293f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Гидростатика", "Сила Архимеда", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:56:20Z", "updated_at": "2026-05-20T17:11:57Z"}, {"id": 18389, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В неглубоком сосуде наблюдают установившийся процесс кипения воды, при этом со дна сосуда к поверхности поднимается\nгазовый пузырёк. Как изменяется при подъёме объём пузырька и средняя кинетическая энергия молекул водяного\nпара?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|--------------------------|\n|О бъём пузырька |   Средняя кинетическая    |\n|---------------|энергия-молекул-водяного-пара-|\n|               |                          |\n--------------------------------------------\n\" class=\"math-display\" src=\"index-44380dd4e030e67467ca203170473544.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Давление столба жидкости:\n</p> <div class=\"math-display\">\n<img alt=\"P = ρgh\n\" class=\"math-display\" src=\"index-ce901ba75f641c0c0f290295760155d0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ρ  \" class=\"math\" src=\"index-af9d69acc8eb7ebfd4f5c694cc7c90dd.svg\"/> – плотность воды, <img alt=\"h  \" class=\"math\" src=\"index-8fc3e9a26f5ec010e3b16ce91f76c2ea.svg\"/> – высота столба воды.<br/>Так как в сосуде установившийся процесс кипения воды, то число вылетевших из жидкости молекул воды, в среднем, равно числу\nих поглощения водой. Следовательно, температура пара, примерно постоянна, так как при подъеме давление на пузырек\nуменьшается, то объём пузырька будет увеличиваться.<br/>2) Так как в сосуде установившийся процесс кипения воды, то число вылетевших из жидкости молекул воды, в среднем, равно числу\nих поглощения водой. Следовательно, температура пара, примерно постоянна, а значит, постоянна и средняя кинетическая энергия\nего молекул.\n</p> <div class=\"math-display\">\n<img alt=\"--  3\nE = 2kT.\n\" class=\"math-display\" src=\"index-d531e4237d37ecb5bef17d857ac7db0d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-44380dd4e030e67467ca203170473544.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36142/index-44380dd4e030e67467ca203170473544.svg", "index-ce901ba75f641c0c0f290295760155d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36143/index-ce901ba75f641c0c0f290295760155d0.svg", "index-af9d69acc8eb7ebfd4f5c694cc7c90dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36143/index-af9d69acc8eb7ebfd4f5c694cc7c90dd.svg", "index-8fc3e9a26f5ec010e3b16ce91f76c2ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36143/index-8fc3e9a26f5ec010e3b16ce91f76c2ea.svg", "index-d531e4237d37ecb5bef17d857ac7db0d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36143/index-d531e4237d37ecb5bef17d857ac7db0d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Гидростатика", "Давление жидкости", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2022-01-23T14:47:21Z", "updated_at": "2026-07-03T09:18:42Z"}, {"id": 103105, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находится идеальный газ. Как изменятся плотность газа и количество вещества газа в сосуде, если\nчасть газа выпустить из сосуда? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|-----------------------|\n|Плотность газа-Количество вещества-газа|\n---------------------------------------\n\" class=\"math-display\" src=\"index-7207d038dad6d93ed3d54808685b0052.svg\"/></div>", "solution_html": "<p class=\"noindent\">Плотность — 2 <br/>1) Плотность газа:\n</p> <div class=\"math-display\">\n<img alt=\"   m\nρ= -V ,\n\" class=\"math-display\" src=\"index-0957952932690b28752b0db253574f27.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-c5bdb8ce91f30483e3754858e289ed7a.svg\"/> — масса газа.<br/>Так как объем газа не изменяется, а его масса уменьшается, то плотность газа также уменьшается.<br/>Количество вещества — 2<br/>2) Так как из сосуда выпустили часть газа, то количество вещества уменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7207d038dad6d93ed3d54808685b0052.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212560/index-7207d038dad6d93ed3d54808685b0052.svg", "index-0957952932690b28752b0db253574f27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212561/index-0957952932690b28752b0db253574f27.svg", "index-c5bdb8ce91f30483e3754858e289ed7a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212561/index-c5bdb8ce91f30483e3754858e289ed7a.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T10:55:41Z", "updated_at": "2026-04-07T20:05:38Z"}, {"id": 14063, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В вертикальном цилиндрическом сосуде под подвижным поршнем массой <img alt=\"M  \" class=\"math\" src=\"index-9bc14dcbcab5898341e6ffbf97ba0b22.svg\"/>, способным скользить без трения вдоль стенок сосуда,\nнаходится идеальный газ. Газу сообщают некоторое количество теплоты. Как в этом процессе изменяются следующие\nфизические величины: концентрация молекул и средняя кинетическая энергия хаотического движения молекул газа?\n<br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|--------------------------------|\n| Концентрация молекул газа   Средняя кинетическая энергия   |\n|                         | хаотического движ ения молекул газа\n|-------------------------|--------------------------------|\n------------------------------------------------------------\n\" class=\"math-display\" src=\"index-087097ba5e7abf6d44b9a4a925af4f97.svg\"/></div>", "solution_html": "<p class=\"noindent\">Концентрация — 2 <br/>1) Концентрация молекул:\n</p> <div class=\"math-display\">\n<img alt=\"    N\nn=  V ,\n\" class=\"math-display\" src=\"index-c94b67d15bb8ff21fb4555c9505b4eaa.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-c2d935061bdcdd7729746edcafad8d84.svg\"/> — количество молекул газа в объеме <img alt=\"V  \" class=\"math\" src=\"index-3865c3830ad61eb4693845f3eb66c67d.svg\"/>.<br/>Объем в данном процессе увеличивается, а количество молекул не меняется. Следовательно, концентрация молекул газа\nуменьшается.<br/><br/>Средняя кинетическая энергия хаотического движения молекул газа — 1 <br/>2) Среднюю кинетическую энергию можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"Ek = 3kT,\n    2\n\" class=\"math-display\" src=\"index-be747c984da3acdf6277cc92c36da6e3.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-8de40396cf62c25e6dd3dbaca99f3798.svg\"/> — постоянная Больцмана, <img alt=\"T  \" class=\"math\" src=\"index-f9095a85e9446f58c2588345c10d9af2.svg\"/> — абсолютная температура газа.<br/>Так как температура увеличивается, то <img alt=\"Ek  \" class=\"math\" src=\"index-ddd5bbbe0003015d7724ac4f14ae16f2.svg\"/> также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9bc14dcbcab5898341e6ffbf97ba0b22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28319/index-9bc14dcbcab5898341e6ffbf97ba0b22.svg", "index-087097ba5e7abf6d44b9a4a925af4f97.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28319/index-087097ba5e7abf6d44b9a4a925af4f97.svg", "index-c94b67d15bb8ff21fb4555c9505b4eaa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-c94b67d15bb8ff21fb4555c9505b4eaa.svg", "index-c2d935061bdcdd7729746edcafad8d84.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-c2d935061bdcdd7729746edcafad8d84.svg", "index-3865c3830ad61eb4693845f3eb66c67d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-3865c3830ad61eb4693845f3eb66c67d.svg", "index-be747c984da3acdf6277cc92c36da6e3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-be747c984da3acdf6277cc92c36da6e3.svg", "index-8de40396cf62c25e6dd3dbaca99f3798.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-8de40396cf62c25e6dd3dbaca99f3798.svg", "index-f9095a85e9446f58c2588345c10d9af2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-f9095a85e9446f58c2588345c10d9af2.svg", "index-ddd5bbbe0003015d7724ac4f14ae16f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28320/index-ddd5bbbe0003015d7724ac4f14ae16f2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ"], "created_at": "2021-12-10T09:00:26Z", "updated_at": "2026-05-20T17:05:50Z"}, {"id": 14091, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Кусок льда аккуратно опускают в калориметр с тёплой водой и отмечают уровень воды. Затем лёд полностью тает. Удельная\nтеплоёмкость калориметра пренебрежимо мала. Как изменяются в ходе этого процесса следующие физические величины:\nтемпература воды в калориметре и уровень воды в калориметре по сравнению с отмеченным? <br/>Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------|-------------------------|\n| Температура воды |Уровень воды в калориметре\n|   в калориметре  | по сравнению с отмеченным |\n|------------------|-------------------------|\n---------------------------------------------|\n\" class=\"math-display\" src=\"index-a2b57c4fd00948b26f4234280cc61c8c.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура воды — 2 <br/>1) В ходе процесса плавления льда температура воды будет понижаться, так как тепло идет от более горячего, к менее\nгорячему.<br/>Суммарная внутренняя энергия – 3 <br/>Уровень воды — 3 <br/>2) Так как плотность льда меньше плотности воды, то лед будет плавать на ее поверхности. По условию плавания тел, в этом случае\nсила тяжести уравновешивается силой Архимеда:\n</p> <div class=\"math-display\">\n<img alt=\"                    mл\nm лg = ρвgV  ⇒   V = ρв-,     (1)\n\" class=\"math-display\" src=\"index-7507ba1728a674f02803284cc5bc06fd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-bf807a89d009de26554d99732f20a1f6.svg\"/> — масса льда, <img alt=\"g  \" class=\"math\" src=\"index-35abe407bfe9d4e14af4b144bc3dd3be.svg\"/> — ускорение свободного падения, <img alt=\"ρв  \" class=\"math\" src=\"index-6473e552f65acc3a210dd6d127d6ec52.svg\"/> — плотность воды, <img alt=\"V  \" class=\"math\" src=\"index-fac5a15983babddc6d11646dda89536f.svg\"/> — объём воды, вытесненной\nльдом.<br/>После того как лёд растает, он займёт объём:\n</p> <div class=\"math-display\">\n<img alt=\"  ′  mл\nV  = ρв-     (2)\n\" class=\"math-display\" src=\"index-6d7911b8506f13fad05831547bb26848.svg\"/></div>\n<p class=\"indent\">   Сравнив (1) и (2), можно заметить, что объём воды, вытесняемой льдом до таяния, равен объёму, который займет лед после\nтаяния. То есть суммарный объём вещества не изменится. Следовательно, уровень воды в калориметре также не\nизменится.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a2b57c4fd00948b26f4234280cc61c8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28375/index-a2b57c4fd00948b26f4234280cc61c8c.svg", "index-7507ba1728a674f02803284cc5bc06fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28376/index-7507ba1728a674f02803284cc5bc06fd.svg", "index-bf807a89d009de26554d99732f20a1f6.svg": "https://3.shkolkovo.online/api/latex-service/v1 во вещества газа <img alt=\"    N\nν = NА  \" class=\"math\" src=\"index-75474b5fde82862b568049477a5624b4.svg\"/> (где <img alt=\"N А  \" class=\"math\" src=\"index-a7a013d2728089c5c893f3779513befc.svg\"/> - число Авогадро (константа) ) не изменяется, значит количество\nмолекул газа <img alt=\"N  \" class=\"math\" src=\"index-e8bf803c5d650a39b563b8d36c32c03f.svg\"/> тоже не изменяется. Запишем формулу для конценттрации <img alt=\"n  \" class=\"math\" src=\"index-f0993889439776e3aac1afffa4295851.svg\"/>:\n</p> <div class=\"align\"><img alt=\"pict\" src=\"index-47a40b86af2fa62fca6a498b60b60734.svg\"/></div>\n<p class=\"indent\">   Количество молекул газа <img alt=\"N  \" class=\"math\" src=\"index-1a9754ac27ba8621195da4153b16d9c6.svg\"/> не изменяется, значит <img alt=\"    1\nn ∼ V-  \" class=\"math\" src=\"index-b097306f3df85f2eee0c67033c0ec5ae.svg\"/>.\n</p><p class=\"indent\">   В процессе 1–2 объём газа монотонно возрастает, следовательно, концентрация газа уменьшается.\n</p><p class=\"indent\">   3) </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p>\n<div class=\"tabular\"> <table class=\"tabular\" id=\"TBL-1\"><colgroup id=\"TBL-1-1g\"><col id=\"TBL-1-1\"/></colgroup><colgroup id=\"TBL-1-2g\"><col id=\"TBL-1-2\"/></colgroup><tbody><tr class=\"hline\"><td></td><td></td></tr><tr id=\"TBL-1-1-\" style=\"vertical-align:baseline;\"><td class=\"td11\" id=\"TBL-1-1-1\" style=\"white-space:nowrap; text-align:center;\"> Внутренняя энергия газа в процессе 2–3  </td><td class=\"td11\" id=\"TBL-1-1-2\" style=\"white-space:nowrap; text-align:center;\"> Концентрация газа в процессе 1–2  </td>\n</tr><tr class=\"hline\"><td></td><td></td></tr><tr id=\"TBL-1-2-\" style=\"vertical-align:baseline;\"><td class=\"td11\" id=\"TBL-1-2-1\" style=\"white-space:nowrap; text-align:center;\">                   2                             </td><td class=\"td11\" id=\"TBL-1-2-2\" style=\"white-space:nowrap; text-align:center;\">                2                         </td>\n</tr
