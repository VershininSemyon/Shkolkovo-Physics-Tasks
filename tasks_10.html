модинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль одноатомного идеального газа участвует в процессе 1–2–3, график которого изображён на рисунке в координатах <img alt=\"  V − T  \" class=\"math\" src=\"index-aa64dc908a0c342d9a95e91ae634ae50.svg\"/>,\nгде <img alt=\"V  \" class=\"math\" src=\"index-74f51652de24d5a962e39634666f55b9.svg\"/> – объём газа, <img alt=\"T  \" class=\"math\" src=\"index-67db464d12b3ead2240700a11c706b8b.svg\"/> – абсолютная температура газа. Как изменяются концентрация молекул газа <img alt=\"n  \" class=\"math\" src=\"index-5daa2d4e748c9ce2c41d14a00fed1a89.svg\"/> в ходе процесса 1–2 и\nдавление газа <img alt=\"p  \" class=\"math\" src=\"index-813d8530e40dcf850c554b658b169d61.svg\"/> в ходе процесса 2–3? Масса газа остаётся постоянной. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"103129 (1).png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|----------------|\n| Концентрация молекул газа  Давление газа |\n|----в-ходе-процесса 1–2----|в ходе процесса-2–3\n--------------------------------------------\n\" class=\"math-display\" src=\"index-939efc48601396e627080d3734b6b74c.svg\"/></div>", "solution_html": "<p class=\"noindent\">Концентрация вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"    N\nn=  V .\n\" class=\"math-display\" src=\"index-2c78f45aec627051c748c6c589baac39.svg\"/></div>\n<p class=\"indent\">   Т.к. число молекул в процессе постоянно и объём газа постоянен, то концентрация постоянна на процессе 1-2.<br/>Т.к. процесс 2-3 <img alt=\"V ∼T  \" class=\"math\" src=\"index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg\"/>, то по закону Гей-Люссака это изобарный процесс.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aa64dc908a0c342d9a95e91ae634ae50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-aa64dc908a0c342d9a95e91ae634ae50.svg", "index-74f51652de24d5a962e39634666f55b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-74f51652de24d5a962e39634666f55b9.svg", "index-67db464d12b3ead2240700a11c706b8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-67db464d12b3ead2240700a11c706b8b.svg", "index-5daa2d4e748c9ce2c41d14a00fed1a89.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-5daa2d4e748c9ce2c41d14a00fed1a89.svg", "index-813d8530e40dcf850c554b658b169d61.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-813d8530e40dcf850c554b658b169d61.svg", "103129 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/103129 (1).png", "index-939efc48601396e627080d3734b6b74c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212611/index-939efc48601396e627080d3734b6b74c.svg", "index-2c78f45aec627051c748c6c589baac39.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212612/index-2c78f45aec627051c748c6c589baac39.svg", "index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212612/index-a6dc1bdb8dc0a8d2e15acccff09bb31b.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T19:21:30Z", "updated_at": "2026-05-20T16:11:10Z"}, {"id": 64766, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Тонкая, упругая и мягкая оболочка герметичного воздушного шара наполнена водородом. Как изменяется с набором\nвысоты при быстром подъёме шара давление водорода и концентрация молекул водорода в шаре? Оболочку считать\nтеплоизолированной.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилось\n</p><p class=\"indent\">   2) уменьшилось\n</p><p class=\"indent\">   3) не изменилось\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|--------------------|\n|Давление водорода|К онцентрация м олекул|\n|                |      водорода       |\n|----------------|--------------------|\n---------------------------------------\n\" class=\"math-display\" src=\"index-60d348871e284e964e0b33ca7afa8503.svg\"/></div>", "solution_html": "<p class=\"noindent\">1)Давление водорода уравновешивает давление атмосферы и давление сил упругости шарика:\n</p> <div class=\"math-display\">\n<img alt=\"pвод = pатм +pупр,\n\" class=\"math-display\" src=\"index-a9a160e7b08ece7bdf57d48564e3cbdb.svg\"/></div>\n<p class=\"indent\">   С увеличением высоты атмосферное давление уменьшается. В начальный момент давление водорода внутри шара оказывается\nбольше внешнего давления:\n</p> <div class=\"math-display\">\n<img alt=\"pвод &gt; pатм +pупр,\n\" class=\"math-display\" src=\"index-09a65578c64f2cac04f29b643aaa4680.svg\"/></div>\n<p class=\"indent\">   поэтому газ растягивает оболочку и шар расширяется. При увеличении объёма возрастают силы упругости, действующие\nсо стороны оболочки шарика, а потому ворастает и давление сил упругости. Однако уменьшение атмосферного\nдавления оказывается больше уменьшения давления сил упругости, поэтому давление водорода внутри шарика\nуменьшается.<br/>Давление водорода – 2.<br/>\n</p><p class=\"indent\">   2)Концентрация равна:\n</p> <div class=\"math-display\">\n<img alt=\"n=  N,\n    V\n\" class=\"math-display\" src=\"index-0ea8db1ac77cd3301eec8c8707c89966.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-a21d0b24ce4914b773ef87176bd3b491.svg\"/> – количество молекул газа, <img alt=\"V  \" class=\"math\" src=\"index-998ab3fbb993150b7a8da4d4ceb839fb.svg\"/> – объём газа.<br/>\n</p><p class=\"indent\">   Так как количество молекул не изменяется, а объём увеличивается, то концентрация уменьшается.<br/>Концентрация молекул водорода – 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-60d348871e284e964e0b33ca7afa8503.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116960/index-60d348871e284e964e0b33ca7afa8503.svg", "index-a9a160e7b08ece7bdf57d48564e3cbdb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116961/index-a9a160e7b08ece7bdf57d48564e3cbdb.svg", "index-09a65578c64f2cac04f29b643aaa4680.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116961/index-09a65578c64f2cac04f29b643aaa4680.svg", "index-0ea8db1ac77cd3301eec8c8707c89966.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116961/index-0ea8db1ac77cd3301eec8c8707c89966.svg", "index-a21d0b24ce4914b773ef87176bd3b491.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116961/index-a21d0b24ce4914b773ef87176bd3b491.svg", "index-998ab3fbb993150b7a8da4d4ceb839fb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116961/index-998ab3fbb993150b7a8da4d4ceb839fb.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["Демидова 2021"], "created_at": "2023-07-01T11:14:24Z", "updated_at": "2026-05-27T14:23:31Z"}, {"id": 102054, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Тонкая, упругая и мягкая оболочка герметичного воздушного шара наполнена водородом. Как изменяется с высотой при быстром\nподъёме объём водорода и средняя кинетическая энергия теплового движения молекул водорода? Оболочку считать\nтеплоизолирующей.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилось<br/>2) уменьшилось<br/>3) не изменилось<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------------------------|\n|О бъём водорода|Средняя кинетическая энергия теплового\n|               |     движения м олекул водорода     |\n|---------------|----------------------------------|\n---------------------------------------------------|\n\" class=\"math-display\" src=\"index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg\"/></div>", "solution_html": "<p class=\"noindent\">1)Давление водорода складывается из:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"pвод = pатм +pупр,\n\" class=\"math-display\" src=\"index-6cac0ee007925d3d67f5cd130cdcebb6.svg\"/></div>\n<p class=\"indent\">   С увеличением высоты атмосферное давление уменьшается. В начальный момент давление водорода внутри шара оказывается\nбольше внешнего давления:\n</p> <div class=\"math-display\">\n<img alt=\"pвод &gt; pатм +pупр,\n\" class=\"math-display\" src=\"index-7e0330b6872ca592e58051221753d364.svg\"/></div>\n<p class=\"indent\">   поэтому газ растягивает оболочку и <span class=\"labx-0900\">оболочка шара в объеме увеличивается</span>. <br/>Объём водорода – 1.<br/>\n</p><p class=\"indent\">   2)Т.к. оболочка теплоизолирующая, процесс адиабатический: <img alt=\"Q = 0  \" class=\"math\" src=\"index-a460a382d05ca6ace2e1d07aed6d2ec4.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A.\n\" class=\"math-display\" src=\"index-b62c1e39130a9efb9c7437294ff32a56.svg\"/></div>\n<p class=\"indent\">   При расширении газ совершает положительную работу <img alt=\"(A &gt; 0)  \" class=\"math\" src=\"index-5ae2b91b7889e8181eba83586629c836.svg\"/>, поэтому <img alt=\"ΔU &lt; 0  \" class=\"math\" src=\"index-21dda10209fc03ed66160e0a687555ed.svg\"/>. Внутренняя энергия идеального газа зависит\nтолько от температуры, значит температура уменьшается.<br/>Средняя кинетическая энергия молекул:\n</p> <div class=\"math-display\">\n<img alt=\"¯Ek = 3kT.\n    2\n\" class=\"math-display\" src=\"index-c741de17e07ebbb1f89eff8cbf554843.svg\"/></div>\n<p class=\"indent\">   Так как уменьшается температура, то средняя кинетическая энергия молекул тоже уменьшается.<br/>Средняя кинетическая энергия теплового движения молекул –2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210008/index-6408bb9b1cd7ce8628f3e1f8bfd237ab.svg", "index-6cac0ee007925d3d67f5cd130cdcebb6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-6cac0ee007925d3d67f5cd130cdcebb6.svg", "index-7e0330b6872ca592e58051221753d364.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-7e0330b6872ca592e58051221753d364.svg", "index-a460a382d05ca6ace2e1d07aed6d2ec4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-a460a382d05ca6ace2e1d07aed6d2ec4.svg", "index-b62c1e39130a9efb9c7437294ff32a56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-b62c1e39130a9efb9c7437294ff32a56.svg", "index-5ae2b91b7889e8181eba83586629c836.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-5ae2b91b7889e8181eba83586629c836.svg", "index-21dda10209fc03ed66160e0a687555ed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-21dda10209fc03ed66160e0a687555ed.svg", "index-c741de17e07ebbb1f89eff8cbf554843.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210009/index-c741de17e07ebbb1f89eff8cbf554843.svg"}, "tags": [], "sources": ["ЕГКР 2025.№3"], "created_at": "2024-12-15T12:08:19Z", "updated_at": "2026-05-27T15:03:22Z"}, {"id": 64382, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Тонкая, упругая и мягкая оболочка герметичного воздушного шара наполнена воздухом. Как изменяются с высотой при быстром\nподъёме внутренняя энергия воздуха в шаре и его объём? Теплопроводностью оболочки шара пренебречь. Для каждой величины\nопределите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------|--------------|\n|Внутренняя энергия воздуха|О-бъём воздуха\n----------------------------------------|\n\" class=\"math-display\" src=\"index-61fc236863199f6714e1d5df02300291.svg\"/></div>", "solution_html": "<p class=\"noindent\">1)Объём воздуха:<br/>Давление воздуха уравновешивает давление атмосферы и давление сил упругости шарика:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"pвоз = pатм +pупр,\n\" class=\"math-display\" src=\"index-0092ea635a088ef8433698691ad3bf81.svg\"/></div>\n<p class=\"indent\">   С увеличением высоты атмосферное давление уменьшается. В начальный момент давление воздуха внутри шара оказывается\nбольше внешнего давления:\n</p> <div class=\"math-display\">\n<img alt=\"pвоз &gt; pатм +pупр,\n\" class=\"math-display\" src=\"index-3692c7c5faf8f75f4ff1a337a1446896.svg\"/></div>\n<p class=\"indent\">   поэтому газ растягивает оболочку и <span class=\"labx-0900\">оболочка шара в объеме увеличивается</span>. <br/>Объём воздуха – 1.<br/>\n</p><p class=\"indent\">   2)Внутренняя энергия воздуха:<br/>Т.к. оболочка теплоизолирующая, процесс адиабатический: <img alt=\"Q = 0  \" class=\"math\" src=\"index-b329df9191c47cf2c89f48635d8a9f08.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A.\n\" class=\"math-display\" src=\"index-d971859f24575649ad890a91458dffe4.svg\"/></div>\n<p class=\"indent\">   При расширении газ совершает положительную работу <img alt=\"(A &gt; 0)  \" class=\"math\" src=\"index-57d287ec18ad9bac9bb1592ff7bfac6d.svg\"/>, тогда внутренняя энергия воздуха:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = − A&lt; 0,\n\" class=\"math-display\" src=\"index-e90213a70d1036805ec7786d654dbd63.svg\"/></div>\n<p class=\"indent\">   то есть внутренняя энергия воздуха уменьшается.<br/>Внутренняя энергия воздуха – 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-61fc236863199f6714e1d5df02300291.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116296/index-61fc236863199f6714e1d5df02300291.svg", "index-0092ea635a088ef8433698691ad3bf81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-0092ea635a088ef8433698691ad3bf81.svg", "index-3692c7c5faf8f75f4ff1a337a1446896.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-3692c7c5faf8f75f4ff1a337a1446896.svg", "index-b329df9191c47cf2c89f48635d8a9f08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-b329df9191c47cf2c89f48635d8a9f08.svg", "index-d971859f24575649ad890a91458dffe4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-d971859f24575649ad890a91458dffe4.svg", "index-57d287ec18ad9bac9bb1592ff7bfac6d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-57d287ec18ad9bac9bb1592ff7bfac6d.svg", "index-e90213a70d1036805ec7786d654dbd63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116297/index-e90213a70d1036805ec7786d654dbd63.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": ["Досрочный вариант 2022"], "created_at": "2023-06-21T16:47:36Z", "updated_at": "2026-05-27T16:00:22Z"}, {"id": 177705, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Тонкая, упругая и мягкая оболочка герметичного воздушного шара наполнена воздухом. Как изменяются с высотой при быстром\nподъёме внутренняя энергия и концентрация молекул воздуха в шаре? Теплопроводностью оболочки шара пренебречь. Для каждой\nвеличины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------------|--------------------------|\n|В-нутренняя-энергия-воздуха-|Концентрация-молекул воздуха|\n-----------------------------------------------------|\n\" class=\"math-display\" src=\"index-072e25edd856b1ece644a77f2220c9bc.svg\"/></div>", "solution_html": "<p class=\"noindent\">1)По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.\n</p><p class=\"indent\">   Так как теплопроводностью оболочки шара можно пренебречь, процесс адиабатический <img alt=\"Q = 0  \" class=\"math\" src=\"index-f8c2669a63bd420bd0e9aeed6f794c12.svg\"/>, тогда\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = −A.\n\" class=\"math-display\" src=\"index-cdc7f87f0b939a9aae7e7b6eb73aadb4.svg\"/></div>\n<p class=\"indent\">   Давление воздуха уравновешивает давление атмосферы и давление сил упругости шарика:<br/>\n</p> <div class=\"math-display\">\n<img alt=\"pвоз = pатм +pупр,\n\" class=\"math-display\" src=\"index-22f58263f6d19e063fe9304861b15088.svg\"/></div>\n<p class=\"indent\">   С увеличением высоты атмосферное давление уменьшается. В начальный момент давление воздуха внутри шара оказывается\nбольше внешнего давления:\n</p> <div class=\"math-display\">\n<img alt=\"pвоз &gt; pатм +pупр,\n\" class=\"math-display\" src=\"index-1860092d9f7812c1c9244f1ae439ce08.svg\"/></div>\n<p class=\"indent\">   поэтому газ растягивает оболочку и <span class=\"labx-0900\">оболочка шара в объеме увеличивается</span>. <br/>Газ совершит положительную работу <img alt=\"A &gt; 0  \" class=\"math\" src=\"index-251f7bd35c8a76973d6060549c75b2ad.svg\"/>, тогда внутренняя энергия воздуха:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = − A&lt; 0,\n\" class=\"math-display\" src=\"index-e59295b0d69be02c6ac0476ce833bd2c.svg\"/></div>\n<p class=\"indent\">   то есть внутренняя энергия воздуха уменьшится.<br/>Внутренняя энергия воздуха – 2.\n</p><p class=\"indent\">   2)Концентрация молекул определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"     N-\n(n = V )\n\" class=\"math-display\" src=\"index-6700ddd23fb8a1cd9793ab0eac723a66.svg\"/></div>\n<p class=\"indent\">   Т.к. объем воздуха внутри шара увеличится, то концентрация молекул внутри уменьшится.<br/>Концентрация молекул воздуха – 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-072e25edd856b1ece644a77f2220c9bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387143/index-072e25edd856b1ece644a77f2220c9bc.svg", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-f8c2669a63bd420bd0e9aeed6f794c12.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-f8c2669a63bd420bd0e9aeed6f794c12.svg", "index-cdc7f87f0b939a9aae7e7b6eb73aadb4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-cdc7f87f0b939a9aae7e7b6eb73aadb4.svg", "index-22f58263f6d19e063fe9304861b15088.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-22f58263f6d19e063fe9304861b15088.svg", "index-1860092d9f7812c1c9244f1ae439ce08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-1860092d9f7812c1c9244f1ae439ce08.svg", "index-251f7bd35c8a76973d6060549c75b2ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-251f7bd35c8a76973d6060549c75b2ad.svg", "index-e59295b0d69be02c6ac0476ce833bd2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-e59295b0d69be02c6ac0476ce833bd2c.svg", "index-6700ddd23fb8a1cd9793ab0eac723a66.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387144/index-6700ddd23fb8a1cd9793ab0eac723a66.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": ["Досрочный вариант 2022"], "created_at": "2026-04-12T19:38:00Z", "updated_at": "2026-05-27T16:17:03Z"}, {"id": 60870, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния 2 моль идеального газа. Какие процессы\nсвязаны с наименьшими положительными значениями работ газа и работы внешних сил? Установите соответствие между такими\nпроцессами и номерами процессов на диаграмме.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"f-ege-10-2-1.png\" width=\"394\"/></p></div>\n<p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ПРО ЦЕС СЫ                НОМ ЕРА П РОЦЕ ССО В\nА) работа газа положительна 1)1\nи м инимальна              2)2\nБ) работа внешних сил     3)3\nположительна и минимальна 4)4\n\" class=\"math-display\" src=\"index-ddf792044a6f710f614b4ed585ba6cef.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"-------\n|А |Б |\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-8eb118f104268c797d81b5fcab669c3a.svg\"/></div>", "solution_html": "<p class=\"noindent\">Работа газа положительна, когда объём увеличивается (процессы 3 и 4), работа внешних сил положительна, когда\nобъём уменьшается (процессы 1 и 2). При этом работа ЧИСЛЕННО равна площади под графиком в координатах\n<img alt=\"p − V  \" class=\"math\" src=\"index-0fc157358032372219bd1b22b4661682.svg\"/>.\n</p><p class=\"indent\">   А) Изобразим площади под графиками процессами 3 и 4\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"f-ege-10-2-2.png\" width=\"394\"/></p></div>\n<p class=\"noindent\">То есть ответ 3\n</p><p class=\"indent\">   Б) Изобразим площади под графиками процессами 1 и 2\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"f-ege-10-2-3.png\" width=\"394\"/></p></div>\n<p class=\"indent\">   То есть ответ 1\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-10-2-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110470/f-ege-10-2-1.png", "index-ddf792044a6f710f614b4ed585ba6cef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110470/index-ddf792044a6f710f614b4ed585ba6cef.svg", "index-8eb118f104268c797d81b5fcab669c3a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110470/index-8eb118f104268c797d81b5fcab669c3a.svg", "index-0fc157358032372219bd1b22b4661682.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110471/index-0fc157358032372219bd1b22b4661682.svg", "f-ege-10-2-2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110471/f-ege-10-2-2.png", "f-ege-10-2-3.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110471/f-ege-10-2-3.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": ["Демидова 2019"], "created_at": "2023-05-14T09:09:32Z", "updated_at": "2026-05-18T12:16:10Z"}, {"id": 96552, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния 2 моль идеального газа. Какие процессы\nсвязаны с наименьшим положительным значением работы газа и наибольшим положительным значением работы внешних сил?\nУстановите соответствие между такими процессами и номерами процессов на диаграмме.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"96552.png\" width=\"394\"/></p></div>\n<p class=\"indent\">   К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ПРО ЦЕС СЫ                НО МЕРА П РОЦ ЕССО В\nА) работа газа положительна 1)1\nи миним альна              2)2\nБ) работа внешних сил      3)3\nполож ительна и м аксимальна 4)4\n\" class=\"math-display\" src=\"index-569db401dc0961fbf0d92981cf96523a.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"-------\n|А |Б |\n|--|--|\n-------\n\" class=\"math-display\" src=\"index-8eb118f104268c797d81b5fcab669c3a.svg\"/></div>", "solution_html": "<p class=\"noindent\">Работа газа положительна, когда объём увеличивается (процессы 3 и 4), работа внешних сил положительна, когда объём\nуменьшается (процессы 1 и 2). При этом работа ЧИСЛЕННО равна площади под графиком в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg\"/>.\n<br/>\n</p><p class=\"indent\">   А) Оценим площади под графиками процессами 3 и 4, под процессом 3 площадь минимальна, значит и работа.<br/>Ответ под номером 3.<br/>\n</p><p class=\"indent\">   Б) Оценим площади под графиками процессами 1 и 2, под процессом 2 площадь максимальна, значит и работа.<br/>Ответ под номером 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"96552.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197294/96552.png", "index-569db401dc0961fbf0d92981cf96523a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197294/index-569db401dc0961fbf0d92981cf96523a.svg", "index-8eb118f104268c797d81b5fcab669c3a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197294/index-8eb118f104268c797d81b5fcab669c3a.svg", "index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197295/index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": ["Демидова 2019"], "created_at": "2024-09-15T14:47:43Z", "updated_at": "2026-04-20T17:04:11Z"}, {"id": 177480, "name": "Задача на МКТ и термодинамику. Установление соответствий. ", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль идеального газа участвует в процессе 1–2–3, график которого изображён на рисунке в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-d7b83a3c9dbada95b52a74d740ab8fc8.svg\"/>, где <img alt=\" p  \" class=\"math\" src=\"index-252c097fd53d14faacfc54800d8e7a9b.svg\"/> –\nдавление газа, <img alt=\"V  \" class=\"math\" src=\"index-7b52d77899f82239eda8cb9dd7cb78af.svg\"/> – объём газа. Как изменяются абсолютная температура газа <img alt=\"T  \" class=\"math\" src=\"index-e1eb3c283e87d023a49084b914eee5e9.svg\"/> в ходе процесса 1–2 и концентрация молекул газа\n<img alt=\"n  \" class=\"math\" src=\"index-8195e9f46fa5f53f1d36852a5e28661a.svg\"/> в ходе процесса 2–3? Масса газа остаётся постоянной.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"177.png\" width=\"368\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|----------------------|-----------------------|\n|А бсолютная тем пература |Концентрация молекул газа\n|-газа-в ходе процесса-1–2|---в-ходе-процесса 2–3---|\n|                      |                       |\n------------------------------------------------\n\" class=\"math-display\" src=\"index-73e13b3ed1ac80deb306498477a6569c.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Так как давление в ходе процесса 1-2 постоянно, то по закону Гей-Люссака:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const,\n\" class=\"math-display\" src=\"index-315f893187998394733095068935344c.svg\"/></div>\n<p class=\"indent\">   так как объём уменьшается, уменьшается и абсолютная температура. <br/>2) Концетрацию можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"p =nkT ⇒ n = -p-\n             kT\n\" class=\"math-display\" src=\"index-b8e0c9b96d4a2d6074728e6263e05fc2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"n  \" class=\"math\" src=\"index-40d8fcc6239faeb4f5386b34b89d5d56.svg\"/> – концентрация молекул газа, <img alt=\"T  \" class=\"math\" src=\"index-ad13dd277d3da2f977097b71e5d4faf2.svg\"/> – температура газа.<br/>Так как объем постоянный, то по закону Шарля:\n</p> <div class=\"math-display\">\n<img alt=\"p\nT-= const\n\" class=\"math-display\" src=\"index-6340132b2a76cb3be712fe9e4bf1cf9f.svg\"/></div>\n<p class=\"indent\">   Откуда можно сделать вывод, что:\n</p> <div class=\"math-display\">\n<img alt=\"n = const\n\" class=\"math-display\" src=\"index-8f24590213b017762687740dcadadc15.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d7b83a3c9dbada95b52a74d740ab8fc8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-d7b83a3c9dbada95b52a74d740ab8fc8.svg", "index-252c097fd53d14faacfc54800d8e7a9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-252c097fd53d14faacfc54800d8e7a9b.svg", "index-7b52d77899f82239eda8cb9dd7cb78af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-7b52d77899f82239eda8cb9dd7cb78af.svg", "index-e1eb3c283e87d023a49084b914eee5e9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-e1eb3c283e87d023a49084b914eee5e9.svg", "index-8195e9f46fa5f53f1d36852a5e28661a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-8195e9f46fa5f53f1d36852a5e28661a.svg", "177.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/177.png", "index-73e13b3ed1ac80deb306498477a6569c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386283/index-73e13b3ed1ac80deb306498477a6569c.svg", "index-315f893187998394733095068935344c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-315f893187998394733095068935344c.svg", "index-b8e0c9b96d4a2d6074728e6263e05fc2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-b8e0c9b96d4a2d6074728e6263e05fc2.svg", "index-40d8fcc6239faeb4f5386b34b89d5d56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-40d8fcc6239faeb4f5386b34b89d5d56.svg", "index-ad13dd277d3da2f977097b71e5d4faf2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-ad13dd277d3da2f977097b71e5d4faf2.svg", "index-6340132b2a76cb3be712fe9e4bf1cf9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-6340132b2a76cb3be712fe9e4bf1cf9f.svg", "index-8f24590213b017762687740dcadadc15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386284/index-8f24590213b017762687740dcadadc15.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["ФИПИ", "ЕГЭ 2026 основная волна, Центр"], "created_at": "2026-04-10T23:38:40Z", "updated_at": "2026-06-14T14:24:43Z"}, {"id": 112689, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния 2 моль идеального газа. В каком процессе\nработа газа положительна и максимальна по величине, а в каком процессе работа внешних сил положительна и минимальна по\nвеличине?<br/>Установите соответствие между характеристиками процессов и номерами процессов на диаграмме.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"112689.png\" width=\"394\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ХАРА КТЕ РИСТ ИКИ П РОЦ ЕССО В  НО МЕР А П РОЦ ЕССО В\n\nА) работа газа положительна     1) 1\nи максимальна                   2) 2\nБ) работа внешних сил            3) 3\nполож ительна и миним альна        4) 4\n\" class=\"math-display\" src=\"index-923a9aeef9081d2ab088edb728da666b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-80906afcd81f8cab9673ae35b00df9ad.svg\"/></div>", "solution_html": "<p class=\"noindent\">Работа газа положительна, когда объём увеличивается (процессы 3 и 4), работа внешних сил положительна, когда объём\nуменьшается (процессы 1 и 2). При этом работа ЧИСЛЕННО равна площади под графиком в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg\"/>.\n<br/>\n</p><p class=\"indent\">   А) Оценим площади под графиками процессами 3 и 4, под процессом 4 площадь максимальна, значит и работа.<br/>Ответ под номером 4.<br/>\n</p><p class=\"indent\">   Б) Оценим площади под графиками процессами 1 и 2, под процессом 1 площадь минимальная, значит и работа.<br/>Ответ под номером 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"112689.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232019/112689.png", "index-923a9aeef9081d2ab088edb728da666b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232019/index-923a9aeef9081d2ab088edb728da666b.svg", "index-80906afcd81f8cab9673ae35b00df9ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232019/index-80906afcd81f8cab9673ae35b00df9ad.svg", "index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232020/index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": ["ЕГКР 2025"], "created_at": "2025-03-27T23:49:44Z", "updated_at": "2026-05-09T13:42:56Z"}, {"id": 119089, "name": " Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Детский тёмно-зелёный воздушный шарик надули в тени под деревом, а затем вынесли на солнечный пляж. Как начали при этом\nизменяться объём воздуха в шарике и средняя кинетическая энергия молекул в шарике? Оболочка шарика тонкая, упругая и\nмягкая.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилась\n</p><p class=\"indent\">   2) уменьшилась\n</p><p class=\"indent\">   3) не изменилась\n</p><p class=\"indent\">   Запишите в ответ выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------|-------------------|\n|Объём воздуха в шарике|Средняя кинетическая|\n|                     |  энергия молекул   |\n|---------------------|-------------------|\n-------------------------------------------\n\" class=\"math-display\" src=\"index-f73f37324183187b613c98f4e6867a70.svg\"/></div>", "solution_html": "<p class=\"noindent\">Когда шарик выносят на пляж, его температура увеличится. Среднюю кинетическую энергию можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nEk = 2kT,\n\" class=\"math-display\" src=\"index-e2b937778c3b540f79d51ffa667d9c6a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-65cbe9598128139d722f085f74346c1a.svg\"/> — постоянная Больцмана, <img alt=\"T  \" class=\"math\" src=\"index-d2ca10e54c47e06c5e9e7810a412edfc.svg\"/> — абсолютная температура газа.<br/>Так как температура увеличивается, то <img alt=\"Ek  \" class=\"math\" src=\"index-a13528fa2f1917de22c988c761ab79ff.svg\"/> также увеличивается.<br/>Из-за нагревания шарик надувается и объём увеличивается.<br/>Давление газа уравновешивает давление атмосферы и давление сил упругости шарика:\n</p> <div class=\"math-display\">\n<img alt=\"pгаза = pатм+ pупр.\n\" class=\"math-display\" src=\"index-6c860e254b2893777b9d85a90dae80e9.svg\"/></div>\n<p class=\"indent\">   В процессе атмосферное давление не изменяется, а из-за того, что шарик начинает надуваться, то давление сил упругости\nувеличивается (чем больше деформация шарика, тем больше силы упругости, тем больше давление сил упругости), то есть давление\nгаза также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f73f37324183187b613c98f4e6867a70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244447/index-f73f37324183187b613c98f4e6867a70.svg", "index-e2b937778c3b540f79d51ffa667d9c6a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244448/index-e2b937778c3b540f79d51ffa667d9c6a.svg", "index-65cbe9598128139d722f085f74346c1a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244448/index-65cbe9598128139d722f085f74346c1a.svg", "index-d2ca10e54c47e06c5e9e7810a412edfc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244448/index-d2ca10e54c47e06c5e9e7810a412edfc.svg", "index-a13528fa2f1917de22c988c761ab79ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244448/index-a13528fa2f1917de22c988c761ab79ff.svg", "index-6c860e254b2893777b9d85a90dae80e9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244448/index-6c860e254b2893777b9d85a90dae80e9.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["Демидова 2022"], "created_at": "2025-04-20T08:15:49Z", "updated_at": "2026-05-20T16:15:45Z"}, {"id": 64409, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Детский тёмно-зелёный воздушный шарик надули на солнечном пляже, а затем внесли в тень под деревом. Как начали при этом\nизменяться объём воздуха в шарике и средняя кинетическая энергия молекул в шарике? Оболочка шарика тонкая, упругая и\nмягкая.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------|-------------------|\n|Объём воздуха в шарике|Средняя кинетическая|\n|                     |  энергия молекул   |\n|---------------------|-------------------|\n-------------------------------------------\n\" class=\"math-display\" src=\"index-f73f37324183187b613c98f4e6867a70.svg\"/></div>", "solution_html": "<p class=\"noindent\">При внесении шарика в тень температура воздуха в шарике уменьшается. Среднюю кинетическую энергию можно найти по\nформуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nEk = 2kT,\n\" class=\"math-display\" src=\"index-dcfcd1bf866642621cde14f9ba0226dc.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"k  \" class=\"math\" src=\"index-cbf81b5feb1df21788bc6d4a68fdddb1.svg\"/> — постоянная Больцмана, <img alt=\"T  \" class=\"math\" src=\"index-c85122492bd257b1a03957aabf6e30e6.svg\"/> — абсолютная температура газа.\n</p><p class=\"indent\">   Так как температура уменьшается, то <img alt=\"Ek  \" class=\"math\" src=\"index-887f67a3e580f6d38399a2bd8b97ea55.svg\"/> также уменьшается.<br/>Из-за охлаждения шарик сдувается и объём уменьшается.<br/>Давление газа уравновешивает давление атмосферы и давление сил упругости шарика:\n</p> <div class=\"math-display\">\n<img alt=\"pгаза = pатм+ pупр.\n\" class=\"math-display\" src=\"index-5ec815764c92bf8e3bbd4c1bc9cbd2ff.svg\"/></div>\n<p class=\"indent\">   В процессе атмосферное давление не изменяется, а из-за того, что шарик начинает сдуваться, то давление сил упругости\nуменьшается (чем меньше деформация шарика, тем меньше силы упругости, тем меньше давление сил упругости), то есть давление\nгаза также уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f73f37324183187b613c98f4e6867a70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116351/index-f73f37324183187b613c98f4e6867a70.svg", "index-dcfcd1bf866642621cde14f9ba0226dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116352/index-dcfcd1bf866642621cde14f9ba0226dc.svg", "index-cbf81b5feb1df21788bc6d4a68fdddb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116352/index-cbf81b5feb1df21788bc6d4a68fdddb1.svg", "index-c85122492bd257b1a03957aabf6e30e6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116352/index-c85122492bd257b1a03957aabf6e30e6.svg", "index-887f67a3e580f6d38399a2bd8b97ea55.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116352/index-887f67a3e580f6d38399a2bd8b97ea55.svg", "index-5ec815764c92bf8e3bbd4c1bc9cbd2ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116352/index-5ec815764c92bf8e3bbd4c1bc9cbd2ff.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["ФИПИ"], "created_at": "2023-06-23T06:48:56Z", "updated_at": "2026-04-18T16:40:34Z"}, {"id": 114709, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния 2 моль идеального газа. В каком процессе\nработа газа положительна и максимальна по величине, а в каком процессе работа внешних сил положительна и минимальна по\nвеличине?<br/>Установите соответствие между характеристиками процессов и номерами процессов на диаграмме.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"112689.png\" width=\"394\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ХАРА КТЕ РИСТ ИКИ П РОЦ ЕССО В  НО МЕР А П РОЦ ЕССО В\n\nА) работа газа положительна     1) 1\nи миним альна                    2) 2\nБ) работа внешних сил            3) 3\nполож ительна и максимальна       4) 4\n\" class=\"math-display\" src=\"index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-80906afcd81f8cab9673ae35b00df9ad.svg\"/></div>", "solution_html": "<p class=\"noindent\">Работа газа положительна, когда объём увеличивается (процессы 3 и 4), работа внешних сил положительна, когда объём\nуменьшается (процессы 1 и 2). При этом работа ЧИСЛЕННО равна площади под графиком в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg\"/>.\n<br/>А) Работа газа положительна и минимальна у процесса 3.<br/>Б) Работа внешних сил положительна и максимальна у процесса 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"112689.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235546/112689.png", "index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235546/index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg", "index-80906afcd81f8cab9673ae35b00df9ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235546/index-80906afcd81f8cab9673ae35b00df9ad.svg", "index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235548/index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg"}, "tags": ["ЕГКР 954 Физика 27.03.2025"], "sources": ["ЕГКР 954 Физика 27.03.2025"], "created_at": "2025-04-02T18:01:04Z", "updated_at": "2026-05-09T13:43:58Z"}, {"id": 100556, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Детский тёмно-зелёный воздушный шарик надули на солнечном пляже, а затем внесли в тень под деревом. Как начали при\nэтом изменяться давление воздуха в шарике и температура молекул в шарике? Оболочка шарика тонкая, упругая и\nмягкая.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------|-------------------|\n|Д-авление-воздуха в-шарике|Температура-в ш-арике\n---------------------------------------------|\n\" class=\"math-display\" src=\"index-44e4762941d8b9504b4d2d63a119a2a5.svg\"/></div>", "solution_html": "<p class=\"noindent\">При внесении шарика в тень температура воздуха в шарике уменьшается – 2.<br/>\n</p><p class=\"indent\">   Из-за охлаждения шарик сдувается и объём уменьшается.<br/>Давление газа уравновешивает давление атмосферы и давление сил упругости шарика:\n</p> <div class=\"math-display\">\n<img alt=\"pгаза = pатм+ pупр.\n\" class=\"math-display\" src=\"index-313069e862dbcfc3065101121da6ab9f.svg\"/></div>\n<p class=\"indent\">   В процессе атмосферное давление не изменяется, а из-за того, что шарик начинает сдуваться, то давление сил упругости\nуменьшается (чем меньше деформация шарика, тем меньше силы упругости, тем меньше давление сил упругости), то есть давление\nгаза также уменьшается – 2.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-44e4762941d8b9504b4d2d63a119a2a5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206757/index-44e4762941d8b9504b4d2d63a119a2a5.svg", "index-313069e862dbcfc3065101121da6ab9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206758/index-313069e862dbcfc3065101121da6ab9f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["Основная волна 2022"], "created_at": "2024-11-19T18:08:44Z", "updated_at": "2026-04-18T16:30:13Z"}, {"id": 115714, "name": " Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке изображена диаграмма четырёх последовательных изменений состояния 2 моль идеального газа. В каком процессе\nработа газа положительна и минимальна по величине, а в каком - работа внешних сил положительна и максимальна по\nвеличине?<br/>Установите соответствие между характеристиками процессов и номерами процессов на диаграмме.<br/>К каждой позиции первого столбца подберите соответствующую позицию из второго столбца и запишите в таблицу выбранные\nцифры под соответствующими буквами. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"115714.png\" width=\"394\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ХАРА КТЕ РИСТ ИКИ П РОЦ ЕССО В  НО МЕР А П РОЦ ЕССО В\n\nА) работа газа положительна     1) 1\nи миним альна                    2) 2\nБ) работа внешних сил            3) 3\nполож ительна и максимальна       4) 4\n\" class=\"math-display\" src=\"index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n|  |  |\n-------\n\" class=\"math-display\" src=\"index-80906afcd81f8cab9673ae35b00df9ad.svg\"/></div>", "solution_html": "<p class=\"noindent\">Работа газа положительна, когда объём увеличивается (процессы 1 и 2), работа внешних сил положительна, когда объём\nуменьшается (процессы 3 и 4). При этом работа ЧИСЛЕННО равна площади под графиком в координатах <img alt=\"p− V  \" class=\"math\" src=\"index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg\"/>.\n<br/>А) Работа газа положительна и минимальна у процесса 2.<br/>Б) Работа внешних сил положительна и максимальна у процесса 3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"115714.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237580/115714.png", "index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237580/index-301bd428c5cfc3fe3d7c8e0d33dc4f6d.svg", "index-80906afcd81f8cab9673ae35b00df9ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237580/index-80906afcd81f8cab9673ae35b00df9ad.svg", "index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237581/index-2da3b9b1fcfa7d06a9554af0b0c8ede4.svg"}, "tags": ["ЕГКР Вариант 956 от 25.03.2025"], "sources": ["ЕГКР от 25.03.2025, вариант 956"], "created_at": "2025-04-06T18:17:43Z", "updated_at": "2026-05-09T13:45:18Z"}, {"id": 195046, "name": "Копия #100556 - Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Воздушный шарик тёмно-зелёного цвета надули на солнечном пляже, а затем перенесли в тень под дерево. Определите, как\nизменяются давление и температура воздуха в шарике после перемещения в тень. Оболочка шарика тонкая, мягкая и\nупругая.<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------|-------------------|\n|Д-авление-воздуха в-шарике|Температура-в ш-арике\n---------------------------------------------|\n\" class=\"math-display\" src=\"index-44e4762941d8b9504b4d2d63a119a2a5.svg\"/></div>", "solution_html": "<p class=\"noindent\">При внесении шарика в тень температура воздуха в шарике уменьшается – 2.<br/>\n</p><p class=\"indent\">   Из-за охлаждения шарик сдувается и объём уменьшается.<br/>Давление газа уравновешивает давление атмосферы и давление сил упругости шарика:\n</p> <div class=\"math-display\">\n<img alt=\"pгаза = pатм+ pупр.\n\" class=\"math-display\" src=\"index-313069e862dbcfc3065101121da6ab9f.svg\"/></div>\n<p class=\"indent\">   В процессе атмосферное давление не изменяется, а из-за того, что шарик начинает сдуваться, то давление сил упругости\nуменьшается (чем меньше деформация шарика, тем меньше силы упругости, тем меньше давление сил упругости), то есть давление\nгаза также уменьшается – 2.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-44e4762941d8b9504b4d2d63a119a2a5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432246/index-44e4762941d8b9504b4d2d63a119a2a5.svg", "index-313069e862dbcfc3065101121da6ab9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432247/index-313069e862dbcfc3065101121da6ab9f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-15T01:21:07Z", "updated_at": "2026-08-15T01:25:44Z"}, {"id": 103106, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">При исследовании изопроцессов использовался закрытый сосуд переменного объёма, заполненный неоном и соединённый с\nманометром. Объём сосуда медленно увеличивают, сохраняя давление неона в нём постоянным. Как изменяются при этом\nвнутренняя энергия и плотность неона в сосуде?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------|---------------|\n|Внутренняя энергия|П лотность неона|\n|  неона в сосуде  |    в сосуде   |\n|-----------------|---------------|\n-----------------------------------\n\" class=\"math-display\" src=\"index-f2c1c8a2999fb12592f178e1477a44da.svg\"/></div>", "solution_html": "<p class=\"noindent\">Т.к. это изобарный процесс, то из уравнения Менделеева-Клайперона следует, что при увеличении объёма, температура газа также\nувеличивается.<br/>Внутренняя энергия раза\n</p> <div class=\"math-display\">\n<img alt=\"U = 3RT.\n    2\n\" class=\"math-display\" src=\"index-f175ae4874de3b6a2e1e6993bc3ec47e.svg\"/></div>\n<p class=\"indent\">   Поэтому при увеличении температуры внутренняя энергия газа также увеличивается.<br/>Плотность газа вычисляется по формуле\n</p> <div class=\"math-display\">\n<img alt=\"   m-\nρ=  V .\n\" class=\"math-display\" src=\"index-bcb689aec0c32fe543d03857594d5429.svg\"/></div>\n<p class=\"indent\">   Т.к. количество вещества не изменяется, то при увеличении объёма плотность газа уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f2c1c8a2999fb12592f178e1477a44da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212564/index-f2c1c8a2999fb12592f178e1477a44da.svg", "index-f175ae4874de3b6a2e1e6993bc3ec47e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212565/index-f175ae4874de3b6a2e1e6993bc3ec47e.svg", "index-bcb689aec0c32fe543d03857594d5429.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212565/index-bcb689aec0c32fe543d03857594d5429.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T11:03:17Z", "updated_at": "2026-05-20T17:01:39Z"}, {"id": 103438, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">При исследовании изопроцессов использовался закрытый сосуд переменного объёма, заполненный разреженным криптоном и\nсоединённый с манометром. Объём сосуда медленно уменьшают, сохраняя температуру криптона в нём неизменной. Как изменяются\nпри этом давление криптона в сосуде и его внутренняя энергия?<br/>Для каждой величины определите соответствующий характер её изменения:<br/>1) увеличилась<br/>2) уменьшилась<br/>3) не изменилась<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|------------------|\n|Давление криптона|В нутренняя энергия|\n|    в сосуде     | криптона в сосуде |\n|----------------|------------------|\n-------------------------------------\n\" class=\"math-display\" src=\"index-20c13bd3aa500500b401c60196fb408b.svg\"/></div>", "solution_html": "<p class=\"noindent\">Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-e883d248326a194051db5cec315ad015.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-3e9467bb3220942265bf8129ad5f90ac.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-2521df090300ab26969b790ac45879fe.svg\"/> – объём газа, <img alt=\"ν  \" class=\"math\" src=\"index-41a582a552171d000b85b0de2bdc9b36.svg\"/> – количество газа, <img alt=\"T  \" class=\"math\" src=\"index-28439d58270e905f90ced565373e1e41.svg\"/> – температура газа.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"pV\n-T-= νR = const\n\" class=\"math-display\" src=\"index-c78537abe89431bc85c154204930d650.svg\"/></div>\n<p class=\"indent\">   так как по условию температура неизменна, а объём уменьшается, то давление газа увеличивается.<br/>Внутренняя энергия газа\n</p> <div class=\"math-display\">\n<img alt=\"U = 3RT.\n    2\n\" class=\"math-display\" src=\"index-420fa13035bba08dd8b0d0f3b6d4b2fc.svg\"/></div>\n<p class=\"indent\">   Так как по условию температура не изменяется, то внутренняя энергия также постоянна.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-20c13bd3aa500500b401c60196fb408b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213311/index-20c13bd3aa500500b401c60196fb408b.svg", "index-e883d248326a194051db5cec315ad015.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-e883d248326a194051db5cec315ad015.svg", "index-3e9467bb3220942265bf8129ad5f90ac.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-3e9467bb3220942265bf8129ad5f90ac.svg", "index-2521df090300ab26969b790ac45879fe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-2521df090300ab26969b790ac45879fe.svg", "index-41a582a552171d000b85b0de2bdc9b36.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-41a582a552171d000b85b0de2bdc9b36.svg", "index-28439d58270e905f90ced565373e1e41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-28439d58270e905f90ced565373e1e41.svg", "index-c78537abe89431bc85c154204930d650.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-c78537abe89431bc85c154204930d650.svg", "index-420fa13035bba08dd8b0d0f3b6d4b2fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213312/index-420fa13035bba08dd8b0d0f3b6d4b2fc.svg"}, "tags": [], "sources": ["ФИПИ "], "created_at": "2025-01-10T04:29:34Z", "updated_at": "2026-04-18T16:41:02Z"}, {"id": 94084, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В цилиндре под поршнем первоначально находилось твёрдое вещество. Цилиндр сначала нагревали в печи,\nа затем охлаждали. На рисунке показан график изменения температуры t вещества с течением времени\n<img alt=\"τ.  \" class=\"math\" src=\"index-49bc000e08d1dc473c6fa8fc530e4f32.svg\"/>\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"236\" src=\"94084_1.png\" width=\"236\"/> </p> </figure>\n<p class=\"indent\">   Какие формулы соответствуют каким физическим величинам? <br/>К каждой позиции первого столбца подберите соответствующую позицию второго и запишите в таблицу выбранные цифры\nпод соответствующими буквами.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"УЧ АС ТКИ  ГРАФ ИК А  П РОЦ ЕС СЫ\nА) KL                 1) нагревание пара\n                      2) охлаж дение ж идкости\nБ) EF                 3) ки пен ие\n\n                      4) кр исталлизация\n\" class=\"math-display\" src=\"index-26781a2db622bd3df087d8793f64ac79.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--|--|\n|А-|Б-|\n-------\n\" class=\"math-display\" src=\"index-2a39fabf9fc749480df7c259d269aec5.svg\"/></div>", "solution_html": "<p class=\"noindent\">А) KL - кристаллизация.<br/>Б) EF - нагрев пара.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-49bc000e08d1dc473c6fa8fc530e4f32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189854/index-49bc000e08d1dc473c6fa8fc530e4f32.svg", "94084_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189854/94084_1.png", "index-26781a2db622bd3df087d8793f64ac79.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189854/index-26781a2db622bd3df087d8793f64ac79.svg", "index-2a39fabf9fc749480df7c259d269aec5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189854/index-2a39fabf9fc749480df7c259d269aec5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2019"], "created_at": "2024-08-04T12:55:33Z", "updated_at": "2026-05-20T17:09:56Z"}, {"id": 119086, "name": "МКТ. Термодинамика. Первая часть.", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В герметичном сосуде под подвижным поршнем находится идеальный газ. Как изменяется концентрация и количество вещества\nгаза в сосуде, если уменьшить объём газа? Считать, что уменьшение объема происходит за счет изменения только\nтемпературы.\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------------------|----------------------|\n|Концентрация молекул газа|Количество-вещ-ества газа\n------------------------------------------------|\n\" class=\"math-display\" src=\"index-6d06a7aa603356149a4f9e5cc32eacd2.svg\"/></div>", "solution_html": "<p class=\"noindent\">Концентрация молекул:\n</p> <div class=\"math-display\">\n<img alt=\"    N\nn=  V ,\n\" class=\"math-display\" src=\"index-0431827c4bd9be6026ab9a9133307826.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-63874ef35c0075b4b63d3c6f9babe4e7.svg\"/> — количество молекул газа в объеме <img alt=\"V  \" class=\"math\" src=\"index-70904c4346d678f5fce64e90109c151a.svg\"/>.<br/>Так как <img alt=\"N = const  \" class=\"math\" src=\"index-8496cb19a31a89431ebf22576acbbfbe.svg\"/>, а объём <img alt=\"V  \" class=\"math\" src=\"index-5432ced2c847d5a375437b7dc82012a0.svg\"/> уменьшается, то концентрация увеличивается.<br/>Количество вещества:\n</p> <div class=\"math-display\">\n<img alt=\"ν = m,\n    μ\n\" class=\"math-display\" src=\"index-6fe09b1c66308d404472d54541b54f22.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-0a2c61256f751b3358fb126027e46a99.svg\"/> – масса газа, <img alt=\"μ  \" class=\"math\" src=\"index-050ee9e3d3fc9818aecceea6eb05c158.svg\"/> – молярная масса газа.<br/>Так как масса газа не изменилась, то и количество вещества не изменилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6d06a7aa603356149a4f9e5cc32eacd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244441/index-6d06a7aa603356149a4f9e5cc32eacd2.svg", "index-0431827c4bd9be6026ab9a9133307826.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-0431827c4bd9be6026ab9a9133307826.svg", "index-63874ef35c0075b4b63d3c6f9babe4e7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-63874ef35c0075b4b63d3c6f9babe4e7.svg", "index-70904c4346d678f5fce64e90109c151a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-70904c4346d678f5fce64e90109c151a.svg", "index-8496cb19a31a89431ebf22576acbbfbe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-8496cb19a31a89431ebf22576acbbfbe.svg", "index-5432ced2c847d5a375437b7dc82012a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-5432ced2c847d5a375437b7dc82012a0.svg", "index-6fe09b1c66308d404472d54541b54f22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244442/index-6fe09b1c66308d404472d54541b54f22.svg", "index-0a2c61256f751b3358fb126027e46a99.svg": "http
