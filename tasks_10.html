ивается, то его температура также увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b33c40f6eaa705b22d62665b241781dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433171/index-b33c40f6eaa705b22d62665b241781dd.svg", "index-bc9d172f2756288446970daac017aed6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433171/index-bc9d172f2756288446970daac017aed6.svg", "14078.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433171/14078.png", "index-6cd46c4668a2baf554de0568aaff309e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433171/index-6cd46c4668a2baf554de0568aaff309e.svg", "index-c7baab8369483cc92426aada183718f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-c7baab8369483cc92426aada183718f4.svg", "index-9c806742c35a122535f7c860cee01dba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-9c806742c35a122535f7c860cee01dba.svg", "index-9df5d30dd051bdf049162877fbcd5f47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-9df5d30dd051bdf049162877fbcd5f47.svg", "index-bc7e26d276afb76b81427dd9923a2da4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-bc7e26d276afb76b81427dd9923a2da4.svg", "index-fd1548bb445408476441261de7c60f1f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-fd1548bb445408476441261de7c60f1f.svg", "index-f61ced51ed5c3c5a7117d7e0e1ada1b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-f61ced51ed5c3c5a7117d7e0e1ada1b2.svg", "index-a876f3ccda2047ecf42aeb430dd9d806.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-a876f3ccda2047ecf42aeb430dd9d806.svg", "index-4b3e70cd14dc095fa8906a584d59509f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-4b3e70cd14dc095fa8906a584d59509f.svg", "index-035af90b3e832296544fc5db43b3e67e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433172/index-035af90b3e832296544fc5db43b3e67e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T18:10:46Z", "updated_at": "2026-08-16T18:15:38Z"}, {"id": 14079, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-cbc05c6217a5bbbdc8086fef846d0223.svg\"/> — внутренняя энергия газа; <img alt=\"    p  \" class=\"math\" src=\"index-396faeab2bda542f44adca675c4da3bc.svg\"/> —\nего давление). Как изменяются в ходе этого процесса объём и теплоёмкость газа? </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14078.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-Объём-газа-|-Теплоёмкость газа\n|-----------|----------------|\n------------------------------\n\" class=\"math-display\" src=\"index-cf46b3720f7d184de3ae9c04887300e8.svg\"/></div>", "solution_html": "<p class=\"noindent\">Объем — 3 <br/>1) Из графика видно, что зависимость внутренней энергии газа от его давления прямая: <img alt=\"U ∼ p  \" class=\"math\" src=\"index-c7baab8369483cc92426aada183718f4.svg\"/>. <br/>Внутренняя энергия одноатомного газа:\n</p> <div class=\"math-display\">\n<img alt=\"U = 3νRT,\n    2\n\" class=\"math-display\" src=\"index-a03d05b78bf3ee519debd98898817186.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-3b367b7927724b9f91ec6bdcd6d83e83.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-4b262bb8e6271b48871f5d3c62d54153.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-e5bca1c65dc6fbde3ba0c77b321f8cc0.svg\"/> —температура.<br/>Так как <img alt=\"U ∼ p  \" class=\"math\" src=\"index-8c6dcaf865f5b79856223524bc985f6c.svg\"/> и <img alt=\"U ∼ T  \" class=\"math\" src=\"index-01a8a1a23228d58c4550c4a864afbd45.svg\"/>, то давление прямо пропорционально температуре: <img alt=\"T ∼ p  \" class=\"math\" src=\"index-1f98842e0fe022866a93fc6baa941941.svg\"/>. Это соответствует изохорному процессу\n(<img alt=\"V = const  \" class=\"math\" src=\"index-d6c72ee3ff3de61c5871a7fb0f823a1d.svg\"/>).<br/><br/>Теплоемкость — 3 <br/>2) Теплоёмкость газа равна:\n</p> <div class=\"math-display\">\n<img alt=\"c=  Q--,  (1)\n    ΔT\n\" class=\"math-display\" src=\"index-42679dd8875c3cc59906ed561bd96aa2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-47d223ef54b5f1a26a762dc235f7808d.svg\"/> — количество теплоты, <img alt=\"ΔT  \" class=\"math\" src=\"index-a388ccfa8f42de9fdeedad13566dfe71.svg\"/> — изменение температуры.<br/>Согласно первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU,\n\" class=\"math-display\" src=\"index-db1c4f23abd5ee88cbab36749e2d138b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-54f6f83e1ebe1fda60c7e6f5e868bba9.svg\"/> — работа газа.<br/>Так как объем газа не меняется, то работа <img alt=\"A  \" class=\"math\" src=\"index-151e9b19ad6658be61b5b85d41bfbee1.svg\"/> равна нулю. Тогда количество теплоты:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"    3\nQ = 2νRΔT    (2)\n\" class=\"math-display\" src=\"index-678ffc63760a069486fb831d38220f3d.svg\"/></div>\n<p class=\"indent\">   Подставим (2) в (1):\n</p> <div class=\"math-display\">\n<img alt=\"   3 νRΔT   3\nc= 2-ΔT---= 2 νR\n\" class=\"math-display\" src=\"index-83a281dff488b7a2f47fc1281e75171e.svg\"/></div>\n<p class=\"indent\">   Таким образом, теплоёмкость газа остается постоянной.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cbc05c6217a5bbbdc8086fef846d0223.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28351/index-cbc05c6217a5bbbdc8086fef846d0223.svg", "index-396faeab2bda542f44adca675c4da3bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28351/index-396faeab2bda542f44adca675c4da3bc.svg", "14078.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28351/14078.png", "index-cf46b3720f7d184de3ae9c04887300e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28351/index-cf46b3720f7d184de3ae9c04887300e8.svg", "index-c7baab8369483cc92426aada183718f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-c7baab8369483cc92426aada183718f4.svg", "index-a03d05b78bf3ee519debd98898817186.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-a03d05b78bf3ee519debd98898817186.svg", "index-3b367b7927724b9f91ec6bdcd6d83e83.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-3b367b7927724b9f91ec6bdcd6d83e83.svg", "index-4b262bb8e6271b48871f5d3c62d54153.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-4b262bb8e6271b48871f5d3c62d54153.svg", "index-e5bca1c65dc6fbde3ba0c77b321f8cc0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-e5bca1c65dc6fbde3ba0c77b321f8cc0.svg", "index-8c6dcaf865f5b79856223524bc985f6c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-8c6dcaf865f5b79856223524bc985f6c.svg", "index-01a8a1a23228d58c4550c4a864afbd45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-01a8a1a23228d58c4550c4a864afbd45.svg", "index-1f98842e0fe022866a93fc6baa941941.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-1f98842e0fe022866a93fc6baa941941.svg", "index-d6c72ee3ff3de61c5871a7fb0f823a1d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-d6c72ee3ff3de61c5871a7fb0f823a1d.svg", "index-42679dd8875c3cc59906ed561bd96aa2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-42679dd8875c3cc59906ed561bd96aa2.svg", "index-47d223ef54b5f1a26a762dc235f7808d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-47d223ef54b5f1a26a762dc235f7808d.svg", "index-a388ccfa8f42de9fdeedad13566dfe71.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-a388ccfa8f42de9fdeedad13566dfe71.svg", "index-db1c4f23abd5ee88cbab36749e2d138b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-db1c4f23abd5ee88cbab36749e2d138b.svg", "index-54f6f83e1ebe1fda60c7e6f5e868bba9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-54f6f83e1ebe1fda60c7e6f5e868bba9.svg", "index-151e9b19ad6658be61b5b85d41bfbee1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-151e9b19ad6658be61b5b85d41bfbee1.svg", "index-678ffc63760a069486fb831d38220f3d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-678ffc63760a069486fb831d38220f3d.svg", "index-83a281dff488b7a2f47fc1281e75171e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28352/index-83a281dff488b7a2f47fc1281e75171e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["Демоверсия 2014"], "created_at": "2021-12-10T09:23:39Z", "updated_at": "2026-07-03T09:10:45Z"}, {"id": 168204, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-6e2444f1288077ea1c3313a11df67df6.svg\"/> – внутренняя энергия\nгаза; <img alt=\"V  \" class=\"math\" src=\"index-05b1bf4d3fcf42e723952cfdc8fa5172.svg\"/> – занимаемый им объем). Как изменяются в ходе этого процесса давление и абсолютная температура газа?\n<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"168204.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|Давление газа|А-бсолютная-тем-пература-|\n|            |                      |\n|------------|---------газа----------|\n-------------------------------------\n\" class=\"math-display\" src=\"index-5775ec70c3d87812a14ee516354e799b.svg\"/></div>", "solution_html": "<p class=\"noindent\">Внутренняя энергия одного моля одноатомного идеального газа определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2RT.\n\" class=\"math-display\" src=\"index-d2b91801dc3edf44f6df88d5eac2ff2a.svg\"/></div>\n<p class=\"indent\">   При переходе из состояния 1 в состояние 2 внутренняя энергия увеличивается, следовательно, увеличивается абсолютная\nтемпература газа. <br/>Запишем уравнение Менделеева-Клапейрона для одного моля одноатомного идеального газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = RT.\n\" class=\"math-display\" src=\"index-d5fa5a2ad34ccd374c34b9a37b1cb274.svg\"/></div>\n<p class=\"indent\">   Ранее мы показали, что температура при переходе из состояния 1 в состояние 2 увеличивается. Кроме того, из\nграфика видно, что увеличивается объем газа. Тогда для сохранения равенства необходимо, чтобы давление не\nизменялось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6e2444f1288077ea1c3313a11df67df6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360745/index-6e2444f1288077ea1c3313a11df67df6.svg", "index-05b1bf4d3fcf42e723952cfdc8fa5172.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360745/index-05b1bf4d3fcf42e723952cfdc8fa5172.svg", "168204.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360745/168204.png", "index-5775ec70c3d87812a14ee516354e799b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360745/index-5775ec70c3d87812a14ee516354e799b.svg", "index-d2b91801dc3edf44f6df88d5eac2ff2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360746/index-d2b91801dc3edf44f6df88d5eac2ff2a.svg", "index-d5fa5a2ad34ccd374c34b9a37b1cb274.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360746/index-d5fa5a2ad34ccd374c34b9a37b1cb274.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ЕГЭ 2024, досрочная волна"], "created_at": "2026-02-09T17:39:58Z", "updated_at": "2026-07-03T09:11:00Z"}, {"id": 39107, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находилась при комнатной температуре смесь двух идеальных газов, по 1 моль каждого.\nПоловину содержимого сосуда выпустили, а затем добавили в сосуд 1 моль первого газа. Температура в сосуде\nподдерживалась неизменной. Как изменились в результате парциальное давление первого газа и суммарное давление смеси\nгазов?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилось<br/>2) уменьшилось<br/>3) не изменилось<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|---------------|\n|Парциальное давление|Д авление см еси |\n|    первого газа     |     газов      |\n|-------------------|---------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-94e817d1c8445f3f34341f887955de5b.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-99b1bb3f1103af29670d00aff837769a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-9184266533a9e9c7417bd7f172083fbb.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-e40d9d1e9de84b7630b0f0f3670754a9.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-67e84213b69e240a582cfb1cc61c8db6.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-5af90d17cc2fc70af548942438d89dd2.svg\"/> — абсолютная температура.<br/>Когда выпустили половину смеси, то каждого газа уменьшилось на 0,5 моль, добавили 1 моль первого газа, то есть количество\nпервого газа увеличилось и давление увеличилось.<br/>Количество вещества в сосуде в итоге осталось прежним, следовательно, суммарное давление смеси газов не изменилось\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-94e817d1c8445f3f34341f887955de5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75383/index-94e817d1c8445f3f34341f887955de5b.svg", "index-99b1bb3f1103af29670d00aff837769a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-99b1bb3f1103af29670d00aff837769a.svg", "index-9184266533a9e9c7417bd7f172083fbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-9184266533a9e9c7417bd7f172083fbb.svg", "index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg", "index-e40d9d1e9de84b7630b0f0f3670754a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-e40d9d1e9de84b7630b0f0f3670754a9.svg", "index-67e84213b69e240a582cfb1cc61c8db6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-67e84213b69e240a582cfb1cc61c8db6.svg", "index-5af90d17cc2fc70af548942438d89dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75384/index-5af90d17cc2fc70af548942438d89dd2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона", "2023"], "sources": ["Демоверсия 2023"], "created_at": "2022-10-15T10:33:16Z", "updated_at": "2026-05-20T16:06:42Z"}, {"id": 186506, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находилась при комнатной температуре смесь двух идеальных газов, по 1 моль каждого.\nПоловину содержимого сосуда выпустили, а затем добавили в сосуд 1 моль первого газа. Температура в сосуде\nподдерживалась неизменной. Как изменились в результате парциальное давление первого газа и общая концентрация молекул\nсмеси?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилось<br/>2) уменьшилось<br/>3) не изменилось<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|-------------------|\n|Парциальное давление|О бщая концентрация|\n|    первого газа    |   молекул смеси   |\n|-------------------|-------------------|\n----------------------------------------|\n\" class=\"math-display\" src=\"index-17507b1290809a13ee7d149a049cf31d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"    νiRT\npi =--V--,\n\" class=\"math-display\" src=\"index-29abb13cc63d18e73dea16ae4fd57375.svg\"/></div>\n<p class=\"indent\">   Общая концентрация молекул <img alt=\"n  \" class=\"math\" src=\"index-a8bd25ab060be1cc13ff08d83840243f.svg\"/> пропорциональна суммарному количеству вещества:\n</p> <div class=\"math-display\">\n<img alt=\"n = NA(ν1+-ν2)\n        V\n\" class=\"math-display\" src=\"index-30e6fe179dca02dc332e73be291a5e75.svg\"/></div>\n<p class=\"indent\">   После того как выпустили половину смеси, каждого газа осталось по 0,5 моль. При добавлении 1 моль первого газа его\nколичество стало 1,5 моль, следовательно, его парциальное давление <img alt=\"p = ν1RT\n 1   V  \" class=\"math\" src=\"index-fda29f762a9b42cdd94f88bcf2717941.svg\"/> увеличилось.<br/>Суммарное количество вещества в сосуде в итоге осталось прежним (<img alt=\"0,5+ 0,5 =1  \" class=\"math\" src=\"index-5db78d10b5c83802a149c1fd33e290f5.svg\"/> моль было после выпуска; <img alt=\"1,5 + 0,5 =2  \" class=\"math\" src=\"index-a14a58754538ca31158fa347781d90eb.svg\"/> моль\nстало, что равно начальному значению), следовательно, общая концентрация молекул смеси газов не изменилась.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-17507b1290809a13ee7d149a049cf31d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410738/index-17507b1290809a13ee7d149a049cf31d.svg", "index-29abb13cc63d18e73dea16ae4fd57375.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-29abb13cc63d18e73dea16ae4fd57375.svg", "index-a8bd25ab060be1cc13ff08d83840243f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-a8bd25ab060be1cc13ff08d83840243f.svg", "index-30e6fe179dca02dc332e73be291a5e75.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-30e6fe179dca02dc332e73be291a5e75.svg", "index-fda29f762a9b42cdd94f88bcf2717941.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-fda29f762a9b42cdd94f88bcf2717941.svg", "index-5db78d10b5c83802a149c1fd33e290f5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-5db78d10b5c83802a149c1fd33e290f5.svg", "index-a14a58754538ca31158fa347781d90eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410739/index-a14a58754538ca31158fa347781d90eb.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2026-06-22T09:37:38Z", "updated_at": "2026-07-17T11:54:26Z"}, {"id": 14075, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-109fbebf4fb853343249ac9f27664ca1.svg\"/>— внутренняя энергия газа;\n<img alt=\"V  \" class=\"math\" src=\"index-63b2633dd0960d66fb3dc2fffc401c88.svg\"/> — занимаемый им объём). Как изменяются в ходе этого процесса давление и абсолютная температура газа?\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14075.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|----------------|--------------|\n|-Температура-газа-|-Давление газа|\n--------------------------------|\n\" class=\"math-display\" src=\"index-41d970ae22b5c3087a96bc0f7681acfc.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура — 1 <br/>1) Внутренняя энергия одноатомного газа:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT,\n\" class=\"math-display\" src=\"index-bdc8eabd01d8dd21ca70905d74773a63.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-7e472e0d8fd83a582088857464aaed2a.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-b7ce8d1bb0c6bddd39265e7c8a0b84cb.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-5a47e7adb6f741da2ca00467a25ab519.svg\"/> — абсолютная температура.<br/>Внутренняя энергия газа прямо пропорциональна его температуре <img alt=\"T  \" class=\"math\" src=\"index-254dda2c0f5e3ee97f4b012cb4ee3684.svg\"/>.<br/>Из графика видно, что <img alt=\"U  \" class=\"math\" src=\"index-7294be5dff000a6ebbf6319673d7856e.svg\"/> увеличивается, следовательно температура <img alt=\"T  \" class=\"math\" src=\"index-04410321e8a7f91bd7bbea76bc789777.svg\"/> также увеличивается.<br/><br/>Давление — 3 <br/>2) Из графика видно, что внутренняя энергия газа зависит от его объема линейно: <img alt=\"U ∼ V  \" class=\"math\" src=\"index-11d5db7ec538b0ba8684df6a7a53f630.svg\"/>. <br/>Можно сделать вывод, что так как <img alt=\"U ∼ V  \" class=\"math\" src=\"index-579901da36df9cf131094fd1f5e70837.svg\"/> и <img alt=\"U ∼ T  \" class=\"math\" src=\"index-7ba7eccf4712a1afb0b5934e5dcfec23.svg\"/>, то объем газа прямо пропорционален его температуре: <img alt=\"V ∼ T  \" class=\"math\" src=\"index-397cb8f3d8c8f86aa944bcb72b73c1eb.svg\"/>.\n<br/>Прямая зависимость объема газа от его температуры соответствует изобарному процессу (<img alt=\"p = const  \" class=\"math\" src=\"index-8d70c4aaa34247f0a97f8c42e1edb007.svg\"/>).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-109fbebf4fb853343249ac9f27664ca1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28343/index-109fbebf4fb853343249ac9f27664ca1.svg", "index-63b2633dd0960d66fb3dc2fffc401c88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28343/index-63b2633dd0960d66fb3dc2fffc401c88.svg", "14075.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28343/14075.png", "index-41d970ae22b5c3087a96bc0f7681acfc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28343/index-41d970ae22b5c3087a96bc0f7681acfc.svg", "index-bdc8eabd01d8dd21ca70905d74773a63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-bdc8eabd01d8dd21ca70905d74773a63.svg", "index-7e472e0d8fd83a582088857464aaed2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-7e472e0d8fd83a582088857464aaed2a.svg", "index-b7ce8d1bb0c6bddd39265e7c8a0b84cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-b7ce8d1bb0c6bddd39265e7c8a0b84cb.svg", "index-5a47e7adb6f741da2ca00467a25ab519.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-5a47e7adb6f741da2ca00467a25ab519.svg", "index-254dda2c0f5e3ee97f4b012cb4ee3684.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-254dda2c0f5e3ee97f4b012cb4ee3684.svg", "index-7294be5dff000a6ebbf6319673d7856e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-7294be5dff000a6ebbf6319673d7856e.svg", "index-04410321e8a7f91bd7bbea76bc789777.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-04410321e8a7f91bd7bbea76bc789777.svg", "index-11d5db7ec538b0ba8684df6a7a53f630.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-11d5db7ec538b0ba8684df6a7a53f630.svg", "index-579901da36df9cf131094fd1f5e70837.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-579901da36df9cf131094fd1f5e70837.svg", "index-7ba7eccf4712a1afb0b5934e5dcfec23.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-7ba7eccf4712a1afb0b5934e5dcfec23.svg", "index-397cb8f3d8c8f86aa944bcb72b73c1eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-397cb8f3d8c8f86aa944bcb72b73c1eb.svg", "index-8d70c4aaa34247f0a97f8c42e1edb007.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28344/index-8d70c4aaa34247f0a97f8c42e1edb007.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа"], "sources": ["Основная волна 2013"], "created_at": "2021-12-10T09:20:54Z", "updated_at": "2026-04-21T18:35:24Z"}, {"id": 64433, "name": "Задача на МКТ и термодинамику. Установление соответствий", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находилась при комнатной температуре смесь двух идеальных газов, по 2 моль каждого.\nПоловину содержимого сосуда выпустили, а затем добавили в сосуде 1 моль второго газа. Температура в сосуде\nподдерживалась неизменной. Как изменились в результате парциальное давление второго газа и суммарное давление смеси\nгазов?\n</p><p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличилось\n</p><p class=\"indent\">   2) уменьшилось\n</p><p class=\"indent\">   3) не изменилось\n</p><p class=\"indent\">   Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|---------------|\n|Парциальное давление|Д авление см еси |\n|    второго газа     |     газов      |\n|-------------------|---------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-c099ce2b9141966cb14b8b786cd2c1e0.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-99b1bb3f1103af29670d00aff837769a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-9184266533a9e9c7417bd7f172083fbb.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-e40d9d1e9de84b7630b0f0f3670754a9.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-67e84213b69e240a582cfb1cc61c8db6.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-5af90d17cc2fc70af548942438d89dd2.svg\"/> — абсолютная температура.\n</p><p class=\"indent\">   Когда выпустили половину смеси, то каждого газа уменьшилось на 1 моль, добавили 1 моль второго газа, то есть количество\nвторого газа не изменилось и давление не изменилось.\n</p><p class=\"indent\">   Количество вещества в сосуде в итоге уменьшилось, следовательно, суммарное давление смеси газов уменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c099ce2b9141966cb14b8b786cd2c1e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116399/index-c099ce2b9141966cb14b8b786cd2c1e0.svg", "index-99b1bb3f1103af29670d00aff837769a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-99b1bb3f1103af29670d00aff837769a.svg", "index-9184266533a9e9c7417bd7f172083fbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-9184266533a9e9c7417bd7f172083fbb.svg", "index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg", "index-e40d9d1e9de84b7630b0f0f3670754a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-e40d9d1e9de84b7630b0f0f3670754a9.svg", "index-67e84213b69e240a582cfb1cc61c8db6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-67e84213b69e240a582cfb1cc61c8db6.svg", "index-5af90d17cc2fc70af548942438d89dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116400/index-5af90d17cc2fc70af548942438d89dd2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["основная волна 2024"], "created_at": "2023-06-23T08:25:43Z", "updated_at": "2026-04-18T16:29:06Z"}, {"id": 84721, "name": "Задача на МКТ и термодинамику. Изменение величин", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">В сосуде неизменного объёма находилась при комнатной температуре смесь двух идеальных газов, по 2 моль каждого.\nПоловину содержимого сосуда выпустили, а затем добавили в сосуд 1 моль первого газа. Температура в сосуде\nподдерживалась неизменной. Как изменились в результате парциальное давление первого газа и суммарное давление смеси\nгазов?<br/>Для каждой величины определите соответствующий характер изменения:<br/>1) увеличилось<br/>2) уменьшилось<br/>3) не изменилось<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------------|---------------|\n|Парциальное давление|Д авление см еси |\n|    первого газа     |     газов      |\n|-------------------|---------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-94e817d1c8445f3f34341f887955de5b.svg\"/></div>", "solution_html": "<p class=\"noindent\">Уравнение состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-99b1bb3f1103af29670d00aff837769a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-9184266533a9e9c7417bd7f172083fbb.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg\"/> — объем, занимаемый газом, <img alt=\"ν  \" class=\"math\" src=\"index-e40d9d1e9de84b7630b0f0f3670754a9.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-67e84213b69e240a582cfb1cc61c8db6.svg\"/> — универсальная газовая\nпостоянная, <img alt=\"T  \" class=\"math\" src=\"index-5af90d17cc2fc70af548942438d89dd2.svg\"/> — абсолютная температура.<br/>Когда выпустили половину смеси, то количество вещества каждого газа уменьшилось на 1 моль. Когда добавили 1 моль первого\nгаза, то количество первого газа стало прежним и парциальное давление первого газа вернулось к начальному значению, то есть не\nизменилось в итоге.<br/>Количество вещества в сосуде в итоге уменьшилось, следовательно, суммарное давление смеси газов уменьшилось.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-94e817d1c8445f3f34341f887955de5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167587/index-94e817d1c8445f3f34341f887955de5b.svg", "index-99b1bb3f1103af29670d00aff837769a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-99b1bb3f1103af29670d00aff837769a.svg", "index-9184266533a9e9c7417bd7f172083fbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-9184266533a9e9c7417bd7f172083fbb.svg", "index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-11dfd6a7b67dc7fd7e57781e9b1d12db.svg", "index-e40d9d1e9de84b7630b0f0f3670754a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-e40d9d1e9de84b7630b0f0f3670754a9.svg", "index-67e84213b69e240a582cfb1cc61c8db6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-67e84213b69e240a582cfb1cc61c8db6.svg", "index-5af90d17cc2fc70af548942438d89dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167588/index-5af90d17cc2fc70af548942438d89dd2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Уравнение Менделеева-Клапейрона", "Закон Дальтона. Смесь газов"], "sources": ["Демоверсия 2023", "ЕГЭ 2026 основная волна, Юг"], "created_at": "2024-04-10T16:13:07Z", "updated_at": "2026-07-12T21:46:22Z"}, {"id": 14080, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">На рисунке показан процесс изменения состояния одного моля одноатомного идеального газа (<img alt=\"U  \" class=\"math\" src=\"index-8bcdbf4e5b074976c82f1ce9b30620b5.svg\"/> — внутренняя энергия газа; <img alt=\"    V  \" class=\"math\" src=\"index-52292c5da179e40d752303c14c5fdab0.svg\"/>\n— занимаемый им объём). Как изменяются в ходе этого процесса абсолютная температура и теплоёмкость газа?\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"14075.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения: <br/>1) увеличится <br/>2) уменьшится <br/>3) не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|Температура газа-Теплоемкость-газа-|\n|---------------|-----------------|\n-----------------------------------\n\" class=\"math-display\" src=\"index-8f21ff72769d624fe07f85fe289eb5db.svg\"/></div>", "solution_html": "<p class=\"noindent\">Температура газа — 1 <br/>1) Температура газа прямо пропорциональна его внутренней энергии:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nU = 2νRT,\n\" class=\"math-display\" src=\"index-661cc9ec357765ae43d077031bea6c6d.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-47b46d855fb614e6f784106e9cc1a176.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-18e2c18a4d2d6b387fe7db0fe847e711.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-80c7cc181ad784f047b72a9e3f9d6022.svg\"/> —температура.<br/>Так как внутренняя энергия газа увеличивается, то его температура также увеличивается.<br/><br/>Теплоемкость газа — 3 <br/>2) Теплоёмкость газа определяется выражением\n</p> <div class=\"math-display\">\n<img alt=\"c= -Q-   (1)\n   ΔT\n\" class=\"math-display\" src=\"index-194710a034584cdf07dba9ab67363a14.svg\"/></div>\n<p class=\"indent\">   Из графика видно, что зависимость внутренней энергии газа от его объема прямая: <img alt=\"U ∼ V  \" class=\"math\" src=\"index-761801a552f82746c5a81814f20df84a.svg\"/>. <br/>Внутренняя энергия одноатомного газа прямо пропорциональна его температуре:\n</p> <div class=\"math-display\">\n<img alt=\"   3\nU = 2 νRT\n\" class=\"math-display\" src=\"index-57a82dfe8d419661db8500ee05f1121e.svg\"/></div>\n<p class=\"indent\">   Так как <img alt=\"U ∼ V  \" class=\"math\" src=\"index-9819db838c1e5cb5f1aa94d2d853219e.svg\"/> и <img alt=\"U ∼ T  \" class=\"math\" src=\"index-d27f4589d8f65cc69930563554ef9045.svg\"/>, то объем газа прямо пропорционален его температуре: <img alt=\"T ∼V  \" class=\"math\" src=\"index-40b72ae5b6245ec9682e936842033e7a.svg\"/>. Это соответствует изобарному\nпроцессу (<img alt=\"p= const  \" class=\"math\" src=\"index-7f756ca8ebbfab5ef6f1ffceee822a75.svg\"/>).<br/>Первое начало термодинамики для изобарного процесса:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU,\n\" class=\"math-display\" src=\"index-640e91a0d9826c63e1bd895e55ac720e.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-efee14feafa0c35c6f8af7db7ac7deec.svg\"/> — работа газа.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"Q = pΔV  + 3νRΔT\n          2\n\" class=\"math-display\" src=\"index-c8a3dd88861d5eaf63447e794690258a.svg\"/></div>\n<p class=\"indent\">   Исходя из уравнения Менделеева – Клапейрона, преобразуем формулу:\n</p> <div class=\"math-display\">\n<img alt=\"Q = νRΔT + 3νR ΔT\n           2\n\" class=\"math-display\" src=\"index-2206eb5acf88bb893041e95e5217e189.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    5\nQ = 2νRΔT    (2)\n\" class=\"math-display\" src=\"index-34c8d3706f68f298d00ee55821ccc4bb.svg\"/></div>\n<p class=\"indent\">   Подставим (2) в (1) :\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"   5\n   2-νRΔT-  5\nc=   ΔT   = 2 νR\n\" class=\"math-display\" src=\"index-41b0133273005f79e352ccf3355ac0d2.svg\"/></div>\n<p class=\"indent\">   Таким образом, в данном процессе теплоёмкость оставалась постоянной.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8bcdbf4e5b074976c82f1ce9b30620b5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28353/index-8bcdbf4e5b074976c82f1ce9b30620b5.svg", "index-52292c5da179e40d752303c14c5fdab0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28353/index-52292c5da179e40d752303c14c5fdab0.svg", "14075.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28353/14075.png", "index-8f21ff72769d624fe07f85fe289eb5db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28353/index-8f21ff72769d624fe07f85fe289eb5db.svg", "index-661cc9ec357765ae43d077031bea6c6d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/28354/index-661cc9ec357765ae43d077031bea6c6d.svg", "index-47b46d855fb614e6f784106e9cc1a176. не изменится <br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------|----------------|\n|    Объём газа   | П лотность газа  |\n|в ходе процесса 1- 2|в ходе процесса 2- 3\n|-----------------|----------------|\n------------------------------------\n\" class=\"math-display\" src=\"index-4e832b270078a72e127785c87ca7b497.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) Из графика 1-2\n</p> <div class=\"math-display\">\n<img alt=\"p= αT,\n\" class=\"math-display\" src=\"index-2c4b924add494d8a8dcbce4cf9986d34.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-89af2741459786a9afa9489078600245.svg\"/> – некоторый коэффициент.<br/>По уравнению Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-a20e6285b66b0ced3003d969cf79c773.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-0df65449d25b8eb008a87da6f066795f.svg\"/> – количество вещества.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"αT V = νRT ⇒ V = νR-= const\n                 α\n\" class=\"math-display\" src=\"index-49a56d5fa733eeb2245559823d2b230c.svg\"/></div>\n<p class=\"indent\">   То есть объём в процессе 1-2 постоянен.<br/>2) Плотность газа:\n</p> <div class=\"math-display\">\n<img alt=\"ρ= m-,\n    V\n\" class=\"math-display\" src=\"index-d5a6a0e45b80dd340946ff69b86bf814.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-2d84e7e1fd06dfff69963a6b88b061f6.svg\"/> — масса газа.<br/>Из уравнения Менделеева-Клапейрона\n</p> <div class=\"math-display\">\n<img alt=\"    νRT-\nV =  p\n\" class=\"math-display\" src=\"index-8ed46b349c9b74e49cb2fdd2a6d33ad6.svg\"/></div>\n<p class=\"indent\">   объём уменьшается, значит, плотность увеличивается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f7ff61b46 ff69b86bf814.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213144/index-d5a6a0e45b80dd340946ff69b86bf814.svg", "index-2d84e7e1fd06dfff69963a6b88b061f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213144/index-2d84e7e1fd06dfff69963a6b88b061f6.svg", "index-8ed46b349c9b74e49cb2fdd2a6d33ad6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213144/index-8ed46b349c9b74e49cb2fdd2a6d33ad6.svg"}, "tags": [], "sources": ["ФИПИ"], "created_at": "2025-01-08T07:48:02Z", "updated_at": "2026-07-03T09:08:53Z"}, {"id": 176020, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Один моль одноатомного идеального газа участвует в процессе 1-2-3, график которого изображён на рисунке в\nкоординатах p-T, где <img alt=\"p  \" class=\"math\" src=\"index-152e50b944b6c0434128f58a33989174.svg\"/> – давление газа, <img alt=\"T  \" class=\"math\" src=\"index-bc218ab825ad27a8bff543f340f51ea6.svg\"/> – температура газа. Как изменяются концентрация молекул газа <img alt=\"n  \" class=\"math\" src=\"index-2a87f050f93ff8df09f801e0213f8136.svg\"/> в ходе\nпроцесса 1-2 и объём <img alt=\"V  \" class=\"math\" src=\"index-cb742afe465de6f23ec696b5829edf9a.svg\"/> в ходе процесса 2-3? Масса газа остаётся постоянной.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"105\" src=\"176020.png\" width=\"105\"/></p></div>\n<p class=\"indent\">   Для каждой величины определите соответствующий характер изменения:\n</p><p class=\"indent\">   1) увеличивается\n</p><p class=\"indent\">   2) уменьшается\n</p><p class=\"indent\">   3) не изменяется\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------------|-----------------|\n|К онцентрация м олекул газа   О бъём газа    |\n|                          |                 |\n|----в-ходе процесса 1-2---|в ходе-процесса-2-3\n----------------------------------------------\n\" class=\"math-display\" src=\"index-152a8f1aad38a507ac572d4fd9773fc6.svg\"/></div>", "solution_html": "<p class=\"noindent\">В процессе 1–2 давление постоянно. По закону Гей-Люссака:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const.\n\" class=\"math-display\" src=\"index-67681a2e91d5e7a712a1c6c27fbe91fd.svg\"/></div>\n<p class=\"indent\">   Так как температура увеличивается, то объём увеличивается. Концентрация молекул:\n</p> <div class=\"math-display\">\n<img alt=\"n=  N,\n    V\n\" class=\"math-display\" src=\"index-acf7c144953df155def05103f7ec2c29.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-7534608033d9d4e1e5e12c79f4f24756.svg\"/> – число молекул (масса газа постоянна). При увеличении объёма концентрация <span class=\"labx-0900\">уменьшается</span>.\n</p><p class=\"indent\">   В процессе 2–3 температура постоянна (изотерма). По закону Бойля–Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const.\n\" class=\"math-display\" src=\"index-eae5e267c518d89ccda77e3021f534dc.svg\"/></div>\n<p class=\"indent\">   Давление увеличивается, следовательно, объём <span class=\"labx-0900\">уменьшается</span>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-152e50b944b6c0434128f58a33989174.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382224/index-152e50b944b6c0434128f58a33989174.svg", "index-bc218ab825ad27a8bff543f340f51ea6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382224/index-bc218ab825ad27a8bff543f340f51ea6.svg", "index-2a87f050f93ff8df09f801e0213f8136.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382224/index-2a87f050f93ff8df09f801e0213f8136.svg", "index-cb742afe465de6f23ec696b5829edf9a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382224/index-cb742afe465de6f23ec696b5829edf9a.svg", "176020.pn " src=\"index-7593b2d47291b921b8b69f31d9dab2ab.svg\"/></div>\n<p class=\"indent\">   Так как давление увеличивается, то объём уменьшается.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a2f850d393294c0427ef7312392c614a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/index-a2f850d393294c0427ef7312392c614a.svg", "index-5f4d8c40cce4390c647e656444a0a97a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/index-5f4d8c40cce4390c647e656444a0a97a.svg", "index-f88ebea333b337463ca6d103f72fd522.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/index-f88ebea333b337463ca6d103f72fd522.svg", "index-96dc6eba299ed8c10c315178978bad70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/index-96dc6eba299ed8c10c315178978bad70.svg", "6.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/6.png", "index-815f764ef2c5a1e0250c97db0a0faaea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244439/index-815f764ef2c5a1e0250c97db0a0faaea.svg", "index-2c4b924add494d8a8dcbce4cf9986d34.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-2c4b924add494d8a8dcbce4cf9986d34.svg", "index-89af2741459786a9afa9489078600245.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-89af2741459786a9afa9489078600245.svg", "index-f16462832b6e543bfca9299bdc465db9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-f16462832b6e543bfca9299bdc465db9.svg", "index-bbcd90ecc4ad037fc8d76cfd7f78f5dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-bbcd90ecc4ad037fc8d76cfd7f78f5dc.svg", "index-72ada1bf405bcaec0ec3811875a43e8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-72ada1bf405bcaec0ec3811875a43e8c.svg", "index-47f1cbfa8f62330417e616141b5a417b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/244440/index-47f1cbfa8f623 math-display\" src=\"index-565961dfe01f077e4683df0774a47026.svg\"/></div>", "solution_html": "<p class=\"noindent\">Формула плотности имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"   m\nρ= -V ,\n\" class=\"math-display\" src=\"index-9b47013cda4d006821400cff40eb68d8.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-51524549f74ef3244fefcebbcefd5551.svg\"/> – масса газа, <img alt=\"V  \" class=\"math\" src=\"index-96a9495aa6d4c6a76ac04998962e8efb.svg\"/> – объём газа.<br/>Так как в процессе 1-2 объём увеличивается, то плотность уменьшается.<br/>В процессе 2-3 объём постоянен, тогда по закону Шарля:\n</p> <div class=\"math-display\">\n<img alt=\"p-= const,\nT\n\" class=\"math-display\" src=\"index-90099b1aa89aaefaec49cb282557cea4.svg\"/></div>\n<p class=\"indent\">   так как давление увеличивается, то увеличивается и температура.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3ce5ac9ddfeb7217d6a73bd84eb61008.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51784/index-3ce5ac9ddfeb7217d6a73bd84eb61008.svg", "index-135d5025a1d74b7879e88fdf3f1cf8d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51784/index-135d5025a1d74b7879e88fdf3f1cf8d9.svg", "index-da104a7cfd6a43a4676b3af9af7d411e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51784/index-da104a7cfd6a43a4676b3af9af7d411e.svg", "39726.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51784/39726.png", "index-565961dfe01f077e4683df0774a47026.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51784/index-565961dfe01f077e4683df0774a47026.svg", "index-9b47013cda4d006821400cff40eb68d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51785/index-9b47013cda4d006821400cff40eb68d8.svg", "index-51524549f74ef3244fefcebbcefd5551.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51785/index-51524549f74ef3244fefcebbcefd5551.svg", "index-96a9495aa6d4c6a76ac04998962e8efb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51785/index-96a9495aa6d4c6a76ac04998962e8efb.svg", "index-90099b1aa89aaefaec49cb282557cea4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51785/index-90099b1aa89aaefaec49cb282557cea4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ"], "sources": ["ФИПИ", "ЕГЭ 2026 резервная волна, Дальний Восток"], "created_at": "2022-05-15T15:41:38Z", "updated_at": "2026-07-17T11:29:26Z"}, {"id": 121868, "name": "Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ переходит из состояния 1 в состояние 2 (см. диаграмму). Масса газа не меняется. Как изменяются при\nэтом давление газа и его внутренняя энергия? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"121868.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:<br/>1) увеличится<br/>2) уменьшится<br/>3) не изменится<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|Давление газа|В-нутренняя-энергия-газа|\n|------------|----------------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-d295a5420b5fc071981ba02cc7619a85.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) На графике представлен процесс изобарного сжатия (график проходит через начало координат, поэтому это изобара). Т.е.\nдавление не изменяется (3)<br/>2) Внутренняя энергия газа находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"U = 3νRT,\n    2\n\" class=\"math-display\" src=\"index-8f5436da0c53d754ff44f901483343ff.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-0d76d4c051fafd9a6190c095a9bd1b7d.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-45a0eeafe63e19fdb058069ffbfe9107.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-87c3bf43c31bfc91313d37a769e7cfd0.svg\"/> — абсолютная температура\nгаза.<br/>Так как температура газа в процессе 1-2 уменьшилась, то и внутренняя энергия также уменьшилась (2).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"121868.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250895/121868.png", "index-d295a5420b5fc071981ba02cc7619a85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250895/index-d295a5420b5fc071981ba02cc7619a85.svg", "index-8f5436da0c53d754ff44f901483343ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250896/index-8f5436da0c53d754ff44f901483343ff.svg", "index-0d76d4c051fafd9a6190c095a9bd1b7d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250896/index-0d76d4c051fafd9a6190c095a9bd1b7d.svg", "index-45a0eeafe63e19fdb058069ffbfe9107.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250896/index-45a0eeafe63e19fdb058069ffbfe9107.svg", "index-87c3bf43c31bfc91313d37a769e7cfd0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250896/index-87c3bf43c31bfc91313d37a769e7cfd0.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Внутренняя энергия газа"], "sources": ["ФИПИ"], "created_at": "2025-05-04T18:52:00Z", "updated_at": "2026-05-03T12:05:16Z"}, {"id": 195535, "name": "Копия #121868 - Задача на МКТ и термодинамику. Изменение величин и установление соответствия", "theme_path": "№10 МКТ и Термодинамика (изменение физических величин в процессах, установление  соответствия)", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ переходит из состояния 1 в состояние 2 (см. диаграмму), при этом его масса не изменяется. Как при\nтаком переходе изменяются давление газа и его внутренняя энергия? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"121868.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Для каждой величины определите соответствующий характер изменения:<br/>1) увеличивается<br/>2) уменьшается<br/>3) не изменяется<br/>Запишите в таблицу выбранные цифры для каждой физической величины. Цифры в ответе могут повторяться.\n</p> <div class=\"math-display\">\n<img alt=\"|Давление газа|В-нутренняя-энергия-газа|\n|------------|----------------------|\n------------------------------------|\n\" class=\"math-display\" src=\"index-d295a5420b5fc071981ba02cc7619a85.svg\"/></div>", "solution_html": "<p class=\"noindent\">1) На графике представлен процесс изобарного сжатия (график проходит через начало координат, поэтому это изобара). Т.е.\nдавление не изменяется (3)<br/>2) Внутренняя энергия газа находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"U = 3νRT,\n    2\n\" class=\"math-display\" src=\"index-8f5436da0c53d754ff44f901483343ff.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-0d76d4c051fafd9a6190c095a9bd1b7d.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-45a0eeafe63e19fdb058069ffbfe9107.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-87c3bf43c31bfc91313d37a769e7cfd0.svg\"/> — абсолютная температура\nгаза.<br/>Так как температура газа в процессе 1-2 уменьшилась, то и внутренняя энергия также уменьшилась (2).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"121868.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433445/121868.png", "index-d295a5420b5fc071981ba02cc7619a85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433445/index-d295a5420b5fc071981ba02cc7619a85.svg", "index-8f5436da0c53d754f display\">\n<img alt=\"|----------------|-----------------------|\n|О бъ ём газа в ходе|Концентрация молекул газа\n|   процесса 1-2  |   в ходе процесса 2- 3  |\n|----------------|-----------------------|\n------------------------------------------\n\" class=\"math-display\" src=\"index-e5b3547a254ee1c3d4166a083db6bc53.svg\"/></div>", "solution_html": "<p class=\"noindent\">Так как давление в ходе процесса 1-2 постоянно, то по закону Гей-Люссака:\n</p> <div class=\"math-display\">\n<img alt=\"V\nT-= const,\n\" class=\"math-display\" src=\"index-315f893187998394733095068935344c.svg\"/></div>\n<p class=\"indent\">   так как температура <img alt=\"T  \" class=\"math\" src=\"index-5574fc85c86e390f785d5768b5b0ac1f.svg\"/> уменьшается, то уменьшается и объём <img alt=\"V  \" class=\"math\" src=\"index-8d4ab00f3188b102de9e52b6c95dfe01.svg\"/>.<br/>Давление равно:\n</p> <div class=\"math-display\">\n<img alt=\"p = nkT,\n\" class=\"math-display\" src=\"index-fddaf4e868a59cbbf50de9d016415f7a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"n  \" class=\"math\" src=\"index-45b0b0de49c0cb9eb3193ee4081ed380.svg\"/> – концентрация молекул газа, <img alt=\"T  \" class=\"math\" src=\"index-619bfc26f9827a19082bfc40ee03aace.svg\"/> – температура газа.<br/>Из графика\n</p> <div class=\"math-display\">\n<img alt=\"p= αT,\n\" class=\"math-display\" src=\"index-d9397455c67dcb0b34deee450f05cebe.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-0dfb8f78dd6144d0a6b8a07ce5fe9a6d.svg\"/> – некоторый коэффициент.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"n= -p-= αT- = α-=const.\n   kT    kT    k\n\" class=\"math-display\" src=\"index-2d8197e7e619b5c25c9051c2b240aa27.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-639cce62841a8c384692b50bca60efc0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117605/index-639cce62841a8c384692b50bca60efc0.svg", "index-e506976670ec8628fb67f768401f803a.svg": "
