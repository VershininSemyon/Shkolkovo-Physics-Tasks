urces": ["Демоверсия 2020"], "created_at": "2022-01-02T10:36:47Z", "updated_at": "2026-07-01T09:35:15Z"}, {"id": 17793, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Одно колесо равномерно вращается, совершая 50 оборотов в секунду. Второе колесо, равномерно вращаясь, делает 500 оборотов за 30\nсекунд. Во сколько раз угловая скорость первого колеса больше, чем второго?\n</p>", "solution_html": "<p class=\"noindent\">Угловая скорость связана с частотой формулой:\n</p> <div class=\"math-display\">\n<img alt=\"           N\nω = 2πν = 2π-t . (1)\n\" class=\"math-display\" src=\"index-622bec7a89f1df763fae846cb2c0cb15.svg\"/></div>\n<p class=\"indent\">   Здесь <img alt=\"ω  \" class=\"math\" src=\"index-78301d38422836c84efc4db4c01ef536.svg\"/> – угловая скорость, <img alt=\"ν  \" class=\"math\" src=\"index-128b37a4b51d1f219fd700f7bb9823bf.svg\"/> – частота обращения, <img alt=\"N  \" class=\"math\" src=\"index-fff7eea165a5e7bb8e9b64721c148199.svg\"/> – количество оборотов за время <img alt=\"t  \" class=\"math\" src=\"index-838a55970be75e02306fb7d0b52255f4.svg\"/>.<br/>Тогда искомое соотношение\n</p> <div class=\"math-display\">\n<img alt=\"ω1 = 2πN1t2= N1t2 = 50⋅30 с-= 3\nω2   2πt1N2   t1N2   1 с ⋅500\n\" class=\"math-display\" src=\"index-ba518b901d15b49299de10e4e01b9587.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-622bec7a89f1df763fae846cb2c0cb15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35061/index-622bec7a89f1df763fae846cb2c0cb15.svg", "index-78301d38422836c84efc4db4c01ef536.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35061/index-78301d38422836c84efc4db4c01ef536.svg", "index-128b37a4b51d1f219fd700f7bb9823bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35061/index-128b37a4b51d1f219fd700f7bb9823bf.svg", "index-fff7eea165a5e7bb8e9b64721c148199.svg": "https://3.shkolkovo.online/api/latex-service/v1/Ge 3.shkolkovo.online/api/latex-service/v1/GetSession/116484/v-de-2020-1-pict1i.png", "index-678997f448ad7218db71793e57b296b7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116485/index-678997f448ad7218db71793e57b296b7.svg", "index-d589ea2cfa59aa90e827ee79fda17589.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116485/index-d589ea2cfa59aa90e827ee79fda17589.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["Демидова 2020"], "created_at": "2023-06-26T07:07:00Z", "updated_at": "2026-07-01T09:34:35Z"}, {"id": 92484, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Из двух городов навстречу друг другу с постоянной скоростью движутся два автомобиля. На графике показана зависимость\nрасстояния между автомобилями от времени. С какой скоростью движется второй автомобиль в системе отсчёта, связанной с\nпервым автомобилем? Ответ дайте в м/с.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict1i.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">За 60 минут расстояние между автомобилями изменилось с 144 км до 0 км, то есть автомобили встретились. Вычислим скорость\nсближения автомобилей:\n</p> <div class=\"math-display\">\n<img alt=\"   144000 м\nv =-3600 с-= 40 м/с\n\" class=\"math-display\" src=\"index-678997f448ad7218db71793e57b296b7.svg\"/></div>\n<p class=\"indent\">   Так как автомобили движутся навстречу друг другу, то скорость второго автомобиля в системе отсчёта, связанной с первым\nавтомобилем\n</p> <div class=\"math-display\">\n<img alt=\"v + v = 40 м/с\n 1   2\n\" class=\"math-display\" src=\"index-45155a90a9f524b6e50ed19783b9c269.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict1i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/185545/v-de-2020-1-pict1i.png", "index-678997f448ad7218db71793e57b296b7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196431/index-678997f448ad7218db71793e57b296b7.svg", "index-45155a90a9f524b6e50ed19783b9c269.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196431/index-45155a90a9f524b6e50ed19783b9c269.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["Демидова 2019"], "created_at": "2024-07-24T14:10:57Z", "updated_at": "2026-07-01T09:34:51Z"}, {"id": 16671, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Точечное тело равномерно движется по окружности радиусом <img alt=\"R = 2  \" class=\"math\" src=\"index-b1eb6f94efc5a3f2d5da03ea1a5da7f4.svg\"/> м. На рисунке изображён график зависимости угла поворота\n<img alt=\"φ  \" class=\"math\" src=\"index-b1484096383c0fe7f19b856d0def2e22.svg\"/> от времени <img alt=\"t  \" class=\"math\" src=\"index-2d2fec939af281fd08c2320708a6297b.svg\"/>. Найдите значение линейной скорости тела в интервале времени <img alt=\"3π &lt; t&lt; 5π  \" class=\"math\" src=\"index-b7109c46576f1d8fd2dfd809feea0a22.svg\"/>. Ответ дайте в м/с.\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"f-1-3-pict1i.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Линейная скорость тела, движущегося по окружности:\n</p> <div class=\"math-display\">\n<img alt=\"υ = ω⋅R    (1)\n\" class=\"math-display\" src=\"index-85be095ec944c2cffc3b1c795548e278.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ω  \" class=\"math\" src=\"index-cf7b88dbcb09bdb3f757c75c86bba9a9.svg\"/> – угловая скорость. <br/>Угловая скорость:\n</p> <div class=\"math-display\">\n<img alt=\"   Δ φ\nω =-Δt    (2)\n\" class=\"math-display\" src=\"index-65f9ea4d2d4b568c1eab3e3d723986c8.svg\"/></div>\n<p class=\"indent\">   Подставив (2) в (1), получим:\n</p> <div class=\"math-display\">\n<img alt=\"υ = Δφ-⋅R\n    Δt\n\" class=\"math-display\" src=\"index-544f2887448c46bde7fa7133d904c37b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    π-рад\nυ = 2----⋅2 = 0,5 м/с\n     2π с\n\" class=\"math-display\" src=\"index-6cec22ad727202c08f73582c91819e23.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b1eb6f94efc5a3f2d5da03ea1a5da7f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33035/index-b1eb6f94efc5a3f2d5da03ea1a5da7f4.svg", "index-b1484096383c0fe7f19b856d0def2e22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33035/index-b1484096383c0fe7f19b856d0def2e22.svg", "index-2d2fec939af281fd08c2320708a6297b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33035/index-2d2fec939af281fd08c2320708a6297b.svg", "index-b7109c46576f1d8fd2dfd809feea0a22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33035/index-b7109c46576f1d8fd2dfd809feea0a22.svg", "f-1-3-pict1i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33035/f-1-3-pict1i.png", "index-85be095ec944c2cffc3b1c795548e278.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33036/index-85be095ec944c2cffc3b1c795548e278.svg", "index-cf7b88dbcb09bdb3f757c75c86bba9a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33036/index-cf7b88dbcb09bdb3f757c75c86bba9a9.svg", "index-65f9ea4d2d4b568c1eab3e3d723986c8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33036/index-65f9ea4d2d4b568c1eab3e3d723986c8.svg", "index-544f2887448c46bde7fa7133d904c37b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33036/index-544f2887448c46bde7fa7133d904c37b.svg", "index-6cec22ad727202c08f73582c91819e23.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33036/index-6cec22ad727202c08f73582c91819e23.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["ФИПИ"], "created_at": "2022-01-02T10:13:39Z", "updated_at": "2026-08-28T18:35:39Z"}, {"id": 16675, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Два вращающихся вала соединены замкнутым нерастяжимым ремнём, который не проскальзывает относительно валов. Радиус\nпервого вала равен <img alt=\"R1  \" class=\"math\" src=\"index-3cc5d3db37bf774abf847f9444658706.svg\"/>, а второго вала — <img alt=\"R2  \" class=\"math\" src=\"index-2787acee60d8e8864d3aa4dbe002d457.svg\"/>. Отношение угловой скорости в точке А к угловой скорости первого вала <img alt=\"k = 0,25  \" class=\"math\" src=\"index-a2068c9c2ec210ca09cb1b7919bef7c7.svg\"/>.\nНайдите отношение радиуса первого вала к радиусу второго. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-3-pict4j.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Угловая скорость в точке А равна угловой скорости второго вала:\n</p> <div class=\"math-display\">\n<img alt=\"             ω2\nωA = ω2 ⇒ k = ω1\n\" class=\"math-display\" src=\"index-b2426d9b7b1080cfc5fe8ab149aa0552.svg\"/></div>\n<p class=\"indent\">   Так как валы связаны нерастяжимым ремнем, то линейные скорости на их ободах равны. Линейные скорости можно найти по\nформулам:\n</p> <div class=\"math-display\">\n<img alt=\"υ = ω1⋅R1\n\" class=\"math-display\" src=\"index-d70f3e258741a0d7ef05624be4529b45.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"υ = ω2⋅R2\n\" class=\"math-display\" src=\"index-6a9c35e6246e90840ebe0ee8fe51c4c2.svg\"/></div>\n<p class=\"indent\">   Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"ω1⋅R1 =υ = ω2⋅R2 ⇒ R1-= ω2 =0,25\n                   R2   ω1\n\" class=\"math-display\" src=\"index-ec9cc635eb6f5b2df84caa48d1d901dc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3cc5d3db37bf774abf847f9444658706.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33043/index-3cc5d3db37bf774abf847f9444658706.svg", "index-2787acee60d8e8864d3aa4dbe002d457.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33043/index-2787acee60d8e8864d3aa4dbe002d457.svg", "index-a2068c9c2ec210ca09cb1b7919bef7c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33043/index-a2068c9c2ec210ca09cb1b7919bef7c7.svg", "f-1-3-pict4j.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33043/f-1-3-pict4j.png", "index-b2426d9b7b1080cfc5fe8ab149aa0552.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33044/index-b2426d9b7b1080cfc5fe8ab149aa0552.svg", "index-d70f3e258741a0d7ef05624be4529b45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33044/index-d70f3e258741a0d7ef05624be4529b45.svg", "index-6a9c35e6246e90840ebe0ee8fe51c4c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33044/index-6a9c35e6246e90840ebe0ee8fe51c4c2.svg", "index-ec9cc635eb6f5b2df84caa48d1d901dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33044/index-ec9cc635eb6f5b2df84caa48d1d901dc.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["ФИПИ"], "created_at": "2022-01-02T10:18:54Z", "updated_at": "2025-11-20T23:35:27Z"}, {"id": 16681, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Велосипедист едет по круговому треку и замедляется. На рисунке указано направление скорости велосипедиста. Под каким номером\nверно указано направление центростремительного ускорения? Тангенциального ускорения? Куда направлено полное ускорение? (В\nответе укажите последовательность цифр, например: 153)\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"f-1-3-pict5j.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Нормальная составляющая ускорения (центростремительное ускорение) характеризует быстроту изменения скорости по\nнаправлению. Нормальное ускорение всегда перпендикулярно скорости и направлено к центру по радиусу траектории, по которой\nдвижется тело. <br/>Тангенциальная составляющая ускорения характеризует быстроту изменения величины (модуля) скорости. Тангенциальное\nускорение всегда коллинеарно скорости: <br/>1) Если тангенциальная составляющая ускорения сонаправлена со скоростью, то движение будет ускоренное <br/>2) Если тангенциальная составляющая ускорения противонаправлена скорости, то движение будет замедленным\n<br/>Полное ускорение – это сумма нормального и тангенциального:\n</p> <div class=\"math-display\">\n<img alt=\"⃗aполн = ⃗aнорм +⃗aтанг\n\" class=\"math-display\" src=\"index-0056aaa69da5ff7187018928acdea945.svg\"/></div>\n<p class=\"indent\">   Центростремительное ускорение направлено к центру (4). Так как велосепидист замедляется, то тангенциальное\nнаправлено против скорости (2). Полное ускорение является суммой 2 и 4, следовательно полное ускорение под номером\n3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-1-3-pict5j.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33055/f-1-3-pict5j.png", "index-0056aaa69da5ff7187018928acdea945.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33056/index-0056aaa69da5ff7187018928acdea945.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:22:46Z", "updated_at": "2025-10-02T12:04:17Z"}, {"id": 16692, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">При скорости ветра, равной <img alt=\"υв = 15  \" class=\"math\" src=\"index-2d6bb5a46897292b42e9db8eea9322be.svg\"/> м/с, капли дождя падают под углом <img alt=\"  ∘\n45 \" class=\"math\" src=\"index-bff3adfcd644aaab69f3c377064d4c6d.svg\"/> к вертикали. При какой скорости ветра капли будут\nпадать под углом <img alt=\"60∘ \" class=\"math\" src=\"index-9c2382d21d2035b797cd8b5c595759de.svg\"/> к вертикали? Ответ округлите до целых. Ответ дайте в м/с.\n</p>", "solution_html": "<p class=\"noindent\">Скорость <img alt=\"⃗υкв  \" class=\"math\" src=\"index-b6ba046348871d2e3673c46b7f68f4df.svg\"/> капель в системе отсчета, связанной с движущимся воздухом, есть скорость падения капель дождя в отсутствие\nветра. Эта скорость направлена вертикально вниз и определяется только типом дождя (размером капель), т.е. не меняется при\nизменении скорости ветра. <br/>Запишем для скорости капель закон сложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υк = ⃗υкв +⃗υв\n\" class=\"math-display\" src=\"index-cd66682b8075a3efc8d984f785677bdb.svg\"/></div>\n<p class=\"indent\">   Изобразим это векторное равенство (скорость ветра направлена горизонтально): </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict7i.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Получим связь угла падения (для угла в <img alt=\"45∘ \" class=\"math\" src=\"index-5617a959c1a815120cd66cc56e1c4654.svg\"/>) капель со скоростью ветра:\n</p> <div class=\"math-display\">\n<img alt=\"       υ\ntgα1 = υв1-\n       кв\n\" class=\"math-display\" src=\"index-54712f9803955047515b78d9d8a8ded4.svg\"/></div>\n<p class=\"indent\">   Аналогично для угла в <img alt=\"60∘ \" class=\"math\" src=\"index-d2e25b3bbbf874a740f8a97cf735fb72.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"tgα2 = υв2-\n       υкв\n\" class=\"math-display\" src=\"index-270fa37a6ede9fb447b2faabadd23612.svg\"/></div>\n<p class=\"indent\">   Избавимся от <img alt=\"υкв  \" class=\"math\" src=\"index-24e7bf62c94afb3c0b908f73b63cbc25.svg\"/> разделив первое уравнение на второе:\n</p> <div class=\"math-display\">\n<img alt=\"tgα1   υв1\ntgα2-= υв2-\n\" class=\"math-display\" src=\"index-206b5ead68e96056079d7310aec38f15.svg\"/></div>\n<p class=\"indent\">   Выразим <img alt=\"υв2  \" class=\"math\" src=\"index-b8a521922e9d16148973a12e277e3f2f.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"υв2 =υв1⋅ tgα2\n        tgα1\n\" class=\"math-display\" src=\"index-750e48a612753feab4f9d6ffe09cf748.svg\"/></div> <p class=\"indent\">   Подставим значения:\n</p> <div class=\"math-display\">\n<img alt=\"            tg60∘-        √-\nυв2 = 15 м/ с⋅tg45∘ = 15 м/с⋅ 3 ≈ 25,98 м/с\n\" class=\"math-display\" src=\"index-da021ca664a6e239725d87384e1113a1.svg\"/></div>\n<p class=\"indent\">   Округлим до целых:\n</p> <div class=\"math-display\">\n<img alt=\"25,98 м/с≈ 26 м/с\n\" class=\"math-display\" src=\"index-c63f3dbad00e3679e8fa03162e453003.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2d6bb5a46897292b42e9db8eea9322be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33077/index-2d6bb5a46897292b42e9db8eea9322be.svg", "index-bff3adfcd644aaab69f3c377064d4c6d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33077/index-bff3adfcd644aaab69f3c377064d4c6d.svg", "index-9c2382d21d2035b797cd8b5c595759de.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33077/index-9c2382d21d2035b797cd8b5c595759de.svg", "index-b6ba046348871d2e3673c46b7f68f4df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-b6ba046348871d2e3673c46b7f68f4df.svg", "index-cd66682b8075a3efc8d984f785677bdb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-cd66682b8075a3efc8d984f785677bdb.svg", "f-1-4-pict7i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/f-1-4-pict7i.png", "index-5617a959c1a815120cd66cc56e1c4654.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-5617a959c1a815120cd66cc56e1c4654.svg", "index-54712f9803955047515b78d9d8a8ded4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-54712f9803955047515b78d9d8a8ded4.svg", "index-d2e25b3bbbf874a740f8a97cf735fb72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-d2e25b3bbbf874a740f8a97cf735fb72.svg", "index-270fa37a6ede9fb447b2faabadd23612.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-270fa37a6ede9fb447b2faabadd23612.svg", "index-24e7bf62c94afb3c0b908f73b63cbc25.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-24e7bf62c94afb3c0b908f73b63cbc25.svg", "index-206b5ead68e96056079d7310aec38f15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-206b5ead68e96056079d7310aec38f15.svg", "index-b8a521922e9d16148973a12e277e3f2f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-b8a521922e9d16148973a12e277e3f2f.svg", "index-750e48a612753feab4f9d6ffe09cf748.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-750e48a612753feab4f9d6ffe09cf748.svg", "index-da021ca664a6e239725d87384e1113a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-da021ca664a6e239725d87384e1113a1.svg", "index-c63f3dbad00e3679e8fa03162e453003.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33078/index-c63f3dbad00e3679e8fa03162e453003.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:34:23Z", "updated_at": "2026-08-28T18:41:05Z"}, {"id": 16631, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Из двух концов комнаты навстречу друг другу с постоянной скоростью движутся АВ и Симба. На графике показана зависимость\nрасстояния между ними от времени. Скорость АВ равна 3,14 м/с. С какой скоростью движется Симба? Ответ дайте в м/с.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-1-pict1i.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">По графику определяем, что расстояние между АВ и Симба в начальный момент времени <img alt=\"S = 7  \" class=\"math\" src=\"index-6efd04e68f7e4214e2486047c2d40acb.svg\"/> м, а время, спустя которое они\nвстретятся, <img alt=\"t =2  \" class=\"math\" src=\"index-bb93fda4f95175eda73b97153fde78b0.svg\"/> c. Перейдем в подвижную систему отсчета относительно АВ. Тогда по закону сложения скоростей Симба будет\nдвигаться к нему со скоростью:\n</p> <div class=\"math-display\">\n<img alt=\"υ =υ1 +υ2,\n\" class=\"math-display\" src=\"index-b5da6be76d289234c7d433dbe31ecf07.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"υ1  \" class=\"math\" src=\"index-672e78b1bb5a400f8decd2b63f78fa37.svg\"/> и <img alt=\"υ2  \" class=\"math\" src=\"index-4f544f8c3c656db201aa9730f468509d.svg\"/> — скорости АВ и Симбы соответственно (относительно неподвижной системы отсчета). <br/>По закону равномерного прямолинейного движения:\n</p> <div class=\"math-display\">\n<img alt=\"S = υt\n\" class=\"math-display\" src=\"index-143a6d782fe0700922713f9c7895dd4e.svg\"/></div>\n<p class=\"indent\">   Подставим сюда предыдущую формулу, и получим:\n</p> <div class=\"math-display\">\n<img alt=\"S = (υ1 +υ2)t\n\" class=\"math-display\" src=\"index-ae9691ecb4ecb271c83470572d9a1b37.svg\"/></div>\n<p class=\"indent\">   Осталось выразить отсюда скорость Симбы:\n</p> <div class=\"math-display\">\n<img alt=\"υ2 = S− υ1 = 7-м − 3,14 м/c =0,36 м/c.\n     t       2 c\n\" class=\"math-display\" src=\"index-150b201b88026a1850038693268984ce.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"f-1-1-pict1i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32955/f-1-1-pict1i.png", "index-6efd04e68f7e4214e2486047c2d40acb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32956/index-6efd04e68f7e4214e2486047c2d40acb.svg", "index-bb93fda4f951 б 1</span>: <br/>Найдем длину дуги окружности:\n</p> <div class=\"math-display\">\n<img alt=\"l = 2πr,\n\" class=\"math-display\" src=\"index-3f7a6c74a9f77e255a03ad70774f4813.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"r  \" class=\"math\" src=\"index-c675bf1e9b7599283a4320e208f43c0d.svg\"/> — радиус окружности. <br/>Т.к. тело прошло эту длину 5,5 раз, оно прошло путь:\n</p> <div class=\"math-display\">\n<img alt=\"S = 5,5l = 11πr (1)\n\" class=\"math-display\" src=\"index-46c038f4c87381bf920d65a66fc1fb4f.svg\"/></div>\n<p class=\"indent\">   Выразим формульно линейную скорость <img alt=\"v  \" class=\"math\" src=\"index-48c22034be0bf2fb3cfebd72c9bf02b2.svg\"/> и угловую скорость тела:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{ v = 2πrν\n(           ⇒ v = wr (2)\n  w = 2πν\n\" class=\"math-display\" src=\"index-e8cddfb54252ae13c1e7ca7b76bd8f50.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\">Т.к. тело движется равномерно, <img alt=\"v = const  \" class=\"math\" src=\"index-7255c307a576aa6cb87bf816443f285a.svg\"/>. По закону равномерного движения:\n</p> <div class=\"math-display\">\n<img alt=\"S = vt\n\" class=\"math-display\" src=\"index-c5bd78dbe270f6df2035a3e3a2e4480f.svg\"/></div>\n<p class=\"indent\">   Подставим <img alt=\"(1  \" class=\"math\" src=\"index-b991a0b6955ba9276708ecc3d431e056.svg\"/>) и <img alt=\"(2)  \" class=\"math\" src=\"index-895d297df33c722490008a49d7885d1f.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"11πr =wrt\n\" class=\"math-display\" src=\"index-9870e175bde3e014fc00b8d5fab3df9a.svg\"/></div>\n<p class=\"indent\">   Осталось выразить <img alt=\"t  \" class=\"math\" src=\"index-fe3b5f88c6479f5dfeb8c6954192c866.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"    11π-  -11⋅3,14-\nt = w  = 6,5 рад/с ≈5,3 c\n\" class=\"math-display\" src=\"index-a14424bea16a165f88bd6bdc4e355221.svg\"/></div>\n<p class=\"indent\"> <span class=\"labx-0900\">Cпособ 2 </span>: <br/>Выразим формульно <img alt=\"w  \" class=\"math\" src=\"index-8001dc3734e4e6060e1dc3f19bed747e.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"w = Δφ-, (1)\n     t\n\" class=\"math-display\" src=\"index-a216435563d89ca254fd757cd0b40f0b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Δ φ  \" class=\"math\" src=\"index-3d2a4e4aa7a19be948e7842df72d463e.svg\"/> — угол поворота тела.\n</p> <div class=\"math-display\">\n<img alt=\"Δ φ=  S,\n      r\n\" class=\"math-display\" src=\"index-22808cb972600f567af021b995131aa0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"S = 5,5l = 5,5⋅2πr = 11πr  \" class=\"math\" src=\"index-319acbbd4b436c4e519d040d1dd1fbe9.svg\"/> — путь, пройденный телом.\n</p> <div class=\"math-display\">\n<img alt=\"Δφ = 11πr= 11π  (2)\n      r\n\" class=\"math-display\" src=\"index-3a8f3f21abf22ad93e48e6bdf025fc51.svg\"/></div>\n<p class=\"indent\">   Подставим (2) в (1):\n</p> <div class=\"math-display\">\n<img alt=\"    11π\nw =  t\n\" class=\"math-display\" src=\"index-c84551f79f477b7ef04a657a01ff7d67.svg\"/></div>\n<p class=\"indent\">   Осталось выразить <img alt=\"t  \" class=\"math\" src=\"index-5f010ad442d5cd97eb8b8f3ef6191b56.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"    11π    11⋅3,14\nt = w--= 6,5 рад/с ≈5,3 c\n\" class=\"math-display\" src=\"index-f294f8556c1fcac664f7ce63891ffbc9.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7f319f0a7d1389407e13c2f947f77a79.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33057/index-7f319f0a7d1389407e13c2f947f77a79.svg", "index-3903146f6df1e7642cd5c7a972ccb86d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33057/index-3903146f6df1e7642cd5c7a972ccb86d.svg", "index-72f67f4dc64778ba86b4dde34e7adda3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33057/index-72f67f4dc64778ba86b4dde34e7adda3.svg", "index-3f7a6c74a9f77e255a03ad70774f4813.svg": "https://3.shkolkovo.online/api/latex-s ался перпендикулярно относительно берега, относительно воды ему надо двигаться под углом. По закону\nсложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"v⃗абс = v⃗пер+ vо⃗тн\n\" class=\"math-display\" src=\"index-a0a08d1a9dcf1b8672147a571571434c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"⃗u =v⃗теч+ vк⃗ат\n\" class=\"math-display\" src=\"index-f7f4f803ecef65483b85f54a241cb1f1.svg\"/></div>\n<p class=\"indent\">   По теореме Пифагора найдем скорость катера относительно воды:\n</p> <div class=\"math-display\">\n<img alt=\"     ∘ -------- ∘ ------\nvкат =  u2+ v2теч =  82+ 62 = 10 км/ч\n\" class=\"math-display\" src=\"index-9ddc0f501ef8d6940671a3d61e8385b6.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"16685.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33064/16685.png", "index-a0a08d1a9dcf1b8672147a571571434c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33064/index-a0a08d1a9dcf1b8672147a571571434c.svg", "index-f7f4f803ecef65483b85f54a241cb1f1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33064/index-f7f4f803ecef65483b85f54a241cb1f1.svg", "index-9ddc0f501ef8d6940671a3d61e8385b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33064/index-9ddc0f501ef8d6940671a3d61e8385b6.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["ФИПИ"], "created_at": "2022-01-02T10:29:04Z", "updated_at": "2026-06-23T16:10:06Z"}, {"id": 16688, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Пароход плывет по прямой реке. Его скорость относительно реки равна <img alt=\"v1 =5  \" class=\"math\" src=\"index-5760f5baaa3b49d3e0b39f80ce357ef5.svg\"/> км/ч и направлена перпендикулярно береговой\nлинии. Река течет со скоростью <img alt=\"v2 = 4  \" class=\"math\" src=\"index-0cad1ed53a45d20e3e581599a3b12b58.svg\"/> км/ч. Чему равен модуль скорости <img alt=\"v  \" class=\"math\" src=\"index-ae695733769c606429ad03579ed60b4b.svg\"/> парохода относительно Земли? Ответ округлите до\nдесятых. Ответ дайте в км/ч.\n</p>", "solution_html": "<figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict3i.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Рассмотрим рисунок: векторы cкорости <img alt=\"v1  \" class=\"math\" src=\"index-775377b3464cef3baf7aa7495d191cfa.svg\"/> и <img alt=\"v2  \" class=\"math\" src=\"index-6c928bff6f71a0123fd2be32a97391ff.svg\"/> составляют друг с другом угол <img alt=\"90∘ \" class=\"math\" src=\"index-27526f8f6f2697e0b583cf9bb8407818.svg\"/>. Значит <img alt=\"v  \" class=\"math\" src=\"index-fc43a6dc47e713f819580e27bc74b6d4.svg\"/> можно найти по теореме\nПифагора:\n</p> <div class=\"math-display\">\n<img alt=\"v2 = v21 + v22\n\" class=\"math-display\" src=\"index-00c4a60170b35eaadb695af69f05de04.svg\"/></div>\n<p class=\"indent\">   Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"    ∘------  ∘ -----------------\nv =  v21 +v22 =  (5 км/ч)2+ 4 км/ч)2 ≈ 6,4 км/ч\n\" class=\"math-display\" src=\"index-774e874907e7c7fe769c701a6f3b3ba4.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5760f5baaa3b49d3e0b39f80ce357ef5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33069/index-5760f5baaa3b49d3e0b39f80ce357ef5.svg", "index-0cad1ed53a45d20e3e581599a3b12b58.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33069/index-0cad1ed53a45d20e3e581599a3b12b58.svg", "index-ae695733769c606429ad03579ed60b4b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33069/index-ae695733769c606429ad03579ed60b4b.svg", "f-1-4-pict3i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/f-1-4-pict3i.png", "index-775377b3464cef3baf7aa7495d191cfa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-775377b3464cef3baf7aa7495d191cfa.svg", "index-6c928bff6f71a0123fd2be32a97391ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-6c928bff6f71a0123fd2be32a97391ff.svg", "index-27526f8f6f2697e0b583cf9bb8407818.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-27526f8f6f2697e0b583cf9bb8407818.svg", "index-fc43a6dc47e713f819580e27bc74b6d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-fc43a6dc47e713f819580e27bc74b6d4.svg", "index-00c4a60170b35eaadb695af69f05de04.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-00c4a60170b35eaadb695af69f05de04.svg", "index-774e874907e7c7fe769c701a6f3b3ba4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33070/index-774e874907e7c7fe769c701a6f3b3ba4.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:31:10Z", "updated_at": "2026-08-28T18:39:35Z"}, {"id": 16689, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Дейнерис вылетела на драконе Дрогоне из Королевской Гавани в Браавос со скоростью <img alt=\"υд = 43,2  \" class=\"math\" src=\"index-81ba74924aa80e901aab6c246c0403e2.svg\"/> км/ч. Перпендикулярно Ее\nВеличеству Джон Сноу вылетел в Винтерфелл на драконе Рейгале со скоростью <img alt=\"υр = 3,5  \" class=\"math\" src=\"index-5e51b3bb05c554d0917ac676b66b3189.svg\"/> м/с. С какой скоростью они удаляются\nдруг от друга? Ответ дайте в м/с.\n</p>", "solution_html": "<p class=\"noindent\">Переведем скорость Дрогона в м/с:\n</p> <div class=\"math-display\">\n<img alt=\"     43,2 км/ч⋅1000\nυд = ----3600-----= 12 м/с\n\" class=\"math-display\" src=\"index-d4ef578436f698870d9e56d4a4c7a8cb.svg\"/></div>\n<p class=\"indent\">   Изобразим: </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict4i.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Отсюда видно, что скорость удаления двух драконов (тел) друг от друга — это модуль относительной скорости:\n</p> <div class=\"math-display\">\n<img alt=\"              ∘ ------\n|⃗υу|= |⃗υд− ⃗υр|=   υ2д+ υ2р\n\" class=\"math-display\" src=\"index-f24ce004aee4211d0c3c45cef94fee8e.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n</p> <div class=\"math-display\">\n<img alt=\"      ---------\nυy = ∘ 3,52+ 122 = ∘156,25= 12,5 м/с\n\" class=\"math-display\" src=\"index-fa9f9136c668c7a3f7167fc3db4f5114.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-81ba74924aa80e901aab6c246c0403e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33071/index-81ba74924aa80e901aab6c246c0403e2.svg", "index-5e51b3bb05c554d0917ac676b66b3189.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33071/index-5e51b3bb05c554d0917ac676b66b3189.svg", "index-d4ef578436f698870d9e56d4a4c7a8cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33072/index-d4ef578436f698870d9e56d4a4c7a8cb.svg", "f-1-4-pict4i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33072/f-1-4-pict4i.png", "index-f24ce004aee4211d0c3c45cef94fee8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33072/index-f24ce004aee4211d0c3c45cef94fee8e.svg", "index-fa9f9136c668c7a3f7167fc3db4f5114.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33072/index-fa9f9136c668c7a3f7167fc3db4f5114.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["Тренировочные задания Школково"], "created_at": "2022-01-02T10:32:06Z", "updated_at": "2026-09-22T19:55:58Z"}, {"id": 16690, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Сова летела с письмом из Хогвартса на север со скоростью <img alt=\"υс = 72  \" class=\"math\" src=\"index-cc75a81b0c545f0fc3b4ef1605ecb1e8.svg\"/> км/ч относительно земли. Подул западный ветер со скоростью\n<img alt=\"υв = 20  \" class=\"math\" src=\"index-c8d13a0432113078c3b49633ed43048d.svg\"/> км/ч. С какой скоростью относительно земли теперь летит сова? Ответ округлите до целых. Ответ дайте в\nкм/ч.\n</p>", "solution_html": "<p class=\"noindent\">Изобразим векторное равенство, соответствующее закону сложения скоростей (где <img alt=\"⃗υсв  \" class=\"math\" src=\"index-efd7d511210f1b369bed622570bffbc2.svg\"/>—скорость совы относительно воздуха) :\n</p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16690.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Скорость совы относительно воздуха, как и раньше, направлена на север и равна <img alt=\"⃗υсв = 72 км/ч  \" class=\"math\" src=\"index-6a4b7a8d784bf4e58240fbf67ac05e13.svg\"/>. <br/>По закону сложения скоростей получаем:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υс = ⃗υсв +⃗υв\n\" class=\"math-display\" src=\"index-2522a71c3635d71d626c17f4d85e0f62.svg\"/></div>\n<p class=\"indent\">   По т. Пифагора:\n</p> <div class=\"math-display\">\n<img alt=\"    ∘ ------- ∘ --------\nυс =  υ2св+ υ2в =  722+ 202 ≈ 74,7 км/ч\n\" class=\"math-display\" src=\"index-38684291c1800739a038e57ec8e15e33.svg\"/></div>\n<p class=\"indent\">   Округлим до целых:\n</p> <div class=\"math-display\">\n<img alt=\"74,7 км/с≈ 75 км/ч\n\" class=\"math-display\" src=\"index-080b2dea8499728b5d7d8816d8fdef81.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cc75a81b0c545f0fc3b4ef1605ecb1e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33073/index-cc75a81b0c545f0fc3b4ef1605ecb1e8.svg", "index-c8d13a0432113078c3b49633ed43048d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33073/index-c8d13a0432113078c3b49633ed43048d.svg", "index-efd7d511210f1b369bed622570bffbc2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/index-efd7d511210f1b369bed622570bffbc2.svg", "16690.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/16690.png", "index-6a4b7a8d784bf4e58240fbf67ac05e13.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/index-6a4b7a8d784bf4e58240fbf67ac05e13.svg", "index-2522a71c3635d71d626c17f4d85e0f62.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/index-2522a71c3635d71d626c17f4d85e0f62.svg", "index-38684291c1800739a038e57ec8e15e33.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/index-38684291c1800739a038e57ec8e15e33.svg", "index-080b2dea8499728b5d7d8816d8fdef81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33074/index-080b2dea8499728b5d7d8816d8fdef81.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": [], "created_at": "2022-01-02T10:32:51Z", "updated_at": "2026-08-28T18:37:31Z"}, {"id": 104094, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Материальная точка движется прямолинейно. На рисунке представлен график зависимости модуля скорости <img alt=\"v  \" class=\"math\" src=\"index-489e4d28fd24f04627cb771541d9fcd1.svg\"/> этой\nматериальной точки от времени <img alt=\"t  \" class=\"math\" src=\"index-59af0f14d96f596290d0fec4bcc41589.svg\"/>. Определите максимальный модуль ускорения материальной точки за рассматриваемый\nпромежуток времени. Ответ дайте в м/с<img alt=\"2.  \" class=\"math\" src=\"index-e4b4415c7879df260865c609086ac90a.svg\"/> </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"104094_1.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Ускорение по определению это скорость изменения скорости. Так как кривые движения это прямые, то тело двигалось на\nкаждом отдельном участке равноускоренно. Видно, что на участке 5-7 с самый резкий спад, поэтому на этом участке будет\nмаксимальное ускорение. Найдем его\n</p> <div class=\"math-display\">\n<img alt=\"a = Δv-= 0-−-5= − 2,5 м/c2.\n    Δt   7 − 5\n\" class=\"math-display\" src=\"index-0b9f9dcf80dba302efd103d1d97fad53.svg\"/></div>\n<p class=\"indent\">   Т.к. нас просят модуль, то ответ будет <img alt=\"      2\n2,5 м/c  \" class=\"math\" src=\"index-3038fb542a43896e8883b6f1e671002d.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-489e4d28fd24f04627cb771541d9fcd1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214874/index-489e4d28fd24f04627cb771541d9fcd1.svg", "index-59af0f14d96f596290d0fec4bcc41589.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214874/index-59af0f14d96f596290d0fec4bcc41589.svg", "index-e4b4415c7879df260865c609086ac90a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214874/index-e4b4415c7879df260865c609086ac90a.svg", "104094_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214874/104094_1.png", "index-0b9f9dcf80dba302efd103d1d97fad53.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214881/index-0b9f9dcf80dba302efd103d1d97fad53.svg", "index-3038fb542a43896e8883b6f1e671002d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214881/index-3038fb542a43896e8883b6f1e671002d.svg"}, "tags": ["Статград 2025 декабрь №1", "Статград 2025 декабрь №3"], "sources": ["CтатГрад 2025 декабрь №3", "CтатГрад 2025 декабрь №1"], "created_at": "2025-01-24T19:48:37Z", "updated_at": "2026-05-15T18:58:35Z"}, {"id": 104108, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Материальная точка движется прямолинейно. На рисунке представлен график зависимости модуля скорости <img alt=\"v  \" class=\"math\" src=\"index-489e4d28fd24f04627cb771541d9fcd1.svg\"/> этой\nматериальной точки от времени <img alt=\"t  \" class=\"math\" src=\"index-f758daf0785aada92bd5d1babf388426.svg\"/>. Определите минимальный модуль ускорения материальной точки за рассматриваемый\nпромежуток времени. Ответ дайте в м/с<img alt=\"2.  \" class=\"math\" src=\"index-e4b4415c7879df260865c609086ac90a.svg\"/> </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"104094_1.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Ускорение по определению это скорость изменения скорости. Так как кривые движения это прямые, то тело двигалось на\nкаждом отдельном участке равноускоренно. Видно, что на участке 2-4 с самый гладкий наклон, поэтому на этом участке\nбудет минимальное ускорение. Найдем его\n</p> <div class=\"math-display\">\n<img alt=\"a = Δv-= 4-− 3-= 0,5 м/c2.\n    Δt   4 − 2\n\" class=\"math-display\" src=\"index-dcd6c63a3051b34c80e426d2ee39398e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-489e4d28fd24f04627cb771541d9fcd1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214903/index-489e4d28fd24f04627cb771541d9fcd1.svg", "index-f758daf0785aada92bd5d1babf388426.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214903/index-f758daf0785aada92bd5d1babf388426.svg", "index-e4b4415c7879df260865c609086ac90a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214903/index-e4b4415c7879df260865c609086ac90a.svg", "104094_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214903/104094_1.png", "index-dcd6c63a3051b34c80e426d2ee39398e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/214906/index-dcd6c63a3051b34c80e426d2ee39398e.svg"}, "tags": ["Статград 2025 декабрь №2", "Статград 2025 декабрь №4"], "sources": ["CтатГрад 2025 декабрь №2", "CтатГрад 2025 декабрь №4"], "created_at": "2025-01-24T20:34:29Z", "updated_at": "2026-05-15T18:58:06Z"}, {"id": 107147, "name": "Бульдозер против грузовика", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Из населённого пункта одновременно в одном направлении выезжают грузовой автомобиль и бульдозер и движутся по\nдороге с постоянными скоростями. На графике показана зависимость расстояния между грузовиком и бульдозером от\nвремени. Скорость грузовика равна 25 м/с, а скорость бульдозера меньше. С какой скоростью движется бульдозер? Ответ\nдайте в м/с.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"107147.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">Из графика найдем относительную скорость бульдозера и грузовика:\n</p> <div class=\"math-display\">\n<img alt=\"       S-  -54 км   54-⋅1000-м\nV отн = t = 60 мин =  60 ⋅60 с = 15 м/с\n\" class=\"math-display\" src=\"index-50733faf516d8ca3987ebf571396d967.svg\"/></div>\n<p class=\"indent\">   Относительной скоростью является разница скоростей грузовика <img alt=\"V1  \" class=\"math\" src=\"index-175a66ba28c8c8f9f1e376b3dae845e8.svg\"/> и бульдозера <img alt=\"V2  \" class=\"math\" src=\"index-e4eae7e5eae42abbe872aa8029eb3db9.svg\"/>, т.к. они двигаются в одном\nнаправлении. Отсюда и найдем скорость бульдозера:\n</p> <div class=\"math-display\">\n<img alt=\"V отн = V1 − V2 → V2 = V1 − V отн = 25 − 15 = 10 м/с\n\" class=\"math-display\" src=\"index-faeaee528a295caab59e7a56b4e2209b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"107147.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221837/107147.png", "index-50733faf516d8ca3987ebf571396d967.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221838/index-50733faf516d8ca3987ebf571396d967.svg", "index-175a66ba28c8c8f9f1e376b3dae845e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221838/index-175a66ba28c8c8f9f1e376b3dae845e8.svg", "index-e4eae7e5eae42abbe872aa8029eb3db9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221838/index-e4eae7e5eae42abbe872aa8029eb3db9.svg", "index-faeaee528a295caab59e7a56b4e2209b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221838/index-faeaee528a295caab59e7a56b4e2209b.svg"}, "tags": [], "sources": ["Демидова 2020"], "created_at": "2025-03-04T00:15:24Z", "updated_at": "2025-11-12T15:05:54Z"}, {"id": 126449, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Человек, находящийся на балконе высокого дома, подбрасывает вертикально вверх монету, сообщая ей начальную скорость 2\nм/с. Через какое время после начала свободного полёта монеты модуль её скорости увеличится в два раза, если\nмонета к данному моменту ещё не упадёт на землю? Сопротивление воздуха пренебрежимо мало. Ответ дайте в\nс.\n</p>", "solution_html": "<p class=\"noindent\">После того, как человек подбросит моменту, она будет двигаться замедленно вверх до остановки. На ее полет до высшей точки\nтраектории будет затрачено время\n</p> <div class=\"math-display\">\n<img alt=\"    v\nt1 = g0\n\" class=\"math-display\" src=\"index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg\"/></div>\n<p class=\"indent\">   Далее монета будет двигаться ускоренно вниз с начальной скоростью, равной нулю. Время движения монеты вниз до того\nмомента, пока ее скорость не станет в 2 раза больше:\n</p> <div class=\"math-display\">\n<img alt=\"    2v0\nt2 = g\n\" class=\"math-display\" src=\"index-727821911ff47155f1a020ab4a1469b4.svg\"/></div>\n<p class=\"indent\">   Общее время полета до рассматриваемого момента:\n</p> <div class=\"math-display\">\n<img alt=\"t= t1+ t2 = v0+ 2v0= 3v0-= 3⋅2-=0,6 с\n           g    g    g    10\n\" class=\"math-display\" src=\"index-ef83f176a3ae52ccf021db9c27cd49db.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261240/index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg", "index-727821911ff47155f1a020ab4a1469b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261240/index-727821911ff47155f1a020ab4a1469b4.svg", "index-ef83f176a3ae52ccf021db9c27cd49db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261240/index-ef83f176a3ae52ccf021db9c27cd49db.svg"}, "tags": ["Статград 20.10.2022 Физика 1"], "sources": ["CтатГрад 20.10.2022 Физика 1"], "created_at": "2025-06-12T12:35:54Z", "updated_at": "2026-03-27T19:51:23Z"}, {"id": 126604, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Человек, находящийся на балконе высокого дома, подбрасывает вертикально вверх монету, сообщая ей начальную скорость 3\nм/с. Через какое время после начала свободного полета монеты модуль её скорости увеличится в три раза, если\nмонета к данному моменту ещё не упадёт на землю? Сопротивление воздуха пренебрежимо мало. Ответ дайте в\nс.\n</p>", "solution_html": "<p class=\"noindent\">После того, как человек подбросит моменту, она будет двигаться замедленно вверх до остановки. На ее полет до высшей точки\nтраектории будет затрачено время\n</p> <div class=\"math-display\">\n<img alt=\"    v\nt1 = g0\n\" class=\"math-display\" src=\"index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg\"/></div>\n<p class=\"indent\">   Далее монета будет двигаться ускоренно вниз с начальной скоростью, равной нулю. Время движения монеты вниз до того\nмомента, пока ее скорость не станет в 3 раза больше:\n</p> <div class=\"math-display\">\n<img alt=\"    3v0\nt2 = g\n\" class=\"math-display\" src=\"index-ad0a2cdef4902f26b0e57abed1d221a2.svg\"/></div>\n<p class=\"indent\">   Общее время полета до рассматриваемого момента:\n</p> <div class=\"math-display\">\n<img alt=\"t= t1+ t2 = v0+ 3v0= 4v0-= 4⋅3-=1,2 с\n           g    g    g    10\n\" class=\"math-display\" src=\"index-35a2dd47d2775a8a7bc52fe671ad344e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261831/index-6e6f785d3f7bbabd24ab41dfa2c4c482.svg", "index-ad0a2cdef4902f26b0e57abed1d221a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261831/index-ad0a2cdef4902f26b0e57abed1d221a2.svg", "index-35a2dd47d2775a8a7bc52fe671ad344e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261831/index-35a2dd47d2775a8a7bc52fe671ad344e.svg"}, "tags": ["Статград 20.10.2022 Физика 2"], "sources": ["CтатГрад 20.10.2022 Физика 2"], "created_at": "2025-06-14T17:20:47Z", "updated_at": "2026-03-27T19:51:35Z"}, {"id": 127686, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Небольшое тело движется вдоль оси <img alt=\"OX.  \" class=\"math\" src=\"index-af1d5576ef37a9796780cfaaa4eeb7a9.svg\"/> На рисунке показан график зависимости проекции <img alt=\"Vx  \" class=\"math\" src=\"index-565d06c41dfbc304efa674044217ce0a.svg\"/> скорости этого тела от времени\n<img alt=\"t.  \" class=\"math\" src=\"index-f7f1554b3c94ca993f9dee0099722cb3.svg\"/> Какой путь прошло данное тело за интервал времени от 6 с до 12 c? Ответ дайте в м. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"127686.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Так как нам дана зависимости скорости от времени, путь мы можем найти как площадь под графиком, в данном случае\nтрапеция:\n</p> <div class=\"math-display\">\n<img alt=\"    3+ 5\nS = -2--⋅6= 24 м\n\" class=\"math-display\" src=\"index-b535a36ca1ca4f8136b70dd234faa14f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-af1d5576ef37a9796780cfaaa4eeb7a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/263823/index-af1d5576ef37a9796780cfaaa4eeb7a9.svg", "index-565d06c41dfbc304efa674044217ce0a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/263823/index-565d06c41dfbc304efa674044217ce0a.svg", "index-f7f1554b3c94ca993f9dee0099722cb3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/263823/index-f7f1554b3c94ca993f9dee0099722cb3.svg", "127686.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/263823/127686.png", "index-b535a36ca1ca4f8136b70dd234faa14f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/279675/index-b535a36ca1ca4f8136b70dd234faa14f.svg"}, "tags": ["Статград 09.12.2022 Физика 1"], "sources": ["CтатГрад 09.12.2022 Физика 1"], "created_at": "2025-06-25T09:07:08Z", "updated_at": "2026-03-27T19:51:50Z"}, {"id": 130809, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Два маленьких тела, находившиеся в состоянии покоя, одновременно начинают двигаться из одной точки по плоскости YOX с\nразными по модулю постоянными ускорениями. На рисунке изображены векторы <img alt=\"⃗a1  \" class=\"math\" src=\"index-30ed22e452c7f91673acba40b8b389b4.svg\"/> и <img alt=\"⃗a2  \" class=\"math\" src=\"index-149fea3a0ab0c3db82772a0edb58cb1a.svg\"/> ускорений этих тел (масштабы\nкоординатной сетки вдоль горизонтальной и вертикальной осей одинаковы). Чему равно отношение путей <img alt=\"S1∕S2  \" class=\"math\" src=\"index-a11a1cda5bae0d0bc92f227d3892dc7f.svg\"/>, пройденных этими\nтелами за первые 2 секунды их движения? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"130809.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Из рисунка следует, что модуль ускорения первого тела равен:\n</p> <div class=\"math-display\">\n<img alt=\"    ∘ ------  √-----       2\na1 =  a2x+ a2y = 16 +9 = 5 м/с\n\" class=\"math-display\" src=\"index-c0c8a7a076d775185a4e555e80d8e50e.svg\"/></div>\n<p class=\"indent\">   Модуль ускорения второго тела равен <img alt=\"a2 = 2 м/с2  \" class=\"math\" src=\"index-f0dd0acba10e34cefaf66067bd2c8ee6.svg\"/>. Учитывая, что при движе s=\"indent\">   Отсюда выразим <img alt=\"υ1  \" class=\"math\" src=\"index-3abc15f399d16e2071347feede414e20.svg\"/> и <img alt=\"υ2  \" class=\"math\" src=\"index-0f2b31c480a969be77ad17209a8e4a8e.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"υ1 = S1; υ2 = S2.\n    t1       t2\n\" class=\"math-display\" src=\"index-8f343f69323e17f54d9b437fede119ef.svg\"/></div>\n<p class=\"indent\">   Найдем <img alt=\"υ2\nυ1  \" class=\"math\" src=\"index-bfde107c70124ab9606639c40b4f03c5.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"     S2   3 м\nυ2= -t2=  2 c-= 2\nυ1   S1   3 м\n     t1   4 c\n\" class=\"math-display\" src=\"index-3fd2b425bb7bb99df2787e87a1730ca1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-162d1bf9a9c26fce6d8276c5cbaffcdd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32957/index-162d1bf9a9c26fce6d8276c5cbaffcdd.svg", "index-38bf051a41733428865d2feb640e1601.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32957/index-38bf051a41733428865d2feb640e1601.svg", "16632_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32957/16632_1.png", "index-4733f467105075460a79970307e6a343.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32958/index-4733f467105075460a79970307e6a343.svg", "index-14fd9c47af40737a78a19f813e95fc10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32958/index-14fd9c47af40737a78a19f813e95fc10.svg", "index-ebc6462a0b6134c407ec3918bdf57ce8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32958/index-ebc6462a0b6134c407ec3918bdf57ce8.svg", "index-96a557c950a9f825629fc55210b732ed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32958/index-96a557c950a9f825629fc55210b732ed.svg", "index-cad2c7acc1f52a561ea8150e10b1ab88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32958/index-cad2c7acc1f52a561ea8150e10b1ab88.svg", "index-3abc15f399d16e2071347feede414e20.svg": "https:// n/432424/index-ebc6462a0b6134c407ec3918bdf57ce8.svg", "index-96a557c950a9f825629fc55210b732ed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-96a557c950a9f825629fc55210b732ed.svg", "index-cad2c7acc1f52a561ea8150e10b1ab88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-cad2c7acc1f52a561ea8150e10b1ab88.svg", "index-3abc15f399d16e2071347feede414e20.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-3abc15f399d16e2071347feede414e20.svg", "index-0f2b31c480a969be77ad17209a8e4a8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-0f2b31c480a969be77ad17209a8e4a8e.svg", "index-8f343f69323e17f54d9b437fede119ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-8f343f69323e17f54d9b437fede119ef.svg", "index-bfde107c70124ab9606639c40b4f03c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-bfde107c70124ab9606639c40b4f03c5.svg", "index-3fd2b425bb7bb99df2787e87a1730ca1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432424/index-3fd2b425bb7bb99df2787e87a1730ca1.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-15T10:32:50Z", "updated_at": "2026-09-22T08:45:45Z"}, {"id": 16633, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равномерное движение", "question_html": "<p class=\"noindent\">Дима каждый день ходит в школу. На рисунке представлен график движения Димы из дома в школу и обратно. Дом находится в\nточке <img alt=\"S = 0  \" class=\"math\" src=\"index-4df7545e551bc539b67a6340302ec7ab.svg\"/>, а школа — в точке <img alt=\"S = 300  \" class=\"math\" src=\"index-9656ab6a0a6dc5a52b678be7ac813703.svg\"/> м. Чему равен модуль скорости Димы на пути из школы домой? Ответ дайте в\nм/с.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16633.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Рассмотрим график: весь путь Дима двигался прямолинейно и равномерно (но в точке <img alt=\"S = 300  \" class=\"math\" src=\"index-f9217d48f53b60e7bccf1ef86e1e75be.svg\"/> м изменил свою скорость).\nСначала он двигался из дома в школу со скоростью <img alt=\"υ1  \" class=\"math\" src=\"index-dbc0e4a7d8807248ddb7fd7ceb6db978.svg\"/> в течение времени <img alt=\"t1 = 5  \" class=\"math\" src=\"index-2478a2aabd390a90ccb010860f27c973.svg\"/> мин, после чего возвращался из школы домой cо\nскоростью <img alt=\"υ2  \" class=\"math\" src=\"index-ea2962ac38a7aa6412bd4369fe8748f0.svg\"/> в течение времени <img alt=\"t2  \" class=\"math\" src=\"index-a586a341105f485d8dc40193ba8adc91.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"t2 = 15 мин − 5 мин= 10 мин= 10⋅60 c= 600 с.\n\" class=\"math-display\" src=\"index-d76ff009b469294d6b41a7ded69982d1.svg\"/></div>\n<p class=\"indent\">   Чтобы найти <img alt=\"υ2  \" class=\"math\" src=\"index-9126d6f9a428e2f28067cfe408cd9523.svg\"/>, нам необходимо рассмотреть участок движения Димы по пути из школы домой (<img alt=\"S2  \" class=\"math\" src=\"index-ac37cf7a27c459543f9f45d7863841b2.svg\"/>). <br/>Найдем по закону равномерного прямолинейного движения перемещение из школы домой:\n</p> <div class=\"math-display\">\n<img alt=\"S2 = υ2t2,\n\" class=\"math-display\" src=\"index-f08f67ca69983dee0d2b0b3fbf02dfaa.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"S2 = 0 м− 300 м = −300 м  \" class=\"math\" src=\"index-dbb1d2027dd1fe9763506a9715d0f623.svg\"/>. <br/>Отсюда выражаем <img alt=\"υ2  \" class=\"math\" src=\"index-b2dba89f099c9600589f8925524d433f.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"υ2 = S2=  −300 м-= −0,5 м/с\n    t2   600 c\n\" class=\"math-display\" src=\"index-05b0cb94307291cdc34d861b52ea568a.svg\"/></div>\n<p class=\"indent\">   Значит, <img alt=\"|υ2|= |− 0,5| м/с= 0,5 м/с  \" class=\"math\" src=\"index-bfdbb9647ee40a85f6c0bb0027b37825.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4df7545e551bc539b67a6340302ec7ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32959/index-4df7545e551bc539b67a6340302ec7ab.svg", "index-9656ab6a0a6dc5a52b678be7ac813703.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32959/index-9656ab6a0a6dc5a52b678be7ac813703.svg", "16633.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32959/16633.png", "index-f9217d48f53b60e7bccf1ef86e1e75be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-f9217d48f53b60e7bccf1ef86e1e75be.svg", "index-dbc0e4a7d8807248ddb7fd7ceb6db978.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-dbc0e4a7d8807248ddb7fd7ceb6db978.svg", "index-2478a2aabd390a90ccb010860f27c973.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-2478a2aabd390a90ccb010860f27c973.svg", "index-ea2962ac38a7aa6412bd4369fe8748f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-ea2962ac38a7aa6412bd4369fe8748f0.svg", "index-a586a341105f485d8dc40193ba8adc91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-a586a341105f485d8dc40193ba8adc91.svg", "index-d76ff009b469294d6b41a7ded69982d1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-d76ff009b469294d6b41a7ded69982d1.svg", "index-9126d6f9a428e2f28067cfe408cd9523.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-9126d6f9a428e2f28067cfe408cd9523.svg", "index-ac37cf7a27c459543f9f45d7863841b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-ac37cf7a27c459543f9f45d7863841b2.svg", "index-f08f67ca69983dee0d2b0b3fbf02dfaa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32960/index-f08f67ca69983dee0d2b0b3fbf02dfaa.svg", "index-dbb1d2027dd1fe9  "https://3.shkolkovo.online/api/latex-service/v1/GetSession/209177/101740.png", "index-a623b245a6aeb8c502557d1ac3785e52.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/209178/index-a623b245a6aeb8c502557d1ac3785e52.svg", "index-aefa7398dfdef31a4f9616d93b766d95.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/209178/index-aefa7398dfdef31a4f9616d93b766d95.svg", "index-c8fecc8a69498012ff1e45b89ca7c531.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/209178/index-c8fecc8a69498012ff1e45b89ca7c531.svg"}, "tags": [], "sources": ["Школково. Тренировочные задания"], "created_at": "2024-12-11T09:33:05Z", "updated_at": "2026-05-03T12:18:22Z"}, {"id": 14890, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равномерное движение", "question_html": "<p class=\"noindent\">Супермен, двигаясь прямолинейно, пролетел первую половину пути со скоростью <img alt=\"υ1 = 30  \" class=\"math\" src=\"index-a7bf5b557946560b46e87adda0e94514.svg\"/> км/ч, вторую – со скоростью <img alt=\"υ2 = 50  \" class=\"math\" src=\"index-7d13f0453f205c685ae4e2143a8eb9b0.svg\"/>\nкм/ч. Найти среднюю скорость движения супермена на всем пройденном пути. Ответ дайте в км/ч.<br/>\n</p>", "solution_html": "<p class=\"noindent\">Средняя скорость на всём пути:\n</p> <div class=\"math-display\">\n<img alt=\"     S1 +S2\nυср =-t1-+t2\n\" class=\"math-display\" src=\"index-3ffa4255af088685d3825455e2ce871a.svg\"/></div>\n<p class=\"indent\">   Пусть весь путь <img alt=\"S = 2l  \" class=\"math\" src=\"index-980b2d3c17d1afaef7affc70ecf5b7c0.svg\"/>, тогда <img alt=\"S1 = l, S2 = l, t1 =-l, t2 =-l\n               υ1     υ2  \" class=\"math\" src=\"index-ed544ef6979dcf04dae4544a20d1173e.svg\"/>.\n</p><p class=\"indent\">   Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"υср =---2l-- = 2υ1υ2-= 2-⋅30-⋅50 = 37,5 км/ч.\n      l-+ -l   υ1+ υ2   30+ 50\n      υ1  υ2\n\" class=\"math-display\" src=\"index-73824254dad307d9f7d17a2f74961f49.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a7bf5b557946560b46e87adda0e94514.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29792/index-a7bf5b557946560b46e87adda0e94514.svg", "index-7d13f0453f205c685ae4e2143a8eb9b0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29792/index-7d13f0453f205c685ae4e2143a8eb9b0.svg", "index-3ffa4255af088685d3825455e2ce871a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29793/index-3ffa4255af088685d3825455e2ce871a.svg", "index-980b2d3c17d1afaef7affc70ecf5b7c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29793/index-980b2d3c17d1afaef7affc70ecf5b7c0.svg", "index-ed544ef6979dcf04dae4544a20d1173e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29793/index-ed544ef6979dcf04dae4544a20d1173e.svg", "index-73824254dad307d9f7d17a2f74961f49.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/29793/index-73824254dad307d9f7d17a2f74961f49.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Средняя скорость", "Уровень ЕГЭ", "Формат ЕГЭ"], "sources": [], "created_at": "2021-12-15T11:15:34Z", "updated_at": "2026-08-28T18:40:38Z"}, {"id": 16637, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равномерное движение", "question_html": "<p class=\"noindent\">Движение двух велосипедистов задано уравнениями <img alt=\"x1 =3t  \" class=\"math\" src=\"index-a8c8ec21aeed9264bc3b6b2b3c57c51d.svg\"/> (м) и <img alt=\"x2 =12 − t  \" class=\"math\" src=\"index-024d99106abc7aeb5f1addc536895579.svg\"/> (м). Велосипедисты двигаются вдоль одной прямой.\nНайдите координату <img alt=\"x  \" class=\"math\" src=\"index-caf7761edd7dcaa4bc398ac922e8dd8c.svg\"/> места встречи велосипедистов. Ответ дайте в м.\n</p>", "solution_html": "<p class=\"noindent\">1 способ: <br/>Велосипедисты встретятся, если совпадут их координаты, отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"x1 = x2\n\" class=\"math-display\" src=\"index-56aa70bc6fdf3f481ffd8cfc37924bae.svg\"/></div>\n<p class=\"indent\">   Подставим уравнения:\n</p> <div class=\"math-display\">\n<img alt=\"3t= 12 − t\n\" class=\"math-display\" src=\"index-c2c3aa11b588ca4b8ba47efa8ac37901.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"4t= 12\n\" class=\"math-display\" src=\"index-ddac0335bca9d46b098785eccfa1a555.svg\"/></div>\n<p class=\"indent\">   Отсюда время, в которое встретятся велосипедисты:\n</p> <div class=\"math-display\">\n<img alt=\"t= 3 c\n\" class=\"math-display\" src=\"index-023d20eb15008baf01a9022780122b9c.svg\"/></div>\n<p class=\"indent\">   Найдем координату <img alt=\"x  \" class=\"math\" src=\"index-0115ac2ea8c18184569fd99e64abd546.svg\"/> места встречи велосипедистов, для этого подставим время <img alt=\"t  \" class=\"math\" src=\"index-7344f231c282ef9e398b2e0865dc7769.svg\"/> в оба уравнения:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"x1 = 3⋅3= 9 м\n\" class=\"math-display\" src=\"index-a61519ceb5e4a265d340ec8edbcaaa86.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"x2 = 12− 3= 9 м\n\" class=\"math-display\" src=\"index-ce9de2652b6b3a74a6b4d79441fc6d33.svg\"/></div>\n<p class=\"indent\">   2 способ: <br/>Изобразим движение велосипедистов: </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-1-pict7i.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Найдем пересечение графиков и опустим перпендикуляр к оси <img alt=\"Oy  \" class=\"math\" src=\"index-073c21fc96ccf96717321da56ea4dab3.svg\"/>. Отсюда очевидно, что ответ 9 м.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a8c8ec21aeed9264bc3b6b2b3c57c51d.svg": "https://3. емещение", "Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["Демоверсия 2017"], "created_at": "2022-01-02T09:32:47Z", "updated_at": "2026-01-15T15:13:11Z"}, {"id": 60862, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равномерное движение", "question_html": "<p class=\"noindent\">Координата тела меняется с течением времени согласно закону <img alt=\"x = 4− 2t  \" class=\"math\" src=\"index-9385b642e390f8df492d65599f650106.svg\"/>, где все величины выражены в СИ. Определите проекцию\nскорости <img alt=\"vx  \" class=\"math\" src=\"index-ce940674d3eee34e8d1adc827fb9b537.svg\"/> этого тела. Ответ дайте в м/c.\n</p>", "solution_html": "<p class=\"noindent\">При равномерном движении координата меняется\n</p> <div class=\"math-display\">\n<img alt=\"x= x0+ vxt,\n\" class=\"math-display\" src=\"index-6200c45989fc7f591835fd193dc809b7.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"vx  \" class=\"math\" src=\"index-24cda50b0a23352fb991b1b3d46b03bc.svg\"/> – скорость. Тогда <img alt=\"vx = −2  \" class=\"math\" src=\"index-a6842f8da7a74e17b7a1d9b7edd65470.svg\"/> м/с.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9385b642e390f8df492d65599f650106.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110454/index-9385b642e390f8df492d65599f650106.svg", "index-ce940674d3eee34e8d1adc827fb9b537.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110454/index-ce940674d3eee34e8d1adc827fb9b537.svg", "index-6200c45989fc7f591835fd193dc809b7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110455/index-6200c45989fc7f591835fd193dc809b7.svg", "index-24cda50b0a23352fb991b1b3d46b03bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110455/index-24cda50b0a23352fb991b1b3d46b03bc.svg", "index-a6842f8da7a74e17b7a1d9b7edd65470.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110455/index-a6842f8da7a74e17b7a1d9b7edd65470.svg"}, "tags": [], "sources": ["ФИПИ"], "create
