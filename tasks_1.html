y\" src=\"index-c02ad8cfe30abc3434c532d7b996a504.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"        at2         3 ⋅102\nS = υ0t+-2-= 10⋅10+ --2-- = 250 м\n\" class=\"math-display\" src=\"index-66ce5c8f09ec26e57a5df2d2b46c7b76.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-41bfe64cead183a3095ee51aaf51d38a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33003/index-41bfe64cead183a3095ee51aaf51d38a.svg", "index-a442dd25c004ba37d57fab78b3a9229a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33003/index-a442dd25c004ba37d57fab78b3a9229a.svg", "16655.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33003/16655.png", "index-ac227c482835f36375d4f08758a9a268.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33004/index-ac227c482835f36375d4f08758a9a268.svg", "index-a0be05f42289cd4ae17a54858d94c4b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33004/index-a0be05f42289cd4ae17a54858d94c4b9.svg", "index-e608518a23e142ab76423fb3a3f82297.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33004/index-e608518a23e142ab76423fb3a3f82297.svg", "index-c02ad8cfe30abc3434c532d7b996a504.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33004/index-c02ad8cfe30abc3434c532d7b996a504.svg", "index-66ce5c8f09ec26e57a5df2d2b46c7b76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33004/index-66ce5c8f09ec26e57a5df2d2b46c7b76.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": [], "created_at": "2022-01-02T09:51:46Z", "updated_at": "2026-07-02T12:39:29Z"}, {"id": 195008, "name": "Копия #16665 - Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Дан график зависимости проекции скорости <img alt=\"vx  \" class=\"math\" src=\"index-31d796e8e3269ccf66d572ada53117ab.svg\"/> от времени t (см.рис.). </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"52\" src=\"128268.png\" width=\"52\"/></p></div>\n<p class=\"noindent\">Определите модуль перемещения тела за время от <img alt=\"t1 = 2  \" class=\"math\" src=\"index-2ff7271efb270ee7bf371948773ffbba.svg\"/> c до <img alt=\"t2 = 6  \" class=\"math\" src=\"index-f71687971261b39bad7424e12937095e.svg\"/> c. Ответ дайте в м.\n</p>", "solution_html": "<p class=\"noindent\">Перемещение численно будет равно разности площадей (пройденных путей) от 2 до 4 и от 4 до 6 секунд. Пусть <img alt=\" ′\nt =4 с  \" class=\"math\" src=\"index-953eb45b1ea0abcaebb863aa4de49678.svg\"/>.\nТогда:\n</p> <div class=\"math-display\">\n<img alt=\"    ||1          ||  ||1           ||  ||1         ||  ||1           ||\nSx = ||2vx(2)(t′− t1)||− ||2 vx(6)(t2− t′)||= ||2 ⋅5⋅(4− 2)||− ||2 ⋅(−5)⋅(6− 4)||= 0\n\" class=\"math-display\" src=\"index-03c616d56337d4c6e5301e6755f51af3.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-31d796e8e3269ccf66d572ada53117ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432136/index-31d796e8e3269ccf66d572ada53117ab.svg", "128268.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432136/128268.png", "index-2ff7271efb270ee7bf371948773ffbba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432136/index-2ff7271efb270ee7bf371948773ffbba.svg", "index-f71687971261b39bad7424e12937095e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432136/index-f71687971261b39bad7424e12937095e.svg", "index-953eb45b1ea0abcaebb863aa4de49678.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432137/index-953eb45b1ea0abcaebb863aa4de49678.svg", "index-03c616d56337d4c6e5301e6755f51af3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432137/index-03c616d56337d4c6e5301e6755f51af3.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "2019", "Досрочная волна", "Задача с реального ЕГЭ"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-14T21:12:45Z", "updated_at": "2026-09-15T18:32:05Z"}, {"id": 16644, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Трактор проезжает по прямой дороге мимо стада коров. На графике представлена зависимость проекции его скорости <img alt=\"υx(t)  \" class=\"math\" src=\"index-436eb74fd683a8866121d589bb32d090.svg\"/> на ось\n<img alt=\"Ox  \" class=\"math\" src=\"index-652ac0da700a825399975012cb0eb0af.svg\"/> от времени. Ось <img alt=\"Ox  \" class=\"math\" src=\"index-de79168f5da4047432dcd2990b6638d9.svg\"/> направлена вдоль дороги. Установите, какой путь проехал трактор за время от <img alt=\"t1 = 0  \" class=\"math\" src=\"index-31497e73a1ffc3ab14b90f8b79a207d4.svg\"/> до <img alt=\"t2 = 10  \" class=\"math\" src=\"index-d2a72907698a8ce52c78d9effc5a0b5c.svg\"/> с.\nОтвет дайте в м.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"16445.png\" width=\"368\"/> </p> </figure>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"16644.png\" width=\"368\"/></p></div>\n<p class=\"noindent\">Путь — величина строго положительная, это длина пройденного телом участка траектории. Путь можно найти как площадь под\nграфиком зависимости скорости от времени без учета знаков. Поскольку путь это площадь под графиком, то нам необходимо найти\nплощадь прямогуольного треугольника, получим:\n</p> <div class=\"math-display\">\n<img alt=\"S = 1⋅10⋅20= 100 м\n    2\n\" class=\"math-display\" src=\"index-5de01a7ce70a45c8b89dd7c07476dfda.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-436eb74fd683a8866121d589bb32d090.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/index-436eb74fd683a8866121d589bb32d090.svg", "index-652ac0da700a825399975012cb0eb0af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/index-652ac0da700a825399975012cb0eb0af.svg", "index-de79168f5da4047432dcd2990b6638d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/index-de79168f5da4047432dcd2990b6638d9.svg", "index-31497e73a1ffc3ab14b90f8b79a207d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/index-31497e73a1ffc3ab14b90f8b79a207d4.svg", "index-d2a72907698a8ce52c78d9effc5a0b5c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/index-d2a72907698a8ce52c78d9effc5a0b5c.svg", "16445.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32981/16445.png", "16644.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32982/16644.png", "index-5de01a7ce70a45c8b89dd7c07476dfda.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32982/index-5de01a7ce70a45c8b89dd7c07476dfda.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": [], "created_at": "2022-01-02T09:41:49Z", "updated_at": "2026-07-02T12:38:06Z"}, {"id": 16646, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Рыжий Боб бежит к миске с едой. На графике представлена зависимость проекции скорости кота <img alt=\"υx  \" class=\"math\" src=\"index-403cf55c506f989e7dc36351cde05534.svg\"/> на ось <img alt=\"Ox  \" class=\"math\" src=\"index-de083a44c17bd1c504a479dac29cd091.svg\"/> от времени. Какой\nпуть был пройден Бобом за <img alt=\"t= 4  \" class=\"math\" src=\"index-39ae71838e7f08bbf2642950f549e238.svg\"/> с? Ответ дайте в м.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16646_1.png\" width=\"263\"/> </p> </figure>", "solution_html": "<figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16646_2.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   На протяжении всего интервала времени проекция скорости Боба на ось Ox положительна. Поэтому, для того чтобы найти\nпуть, пройденный котом, необходимо вычислить площадь под графиком. К моменту времени <img alt=\"t =4  \" class=\"math\" src=\"index-df51d0643bb1fa80704fc8a5e7828c2a.svg\"/> с кот прошел\nпуть: \n</p> <div class=\"math-display\">\n<img alt=\"S = 1⋅2 ⋅2 + 2⋅2= 6 м\n    2\n\" class=\"math-display\" src=\"index-76b49029f5907eabd78b76ff0cb5f312.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-403cf55c506f989e7dc36351cde05534.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32985/index-403cf55c506f989e7dc36351cde05534.svg", "index-de083a44c17bd1c504a479dac29cd091.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32985/index-de083a44c17bd1c504a479dac29cd091.svg", "index-39ae71838e7f08bbf2642950f549e238.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32985/index-39ae71838e7f08bbf2642950f549e238.svg", "16646_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32985/16646_1.png", "16646_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32986/16646_2.png", "index-df51d0643bb1fa80704fc8a5e7828c2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32986/index-df51d0643bb1fa80704fc8a5e7828c2a.svg", "index-76b49029f5907eabd78b76ff0cb5f312.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32986/index-76b49029f5907eabd78b76ff0cb5f312.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": ["Тренировочные задания Школково"], "created_at": "2022-01-02T09:44:36Z", "updated_at": "2026-07-02T12:46:48Z"}, {"id": 195485, "name": "Копия #102921 - Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">По графику зависимости проекции скорости тела <img alt=\"vx  \" class=\"math\" src=\"index-4936133df50d2be13ff637d889e6edd1.svg\"/> от времени <img alt=\"t  \" class=\"math\" src=\"index-932297800b7461da9714c5f4e23bd2dc.svg\"/> найдите длину пути, которую тело прошло в интервале времени\nот 15 до 19 с. Ответ дайте в м.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"102921 - 1.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">Путь можно найти как площадь под графиком. Путь будет складываться из двух слагаемых. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"102921_2.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Первое (от 15 до 17 с)\n</p> <div class=\"math-display\">\n<img alt=\"    v(15)+ v(17)    5+ 0\nS1 =-----2-----τ1 =--2- ⋅2 с= 5 м\n\" class=\"math-display\" src=\"index-6982d75f5283f5c4b32d6ca2068b954a.svg\"/></div>\n<p class=\"indent\">   Второе (от 17 с до 19 с)\n</p> <div class=\"math-display\">\n<img alt=\"S2 = v(17)+-|v(19)|τ2 = 0+-5⋅2 с = 5 м\n         2           2\n\" class=\"math-display\" src=\"index-289baf9eca7537d7c20c70e65d128bc3.svg\"/></div>\n<p class=\"indent\">   Итого:\n</p> <div class=\"math-display\">\n<img alt=\"S = S1+ S2 = 10 м\n\" class=\"math-display\" src=\"index-0bc29f4bd884fca3f951b7c69032ca62.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4936133df50d2be13ff637d889e6edd1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433345/index-4936133df50d2be13ff637d889e6edd1.svg", "index-932297800b7461da9714c5f4e23bd2dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433345/index-932297800b7461da9714c5f4e23bd2dc.svg", "102921 - 1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433345/102921 - 1.png", "102921_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433346/102921_2.png", "index-6982d75f5283f5c4b32d6ca2068b954a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433346/index-6982d75f5283f5c4b32d6ca2068b954a.svg", "index-289baf9eca7537d7c20c70e65d128bc3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433346/index-289baf9eca7537d7c20c70e65d128bc3.svg", "index-0bc29f4bd884fca3f951b7c69032ca62.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433346/index-0bc29f4bd884fca3f951b7c69032ca62.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T00:13:07Z", "updated_at": "2026-08-17T00:15:36Z"}, {"id": 65354, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Тело движется вдоль оси <img alt=\"Ox  \" class=\"math\" src=\"index-65c72f1ec8bbd6c5bc22ff0b5ba189d2.svg\"/>. На рисунке приведён график зависимости проекции <img alt=\"vx  \" class=\"math\" src=\"index-5bb73141b6fc08772dd7eeffda72abe8.svg\"/> скорости тела от времени\n<img alt=\"t  \" class=\"math\" src=\"index-144e7b535e2daba2e17dd39267bf5c5a.svg\"/>.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-2-pict30i.png\" width=\"263\"/></p></div>\n<p class=\"indent\">   Определите путь, пройденный телом в интервале времени от 7 до 10 с. Ответ дайте в м.\n</p>", "solution_html": "<p class=\"noindent\">Путь равен площади под графиком в координатах <img alt=\"t− v  \" class=\"math\" src=\"index-f6818d08a553c825fb74747ace2ccbe0.svg\"/>. В данном случае путь можно разделить на 2 отрезка. От 7 до 8 с в\nположительном направлении (треугольник) и от 8 до 10 с в положительном направлении (треугольник).\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-2-pict30-sol.png\" width=\"263\"/></p></div>\n<p class=\"indent\">   Найдем пути по отдельности\n</p> <div class=\"math-display\">\n<img alt=\"S7−8 = 1⋅5 м/с ⋅1 с= 2,5 м\n       2\n\" class=\"math-display\" src=\"index-77c341f9e0bb3e71ec65dadbb5bc8619.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"       1\nS8−10 = 2 ⋅10 м/с⋅2 с= 10 м\n\" class=\"math-display\" src=\"index-07b1ec796de6acef7ba3ce04bb03c502.svg\"/></div>\n<p class=\"indent\">   То есть в сумме\n</p> <div class=\"math-display\">\n<img alt=\"S7−10 = S7−8+ S8−10 = 2,5 м+ 10 м= 12,5 м\n\" class=\"math-display\" src=\"index-78c44e6ab9ae3d38e68b3ef1baa5850c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-65c72f1ec8bbd6c5bc22ff0b5ba189d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118213/index-65c72f1ec8bbd6c5bc22ff0b5ba189d2.svg", "index-5bb73141b6fc08772dd7eeffda72abe8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118213/index-5bb73141b6fc08772dd7eeffda72abe8.svg", "index-144e7b535e2daba2e17dd39267bf5c5a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118213/index-144e7b535e2daba2e17dd39267bf5c5a.svg", "f-1-2-pict30i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118213/f-1-2-pict30i.png", "index-f6818d08a553c825fb74747ace2ccbe0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118214/index-f6818d08a553c825fb74747ace2ccbe0.svg", "f-1-2-pict30-sol.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118214/f-1-2-pict30-sol.png", "index-77c341f9e0bb3e71ec65dadbb5bc8619.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118214/index-77c341f9e0bb3e71ec65dadbb5bc8619.svg", "index-07b1ec796de6acef7ba3ce04bb03c502.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118214/index-07b1ec796de6acef7ba3ce04bb03c502.svg", "index-78c44e6ab9ae3d38e68b3ef1baa5850c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118214/index-78c44e6ab9ae3d38e68b3ef1baa5850c.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Равноускоренное движение"], "sources": [], "created_at": "2023-07-10T07:55:04Z", "updated_at": "2026-07-02T12:41:33Z"}, {"id": 159660, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Тело движется вдоль оси <img alt=\"Ox  \" class=\"math\" src=\"index-16125c51fa0654f867105b031e555d2c.svg\"/>. По графику зависимости проекции <img alt=\"vx  \" class=\"math\" src=\"index-a23809d05647aaabf721138e4270eec2.svg\"/> скорости тела от времени <img alt=\"t  \" class=\"math\" src=\"index-a9beadf5ac136c3936619886274fdca4.svg\"/> установите модуль перемещения\nтела за время от <img alt=\"t1 = 0  \" class=\"math\" src=\"index-0744eb4c9ce974a52c35e37ff129c85c.svg\"/> до <img alt=\"t2 = 6 с.  \" class=\"math\" src=\"index-551c889fe1daafaff0917bd5b024ee26.svg\"/> Ответ дайте в м.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"159660 1.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">В координатах, данных в задаче, при смене знака проекции скорости, модуль перемещения на интересующем нас промежутке будет\nвычисляться как модуль разности площадей между графиком и осью <img alt=\"t  \" class=\"math\" src=\"index-06b96fdb729e20b89ed758f577897b5d.svg\"/>: </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"159660 2.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"            1        1\nS =S1 − S2 = 2 ⋅4 ⋅10 − 2 ⋅2⋅5= 15 м\n\" class=\"math-display\" src=\"index-7e3e5d1ee6915958fa0c4f126100d82b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-16125c51fa0654f867105b031e555d2c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/index-16125c51fa0654f867105b031e555d2c.svg", "index-a23809d05647aaabf721138e4270eec2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/index-a23809d05647aaabf721138e4270eec2.svg", "index-a9beadf5ac136c3936619886274fdca4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/index-a9beadf5ac136c3936619886274fdca4.svg", "index-0744eb4c9ce974a52c35e37ff129c85c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/index-0744eb4c9ce974a52c35e37ff129c85c.svg", "index-551c889fe1daafaff0917bd5b024ee26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/index-551c889fe1daafaff0917bd5b024ee26.svg", "159660 1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340655/159660 1.png", "index-06b96fdb729e20b89ed758f577897b5d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340656/index-06b96fdb729e20b89ed758f577897b5d.svg", "159660 2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340656/159660 2.png", "index-7e3e5d1ee6915958fa0c4f126100d82b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340656/index-7e3e5d1ee6915958fa0c4f126100d82b.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": ["Отличный результат"], "created_at": "2025-12-24T18:33:02Z", "updated_at": "2026-07-02T12:36:02Z"}, {"id": 159661, "name": " Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости скорости <img alt=\"v  \" class=\"math\" src=\"index-8394f6426ad3cf737175104c7f2948e9.svg\"/> тела от времени <img alt=\"t  \" class=\"math\" src=\"index-c2111274bdef3271076c903793158c0a.svg\"/>. Определите среднюю скорость тела в интервале\nвремени от 10 до 50 с. Ответ дайте в м/с. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"159661.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">В координатах, данных в задаче, путь на интересующем промежутке находится как площадь между графиком и осью <img alt=\"t  \" class=\"math\" src=\"index-4ea3a25ccd6a24b39a4976449d197780.svg\"/>, то есть\nплощадь трапеции:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"L = 1 ⋅(20+ 40)⋅10= 300 м\n    2\n\" class=\"math-display\" src=\"index-9155eb5dec93a2b8e0c6a0701626f11d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"v  = L-= 300 м-= 7,5 м/c\n ср   t   40 с\n\" class=\"math-display\" src=\"index-b8bc13c66744f83d9022256d99f0f39e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8394f6426ad3cf737175104c7f2948e9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340658/index-8394f6426ad3cf737175104c7f2948e9.svg", "index-c2111274bdef3271076c903793158c0a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340658/index-c2111274bdef3271076c903793158c0a.svg", "159661.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340658/159661.png", "index-4ea3a25ccd6a24b39a4976449d197780.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340659/index-4ea3a25ccd6a24b39a4976449d197780.svg", "index-9155eb5dec93a2b8e0c6a0701626f11d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340659/index-9155eb5dec93a2b8e0c6a0701626f11d.svg", "index-b8bc13c66744f83d9022256d99f0f39e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/340659/index-b8bc13c66744f83d9022256d99f0f39e.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": ["Отличный результат"], "created_at": "2025-12-24T18:50:21Z", "updated_at": "2026-07-02T12:35:40Z"}, {"id": 117359, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Тело движется вдоль оси Ox. На рисунке приведен график зависимости проекции <img alt=\"Vx  \" class=\"math\" src=\"index-86c2effda8f960e78e50894d5057cae2.svg\"/> скорости тела от времени t.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"117359.1.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Определите путь, пройденный телом в интервале времени от 0 до 40 с. Ответ дайте в м.\n</p>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"117359_1.1.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Пройденный путь на графике зависимости V(t) ищется как площадь под графиком. Фигуру под графиком в интервале от 0 до 40 с\nможно разбить на прямоугольный треугольник (<img alt=\"S1  \" class=\"math\" src=\"index-76272b28a755efb961feb15c82d3d148.svg\"/>) и трапецию (<img alt=\"S2  \" class=\"math\" src=\"index-11c2d079d70b79449ab1d98d623e1689.svg\"/>):\n</p> <div class=\"math-display\">\n<img alt=\"S1 = 10⋅15= 75 м\n       2\n\" class=\"math-display\" src=\"index-dadf3a9535266574bf8cb59abba58d73.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"S2 = 10+-5⋅25= 187,5 м\n       2\n\" class=\"math-display\" src=\"index-7068b74c41f0b25734f50c53d7fda652.svg\"/></div>\n<p class=\"indent\">   Тогда путь, пройденный телом в интервале времени от 0 до 40 с, равен\n</p> <div class=\"math-display\">\n<img alt=\"S = S1+ S2 =75 +187,5= 262,5 м\n\" class=\"math-display\" src=\"index-b289835805ff5a9070b7090b9001ef26.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-86c2effda8f960e78e50894d5057cae2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241057/index-86c2effda8f960e78e50894d5057cae2.svg", "117359.1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241057/117359.1.png", "117359_1.1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/117359_1.1.png", "index-76272b28a755efb961feb15c82d3d148.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/index-76272b28a755efb961feb15c82d3d148.svg", "index-11c2d079d70b79449ab1d98d623e1689.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/index-11c2d079d70b79449ab1d98d623e1689.svg", "index-dadf3a9535266574bf8cb59abba58d73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/index-dadf3a9535266574bf8cb59abba58d73.svg", "index-7068b74c41f0b25734f50c53d7fda652.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/index-7068b74c41f0b25734f50c53d7fda652.svg", "index-b289835805ff5a9070b7090b9001ef26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241058/index-b289835805ff5a9070b7090b9001ef26.svg"}, "tags": [], "sources": [], "created_at": "2025-04-13T06:17:10Z", "updated_at": "2026-04-01T20:37:01Z"}, {"id": 16642, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости модуля скорости <img alt=\"υ  \" class=\"math\" src=\"index-645bc311d5d07e205ff8a899e1ec21c0.svg\"/> автомобиля марки &#34;Жигули&#34;от времени <img alt=\"t  \" class=\"math\" src=\"index-0260f2981b07830ce57fe78c9519c85c.svg\"/> . Определите по\nграфику путь, пройденный &#34;Жигули&#34;за первые 7 секунд.Ответ дайте в м.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16642.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Путь можно найти двумя способами:\n</p><p class=\"indent\">   1 способ:<br/></p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16642R.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Путь — величина строго положительная, это длина пройденного телом участка траектории. Под перемещением же тела понимается\nизменение его координаты, перемещение может быть отрицательным. Путь можно найти как площадь под графиком зависимости\nскорости от времени без учета знаков, а перемещение с их учетом. В данном случае необходимо найти площадь\nтрапеции.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"S = 2+-7⋅40= 180 м\n     2\n\" class=\"math-display\" src=\"index-376a10ef4fcaab2c6e26c23ad78b1bf9.svg\"/></div>\n<p class=\"indent\">   2 способ:<br/>Рассмотрим два участка движения: от 0 до 5 с, от 5 с до 7 с: <br/><img alt=\"υ0 = 0  \" class=\"math\" src=\"index-78514d6372d92b22c0b2343deb798e70.svg\"/> м/с, <img alt=\"υ1 = 40  \" class=\"math\" src=\"index-fb99cb1e449eb9e5457023925d90e0db.svg\"/> м/с.\n</p> <div class=\"math-display\">\n<img alt=\"a= υ1−-υ0 = 40-−-0= 8 м/ с2\n     Δt       5\n\" class=\"math-display\" src=\"index-ca22ce86f574c8dff83ae5d35ab37818.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"S  = υt + at21= 0⋅5 + 8⋅52= 100 м\n 1    01   2          2\n\" class=\"math-display\" src=\"index-60951e76cd6c82cd21dcfa04692a41f1.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"S2 = υ1t2 = 40⋅2= 80 м\n\" class=\"math-display\" src=\"index-57ba7188e201f113b456481182d1b7a4.svg\"/></div>\n<p class=\"indent\">   Перемещение <img alt=\"S = S1+ S2 = 100+ 80= 180  \" class=\"math\" src=\"index-d5037b826fe3b1c141ac904e6a35612b.svg\"/> м\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-645bc311d5d07e205ff8a899e1ec21c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32977/index-645bc311d5d07e205ff8a899e1ec21c0.svg", "index-0260f2981b07830ce57fe78c9519c85c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32977/index-0260f2981b07830ce57fe78c9519c85c.svg", "16642.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32977/16642.png", "16642R.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/16642R.png", "index-376a10ef4fcaab2c6e26c23ad78b1bf9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-376a10ef4fcaab2c6e26c23ad78b1bf9.svg", "index-78514d6372d92b22c0b2343deb798e70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-78514d6372d92b22c0b2343deb798e70.svg", "index-fb99cb1e449eb9e5457023925d90e0db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-fb99cb1e449eb9e5457023925d90e0db.svg", "index-ca22ce86f574c8dff83ae5d35ab37818.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-ca22ce86f574c8dff83ae5d35ab37818.svg", "index-60951e76cd6c82cd21dcfa04692a41f1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-60951e76cd6c82cd21dcfa04692a41f1.svg", "index-57ba7188e201f113b456481182d1b7a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-57ba7188e201f113b456481182d1b7a4.svg", "index-d5037b826fe3b1c141ac904e6a35612b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32978/index-d5037b826fe3b1c141ac904e6a35612b.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": [], "created_at": "2022-01-02T09:39:51Z", "updated_at": "2026-07-02T12:49:31Z"}, {"id": 16652, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Мяч подброшен вертикально вверх. Через 2 с после броска его скорость стала равна 5 м/с. Какова начальная скорость броска мяча?\nСопротивлением воздуха пренебречь. Ответ дайте в м/с.\n</p>", "solution_html": "<p class=\"noindent\">По условию задачи, сопротивлением воздуха пренебрегаем, тогда на мяч действует только сила тяжести, она же и создает ускорение\nсвободного падения, направленное против движения тела. Тогда скорость в момент времени <img alt=\"t  \" class=\"math\" src=\"index-d1fabdc8e522a63adf70644a4b679bbb.svg\"/> определяется по\nформуле:\n</p> <div class=\"math-display\">\n<img alt=\"v(t)= v0− gt\n\" class=\"math-display\" src=\"index-cec6d2b08400912298e9dee3ea2447bd.svg\"/></div>\n<p class=\"indent\">   Выражаем отсюда начальную скорость <img alt=\"v0  \" class=\"math\" src=\"index-70320657e01f6c6929d15a75f24e6685.svg\"/>, которую нам и необходимо найти, подставляем значения из условия:\n</p> <div class=\"math-display\">\n<img alt=\"v0 = v(t)+ gt= 5+ 10⋅2 =25 м/с\n\" class=\"math-display\" src=\"index-ed0e7058e47e58d21d9318df23b2e99f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d1fabdc8e522a63adf70644a4b679bbb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32998/index-d1fabdc8e522a63adf70644a4b679bbb.svg", "index-cec6d2b08400912298e9dee3ea2447bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32998/index-cec6d2b08400912298e9dee3ea2447bd.svg", "index-70320657e01f6c6929d15a75f24e6685.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32998/index-70320657e01f6c6929d15a75f24e6685.svg", "index-ed0e7058e47e58d21d9318df23b2e99f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32998/index-ed0e7058e47e58d21d9318df23b2e99f.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение в поле тяжести (по вертикали)"], "sources": ["ФИПИ "], "created_at": "2022-01-02T09:49:46Z", "updated_at": "2026-01-18T22:20:53Z"}, {"id": 16653, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Человек съезжает с горки на мопеде, двигаясь прямолинейно и равноускоренно. За время спуска скорость человека увеличилась на\n<img alt=\"Δv = 40 м/с  \" class=\"math\" src=\"index-4d6745fb9d3679111dc7b4fdb8411a95.svg\"/>. Ускорение равно <img alt=\"    2\n2 м/с .  \" class=\"math\" src=\"index-d60664eb6db23e385dd82522594d1c92.svg\"/> Сколько времени длился спуск? Ответ дайте в с.\n</p>", "solution_html": "<p class=\"noindent\">Ускорение мопеда по определению ,0)). Возьмем точку (2,2) для определения ускорения\n</p> <div class=\"math-display\">\n<img alt=\"ax = 2x = 2⋅2-м = 1 м/с2\n     t2    4 с2\n\" class=\"math-display\" src=\"index-98abcf6f0ad1980e9afa8b85ee632041.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7c871984eaaa8779b82e28e1a0613b6c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433385/index-7c871984eaaa8779b82e28e1a0613b6c.svg", "index-be9c2145db824032e00c8afb7b311894.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433385/index-be9c2145db824032e00c8afb7b311894.svg", "index-dccdbe88ac2db54191e30cdca35d545a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433385/index-dccdbe88ac2db54191e30cdca35d545a.svg", "f-ege-1-2-3.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433385/f-ege-1-2-3.png", "index-b130ee828a50d79c3fb7dd90642ab042.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433386/index-b130ee828a50d79c3fb7dd90642ab042.svg", "index-fee3b336c4db6ce4d35345a866dbd846.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433386/index-fee3b336c4db6ce4d35345a866dbd846.svg", "index-7c837b8b0f3a3794380ceab73db5381f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433386/index-7c837b8b0f3a3794380ceab73db5381f.svg", "index-98abcf6f0ad1980e9afa8b85ee632041.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433386/index-98abcf6f0ad1980e9afa8b85ee632041.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Демоверсия", "Равноускоренное движение"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T01:19:56Z", "updated_at": "2026-08-17T01:24:24Z"}, {"id": 16650, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Мотылёк движется в пространстве. На рисунке показаны графики зависимости от времени <img alt=\"t  \" class=\"math\" src=\"index-204b34cd5bfb675d8d23797f8531c53d.svg\"/> проекций <img alt=\"Vx  \" class=\"math\" src=\"index-e31aaebf22bc1ad6f1d2ca18fa04f823.svg\"/>, <img alt=\"Vy  \" class=\"math\" src=\"index-768c4e432b345869cf5cba94d2b7b63f.svg\"/> и <img alt=\"Vz  \" class=\"math\" src=\"index-9c432bec8274a6ff492f19380ee80561.svg\"/> скорости <img alt=\"      ⃗v  \" class=\"math\" src=\"index-7e6ad75350acc913d87dffaf66a8533c.svg\"/>\nмотылька на оси <img alt=\"Ox  \" class=\"math\" src=\"index-aa89ccf41f3cc3917c20457d93a4ea43.svg\"/>, <img alt=\"Oy  \" class=\"math\" src=\"index-54247c0f9d04976d0362262dc508253a.svg\"/> и <img alt=\"Oz  \" class=\"math\" src=\"index-2003c9951137f1eceb681bf7cb06d43d.svg\"/> от времени <img alt=\"t  \" class=\"math\" src=\"index-d55b96f3edcac36dada72e2f54b8f8bb.svg\"/>. Чему равен модуль скорости мотылька в момент времени <img alt=\"t= 3  \" class=\"math\" src=\"index-5eaeeb9dafe44859db267c4280672608.svg\"/> c? Ответ дайте в\nм/с.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"16650_1.png\" width=\"526\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Вектор скорости мотылька находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"v⃗(t) = ⃗Vx(t)+ ⃗Vy(t)+ ⃗Vz(t)\n\" class=\"math-display\" src=\"index-aaaaa244f1f594e91a74e06b08b5336c.svg\"/></div>\n<p class=\"indent\">   В момент времени <img alt=\"t =3  \" class=\"math\" src=\"index-1d85c48aa935fdbfbd8b4bb45faf1a1a.svg\"/> с <img alt=\"Vx = 3  \" class=\"math\" src=\"index-10e38cd976f4cfa6cdfda3ce56e60039.svg\"/> м/с, <img alt=\"Vy =0  \" class=\"math\" src=\"index-8e840da86ec5b07242a3254055768c2d.svg\"/> м/с, a <img alt=\"Vz = 4  \" class=\"math\" src=\"index-48b91aee96715f4b9493d5cc1fbf0556.svg\"/> м/с. Так как проекция скорости на ось <img alt=\"OY  \" class=\"math\" src=\"index-26dc69957671d131727245d005a4136c.svg\"/> равна 0,\nто:\n</p> <div class=\"math-display\">\n<img alt=\"v⃗(t)= ⃗Vx(t)+ ⃗Vz(t)\n\" class=\"math-display\" src=\"index-cda917548fbeee3a81c90e539dbf587c.svg\"/></div> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16650_2.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Так как оси перпендикулярны друг другу, то получаем прямоугольный треугольник. По теореме Пифагора:\n</p> <div class=\"math-display\">\n<img alt=\"v2(t)= V2x(t)+ V2z (t)\n\" class=\"math-display\" src=\"index-009f46247ab0da8bc54fa018af42aef5.svg\"/></div>\n<p class=\"indent\">   Отсюда выражаем <img alt=\"v2(t)  \" class=\"math\" src=\"index-61761d03b0ba703e9c599db0961c8807.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"     ∘ -----------  ∘ ------\nv(t)=   V2x(t) +Vz2(t)=   32+42 = 5 м/с\n\" class=\"math-display\" src=\"index-b17033d55fab87c515680edf19b513e2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-204b34cd5bfb675d8d23797f8531c53d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-204b34cd5bfb675d8d23797f8531c53d.svg", "index-e31aaebf22bc1ad6f1d2ca18fa04f823.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-e31aaebf22bc1ad6f1d2ca18fa04f823.svg", "index-768c4e432b345869cf5cba94d2b7b63f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-768c4e432b345869cf5cba94d2b7b63f.svg", "index-9c432bec8274a6ff492f19380ee80561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-9c432bec8274a6ff492f19380ee80561.svg", "index-7e6ad75350acc913d87dffaf66a8533c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-7e6ad75350acc913d87dffaf66a8533c.svg", "index-aa89ccf41f3cc3917c20457d93a4ea43.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-aa89ccf41f3cc3917c20457d93a4ea43.svg", "index-54247c0f9d04976d0362262dc508253a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-54247c0f9d04976d0362262dc508253a.svg", "index-2003c9951137f1eceb681bf7cb06d43d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-2003c9951137f1eceb681bf7cb06d43d.svg", "index-d55b96f3edcac36dada72e2f54b8f8bb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-d55b96f3edcac36dada72e2f54b8f8bb.svg", "index-5eaeeb9dafe44859db267c4280672608.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/index-5eaeeb9dafe44859db267c4280672608.svg", "16650_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32993/16650_1.png", "index-aaaaa244f1f594e91a74e06b08b5336c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-aaaaa244f1f594e91a74e06b08b5336c.svg", "index-1d85c48aa935fdbfbd8b4bb45faf1a1a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-1d85c48aa935fdbfbd8b4bb45faf1a1a.svg", "index-10e38cd976f4cfa6cdfda3ce56e60039.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-10e38cd976f4cfa6cdfda3ce56e60039.svg", "index-8e840da86ec5b07242a3254055768c2d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-8e840da86ec5b07242a3254055768c2d.svg", "index-48b91aee96715f4b9493d5cc1fbf0556.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-48b91aee96715f4b9493d5cc1fbf0556.svg", "index-26dc69957671d131727245d005a4136c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-26dc69957671d131727245d005a4136c.svg", "index-cda917548fbeee3a81c90e539dbf587c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-cda917548fbeee3a81c90e539dbf587c.svg", "16650_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/16650_2.png", "index-009f46247ab0da8bc54fa018af42aef5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-009f46247ab0da8bc54fa018af42aef5.svg", "index-61761d03b0ba703e9c599db0961c8807.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-61761d03b0ba703e9c599db0961c8807.svg", "index-b17033d55fab87c515680edf19b513e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32994/index-b17033d55fab87c515680edf19b513e2.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Равноускоренное движение"], "sources": ["ФИПИ"], "created_at": "2022-01-02T09:48:23Z", "updated_at": "2026-04-17T20:11:20Z"}, {"id": 16651, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Два точечных тела 1 и 2 движутся вдоль оси <img alt=\"Ox  \" class=\"math\" src=\"index-17a0a97f74c21bac963559e2c5cd0b43.svg\"/>. Зависимости координат <img alt=\"x  \" class=\"math\" src=\"index-75d55ab2f2f8d7da9908ac20214bec5c.svg\"/> этих тел от времени <img alt=\"t  \" class=\"math\" src=\"index-773e541221b8897a83331911e55abae0.svg\"/> изображены на рисунке. В\nкакой момент времени проекции скоростей этих тел будут приблизительно одинаковыми? Округлите до целых. Ответ дайте в\nс.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16651.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">1 способ:\n</p><p class=\"indent\">   Скорость — это производная по времени от координаты <img alt=\"x(t)  \" class=\"math\" src=\"index-43186c92d1476e4157b54677d2cdb96e.svg\"/>. Геометрический смысл производной — тангенс угла наклона\nкасательной, следовательно, чтобы проекции скоростей этих тел были приблизительно одинаковыми, ко второму графику\nнадо провести касательную, параллельную первой прямой. Эта касательная примерно пройдет через точку <img alt=\"t≈ 3  \" class=\"math\" src=\"index-1492ad092281fec3db3e9ac7ffbb9e8c.svg\"/>\nс.\n</p><p class=\"indent\">   2 способ: <br/>Напишем уравнения движения данных тел. Изменение координаты первого тела линейное, следовательно первое тело движется\nравномерно:\n</p> <div class=\"math-display\">\n<img alt=\"x1 = x01+ v1xt       (1)\n\" class=\"math-display\" src=\"index-6dc6cd3f5182ff3d82ec9569be42e7bf.svg\"/></div>\n<p class=\"indent\">   Так как зависимость координаты второго тела квадратичная, графиком её является парабола, то второе тело движется\nравноускоренно:\n</p> <div class=\"math-display\">\n<img alt=\"                  2           2\nx2 = x02+ v02xt+ axt-= v02xt+ axt-        (2)\n                 2           2\n\" class=\"math-display\" src=\"index-cb7f6ce0295e258593b6ea8a32c541d8.svg\"/></div>\n<p class=\"indent\">   Так как первое тело движется равномерно, его скорость остается неизменной. Выразим скорость из уравнения\n(1):\n</p> <div class=\"math-display\">\n<img alt=\"     x1 − x01  4− 3\nv1x =---t--- = -1--= 1 м/с\n\" class=\"math-display\" src=\"index-8a692133346324b2090b13f1884891bf.svg\"/></div>\n<p class=\"indent\">   По условию задачи:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"v2x = v1x = 1 м/с\n\" class=\"math-display\" src=\"index-742f1a66fdfefc599dc1904eaa2f9b0f.svg\"/></div>\n<p class=\"indent\">   Запишем уравнение (2) другим способом. Зависимость координат второго тела — парабола с вершиной при <img alt=\"x0 = 7  \" class=\"math\" src=\"index-1d80f71fccf60414ce38e9066d3b6f3d.svg\"/> и <img alt=\"t0 = 4  \" class=\"math\" src=\"index-10427b2a258056b860633bfea8f8d3be.svg\"/> с\nкорнями (т.е. точками пересечений с осью <img alt=\"Ot  \" class=\"math\" src=\"index-c66789df18673c460deb03ca33338037.svg\"/>) <img alt=\"x21 =0  \" class=\"math\" src=\"index-7407fd398247be6cbe7da00bb1cdcbd7.svg\"/> и <img alt=\"x22 =8  \" class=\"math\" src=\"index-81a964d6bab57a6554c2431bd9dc3ba0.svg\"/>. Тогда получим:\n</p> <div class=\"math-display\">\n<img alt=\"x2 = ax(t− x21)(t− x22)= ax(t− 0)(t− 8)= axt(t− 8)     (3)\n\" class=\"math-display\" src=\"index-5db259e6e8d4d748501a4d6ced66b3b0.svg\"/></div>\n<p class=\"indent\">   Выразим из уравнения (3) <img alt=\"ax  \" class=\"math\" src=\"index-b7638a8a01a9c621c0c82173402b3e46.svg\"/> и подставим координаты вершины параболы:\n</p> <div class=\"math-display\">\n<img alt=\"ax = --x0----= --7----= −-7 м/с2\n     t0(t0− 8)  4(4 − 8)   16\n\" class=\"math-display\" src=\"index-a42d24204b9359da8837f19fa6393f60.svg\"/></div>\n<p class=\"indent\">   Тогда уравнение (3) преобразуется в:\n</p> <div class=\"math-display\">\n<img alt=\"      7-        7   7- 2\nx2 = − 16t(t− 8)= 2t− 16t        (4)\n\" class=\"math-display\" src=\"index-0673f266dc0ea85f7476410cef63b083.svg\"/></div>\n<p class=\"indent\">   Заметим, что скорость — производная пути. Найдем производную пути из уравнения (4). Получим:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"     7  7\nv2x = 2 − 8t\n\" class=\"math-display\" src=\"index-bf8ae8b41fa79901eea3165873f283e8.svg\"/></div>\n<p class=\"indent\">   Выразим отсюда время <img alt=\"t  \" class=\"math\" src=\"index-d508a81f98afe3558bb55f60482d1c58.svg\"/>, которое и необходимо нам найти по условию задачи:\n</p> <div class=\"math-display\">\n<img alt=\"   8(1 − 7)\nt= --−7-2-≈ 3 c\n\" class=\"math-display\" src=\"index-5e1a1bf5a5f082f3ba318062ab86a768.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-17a0a97f74c21bac963559e2c5cd0b43.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32995/index-17a0a97f74c21bac963559e2c5cd0b43.svg", "index-75d55ab2f2f8d7da9908ac20214bec5c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32995/index-75d55ab2f2f8d7da9908ac20214bec5c.svg", "index-773e541221b8897a83331911e55abae0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32995 splay\" src=\"index-f8a6fddfa42202f869c5a28d044c1826.svg\"/></div>\n<p class=\"indent\">   отсюда <img alt=\"v0 = at\n     3  \" class=\"math\" src=\"index-6c92d99829bdf2c33e48373dbf29723b.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"          2\nS =v0t+ at-\n         2\n\" class=\"math-display\" src=\"index-6a6064e6061adba680aeee260efbdbf4.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    at2  at2  5at2\nS = --+ ---= ----\n    3    2    6\n\" class=\"math-display\" src=\"index-f6a35550462ea4fe7bf5c78f2a0c8a42.svg\"/></div>\n<p class=\"indent\">   отсюда <img alt=\"a = 6S-\n    5t2  \" class=\"math\" src=\"index-817f7fe4246116763b108a613f0ffe52.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"a= -6⋅102 = 12 м/с2\n   5⋅(1)\n\" class=\"math-display\" src=\"index-f7c45b0e1a0ad5f3b67691cc5f78b15d.svg\"/></div>\n<p class=\"indent\">   Ответ: 12 м<img alt=\"∕c2  \" class=\"math\" src=\"index-afee10e33462e06c654f16091a99b8b7.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-83dfc1cf817f0d9c871703920bfdf468.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179507/index-83dfc1cf817f0d9c871703920bfdf468.svg", "index-1c196307ef852bdc321f97f96556587c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179508/index-1c196307ef852bdc321f97f96556587c.svg", "index-baa880aaf9f7c8ca6505506af71f936e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179508/index-baa880aaf9f7c8ca6505506af71f936e.svg", "index-c08620e818068f171c7caedc5f01090c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179508/index-c08620e818068f171c7caedc5f01090c.svg", "index-c24bb0602cacf29ae42a6a61bd9f8172.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179508/index-c24bb0602cacf29ae42a6a61bd9f8172.svg", "index-f8a6fddfa42202f869c5a28d044c1826.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179508/index-f8a6fddfa42202f869c5a28d044c1826.s сти и ускорения получим:\n</p> <div class=\"math-display\">\n<img alt=\"0= v0− at\n\" class=\"math-display\" src=\"index-babd712f56a261733cde809bc6b76d2e.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"v0 = at= 0,5 ⋅30 =15 м/с\n\" class=\"math-display\" src=\"index-ed6a2cc52bd1baf7b493ae04e16a0bc6.svg\"/></div>\n<p class=\"indent\">   Ответ: 15 м/c\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9bcca05aed310210c7b0e0939a970443.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179510/index-9bcca05aed310210c7b0e0939a970443.svg", "index-33b7fa6d102730ac3139c8bf9c66ea1b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179509/index-33b7fa6d102730ac3139c8bf9c66ea1b.svg", "index-41f64c8ec6a3ccdb3cca8543391fda80.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179509/index-41f64c8ec6a3ccdb3cca8543391fda80.svg", "index-babd712f56a261733cde809bc6b76d2e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179509/index-babd712f56a261733cde809bc6b76d2e.svg", "index-ed6a2cc52bd1baf7b493ae04e16a0bc6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/179509/index-ed6a2cc52bd1baf7b493ae04e16a0bc6.svg"}, "tags": ["Кинематика", "Равноускоренное движение"], "sources": [], "created_at": "2024-06-20T16:16:01Z", "updated_at": "2026-09-15T18:47:27Z"}, {"id": 102316, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">Автомобиль начинает разгоняться по прямолинейной дороге из состояния покоя с ускорением <img alt=\"      2\n0,5 м/с  \" class=\"math\" src=\"index-724e1aef98ae9ca354ca31381e3749ab.svg\"/>. Какой будет скорость\nавтомобиля через 20 с? Ответ дайте в м/с.\n</p>", "solution_html": "<p class=\"noindent\">Запишем формулу ускорения, с учетом того, что изначальная скорость автомобиля равна 0, т.к. он покоился.\n</p> <div class=\"math-display\">\n<img alt=\"     vx− v0x\nax = ---t---\n\" class=\"math-display\" src=\"index-ec7307c5fbd209a89d3cc41f77ced059.svg\"/></div>\n<p class=\"indent\">   Выразим скорость тела:\n</p> <div class=\"math-display\">\n<img alt=\"vx = axt\n\" class=\"math-display\" src=\"index-bf1a265c159f46c896125dbf25406eee.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"vx =0,5⋅20= 10 м/с\n\" class=\"math-display\" src=\"index-34e3b6967ede9403a1bd413269749500.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-724e1aef98ae9ca354ca31381e3749ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210684/index-724e1aef98ae9ca354ca31381e3749ab.svg", "index-ec7307c5fbd209a89d3cc41f77ced059.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210685/index-ec7307c5fbd209a89d3cc41f77ced059.svg", "index-bf1a265c159f46c896125dbf25406eee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210685/index-bf1a265c159f46c896125dbf25406eee.svg", "index-34e3b6967ede9403a1bd413269749500.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210685/index-34e3b6967ede9403a1bd413269749500.svg"}, "tags": ["Кинематика", "Уровень ЕГЭ", "Равноускоренное движение"], "sources": ["Школково. Тренировочные задания"], "created_at": "2024-12-19T13:24:04Z", "updated_at": "2026-01-18T13:40:48Z"}, {"id": 139558, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика -> Равноускоренное движение", "question_html": "<p class=\"noindent\">На рисунке показан график зависимости проекции <img alt=\"vx  \" class=\"math\" src=\"index-ee8f277578a82ff8f590afb0e22de487.svg\"/> скорости тела от времени <img alt=\"t  \" class=\"math\" src=\"index-c524cb034a98b84e7896e65a50ceb884.svg\"/>. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-1-2-10.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">1) Какова проекция <img alt=\"ax  \" class=\"math\" src=\"index-42f2985ea7275ab57d9f077ece714227.svg\"/> ускорения этого тела в интервале времени от 3 до 4 c?<br/>2) Какова проекция <img alt=\"Sx  \" class=\"math\" src=\"index-76263ede5b4d04c027ac6a38065f0397.svg\"/> перемещения тела в интервале времени от 4 до 6 с?<br/>3) Определите среднюю скорость движения тела в интервале времени от 0 до 2 с<br/>В ответ запишите три числа через запятую без пробелов\n</p>", "solution_html": "<p class=\"noindent\">1) Найдем проекцию ускорения тела по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    Δv    −4− 12         2\nax =-Δt = -4−-3--=− 16 м/с\n\" class=\"math-display\" src=\"index-c13bf45fc4fd36266a77d5afc075c537.svg\"/></div>\n<p class=\"indent\">   2) Проекцию перемещения на графике зависимости скорости от времени можно найти через площадь под графиком, причем если\nграфик ниже горизонтальной оси, то проекция перемещения считается отрицательной:\n</p> <div class=\"math-display\">\n<img alt=\"      (        )\nSx = −  4+-12⋅2  = −16 м\n          2\n\" class=\"math-display\" src=\"index-b596ecf530e0945e883378b5b57b8f14.svg\"/></div>\n<p class=\"indent\">   3) Средняя скорость определяется как пройденный путь на затраченное время. Путь определим, как во втором пункте,\nтогда:\n</p> <div class=\"math-display\">\n<img alt=\"             1(8⋅1+ 12⋅1)\nvср =-L0−2 = 2-----------= 5 м/с\n     Δt0−2        2\n\" class=\"math-display\" src=\"index-daab71cd034881a2b3632536cd90eb06.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ee8f277578a82ff8f590afb0e22de487.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292623/index-ee8f277578a82ff8f590afb0e22de487.svg", "index-c524cb034a98b84e7896e65a50ceb884.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292623/index-c524cb034a98b84e7896e65a50ceb884.svg", "f-ege-1-2-10.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292623/f-ege-1-2-10.png", "index-42f2985ea7275ab57d9f077ece714227.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292623/index-42f2985ea7275ab57d9f077ece714227.svg", "index-76263ede5b4d04c027ac6a38065f0397.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292623/index-76263ede5b4d04c027ac6a38065f0397.svg", "index-c13bf45fc4fd36266a77d5afc075c537.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292624/index-c13bf45fc4fd36266a77d5afc075c537.svg", "index-b596ecf530e0945e883378b5b57b8f14.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292624/index-b596ecf530e0945e883378b5b57b8f14.svg", "index-daab71cd034881a2b3632536cd90eb06.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292624/index-daab71cd034881a2b3632536cd90eb06.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ"], "sources": ["ФИПИ"], "created_at": "2025-09-03T18:19:43Z", "updated_at": "2026-09-22T08:45:27Z"}]};
const ALL_MODE = false;

const searchTypeEl = document.getElementById('searchType');
const searchInput  = document.getElementById('searchInput');
const searchBtn    = document.getElementById('searchBtn');
const resetBtn     = document.getElementById('resetBtn');
const countEl      = document.getElementById('count');
const noResults    = document.getElementById('noResults');
const noResMsg     = document.getElementById('noResultsMsg');
const listEl       = document.getElementById('list');
const initMsg      = document.getElementById('initialMessage');

const PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const MAX_CONCURRENT = 6;
let activeLoads = 0;
const loadQueue = [];

function pumpQueue() {
  while (activeLoads < MAX_CONCURRENT && loadQueue.length > 0) {
    const img = loadQueue.shift();
    if (!img.isConnected || !img.hasAttribute('data-src')) continue;
    activeLoads++;
    startLoad(img);
  }
}

function startLoad(img) {
  const url = img.getAttribute('data-src');
  const attempt = Number(img.getAttribute('data-attempt') || 0);
  img.onload = function () {
    img.removeAttribute('data-src');
    activeLoads--;
    pumpQueue();
  };
  img.onerror = function () {
    activeLoads--;
    if (attempt < 3) {
      img.setAttribute('data-attempt', String(attempt + 1));
      setTimeout(function () {
        loadQueue.unshift(img);
        pumpQueue();
      }, 400 * (attempt + 1));
    } else {
      img.removeAttribute('data-src');
    }
    pumpQueue();
  };
  img.src = url;
}

const lazyObserver = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (entry.isIntersecting) {
      lazyObserver.unobserve(entry.target);
      loadQueue.push(entry.target);
      pumpQueue();
    }
  });
}, { rootMargin: '400px 0px' });

function observeImages(root) {
  root.querySelectorAll('img[data-src]').forEach(function (img) {
    lazyObserver.observe(img);
  });
}

tasksData.questions.forEach((task, idx) => {
  task._seq = String(idx + 1);
  task._id = String(task.id);
  task._ege = String(task.ege || '');
  
  let searchText = '';
  searchText += (task.name || '') + ' ';
  searchText += (task.theme_path || '') + ' ';
  searchText += (task.tags || []).join(' ') + ' ';
  searchText += (task.sources || []).join(' ') + ' ';
  
  const parser = new DOMParser();
  const extractText = (html) => {
    if (!html) return '';
    const doc = parser.parseFromString(html, 'text/html');
    return doc.body.textContent || '';
  };
  
  searchText += extractText(task.question_html) + ' ';
  searchText += extractText(task.solution_html) + ' ';
  searchText += extractText(task.answer_html) + ' ';
  searchText += extractText(task.grade_criteria_html) + ' ';
  
  task._search = searchText.toLowerCase().replace(/\s+/g, ' ');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function rewriteImages(html, images) {
  if (!html) return '';
  const imgMap = {};
  for (const [fname, url] of Object.entries(images || {})) {
    imgMap[fname] = url;
  }
  return html.replace(/src=(["'])([^"']+)\1/g, function (match, quote, src) {
    const fname = src.split('/').pop();
    const url = imgMap[fname] || (src.startsWith('http') ? src : '');
    if (!url) return match;
    return 'src=' + quote + PLACEHOLDER + quote +
           ' data-src=' + quote + url + quote +
           ' referrerpolicy="no-referrer" loading="lazy"';
  });
}

function renderTask(task) {
  const tid = task.id;
  const name = escapeHtml(task.name || 'Без названия');
  const themePath = escapeHtml(task.theme_path || '');

  const tags = task.tags || [];
  const tagChips = tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
  
  const sources = task.sources || [];
  const srcChips = sources.map(s => `<span class="chip chip-src">${escapeHtml(s)}</span>`).join('');

  const qHtml = rewriteImages(task.question_html || '', task.images);
  const sHtml = rewriteImages(task.solution_html || '', task.images);
  const aHtml = rewriteImages(task.answer_html || '', task.images);
  const cHtml = rewriteImages(task.grade_criteria_html || '', task.images);

  function section(title, content, opened = false) {
    if (!content.trim()) return '';
    const openAttr = opened ? ' open' : '';
    return `
      <details class="section"${openAttr}>
        <summary>${title}</summary>
        <div class="tex-content">${content}</div>
      </details>
    `;
  }

  const sections = 
    section('Условие', qHtml, true) +
    section('Решение', sHtml) +
    section('Ответ', aHtml) +
    section('Критерии оценивания', cHtml);

  const egeBadge = (ALL_MODE && task._ege) ? `<span class="badge badge-ege">ЕГЭ №${task._ege}</span>` : '';

  return `
    <div class="task-card" data-seq="${task._seq}" data-id="${tid}">
      <div class="task-head">
        ${egeBadge}
        <span class="badge badge-num">№${task._seq}</span>
        <span class="badge badge-id">ID ${tid}</span>
        <span class="task-name">${name}</span>
      </div>
      ${themePath ? `<div class="theme-path">${themePath}</div>` : ''}
      <div class="task-meta">
        ${tagChips ? `<div class="chips">${tagChips}</div>` : ''}
        ${srcChips ? `<div class="chips">${srcChips}</div>` : ''}
      </div>
      ${sections}
    </div>
  `;
}

function updatePlaceholder() {
  const t = searchTypeEl.value;
  if (t === 'number') {
    searchInput.placeholder = 'Номер задачи (№ или ID)';
  } else if (t === 'ege') {
    searchInput.placeholder = 'Номер задания ЕГЭ (1-26)';
  } else {
    searchInput.placeholder = 'Текст для поиска…';
  }
}

function doSearch() {
  const type  = searchTypeEl.value;
  const query = searchInput.value.trim();

  if (!query) {
    listEl.innerHTML = '';
    initMsg.style.display = 'block';
    noResults.style.display = 'none';
    countEl.textContent = '';
    return;
  }

  initMsg.style.display = 'none';

  const filtered = tasksData.questions.filter(task => {
    if (type === 'number') {
      return (task._seq === query) || (task._id === query) ||
             task._id.startsWith(query) || task._seq.startsWith(query);
    }
    if (type === 'ege') {
      return task._ege === query;
    }
    return task._search.includes(query.toLowerCase());
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResults.style.display = 'block';
    if (type === 'number') {
      noResMsg.textContent = `Задачи с номером «${query}» нет`;
    } else if (type === 'ege') {
      noResMsg.textContent = `Задачи ЕГЭ №${query} не найдены`;
    } else {
      noResMsg.textContent = `По запросу «${query}» ничего не найдено`;
    }
    countEl.textContent = `Показано 0 из ${tasksData.questions.length}`;
  } else {
    noResults.style.display = 'none';
    listEl.innerHTML = filtered.map(renderTask).join('');
    observeImages(listEl);
    countEl.textContent = `Показано ${filtered.length} из ${tasksData.questions.length}`;
  }
}

function doReset() {
  searchInput.value = '';
  listEl.innerHTML = '';
  initMsg.style.display = 'block';
  noResults.style.display = 'none';
  countEl.textContent = '';
  searchInput.focus();
}

searchTypeEl.addEventListener('change', updatePlaceholder);
searchBtn.addEventListener('click', doSearch);
resetBtn.addEventListener('click', doReset);

searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch();
  }
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = true);
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = false);
});

updatePlaceholder();
initMsg.style.display = 'block';
noResults.style.display = 'none';
</script>
</body>
</html>
