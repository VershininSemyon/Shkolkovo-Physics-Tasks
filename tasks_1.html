=\"index-02a19a1dd66c1bda994439d0e116708e.svg\"/> с до <img alt=\"t =7  \" class=\"math\" src=\"index-a2db32a03258a0d4ce9c09c5dfbcd0fb.svg\"/> с (скорость убывает от <img alt=\"v1 = 10  \" class=\"math\" src=\"index-3fe72c87a2c7dd7e8de6acec1ce07502.svg\"/> м/с до <img alt=\"v2 = 0  \" class=\"math\" src=\"index-4a23e068d286b04ae272757a0e7acb62.svg\"/>):\n</p> <div class=\"math-display\">\n<img alt=\"     1\nS1 = 2 ⋅(10− 0) ⋅(7− 3)= 20 м\n\" class=\"math-display\" src=\"index-286add9b669bbd3075ebd37a3920c5ee.svg\"/></div>\n<p class=\"indent\">   Найдем путь, пройденный телом на участке от <img alt=\"t= 7  \" class=\"math\" src=\"index-b23d138acc5a44e5f4242cc98b0576a9.svg\"/> с до <img alt=\"t= 9  \" class=\"math\" src=\"index-89cc73691e01903f52fc714c892357a1.svg\"/> с (скорость растет по модулю от <img alt=\"v2 = 0  \" class=\"math\" src=\"index-e8573bc56a5f96eacf6df77ef4016c83.svg\"/> до <img alt=\"v3 = −5  \" class=\"math\" src=\"index-826c6f42ee85f1290ccddf023d15548f.svg\"/>\nм/с):\n</p> <div class=\"math-display\">\n<img alt=\"S  = 1⋅|− 5− 0|⋅(9− 7)= 5 м\n 1   2\n\" class=\"math-display\" src=\"index-997253b1c191f29635394a1b2f351f36.svg\"/></div>\n<p class=\"indent\">   Полный путь, пройденный телом в интервале времени от 3 до 9 с, равен сумме путей на этих участках:\n</p> <div class=\"math-display\">\n<img alt=\"S =S1 +S2 = 20 м +5 м= 25 м\n\" class=\"math-display\" src=\"index-605837410a3fa63c7bef0ffc86379597.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d37ef4ef1cfbd4233682581b3ed2fc5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412073/index-d37ef4ef1cfbd4233682581b3ed2fc5b.svg", "index-144e7b535e2daba2e17dd39267bf5c5a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412073/index-144e7b535e2daba2e17dd39267bf5c5a.svg", "186940 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412073/186940 (1).png", "index-02a19a1dd66c1bda994439d0e116708e.svg": "https://3.shkolkovo.onli ass=\"noindent\">Автомобиль движется по прямой улице, совпадающей с осью <img alt=\"Ox  \" class=\"math\" src=\"index-6e4e70b9538332c719e831bf84ece260.svg\"/>. На графике представлена зависимость скорости автомобиля от\nвремени.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-2-pict25.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Определите модуль ускорения автомобиля <img alt=\"ax  \" class=\"math\" src=\"index-d9033125a0422c3f033863887ed00832.svg\"/> в интервале времени от 30 с до 40 с. Ответ дайте в м/с<img alt=\"2.  \" class=\"math\" src=\"index-05534e4926e22a1a73650125462e3c06.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Найдем проекцию ускорения тела по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"     Δυ\nax = Δt-\n\" class=\"math-display\" src=\"index-db6c4a1df404bf8c6a70fb592a169eb3.svg\"/></div>\n<p class=\"indent\">   Найдем <img alt=\"Δυ  \" class=\"math\" src=\"index-feb037ca6cf0652077bbe6ef5dcae76b.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"Δυ =υк − υн\n\" class=\"math-display\" src=\"index-f75e6e8a52e3b77c07c001cc0c4596ba.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n</p> <div class=\"math-display\">\n<img alt=\"Δυ = 15 м/с− 10 м/с = 5 м/с\n\" class=\"math-display\" src=\"index-d6a6217db93f268325037b6cc564131b.svg\"/></div>\n<p class=\"indent\">   Найдем <img alt=\"Δt  \" class=\"math\" src=\"index-6ca5ff9dbff02abeb75ac7645ecba310.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"Δt = tк− tн\n\" class=\"math-display\" src=\"index-9228810815f0a2a325b0db20b9b6a41b.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"Δt= 40 c − 30 c= 10 c\n\" class=\"math-display\" src=\"index-ef6cef7eb2fbb976f22414f874cd805e.svg\"/></div>\n<p class=\"indent\">   Подставим полученные данные в формулу проекции ускорения тела:\n</p> <div class=\"math-display\">\n<img alt=\"    5 м/с        2\nax =-10 c-= 0,5 м/c\n\" class=\"math-display\" src=\"index-38b63ce3a6b63215e1db39da68a5ac1b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6e4e70b9538332c719e831bf84ece260.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117009/index-6e4e70b9538332c719e831bf84ece260.svg", "f-1-2-pict25.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117009/f-1-2-pict25.png", "index-d9033125a0422c3f033863887ed00832.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117009/index-d9033125a0422c3f033863887ed00832.svg", "index-05534e4926e22a1a73650125462e3c06.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117009/index-05534e4926e22a1a73650125462e3c06.svg", "index-db6c4a1df404bf8c6a70fb592a169eb3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-db6c4a1df404bf8c6a70fb592a169eb3.svg", "index-feb037ca6cf0652077bbe6ef5dcae76b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-feb037ca6cf0652077bbe6ef5dcae76b.svg", "index-f75e6e8a52e3b77c07c001cc0c4596ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-f75e6e8a52e3b77c07c001cc0c4596ba.svg", "index-d6a6217db93f268325037b6cc564131b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-d6a6217db93f268325037b6cc564131b.svg", "index-6ca5ff9dbff02abeb75ac7645ecba310.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-6ca5ff9dbff02abeb75ac7645ecba310.svg", "index-9228810815f0a2a325b0db20b9b6a41b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117010/index-9228810815f0a2a325b0db20b9b6a41b.svg", "index-ef6cef7eb2fbb976f22414f874cd805e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSessi nt\">   Общий путь, пройденный телом, это сумма <img alt=\"S1  \" class=\"math\" src=\"index-30dcd25e1b404c7bd93628172964f18b.svg\"/> и <img alt=\"S2  \" class=\"math\" src=\"index-a111e67ce2bca28552f302518393e629.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"S = S1+ S2 =100+ 125= 225 м.\n\" class=\"math-display\" src=\"index-18f5acc8d91fedda50d95fcec6411a62.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-044baac09fe38b29e0965e7a3eac3ccf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385689/index-044baac09fe38b29e0965e7a3eac3ccf.svg", "index-16794fe6fd8717939c6f471d92c0c478.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385689/index-16794fe6fd8717939c6f471d92c0c478.svg", "index-564e9b8c0b75274317053ea7941dc2c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385689/index-564e9b8c0b75274317053ea7941dc2c2.svg", "177336.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385689/177336.png", "index-cd316c17649b50ccb4d3bed4403abe23.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-cd316c17649b50ccb4d3bed4403abe23.svg", "index-1adfedaf68bcd1b0c0a55aa22616b49e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-1adfedaf68bcd1b0c0a55aa22616b49e.svg", "index-1d392441dfeef36e30865ff01967b860.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-1d392441dfeef36e30865ff01967b860.svg", "index-30dcd25e1b404c7bd93628172964f18b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-30dcd25e1b404c7bd93628172964f18b.svg", "index-a111e67ce2bca28552f302518393e629.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-a111e67ce2bca28552f302518393e629.svg", "index-18f5acc8d91fedda50d95fcec6411a62.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385690/index-18f5acc8d91fedda50d95fcec6411a62.svg"}, "tags": ["Механика", "Кинематика", "Уро ure>\n<p class=\"indent\">   По рисунку видно, что <img alt=\"R2 =12  \" class=\"math\" src=\"index-3cc230efda57fe7fa8cdb58a76bb5626.svg\"/> H.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"14012_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35474/14012_1.png", "index-01d4e3190ece36b738905f74becdd296.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-01d4e3190ece36b738905f74becdd296.svg", "index-a1c17d2ac875d73295999815cce61e09.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-a1c17d2ac875d73295999815cce61e09.svg", "index-ca7ade9eda834096f507672560964730.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-ca7ade9eda834096f507672560964730.svg", "18038_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/18038_2.png", "index-fff597c2b93d16f39e3c7b3a02479900.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-fff597c2b93d16f39e3c7b3a02479900.svg", "index-3dabfd73991acca2bbeebe4baeb17e81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-3dabfd73991acca2bbeebe4baeb17e81.svg", "index-e01b994d2174c1af21871cd3dd5b1cb2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-e01b994d2174c1af21871cd3dd5b1cb2.svg", "18038_3.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/18038_3.png", "index-3cc230efda57fe7fa8cdb58a76bb5626.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35475/index-3cc230efda57fe7fa8cdb58a76bb5626.svg"}, "tags": ["Механика", "Уровень ЕГЭ", "Формат ЕГЭ", "Динамика", "Равнодействующая сил"], "sources": ["ФИПИ"], "created_at": "2022-01-18T14:03:03Z", "updated_at": "2026-09-23T15:15:51Z"}, {"id": 102921, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости проекции <img alt=\"vx  \" class=\"math\" src=\"index-ee8f277578a82ff8f590afb0e22de487.svg\"/> скорости тела от времени <img alt=\"t  \" class=\"math\" src=\"index-c524cb034a98b84e7896e65a50ceb884.svg\"/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"102921 - 1.png\" width=\"368\"/></p></div>\n<p class=\"indent\">   Определите путь, пройденный телом в интервале времени от 15 до 19 с. Ответ дайте в м.\n</p>", "solution_html": "<p class=\"noindent\">Путь можно найти как площадь под графиком. Путь будет складываться из двух слагаемых. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"102921_2.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Первое (от 15 до 17 с)\n</p> <div class=\"math-display\">\n<img alt=\"    v(15)+ v(17)    5+ 0\nS1 =-----2-----τ1 =--2- ⋅2 с= 5 м\n\" class=\"math-display\" src=\"index-6982d75f5283f5c4b32d6ca2068b954a.svg\"/></div>\n<p class=\"indent\">   Второе (от 17 с до 19 с)\n</p> <div class=\"math-display\">\n<img alt=\"S2 = v(17)+-|v(19)|τ2 = 0+-5⋅2 с = 5 м\n         2           2\n\" class=\"math-display\" src=\"index-289baf9eca7537d7c20c70e65d128bc3.svg\"/></div>\n<p class=\"indent\">   Итого:\n</p> <div class=\"math-display\">\n<img alt=\"S = S1+ S2 = 10 м\n\" class=\"math-display\" src=\"index-0bc29f4bd884fca3f951b7c69032ca62.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ee8f277578a82ff8f590afb0e22de487.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212164/index-ee8f277578a82ff8f590afb0e22de487.svg", "index-c524cb034a98b84e7896e65a50ceb884.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212164/index-c524cb034a98b84e7896e65a50ceb884.svg", "102921 - 1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212164/102921 - 1.png", "102921_2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212165/102921_2.png", "index-6982d75f5283f5c4b32d6ca2068b954a lass=\"math-display\" src=\"index-472d29017e976036fe47b624ee685d0f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"            1\nSΔ =15 ⋅12,5⋅2 = 93,75 м\n\" class=\"math-display\" src=\"index-421a9632a7a42735c1934a419b60024e.svg\"/></div>\n<p class=\"indent\">   Тогда путь, пройденный телом в интервале времени от 10 до 40 с, равен\n</p> <div class=\"math-display\">\n<img alt=\"S = S1+ S2+ SΔ =62,5+ 93,75 +37,5= 193,75 м.\n\" class=\"math-display\" src=\"index-8f0fca07b9f2ef6e06b88cd8963d9c5b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-86c2effda8f960e78e50894d5057cae2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237809/index-86c2effda8f960e78e50894d5057cae2.svg", "112663.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237809/112663.png", "1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/1.png", "index-76272b28a755efb961feb15c82d3d148.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-76272b28a755efb961feb15c82d3d148.svg", "index-e18921b381fd9a46458bf6f2187a7293.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-e18921b381fd9a46458bf6f2187a7293.svg", "index-d7c443e7cba8e82c7346b7949cd3372b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-d7c443e7cba8e82c7346b7949cd3372b.svg", "index-472d29017e976036fe47b624ee685d0f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-472d29017e976036fe47b624ee685d0f.svg", "index-421a9632a7a42735c1934a419b60024e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-421a9632a7a42735c1934a419b60024e.svg", "index-8f0fca07b9f2ef6e06b88cd8963d9c5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237810/index-8f0fca07b9f2ef6e06b88cd8963d9c5b.svg"}, "tags": ["ЕГКР Вариант 956 от 25.03.2025"], "sources": ["ЕГКР от 25.03.2025, вариант 956"], "created_at": "2 rc=\"index-93be38674da38872cf1232f9c9a4603e.svg\"/> </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16668.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Определите путь, пройденный телом в интервале времени от 5 до 10 с. Ответ дайте в м.<br/>\n</p>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"16668_1.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Путь в данном случае можно найти, как площадь трапеции:\n</p> <div class=\"math-display\">\n<img alt=\"    2 с+ 5 с\nS = ---2---⋅10 м/с= 35 м\n\" class=\"math-display\" src=\"index-d85cdab0d6c4d7d4031a00b179bff8fc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-db03265161ecaf8c330be953aed87e42.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33029/index-db03265161ecaf8c330be953aed87e42.svg", "index-93be38674da38872cf1232f9c9a4603e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33029/index-93be38674da38872cf1232f9c9a4603e.svg", "16668.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33029/16668.png", "16668_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33030/16668_1.png", "index-d85cdab0d6c4d7d4031a00b179bff8fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33030/index-d85cdab0d6c4d7d4031a00b179bff8fc.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Задача с реального ЕГЭ", "2020", "Основная волна"], "sources": ["Досрок 2020"], "created_at": "2022-01-02T10:03:02Z", "updated_at": "2026-07-02T12:40:38Z"}, {"id": 113828, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости проекции <img alt=\"vx  \" class=\"math\" src=\"index-ee8f277578a82ff8f590afb0e22de487.svg\"/> скорости тела от времени <img alt=\"t  \" class=\"math\" src=\"index-c524cb034a98b84e7896e65a50ceb884.svg\"/>.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"113828.png\" width=\"315\"/> </p> </figure>\n<p class=\"indent\">   Определите проекцию перемещения тела <img alt=\"Sx  \" class=\"math\" src=\"index-c743e49274a456aa7df6c6707180b7d1.svg\"/> от 0 до 15 с. Ответ дайте в м.\n</p>", "solution_html": "<figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"113828.1.png\" width=\"315\"/> </p> </figure>\n<p class=\"indent\">   Проекция перемещения тела находится как площадь под графиком зависимости скорости от времени (со знаком +, если скорость\nположительна и со знаком -, если отрицательна). Наше перемещение состоит из двух <img alt=\"S1  \" class=\"math\" src=\"index-8e166e0b3807b73af710e390aa87fef7.svg\"/> и <img alt=\"S2  \" class=\"math\" src=\"index-fef9402a997184570c3bf08c0cc9620b.svg\"/>. Найдем их как площади\nпрямоугольных треугольников\n</p> <div class=\"math-display\">\n<img alt=\"S1 =− 20⋅10= − 100 м,\n        2\n\" class=\"math-display\" src=\"index-f557a0a0865ed0aefa98f0cc7b7f1215.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     5⋅10\nS2 =  2  = 25 м.\n\" class=\"math-display\" src=\"index-d8376b7cf470f81b9048f17bfe3644fb.svg\"/></div>\n<p class=\"indent\">   Тогда проекция перемещения тела <img alt=\"Sx  \" class=\"math\" src=\"index-483ad250767cf95394e3617b0d6c2aaa.svg\"/> от 0 до 15 с равна\n</p> <div class=\"math-display\">\n<img alt=\"Sx = S1+ S2 = − 100 +25 = −75 м.\n\" class=\"math-display\" src=\"index-2a9fc963fa789a46985804674487addf.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ee8f277578a82ff8f590afb0e22de487.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/234083/index-ee8f277578a82ff8f590afb0e22de487.svg", "index-c524cb034a98b84e7896e65a50ceb884.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/234083/in x-38801c1c83fa5e120a2f881941710363.svg\"/> до 8 <img alt=\"c  \" class=\"math\" src=\"index-6c8652b1e92bde76877cadedbd8058e2.svg\"/>. Для этого из конечной координаты вычтем начальную:\n</p> <div class=\"math-display\">\n<img alt=\"Δx= xк − xн\n\" class=\"math-display\" src=\"index-fe9d5e5fdfff98dc5619598c972fb573.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n</p> <div class=\"math-display\">\n<img alt=\"Δx = (−2) м − 3 м = −5 м\n\" class=\"math-display\" src=\"index-ebef810f48117f26c986a3bad82e414d.svg\"/></div>\n<p class=\"indent\">   Найдем изменение времени в промежутке от 5 <img alt=\"c  \" class=\"math\" src=\"index-4f200f95c108e0559b74f392690931d8.svg\"/> до 8 <img alt=\"c  \" class=\"math\" src=\"index-101dd38c9547114288a11d8f8e266ab6.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"Δt = tк− tн\n\" class=\"math-display\" src=\"index-030ab6ef01f67f86bba0bbcfa26e5073.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n</p> <div class=\"math-display\">\n<img alt=\"Δt =8 с− 5 с =3 c\n\" class=\"math-display\" src=\"index-0bdf5b707ac072d57eee9fc608282ae5.svg\"/></div>\n<p class=\"indent\">   Найдем проекцию скорости тела:\n</p><p class=\"indent\"> </p> <div class=\"math-display\">\n<img alt=\"     Δx\nυx = Δt-\n\" class=\"math-display\" src=\"index-2b0d280afea0a4973bb8dae6b54e1487.svg\"/></div>\n<p class=\"indent\">   Подставим исходные данные:\n</p> <div class=\"math-display\">\n<img alt=\"υx = −5-м-≈ −1,7 м/c\n     3 c\n\" class=\"math-display\" src=\"index-03ceb5101ca4c9126e5584cfdee69190.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d894eb8baa4de8212deb2e4bd3dc9d88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32965/index-d894eb8baa4de8212deb2e4bd3dc9d88.svg", "index-b7b8cb33ae968cbcbe52eb297e4f3053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32965/index-b7b8cb33ae968cbcbe52eb297e4f3053.svg", "index-908bb0f0f263bd3f8bef42bbc93df0b1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32965/index-908bb0f0f263bd3f8bef42bbc93df0b1.svg", "index-27982ac421c658cc3baf9f485ed43a2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32965/index-27982ac421c658cc3baf9f485ed43a2a.svg", "f-1-1-pict6i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32965/f-1-1-pict6i.png", "index-38801c1c83fa5e120a2f881941710363.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-38801c1c83fa5e120a2f881941710363.svg", "index-6c8652b1e92bde76877cadedbd8058e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-6c8652b1e92bde76877cadedbd8058e2.svg", "index-fe9d5e5fdfff98dc5619598c972fb573.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-fe9d5e5fdfff98dc5619598c972fb573.svg", "index-ebef810f48117f26c986a3bad82e414d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-ebef810f48117f26c986a3bad82e414d.svg", "index-4f200f95c108e0559b74f392690931d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-4f200f95c108e0559b74f392690931d8.svg", "index-101dd38c9547114288a11d8f8e266ab6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-101dd38c9547114288a11d8f8e266ab6.svg", "index-030ab6ef01f67f86bba0bbcfa26e5073.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-030ab6ef01f67f86bba0bbcfa26e5073.svg", "index-0bdf5b707ac072d57eee9fc608282ae5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-0bdf5b707ac072d57eee9fc608282ae5.svg", "index-2b0d280afea0a4973bb8dae6b54e1487.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-2b0d280afea0a4973bb8dae6b54e1487.svg", "index-03ceb5101ca4c9126e5584cfdee69190.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32966/index-03ceb5101ca4c9126e5584cfdee69190.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения"], "sources": ["основная волна 2023"], "created_at": "2022-01-02T09:32:00Z", "updated_at": "2026-08-28T18:29:56Z"}, {"id": 97577, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости модуля скорости <img alt=\"v  \" class=\"math\" src=\"index-82c6b98c7c2504cb4ae151c7a52aa8cd.svg\"/> тела от времени <img alt=\"t  \" class=\"math\" src=\"index-be29fc1a21702dafca4f174a699ef8fd.svg\"/>. Найдите путь, пройденный телом за время от 0\nдо 12 с. Ответ дайте в м. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"97577.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Путь — величина строго положительная, это длина пройденного телом участка траектории. Под перемещением же тела понимается\nизменение его координаты, перемещение может быть отрицательным. Путь численно можно найти как площадь под графиком\nзависимости скорости от времени без учета знаков, а перемещение с их учетом. В данном случае необходимо найти площадь\nтрапеции.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"   12+-8\nS =  2   ⋅15= 150 м\n\" class=\"math-display\" src=\"index-52ac7440fd52ead8a81c202fc8906075.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-82c6b98c7c2504cb4ae151c7a52aa8cd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199786/index-82c6b98c7c2504cb4ae151c7a52aa8cd.svg", "index-be29fc1a21702dafca4f174a699ef8fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199786/index-be29fc1a21702dafca4f174a699ef8fd.svg", "97577.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199786/97577.png", "index-52ac7440fd52ead8a81c202fc8906075.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212163/index-52ac7440fd52ead8a81c202fc8906075.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["Банк ФИПИ ЕГЭ", "ЕГЭ 2026 основная волна, Центр"], "created_at": "2024-10-02T20:06:31Z", "updated_at": "2026-07-02T12:49:17Z"}, {"id": 195037, "name": "Копия #97577 - Задача на кинематику первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Дан график зависимости модуля скорости тела <img alt=\"v  \" class=\"math\" src=\"index-78e50c352725349cd6031586f62f040a.svg\"/> от времени <img alt=\"t  \" class=\"math\" src=\"index-31a7c40e024a7566a2f99efb0e4bc8f4.svg\"/>. Найдите путь, пройденный телом за промежуток времени от 0 до\n12 с. Ответ дайте в м. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"97577.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Путь — величина строго положительная, это длина пройденного телом участка траектории. Под перемещением же тела понимается\nизменение его координаты, перемещение может быть отрицательным. Путь численно можно найти как площадь под графиком\nзависимости скорости от времени без учета знаков, а перемещение с их учетом. В данном случае необходимо найти площадь\nтрапеции.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"   12+-8\nS =  2   ⋅15= 150 м\n\" class=\"math-display\" src=\"index-52ac7440fd52ead8a81c202fc8906075.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-78e50c352725349cd6031586f62f040a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432199/index-78e50c352725349cd6031586f62f040a.svg", "index-31a7c40e024a7566a2f99efb0e4bc8f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432199/index-31a7c40e024a7566a2f99efb0e4bc8f4.svg", "97577.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432199/97577.png", "index-52ac7440fd52ead8a81c202fc8906075.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432200/index-52ac7440fd52ead8a81c202fc8906075.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-15T00:47:36Z", "updated_at": "2026-08-15T00:50:12Z"}, {"id": 16634, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости пути <img alt=\"S  \" class=\"math\" src=\"index-b4a06bca25dccdb171a05584bc12e27e.svg\"/>, пройденного материальной точкой, от времени <img alt=\"t  \" class=\"math\" src=\"index-ab4f3d5c7ec516805f338cacaa96024b.svg\"/>. Определите скорость <img alt=\"     υ  \" class=\"math\" src=\"index-101e0e7eb8882530061dd50a172280ac.svg\"/>\nточки на интервале времени от 5 с до 7 с. Ответ дайте в м/с. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-1-1-2.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Т.к. пройденный путь материальной точки на интервале времени от 5 c до 7 c линейно увеличивается, материальная точка на этом\nинтервале движется равномерно и прямолинейно. По закону равномерного прямолинейного движения:\n</p> <div class=\"math-display\">\n<img alt=\"ΔS = υΔt,\n\" class=\"math-display\" src=\"index-9e5779399b6c06af3d8205993bcc0c37.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ΔS = 25 м − 15 м = 10 м  \" class=\"math\" src=\"index-8bb932bdccd2935e8d8e328b7a4cb6ba.svg\"/>, а <img alt=\"Δt= 7 c− 5 c= 2 c  \" class=\"math\" src=\"index-0533de7357a314520a8cefd129a545d3.svg\"/>. Выразим <img alt=\"υ  \" class=\"math\" src=\"index-0b0327a2f3491e1f711fdda835c3cc2a.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"    ΔS   10 м\nυ = Δt-= -2 c-= 5 м/c\n\" class=\"math-display\" src=\"index-6d8a8711f53c3acea20d9eb40971b6f7.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b4a06bca25dccdb171a05584bc12e27e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32961/index-b4a06bca25dccdb171a05584bc12e27e.svg", "index-ab4f3d5c7ec516805f338cacaa96024b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32961/index-ab4f3d5c7ec516805f338cacaa96024b.svg", "index-101e0e7eb8882530061dd50a172280ac.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32961/index-101e0e7eb8882530061dd50a172280ac.svg", "f-ege-1-1-2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32961/f-ege-1-1-2.png", "index-9e5779399b6c06af3d8205993bcc0c37.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32962/index-9e5779399b6c06af3d8205993bcc0c37.svg", "index-8bb932bdccd2935e8d8e328b7a4cb6ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32962/index-8bb932bdccd2935e8d8e328b7a4cb6ba.svg", "index-0533de7357a314520a8cefd129a545d3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32962/index-0533de7357a314520a8cefd129a545d3.svg", "index-0b0327a2f3491e1f711fdda835c3cc2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32962/index-0b0327a2f3491e1f711fdda835c3cc2a.svg", "index-6d8a8711f53c3acea20d9eb40971b6f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/32962/index-6d8a8711f53c3acea20d9eb40971b6f7.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения"], "sources": ["Демидова 2019"], "created_at": "2022-01-02T09:30:29Z", "updated_at": "2026-04-26T18:18:47Z"}, {"id": 16661, "name": "Задача на кинематику первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке представлен график зависимости пути <img alt=\"S  \" class=\"math\" src=\"index-ccec5cc08022e2797f0edcd42948453f.svg\"/> велосипедиста от времени <img alt=\"t  \" class=\"math\" src=\"index-0541123ff527d15b54c500135cf249bc.svg\"/>. Найдите скорость велосипедиста в интервале\nвремени от 50 до 70 с. Ответ дайте в м/с.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"f-ege-1-1-1.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">При равномерном движении путь определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"S = vt,\n\" class=\"math-display\" src=\"index-54d8a04fb6e510a7250ea454110bad51.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"v  \" class=\"math\" src=\"index-da57f1572c8b1fbd8a9c635158c0687d.svg\"/> – скорость, <img alt=\"t  \" class=\"math\" src=\"index-a2bde6b88b548d0f8f414cb3d89017be.svg\"/> – время. Значит, графиком равномерного движения будет прямая, что подходит под наш случай. При этом\nпуть равен:\n</p> <div class=\"math-display\">\n<img alt=\"S = 250 − 100= 150 м\n\" class=\"math-display\" src=\"index-342cdf38ca3f6e080b079ebcb795ca26.svg\"/></div>\n<p class=\"indent\">   Движение равномерное, скорость вычисляется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"   S   150 м\nv = t-=-20 с-= 7,5 м/с\n\" class=\"math-display\" src=\"index-73abbb4f23764f3cc8e8c0d8b331bb30.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ccec5cc08022e2797f0edcd42948453f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33015/index-ccec5cc08022e2797f0edcd42948453f.svg", "index-0541123ff527d15b54c500135cf249bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33015/index-0541123ff527d15b54c500135cf249bc.svg", "f-ege-1-1-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33015/f-ege-1-1-1.png", "index-54d8a04fb6e510a7250ea454110bad51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33016/index-54d8a04fb6e510a7250ea454110bad51.svg", "index-da57f1572c8b1fbd8a9c635158c0687d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33016/index-da57f1572c8b1fbd8a9c635158c0687d.svg", "index-a2bde6b88b548d0f8f414cb3d89017be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33016/index-a2bde6b88b548d0f8f414cb3d89017be.svg", "index-342cdf38ca3f6e080b079ebcb795ca26.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33016/index-342cdf38ca3f6e080b079ebcb795ca26.svg", "index-73abbb4f23764f3cc8e8c0d8b331bb30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33016/index-73abbb4f23764f3cc8e8c0d8b331bb30.svg"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения", "Демоверсия", "2017"], "sources": ["Демоверсия 2017"], "created_at": "2022-01-02T09:57:44Z", "updated_at": "2026-08-28T18:29:22Z"}, {"id": 16657, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Небольшое тело начинает равноускоренно двигаться вдоль оси <img alt=\"Ox  \" class=\"math\" src=\"index-2157f0b4d4aeb88542f2e8933539bfb2.svg\"/> без начальной скорости. На рисунке приведён график\nзависимости координаты <img alt=\"x  \" class=\"math\" src=\"index-c52f7de8c0378b4a018c29170147e098.svg\"/> этого тела от времени <img alt=\"t  \" class=\"math\" src=\"index-310ac976252816aaaaffbf92167ddf95.svg\"/>. Чему равна проекция скорости этого тела в момент времени <img alt=\"t  \" class=\"math\" src=\"index-8a28634c031511ea158eb0d872190a15.svg\"/> = 4 c? Ответ\nдайте в м/с.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"166571.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Уравнение для координаты при равноускоренном движении имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"            at2\nx= x0+ υ0t+ 2--\n\" class=\"math-display\" src=\"index-2498dd410f0794e3f7568cfa701d6ee8.svg\"/></div>\n<p class=\"indent\">   Согласно условию задачи тело двигалось без начальной скорости (<img alt=\"υ0 =0  \" class=\"math\" src=\"index-846296f25418877d101a92fc7131b73e.svg\"/>). Тогда уравнение для координаты имеет следующий\nвид:\n</p> <div class=\"math-display\">\n<img alt=\"         2\nx= x0+ at-\n        2\n\" class=\"math-display\" src=\"index-9bbb17612f7391386abd9f727c77bf10.svg\"/></div>\n<p class=\"indent\">   Определим ускорение тела, используя точку в момент времени <img alt=\"t= 4  \" class=\"math\" src=\"index-9188d8797716bd57420512fcbc3cf077.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"   2(x−-x0)  2(8−-2)         2\na=    t2   =    42  = 0,75 м/с\n\" class=\"math-display\" src=\"index-b1562dd202ab6c28530922871a0df2f9.svg\"/></div>\n<p class=\"indent\">   Скорость зависит от времени по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"υx = υ0+ at\n\" class=\"math-display\" src=\"index-15ec8440fca716a83b742770a856f634.svg\"/></div> <p class=\"indent\">   В момент времени <img alt=\"t= 4  \" class=\"math\" src=\"index-de054d9448b86fddf88ad20f083d0f59.svg\"/> с она равна <img alt=\"υx = 0+ 0,75⋅4= 3  \" class=\"math\" src=\"index-f28dbd4df3220720558a22cbe7521153.svg\"/> м/с.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2157f0b4d4aeb88542f2e8933539bfb2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33007/index-2157f0b4d4aeb88542f2e8933539bfb2.svg", "index-c52f7de8c0378b4a018c29170147e098.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33007/index-c52f7de8c0378b4a018c29170147e098.svg", "index-310ac976252816aaaaffbf92167ddf95.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33007/index-310ac976252816aaaaffbf92167ddf95.svg", "index-8a28634c031511ea158eb0d872190a15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33007/index-8a28634c031511ea158eb0d872190a15.svg", "166571.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33007/166571.png", "index-2498dd410f0794e3f7568cfa701d6ee8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33008/index-2498dd410f0794e3f7568cfa701d6ee8.svg", "index-846296f25418877d101a92fc7131b73e.svg": "https://3.shkolkovo.online/api/latex-service/v1/Ge ": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/360751/168207.png"}, "tags": ["Механика", "Кинематика", "Равномерное движение. Путь. Перемещение", "Уровень ЕГЭ", "Формат ЕГЭ", "Графики движения"], "sources": ["ЕГЭ 2024, досрочная волна"], "created_at": "2026-02-09T17:55:44Z", "updated_at": "2026-03-27T19:18:56Z"}, {"id": 195305, "name": "Копия #16657 - Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Небольшое тело начинает равноускоренное движение вдоль оси <img alt=\"Ox  \" class=\"math\" src=\"index-01d98c08a0b4fe49e8091cddc2464aa4.svg\"/> из состояния покоя. На рисунке представлен график\nзависимости его координаты <img alt=\"x  \" class=\"math\" src=\"index-2b1936b2c480ee4aa7a548d3d3132201.svg\"/> от времени <img alt=\"t  \" class=\"math\" src=\"index-f1bd9fdfe82d86989294161298da802a.svg\"/>. Определите проекцию скорости тела на ось <img alt=\"Ox  \" class=\"math\" src=\"index-3509d7a01c3282a20a2c4a33e4632b10.svg\"/> в момент времени <img alt=\"t= 4 с?  \" class=\"math\" src=\"index-a7e262ad1738a691c992038628b75f2d.svg\"/> Ответ\nдайте в м/с.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"166571.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Уравнение для координаты при равноускоренном движении имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"            at2\nx= x0+ υ0t+ 2--\n\" class=\"math-display\" src=\"index-2498dd410f0794e3f7568cfa701d6ee8.svg\"/></div>\n<p class=\"indent\">   Согласно условию задачи тело двигалось без начальной скорости (<img alt=\"υ0 =0  \" class=\"math\" src=\"index-846296f25418877d101a92fc7131b73e.svg\"/>). Тогда уравнение для координаты имеет следующий\nвид:\n</p> <div class=\"math-display\">\n<img alt=\"         2\nx= x0+ at-\n        2\n\" class=\"math-display\" src=\"index-9bbb17612f7391386abd9f727c77bf10.svg\"/></div>\n<p class=\"indent\">   Определим ускорение тела, используя точку в момент времени <img alt=\"t= 4  \" class=\"math\" src=\"index-9188d8797716bd57420512fcbc3cf077.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"   2(x−-x0)  2(8−-2)         2\na=    t2   =    42  = 0,75 м/с\n\" class=\"math-display\" src=\"index-b1562dd202ab6c28530922871a0df2f9.svg\"/></div>\n<p class=\"indent\">   Скорость зависит от времени по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"υx = υ0+ at\n\" class=\"math-display\" src=\"index-15ec8440fca716a83b742770a856f634.svg\"/></div> <p class=\"indent\">   В момент времени <img alt=\"t= 4  \" class=\"math\" src=\"index-de054d9448b86fddf88ad20f083d0f59.svg\"/> с она равна <img alt=\"υx = 0+ 0,75⋅4= 3  \" class=\"math\" src=\"index-f28dbd4df3220720558a22cbe7521153.svg\"/> м/с.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-01d98c08a0b4fe49e8091cddc2464aa4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/index-01d98c08a0b4fe49e8091cddc2464aa4.svg", "index-2b1936b2c480ee4aa7a548d3d3132201.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/index-2b1936b2c480ee4aa7a548d3d3132201.svg", "index-f1bd9fdfe82d86989294161298da802a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/index-f1bd9fdfe82d86989294161298da802a.svg", "index-3509d7a01c3282a20a2c4a33e4632b10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/index-3509d7a01c3282a20a2c4a33e4632b10.svg", "index-a7e262ad1738a691c992038628b75f2d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/index-a7e262ad1738a691c992038628b75f2d.svg", "166571.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432899/166571.png", "index-2498dd410f0794e3f7568cfa701d6ee8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432900/index-2498dd410f0794e3f7568cfa701d6ee8.svg", "index-846296f25418877d101a92fc7131b73e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSessi те в м/с<span class=\"tcrm-1200\">²</span>.\n</p>", "solution_html": "<p class=\"noindent\">Формула центростремительного ускорения:\n</p> <div class=\"math-display\">\n<img alt=\"     v2   (1,4 м/с)2       2\naцс = R = --2-м----≈1 м/с\n\" class=\"math-display\" src=\"index-78b8ff6e4efde8dee992c94a0a33ea45.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-78b8ff6e4efde8dee992c94a0a33ea45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33052/index-78b8ff6e4efde8dee992c94a0a33ea45.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["досрок 2014"], "created_at": "2022-01-02T10:21:24Z", "updated_at": "2026-08-28T18:32:16Z"}, {"id": 16680, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Линейная скорость конца стрелки часов <img alt=\"          −4\nυ = 0,35 ⋅10  \" class=\"math\" src=\"index-9ddd6a9edf19bfe938c6331aaccab5cc.svg\"/> м/с, ускорение конца стрелки <img alt=\"         −7\na= 0,61 ⋅10  \" class=\"math\" src=\"index-8eb4fe4a680725b21e45304ffcceda46.svg\"/> м/с<img alt=\"2\n .  \" class=\"math\" src=\"index-bd9da56be1f49f890f35c99390abe053.svg\"/> Какая это стрелка –\nсекундная, минутная, часовая? (В ответ запишите число: секундная – 1, минутная – 2, часовая – 3).\n</p>", "solution_html": "<p class=\"noindent\">Формула для центростремительного ускорения:\n</p> <div class=\"math-display\">\n<img alt=\"      υ2\naцс = R-\n\" class=\"math-display\" src=\"index-dc46e55019f0676cec7c2c4e7eed786d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"      2          −4    2\nR = -υ- = (0,35⋅10−7м/с)2-= 0,02 м\n    aцс   0,61⋅10  м/с\n\" class=\"math-display\" src=\"index-b3a72b92cfb4f41a5c8366bbb62f44a5.svg\"/></div>\n<p class=\"indent\">   Найдем период вращения стрелки:\n</p> <div class=\"math-display\">\n<img alt=\"    2πR-  --2π⋅0,02 м-\nT =  υ  = 0,35⋅10−4 м/с = 3600 с\n\" class=\"math-display\" src=\"index-a7daf9866998934162733381e6dba1db.svg\"/></div>\n<p class=\"indent\">   Следовательно, если период вращения стрелки равен 1 час, то это минутная стрелка.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9ddd6a9edf19bfe938c6331aaccab5cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33053/index-9ddd6a9edf19bfe938c6331aaccab5cc.svg", "index-8eb4fe4a680725b21e45304ffcceda46.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33053/index-8eb4fe4a680725b21e45304ffcceda46.svg", "index-bd9da56be1f49f890f35c99390abe053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33053/index-bd9da56be1f49f890f35c99390abe053.svg", "index-dc46e55019f0676cec7c2c4e7eed786d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33054/index-dc46e55019f0676cec7c2c4e7eed786d.svg", "index-b3a72b92cfb4f41a5c8366bbb62f44a5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33054/index-b3a72b92cfb4f41a5c8366bbb62f44a5.svg", "index-a7daf9866998934162733381e6dba1db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33054/index-a7daf9866998934162733381e6dba1db.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": [], "created_at": "2022-01-02T10:22:02Z", "updated_at": "2025-10-02T12:06:00Z"}, {"id": 16683, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Автобус везёт пассажиров по прямой дороге со скоростью 10 м/с. Пассажир равномерно идёт\nпо салону автобуса со скоростью 1 м/с относительно автобуса, двигаясь от задней двери к\nкабине водителя. Чему равен модуль скорости пассажира относительно дороги? Ответ дайте в\nм/с.\n</p>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-1-2-5.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Так как пассажир идет в том же направлении, что и автобус, то вектора их скоростей складываются, поэтому абсолютная скорость\nравна\n</p> <div class=\"math-display\">\n<img alt=\"υабс = υпер+ υотн =10 м/с+ 1 м/с =11 м/с\n\" class=\"math-display\" src=\"index-6e8ba76e8cbedffdd198d7fdab82be66.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-1-2-5.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33060/f-ege-1-2-5.png", "index-6e8ba76e8cbedffdd198d7fdab82be66.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33060/index-6e8ba76e8cbedffdd198d7fdab82be66.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["ОГЭ, Досрочная волна 2020"], "created_at": "2022-01-02T10:27:55Z", "updated_at": "2026-09-22T19:47:15Z"}, {"id": 16684, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">По прямой дороге с постоянной скоростью <img alt=\"υмот = 100 км/ч  \" class=\"math\" src=\"index-f7c1729c2273fd4b3bbe486f1a59760a.svg\"/> едет мотоциклист и в том же направлении едет автомобиль с\nпостоянной скоростью <img alt=\"υавт = 70 км/ч.  \" class=\"math\" src=\"index-1cd84604f2e5edbb9a77f770383cfab4.svg\"/> Чему равен модуль скорости движения мотоцикла относительно автомобиля?\nОтвет дайте в км/ч.\n</p>", "solution_html": "<figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"16684.png\" width=\"157\"/> </p> </figure>\n<p class=\"indent\">   По закону сложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υмот =⃗υотн+ ⃗υавт\n\" class=\"math-display\" src=\"index-a37ad3e601d9859e7aef40af6b74fb28.svg\"/></div>\n<p class=\"indent\">   Проецируя на ось <img alt=\"x:  \" class=\"math\" src=\"index-742cfaf8fbac6f01bd699a969eeb275f.svg\"/> (см. рисунок)\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"υмот = υxотн +υавт\n\" class=\"math-display\" src=\"index-51531c37a17c79e837deb4d19adeeadc.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"υxотн = υмот− υавт = 100 км/ч− 70 км/ч = 30 км/ч\n\" class=\"math-display\" src=\"index-ff9b29042b47cef68bb682d81df8a4ed.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f7c1729c2273fd4b3bbe486f1a59760a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33061/index-f7c1729c2273fd4b3bbe486f1a59760a.svg", "index-1cd84604f2e5edbb9a77f770383cfab4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33061/index-1cd84604f2e5edbb9a77f770383cfab4.svg", "16684.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33062/16684.png", "index-a37ad3e601d9859e7aef40af6b74fb28.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33062/index-a37ad3e601d9859e7aef40af6b74fb28.svg", "index-742cfaf8fbac6f01bd699a969eeb275f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33062/index-742cfaf8fbac6f01bd699a969eeb275f.svg", "index-51531c37a17c79e837deb4d19adeeadc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33062/index-51531c37a17c79e837deb4d19adeeadc.svg", "index-ff9b29042b47cef68bb682d81df8a4ed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33062/index-ff9b29042b47cef68bb682d81df8a4ed.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["ФИПИ"], "created_at": "2022-01-02T10:28:26Z", "updated_at": "2025-11-17T22:55:54Z"}, {"id": 16686, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Пассажир зашел в автобус через заднюю дверь. Автобус поехал с постоянной скоростью <img alt=\"υ1 = 25  \" class=\"math\" src=\"index-e3aef6e5377a6cca7714f6427911f4c8.svg\"/> м/с, а пассажир пошел к передней\nчасти автобуса. Скорость пассажира относительно автобуса равна <img alt=\"υ2 = 3  \" class=\"math\" src=\"index-3d331e252a36eac9e75d882ff14ce94c.svg\"/> м/с. С какой скоростью едет автобус относительно\nпассажира? Ответ дайте в м/с.\n</p>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-1-2-5.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Скорость первого тела относительного второго равна скорости второго тела относительно первого и направлена в противоположную\nсторону.\n</p> <div class=\"math-display\">\n<img alt=\"⃗vабс = ⃗vотн+ ⃗vпер\n\" class=\"math-display\" src=\"index-a30a0015480039b2b02aa555faee9db4.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"⃗v1 = ⃗v12 +⃗v2\n\" class=\"math-display\" src=\"index-b69b8ea17e7a8d35ef822c10bd1790d5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"⃗v2 = ⃗v21 +⃗v1\n\" class=\"math-display\" src=\"index-199f2fd9dc3da5640c89c8086968a418.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"⃗v12 =− ⃗v21\n\" class=\"math-display\" src=\"index-0824e1570dc9f313e1527e87a7f36f57.svg\"/></div>\n<p class=\"indent\">   Таким образом, автобус относительно пассажира движется со скоростью 3 м/с в обратную сторону.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e3aef6e5377a6cca7714f6427911f4c8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33065/index-e3aef6e5377a6cca7714f6427911f4c8.svg", "index-3d331e252a36eac9e75d882ff14ce94c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33065/index-3d331e252a36eac9e75d882ff14ce94c.svg", "f-ege-1-2-5.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33066/f-ege-1-2-5.png", "index-a30a0015480039b2b02aa555faee9db4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33066/index-a30a0015480039b2b02aa555faee9db4.svg", "index-b69b8ea17e7a8d35ef822c10bd1790d5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33066/index-b69b8ea17e7a8d35ef822c10bd1790d5.svg", "index-199f2fd9dc3da5640c89c8086968a418.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33066/index-199f2fd9dc3da5640c89c8086968a418.svg", "index-0824e1570dc9f313e1527e87a7f36f57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33066/index-0824e1570dc9f313e1527e87a7f36f57.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Относительность движения. Сложение скоростей"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:29:34Z", "updated_at": "2025-11-12T12:39:38Z"}, {"id": 16687, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Вася идет по прямой дороге со скоростью <img alt=\"υ1 = 3 км/ч.  \" class=\"math\" src=\"index-efdf08003645c37c9206d4b2b254a17b.svg\"/> Навстречу ему движется грузовик со скоростью <img alt=\"υ2 =30 км/ч  \" class=\"math\" src=\"index-3d64527e2ae8a42a6dc9b4016eacbfb9.svg\"/>. С какой\nскоростью <img alt=\"υ3  \" class=\"math\" src=\"index-4e0a671896f8503a639a3a38a384636f.svg\"/> (по модулю) должен двигаться велосипедист навстречу Васе, чтобы модули его скорости относительно автомобиля и\nотносительно Васи были одинаковы? Ответ дайте в км/ч.\n</p>", "solution_html": "<figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict2i.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   По закону сложения скоростей относительно автомобиля:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υ3 =⃗υ2 +⃗υ32,\n\" class=\"math-display\" src=\"index-00681ceb7135fe6b0fd8ab96bd499e9e.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Ox :υ3 =υ2 +υ32,\n\" class=\"math-display\" src=\"index-00312046e4f463656ace80921e03ed2b.svg\"/></div>\n<p class=\"indent\">   где в данном случае <img alt=\"υ2  \" class=\"math\" src=\"index-5444f95675fe4a2c38a51163ff769baf.svg\"/> — скорость системы отсчета, а <img alt=\"υ32  \" class=\"math\" src=\"index-a7b99127c2b46cf06913edda1eb83b0e.svg\"/> — скорость велосипедиста относительно автомобиля. Выразим\n<img alt=\"υ32  \" class=\"math\" src=\"index-d671b125c9ca987dbafd1a23afad3037.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"υ32 =υ3 − υ2\n\" class=\"math-display\" src=\"index-40dc56ceb2204a6e520dc7f109692497.svg\"/></div>\n<p class=\"indent\"> <img alt=\"υ3 &lt; υ2  \" class=\"math\" src=\"index-b4ea31dd43d969f22318f886ec2f938c.svg\"/> (автомобиль явно быстрее велосипеда), значит:\n</p> <div class=\"math-display\">\n<img alt=\"|υ32|=|υ3− υ2|=υ2 − υ3 (1)\n\" class=\"math-display\" src=\"index-7f39de82bdc94eaacc885c487b8c4e6d.svg\"/></div> <p class=\"indent\">   По закону сложения скоростей относительно Васи (Учитывая, что велосипедист двигается в противоположном направлении от\nВаси):\n</p> <div class=\"math-display\">\n<img alt=\"⃗υ3 =⃗υ1 +⃗υ23,\n\" class=\"math-display\" src=\"index-b4d451f709e08be89808db6808f305bd.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Ox :υ3 = −υ1+ υ23,\n\" class=\"math-display\" src=\"index-91b401f6e1c413edd2aadaa8a41f2a1b.svg\"/></div>\n<p class=\"indent\">   где в данном случае <img alt=\"υ1  \" class=\"math\" src=\"index-8be2383ded03037295e76434625e4ae3.svg\"/> — скорость системы отсчета, а <img alt=\"υ23  \" class=\"math\" src=\"index-a1456ef839ec6b17c16115ae80d081cf.svg\"/> — скорость велосипедиста относительно Васи. Выразим\n<img alt=\"υ23  \" class=\"math\" src=\"index-c044d3529610b66140779503fbfe8cd5.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"υ23 =υ1 +υ3  (2)\n\" class=\"math-display\" src=\"index-8fba9dc92680bbac09ea28e86d6aa540.svg\"/></div>\n<p class=\"indent\">   По условию:\n</p> <div class=\"math-display\">\n<img alt=\"|υ32|= |υ23|\n\" class=\"math-display\" src=\"index-f8d93f2d09554fa9b37322efc00778c8.svg\"/></div>\n<p class=\"indent\">   Подсавив сюда <img alt=\"(1)  \" class=\"math\" src=\"index-c88b3ed01897ed8e9b30726a1f815fb4.svg\"/> и <img alt=\"(2)  \" class=\"math\" src=\"index-dd9c30fe7581dddf6a9dcacaf3451ffd.svg\"/>, получим:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"υ2− υ3 = υ1+ υ3\n\" class=\"math-display\" src=\"index-674d1e561563acfdba602183f74ebdd5.svg\"/></div>\n<p class=\"indent\">   Выразим <img alt=\"υ3  \" class=\"math\" src=\"index-7a75970250f32243e09f1e8b1f8b0f46.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"     υ2 − υ1  30 км/ч − 3 км/ч\nυ3 = --2---= -------2------ = 13,5 км/ч\n\" class=\"math-display\" src=\"index-5efbc3650eeb59ca3f7b477aaff87927.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-efdf08003645c37c9206d4b2b254a17b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33067/index-efdf08003645c37c9206d4b2b254a17b.svg", "index-3d64527e2ae8a42a6dc9b4016eacbfb9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33067/index-3d64527e2ae8a42a6dc9b4016eacbfb9.svg", "index-4e0a671896f8503a639a3a38a384636f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33067/index-4e0a671896f8503a639a3a38a384636f.svg", "f-1-4-pict2i.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/f-1-4-pict2i.png", "index-00681ceb7135fe6b0fd8ab96bd499e9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-00681ceb7135fe6b0fd8ab96bd499e9e.svg", "index-00312046e4f463656ace80921e03ed2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-00312046e4f463656ace80921e03ed2b.svg", "index-5444f95675fe4a2c38a51163ff769baf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-5444f95675fe4a2c38a51163ff769baf.svg", "index-a7b99127c2b46cf06913edda1eb83b0e.sv index-dd9c30fe7581dddf6a9dcacaf3451ffd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-dd9c30fe7581dddf6a9dcacaf3451ffd.svg", "index-674d1e561563acfdba602183f74ebdd5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-674d1e561563acfdba602183f74ebdd5.svg", "index-7a75970250f32243e09f1e8b1f8b0f46.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-7a75970250f32243e09f1e8b1f8b0f46.svg", "index-5efbc3650eeb59ca3f7b477aaff87927.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33068/index-5efbc3650eeb59ca3f7b477aaff87927.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Графики движения", "Сложнее ЕГЭ"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:30:25Z", "updated_at": "2025-09-30T10:38:29Z"}, {"id": 16691, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Первый поезд ехал со скоростью <img alt=\"υ1 =59  \" class=\"math\" src=\"index-2192304e2e81d5a3abb3a30adcdb303e.svg\"/> км/ч. Второй поезд ехал навстречу первому со скоростью <img alt=\"υ2 =40  \" class=\"math\" src=\"index-3c83854af4799b41a4e86fb1448da2e1.svg\"/> км/ч. В первом поезде\nпассажир смотрел в окно, наблюдая как второй поезд проезжает мимо ровно <img alt=\"t =10  \" class=\"math\" src=\"index-abfa540826d6ac84e4bef9529e732291.svg\"/> с. Какова длина второго поезда? Ответ дайте в\nм.\n</p>", "solution_html": "<p class=\"noindent\">Перейдем в систему отсчета первого поезда. В этой системе наблюдатель (пассажир) неподвижен, а скорость встречного поезда\nнайдем из закона сложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υ21 =⃗υ2 − ⃗υ1\n\" class=\"math-display\" src=\"index-c0cb95b2987dd6ce5c7540da0d0f498e.svg\"/></div>\n<p class=\"indent\">   Спроецировав скорости на ось <img alt=\"Ox  \" class=\"math\" src=\"index-d8ab2e933167cf7576d41848df090211.svg\"/> (для наглядности изобразим): </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict6.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Получим:\n</p> <div class=\"math-display\">\n<img alt=\"υ21 = υ2− (−υ1)= υ2+ υ1 = 59 км/ч +40 км/ч= 99 км/ч\n\" class=\"math-display\" src=\"index-c30181e6f0adced8cd5f7b0536fdd946.svg\"/></div>\n<p class=\"indent\">   Переведем в м/с:\n</p> <div class=\"math-display\">\n<img alt=\"        99 ⋅1000 м\n99 км/ч= --3600 с- =27,5 м/с\n\" class=\"math-display\" src=\"index-ed2edc676426c2d006b2f5db60cd7e20.svg\"/></div>\n<p class=\"indent\">   Искомая длина равна:\n</p> <div class=\"math-display\">\n<img alt=\"l = υ21⋅t= 27,5 м/с⋅10 с= 275 м\n\" class=\"math-display\" src=\"index-dec9ae236ecfc2e8b4cb4b1a8c3a9f00.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2192304e2e81d5a3abb3a30adcdb303e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33075/index-2192304e2e81d5a3abb3a30adcdb303e.svg", "index-3c83854af4799b41a4e86fb1448da2e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33075/index-3c83854af4799b41a4e86fb1448da2e1.svg", "index-abfa540826d6ac84e4bef9529e732291.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33075/index-abfa540826d6ac84e4bef9529e732291.svg", "index-c0cb95b2987dd6ce5c7540da0d0f498e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/index-c0cb95b2987dd6ce5c7540da0d0f498e.svg", "index-d8ab2e933167cf7576d41848df090211.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/index-d8ab2e933167cf7576d41848df090211.svg", "f-1-4-pict6.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/f-1-4-pict6.png", "index-c30181e6f0adced8cd5f7b0536fdd946.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/index-c30181e6f0adced8cd5f7b0536fdd946.svg", "index-ed2edc676426c2d006b2f5db60cd7e20.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/index-ed2edc676426c2d006b2f5db60cd7e20.svg", "index-dec9ae236ecfc2e8b4cb4b1a8c3a9f00.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33076/index-dec9ae236ecfc2e8b4cb4b1a8c3a9f00.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:33:41Z", "updated_at": "2025-11-12T12:38:33Z"}, {"id": 16693, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Автомобиль, двигаясь со скоростью <img alt=\"υa = 90  \" class=\"math\" src=\"index-2d3b536c0214f498471d520dfb0b9d17.svg\"/> км/ч, в течение 180 с прошел такой же путь, какой мотоциклист, двигающийся в том\nже направлении с постоянной скоростью, за 360 с. Найдите величину их относительной скорости. Ответ дайте в\nкм/ч.\n</p>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-1-4-1.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Способ 1: <br/>Переведем все время из секунд в часы:\n</p> <div class=\"math-display\">\n<img alt=\"180 c-= 0,05 ч\n3600\n\" class=\"math-display\" src=\"index-16563b183dca6c4253969b2f42c0fff5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"360-c= 0,1 ч\n3600\n\" class=\"math-display\" src=\"index-23721de8ba25f6d359ecc1dbe264d682.svg\"/></div>\n<p class=\"indent\">   Найдем путь, пройденный автомобилем:\n</p> <div class=\"math-display\">\n<img alt=\"S = 90 км/ч⋅0,05 ч =4,5 км\n\" class=\"math-display\" src=\"index-d8778a5fb591cec5fce8d0479b6af4a1.svg\"/></div>\n<p class=\"indent\">   Известно, что автомобиль прошел такой же путь как мотоциклист, тогда найдем скорость мотоциклиста:\n</p> <div class=\"math-display\">\n<img alt=\"υм = -S--= 4,5-км= 45 км/ч\n     0,1 ч   0,1 ч\n\" class=\"math-display\" src=\"index-cd511f989381d41617a6a2f677ef637a.svg\"/></div>\n<p class=\"indent\">   Автомобиль двигается в одном направлении с мотоциклистом, тогда их относительная скорость равна:\n</p> <div class=\"math-display\">\n<img alt=\"υ   = υ − υ = 90 км/ч − 45 км/ч= 45 км/ч\n отн   а   м\n\" class=\"math-display\" src=\"index-9bbb071e033fb3b12815c22722be5961.svg\"/></div>\n<p class=\"indent\">   Способ 2: <br/>Обратим внимание на время. Время, затраченное автомобилем на прохождение пути, в два раза меньше времени, затраченного\nмотоциклистом на прохождение того же пути. Очевидно, что при таком условии и равном пути, скорость мотоциклиста <img alt=\"υм  \" class=\"math\" src=\"index-ad5556971e878697856e8c1cb02cc547.svg\"/> должна\nбыть в два раза меньше. Получим:\n</p> <div class=\"math-display\">\n<img alt=\"υм = υа = 90 км/ч-= 45 км/ч\n     2      2\n\" class=\"math-display\" src=\"index-77690ca801e85144f07105907547aaf9.svg\"/></div>\n<p class=\"indent\">   Автомобиль двигается в одном направлении с мотоциклистом, тогда их относительная скорость равна:\n</p> <div class=\"math-display\">\n<img alt=\"υотн = υм− υа = 90 км/ч − 45 км/ч= 45 км/ч\n\" class=\"math-display\" src=\"index-64d7d1e3cc8d4825d4a49d18fc5cb370.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2d3b536c0214f498471d520dfb0b9d17.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33079/index-2d3b536c0214f498471d520dfb0b9d17.svg", "f-ege-1-4-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/f-ege-1-4-1.png", "index-16563b183dca6c4253969b2f42c0fff5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-16563b183dca6c4253969b2f42c0fff5.svg", "index-23721de8ba25f6d359ecc1dbe264d682.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-23721de8ba25f6d359ecc1dbe264d682.svg", "index-d8778a5fb591cec5fce8d0479b6af4a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-d8778a5fb591cec5fce8d0479b6af4a1.svg", "index-cd511f989381d41617a6a2f677ef637a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-cd511f989381d41617a6a2f677ef637a.svg", "index-9bbb071e033fb3b12815c22722be5961.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-9bbb071e033fb3b12815c22722be5961.svg", "index-ad5556971e878697856e8c1cb02cc547.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-ad5556971e878697856e8c1cb02cc547.svg", "index-77690ca801e85144f07105907547aaf9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-77690ca801e85144f07105907547aaf9.svg", "index-64d7d1e3cc8d4825d4a49d18fc5cb370.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33080/index-64d7d1e3cc8d4825d4a49d18fc5cb370.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["ФИПИ"], "created_at": "2022-01-02T10:35:01Z", "updated_at": "2026-08-28T18:34:21Z"}, {"id": 16694, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Сколько секунд пассажир, стоящий у окна поезда, идущего со скоростью 108 км/ч будет видеть\nпроходящий мимо него встречный поезд, скорость которого 25 м/с, а длина 275 м? Ответ дайте в\nс.\n</p>", "solution_html": "<p class=\"noindent\">Переведем скорость первого поезда в м/с:\n</p> <div class=\"math-display\">\n<img alt=\"          108⋅1000 м\n108 км/ч= --3600-с--= 30 м/с\n\" class=\"math-display\" src=\"index-a4e073fdebf465964e1654d102e54489.svg\"/></div>\n<p class=\"indent\">   Перейдем в систему отсчета первого поезда. В этой системе наблюдатель (пассажир) неподвижен, а скорость встречного поезда\nнайдем из закона сложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"⃗υ21 =⃗υ2 − ⃗υ1\n\" class=\"math-display\" src=\"index-463831222a2f8e6f394b86f438813d64.svg\"/></div>\n<p class=\"indent\">   Спроецировав скорости на ось <img alt=\"Ox  \" class=\"math\" src=\"index-746eaf3d9e12700e85f6ca388fd83979.svg\"/> (для наглядности изобразим): </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-1-4-pict6.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Получим:\n</p> <div class=\"math-display\">\n<img alt=\"υ21 = υ2− (− υ1)= υ2+ υ1 = 30 м/с+ 25 м/с =55 м/с\n\" class=\"math-display\" src=\"index-e841bb4e78a86b8de5464365988f808e.svg\"/></div>\n<p class=\"indent\">   Можем найти время:\n</p> <div class=\"math-display\">\n<img alt=\"   275 м\nt= 55 м/с-= 5с\n\" class=\"math-display\" src=\"index-88d1557bcfb70c0963149b093ca02bfd.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a4e073fdebf465964e1654d102e54489.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/index-a4e073fdebf465964e1654d102e54489.svg", "index-463831222a2f8e6f394b86f438813d64.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/index-463831222a2f8e6f394b86f438813d64.svg", "index-746eaf3d9e12700e85f6ca388fd83979.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/index-746eaf3d9e12700e85f6ca388fd83979.svg", "f-1-4-pict6.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/f-1-4-pict6.png", "index-e841bb4e78a86b8de5464365988f808e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/index-e841bb4e78a86b8de5464365988f808e.svg", "index-88d1557bcfb70c0963149b093ca02bfd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33082/index-88d1557bcfb70c0963149b093ca02bfd.svg"}, "tags": ["Механика", "Кинематика", "Формат ЕГЭ", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ"], "sources": ["Демоверсия 2018"], "created_at": "2022-01-02T10:35:41Z", "updated_at": "2025-11-12T12:36:14Z"}, {"id": 16695, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Дятел стучит по дереву, делая 30 ударов в минуту, а мальчик, который едет в автомобиле слышит 31\nудар в минуту. Найдите скорость автомобиля, если скорость звука 330 м/с. Ответ дайте в\nм/с.\n</p>", "solution_html": "<p class=\"noindent\">Дятел делает 0,5 ударов в секунду. Для того, чтобы мальчик услышал 31 удар , нужно чтобы звук прошел за две секунды на\n<img alt=\"330 м/ с⋅2 с  \" class=\"math\" src=\"index-61aab69e1d29407808ab5fdb7e6488a4.svg\"/> меньше. Значит скорость автомобиля будет\n</p> <div class=\"math-display\">\n<img alt=\"    330 м/с⋅2 с\nv1 =----60-с--- =11 м/с\n\" class=\"math-display\" src=\"index-cd4fed62bacee14d7ca1414afe61514d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-61aab69e1d29407808ab5fdb7e6488a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33084/index-61aab69e1d29407808ab5fdb7e6488a4.svg", "index-cd4fed62bacee14d7ca1414afe61514d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/33084/index-cd4fed62bacee14d7ca1414afe61514d.svg"}, "tags": ["Механика", "Кинематика", "Относительность движения. Сложение скоростей", "Сложнее ЕГЭ", "Не формат ЕГЭ"], "sources": ["веб"], "created_at": "2022-01-02T10:36:09Z", "updated_at": "2025-11-17T23:04:05Z"}, {"id": 64424, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Материальная точка движется по окружности радиусом <img alt=\"R  \" class=\"math\" src=\"index-e5534a519a5c96c7d1d85a5a040c5237.svg\"/> с постоянной по модулю скоростью <img alt=\"v  \" class=\"math\" src=\"index-9e1864faa112c84cf2fd1997ae2c0391.svg\"/>. Во сколько раз\nуменьшится центростремительное ускорение точки, если скорость уменьшить в 2 раза, а радиус окружности в 2 раза\nувеличить?\n</p>", "solution_html": "<p class=\"noindent\">При движении по окружности центростремительное ускорение можно найти по следующей формуле:\n</p> <div class=\"math-display\">\n<img alt=\"     υ2\naцс =-R\n\" class=\"math-display\" src=\"index-919bd681def021ac201c2796990dff21.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"v  \" class=\"math\" src=\"index-daa791284b9712b4f79381231302e935.svg\"/> – скорость тела.\n</p><p class=\"indent\">   Тогда при уменьшении скорости в 2 раза, а радиус окружности увеличить в 2 раза, то центростремительное ускорение\nуменьшится в 8 раз.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e5534a519a5c96c7d1d85a5a040c5237.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116380/index-e5534a519a5c96c7d1d85a5a040c5237.svg", "index-9e1864faa112c84cf2fd1997ae2c0391.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116380/index-9e1864faa112c84cf2fd1997ae2c0391.svg", "index-919bd681def021ac201c2796990dff21.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116381/index-919bd681def021ac201c2796990dff21.svg", "index-daa791284b9712b4f79381231302e935.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116381/index-daa791284b9712b4f79381231302e935.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["Демидова 2023"], "created_at": "2023-06-23T08:01:27Z", "updated_at": "2025-11-17T23:08:16Z"}, {"id": 65066, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Автомобиль движется по закруглению дороги радиусом 20 м с центростремительным ускорением 5 м/с<img alt=\"2\n.  \" class=\"math\" src=\"index-f7149507b309695b039147b2e1c316c4.svg\"/> Чему равна скорость\nавтомобиля. Ответ дайте в м/с.\n</p>", "solution_html": "<p class=\"noindent\">Центростремительное ускорение (нормальное) находится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"   υ2\na= -R,\n\" class=\"math-display\" src=\"index-758bc1484497f7cb812f4e247a271323.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"v  \" class=\"math\" src=\"index-664154f62f8aa589b7ad808a93a10a01.svg\"/> – скорость, <img alt=\"R  \" class=\"math\" src=\"index-de6bb4974b24461232fc6cfa0fcf641c.svg\"/> – радиус дороги.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"          ∘----------\nv = √aR-=  5 м/с2⋅20 м = 10 м/с.\n\" class=\"math-display\" src=\"index-eacffd0a9f38ecd7cf707937e2a91188.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f7149507b309695b039147b2e1c316c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117557/index-f7149507b309695b039147b2e1c316c4.svg", "index-758bc1484497f7cb812f4e247a271323.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117558/index-758bc1484497f7cb812f4e247a271323.svg", "index-664154f62f8aa589b7ad808a93a10a01.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117558/index-664154f62f8aa589b7ad808a93a10a01.svg", "index-de6bb4974b24461232fc6cfa0fcf641c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117558/index-de6bb4974b24461232fc6cfa0fcf641c.svg", "index-eacffd0a9f38ecd7cf707937e2a91188.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117558/index-eacffd0a9f38ecd7cf707937e2a91188.svg"}, "tags": ["Механика", "Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": ["Демидова 2023"], "created_at": "2023-07-07T07:51:14Z", "updated_at": "2025-11-17T23:10:37Z"}, {"id": 65185, "name": "Задача на кинематику. Первая часть", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Шарик движется по окружности радиусом <img alt=\"r  \" class=\"math\" src=\"index-bbb2394806834b49861aa459925622a3.svg\"/> с постоянной по модулю скоростью <img alt=\"v  \" class=\"math\" src=\"index-ad1ef16621c736ce72ff6088ad60bf0b.svg\"/>. Во сколько раз уменьшится его\nцентростремительное ускорение, если радиус окружности увеличить в 3 раза, оставив скорость шарика прежней?\n</p>", "solution_html": "<p class=\"noindent\">Центростремительное ускорение:\n</p> <div class=\"math-display\">\n<img alt=\"   v2\na= -R,\n\" class=\"math-display\" src=\"index-a9bef99cb9c6ca4b1260133c38d569ad.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"v  \" class=\"math\" src=\"index-daa791284b9712b4f79381231302e935.svg\"/> – скорость тела, <img alt=\"R  \" class=\"math\" src=\"index-a66789409ef41c1dff5e9afd716e4255.svg\"/> – радиус окружности.\n</p><p class=\"indent\">   Если увеличить радиус в 3 раза, то центростремительное ускорение уменьшится в 3 раза.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bbb2394806834b49861aa459925622a3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117850/index-bbb2394806834b49861aa459925622a3.svg", "index-ad1ef16621c736ce72ff6088ad60bf0b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117850/index-ad1ef16621c736ce72ff6088ad60bf0b.svg", "index-a9bef99cb9c6ca4b1260133c38d569ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117851/index-a9bef99cb9c6ca4b1260133c38d569ad.svg", "index-daa791284b9712b4f79381231302e935.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117851/index-daa791284b9712b4f79381231302e935.svg", "index-a66789409ef41c1dff5e9afd716e4255.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117851/index-a66789409ef41c1dff5e9afd716e4255.svg"}, "tags": ["Кинематика", "Уровень ЕГЭ", "Формат ЕГЭ", "Движение по окружности. Вращательное движение"], "sources": [], "created_at": "2023-07-08T06:56:57Z", "updated_at": "2025-10-02T11:51:42Z"}, {"id": 136816, "name": "СтатГрад ЕГЭ 18.10.2023 Кинематика 1 вариант", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">На рисунке изображён график зависимости координаты <img alt=\"x  \" class=\"math\" src=\"index-ec5adb544084a520a5a907ac7e1525dc.svg\"/> материальной точки от времени <img alt=\"t  \" class=\"math\" src=\"index-9a040905a3b211daa53ca57988735f48.svg\"/> при движении вдоль оси <img alt=\"OX  \" class=\"math\" src=\"index-5b81bea711581b7272331b10b06a164c.svg\"/>. Чему\nбыло равно максимальное значение модуля скорости этой материальной точки в течение первых девяти секунд её движения? Ответ\nдайте в м/с. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"136816.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Скорость материальной точки на графике зависимости <img alt=\"x(t)  \" class=\"math\" src=\"index-7759a46f5cabb4dc18d67586a0c63403.svg\"/> можно определить очень легко – достаточно найти производную на\nкаждом участке зависимости. Для того, чтобы определить модуль скорости, найдем тангенсы углов <img alt=\"α1  \" class=\"math\" src=\"index-d7a88c457a5d15d0dbc3d002546f1887.svg\"/>, <img alt=\"α2  \" class=\"math\" src=\"index-5f949fa3cbc795cba51d25aa4e0da737.svg\"/> и <img alt=\"α3  \" class=\"math\" src=\"index-07b1c51155b569b0b8393d2b97a85bc2.svg\"/>.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"136816-1.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Для первого участка получаем\n</p> <div class=\"math-display\">\n<img alt=\"v1 = tgα1 = 40 = 20 см.\n           2      с\n\" class=\"math-display\" src=\"index-bb128af45c53fa065af642c3e7e360be.svg\"/></div>\n<p class=\"indent\">   Для второго участка получаем\n</p> <div class=\"math-display\">\n<img alt=\"v2 = tgα2 = 30 = 10 см.\n           3      с\n\" class=\"math-display\" src=\"index-2aff9a478ca2aad92e057d628bf04409.svg\"/></div>\n<p class=\"indent\">   Для третьего участка получаем\n</p> <div class=\"math-display\">\n<img alt=\"           20    см-\nv3 =tgα3 = 4 = 5 с .\n\" class=\"math-display\" src=\"index-663b791719a55204bdc255fbca6583d7.svg\"/></div>\n<p class=\"indent\">   Таким образом, <img alt=\"       см      м\nv1 = 20 с-= 0,2с  \" class=\"math\" src=\"index-6fbcb0b7ed0559b8cfc2c0caafa6a5a8.svg\"/> является максимальной по модулю скоростью материальной точки.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ec5adb544084a520a5a907a ion_html": "<p class=\"noindent\">Турист прошел 1,5 км в направлении на юг и затем 2 км в направлении на восток. Чему равен модуль полного перемещения\nтуриста? <br/>Ответ дайте в км.\n</p>", "solution_html": "<p class=\"noindent\">Перемещение – вектор, соединяющий конечное и начальное положение тела. В данном случае у нас получится прямоугольный\nтреугольник, у которого необходимо найти гипотенузу. Она и будет искомым модулем полного перемещения:\n</p> <div class=\"math-display\">\n<img alt=\"   ∘ ------  ∘ -------\nc=   a2+ b2 =  1.52+ 22 = 2,5 км.\n\" class=\"math-display\" src=\"index-999de811518a9ac5e346633203a6c650.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-999de811518a9ac5e346633203a6c650.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296127/index-999de811518a9ac5e346633203a6c650.svg"}, "tags": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "sources": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "created_at": "2025-09-11T08:11:43Z", "updated_at": "2026-03-27T19:47:51Z"}, {"id": 141601, "name": "СтатГрад ЕГЭ 14.12.2020 Кинематика 1 вариант", "theme_path": "№1 Кинематика", "question_html": "<p class=\"noindent\">Точечное тело начало двигаться вдоль прямой с постоянным ускорением, равным по модулю <img alt=\"    2\n4м∕с  \" class=\"math\" src=\"index-81d6de4006b02e9fed98bff8d8ab001b.svg\"/>, и через <img alt=\"6  \" class=\"math\" src=\"index-56d6614b07442dbfa68a96034571096b.svg\"/> секунд после\nначала движения вернулось в исходную точку. Чему был равен модуль начальной скорости тела? Ответ дайте в\nм/с.\n</p>", "solution_html": "<p class=\"noindent\">Для перемещения <img alt=\"S  \" class=\"math\" src=\"index-5a5b2cf01c1e0490f0b37c9b92fb1aa8.svg\"/> при прямолинейном равноускоренном движении формула имеет вид:\n</p> <div class=\"math-display\">\n<img alt=\"        at2\nS = v0t+ -2-, (1)\n\" class=\"math-display\" src=\"index-7eed5943f3bd99f75484d550b8068fce.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"v0  \" cl
