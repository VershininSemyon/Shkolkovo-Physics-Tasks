Демидова 2019"], "sources": ["Демидова 2019"], "created_at": "2021-12-07T12:47:55Z", "updated_at": "2026-09-22T08:43:11Z"}, {"id": 188314, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"19   A    4     16\n9 F +Z X →2 He+ 8 O  \" class=\"math\" src=\"index-3511f27cd90bab21ff2204434d54a694.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-d869f11c4ac72e487c260bc2e8f7d2c8.svg\"/>. Каков заряд\nобразовавшегося ядра Z (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону сохранения заряда ядра:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"2+ 8= Z + 9⇒ Z = 1\n\" class=\"math-display\" src=\"index-51074bf815a9ba29c21cbd15b36933ec.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3511f27cd90bab21ff2204434d54a694.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415200/index-3511f27cd90bab21ff2204434d54a694.svg", "index-d869f11c4ac72e487c260bc2e8f7d2c8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415200/index-d869f11c4ac72e487c260bc2e8f7d2c8.svg", "index-51074bf815a9ba29c21cbd15b36933ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415201/index-51074bf815a9ba29c21cbd15b36933ec.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T10:49:09Z", "updated_at": "2026-07-03T15:21:15Z"}, {"id": 166256, "name": "Радиоактивный распад", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа нераспавшихся ядер иода <img alt=\"128\n53 I  \" class=\"math\" src=\"index-e0085933c0062dcb7ef14761d28e84b9.svg\"/> от времени. Чему равен период полураспада этого изотопа иода?\nОтвет дайте в мин. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"447\" src=\"166256.png\" width=\"447\"/></p></div>", "solution_html": "<p class=\"noindent\">Период полураспада - время, за которое распадается ровно половина вещества.<br/>Поскольку изначально было <img alt=\"8⋅1020  \" class=\"math\" src=\"index-ba652ff1a2773933dc62b6cd4aa2dcc2.svg\"/> вещества. Из графика видно, что падение в 2 раза произошло на 30 мин. Поэтому период\nполураспада равен 30 мин.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e0085933c0062dcb7ef14761d28e84b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355768/index-e0085933c0062dcb7ef14761d28e84b9.svg", "166256.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355768/166256.png", "index-ba652ff1a2773933dc62b6cd4aa2dcc2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355769/index-ba652ff1a2773933dc62b6cd4aa2dcc2.svg"}, "tags": ["Банк ФИПИ ЕГЭ"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-01-30T19:55:46Z", "updated_at": "2026-05-27T10:12:38Z"}, {"id": 188317, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"2    2    A    1\n1H + 1H → Z X + 1p  \" class=\"math\" src=\"index-64e2e90288ef2151729ee8a153d48e45.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-540ca2207446588662d7701ee8fea44a.svg\"/>. Каков заряд\nобразовавшегося ядра Z (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону сохранения заряда ядра:\n</p> <div class=\"math-display\">\n<img alt=\"1+ 1= Z + 1⇒ Z = 1\n\" class=\"math-display\" src=\"index-0b65e2bd767d70f557454bf5a3676323.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-64e2e90288ef2151729ee8a153d48e45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415206/index-64e2e90288ef2151729ee8a153d48e45.svg", "index-540ca2207446588662d7701ee8fea44a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415206/index-540ca2207446588662d7701ee8fea44a.svg", "index-0b65e2bd767d70f557454bf5a3676323.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415207/index-0b65e2bd767d70f557454bf5a3676323.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2021", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2021", "ЕГЭ 2024, основная волна"], "created_at": "2026-07-03T10:52:06Z", "updated_at": "2026-07-03T15:20:51Z"}, {"id": 160041, "name": "Задача на квантовую физику. Первая часть. База ФИПИ FA1532", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке показан график зависимости числа нераспавшихся ядер европия <img alt=\"160\n63 Eu  \" class=\"math\" src=\"index-87897d41f8249c1c825da4931d3982b3.svg\"/> от времени. Каков период полураспада этого\nизотопа? Ответ дайте в с. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"160041.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Время, за которое останется ровно половина от начального количества ядер равно 50 с.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-87897d41f8249c1c825da4931d3982b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/341670/index-87897d41f8249c1c825da4931d3982b3.svg", "160041.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/341670/160041.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2017", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Банк ФИПИ", "ЕГЭ 2026 пересдача, центр"], "created_at": "2025-12-28T16:38:29Z", "updated_at": "2026-09-22T08:42:45Z"}, {"id": 188320, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"21H +21 H →AZ X +10 n  \" class=\"math\" src=\"index-c87bdb71489dd6d322acbdcb886d9b09.svg\"/> образуется ядро химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-dcc136a464210cb1d3aab87710088f3f.svg\"/>. Каков заряд Z\nобразовавшегося ядра (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Выполняется закон сохранения заряда ядра:\n</p> <div class=\"math-display\">\n<img alt=\"1+ 1= Z + 0⇒ Z = 2\n\" class=\"math-display\" src=\"index-b9e392cd253fb527c1ec9e58e3333fe2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c87bdb71489dd6d322acbdcb886d9b09.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415211/index-c87bdb71489dd6d322acbdcb886d9b09.svg", "index-dcc136a464210cb1d3aab87710088f3f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415211/index-dcc136a464210cb1d3aab87710088f3f.svg", "index-b9e392cd253fb527c1ec9e58e3333fe2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415212/index-b9e392cd253fb527c1ec9e58e3333fe2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T10:54:05Z", "updated_at": "2026-07-03T13:36:31Z"}, {"id": 115790, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график изменения числа ядер находящегося в пробирке радиоактивного изотопа золота-198 с течением времени. Определите\nпериод полураспада этого изотопа. Ответ дайте в ч. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"115790.png\" width=\"421\"/></p></div>", "solution_html": "<p class=\"noindent\">Период полураспада - время, за которое распадается ровно половина вещества.<br/>Поскольку изначально было <img alt=\"12⋅1018  \" class=\"math\" src=\"index-0d0d5eac6436e0870bdf30443c754d08.svg\"/> ядер. <br/>То период полураспада равен 64 часам (останется половина - <img alt=\"6⋅1018  \" class=\"math\" src=\"index-676cd6c8559b6d55491d4044772eae70.svg\"/>).<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"115790.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237707/115790.png", "index-0d0d5eac6436e0870bdf30443c754d08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237708/index-0d0d5eac6436e0870bdf30443c754d08.svg", "index-676cd6c8559b6d55491d4044772eae70.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/237708/index-676cd6c8559b6d55491d4044772eae70.svg"}, "tags": ["ЕГКР Вариант 956 от 25.03.2025"], "sources": ["ЕГКР от 25.03.2025, вариант 956"], "created_at": "2025-04-06T21:15:00Z", "updated_at": "2026-07-12T21:55:43Z"}, {"id": 185826, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции, в которой участвуют изотоп бора <img alt=\"10\n5 B  \" class=\"math\" src=\"index-5a2221c05ca75bb71262744bde294890.svg\"/> и нейтрон, появляются <img alt=\"α  \" class=\"math\" src=\"index-762fc102e9981f0cf2fff063e9a828de.svg\"/>-частица и ядро другого вещества\n<img alt=\"AZX  \" class=\"math\" src=\"index-feae74f7e6748d30b4debcf5bdbb3827.svg\"/>. Каков заряд образовавшегося ядра Z (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Реакция:\n</p> <div class=\"math-display\">\n<img alt=\"10   1   4     A\n5 B + 0n→ 2 He + Z X\n\" class=\"math-display\" src=\"index-39df8c07ebd3c197ddb45a759e3a0cbb.svg\"/></div>\n<p class=\"indent\">   По закону сохранения заряда:\n</p> <div class=\"math-display\">\n<img alt=\"5 = Z + 2 ⇒ Z =3\n\" class=\"math-display\" src=\"index-a80ed8c409066e293df87b9f9e3718a9.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5a2221c05ca75bb71262744bde294890.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession 221c05ca75bb71262744bde294890.svg", "index-762fc102e9981f0cf2fff063e9a828de.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415480/index-762fc102e9981f0cf2fff063e9a828de.svg", "index-feae74f7e6748d30b4debcf5bdbb3827.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415480/index-feae74f7e6748d30b4debcf5bdbb3827.svg", "index-e95bd91bbf29ac49576d2d6d5c72f22a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415481/index-e95bd91bbf29ac49576d2d6d5c72f22a.svg", "index-c528994a4f6c21500f420725db81a2f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415481/index-c528994a4f6c21500f420725db81a2f4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "2019", "Досрочная волна", "Задача с реального ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Досрочная волна 2019"], "created_at": "2026-07-03T13:27:44Z", "updated_at": "2026-07-03T14:46:30Z"}, {"id": 160161, "name": "Задача на квантовую физику. Первая часть. Банк ФИПИ A21154", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро урана захватывает нейтрон, в результате чего происходит ядерная реакция <img alt=\"1   238    A     1\n0n+ 92 U → Z X +20n  \" class=\"math\" src=\"index-7db8a3563d2e5a392addcf63f4f95d63.svg\"/> с образованием ядра\nхимического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-a97e51183f52a75225725078286a2a74.svg\"/>. Каков заряд образовавшегося ядра <img alt=\"Z  \" class=\"math\" src=\"index-8db5bb4f5e69fd34a72216c6f5a0f137.svg\"/> (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">В результате реакции выполняется закон сохранения заряда\n</p> <div class=\"math-display\">\n<img alt=\"92 +0 = Z + 2∗ 0⇒ Z = 92.\n\" class=\"math-display\" src=\"index-703f5aca40317d20111a3b4eea439d7a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7db8a3563d2e5a392addcf63f4f95d63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/342020/index-7db8a3563d2e5a392addcf63f4f95d63.svg", "index-a97e51183f52a75225725078286a2a74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/342020/index-a97e51183f52a75225725078286a2a74.svg", "index-8db5bb4f5e69fd34a72216c6f5a0f137.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/342020/index-8db5bb4f5e69fd34a72216c6f5a0f137.svg", "index-703f5aca40317d20111a3b4eea439d7a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/342021/index-703f5aca40317d20111a3b4eea439d7a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ"], "created_at": "2025-12-30T08:43:30Z", "updated_at": "2026-09-02T20:25:44Z"}, {"id": 114731, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график изменения числа ядер находящегося в пробирке радиоактивного изотопа цезия-137 с течением времени. Определите\nпериод полураспада этого изотопа. Ответ дайте в годах. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"114731.png\" width=\"421\"/></p></div>", "solution_html": "<p class=\"noindent\">Период полураспада - время, за которое распадается ровно половина вещества.<br/>Поскольку изначально было <img alt=\"6⋅1018  \" class=\"math\" src=\"index-ca3d3f4745411cea38cb866af909194b.svg\"/> вещества. <br/>То время полураспада равно 30 годам.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"114731.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235579/114731.png", "index-ca3d3f4745411cea38cb866af909194b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235581/index-ca3d3f4745411cea38cb866af909194b.svg"}, "tags": ["ЕГКР 954 Физика 27.03.2025"], "sources": ["ЕГКР 954 Физика 27.03.2025"], "created_at": "2025-04-02T18:32:54Z", "updated_at": "2026-04-08T18:04:27Z"}, {"id": 112695, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график изменения числа ядер находящегося в пробирке радиоактивного изотопа брома-82 с течением времени. Определите\nпериод полураспада этого изотопа. Ответ дайте в ч. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"112695.1.png\" width=\"421\"/></p></div>", "solution_html": "<p class=\"noindent\">Время, за которое останется ровно половина от начального количества ядер равно 36 ч.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"112695.1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232031/112695.1.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["ЕГКР 2025"], "created_at": "2025-03-28T00:38:11Z", "updated_at": "2026-04-19T13:35:46Z"}, {"id": 177412, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро лития захватывает альфа-частицу, в результате чего происходит ядерная реакция: <img alt=\"4    7    A    1\n2He+ 3Li→ Z X +0n  \" class=\"math\" src=\"index-fb3a509131dc7e92db03648bf0fda778.svg\"/> с образованием ядра\nхимического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-a97e51183f52a75225725078286a2a74.svg\"/>. Каков заряд образовавшегося ядра?\n</p>", "solution_html": "<p class=\"noindent\">Учитывая закон сохранения зарядовых чисел до реакции и после нее, можно записать равенство:\n</p> <div class=\"math-display\">\n<img alt=\"2 +3 = Z + 0.\n\" class=\"math-display\" src=\"index-4880e7165855db667239446bb7a648c1.svg\"/></div>\n<p class=\"indent\">   Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"Z = 5.\n\" class=\"math-display\" src=\"index-878341fea03cdb67099b4c0c0b7c8ee3.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fb3a509131dc7e92db03648bf0fda778.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386081/index-fb3a509131dc7e92db03648bf0fda778.svg", "index-a97e51183f52a75225725078286a2a74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386081/index-a97e51183f52a75225725078286a2a74.svg", "index-4880e7165855db667239446bb7a648c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386082/index-4880e7165855db667239446bb7a648c1.svg", "index-878341fea03cdb67099b4c0c0b7c8ee3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386082/index-878341fea03cdb67099b4c0c0b7c8ee3.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Ядерные реакции", "Банк ФИПИ ЕГЭ"], "sources": ["ФИПИ"], "created_at": "2026-04-10T16:38:31Z", "updated_at": "2026-09-02T20:29:25Z"}, {"id": 188331, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро радона <img alt=\"222\n86 Rn  \" class=\"math\" src=\"index-e6dd2d8475725b32d9a553dd181ce1d4.svg\"/> испытывает <img alt=\"α  \" class=\"math\" src=\"index-1d4e72134eb296bc905856cad9567d0d.svg\"/>-распад, при этом образуются <img alt=\"α  \" class=\"math\" src=\"index-6046b1655b44c27de7ed4e4dae8ecf94.svg\"/>-частица и ядро элемента <img alt=\"A\nZX.  \" class=\"math\" src=\"index-0d020ec752a9a3073fb8dde50bc979d7.svg\"/> Каков заряд образовавшегося\nядра Z (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Распишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"222    218   4\n86 Rn =84 X +2 He\n\" class=\"math-display\" src=\"index-ae69e7d3ecde43379e722a844036cc95.svg\"/></div>\n<p class=\"indent\">   Из закона сохранения суммы зарядовых чисел до и после реакции:\n</p> <div class=\"math-display\">\n<img alt=\"Z = 84\n\" class=\"math-display\" src=\"index-99bbb3cbc8a84857b5aa6ba77833a666.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e6dd2d8475725b32d9a553dd181ce1d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415234/index-e6dd2d8475725b32d9a553dd181ce1d4.svg", "index-1d4e72134eb296bc905856cad9567d0d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415234/index-1d4e72134eb296bc905856cad9567d0d.svg", "index-6046b1655b44c27de7ed4e4dae8ecf94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415234/index-6046b1655b44c27de7ed4e4dae8ecf94.svg", "index-0d020ec752a9a3073fb8dde50bc979d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415234/index-0d020ec752a9a3073fb8dde50bc979d7.svg", "index-ae69e7d3ecde43379e722a844036cc95.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415235/index-ae69e7d3ecde43379e722a844036cc95.svg", "index-99bbb3cbc8a84857b5aa6ba77833a666.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415235/index-99bbb3cbc8a84857b5aa6ba77833a666.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:03:58Z", "updated_at": "2026-07-03T13:25:55Z"}, {"id": 188357, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро бора может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"4    11    A    1\n2He + 5 B → Z X +0n  \" class=\"math\" src=\"index-e3354daf70e5c27fd721e8ec94672a54.svg\"/> с\nобразованием ядра химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-290889e3fe45f81d891569ecadad47ae.svg\"/>. Каков заряд образовавшегося ядра Z (в единицах элементарного\nзаряда)?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p> <div class=\"math-display\">\n<img alt=\"2+ 5= Z + 0⇒ Z = 7\n\" class=\"math-display\" src=\"index-b791f1cb99a58771cdea390bd6bc8fe8.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e3354daf70e5c27fd721e8ec94672a54.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415286/index-e3354daf70e5c27fd721e8ec94672a54.svg", "index-290889e3fe45f81d891569ecadad47ae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415286/index-290889e3fe45f81d891569ecadad47ae.svg", "index-b791f1cb99a58771cdea390bd6bc8fe8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415287/index-b791f1cb99a58771cdea390bd6bc8fe8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2019"], "created_at": "2026-07-03T11:25:20Z", "updated_at": "2026-09-02T20:23:52Z"}, {"id": 168655, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро изотопа полония <img alt=\"195\n84 Po  \" class=\"math\" src=\"index-83d0c4f779e41624f1fb976b94b17256.svg\"/> испытывает <img alt=\"α− \" class=\"math\" src=\"index-af415ad22db3c00f9eac0c257f9ba62d.svg\"/>распад, при этом образуются <img alt=\"α− \" class=\"math\" src=\"index-10ed07b89d633504acb0378f3143dcee.svg\"/>частица и ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-633add1c6bcd5a08cb9ba2db8262ad3c.svg\"/>. Каков\nзаряд <img alt=\"Z  \" class=\"math\" src=\"index-ab7fc90d37f157d3c2385068ff5b31be.svg\"/> ядра <img alt=\"X  \" class=\"math\" src=\"index-890b7d5c71f749a26f5a30b53790219a.svg\"/> (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения зарядового числа, тогда:\n</p> <div class=\"math-display\">\n<img alt=\"84 =Z + 2⇒  Z = 82.\n\" class=\"math-display\" src=\"index-5a2670c89ab4a4347c29f56e22ce85e2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-83d0c4f779e41624f1fb976b94b17256.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-83d0c4f779e41624f1fb976b94b17256.svg", "index-af415ad22db3c00f9eac0c257f9ba62d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-af415ad22db3c00f9eac0c257f9ba62d.svg", "index-10ed07b89d633504acb0378f3143dcee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-10ed07b89d633504acb0378f3143dcee.svg", "index-633add1c6bcd5a08cb9ba2db8262ad3c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-633add1c6bcd5a08cb9ba2db8262ad3c.svg", "index-ab7fc90d37f157d3c2385068ff5b31be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-ab7fc90d37f157d3c2385068ff5b31be.svg", "index-890b7d5c71f749a26f5a30b53790219a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362106/index-890b7d5c71f749a26f5a30b53790219a.svg", "index-5a2670c89ab4a4347c29f56e22ce85e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/362107/index-5a2670c89ab4a4347c29f56e22ce85e2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["ФИПИ"], "created_at": "2026-02-13T09:10:57Z", "updated_at": "2026-09-02T20:29:35Z"}, {"id": 102173, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости числа нераспавшихся ядер америция <img alt=\"238\n95 Am  \" class=\"math\" src=\"index-c2930f84f8000ebf9479b8157dea6b71.svg\"/> от времени. Чему равен период полураспада\nэтого изотопа америция? Ответ дайте в мин. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-ege-16-4-2.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Период полураспада характеризуется изменением количества ядер в 2 раза. Из графика видно, что период полураспада равен 100\nмин.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c2930f84f8000ebf9479b8157dea6b71.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210217/index-c2930f84f8000ebf9479b8157dea6b71.svg", "f-ege-16-4-2.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/210217/f-ege-16-4-2.png"}, "tags": [], "sources": ["ЕГКР 2025.№3"], "created_at": "2024-12-16T17:59:35Z", "updated_at": "2026-05-27T10:13:07Z"}, {"id": 188362, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции алюминия с <img alt=\"α− частицей  \" class=\"math\" src=\"index-4fc6efb8312658567a49e31718090ca3.svg\"/> <img alt=\"4    27    A    1\n2He +13Al → Z X +1p  \" class=\"math\" src=\"index-f2c3240ff4fcf8828f68a1bfd609ec59.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-aab483ca1c7a687141bebba73b241bad.svg\"/>.\nКаков заряд образовавшегося ядра <img alt=\"Z  \" class=\"math\" src=\"index-fec0cb45d27936e022d93e0aa65e21ef.svg\"/> (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">В соответствии с законом сохранения заряда получаем:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"2+ 13= Z + 1\n\" class=\"math-display\" src=\"index-8be96785f49a13fa6bcb9b7a5714b212.svg\"/></div>\n<p class=\"indent\">   Получим Z=14.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4fc6efb8312658567a49e31718090ca3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415297/index-4fc6efb8312658567a49e31718090ca3.svg", "index-f2c3240ff4fcf8828f68a1bfd609ec59.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415297/index-f2c3240ff4fcf8828f68a1bfd609ec59.svg", "index-aab483ca1c7a687141bebba73b241bad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415297/index-aab483ca1c7a687141bebba73b241bad.svg", "index-fec0cb45d27936e022d93e0aa65e21ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415297/index-fec0cb45d27936e022d93e0aa65e21ef.svg", "index-8be96785f49a13fa6bcb9b7a5714b212.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415298/index-8be96785f49a13fa6bcb9b7a5714b212.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["ЕГЭ 2026 основная волна, Центр"], "created_at": "2026-07-03T11:30:28Z", "updated_at": "2026-09-02T20:30:26Z"}, {"id": 91697, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа нераспавшихся ядер иридия <img alt=\"18771Ir  \" class=\"math\" src=\"index-bb311b9e8905d42402733d3269eeb409.svg\"/> от времени. Каков период полураспада этого изотопа?\nОтвет дайте в мин.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"91784.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Период полураспада - это время, за которое распадается половина начального числа радиоактивных атомов. Из\nграфика видно, что число нераспавшихся ядер иридия уменьшается вдвое за 5 минут. Это и есть искомый период\nполураспада.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bb311b9e8905d42402733d3269eeb409.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/182770/index-bb311b9e8905d42402733d3269eeb409.svg", "91784.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/182770/91784.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демидова 2019"], "created_at": "2024-07-08T08:59:50Z", "updated_at": "2026-04-27T08:04:46Z"}, {"id": 188337, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро азота может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"42He +174 N →AZ X +11 H  \" class=\"math\" src=\"index-9e8f1e73c94c4c3d231b72413a2673bc.svg\"/>\nобразуется ядро химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-0916d982da3ffeb159c7ea1dbed8b766.svg\"/> . Каков заряд образовавшегося ядра <img alt=\"Z  \" class=\"math\" src=\"index-9a249940158b1affd9fe7176bdd82ec1.svg\"/> (в единицах элементарного\nзаряда)?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения зарядового числа. То есть\n</p> <div class=\"math-display\">\n<img alt=\"Z = 2+ 7− 1= 8\n\" class=\"math-display\" src=\"index-a87a6f026dd9bbba383f92ecd6d63cda.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9e8f1e73c94c4c3d231b72413a2673bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415246/index-9e8f1e73c94c4c3d231b72413a2673bc.svg", "index-0916d982da3ffeb159c7ea1dbed8b766.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415246/index-0916d982da3ffeb159c7ea1dbed8b766.svg", "index-9a249940158b1affd9fe7176bdd82ec1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415246/index-9a249940158b1affd9fe7176bdd82ec1.svg", "index-a87a6f026dd9bbba383f92ecd6d63cda.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415247/index-a87a6f026dd9bbba383f92ecd6d63cda.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:07:39Z", "updated_at": "2026-07-03T13:19:11Z"}, {"id": 13661, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа <img alt=\"N  \" class=\"math\" src=\"index-1e6eb5e23d5b69838e628d078546fca0.svg\"/> нераспавшихся ядер некоторого изотопа от времени. Каков период полураспада этого изотопа?\nОтвет дайте в мин.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"13661.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Период полураспада равен 750 мин, так как за этот период распадется 50% ядер.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1e6eb5e23d5b69838e628d078546fca0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27593/index-1e6eb5e23d5b69838e628d078546fca0.svg", "13661.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27593/13661.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Основная волна 2020"], "created_at": "2021-12-07T12:49:17Z", "updated_at": "2026-05-17T08:23:12Z"}, {"id": 188340, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро бора может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"42He +115 B →AZ X +10 n  \" class=\"math\" src=\"index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg\"/> с\nобразованием ядра химического элемента. Каков заряд образовавшегося ядра Z (в единицах элементарного\nзаряда)?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения зарядового числа. То есть\n</p> <div class=\"math-display\">\n<img alt=\"Z = 2+ 5− 0= 7\n\" class=\"math-display\" src=\"index-ce1aa5278ce9a91ea4c81a00de78995c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415250/index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg", "index-ce1aa5278ce9a91ea4c81a00de78995c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415251/index-ce1aa5278ce9a91ea4c81a00de78995c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:09:10Z", "updated_at": "2026-07-03T13:19:43Z"}, {"id": 13656, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа нераспавшихся ядер эрбия <img alt=\"172\n68 Er  \" class=\"math\" src=\"index-f8aa75936a09616aa93a7928fdb3266d.svg\"/> от времени. Чему равен период полураспада этого изотопа эрбия?\nОтвет дайте в ч.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"13656.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Время, за которое останется ровно половина от начального количества ядер равно 50 ч.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f8aa75936a09616aa93a7928fdb3266d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27583/index-f8aa75936a09616aa93a7928fdb3266d.svg", "13656.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27583/13656.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2017", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демоверсия 2017", "Демидова 2019"], "created_at": "2021-12-07T12:45:49Z", "updated_at": "2026-04-19T12:58:32Z"}, {"id": 188343, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро бериллия может захватить гамма-квант, в результате чего происходит ядерная реакция <img alt=\"9   0    A    1\n4Be +0 γ → Z X + 0n  \" class=\"math\" src=\"index-5e778141143738af18017c1c3050dc93.svg\"/> с\nобразованием ядра химического элемента <img alt=\"AZX.  \" class=\"math\" src=\"index-c2011c4f9a8c91452037e6f2855b4c42.svg\"/> Каков заряд образовавшегося ядра Z (в единицах элементарного\nзаряда)?\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону сохранения суммы зарядовых чисел до и после реакции:\n</p> <div class=\"math-display\">\n<img alt=\"4+ 0= Z + 0⇒ Z = 4\n\" class=\"math-display\" src=\"index-12c4a1fed518a6d288e32fba2791e25a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5e778141143738af18017c1c3050dc93.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415256/index-5e778141143738af18017c1c3050dc93.svg", "index-c2011c4f9a8c91452037e6f2855b4c42.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415256/index-c2011c4f9a8c91452037e6f2855b4c42.svg", "index-12c4a1fed518a6d288e32fba2791e25a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415257/index-12c4a1fed518a6d288e32fba2791e25a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:11:41Z", "updated_at": "2026-07-03T13:17:37Z"}, {"id": 91784, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа нераспавшихся ядер иридия <img alt=\"18771Ir  \" class=\"math\" src=\"index-b4e3a01363affd9985cd1622fb5824ee.svg\"/> от времени. За какое время распадётся примерно 75%\nядер иридия? Ответ дайте в мин.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"91784.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Период полураспада - время, за которое распадается половина начального числа радиоактивных атомов. Из графика видно, что\nчисло нераспавшихся ядер иридия уменьшается вдвое за 5 минут. А еще через 5 минут распадается половина от оставшейся\nполовины. Значит за 10 мин распадется примерно 75% ядер иридия.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b4e3a01363affd9985cd1622fb5824ee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/183002/index-b4e3a01363affd9985cd1622fb5824ee.svg", "91784.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/183002/91784.png"}, "tags": [], "sources": ["Демидова 2019"], "created_at": "2024-07-09T10:12:10Z", "updated_at": "2026-04-28T09:10:39Z"}, {"id": 188344, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Элемент менделевий был получен при бомбардировке а-частицами ядер элемента X в соответствии с реакцией <img alt=\"   4     256     1\nX + 2He → 101 Md +0n  \" class=\"math\" src=\"index-05f0c2d4f7d0af52977b2a8a6de57762.svg\"/>\nУкажите зарядовое число элемента X.\n</p>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма зарядовых чисел до реакции равны соответствующим сумме зарядовых\nчисел после реакции. То есть для данной ядерной реакции можно записать равенство:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Z +  2 = 101 + 0\n\" class=\"math-display\" src=\"index-d43419b51abcbf0e29d309db0bf206b2.svg\"/></div>\n<p class=\"indent\">   Следовательно, Z=99\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-05f0c2d4f7d0af52977b2a8a6de57762.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415260/index-05f0c2d4f7d0af52977b2a8a6de57762.svg", "index-d43419b51abcbf0e29d309db0bf206b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415261/index-d43419b51abcbf0e29d309db0bf206b2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:12:37Z", "updated_at": "2026-07-03T13:08:27Z"}, {"id": 102727, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Дан график зависимости числа нераспавшихся ядер некоторого изотопа от времени. Через какое время останутся\nнераспавшимися примерно 12,5% ядер этого изотопа? Ответ дайте в мин.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"102727.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Запишем закон радиоактивного распада\n</p> <div class=\"math-display\">\n<img alt=\"          t-\nN = N0 ⋅2− T ,\n\" class=\"math-display\" src=\"index-b6301e4243fd784d8c2e355d64a5e795.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg\"/> - число не распавшихся ядер через время <img alt=\"t  \" class=\"math\" src=\"index-4a976f98ef99c81f60e2bfc74b3dfb72.svg\"/>, <img alt=\"N0  \" class=\"math\" src=\"index-733417f84430549d0b16ef3be73f0fa4.svg\"/> - начальное число ядер, <img alt=\"T  \" class=\"math\" src=\"index-7ee4ec80adf25405fd4517830a887cb8.svg\"/> - период полураспада.<br/>Период полураспада - время, за которое распадается половина начального числа радиоактивных атомов. Из графика видно, что\nчисло нераспавшихся ядер иридия уменьшается вдвое за <img alt=\"T = 5  \" class=\"math\" src=\"index-1fa400889f6bb6abe3aaf6f41ac174e2.svg\"/> минут.<br/>Из условия следует, что <img alt=\"N--\nN0 = 0,125  \" class=\"math\" src=\"index-79d3f58ce09c1ad48564dde171b00cb5.svg\"/>.<br/>Тогда время, за которое останутся нераспавшимися примерно 12,5% ядер этого изотопа, вычисляется следующим\nобразом\n</p> <div class=\"math-display\">\n<img alt=\"           t\n       − 5 мин\n0,125 =2       .\n\" class=\"math-display\" src=\"index-8bf2ed6a0b4218645eff822d09baa8df.svg\"/></div>\n<p class=\"indent\">   Решая это уравнение, получим\n</p> <div class=\"math-display\">\n<img alt=\"t =15 мин.\n\" class=\"math-display\" src=\"index-d193a8eb087c5e992083e621068d2e08.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"102727.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211677/102727.png", "index-b6301e4243fd784d8c2e355d64a5e795.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-b6301e4243fd784d8c2e355d64a5e795.svg", "index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg", "index-4a976f98ef99c81f60e2bfc74b3dfb72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-4a976f98ef99c81f60e2bfc74b3dfb72.svg", "index-733417f84430549d0b16ef3be73f0fa4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-733417f84430549d0b16ef3be73f0fa4.svg", "index-7ee4ec80adf25405fd4517830a887cb8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-7ee4ec80adf25405fd4517830a887cb8.svg", "index-1fa400889f6bb6abe3aaf6f41ac174e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-1fa400889f6bb6abe3aaf6f41ac174e2.svg", "index-79d3f58ce09c1ad48564dde171b00cb5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-79d3f58ce09c1ad48564dde171b00cb5.svg", "index-8bf2ed6a0b4218645eff822d09baa8df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-8bf2ed6a0b4218645eff822d09baa8df.svg", "index-d193a8eb087c5e992083e621068d2e08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/211678/index-d193a8eb087c5e992083e621068d2e08.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демидова 2020"], "created_at": "2024-12-25T10:17:31Z", "updated_at": "2026-05-27T10:14:10Z"}, {"id": 188347, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате реакции синтеза ядра дейтерия с ядром <img alt=\"A\nZX  \" class=\"math\" src=\"index-608bdafa000fbf67e202a17e89020ffc.svg\"/> образуется ядро бора и нейтрон в соответствии с реакцией:\n<img alt=\"21H +AZ X →105 B +10n.  \" class=\"math\" src=\"index-30b012744018acb9fbc7e7957968fdab.svg\"/>\n</p><p class=\"indent\">   Укажите зарядовое число Z ядра X.\n</p>", "solution_html": "<p class=\"noindent\">Учитывая закон сохранения зарядовых чисел до реакции и после нее, можно записать равенство:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"1+ Z = 5 +0\n\" class=\"math-display\" src=\"index-ab1939af2c6438e69c36111c12ef7450.svg\"/></div>\n<p class=\"indent\">   Следовательно, Z=4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-608bdafa000fbf67e202a17e89020ffc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415265/index-608bdafa000fbf67e202a17e89020ffc.svg", "index-30b012744018acb9fbc7e7957968fdab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415265/index-30b012744018acb9fbc7e7957968fdab.svg", "index-ab1939af2c6438e69c36111c12ef7450.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415266/index-ab1939af2c6438e69c36111c12ef7450.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:14:31Z", "updated_at": "2026-07-03T13:06:36Z"}, {"id": 178852, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"v-de-2020-1-pict19.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Укажите число протонов в ядре наименее распространённого стабильного изотопа кальция.\n</p>", "solution_html": "<p class=\"noindent\">Число протонов в ядре кальция равно 20. Вне зависимости от того, какой это изотоп, число протонов остается постоянным.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390141/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["ЕГКР 21.12.2023-2"], "created_at": "2026-04-20T18:13:00Z", "updated_at": "2026-09-22T08:40:41Z"}, {"id": 186283, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число протонов в ядре самого распространённого изотопа калия.\n</p>", "solution_html": "<p class=\"noindent\">У самого распространенного изотопа калия массовое число - 39, зарядовое число - 19.<br/>Число протонов равно зарядовому числу, то есть 19. <br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/409749/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["ЕГЭ 2024, досрочная волна"], "created_at": "2026-06-17T20:45:57Z", "updated_at": "2026-06-27T11:09:06Z"}, {"id": 186444, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число нейтронов в ядре самого распространённого изотопа калия.\n</p>", "solution_html": "<p class=\"noindent\">У самого распространенного изотопа калия массовое число - 39, зарядовое число - 19.<br/>Число нейтронов равно разности между массовыми числом и числом протонов, то есть 20.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410483/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["ЕГЭ 2024, досрочная волна"], "created_at": "2026-06-21T14:01:15Z", "updated_at": "2026-06-21T14:26:05Z"}, {"id": 188348, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Деление ядра урана тепловыми нейтронами описывается реакцией <img alt=\"1   235    A    139      1\n0n+ 92 U → Z X + 56 Ba + 30n+ 7γ.  \" class=\"math\" src=\"index-db314b79e3512964e4098e3727840b0e.svg\"/> При этом образовалось ядро\nхимического элемента Укажите зарядовое число Z элемента X.\n</p>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма зарядовых чисел до реакции равна сумме зарядовых чисел после реакции.\nТо есть для данной ядерной реакции можно записать равенство:\n</p> <div class=\"math-display\">\n<img alt=\"0 + 92 = Z +  56 + 0\n\" class=\"math-display\" src=\"index-ba5c73394adc3bc1a1c6d34489af3b27.svg\"/></div>\n<p class=\"indent\">   Следовательно, Z=36.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-db314b79e3512964e4098e3727840b0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415268/index-db314b79e3512964e4098e3727840b0e.svg", "index-ba5c73394adc3bc1a1c6d34489af3b27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415269/index-ba5c73394adc3bc1a1c6d34489af3b27.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T11:15:41Z", "updated_at": "2026-07-03T13:04:24Z"}, {"id": 151475, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число протонов и число нейтронов в ядре самого распространённого изотопа кальция.\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------|\n|Ч-исло-протон-ов-|Ч-исло н-ейтронов|\n---------------------------------|\n\" class=\"math-display\" src=\"index-6e2a4efc8980a37d5ed4137ba0037d30.svg\"/></div>", "solution_html": "<p class=\"noindent\">Наиболее распространенный изотоп кальция имеет массовое число, равное 40 и порядковый номер 20. Порядковый номер показывает\nчисло протонов в ядре изотопа, а массовое число – сумму числа протонов и нейтронов. Следовательно, число нейтронов в изотопе\nкальция равно 20.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/321115/v-de-2020-1-pict19.png", "index-6e2a4efc8980a37d5ed4137ba0037d30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/321115/index-6e2a4efc8980a37d5ed4137ba0037d30.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2025-11-14T10:58:03Z", "updated_at": "2026-06-21T14:27:02Z"}, {"id": 176014, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Период <img alt=\"T  \" class=\"math\" src=\"index-a3c9ec22edb4a5bda1ef4c0b0dbcd7f5.svg\"/> полураспада изотопа некоторого вещества равен <img alt=\"2,5  \" class=\"math\" src=\"index-4123a855dbbbd72b16937a1b402fa760.svg\"/> мкс. Изначально в образце содержится <img alt=\"0,6  \" class=\"math\" src=\"index-57ffb21f2e0ac2cbabef72747a9e83fe.svg\"/> мкмоль изотопа.\nСколько ой системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число нейтронов в ядре самого распространённого изотопа кальция.\n</p>", "solution_html": "<p class=\"noindent\">Наиболее распространенный изотоп кальция имеет массовое число, равное 40 и порядковый номер 20. Порядковый номер показывает\nчисло протонов в ядре изотопа, а массовое число – сумму числа протонов и нейтронов. Следовательно, число нейтронов в изотопе\nкальция равно 20.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410491/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2026-06-21T14:12:13Z", "updated_at": "2026-06-21T14:21:54Z"}, {"id": 166262, "name": "Радиоактивный распад", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Чему равен период (в годах) полураспада ядер изотопа <img alt=\"22\n11Na  \" class=\"math\" src=\"index-4678deae3ce66cda2dd86d5a55867ffe.svg\"/>, если за 9 лет исходно большое число нераспавшихся ядер атомов\nэтого изотопа уменьшилось в 8 раз? Ответ дайте в годаx (лет).\n</p>", "solution_html": "<p class=\"noindent\">Закон радиоактивного распада:\n</p> <div class=\"math-display\">\n<img alt=\"          t-\nN = N0 ⋅2− T ,\n\" class=\"math-display\" src=\"index-b6301e4243fd784d8c2e355d64a5e795.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg\"/> — количество оставшихся ядер, <img alt=\"N0  \" class=\"math\" src=\"index-409411ac15db60ae2518373f2751b89b.svg\"/> — начальное количество ядер, <img alt=\"t  \" class=\"math\" src=\"index-1eb102a25dfefb8921ce16756022d02b.svg\"/> — время, <img alt=\"T  \" class=\"math\" src=\"index-5d0d6f3d83cd4ff418c5bde25e43a437.svg\"/> — период полураспада.<br/>Тогда из условия: <img alt=\"N0-=8\nN  \" class=\"math\" src=\"index-477d192fa75a90372d881c7f91f899df.svg\"/>.<br/>Тогда период полураспада равен:\n</p> <div class=\"math-display\">\n<img alt=\"    ---(t--)   --9--\nT =      N0- = ln2(8) = 3 года\n    ln2  N\n\" class=\"math-display\" src=\"index-bc8d29138266d19b48ad225ee18a8db2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4678deae3ce66cda2dd86d5a55867ffe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355782/index-4678deae3ce66cda2dd86d5a55867ffe.svg", "index-b6301e4243fd784d8c2e355d64a5e795.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-b6301e4243fd784d8c2e355d64a5e795.svg", "index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg", "index-409411ac15db60ae2518373f2751b89b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-409411ac15db60ae2518373f2751b89b.svg", "index-1eb102a25dfefb8921ce16756022d02b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-1eb102a25dfefb8921ce16756022d02b.svg", "index-5d0d6f3d83cd4ff418c5bde25e43a437.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-5d0d6f3d83cd4ff418c5bde25e43a437.svg", "index-477d192fa75a90372d881c7f91f899df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-477d192fa75a90372d881c7f91f899df.svg", "index-bc8d29138266d19b48ad225ee18a8db2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355783/index-bc8d29138266d19b48ad225ee18a8db2.svg"}, "tags": ["Банк ФИПИ ЕГЭ"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-01-30T20:04:24Z", "updated_at": "2026-09-02T20:43:41Z"}, {"id": 175260, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д.И. Менделеева. Под названием каждого элемента приведены\nмассовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в процентах)\nраспространённость соответствующего изотопа в природе. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Запишите число нейтронов в ядре наименее распространённого стабильного изотопа калия.\n</p>", "solution_html": "<p class=\"noindent\">Наименее распространённый стабильный изотоп калия имеет массовое число 41. Зарядовое число составляет 19, это число протонов\nв ядре. Тогда число нейтронов составляет <img alt=\"41− 19= 22.  \" class=\"math\" src=\"index-b7da922d178c5190ca6df749afd9f2a8.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379951/v-de-2020-1-pict19.png", "index-b7da922d178c5190ca6df749afd9f2a8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379952/index-b7da922d178c5190ca6df749afd9f2a8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["ЕГКР 954 Физика 26.03.2026"], "created_at": "2026-03-26T16:35:26Z", "updated_at": "2026-05-26T18:19:07Z"}, {"id": 175292, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д.И. Менделеева. Под названием каждого элемента приведены\nмассовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в процентах)\nраспространённость соответствующего изотопа в природе. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/></p></div>\n<p class=\"noindent\">Определите число нейтронов в ядре наименее распространённого из упомянутых изотопов магния.\n</p>", "solution_html": "<p class=\"noindent\">Наименее распространённый из упомянутых изотоп магния имеет массовое число 25. Зарядовое число составляет 12, это число\nпротонов в ядре. Тогда число нейтронов составляет <img alt=\"25− 12= 13.  \" class=\"math\" src=\"index-72e2e92b632551a9836e12b6b8eedbe1.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/380019/v-de-2020-1-pict19.png", "index-72e2e92b632551a9836e12b6b8eedbe1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/380020/index-72e2e92b632551a9836e12b6b8eedbe1.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["ЕГКР 956 Физика 26.03.2026"], "created_at": "2026-03-26T19:22:07Z", "updated_at": "2026-04-28T09:07:14Z"}, {"id": 125768, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Период <img alt=\"T  \" class=\"math\" src=\"index-34ef1b2b9fdaad5e728cd9658f92d63f.svg\"/> полураспада изотопа натрия <img alt=\"22\n11Na  \" class=\"math\" src=\"index-b3459bef3ba12b1cec761cf18c21e8b5.svg\"/> равен 2,6 года. Если изначальная масса этого изотопа составила 104 мг, то\nпримерно какова она будет через 5,2 года? Ответ дайте в мг.\n</p>", "solution_html": "<p class=\"noindent\">Закон радиоактивного распада:\n</p> <div class=\"math-display\">\n<img alt=\"        − t\nN = N0 ⋅2 T,\n\" class=\"math-display\" src=\"index-358f1cb0dc724a27f633d7a12f6e303a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-9498acd2f2024619d4d54f53fed4754b.svg\"/> — масса оставшегося изотопа, <img alt=\"N0  \" class=\"math\" src=\"index-947578fe30725266cdc651ea99ed54b4.svg\"/> — начальная масса, <img alt=\"t  \" class=\"math\" src=\"index-82aa1e94d610952b27f22ce378a12d8c.svg\"/> — время, <img alt=\"T  \" class=\"math\" src=\"index-c4062f7cf172fd166b49a11de68aac29.svg\"/> — период полураспада.\n</p><p class=\"indent\">   За время <img alt=\"t= 5,2  \" class=\"math\" src=\"index-a22ad655c20217eaa419735c81c9e136.svg\"/> года количество изотопа изменится в 4 раза:\n</p> <div class=\"math-display\">\n<img alt=\"         5,2   104\nN = N0⋅2−2,6 = -4-= 26 мг.\n\" class=\"math-display\" src=\"index-c84bf4b7f2240b6f3e3e4ec7f4141f15.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-34ef1b2b9fdaad5e728cd9658f92d63f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259284/index-34ef1b2b9fdaad5e728cd9658f92d63f.svg", "index-b3459bef3ba12b1cec761cf18c21e8b5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259284/index-b3459bef3ba12b1cec761cf18c21e8b5.svg", "index-358f1cb0dc724a27f633d7a12f6e303a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259285/index-358f1cb0dc724a27f633d7a12f6e303a.svg", "index-9498acd2f2024619d4d54f53fed4754b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259285/index-9498acd2f2024619d4d54f53fed4754b.svg", "index-947578fe30725266cdc651ea99ed54b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259285/index-947578fe30725266cdc651ea99ed54b4.svg", "index-82aa1e94d610952b27f22ce378a12d8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259285/index-82aa1e94d610952b27f22ce378a12d8c.svg", "index-c4062f7cf172fd166b49a11de68aac29.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/259285/index-c4062f7cf172fd166b49a11de68aac29.svg", "index-a22ad655c20217eaa419735c81c9e136.svg": "https://3.shkolkovo.online/api/latex-service/ n</p>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"212     208     4\n83 Bi = 81 X + 2 He\n\" class=\"math-display\" src=\"index-e327a91324922b9742e474e5c19d619b.svg\"/></div>\n<p class=\"indent\">   Число нейтронов равно разности массового числа и зарядового и равно 208-81=127.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d27e157da8ea77dce4995bf4564a1868.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412260/index-d27e157da8ea77dce4995bf4564a1868.svg", "index-b920f531ebf96277b61fbff5c3b8e113.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412260/index-b920f531ebf96277b61fbff5c3b8e113.svg", "index-e327a91324922b9742e474e5c19d619b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412261/index-e327a91324922b9742e474e5c19d619b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демидова 2019"], "created_at": "2026-06-27T11:31:27Z", "updated_at": "2026-09-02T20:36:23Z"}, {"id": 188488, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Радиоактивный изотоп висмута <img alt=\"28123 Bi.  \" class=\"math\" src=\"index-ac5de183d99c127ecab7ac497b5d48c9.svg\"/> претерпевает <img alt=\"β  \" class=\"math\" src=\"index-e974494cd10464e47a679272daa4e5c9.svg\"/>-распад. Укажите число нейтронов в образовавшемся\nядре.\n</p>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"212     212     0\n83 Bi = 84 X  + −1 e + ν\n\" class=\"math-display\" src=\"index-c7e2a68230fa3ab659e1e5bf4278127f.svg\"/></div>\n<p class=\"indent\">   Число нейтронов равно разности массового числа и зарядового и равно 212-84=128.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ac5de183d99c127ecab7ac497b5d48c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415549/index-ac5de183d99c127ecab7ac497b5d48c9.svg", "index-e974494cd10464e47a679272daa4e5c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415549/index-e974494cd10464e47a679272daa4e5c9.svg", "index-c7e2a68230fa3ab659e1e5bf4278127f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415550/index-c7e2a68230fa3ab659e1e5bf4278127f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T14:20:45Z", "updated_at": "2026-09-02T20:37:01Z"}, {"id": 92495, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Запишите в таблицу число протонов и число нейтронов в ядре скандия.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------|\n|Ч-исло-протон-ов-|Ч-исло н-ейтронов|\n|               |                |\n---------------------------------\n\" class=\"math-display\" src=\"index-388c380f808598658b5f70cf5ba436b3.svg\"/></div>", "solution_html": "<p class=\"noindent\">Наиболее распространенный изотоп скандия имеет массовое число, равное 45 и порядковый номер 21. Порядковый номер показывает\nчисло протонов в ядре изотопа, а массовое число – сумму числа протонов и нейтронов. Следовательно, число нейтронов в изотопе\nкальция равно 45 - 21 = 24.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v де <img alt=\"NA  \" class=\"math\" src=\"index-546e398a49db6ab612e9e32b8d1b7b64.svg\"/> – число Авогадро.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"ν-=  N-=  1⇒ ν = ν0= 0,2-моль= 0,025 моль\nν0   N0   8      8       8\n\" class=\"math-display\" src=\"index-a6bed039bc77a8d212f2556e2ebf68d8.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b6301e4243fd784d8c2e355d64a5e795.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-b6301e4243fd784d8c2e355d64a5e795.svg", "index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg", "index-409411ac15db60ae2518373f2751b89b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-409411ac15db60ae2518373f2751b89b.svg", "index-1eb102a25dfefb8921ce16756022d02b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-1eb102a25dfefb8921ce16756022d02b.svg", "index-5d0d6f3d83cd4ff418c5bde25e43a437.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-5d0d6f3d83cd4ff418c5bde25e43a437.svg", "index-79e8b51928e104cfaeddb1a32f076935.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-79e8b51928e104cfaeddb1a32f076935.svg", "index-1d446ddc1a625f9b83bfb53299349e5f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-1d446ddc1a625f9b83bfb53299349e5f.svg", "index-7715727cde9f167c3ed049313ebe8d6f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-7715727cde9f167c3ed049313ebe8d6f.svg", "index-546e398a49db6ab612e9e32b8d1b7b64.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-546e398a49db6ab612e9e32b8d1b7b64.svg", "index-a6bed039bc77a8d212f2556e2ebf68d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196930/index-a6bed039bc77a8d212f2556e2ebf68d8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "К 63\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Запишите число нейтронов в ядре самого распространённого изотопа скандия.\n</p>", "solution_html": "<p class=\"noindent\">Наиболее распространенный изотоп скандия имеет массовое число, равное 45 и порядковый номер 21. Порядковый номер показывает\nчисло протонов в ядре изотопа, а массовое число – сумму числа протонов и нейтронов. Следовательно, число нейтронов в изотопе\nскандия равно 45 - 21 = 24.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410493/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2026-06-21T14:13:28Z", "updated_at": "2026-06-27T10:49:50Z"}, {"id": 92331, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Запишите в таблицу число протонов и число нейтронов в ядре алюминия.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------|\n|Ч-исло-протон-ов-|Ч-исло н-ейтронов|\n|               |                |\n---------------------------------\n\" class=\"math-display\" src=\"index-388c380f808598658b5f70cf5ba436b3.svg\"/></div>", "solution_html": "<p class=\"noindent\">Количество протонов в ядре равно зарядовому числу. То есть, число протонов равно 13.<br/>Общее число протонов и нейтронов равно массовому числу. Для алюминия массовое число равно 27. Тогда нейтронов в ядре\nалюминия 27-13=14.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184958/v-de-2020-1-pict19.png", "index-388c380f808598658b5f70cf5ba436b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/184958/index-388c380f808598658b5f70cf5ba436b3.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демидова 2019"], "created_at": "2024-07-21T07:09:39Z", "updated_at": "2026-06-17T20:58:19Z"}, {"id": 186289, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Запишите число протонов в ядре алюминия.\n</p>", "solution_html": "<p class=\"noindent\">Количество протонов в ядре равно зарядовому числу. То есть, число протонов равно 13.<br/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/409762/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демидова 2019"], "created_at": "2026-06-17T20:57:48Z", "updated_at": "2026-06-21T14:16:17Z"}, {"id": 186450, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен ф
