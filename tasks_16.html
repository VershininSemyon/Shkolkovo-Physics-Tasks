//3.shkolkovo.online/api/latex-service/v1/GetSession/412246/index-7134f7940ac4a21138d34fad928eca5a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2026-06-27T11:06:19Z", "updated_at": "2026-06-27T11:44:14Z"}, {"id": 158964, "name": "ЕГКР - 16", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро азота захватывает нейтрон, в результате чего происходит ядерная реакция <img alt=\"1  14    A    1\n0n+7 N → Z X +1p  \" class=\"math\" src=\"index-27f320e57bc4a001617062f64e47023a.svg\"/> с образованием ядра\nхимического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-a97e51183f52a75225725078286a2a74.svg\"/>. Каково массовое число A образовавшегося ядра X (в атомных единицах массы)?\n</p>", "solution_html": "<p class=\"noindent\">Для определения заряда ядра используется закон сохранения электрического заряда в ядерных реакциях.<br/>Рассмотрим реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"10n+ 174 N → AZX + 11p\n\" class=\"math-display\" src=\"index-c371c37d6a0cb060458b69c50bd1e3fd.svg\"/></div>\n<p class=\"indent\">   Суммарная масса слева:\n</p> <div class=\"math-display\">\n<img alt=\"A= 1 +14 =15\n\" class=\"math-display\" src=\"index-7936cb15278ebaa9bcd86c69a91eab1e.svg\"/></div>\n<p class=\"indent\">   Суммарная масса справа:\n</p> <div class=\"math-display\">\n<img alt=\"A = AX + 1\n\" class=\"math-display\" src=\"index-9915ba1f250d425a7114f6a44262cc08.svg\"/></div>\n<p class=\"indent\">   Таким образом:\n</p> <div class=\"math-display\">\n<img alt=\"AX + 1= 15\n\" class=\"math-display\" src=\"index-3c11cfd15141116438cf3229bfafd8df.svg\"/></div>\n<p class=\"indent\">   Откуда:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"AX  =14\n\" class=\"math-display\" src=\"index-edfd83f8da3a477899012ece25d03b2a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-27f320e57bc4a001617062f64e47023a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338922/index-27f320e57bc4a001617062f64e47023a.svg", "index-a97e51183f52a75225725078286a2a74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338922/index-a97e51183f52a75225725078286a2a74.svg", "index-c371c37d6a0cb060458b69c50bd1e3fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338923/index-c371c37d6a0cb060458b69c50bd1e3fd.svg", "index-7936cb15278ebaa9bcd86c69a91eab1e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338923/index-7936cb15278ebaa9bcd86c69a91eab1e.svg", "index-9915ba1f250d425a7114f6a44262cc08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338923/index-9915ba1f250d425a7114f6a44262cc08.svg", "index-3c11cfd15141116438cf3229bfafd8df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338923/index-3c11cfd15141116438cf3229bfafd8df.svg", "index-edfd83f8da3a477899012ece25d03b2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338923/index-edfd83f8da3a477899012ece25d03b2a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["ЕГКР 18.12.25"], "created_at": "2025-12-19T06:30:03Z", "updated_at": "2026-05-26T18:54:08Z"}, {"id": 158790, "name": "ЕГКР - 16", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро гелия захватывает нейтрон, в результате чего происходит ядерная реакция <img alt=\"1   3    A    1\n0n+ 2He →Z X +1 p  \" class=\"math\" src=\"index-adcfe553bd596e2899069c4a6e7d362d.svg\"/> с образованием ядра\nхимического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-a97e51183f52a75225725078286a2a74.svg\"/>. Каков заряд образовавшегося ядра (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Для определения заряда ядра используется закон сохранения электрического заряда в ядерных реакциях.<br/>Рассмотрим реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"10n+ 32He→ AZX  +11p\n\" class=\"math-display\" src=\"index-2d6cbdf90b33cb550a082dad78b31401.svg\"/></div>\n<p class=\"indent\">   Суммарный заряд слева:\n</p> <div class=\"math-display\">\n<img alt=\"Z = 0+ 2 =2\n\" class=\"math-display\" src=\"index-152b0150d2596cdb19c231363ed190db.svg\"/></div>\n<p class=\"indent\">   Суммарный заряд справа:\n</p> <div class=\"math-display\">\n<img alt=\"Z = ZX + 1\n\" class=\"math-display\" src=\"index-5bb7cd711590e1de08ad6e54c6dee94d.svg\"/></div>\n<p class=\"indent\">   Таким образом:\n</p> <div class=\"math-display\">\n<img alt=\"ZX + 1 =2\n\" class=\"math-display\" src=\"index-c81b73455550c556a3458918ae87057d.svg\"/></div>\n<p class=\"indent\">   Откуда:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"ZX = 1\n\" class=\"math-display\" src=\"index-15185edbcb46cfc89badcd92e86329ee.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-adcfe553bd596e2899069c4a6e7d362d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338439/index-adcfe553bd596e2899069c4a6e7d362d.svg", "index-a97e51183f52a75225725078286a2a74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338439/index-a97e51183f52a75225725078286a2a74.svg", "index-2d6cbdf90b33cb550a082dad78b31401.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338440/index-2d6cbdf90b33cb550a082dad78b31401.svg", "index-152b0150d2596cdb19c231363ed190db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338440/index-152b0150d2596cdb19c231363ed190db.svg", "index-5bb7cd711590e1de08ad6e54c6dee94d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338440/index-5bb7cd711590e1de08ad6e54c6dee94d.svg", "index-c81b73455550c556a3458918ae87057d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338440/index-c81b73455550c556a3458918ae87057d.svg", "index-15185edbcb46cfc89badcd92e86329ee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/338440/index-15185edbcb46cfc89badcd92e86329ee.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["ЕГКР 18.12.25"], "created_at": "2025-12-18T10:18:10Z", "updated_at": "2026-04-19T13:25:09Z"}, {"id": 188425, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Элемент менделевий был получен при бомбардировке а-частицами ядер элемента X в соответствии с реакцией <img alt=\"   4     256     1\nX + 2He → 101 Md +0n  \" class=\"math\" src=\"index-05f0c2d4f7d0af52977b2a8a6de57762.svg\"/>\nУкажите массовое число элемента X.\n</p>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма массовых чисел до реакции равны соответствующим сумме массовых\nчисел после реакции. То есть для данной ядерной реакции можно записать равенства:\n</p> <div class=\"math-display\">\n<img alt=\"A +  4 = 256 + 1\n\" class=\"math-display\" src=\"index-2e1fb686d4c6a5bd6f0780d3e0b1c00a.svg\"/></div>\n<p class=\"indent\">   A=253\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-05f0c2d4f7d0af52977b2a8a6de57762.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415425/index-05f0c2d4f7d0af52977b2a8a6de57762.svg", "index-2e1fb686d4c6a5bd6f0780d3e0b1c00a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415426/index-2e1fb686d4c6a5bd6f0780d3e0b1c00a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": [], "created_at": "2026-07-03T13:07:19Z", "updated_at": "2026-09-02T20:31:04Z"}, {"id": 188448, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро радона <img alt=\"222\n86 Rn  \" class=\"math\" src=\"index-2f0d1428990798a2ae64c9827784b170.svg\"/> испытывает <img alt=\"α  \" class=\"math\" src=\"index-1318096b52a565aefc95ed082e7074e4.svg\"/>-распад, при этом образуются <img alt=\"α  \" class=\"math\" src=\"index-2c0328fa5dc4cb452fe0643ba40109ff.svg\"/>-частица и ядро элемента <img alt=\"A\nZX.  \" class=\"math\" src=\"index-9eebd583667a1e7ed517503be1e0c7b6.svg\"/> Каково массовое число\nобразовавшегося ядра А?\n</p>", "solution_html": "<p class=\"noindent\">Распишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"222    218   4\n86 Rn =84 X +2 He\n\" class=\"math-display\" src=\"index-ae69e7d3ecde43379e722a844036cc95.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A =218\n\" class=\"math-display\" src=\"index-1f5ac3ee40e3821604d37302e33c569d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2f0d1428990798a2ae64c9827784b170.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415471/index-2f0d1428990798a2ae64c9827784b170.svg", "index-1318096b52a565aefc95ed082e7074e4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415471/index-1318096b52a565aefc95ed082e7074e4.svg", "index-2c0328fa5dc4cb452fe0643ba40109ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415471/index-2c0328fa5dc4cb452fe0643ba40109ff.svg", "index-9eebd583667a1e7ed517503be1e0c7b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415471/index-9eebd583667a1e7ed517503be1e0c7b6.svg", "index-ae69e7d3ecde43379e722a844036cc95.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415472/index-ae69e7d3ecde43379e722a844036cc95.svg", "index-1f5ac3ee40e3821604d37302e33c569d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415472/index-1f5ac3ee40e3821604d37302e33c569d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T13:24:38Z", "updated_at": "2026-09-02T20:31:31Z"}, {"id": 188459, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"2   2    A    1\n1H +1 H →Z X +1 p  \" class=\"math\" src=\"index-f532e88c7a6b5d6b39d0f8b75cdc0103.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-eecf9f7c401cf57c341240740b662eab.svg\"/>. Каково массовое число\nобразовавшегося ядра A?\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону сохранения массового числа:\n</p> <div class=\"math-display\">\n<img alt=\"2+ 2= A + 1⇒ A = 3\n\" class=\"math-display\" src=\"index-2361206f155326514e2e6ec5a1def881.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f532e88c7a6b5d6b39d0f8b75cdc0103.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415491/index-f532e88c7a6b5d6b39d0f8b75cdc0103.svg", "index-eecf9f7c401cf57c341240740b662eab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415491/index-eecf9f7c401cf57c341240740b662eab.svg", "index-2361206f155326514e2e6ec5a1def881.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415492/index-2361206f155326514e2e6ec5a1def881.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2021", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2021", "ЕГЭ 2024, основная волна"], "created_at": "2026-07-03T13:36:50Z", "updated_at": "2026-09-02T20:33:31Z"}, {"id": 188461, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"19   A    4     16\n9 F + Z X → 2 He + 8 O  \" class=\"math\" src=\"index-e4a1f276b9d310704f3335e42726c67a.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-735da3eb4ebac57497ec81f629987d4c.svg\"/>. Каково массовое число\nобразовавшегося ядра A?\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону сохранения массового числа:\n</p> <div class=\"math-display\">\n<img alt=\"4+ 16= A + 19⇒ A = 1\n\" class=\"math-display\" src=\"index-fe7e6448382adda684f82b861f042cf6.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e4a1f276b9d310704f3335e42726c67a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415496/index-e4a1f276b9d310704f3335e42726c67a.svg", "index-735da3eb4ebac57497ec81f629987d4c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415496/index-735da3eb4ebac57497ec81f629987d4c.svg", "index-fe7e6448382adda684f82b861f042cf6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415497/index-fe7e6448382adda684f82b861f042cf6.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T13:38:16Z", "updated_at": "2026-09-02T20:31:52Z"}, {"id": 188487, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро изотопа свинца <img alt=\"214\n82 Pb  \" class=\"math\" src=\"index-69078cd346efd7fb59d9165314d0e2c0.svg\"/> испытывает электронный <img alt=\"β  \" class=\"math\" src=\"index-5aac5e50d940e3175a6afb70d7c6dc9e.svg\"/>-распад, при этом образуется ядро элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-9a237db7851c4679c98d2b6d02ae2ebd.svg\"/>. Каково массовое число\nобразовавшегося ядра <img alt=\"A  \" class=\"math\" src=\"index-2f8f5a18fb2693131f9cd59af2b6bd45.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"214    214    0\n82 Pb= 83 X + −1e+ ν\n\" class=\"math-display\" src=\"index-ae4cb32137e8b251ff9a8e2362ebe567.svg\"/></div>\n<p class=\"indent\">   Массовое число равно 214.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-69078cd346efd7fb59d9165314d0e2c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415547/index-69078cd346efd7fb59d9165314d0e2c0.svg", "index-5aac5e50d940e3175a6afb70d7c6dc9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415547/index-5aac5e50d940e3175a6afb70d7c6dc9e.svg", "index-9a237db7851c4679c98d2b6d02ae2ebd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415547/index-9a237db7851c4679c98d2b6d02ae2ebd.svg", "index-2f8f5a18fb2693131f9cd59af2b6bd45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415547/index-2f8f5a18fb2693131f9cd59af2b6bd45.svg", "index-ae4cb32137e8b251ff9a8e2362ebe567.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415548/index-ae4cb32137e8b251ff9a8e2362ebe567.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2020"], "created_at": "2026-07-03T14:19:18Z", "updated_at": "2026-09-02T20:32:54Z"}, {"id": 159038, "name": "ЕГКР - 16", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро гелия захватывает нейтрон, в результате чего происходит ядерная реакция <img alt=\"1   3    A    1\n0n+ 2He →Z X +1 p  \" class=\"math\" src=\"index-adcfe553bd596e2899069c4a6e7d362d.svg\"/> с образованием ядра\nхимического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-a97e51183f52a75225725078286a2a74.svg\"/>. Каково массовое число A образовавшегося ядра X (в атомных единицах массы)?\n</p>", "solution_html": "<p class=\"noindent\">Для определения массового числа элемента используется закон сохранения массового числа в ядерных реакциях.<br/>Рассмотрим реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"10n+ 32He→ AZX  +11p\n\" class=\"math-display\" src=\"index-2d6cbdf90b33cb550a082dad78b31401.svg\"/></div>\n<p class=\"indent\">   Суммарная масса слева:\n</p> <div class=\"math-display\">\n<img alt=\"AL = 1+ 3= 4\n\" class=\"math-display\" src=\"index-e783862580b07ee1ee9c21daba3d6a1b.svg\"/></div>\n<p class=\"indent\">   Суммарная масса справа:\n</p> <div class=\"math-display\">\n<img alt=\"AR = A + 1\n\" class=\"math-display\" src=\"index-3360dad6ab7064c2b17ad01759d92a10.svg\"/></div>\n<p class=\"indent\">   Таким образом:\n</p> <div class=\"math-display\">\n<img alt=\"A + 1= 4\n\" class=\"math-display\" src=\"index-fa44fcbd56220ce22c0a95cd37e6e37b.svg\"/></div>\n<p class=\"indent\">   Откуда:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"A= 3\n\" class=\"math-display\" src=\"index-926e30a206f6b7519a4ab90b8ff49ac3.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-adcfe553bd596e2899069c4a6e7d362d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339112/index-adcfe553bd596e2899069c4a6e7d362d.svg", "index-a97e51183f52a75225725078286a2a74.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339112/index-a97e51183f52a75225725078286a2a74.svg", "index-2d6cbdf90b33cb550a082dad78b31401.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339113/index-2d6cbdf90b33cb550a082dad78b31401.svg", "index-e783862580b07ee1ee9c21daba3d6a1b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339113/index-e783862580b07ee1ee9c21daba3d6a1b.svg", "index-3360dad6ab7064c2b17ad01759d92a10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339113/index-3360dad6ab7064c2b17ad01759d92a10.svg", "index-fa44fcbd56220ce22c0a95cd37e6e37b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339113/index-fa44fcbd56220ce22c0a95cd37e6e37b.svg", "index-926e30a206f6b7519a4ab90b8ff49ac3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/339113/index-926e30a206f6b7519a4ab90b8ff49ac3.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["ЕГКР 18.12.25"], "created_at": "2025-12-19T15:11:56Z", "updated_at": "2026-05-26T18:54:58Z"}, {"id": 188408, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро бора может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"4    11    A    1\n2He +5 B → Z X + 0n  \" class=\"math\" src=\"index-8631c32b75e379ed1b7b076d746508c1.svg\"/> с образованием\nядра химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-ee26254e67899e4162517ed533cbec89.svg\"/>. Каково массовое числое образовавшегося ядра A?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"4+ 11= A + 1⇒ A = 14\n\" class=\"math-display\" src=\"index-31bd24e62634e439f4c23cb286ab82eb.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8631c32b75e379ed1b7b076d746508c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415388/index-8631c32b75e379ed1b7b076d746508c1.svg", "index-ee26254e67899e4162517ed533cbec89.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415388/index-ee26254e67899e4162517ed533cbec89.svg", "index-31bd24e62634e439f4c23cb286ab82eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415389/index-31bd24e62634e439f4c23cb286ab82eb.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2019"], "created_at": "2026-07-03T12:46:49Z", "updated_at": "2026-09-02T20:30:47Z"}, {"id": 188420, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Деление ядра урана тепловыми нейтронами описывается реакцией <img alt=\"1   235    A    139      1\n0n+ 92 U → Z X + 56 Ba + 30n+ 7γ.  \" class=\"math\" src=\"index-db314b79e3512964e4098e3727840b0e.svg\"/> При этом образовалось ядро\nхимического элемента Укажите массовое число А элемента X.\n</p>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма массовых чисел до реакции равны соответствующим суммам массовых\nчисел после реакции. То есть для данной ядерной реакции можно записать равенства:\n</p> <div class=\"math-display\">\n<img alt=\"1 + 235 = A + 139 + 1 ⋅ 3\n\" class=\"math-display\" src=\"index-162eea02a4806245c61a8f40d0c0d238.svg\"/></div>\n<p class=\"indent\">   A=94.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-db314b79e3512964e4098e3727840b0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415413/index-db314b79e3512964e4098e3727840b0e.svg", "index-162eea02a4806245c61a8f40d0c0d238.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415414/index-162eea02a4806245c61a8f40d0c0d238.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T13:02:45Z", "updated_at": "2026-09-02T20:30:52Z"}, {"id": 188442, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро азота может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"42He +174 N →AZ X +11 H  \" class=\"math\" src=\"index-9e8f1e73c94c4c3d231b72413a2673bc.svg\"/>\nобразуется ядро химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-b7f5b06072a82b122fa050959963ed9e.svg\"/> . Каково массовое число образовавшегося ядра <img alt=\"A  \" class=\"math\" src=\"index-91b35be948bac7c8e205a326ee9af676.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p> <div class=\"math-display\">\n<img alt=\"A = 4+ 14− 1= 17\n\" class=\"math-display\" src=\"index-b02d5397780daebf917d52afbbbbf970.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9e8f1e73c94c4c3d231b72413a2673bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415457/index-9e8f1e73c94c4c3d231b72413a2673bc.svg", "index-b7f5b06072a82b122fa050959963ed9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415457/index-b7f5b06072a82b122fa050959963ed9e.svg", "index-91b35be948bac7c8e205a326ee9af676.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415457/index-91b35be948bac7c8e205a326ee9af676.svg", "index-b02d5397780daebf917d52afbbbbf970.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415458/index-b02d5397780daebf917d52afbbbbf970.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T13:17:50Z", "updated_at": "2026-09-02T20:31:24Z"}, {"id": 188458, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"21H +21 H →AZ X +10 n  \" class=\"math\" src=\"index-6f9bfc2b33afeea41bf946dd207d03eb.svg\"/> образуется ядро химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-99a143630c1b3ed4dc2c306cbfe4a54b.svg\"/>. Каково массовое\nчисло образовавшегося ядра А?\n</p>", "solution_html": "<p class=\"noindent\">Выполняется закон сохранения массового числа:\n</p> <div class=\"math-display\">\n<img alt=\"2+ 2= A + 1⇒ A = 3\n\" class=\"math-display\" src=\"index-2361206f155326514e2e6ec5a1def881.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6f9bfc2b33afeea41bf946dd207d03eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415489/index-6f9bfc2b33afeea41bf946dd207d03eb.svg", "index-99a143630c1b3ed4dc2c306cbfe4a54b.svg  физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро изотопа свинца <img alt=\"214\n83 Pb  \" class=\"math\" src=\"index-f049d9058dd9a84e0596223569838508.svg\"/> испытывает электронный <img alt=\"β  \" class=\"math\" src=\"index-5aac5e50d940e3175a6afb70d7c6dc9e.svg\"/>-распад, при этом образуется ядро элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-9a237db7851c4679c98d2b6d02ae2ebd.svg\"/>. Каково массовое число\nобразовавшегося ядра <img alt=\"A  \" class=\"math\" src=\"index-2f8f5a18fb2693131f9cd59af2b6bd45.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"214    214    0\n83 Pb= 84 X + −1e+ ν\n\" class=\"math-display\" src=\"index-65aeb20edf6247b19d15db7e0c11ee7d.svg\"/></div>\n<p class=\"indent\">   Массовое число равно 214.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f049d9058dd9a84e0596223569838508.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415541/index-f049d9058dd9a84e0596223569838508.svg", "index-5aac5e50d940e3175a6afb70d7c6dc9e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415541/index-5aac5e50d940e3175a6afb70d7c6dc9e.svg", "index-9a237db7851c4679c98d2b6d02ae2ebd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415541/index-9a237db7851c4679c98d2b6d02ae2ebd.svg", "index-2f8f5a18fb2693131f9cd59af2b6bd45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415541/index-2f8f5a18fb2693131f9cd59af2b6bd45.svg", "index-65aeb20edf6247b19d15db7e0c11ee7d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415542/index-65aeb20edf6247b19d15db7e0c11ee7d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2020"], "created_at": "2026-07-03T14:16:56Z", "updated_at": "2026-09-02T20:32:42Z"}, {"id": 166264, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В результате ядерной реакции <img alt=\"6   2    A    4\n3Li +1H → Z X +2He  \" class=\"math\" src=\"index-d9e9b2d2aa306b80ddd5cc8b384e9109.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-e23a8218803c9e1b01f231bd6e0abafa.svg\"/>. Каково массовое число <img alt=\"  A  \" class=\"math\" src=\"index-97cc57d7587ef948929455ae34e2fd29.svg\"/>\nобразовавшегося ядра <img alt=\"X  \" class=\"math\" src=\"index-ac2a7921d232e845a2e289c663bf50f9.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">Учитывая закон сохранения массовых и зарядовых чисел до реакции и после нее, можно записать равенства:\n</p> <div class=\"math-display\">\n<img alt=\"6 +2 = A+ 4,\n\" class=\"math-display\" src=\"index-83ea24ef099688dd2d0b18fddc92636d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"3 +1 = Z + 2.\n\" class=\"math-display\" src=\"index-f30f6eaabefb7c1696c7104c8ffec512.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"A= 4,Z = 2.\n\" class=\"math-display\" src=\"index-47726873a72944486d5f8e6fc493b2ef.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d9e9b2d2aa306b80ddd5cc8b384e9109.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355787/index-d9e9b2d2aa306b80ddd5cc8b384e9109.svg", "index-e23a8218803c9e1b01f231bd6e0abafa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355787/index-e23a8218803c9e1b01f231bd6e0abafa.svg", "index-97cc57d7587ef948929455ae34e2fd29.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355787/index-97cc57d7587ef948929455ae34e2fd29.svg", "index-ac2a7921d232e845a2e289c663bf50f9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355787/index-ac2a7921d232e845a2e289c663bf50f9.svg", "index-83ea24ef099688dd2d0b18fddc92636d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/355788/index-83ea24ef099688d =\"math\" src=\"index-52959bcfcc6fe86c807176ffc2305c33.svg\"/> и <img alt=\"v2  \" class=\"math\" src=\"index-f4bf453f4ad36d0261c94cede16e0277.svg\"/> относительно поверхности Земли. Какова\nскорость света от фар первого автомобиля в системе отсчета, связанной с другим автомобилем? <br/>1) <img alt=\"c +(v1+ v2)  \" class=\"math\" src=\"index-85ed10d5afcdb32755b10250721ee833.svg\"/> <br/>2) <img alt=\"c +(v1− v2)  \" class=\"math\" src=\"index-2090f2df599853ae010ca37f191487e6.svg\"/> <br/>3) <img alt=\"c − (v1− v2)  \" class=\"math\" src=\"index-d682eddd5669f1709a260b266fae85db.svg\"/> <br/>4) <img alt=\"c  \" class=\"math\" src=\"index-f579a3ad56546adf777e591920aa61da.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Скорость света в вакууме не зависит от скорости движения источника света или наблюдателя и\nодинакова во всех инерциальных системах отсчета. </p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-52959bcfcc6fe86c807176ffc2305c33.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-52959bcfcc6fe86c807176ffc2305c33.svg", "index-f4bf453f4ad36d0261c94cede16e0277.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-f4bf453f4ad36d0261c94cede16e0277.svg", "index-85ed10d5afcdb32755b10250721ee833.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-85ed10d5afcdb32755b10250721ee833.svg", "index-2090f2df599853ae010ca37f191487e6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-2090f2df599853ae010ca37f191487e6.svg", "index-d682eddd5669f1709a260b266fae85db.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-d682eddd5669f1709a260b266fae85db.svg", "index-f579a3ad56546adf777e591920aa61da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43760/index-f579a3ad56546adf777e591920aa61da.svg"}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "Квантовая физика", "СТО"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2022-03-26T17:59:50Z", "updated_at": "2026-03-22T14:51:35Z"}, {"id": 22862, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В специальной теории относительности скорость света в вакууме <br/>А. Является максимально возможной скоростью движения материальных объектов в инерциальной\nсистеме отсчета. <br/>Б. Не зависит от скорости движения источника света.<br/>Какое из утверждений правильно?<br/>В ответ дайте букву (буквы) верных утверждений\n</p>", "solution_html": "<p class=\"noindent\">Скорость света в вакууме не зависит от скорости движения источника света или наблюдателя и\nодинакова во всех инерциальных системах отсчета. Скорость света в СТО занимает особое положение.\nЭто предельная скорость передачи взаимодействий и сигналов из одной точки пространства в\nдругую.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "Квантовая физика", "СТО"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2022-03-26T18:00:45Z", "updated_at": "2026-03-22T14:51:47Z"}, {"id": 22863, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В космическом корабле, летящем к далекой звезде с постоянной скоростью, проводят экспериментальное исследование\nвзаимодействия заряженных шаров. Будут ли отличаться результаты этого исследования от аналогичного, проводимого на\nЗемле?\n</p><p class=\"indent\">   1) да, так как корабль движется с некоторой скоростью\n</p><p class=\"indent\">   2) да – из-за релятивистских эффектов, если скорость корабля близка к скорости света; нет – при малых скоростях\nкорабля\n</p><p class=\"indent\">   3) нет, будут одинаковыми при любой скорости корабля\n</p><p class=\"indent\">   4) для определенного ответа не хватает данных\n</p>", "solution_html": "<p class=\"noindent\">Все законы природы инвариантны по отношению к переходу от одной инерциальной системы отсчета к другой. Это означает, что во\nвсех инерциальных системах физические законы (не только механические) имеют одинаковую форму. Таким образом, принцип\nотносительности классической механики обобщается на все процессы природы, в том числе и на электромагнитные. Этот\nобобщенный принцип называют принципом относительности Эйнштейна.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {}, "tags": ["Уровень ЕГЭ", "Не формат ЕГЭ", "Квантовая физика", "СТО"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2022-03-26T18:01:28Z", "updated_at": "2026-03-22T14:51:57Z"}, {"id": 22865, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Две ракеты удаляются от Земли в противоположных направлениях со скоростями <img alt=\"v = 0,8c  \" class=\"math\" src=\"index-0d9df6120f8056ff97a0f40fb2878394.svg\"/> относительно Земли. Определите\nскорость (в скоростях света) относительного движения ракет. Ответ округлите до тысячных.\n</p>", "solution_html": "<p class=\"noindent\">Закон сложения скоростей:\n</p> <div class=\"math-display\">\n<img alt=\"       vxотн+ vxпер\nvxабс = 1+-vxотнv2xпер-\n             c\n\" class=\"math-display\" src=\"index-684d6c02fd3792beb1a5532602a8f2af.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"vxотн = vxабс−-vxпер-= 0,8c−-(−-0,8c)≈ 0,976c\n       1− vxабсcvx2пер    1− 0,8c(−c20,8c)-\n\" class=\"math-display\" src=\"index-f75d3e0d5b4afc426ca3bf25c1260eb2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0d9df6120f8056ff97a0f40fb2878394.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43768/index-0d9df6120f8056ff97a0f40fb2878394.svg", "index-684d6c02fd3792beb1a5532602a8f2af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/43769/index-684d6c02fd3792beb1a5532602a8f2af.svg", "index-f75d3e0d5b4afc426ca3bf25c1260eb2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetS сколько раз энергия фотона синего света\nбольше энергии фотона оранжевого света?\n</p>", "solution_html": "<p class=\"noindent\">Энергия фотона определяется выражением:\n</p> <div class=\"math-display\">\n<img alt=\"E = hν\n\" class=\"math-display\" src=\"index-33ffdebcba6412e9cd0e6093edb7307a.svg\"/></div>\n<p class=\"indent\">   По условию\n</p> <div class=\"math-display\">\n<img alt=\"νс-\nνо = 1,3\n\" class=\"math-display\" src=\"index-403e572ab7ac9561c9804d3b33b5a2d5.svg\"/></div>\n<p class=\"indent\">   Распишем соотношение энергий:\n</p> <div class=\"math-display\">\n<img alt=\"E    hν\nEс=  hсν-= 1,3\n о    о\n\" class=\"math-display\" src=\"index-dc3bde42ed3b5b5993f0035672ba3079.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-33ffdebcba6412e9cd0e6093edb7307a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200832/index-33ffdebcba6412e9cd0e6093edb7307a.svg", "index-403e572ab7ac9561c9804d3b33b5a2d5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200832/index-403e572ab7ac9561c9804d3b33b5a2d5.svg", "index-dc3bde42ed3b5b5993f0035672ba3079.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200832/index-dc3bde42ed3b5b5993f0035672ba3079.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Фотон. Энергия фотона. Импульс фотона"], "sources": ["Демидова 2019"], "created_at": "2024-08-27T17:42:47Z", "updated_at": "2026-04-24T07:20:41Z"}, {"id": 95875, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Зелёный свет (<img alt=\"λ = 550 нм  \" class=\"math\" src=\"index-95f09b70abce321485a6f127378d1e57.svg\"/>) переходит из воздуха в стекло с показателем преломления 1,5. Определите отношение энергии\nфотона в воздухе к его энергии в стекле.\n</p>", "solution_html": "<p class=\"noindent\">Энергия фотона определяется выражением:\n</p> <div class=\"math-display\">\n<img alt=\"E = hν\n\" class=\"math-display\" src=\"index-b5305a41c692ea886d2e2f263d698b72.svg\"/></div>\n<p class=\"indent\">   При этом известно, что частота волны не меняется при переходе волны из одной среды в другую. Следовательно, энергия фотона\nне меняется и отношение их энергий будет равно 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95f09b70abce321485a6f127378d1e57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195230/index-95f09b70abce321485a6f127378d1e57.svg", "index-b5305a41c692ea886d2e2f263d698b72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205318/index-b5305a41c692ea886d2e2f263d698b72.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Фотон. Энергия фотона. Импульс фотона"], "sources": ["Демидова 2019"], "created_at": "2024-09-02T14:57:46Z", "updated_at": "2024-11-10T13:07:10Z"}, {"id": 96021, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Фиолетовый свет <img alt=\"(λ = 400 нм)  \" class=\"math\" src=\"index-1d605aba002550ff4db0c1e000a31a53.svg\"/> переходит из воздуха в воду с показателем преломления 1,33. Определите отношение\nэнергии фотона в воздухе к его энергии в воде.\n</p>", "solution_html": "<p class=\"noindent\">Энергия фотона определяется выражением:\n</p> <div class=\"math-display\">\n<img alt=\"E = hν\n\" class=\"math-display\" src=\"index-b5305a41c692ea886d2e2f263d698b72.svg\"/></div>\n<p class=\"indent\">   При этом известно, что частота волны не меняется при переходе волны из одной среды в другую. Следовательно, энергия фотона\nне меняется и отношение их энергий будет равно 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1d605aba002550ff4db0c1e000a31a53.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195652/index-1d605aba002550ff4db0c1e000a31a53.svg", "index-b5305a41c692ea886d2e2f263d698b72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205905/index-b5305a41c692ea886d2e2f263d698b72.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Фотон. Энергия фотона. Импульс фотона"], "sources": ["Демидова 2019"], "created_at": "2024-09-05T17:08:47Z", "updated_at": "2024-11-14T08:00:52Z"}, {"id": 96352, "name": "Задача на фотоны. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Какова длина волны электромагнитного излучения, в котором импульс фотонов равен <img alt=\"1⋅10−27 кг⋅ м/с?  \" class=\"math\" src=\"index-3668dfe6a35406c31644ba223813aeff.svg\"/> Ответ выразите в\nнм.\n</p>", "solution_html": "<p class=\"noindent\">Импульс фотона можно найтии как:\n</p> <div class=\"math-display\">\n<img alt=\"    h-\np = λ\n\" class=\"math-display\" src=\"index-d26669f34cc709effc2a189787f7b949.svg\"/></div>\n<p class=\"indent\">   Выразим длину волны:\n</p> <div class=\"math-display\">\n<img alt=\"    h    6,6 ⋅ 10− 34\nλ = -- = -----−27---=  6,6 ⋅ 10 −7 м\n     p      10\n\" class=\"math-display\" src=\"index-5d4eef13e6dfd9451523d35d2d12ad76.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3668dfe6a35406c31644ba223813aeff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196527/index-3668dfe6a35406c31644ba223813aeff.svg", "index-d26669f34cc709effc2a189787f7b949.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206354/index-d26669f34cc709effc2a189787f7b949.svg", "index-5d4eef13e6dfd9451523d35d2d12ad76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206354/index-5d4eef13e6dfd9451523d35d2d12ad76.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Фотон. Энергия фотона. Импульс фотона"], "sources": ["Демидова 2019"], "created_at": "2024-09-10T10:08:48Z", "updated_at": "2024-11-16T20:43:57Z"}, {"id": 104271, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Сколько нуклонов содержит ядро Х, образовавшееся в результате ядерной реакции <img alt=\"27   4     1\n13Al+2He → 1 H + X  \" class=\"math\" src=\"index-ebf4f75414fab3f5d71f690b5eda8c8e.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа и заряда получаем:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{ 27+ 4= 1+ A\n( 13+ 2= 1+ Z\n\" class=\"math-display\" src=\"index-999ec3650d912ff15d8eb614d6b3e086.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\"><br/>Отсюда, следует, что в неизвестном ядре Z=14 протона и A=30 нуклонов.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ebf4f75414fab3f5d71f690b5eda8c8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215188/index-ebf4f75414fab3f5d71f690b5eda8c8e.svg", "index-999ec3650d912ff15d8eb614d6b3e086.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215189/index-999ec3650d912ff15d8eb614d6b3e086.svg"}, "tags": ["Статград 2025 декабрь №3", "Статград 2025 декабрь №2"], "sources": ["CтатГрад 2025 декабрь №3", "CтатГрад 2025 декабрь №2"], "created_at": "2025-01-26T21:52:27Z", "updated_at": "2026-04-19T13:37:37Z"}, {"id": 104272, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Сколько протонов содержит ядро Х, образовавшееся в результате ядерной реакции <img alt=\"27   4     1\n13Al+2He → 1 H + X  \" class=\"math\" src=\"index-ebf4f75414fab3f5d71f690b5eda8c8e.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа и заряда получаем:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{ 27+ 4= 1+ A\n( 13+ 2= 1+ Z\n\" class=\"math-display\" src=\"index-999ec3650d912ff15d8eb614d6b3e086.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\"><br/>Отсюда, следует, что в неизвестном ядре Z=14 протона и A=30 нуклонов.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ebf4f75414fab3f5d71f690b5eda8c8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215191/index-ebf4f75414fab3f5d71f690b5eda8c8e.svg", "index-999ec3650d912ff15d8eb614d6b3e086.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/215192/index-999ec3650d912ff15d8eb614d6b3e086.svg"}, "tags": ["Статград 2025 декабрь №1", "Статград 2025 декабрь №4"], "sources": ["CтатГрад 2025 декабрь №1", "CтатГрад 2025 декабрь №4"], "created_at": "2025-01-26T21:54:13Z", "updated_at": "2026-06-03T15:19:26Z"}, {"id": 120762, "name": "Ядерные реакции", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро <img alt=\"  207\nPb82  \" class=\"math\" src=\"index-b8fa204e118090108b4599504ab6f2d0.svg\"/> поглотило нейтрон. Сколько протонов содержится в ядре, образовавшемся в результате этой реакции?\n</p>", "solution_html": "<p class=\"noindent\">Запишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"  207   1    208\nPb82 + n0 = X 82\n\" class=\"math-display\" src=\"index-f84222103fd871241d6017f3af9adc88.svg\"/></div>\n<p class=\"indent\">   Видим, что при поглощении нейтрона ядром количество протонов не изменяется.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b8fa204e118090108b4599504ab6f2d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/248148/index-b8fa204e118090108b4599504ab6f2d0.svg", "index-f84222103fd871241d6017f3af9adc88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249236/index-f84222103fd871241d6017f3af9adc88.svg"}, "tags": ["СтатГрад 11.02.2022 Физика 1"], "sources": ["СтатГрад 11.02.2022 Физика 1"], "created_at": "2025-04-27T16:20:21Z", "updated_at": "2026-04-19T13:37:57Z"}, {"id": 121354, "name": "Ядерные реакции", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро <img alt=\"  207\nPb82  \" class=\"math\" src=\"index-b8fa204e118090108b4599504ab6f2d0.svg\"/> поглотило нейтрон. Каким массовым числом обладает ядро, образовавшееся в результате этой реакции?\n</p>", "solution_html": "<p class=\"noindent\">Запишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"  207   1    208\nPb82 + n0 = X 82\n\" class=\"math-display\" src=\"index-f84222103fd871241d6017f3af9adc88.svg\"/></div>\n<p class=\"indent\">   Видим, что при поглощении нейтрона ядром массовое число ядра увеличивается на 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b8fa204e118090108b4599504ab6f2d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249313/index-b8fa204e118090108b4599504ab6f2d0.svg", "index-f84222103fd871241d6017f3af9adc88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249320/index-f84222103fd871241d6017f3af9adc88.svg"}, "tags": ["СтатГрад 11.02.2022 Физика 2"], "sources": ["СтатГрад 11.02.2022 Физика 2"], "created_at": "2025-04-30T12:02:57Z", "updated_at": "2026-04-19T13:38:06Z"}, {"id": 126487, "name": "Закон радиоактивного распада. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">При бетта-распаде ядер таллия <img alt=\"  208\nT l81  \" class=\"math\" src=\"index-20d12b6334950823a4c50b8b9050c7b1.svg\"/> образуются стабильные ядра свинца. В момент начала наблюдения в образце содержится\n<img alt=\"8 ⋅1020  \" class=\"math\" src=\"index-34142ba0d57fe15e3948fa11118af075.svg\"/> ядер таллия, период полураспада данного изотопа таллия 3 минуты. Через какое время образуется <img alt=\"7⋅1020  \" class=\"math\" src=\"index-617c654cab8ee2d0875ae786f1f260e3.svg\"/> ядер свинца?\nОтвет дайте в мин.\n</p>", "solution_html": "<p class=\"noindent\">Согласно закону радиоактивного распада число образующихся ядер свинца будет меняться со временем по закону\n</p> <div class=\"math-display\">\n<img alt=\"       (      t)\nN = N0 (1 − 2− T) ,\n\" class=\"math-display\" src=\"index-abfcb0674c62ab77cad2b707c1aadb89.svg\"/></div>\n<p class=\"indent\"> e_criteria_html": "", "images": {"index-a3ce559d7c557e452e5b664e854aa33f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287037/index-a3ce559d7c557e452e5b664e854aa33f.svg", "index-f616643c7396665c1199b74081d0bfcd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-f616643c7396665c1199b74081d0bfcd.svg", "index-2034da4466753ff1827e2087a0ba5bcd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-2034da4466753ff1827e2087a0ba5bcd.svg", "index-c1934611dea517a27370ba3b816ee8ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-c1934611dea517a27370ba3b816ee8ea.svg", "index-514f926fac77de2fa964f7ae48bf30ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-514f926fac77de2fa964f7ae48bf30ca.svg", "index-0d5691b3fafaed2be40552d6caeb210a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-0d5691b3fafaed2be40552d6caeb210a.svg", "index-9ae4b366ade78e1b15d6d8952ea33f52.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287038/index-9ae4b366ade78e1b15d6d8952ea33f52.svg"}, "tags": ["Статград 20.12.2021 Физика 2"], "sources": ["CтатГрад 20.12.2021 Физика 2"], "created_at": "2025-08-24T10:07:26Z", "updated_at": "2026-04-19T13:41:39Z"}, {"id": 138173, "name": "Ядерная физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Определите количество протонов в ядре Х, которое образовалось в результате ядерной реакции <img alt=\"14   4     A    1\n7 N +2He → Z X + 1p  \" class=\"math\" src=\"index-bfac211cee3ef7ee91f4850deab1bcb0.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">По закону сохранения заряда <img alt=\"7+ 2= Z + 1  \" class=\"math\" src=\"index-ba893bd57911a150306b414841844ea4.svg\"/>, откуда <img alt=\"Z = 8  \" class=\"math\" src=\"index-5b08283605fc80b468c566a69c4d2f27.svg\"/>. Число протонов в ядре равно порядковому номеру и равно\n8.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bfac211cee3ef7ee91f4850deab1bcb0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289297/index-bfac211cee3ef7ee91f4850deab1bcb0.svg", "index-ba893bd57911a150306b414841844ea4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289298/index-ba893bd57911a150306b414841844ea4.svg", "index-5b08283605fc80b468c566a69c4d2f27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289298/index-5b08283605fc80b468c566a69c4d2f27.svg"}, "tags": ["Статград 07.12.2023 Физика 1"], "sources": ["CтатГрад 07.12.2023 Физика 1"], "created_at": "2025-08-27T19:01:51Z", "updated_at": "2026-04-19T13:41:50Z"}, {"id": 138176, "name": "Ядерная физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Определите количество нейтронов в ядре Х, которое образовалось ядерной реакции <img alt=\"14   4     A    1\n7 N +2He → Z X + 1p  \" class=\"math\" src=\"index-7681d407b4ad489bdfa5c47777bc1cf9.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">По закону сохранения заряда <img alt=\"7+ 2= Z + 1  \" class=\"math\" src=\"index-a9814f0fea568a650eb38063ce8a180a.svg\"/>, откуда <img alt=\"Z =8  \" class=\"math\" src=\"index-b5031dec1a028f6ca1ece4c486e0f05a.svg\"/>. Зарядовое число равно числу протонов и равно <img alt=\"Z = 8  \" class=\"math\" src=\"index-c3b08d8238aa928cf9e30f81a18ecee5.svg\"/>. По закону\nсохранения массы <img alt=\"14 +4 = A+ 1  \" class=\"math\" src=\"index-6444beca5d01cdf5b802781a638ac54b.svg\"/>, откуда <img alt=\"A = 17  \" class=\"math\" src=\"index-489e1ebef5024b933ba196e292b11472.svg\"/>. Массовое число равно числу нуклонов и равно <img alt=\"A = 17  \" class=\"math\" src=\"index-5e134c6f000287977712b8085338efe5.svg\"/>. Тогда число нейтронов\nнайдем по формуле\n</p> <div class=\"math-display\">\n<img alt=\"N = A − Z =17 − 8 = 9\n\" class=\"math-display\" src=\"index-03522013ed2a38557a22a3a1466a7149.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7681d407b4ad489bdfa5c47777bc1cf9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289302/index-7681d407b4ad489bdfa5c47777bc1cf9.svg", "index-a9814f0fea568a650eb38063ce8a180a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-a9814f0fea568a650eb38063ce8a180a.svg", "index-b5031dec1a028f6ca1ece4c486e0f05a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-b5031dec1a028f6ca1ece4c486e0f05a.svg", "index-c3b08d8238aa928cf9e30f81a18ecee5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-c3b08d8238aa928cf9e30f81a18ecee5.svg", "index-6444beca5d01cdf5b802781a638ac54b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-6444beca5d01cdf5b802781a638ac54b.svg", "index-489e1ebef5024b933ba196e292b11472.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-489e1ebef5024b933ba196e292b11472.svg", "index-5e134c6f000287977712b8085338efe5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-5e134c6f000287977712b8085338efe5.svg", "index-03522013ed2a38557a22a3a1466a7149.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/289303/index-03522013ed2a38557a22a3a1466a7149.svg"}, "tags": ["Статград 07.12.2023 Физика 2"], "sources": ["CтатГрад 07.12.2023 Физика 2"], "created_at": "2025-08-27T19:04:46Z", "updated_at": "2026-04-19T13:42:00Z"}, {"id": 138563, "name": "Фотоэффект. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке изображён график зависимости максимальной скорости <img alt=\"v  \" class=\"math\" src=\"index-b1a5500059a85ebefab12d2993c25d12.svg\"/> фотоэлектронов от длины волны <img alt=\"λ  \" class=\"math\" src=\"index-c4043867122c14526724c78960961667.svg\"/> света, падающего на\nповерхность металлической пластины. Определите, чему равна работа выхода электрона с поверхности этого металла. Ответ дайте в\nэВ. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"138563.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа выхода это минимальная энергия фотона, необходимая для вылета электронов с поверхности металла, при этом\nмаксимальная скорость электронов равна 0. Поэтому находим из графика максимальную длину волны <img alt=\"λmax = 7,5⋅10−7 м  \" class=\"math\" src=\"index-bcb4962593fadb480e37372d28590962.svg\"/><br/>Теперь мы можем найти работу выхода:\n</p> <div class=\"math-display\">\n<img alt=\"                 −34     8\nA = -hc- = 6,6⋅10---⋅−37⋅10-= 2,64 ⋅10−19 = 1,65 эВ\n    λmax      7,5⋅10\n\" class=\"math-display\" src=\"index-55ad6df091a857c26ae25d6dbed1594a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b1a5500059a85ebefab12d2993c25d12.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290178/index-b1a5500059a85ebefab12d2993c25d12.svg", "index-c4043867122c14526724c78960961667.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290178/index-c4043867122c14526724c78960961667.svg", "138563.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290178/138563.png", "index-bcb4962593fadb480e37372d28590962.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290880/index-bcb4962593fadb480e37372d28590962.svg", "index-55ad6df091a857c26ae25d6dbed1594a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290880/index-55ad6df091a857c26ae25d6dbed1594a.svg"}, "tags": ["Статград 19.10.2021 Физика 2"], "sources": ["CтатГрад 19.10.2021 Физика 2"], "created_at": "2025-08-29T12:49:04Z", "updated_at": "2026-04-19T13:42:10Z"}, {"id": 138619, "name": "СтатГрад ЕГЭ 23.01.2024 Задача на квантовую физику 1 вариант", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в\nпроцентах) распространённость изотопа в природе. Определите число нейтронов в ядре самого распространённого стабильного\nизотопа меди.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Из таблицы у самого распространенного стабильного изотопа меди массовое число равняется 63. Зарядовое число у меди равно 29.\nТогда число нейтронов равнется 63 - 29 = 34.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290303/v-de-2020-1-pict19.png"}, "tags": ["СтатГрад ЕГЭ 23.01.2024 1 вариант"], "sources": ["СтатГрад ЕГЭ 23.01.2024 1 вариант"], "created_at": "2025-08-29T18:01:51Z", "updated_at": "2026-04-19T13:42:26Z"}, {"id": 138672, "name": "СтатГрад ЕГЭ 23.01.2024 Задача на квантовую физику 2 вариант", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в\nпроцентах) распространённость изотопа в природе. Определите число нейтронов в ядре самого распространённого стабильного\nизотопа цинка.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Из таблицы у самого распространенного стабильного изотопа меди массовое число равняется 64. Зарядовое число у меди равно 30.\nТогда число нейтронов равнется 64 - 30 = 34.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290408/v-de-2020-1-pict19.png"}, "tags": ["СтатГрад ЕГЭ 23.01.2024 2 вариант"], "sources": ["СтатГрад ЕГЭ 23.01.2024 2 вариант"], "created_at": "2025-08-30T06:20:36Z", "updated_at": "2026-04-19T13:42:34Z"}, {"id": 138821, "name": "Ядерная физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В двух пробирках находятся два разных радиоактивных элемента. Начальное количество ядер первого элемента в 8 раз больше\nначального количества ядер второго элемента. Через время, равное пяти периодам полураспада первого элемента, количества\nнераспавшихся ядер первого и второго элементов оказались одинаковыми. Найдите отношение периода полураспада второго\nэлемента к периоду полураспада первого элемента.\n</p>", "solution_html": "<p class=\"noindent\">Запишем закон радиоактивного распада для каждого элемента:\n</p> <div class=\"math-display\">\n<img alt=\"         − t-        −5       −2\nN1 = N01 ⋅2 T1 = 8N02⋅2  = N02⋅2\n\" class=\"math-display\" src=\"index-a31796a1f1fd7879d4b21d0889d19a41.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"         − tT-       − 5TT1\nN2 =N02 ⋅2  2 = N02⋅2 2\n\" class=\"math-display\" src=\"index-529332c19b4ff438c06f06bd2dcb8edf.svg\"/></div>\n<p class=\"indent\">   Учитывая, что через данный промежуток времени число оставшихся ядер одного элемента равно числу оставшихся ядер второго\nэлемента, получаем\n</p> <div class=\"math-display\">\n<img alt=\"T2\nT1 = 2,5\n\" class=\"math-display\" src=\"index-086b70b04508621601fd6255f389bf91.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a31796a1f1fd7879d4b21d0889d19a41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290735/index-a31796a1f1fd7879d4b21d0889d19a41.svg", "index-529332c19b4ff438c06f06bd2dcb8edf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290735/index-529332c19b4ff438c06f06bd2dcb8edf.svg", "index-086b70b04508621601fd6255f389bf91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290735/index-086b70b04508621601fd6255f389bf91.svg"}, "tags": ["Статград 17.05.2021 Физика 1"], "sources": ["CтатГрад 17.05.2021 Физика 1"], "created_at": "2025-08-30T13:15:54Z", "updated_at": "2026-04-19T13:42:43Z"}, {"id": 138827, "name": "Ядерная физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В двух пробирках находятся два разных радиоактивных элемента. Начальное количество ядер первого элемента в 8 раз больше\nначального количества ядер второго элемента. Через время, равное восьми периодам полураспада первого элемента, количества\nнераспавшихся ядер первого и второго элементов оказались одинаковыми. Найдите отношение периода полураспада второго\nэлемента к периоду полураспада первого элемента.\n</p>", "solution_html": "<p class=\"noindent\">Запишем закон радиоактивного распада для каждого элемента:\n</p> <div class=\"math-display\">\n<img alt=\"         − t-        −8       −5\nN1 = N01 ⋅2 T1 = 8N02⋅2  = N02⋅2\n\" class=\"math-display\" src=\"index-0f391704bd8ddcdf0d0305b9e0545552.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"         − tT-       − 8TT1\nN2 =N02 ⋅2  2 = N02⋅2 2\n\" class=\"math-display\" src=\"index-9114768775ad37be174278b90fca941a.svg\"/></div>\n<p class=\"indent\">   Учитывая, что через данный промежуток времени число оставшихся ядер одного элемента равно числу оставшихся ядер второго\nэлемента, получаем\n</p> <div class=\"math-display\">\n<img alt=\"T2\nT1 = 1,6\n\" class=\"math-display\" src=\"index-f3245d894a7dfbf3f8397e2c80a338cc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0f391704bd8ddcdf0d0305b9e0545552.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290747/index-0f391704bd8ddcdf0d0305b9e0545552.svg", "index-9114768775ad37be174278b90fca941a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290747/index-9114768775ad37be174278b90fca941a.svg", "index-f3245d894a7dfbf3f8397e2c80a338cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290747/index-f3245d894a7dfbf3f8397e2c80a338cc.svg"}, "tags": ["Статград 17.05.2021 Физика 2"], "sources": ["CтатГрад 17.05.2021 Физика 2"], "created_at": "2025-08-30T13:19:21Z", "updated_at": "2026-04-19T13:42:53Z"}, {"id": 138851, "name": "Электродинамика. Изменение физических величин в процессах", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке изображены треки <img alt=\"α− \" class=\"math\" src=\"index-7d0cb46c2f75741a5502c37cd7d5e367.svg\"/>частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном\nмагнитном поле, линии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент\nих попадания в поле одинаковые. Определите массовое и зарядовое число частицы, которая обозначена номером\n1.<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"138851.png\" width=\"315\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|---------------|\n|Массовое число|З-арядовое число\n-------------------------------\n\" class=\"math-display\" src=\"index-52c232040cf328b4f3ac72f21d592dca.svg\"/></div>", "solution_html": "<p class=\"noindent\">Частица 1 не имеет заряда, так как не отклоняется магнитным полем. Следовательно, данная частица является нейтроном, у\nкоторого массовое число равно 1, зарядовое число 0.\n</p><p class=\"indent\"> </p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7d0cb46c2f75741a5502c37cd7d5e367.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290795/index-7d0cb46c2f75741a5502c37cd7d5e367.svg", "138851.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290795/138851.png", "index-52c232040cf328b4f3ac72f21d592dca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290795/index-52c232040cf328b4f3ac72f21d592dca.svg"}, "tags": ["Статград 17.05.2021 Физика 1"], "sources": ["CтатГрад 17.05.2021 Физика 1"], "created_at": "2025-08-30T14:10:36Z", "updated_at": "2026-04-19T13:43:06Z"}, {"id": 138852, "name": "Электродинамика. Изменение физических величин в процессах", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">На рисунке изображены треки <img alt=\"α− \" class=\"math\" src=\"index-7d0cb46c2f75741a5502c37cd7d5e367.svg\"/>частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном\nмагнитном поле, линии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент\nих попадания в поле одинаковые. Определите массовое и зарядовое число частицы, которая обозначена номером\n4<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"138851.png\" width=\"315\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|---------------|\n|Массовое число|З-арядовое число\n-------------------------------\n\" class=\"math-display\" src=\"index-52c232040cf328b4f3ac72f21d592dca.svg\"/></div>", "solution_html": "<p class=\"noindent\">Частица 4 имеет положительный заряд (также как и 2, и 3), так как отклоняется магнитным полем влево (сила\nЛоренца по правилу левой руки направлена влево), а частица 5 имеет отрицательный заряд. Причем, по рисунку видно,\nчто частицы 4 и 5 имеют одинаковые радиусы кривизны, что означает равенство масс и модулей зарядов. Отсюда\nделаем вывод, что из списка частиц 5 - электрон, а 4 - позитрон. Массовое число позитрона равно 0, зарядовое число\n1.\n</p><p class=\"indent\"> </p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-7d0cb46c2f75741a5502c37cd7d5e367.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290797/index-7d0cb46c2f75741a5502c37cd7d5e367.svg", "138851.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290797/138851.png", "index-52c232040cf328b4f3ac72f21d592dca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290797/index-52c232040cf328b4f3ac72f21d592dca.svg"}, "tags": ["Статград 17.05.2021 Физика 2"], "sources": ["CтатГрад 17.05.2021 Физика 2"], "created_at": "2025-08-30T14:13:05Z", "updated_at": "2026-04-19T13:43:15Z"}, {"id": 139148, "name": "Ядерная физика. Изменение физических величин в процессах", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В некотором атомном ядре число нейтронов в 2 раза больше числа протонов. Массовое число этого ядра равно 36. Определите для\nэтого ядра число нейтронов и разность между числом нейтронов и зарядовым числом.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|-----------------------------|\n|Число нейтронов|Разность м еж ду числом нейтронов\n|               |     и зарядовы м числом      |\n|---------------|-----------------------------|\n-----------------------------------------------\n\" class=\"math-display\" src=\"index-1e9b941fae1abc9baa6399406139a30d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Поскольку число нейтронов в 2 раза больше, чем протонов, то число нуклонов в 3 раза больше, чем протонов. Учитывая,\nчто нуклонов в ядре 36, находим число протонов - 12, нейтронов - 24. Тогда разница между этими числами равна\n12.\n</p><p class=\"indent\"> </p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1e9b941fae1abc9baa6399406139a30d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291444/index-1e9b941fae1abc9baa6399406139a30d.svg"}, "tags": ["Статград 04.02.2021 Физика 1"], "sources": ["CтатГрад 04.02.2021 Физика 1"], "created_at": "2025-08-31T14:06:42Z", "updated_at": "2026-05-13T19:56:48Z"}, {"id": 139149, "name": "Ядерная физика. Изменение физических величин в процессах", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">В некотором атомном ядре число нейтронов в 2 раза больше числа протонов. Массовое число этого ядра равно 45. Определите для\nэтого ядра число нейтронов и разность между числом нейтронов и зарядовым числом.<br/>\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|-----------------------------|\n|Число нейтронов|Разность м еж ду числом нейтронов\n|               |     и зарядовы м числом      |\n|---------------|-----------------------------|\n-----------------------------------------------\n\" class=\"math-display\" src=\"index-1e9b941fae1abc9baa6399406139a30d.svg\"/></div>", "solution_html": "<p class=\"noindent\">Поскольку число нейтронов в 2 раза больше, чем протонов, то число нуклонов в 3 раза больше, чем протонов. Учитывая,\nчто нуклонов в ядре 45, находим число протонов - 15, нейтронов - 30. Тогда разница между этими числами равна\n15.\n</p><p class=\"indent\"> </p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1e9b941fae1abc9baa6399406139a30d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291446/index-1e9b941fae1abc9baa6399406139a30d.svg"}, "tags": ["Статград 04.02.2021 Физика 2"], "sources": ["CтатГрад 04.02.2021 Физика 2"], "created_at": "2025-08-31T14:08:58Z", "updated_at": "2026-04-19T13:43:44Z"}, {"id": 139150, "name": "Атомная физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Медленные (нерелятивистские) электроны с энергией 270 эВ испытывают дифракцию на некоторой атомной структуре. Расстояние\nмежду соседними атомами этой структуры <img alt=\"d= 0,15  \" class=\"math\" src=\"index-6595a6d3f4b5508c6779b4106780063b.svg\"/> нм. Во сколько раз <img alt=\"d  \" class=\"math\" src=\"index-e4459a4d5bcf38f75901234789cfd295.svg\"/> превышает длину волны электрона? Ответ округлите до\nцелого числа.\n</p>", "solution_html": "<p class=\"noindent\">Переводим энергию: <img alt=\"                 − 19           − 19\n270 эВ = 270⋅1,6⋅10   Дж = 432⋅10   Дж  \" class=\" e9eb57c8d84d580ed492d14a.svg\"/> Сколько\nнейтронов содержит ядро этого атома, и сколько электронов осталось у иона?\n</p> <div class=\"math-display\">\n<img alt=\"|--------------------------|---------------------|\n|Ч-исло-нейтронов-в ядре атома|Число-электронов у-иона\n--------------------------------------------------\n\" class=\"math-display\" src=\"index-16da871e60ed4cac8849689cc197fda1.svg\"/></div>", "solution_html": "<p class=\"noindent\">В атоме бериллия содержалось 4 протона, 4 электрона и 3 нейтрона. При двойной ионизации число протонов и нейтронов не\nизменилось, электронов стало 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3b9391dcb1544e91dd9d5128a218e800.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295057/index-3b9391dcb1544e91dd9d5128a218e800.svg", "index-fde7dfafe9eb57c8d84d580ed492d14a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295057/index-fde7dfafe9eb57c8d84d580ed492d14a.svg", "index-16da871e60ed4cac8849689cc197fda1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295057/index-16da871e60ed4cac8849689cc197fda1.svg"}, "tags": ["Статград 01.04.2021 Физика 1"], "sources": ["CтатГрад 01.04.2021 Физика 1"], "created_at": "2025-09-07T17:05:28Z", "updated_at": "2026-04-19T13:46:36Z"}, {"id": 140668, "name": "Квантовая физика. Первая часть", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Лазер излучает свет с длиной волны 450 нм. Мощность лазерного пучка 2,2 мВт. Сколько фотонов излучает этот лазер за 1\nпс?\n</p>", "solution_html": "<p class=\"noindent\">Мощность излучения лазера равна\n</p> <div class=\"math-display\">\n<img alt=\"    NE    Nhc\nP = -t- = -λt-\n\" class=\"math-display\" src=\"index-18964e33299da968991539440028e923.svg\"/></div>\n<p class=\"indent\">   Выразим количество фотонов:\n</p> <div class=\"math-display\">\n<img alt=\"               − 3  − 12       −7\nN = Ptλ-= 2,2⋅10--⋅1−034-⋅4,5⋅810--= 5000\n     hc       6,6 ⋅10   ⋅3⋅10\n\" class=\"math-display\" src=\"index-8e8dfdac67a27e1020c107a5a3c0d4a1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-18964e33299da968991539440028e923.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295121/index-18964e33299da968991539440028e923.svg", "index-8e8dfdac67a27e1020c107a5a3c0d4a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295121/index-8e8dfdac67a27e1020c107a5a3c0d4a1.svg"}, "tags": ["Статград 01.04.2021 Физика 1"], "sources": ["CтатГрад 01.04.2021 Физика 1"], "created_at": "2025-09-07T20:30:22Z", "updated_at": "2026-04-19T13:46:53Z"}, {"id": 140727, "name": "СтатГрад ЕГЭ 25.09.2020 Квантовая физика. Число нуклонов 1 вариант", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро атома золота имеет электрический заряд, который в 79 раз превышает модуль заряда электрона. В настоящее время известны\nизотопы золота с числом нейтронов от 90 до 126. Определите для известных изотопов золота массовое число самого лёгкого изотопа,\nа также разность атомных весов самого тяжёлого и самого лёгкого изотопов.\n</p> <div class=\"math-display\">\n<img alt=\"|---------------------------------|---------------------------------------------------------|\n|М ассовое число самого лёгкого изотопа|Разность атомных весов с&amp;#x\n--------------------------------------------------------------------------------------------|\n\" class=\"math-display\" src=\"index-ba26faaa85e8b9c818eed4cab74027af.svg\"/></div>", "solution_html": "<p class=\"noindent\">Зарядовое число золота равняется 79. Число протонов в атоме золота равняется зарядовому числу. <br/>Массовое число равно сумме числа протонов <img alt=\"Z  \" class=\"math\" src=\"index-b05b284b5a3aa5a2ef7cba49caef35d0.svg\"/> и числа нейтронов <img alt=\"N  \" class=\"math\" src=\"index-fcbca9bb8375747084b02730655961bb.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"A = Z +N.\n\" class=\"math-display\" src=\"index-d53cc96dfea0c43b9607e8251453441c.svg\"/></div>\n<p class=\"indent\">   Самый лёгкий изотоп имеет число нейтронов <img alt=\"Nmin = 90  \" class=\"math\" src=\"index-9f286a2a69061107d3bddaf48d3d162d.svg\"/>. Тогда массовое число самого лёгкого изотопа равняется:\n</p> <div class=\"math-display\">\n<img alt=\"Amin = Z + Nmin =79 +90 = 169.\n\" class=\"math-display\" src=\"index-1e11bb6c7b1d2e8af244026cd15bb13a.svg\"/></div>\n<p class=\"indent\">   Массовое число самого тяжёлого изотопа равняется:\n</p> <div class=\"math-display\">\n<img alt=\"Amax = Z + Nmax = 79+ 126= 205.\n\" class=\"math-display\" src=\"index-a8ccf2584d95e654f6fada5a2581fa1a.svg\"/></div>\n<p class=\"indent\">   Тогда разность атомных весов самого тяжёлого и самого лёгкого изотопов равна\n</p> <div class=\"math-display\">\n<img alt=\"Amax − Amin = 205− 169= 36.\n\" class=\"math-display\" src=\"index-4b9cc92c48f5fcbdee8aa41a3122d7e1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ba26faaa85e8b9c818eed4cab74027af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295235/index-ba26faaa85e8b9c818eed4cab74027af.svg", "index-b05b284b5a3aa5a2ef7cba49caef35d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-b05b284b5a3aa5a2ef7cba49caef35d0.svg", "index-fcbca9bb8375747084b02730655961bb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-fcbca9bb8375747084b02730655961bb.svg", "index-d53cc96dfea0c43b9607e8251453441c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-d53cc96dfea0c43b9607e8251453441c.svg", "index-9f286a2a69061107d3bddaf48d3d162d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-9f286a2a69061107d3bddaf48d3d162d.svg", "index-1e11bb6c7b1d2e8af244026cd15bb13a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-1e11bb6c7b1d2e8af244026cd15bb13a.svg", "index-a8ccf2584d95e654f6fada5a2581fa1a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-a8ccf2584d95e654f6fada5a2581fa1a.svg", "index-4b9cc92c48f5fcbdee8aa41a3122d7e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/295236/index-4b9cc92c48f5fcbdee8aa41a3122d7e1.svg"}, "tags": ["СтатГрад ЕГЭ 25.09.2020 1 вариант"], "sources": ["СтатГрад ЕГЭ 25.09.2020 1 вариант"], "created_at": "2025-09-08T18:55:55Z", "updated_at": "2026-04-19T13:47:09Z"}, {"id": 141194, "name": "СтатГрад ЕГЭ 25.09.2020 Квантовая физика. Число нуклонов 2 вариант", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро атома золота имеет электрический заряд, который в 79 раз превышает модуль заряда электрона. В настоящее время известны\nизотопы золота с числом нейтронов от 90 до 126. Определите для известных изотопов золота массовое число самого тяжёлого\nизотопа, а также отношение массы самого тяжёлого изотопа к массе самого лёгкого изотопа. Второе число округлите до десятых\nдолей.\n</p> <div class=\"math-display\">\n<img alt=\"|-----------------------------------|------------------------------------|\n|М ассовое число самого тяж ёлого изотопа|Отношение массы самог&amp;#x0\n|       самого тяжёлого изотопа       |     к массе самого лёгкого изотопа    |\n|-----------------------------------|------------------------------------|\n--------------------------------------------------------------------------\n\" class=\"math-display\" src=\"index-9af84851d2ae0ebc6bc708b61bbe632f.svg\"/></div>", "solution_html": "<p class=\"noindent\">Зарядовое число золота равняется 79. Число протонов в атоме золота равняется зарядовому числу. <br/>Массовое число равно сумме числа протонов <img alt=\"Z  \" class=\"math\" src=\"index-b05b284b5a3aa5a2ef7cba49caef35d0.svg\"/> и числа нейтронов <img alt=\"N  \" class=\"math\" src=\"index-fcbca9bb8375747084b02730655961bb.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"A = Z +N.\n\" class=\"math-display\" src=\"index-d53cc96dfea0c43b9607e8251453441c.svg\"/><
