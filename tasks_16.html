\" src=\"index-6997cb7273b977a7db19fdabe6301aa8.svg\"/> Каково массовое число\nА образовавшегося ядра X?\n</p>", "solution_html": "<p class=\"noindent\">Распишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"238   A    0\n92 U → Z X +−1e+ ν.\n\" class=\"math-display\" src=\"index-3fa8c86b682999599e9d4ed1e19d5395.svg\"/></div>\n<p class=\"indent\">   По закону сохранения массового числа\n</p> <div class=\"math-display\">\n<img alt=\"A = 238.\n\" class=\"math-display\" src=\"index-4ff00290639b3acd4bc0cc01f56e40c1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-062935b6c2347681373ed4420a4d64a4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231067/index-062935b6c2347681373ed4420a4d64a4.svg", "index-b8ca1c35197195989bef4dd7cd285b22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231067/index-b8ca1c35197195989bef4dd7cd285b22.svg", "index-6997cb7273b977a7db19fdabe6301aa8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231067/index-6997cb7273b977a7db19fdabe6301aa8.svg", "index-3fa8c86b682999599e9d4ed1e19d5395.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231068/index-3fa8c86b682999599e9d4ed1e19d5395.svg", "index-4ff00290639b3acd4bc0cc01f56e40c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231068/index-4ff00290639b3acd4bc0cc01f56e40c1.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-03-24T20:02:38Z", "updated_at": "2026-09-02T20:36:31Z"}, {"id": 188444, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Ядро урана <img alt=\"29328U  \" class=\"math\" src=\"index-79686e05c98f62a9ecd1d417eedca0b4.svg\"/> испытывает <img alt=\"α  \" class=\"math\" src=\"index-16a657c8ab66c753fbfd71b2486fa5d1.svg\"/>-распад, при этом образуются ядро элемента <img alt=\"AZX.  \" class=\"math\" src=\"index-14d0d624865349cee95cff5f09108295.svg\"/> Каково массовое число\nобразовавшегося ядра А?\n</p>", "solution_html": "<p class=\"noindent\">Распишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"238   A    4\n92 U → Z X +2He.\n\" class=\"math-display\" src=\"index-a634b15ce38c173cb54d8757bb3020b9.svg\"/></div>\n<p class=\"indent\">   По закону сохранения массового и зарядового чисел получаем\n</p> <div class=\"math-display\">\n<img alt=\"A = 238− 4= 234.\n\" class=\"math-display\" src=\"index-4186ac659c51043b21650394b4cb3a72.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-79686e05c98f62a9ecd1d417eedca0b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415462/index-79686e05c98f62a9ecd1d417eedca0b4.svg", "index-16a657c8ab66c753fbfd71b2486fa5d1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415462/index-16a657c8ab66c753fbfd71b2486fa5d1.svg", "index-14d0d624865349cee95cff5f09108295.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415462/index-14d0d624865349cee95cff5f09108295.svg", "index-a634b15ce38c173cb54d8757bb3020b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415463/index-a634b15ce38c173cb54d8757bb3020b9.svg", "index-4186ac659c51043b21650394b4cb3a72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415463/index-4186ac659c51043b21650394b4cb3a72.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Школково. Тренировочные задания"], "created_at": "2026-07-03T13:20:19Z", "updated_at": "2026-09-02T20:33:37Z"}, {"id": 188451, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Радий <img alt=\"226\n88 Ra  \" class=\"math\" src=\"index-a37a076e0e8aecffd0e4a039ec9ca74c.svg\"/> претерпевает <img alt=\"α  \" class=\"math\" src=\"index-483998464d5dbc956bc2bce8fa723b4a.svg\"/> – распад. Запишите массовое число получившейся в результате частицы.\n</p>", "solution_html": "<p class=\"noindent\"><img alt=\"α  \" class=\"math\" src=\"index-3e9ad259e8f579da0c924d3e29464087.svg\"/> – распад – распад с выделением ядра гелия <img alt=\"4\n2He  \" class=\"math\" src=\"index-0dbd88feefb46aeca14e9879f2f1f578.svg\"/>\n</p> <div class=\"math-display\">\n<img alt=\"226    A    4\n88 Ra → Z X +2He\n\" class=\"math-display\" src=\"index-eac58e0c52f91838cb4e4b4806101933.svg\"/></div>\n<p class=\"indent\">   В ходе реакции должен выполняться закон сохранения массового числа, а значит,\n</p> <div class=\"math-display\">\n<img alt=\"226 =A + 4⇒  A= 222.\n\" class=\"math-display\" src=\"index-c18e1a2997f22e3574f4182373686e02.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a37a076e0e8aecffd0e4a039ec9ca74c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415474/index-a37a076e0e8aecffd0e4a039ec9ca74c.svg", "index-483998464d5dbc956bc2bce8fa723b4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415474/index-483998464d5dbc956bc2bce8fa723b4a.svg", "index-3e9ad259e8f579da0c924d3e29464087.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415475/index-3e9ad259e8f579da0c924d3e29464087.svg", "index-0dbd88feefb46aeca14e9879f2f1f578.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415475/index-0dbd88feefb46aeca14e9879f2f1f578.svg", "index-eac58e0c52f91838cb4e4b4806101933.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415475/index-eac58e0c52f91838cb4e4b4806101933.svg", "index-c18e1a2997f22e3574f4182373686e02.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415475/index-c18e1a2997f22e3574f4182373686e02.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2026-07-03T13:26:27Z", "updated_at": "2026-09-02T20:31:38Z"}, {"id": 188467, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате ядерной реакции синтеза <img alt=\"7   2    A    1\n3L +1H → Z X +0n  \" class=\"math\" src=\"index-057cf43a92fd29d7badb55dbe3165b75.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-363cf219d15ff3a0457dd3cb6cacdf59.svg\"/>. Каково массовое число\nобразовавшегося ядра A?\n</p>", "solution_html": "<p class=\"noindent\">Выполняется закон сохранения массового числа ядра:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"7+ 2= A + 1⇒ A = 8\n\" class=\"math-display\" src=\"index-837a4ed0c636b1089d05bdd9fb3466f2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-057cf43a92fd29d7badb55dbe3165b75.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415507/index-057cf43a92fd29d7badb55dbe3165b75.svg", "index-363cf219d15ff3a0457dd3cb6cacdf59.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415507/index-363cf219d15ff3a0457dd3cb6cacdf59.svg", "index-837a4ed0c636b1089d05bdd9fb3466f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415508/index-837a4ed0c636b1089d05bdd9fb3466f2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T13:44:39Z", "updated_at": "2026-09-02T20:32:01Z"}, {"id": 188472, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате цепной реакции деления урана <img alt=\"1  235    A    139      1\n0n+92 U → Z X + 56 Ba + 30n  \" class=\"math\" src=\"index-0ea651dee020dce80cc0a24dc2d88fcf.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-14de34ee3349604053f83b7fe391723b.svg\"/> . Каково\nмассовое число образовавшегося ядра <img alt=\"A  \" class=\"math\" src=\"index-0cbb6f34b929b8e5770b697607c8b71a.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A = 235+ 1− 139 − 3= 94\n\" class=\"math-display\" src=\"index-2f56f782f4378917a2a5051c396185c0.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0ea651dee020dce80cc0a24dc2d88fcf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415516/index-0ea651dee020dce80cc0a24dc2d88fcf.svg", "index-14de34ee3349604053f83b7fe391723b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415516/index-14de34ee3349604053f83b7fe391723b.svg", "index-0cbb6f34b929b8e5770b697607c8b71a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415516/index-0cbb6f34b929b8e5770b697607c8b71a.svg", "index-2f56f782f4378917a2a5051c396185c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415517/index-2f56f782f4378917a2a5051c396185c0.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2018", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2018"], "created_at": "2026-07-03T13:48:29Z", "updated_at": "2026-09-02T20:32:11Z"}, {"id": 188481, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате цепной реакции деления урана <img alt=\"4    9    A    1\n2He+ 4Be →Z X +0 n  \" class=\"math\" src=\"index-c0d1ebaa242a9413ec7b1cdf76b54908.svg\"/> образуется ядро химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-7bdc23cd7c16b7f3a68b837797b4cfea.svg\"/> . Каково массовое\nчисло образовавшегося ядра <img alt=\"A  \" class=\"math\" src=\"index-6b2cda6f9f65f66ca4dc92a66c8e1dec.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа получаем:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"4+ 9= A +1\n\" class=\"math-display\" src=\"index-5468dfbce06b21ee4344010b5282977c.svg\"/></div>\n<p class=\"indent\">   Получим А=12.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c0d1ebaa242a9413ec7b1cdf76b54908.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415537/index-c0d1ebaa242a9413ec7b1cdf76b54908.svg", "index-7bdc23cd7c16b7f3a68b837797b4cfea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415537/index-7bdc23cd7c16b7f3a68b837797b4cfea.svg", "index-6b2cda6f9f65f66ca4dc92a66c8e1dec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415537/index-6b2cda6f9f65f66ca4dc92a66c8e1dec.svg", "index-5468dfbce06b21ee4344010b5282977c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415538/index-5468dfbce06b21ee4344010b5282977c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции", "Демидова 2019"], "sources": ["Демидова 2019"], "created_at": "2026-07-03T14:13:31Z", "updated_at": "2026-09-02T20:32:34Z"}, {"id": 168622, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате реакции некоторого ядра <img alt=\"A\nZX  \" class=\"math\" src=\"index-2fb9d0e5d9582d4c9d5578aa90d4d3a1.svg\"/> и <img alt=\"α− \" class=\"math\" src=\"index-451b774f9f6d8e93f1b1b8c577203805.svg\"/>частицы <img alt=\"4\n2He  \" class=\"math\" src=\"index-e04e8ac5f356d4aca2aeee05bd40ddf5.svg\"/> образуются нейтрон и ядро азота <img alt=\"14\n7 N  \" class=\"math\" src=\"index-0b6a633e7158a46c81e580fe2d285655.svg\"/>. Определите массовой число\nисходного ядра <img alt=\"AZX  \" class=\"math\" src=\"index-bba6567674f656608361f836a62b56b3.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. Таким\nобразом, получаем:\n</p> <div class=\"math-display\">\n<img alt=\"A +4 =14 +1 ⇒ A = 11.\n\" class=\"math-display\" src=\"index-a33ea3b2ff2f662141ff7eb524f8ba4f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2fb9d0e5d9582d4c9d5578aa90d4d3a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361984/index-2fb9d0e5d9582d4c9d5578aa90d4d3a1.svg", "index-451b774f9f6d8e93f1b1b8c577203805.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361984/index-451b774f9f6d8e93f1b1b8c577203805.svg", "index-e04e8ac5f356d4aca2aeee05bd40ddf5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361984/index-e04e8ac5f356d4aca2aeee05bd40ddf5.svg", "index-0b6a633e7158a46c81e580fe2d285655.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361984/index-0b6a633e7158a46c81e580fe2d285655.svg", "index-bba6567674f656608361f836a62b56b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361984/index-bba6567674f656608361f836a62b56b3.svg", "index-a33ea3b2ff2f662141ff7eb524f8ba4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/361985/index-a33ea3b2ff2f662141ff7eb524f8ba4f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["основная волна 2024"], "created_at": "2026-02-12T19:45:26Z", "updated_at": "2026-05-26T18:55:57Z"}, {"id": 13651, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В настоящее время принято считать, что одним из источников энергии Солнца служит так называемый протон-протонный цикл\nсинтеза гелия <img alt=\"42He  \" class=\"math\" src=\"index-11083749441a7e7aaadb0af52b60b98b.svg\"/>. В ходе этого цикла из нескольких протонов синтезируется ядро гелия <img alt=\"42He  \" class=\"math\" src=\"index-ad23b3ea10a34dde0c4adf16f4b5138e.svg\"/> (реакция идет с образованием\nпромежуточных ядер). При этом высвобождаются два протона и позитроны:\n</p> <div class=\"math-display\">\n<img alt=\"x⋅11 p→42 He + 211p +y ⋅01e\n\" class=\"math-display\" src=\"index-8fcad3669daec741c2508db5f5d95120.svg\"/></div>\n<p class=\"indent\">   Сколько требуется протонов для реализации одного такого цикла и сколько испускается позитронов в ходе его протекания? В\nответе запишите число протонов и позитронов без пробелов и запятых.\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов.\n</p> <div class=\"math-display\">\n<img alt=\"x =4 +2 + 0= 6\n\" class=\"math-display\" src=\"index-732b893d40ca0e711fe9a591e06a872d.svg\"/></div>\n<p class=\"indent\">   Кроме того выполняется закон сохранения электрического заряда\n</p> <div class=\"math-display\">\n<img alt=\"6= 2+ 2+ y\n\" class=\"math-display\" src=\"index-5e21b7a460c9b4d73c12ebf76269a295.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"y = 2\n\" class=\"math-display\" src=\"index-4a39347eb30f41ffa7f1a3fea053af19.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-11083749441a7e7aaadb0af52b60b98b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27575/index-11083749441a7e7aaadb0af52b60b98b.svg", "index-ad23b3ea10a34dde0c4adf16f4b5138e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27575/index-ad23b3ea10a34dde0c4adf16f4b5138e.svg", "index-8fcad3669daec741c2508db5f5d95120.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27575/index-8fcad3669daec741c2508db5f5d95120.svg", "index-732b893d40ca0e711fe9a591e06a872d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27576/index-732b893d40ca0e711fe9a591e06a872d.svg", "index-5e21b7a460c9b4d73c12ebf76269a295.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27576/index-5e21b7a460c9b4d73c12ebf76269a295.svg", "index-4a39347eb30f41ffa7f1a3fea053af19.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27576/index-4a39347eb30f41ffa7f1a3fea053af19.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2021-12-07T12:39:36Z", "updated_at": "2026-01-27T12:00:42Z"}, {"id": 18709, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Неизвестным продуктом <img alt=\"A\nZX  \" class=\"math\" src=\"index-339533d91d5f5bf6ae89a0d55e49614f.svg\"/> ядерной реакцией\n</p> <div class=\"math-display\">\n<img alt=\"246     1   238    A\n99 Es+ 60n→ 92 U + Z X.\n\" class=\"math-display\" src=\"index-a216045bbc2f3d87283c815bfd077bd7.svg\"/></div>\n<p class=\"indent\">   является.<br/>1) <img alt=\"14\n7 N  \" class=\"math\" src=\"index-3ad2a46847256e3fe63e08bdebc3c00a.svg\"/><br/>2) <img alt=\"198F  \" class=\"math\" src=\"index-f46a998d1ab564dd805095ccf043c540.svg\"/><br/>3) <img alt=\"2184Si  \" class=\"math\" src=\"index-16994aeeb0493b3d13d6312ed37b77e3.svg\"/><br/>4) <img alt=\"216014Rf  \" class=\"math\" src=\"index-e3bccc5b36dbf30de5afce26b7ea35b4.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции должен выполняться закон сохранения зарядового числа. Значит,\n</p> <div class=\"math-display\">\n<img alt=\"99+ 6⋅0= 92+ Z ⇒ Z = 7.\n\" class=\"math-display\" src=\"index-debfa8cbbb009d602bb12f92c164a860.svg\"/></div>\n<p class=\"indent\">   Также должен выполняться закон сохранения массового числа, а значит,\n</p> <div class=\"math-display\">\n<img alt=\"246+ 6⋅1= 238+ A ⇒ A = 246 +6 ⋅1− 238 = 14.\n\" class=\"math-display\" src=\"index-238e68e9f2128d63cfb10d0f14e505ae.svg\"/></div>\n<p class=\"indent\">   То есть <img alt=\"14N\n7  \" class=\"math\" src=\"index-a12bdf57d9a2c3db04ff1d16611e028b.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-339533d91d5f5bf6ae89a0d55e49614f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/36771/index-339533d91d5f5bf6ae89a0d55e49614f.svg", "index-a216045 акон сохранения зарядового и массового числа. Таким образом, при осуществлении этой\nреакции должно получится 1 <img alt=\"α  \" class=\"math\" src=\"index-9558f46a24c148b210d2bbb87bf4c590.svg\"/>-частица.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d9927fdfdb1a608f607604fccb5c5329.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415288/index-d9927fdfdb1a608f607604fccb5c5329.svg", "index-dc2d1847891a1fe31f96be643b153b94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415288/index-dc2d1847891a1fe31f96be643b153b94.svg", "index-9558f46a24c148b210d2bbb87bf4c590.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415289/index-9558f46a24c148b210d2bbb87bf4c590.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-07-03T11:26:14Z", "updated_at": "2026-09-02T20:24:41Z"}, {"id": 195617, "name": "Копия #55068 - Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Закон радиоактивного распада", "question_html": "<p class=\"noindent\">Ядра хрома <img alt=\"56\n24Cr  \" class=\"math\" src=\"index-1e762dff8695f01df345c9a93fda60b0.svg\"/> испытывают <img alt=\"β− \" class=\"math\" src=\"index-8b36ee86e22cc8296eb27aa255e1f4d7.svg\"/>-распад с периодом полураспада 6 мин. В момент наблюдения в образце содержится <img alt=\"    20\n8 ⋅10  \" class=\"math\" src=\"index-8428e07382b84b38a548aa71fdf213ec.svg\"/>\nядер этого изотопа хрома. Через какую из точек (1, 2, 3 или 4), кроме точки А, пройдёт график зависимости от времени числа ещё\nне распавшихся ядер хрома? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"f-ege-16-4-1.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">Согласно закону радиоактивного распада число ещё не распавшихся ядер хрома изменяется со временем по закону:\n</p> <div class=\"math-display\">\n<img alt=\"          t-\nN = N0 ⋅2− T ,\n\" class=\"math-display\" src=\"index-b6301e4243fd784d8c2e355d64a5e795.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N0  \" class=\"math\" src=\"index-9738aeaf15121a5162794c6dc7030c3d.svg\"/> – начальное количество ядер, <img alt=\"t  \" class=\"math\" src=\"index-4758a03c70ef53868ada3bde02c97b2b.svg\"/> – время, <img alt=\"T  \" class=\"math\" src=\"index-e6e8be9e0ea3314b098deed81efec67f.svg\"/> – период полураспада. Тогда с учетом дано\n</p> <div class=\"math-display\">\n<img alt=\"          20  − t\nN(t)= 8⋅10  ⋅2  6\n\" class=\"math-display\" src=\"index-de670e2fae366fc22684ccb30377b158.svg\"/></div>\n<p class=\"indent\">   График пройдёт через точки: (6, 4), (12, 2), (18, 1) – точка 3.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1e762dff8695f01df345c9a93fda60b0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433610/index-1e762dff8695f01df345c9a93fda60b0.svg", "index-8b36ee86e22cc8296eb27aa255e1f4d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433610/index-8b36ee86e22cc8296eb27aa255e1f4d7.svg", "index-8428e07382b84b38a548aa71fdf213ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433610/index-8428e07382b84b38a548aa71fdf213ec.svg", "f-ege-16-4-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433610/f-ege-16-4-1.png", "index-b6301e4243fd784d8c2e355d64a5e795.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433611/index-b6301e4243fd784d8c2e355d64a5e795.svg", "index-9738aeaf15121a5162794c6dc7030c3d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433611/index-9738aeaf15121a5162794c6dc7030c3d.svg", "index-4758a03c70ef53868ada3bde02c97b2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433611/index-4758a03c70ef53868ada3bde02c97b2b.svg", "index-e6e8be9e0ea3314b098deed81efec67f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433611/index-e6e8be9e0ea ss=\"noindent\">Период полураспада ядер радиоактивного изотопа висмута 19 мин. Через какое время распадется 75%\nядер висмута в исследуемом образце? Ответ дайте в мин.\n</p>", "solution_html": "<p class=\"noindent\">75% ядер висмута распадутся за два периода полураспада. Значит, <img alt=\"t= 38  \" class=\"math\" src=\"index-b01f20925748595a752da8a0157fbcd8.svg\"/> мин.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b01f20925748595a752da8a0157fbcd8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433507/index-b01f20925748595a752da8a0157fbcd8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T06:55:08Z", "updated_at": "2026-08-17T06:55:31Z"}, {"id": 13665, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Закон радиоактивного распада", "question_html": "<p class=\"noindent\">Период полураспада изотопа ртути <img alt=\"190\n80 Hg  \" class=\"math\" src=\"index-472dcb71ea0e990a54eae431da134dd8.svg\"/> равен 20 минутам. Если изначально было 40 мг этого изотопа, то сколько примерно его\nбудет через 1 час? Ответ дайте в мг.\n</p>", "solution_html": "<p class=\"noindent\">Закон радиоактивного распада:\n</p> <div class=\"math-display\">\n<img alt=\"        −(t∕T)         −60 мин∕20 мин\nN = N0⋅2     = 40 м г⋅2          =5 мг\n\" class=\"math-display\" src=\"index-e1c7603c0f036a8bd90002de946d913f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-472dcb71ea0e990a54eae431da134dd8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27601/index-472dcb71ea0e990a54eae431da134dd8.svg", "index-e1c7603c0f036a8bd90002de946d913f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27602/index-e1c7603c0f036a8bd90002de946d913f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": [], "created_at": "2021-12-07T12:51:15Z", "updated_at": "2026-04-08T18:07:00Z"}, {"id": 65200, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Закон радиоактивного распада", "question_html": "<p class=\"noindent\">Период полураспада одного из изотопов йода составляет 81 мин. Первоначально в образце содержалось 0,2 моль этого изотопа.\nСколько моль данного изотопа распадётся за 162 мин? Ответ дайте в моль.\n</p>", "solution_html": "<p class=\"noindent\">Закон радиоактивного распада:\n</p> <div class=\"math-display\">\n<img alt=\"          t-\nN = N0 ⋅2− T ,\n\" class=\"math-display\" src=\"index-b6301e4243fd784d8c2e355d64a5e795.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"N  \" class=\"math\" src=\"index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg\"/> – количество оставшихся ядер, <img alt=\"N0  \" class=\"math\" src=\"index-409411ac15db60ae2518373f2751b89b.svg\"/> – начальное количество ядер, <img alt=\"t  \" class=\"math\" src=\"index-1eb102a25dfefb8921ce16756022d02b.svg\"/> – время, <img alt=\"T  \" class=\"math\" src=\"index-5d0d6f3d83cd4ff418c5bde25e43a437.svg\"/> – период полураспада.<br/>За <img alt=\"t= 2T  \" class=\"math\" src=\"index-4fd1b92d55faafb71665c3bec1f5cee7.svg\"/> количество оставшихся ядер станет равно:\n</p> <div class=\"math-display\">\n<img alt=\"N = N0-= N0.\n    22    4\n\" class=\"math-display\" src=\"index-ba2596a2e667316df25016084d82a541.svg\"/></div>\n<p class=\"indent\">   Количество вещества равно:\n</p> <div class=\"math-display\">\n<img alt=\"    N--\nν = NA ,\n\" class=\"math-display\" src=\"index-7715727cde9f167c3ed049313ebe8d6f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"NA  \" class=\"math\" src=\"index-546e398a49db6ab612e9e32b8d1b7b64.svg\"/> – число Авогадро.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"ν-= N--= 1 ⇒ ν = ν0 = 0,2 моль-= 0,05 моль\nν0   N0   4       4      4\n\" class=\"math-display\" src=\"index-43ec582a1c394bd31245e81035dbfa85.svg\"/></div>\n<p class=\"indent\">   Через 162 минуты оставшееся количество вещества составит 0,05 моль, то есть распадется 0,15 моль начального количества\nвещества.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b6301e4243fd784d8c2e355d64a5e795.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-b6301e4243fd784d8c2e355d64a5e795.svg", "index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-b9cd9e7ffb5c4e0728bec244792fc4ca.svg", "index-409411ac15db60ae2518373f2751b89b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-409411ac15db60ae2518373f2751b89b.svg", "index-1eb102a25dfefb8921ce16756022d02b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-1eb102a25dfefb8921ce16756022d02b.svg", "index-5d0d6f3d83cd4ff418c5bde25e43a437.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-5d0d6f3d83cd4ff418c5bde25e43a437.svg", "index-4fd1b92d55faafb71665c3bec1f5cee7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-4fd1b92d55faafb71665c3bec1f5cee7.svg", "index-ba2596a2e667316df25016084d82a541.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-ba2596a2e667316df25016084d82a541.svg", "index-7715727cde9f167c3ed049313ebe8d6f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-7715727cde9f167c3ed049313ebe8d6f.svg", "index-546e398a49db6ab612e9e32b8d1b7b64.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-546e398a49db6ab612e9e32b8d1b7b64.svg", "index-43ec582a1c394bd31245e81035dbfa85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117881/index-43ec582a1c394bd31245e81035dbfa85.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": [], "created_at": "2023-07-08T07:44:43Z", "updated_at": "2026-05-29T14:49:26Z"}, {"id": 195521, "nam гетическом состоянии. Атом поглощает\nфотон с импульсом <img alt=\"6,8⋅10−27  \" class=\"math\" src=\"index-77d199d396d5af1cd7b4c98804bd046b.svg\"/> кг<img alt=\"⋅ \" class=\"math\" src=\"index-b6e56bf63e4cf969c901dc05aebac515.svg\"/>м/с. Найдите номер энергетического уровня, на который в результате этого перейдёт\nэлектрон.\n</p>", "solution_html": "<p class=\"noindent\">Энергия фотона:\n</p> <div class=\"math-display\">\n<img alt=\"Eфот = hν = pc,\n\" class=\"math-display\" src=\"index-be33ce715e41ec8c4e8b84a14bb0e2d2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-789d8815f1c5dad7dc80101b83cc508f.svg\"/> – частота, <img alt=\"p  \" class=\"math\" src=\"index-4b5d9c77f1da886e867825ae3a9768b4.svg\"/> – импульс.<br/>Второй постулат Бора:\n</p> <div class=\"math-display\">\n<img alt=\"hν = Em − En\n\" class=\"math-display\" src=\"index-7efb9ec5901b333dca6f936d4babc1cc.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"     ( 1    )\n− 13,6  n2 − 1 = pc = 12,75 эВ ⇒ n = 4\n\" class=\"math-display\" src=\"index-b8012745df9d6d4b10646ace3e5a1a41.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-77d199d396d5af1cd7b4c98804bd046b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27609/index-77d199d396d5af1cd7b4c98804bd046b.svg", "index-b6e56bf63e4cf969c901dc05aebac515.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27609/index-b6e56bf63e4cf969c901dc05aebac515.svg", "index-be33ce715e41ec8c4e8b84a14bb0e2d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27610/index-be33ce715e41ec8c4e8b84a14bb0e2d2.svg", "index-789d8815f1c5dad7dc80101b83cc508f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27610/index-789d8815f1c5dad7dc80101b83cc508f.svg", "index-4b5d9c77f1da886e867825ae3a9768b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27610/index-4b5d9c77f1da886e867825ae3a9768b4.svg", "index-7efb9ec5901b333dca6f936d4babc1cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27610/index-7efb9ec5901b333dca6f936d4babc1cc.svg", "index-b8012745df9d6d4b10646ace3e5a1a41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27610/index-b8012745df9d6d4b10646ace3e5a1a41.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": [], "created_at": "2021-12-07T12:55:58Z", "updated_at": "2026-01-27T15:11:15Z"}, {"id": 13670, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Атомные спектры. Энергетические уровни", "question_html": "<p class=\"noindent\">В таблице приведены значения энергии для второго и четвёртого энергетических уровней атома водорода.\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|---------−19----|\n|Н-омер уровня|Э-нергия-10----Дж-|\n|------2------|-------5,45------|\n-------4--------------1,36-------\n\" class=\"math-display\" src=\"index-fcb95d9a25cd97613d2b1476f97b1802.svg\"/></div>\n<p class=\"indent\">   Какой должна быть энергия фотона, при поглощении которого атом переходит со второго уровня на четвёртый? Ответ дайте в\n<img alt=\"10−19  \" class=\"math\" src=\"index-c1ea06761bc29d637a245abbba4c692a.svg\"/> Дж.\n</p>", "solution_html": "<p class=\"noindent\">При переходе на более высокий энергетический уровень атом должен получить энергию. Для того, чтобы электрон перешёл со\nвторого уровня на четвёртый под действием фотона, энергия фотона должна быть равна разности энергий четвёртого и второго\nэнергетических уровней:\n</p> <div class=\"math-display\">\n<img alt=\"(−1,36− (−5,45))10−19 Дж = 4,09 ⋅10− 19 Дж\n\" class=\"math-display\" src=\"index-9a3e1de96374839d088cddcda96a5ca6.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fcb95d9a25cd97613d2b1476f97b1802.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27611/index-fcb95d9a25cd97613d2b1476f97b1802.svg", "index-c1ea06761bc29d637a245abbba4c692a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27611/index-c1ea06761bc29d637a245abbba4c692a.svg", "index-9a3e1de96374839d088cddcda96a5ca6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27612/index-9a3e1de96374839d088cddcda96a5ca6.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": [], "created_at": "2021-12-07T12:56:35Z", "updated_at": "2026-04-24T07:26:02Z"}, {"id": 50944, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Атомные спектры. Энергетические уровни", "question_html": "<p class=\"noindent\">Атомы некоторого газа могут находиться в трёх энергетических состояниях, энергетическая диаграмма которых показана на\nрисунке. Атом находится в состоянии с энергией <img alt=\"E2  \" class=\"math\" src=\"index-2788bd20c2994b16b44fc429cfe88c6b.svg\"/>. Фотон с какой энергией может поглотить атом этого газа? Ответ дайте в\nэВ.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"50944.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">При поглощении фотона атом может перейти из состояния <img alt=\"E2  \" class=\"math\" src=\"index-d5b287a1fe0ed1c217db0eb25830a639.svg\"/> в другое состояние <img alt=\"En  \" class=\"math\" src=\"index-cdd3f2414885d2eedb81313585add2e9.svg\"/>, где <img alt=\"n &gt;2  \" class=\"math\" src=\"index-e378aba3d20c901a2cc93c19faacbbe1.svg\"/>. Максимальное состояние <img alt=\"   E3  \" class=\"math\" src=\"index-b0e4175bb2e49b106f5a030291ac59af.svg\"/>.\nТогда\n</p> <div class=\"math-display\">\n<img alt=\"Eфот = E3− E2 = −2,3 эВ +3,6 эВ = 1,3 эВ\n\" class=\"math-display\" src=\"index-2018f783c928d5c7640299e602a6b42a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2788bd20c2994b16b44fc429cfe88c6b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95141/index-2788bd20c2994b16b44fc429cfe88c6b.svg", "50944.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95141/50944.png", "index-d5b287a1fe0ed1c217db0eb25830a639.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95142/index-d5b287a1fe0ed1c217db0eb25830a639.svg", "index-cdd3f2414885d2eedb81313585add2e9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95142/index-cdd3f2414885d2eedb81313585add2e9.svg", "index-e378aba3d20c901a2cc93c19faacbbe1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95142/index-e378aba3d20c901a2cc93c19faacbbe1.svg", "index-b0e4175bb2e49b106f5a030291ac59af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95142/index-b0e4175bb2e49b106f5a030291ac59af.svg", "index-2018f783c928d5c7640299e602a6b42a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/95142/index-2018f783c928d5c7640299e602a6b42a.svg"}, "tags": [], "sources": [], "created_at": "2023-02-11T14:00:02Z", "updated_at": "2026-05-17T08:34:56Z"}]};
const ALL_MODE = false;

const searchTypeEl = document.getElementById('searchType');
const searchInput  = document.getElementById('searchInput');
const searchBtn    = document.getElementById('searchBtn');
const resetBtn     = document.getElementById('resetBtn');
const countEl      = document.getElementById('count');
const noResults    = document.getElementById('noResults');
const noResMsg     = document.getElementById('noResultsMsg');
const listEl       = document.getElementById('list');
const initMsg      = document.getElementById('initialMessage');

const PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const MAX_CONCURRENT = 6;
let activeLoads = 0;
const loadQueue = [];

function pumpQueue() {
  while (activeLoads < MAX_CONCURRENT && loadQueue.length > 0) {
    const img = loadQueue.shift();
    if (!img.isConnected || !img.hasAttribute('data-src')) continue;
    activeLoads++;
    startLoad(img);
  }
}

function startLoad(img) {
  const url = img.getAttribute('data-src');
  const attempt = Number(img.getAttribute('data-attempt') || 0);
  img.onload = function () {
    img.removeAttribute('data-src');
    activeLoads--;
    pumpQueue();
  };
  img.onerror = function () {
    activeLoads--;
    if (attempt < 3) {
      img.setAttribute('data-attempt', String(attempt + 1));
      setTimeout(function () {
        loadQueue.unshift(img);
        pumpQueue();
      }, 400 * (attempt + 1));
    } else {
      img.removeAttribute('data-src');
    }
    pumpQueue();
  };
  img.src = url;
}

const lazyObserver = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (entry.isIntersecting) {
      lazyObserver.unobserve(entry.target);
      loadQueue.push(entry.target);
      pumpQueue();
    }
  });
}, { rootMargin: '400px 0px' });

function observeImages(root) {
  root.querySelectorAll('img[data-src]').forEach(function (img) {
    lazyObserver.observe(img);
  });
}

tasksData.questions.forEach((task, idx) => {
  task._seq = String(idx + 1);
  task._id = String(task.id);
  task._ege = String(task.ege || '');
  
  let searchText = '';
  searchText += (task.name || '') + ' ';
  searchText += (task.theme_path || '') + ' ';
  searchText += (task.tags || []).join(' ') + ' ';
  searchText += (task.sources || []).join(' ') + ' ';
  
  const parser = new DOMParser();
  const extractText = (html) => {
    if (!html) return '';
    const doc = parser.parseFromString(html, 'text/html');
    return doc.body.textContent || '';
  };
  
  searchText += extractText(task.question_html) + ' ';
  searchText += extractText(task.solution_html) + ' ';
  searchText += extractText(task.answer_html) + ' ';
  searchText += extractText(task.grade_criteria_html) + ' ';
  
  task._search = searchText.toLowerCase().replace(/\s+/g, ' ');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function rewriteImages(html, images) {
  if (!html) return '';
  const imgMap = {};
  for (const [fname, url] of Object.entries(images || {})) {
    imgMap[fname] = url;
  }
  return html.replace(/src=(["'])([^"']+)\1/g, function (match, quote, src) {
    const fname = src.split('/').pop();
    const url = imgMap[fname] || (src.startsWith('http') ? src : '');
    if (!url) return match;
    return 'src=' + quote + PLACEHOLDER + quote +
           ' data-src=' + quote + url + quote +
           ' referrerpolicy="no-referrer" loading="lazy"';
  });
}

function renderTask(task) {
  const tid = task.id;
  const name = escapeHtml(task.name || 'Без названия');
  const themePath = escapeHtml(task.theme_path || '');

  const tags = task.tags || [];
  const tagChips = tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
  
  const sources = task.sources || [];
  const srcChips = sources.map(s => `<span class="chip chip-src">${escapeHtml(s)}</span>`).join('');

  const qHtml = rewriteImages(task.question_html || '', task.images);
  const sHtml = rewriteImages(task.solution_html || '', task.images);
  const aHtml = rewriteImages(task.answer_html || '', task.images);
  const cHtml = rewriteImages(task.grade_criteria_html || '', task.images);

  function section(title, content, opened = false) {
    if (!content.trim()) return '';
    const openAttr = opened ? ' open' : '';
    return `
      <details class="section"${openAttr}>
        <summary>${title}</summary>
        <div class="tex-content">${content}</div>
      </details>
    `;
  }

  const sections = 
    section('Условие', qHtml, true) +
    section('Решение', sHtml) +
    section('Ответ', aHtml) +
    section('Критерии оценивания', cHtml);

  const egeBadge = (ALL_MODE && task._ege) ? `<span class="badge badge-ege">ЕГЭ №${task._ege}</span>` : '';

  return `
    <div class="task-card" data-seq="${task._seq}" data-id="${tid}">
      <div class="task-head">
        ${egeBadge}
        <span class="badge badge-num">№${task._seq}</span>
        <span class="badge badge-id">ID ${tid}</span>
        <span class="task-name">${name}</span>
      </div>
      ${themePath ? `<div class="theme-path">${themePath}</div>` : ''}
      <div class="task-meta">
        ${tagChips ? `<div class="chips">${tagChips}</div>` : ''}
        ${srcChips ? `<div class="chips">${srcChips}</div>` : ''}
      </div>
      ${sections}
    </div>
  `;
}

function updatePlaceholder() {
  const t = searchTypeEl.value;
  if (t === 'number') {
    searchInput.placeholder = 'Номер задачи (№ или ID)';
  } else if (t === 'ege') {
    searchInput.placeholder = 'Номер задания ЕГЭ (1-26)';
  } else {
    searchInput.placeholder = 'Текст для поиска…';
  }
}

function doSearch() {
  const type  = searchTypeEl.value;
  const query = searchInput.value.trim();

  if (!query) {
    listEl.innerHTML = '';
    initMsg.style.display = 'block';
    noResults.style.display = 'none';
    countEl.textContent = '';
    return;
  }

  initMsg.style.display = 'none';

  const filtered = tasksData.questions.filter(task => {
    if (type === 'number') {
      return (task._seq === query) || (task._id === query) ||
             task._id.startsWith(query) || task._seq.startsWith(query);
    }
    if (type === 'ege') {
      return task._ege === query;
    }
    return task._search.includes(query.toLowerCase());
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResults.style.display = 'block';
    if (type === 'number') {
      noResMsg.textContent = `Задачи с номером «${query}» нет`;
    } else if (type === 'ege') {
      noResMsg.textContent = `Задачи ЕГЭ №${query} не найдены`;
    } else {
      noResMsg.textContent = `По запросу «${query}» ничего не найдено`;
    }
    countEl.textContent = `Показано 0 из ${tasksData.questions.length}`;
  } else {
    noResults.style.display = 'none';
    listEl.innerHTML = filtered.map(renderTask).join('');
    observeImages(listEl);
    countEl.textContent = `Показано ${filtered.length} из ${tasksData.questions.length}`;
  }
}

function doReset() {
  searchInput.value = '';
  listEl.innerHTML = '';
  initMsg.style.display = 'block';
  noResults.style.display = 'none';
  countEl.textContent = '';
  searchInput.focus();
}

searchTypeEl.addEventListener('change', updatePlaceholder);
searchBtn.addEventListener('click', doSearch);
resetBtn.addEventListener('click', doReset);

searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch();
  }
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = true);
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = false);
});

updatePlaceholder();
initMsg.style.display = 'block';
noResults.style.display = 'none';
</script>
</body>
</html>
