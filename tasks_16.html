x-service/v1/GetSession/349893/index-46492f8b8be84d16d7969f147445f965.svg", "index-f12fd9a1fc4fa587dee9f8a9c210b3c6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349893/index-f12fd9a1fc4fa587dee9f8a9c210b3c6.svg", "index-3dbf304c2664d19cf19bc71285e94072.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349893/index-3dbf304c2664d19cf19bc71285e94072.svg", "index-9f151b3892d04b90c8a91dd8dc110c13.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349893/index-9f151b3892d04b90c8a91dd8dc110c13.svg", "index-dd8655fc88a8ff9463d9f36acdc6f096.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349894/index-dd8655fc88a8ff9463d9f36acdc6f096.svg", "index-0a1f8607c490c89246dca9fb78572734.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349894/index-0a1f8607c490c89246dca9fb78572734.svg", "index-c3f733124e93ed51f77764482e45309e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349894/index-c3f733124e93ed51f77764482e45309e.svg", "index-efb632f0ee92a9deb514615a6898b67b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349894/index-efb632f0ee92a9deb514615a6898b67b.svg", "index-3663488ebdd57b5a24ded76488116fdc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/349894/index-3663488ebdd57b5a24ded76488116fdc.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["СтатГрад 22.01.26"], "created_at": "2026-01-22T06:12:31Z", "updated_at": "2026-04-19T13:49:38Z"}, {"id": 163467, "name": " Номер 16. СтатГрад. Вар 2", "theme_path": "№16 Квантовая физика", "question_html": "<p class=\"noindent\">Ядро радиоактивного химического элемента <img alt=\"A\nZX  \" class=\"math\" src=\"index-46492f8b8be84d16d7969f147445f965.svg\"/> испытывает один <img alt=\"α  \" class=\"math\" src=\"index-f12fd9a1fc4fa587dee9f8a9c210b3c6.svg\"/>-распад и один электронный <img alt=\"β  \" class=\"math\" src=\"index-3dbf304c2664d19cf19bc71285e94072.svg\"/>-распад. На сколько в\nрезультате этого уменьшается зарядовое число исходного ядра <img alt=\"X  \" class=\"math\" src=\"index-9f151b3892d04b90c8a91dd8dc110c13.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">При <img alt=\"α  \" class=\"math\" src=\"index-dd8655fc88a8ff9463d9f36acdc6f096.svg\"/>-распаде:\n</p> <div class=\"math-display\">\n<img alt=\"A     A−4   4\nZX  → Z−2Y +2He\n\" class=\"math-display\" src=\"index-0a1f8607c490c89246dca9fb78572734.svg\"/></div>\n<p class=\"indent\">   Зарядовое число уменьшается на 2.\n</p><p class=\"indent\">   При электронном <img alt=\"β  \" class=\"math\" src=\"index-c3f733124e93ed51f77764482e45309e.svg\"/>-распаде:\n</p> <div class=\"math-display\">\n<img alt=\"n→  p+ e− + ¯ν\n\" class=\"math-display\" src=\"index-efb632f0ee92a9deb514615a6898b67b.svg\"/></div>\n<p class=\"indent\">   Нейтрон превращается в протон, поэтому зарядовое число увеличивается на 1. Таким образом:\n</p> <div class=\"math-display\">\n<img alt=\"ΔZ  =− 2+ 1= − 1\n\" class=\"math-display\" src=\"index-42be55d394e5cd110477165b15259c27.svg\"/></div>\n<p class=\"indent\">   Зарядовое число уменьшается на 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-46492f8b8be84d16d7969f147445f965.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350040/index-46492f8b8be84d16d7969f147445f965.svg", "index-f12fd9a1fc4fa587dee9f8a9c210b3c6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350040/index-f12fd9a1fc4fa587dee9f8a9c210b3c6.svg", "index-3dbf304c2664d19cf19bc71285e94072.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350040/index-3dbf304c2664d19cf19bc71285e94072.svg", "index-9f151b3892d04b90c8a91dd8dc110c13.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350040/index-9f151b3892d04b90c8a91dd8dc110c13.svg", "index-dd8655fc88a8ff9463d9f36acdc6f096.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350041/index-dd8655fc88a8ff9463d9f36acdc6f096.svg", "index-0a1f8607c490c89246dca9fb78572734.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350041/index-0a1f8607c490c89246dca9fb78572734.svg", "index-c3f733124e93ed51f77764482e45309e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350041/index-c3f733124e93ed51f77764482e45309e.svg", "index-efb632f0ee92a9deb514615a6898b67b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350041/index-efb632f0ee92a9deb514615a6898b67b.svg", "index-42be55d394e5cd110477165b15259c27.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/350041/index-42be55d394e5cd110477165b15259c27.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["СтатГрад 22.01.26"], "created_at": "2026-01-22T10:16:58Z", "updated_at": "2026-04-19T13:49:47Z"}, {"id": 112216, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">На рисунке изображена схема иона лития <img alt=\"7\n3Li  \" class=\"math\" src=\"index-9f1f5c3e982d6d8b77f269183ccb42bc.svg\"/>. Чёрными точками обозначены электроны. Чему равен заряд данного иона в\nединицах элементарного заряда?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"112216.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Чтобы найти заряд иона, необходимо из количества протонов в ядре (зарядовое число иона) вычесть количество электронов. В\nданном случае заряд иона равен <img alt=\"3− 4 =− 1.  \" class=\"math\" src=\"index-613d02676f52edfa91f2a99f6b08575b.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9f1f5c3e982d6d8b77f269183ccb42bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231048/index-9f1f5c3e982d6d8b77f269183ccb42bc.svg", "112216.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231048/112216.png", "index-613d02676f52edfa91f2a99f6b08575b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231050/index-613d02676f52edfa91f2a99f6b08575b.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-03-24T19:27:28Z", "updated_at": "2026-09-22T08:40:21Z"}, {"id": 86761, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">На рисунке изображена схема иона магния <img alt=\"24\n12Mg  \" class=\"math\" src=\"index-fc14090bfc8161c09532706d59be515c.svg\"/>. Чёрными точками обозначены электроны. Чему равен заряд данного иона в\nединицах элементарного заряда?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-ege-16-2-1.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Чтобы найти заряд иона, необходимо из количества протонов в ядре (зарядовое число иона) вычесть количество электронов. В\nданном случае заряд иона равен 12-10=2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fc14090bfc8161c09532706d59be515c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/171843/index-fc14090bfc8161c09532706d59be515c.svg", "f-ege-16-2-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/171843/f-ege-16-2-1.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": [], "created_at": "2024-04-30T06:21:45Z", "updated_at": "2026-05-26T18:00:53Z"}, {"id": 195588, "name": "Копия #94225 - Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д. И. Менделеева. Под названием каждого элемента\nприведены массовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает\n(в процентах) распространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число нейтронов в ядре наименее распространённого из указанных изотопов галлия.\n</p>", "solution_html": "<p class=\"noindent\">Наименее распространенный изотоп галлия имеет массовое число, равное 71 и порядковый номер 31. Порядковый номер показывает\nчисло протонов в ядре изотопа, а массовое число – сумму числа протонов и нейтронов. Следовательно, число нейтронов в изотопе\nгаллия равно 40.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433553/v-de-2020-1-pict19.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T07:10:25Z", "updated_at": "2026-08-17T07:10:59Z"}, {"id": 84980, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д.И. Менделеева. Под названием каждого элемента приведены\nмассовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в процентах)\nраспространённость соответствующего изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Определите число нейтронов в ядре наименее распространенного изотопа цинка.\n</p>", "solution_html": "<p class=\"noindent\">Число нейтронов равно разности массового и зарядового числа. Менее распространенный изотоп цинка <img alt=\"68\n30Zn  \" class=\"math\" src=\"index-e2403ea24f087af7613fb526ebae4643.svg\"/>. Тогда число\nнейтронов 68-30=38.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/168173/v-de-2020-1-pict19.png", "index-e2403ea24f087af7613fb526ebae4643.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/168174/index-e2403ea24f087af7613fb526ebae4643.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2023"], "created_at": "2024-04-14T06:13:38Z", "updated_at": "2026-04-08T17:29:17Z"}, {"id": 55067, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">На рисунке представлен фрагмент Периодической системы элементов Д.И. Менделеева. Под названием каждого элемента приведены\nмассовые числа его основных стабильных изотопов. При этом нижний индекс около массового числа указывает (в процентах)\nраспространённость изотопа в природе.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"v-de-2020-1-pict19.png\" width=\"263\"/> </p> </figure>\n<p class=\"indent\">   Укажите число протонов в ядре стабильного изотопа бериллия.\n</p>", "solution_html": "<p class=\"noindent\">В изотопе бериллия 4 протона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"v-de-2020-1-pict19.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/101782/v-de-2020-1-pict19.png"}, "tags": ["Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2023-03-18T06:31:37Z", "updated_at": "2026-04-08T17:29:08Z"}, {"id": 13634, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Сколько протонов и сколько нейтронов содержится в ядре <img alt=\"60\n27Co  \" class=\"math\" src=\"index-fede53e00dbe94d8013f53ab2e559f9c.svg\"/>?\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|---------------|\n|-Число протонов|Ч-исло нейтронов\n-------------------------------|\n\" class=\"math-display\" src=\"index-55b8218c53c24f31b2879b5a57ca7425.svg\"/></div>", "solution_html": "<p class=\"noindent\">Число протонов равно зарядовому числу и равно 27, а число нейтронов равно разности массового числа\nи зарядового и равно 60-27=33\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fede53e00dbe94d8013f53ab2e559f9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27541/index-fede53e00dbe94d8013f53ab2e559f9c.svg", "index-55b8218c53c24f31b2879b5a57ca7425.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27541/index-55b8218c53c24f31b2879b5a57ca7425.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2017", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демоверсия 2017"], "created_at": "2021-12-07T12:20:08Z", "updated_at": "2026-06-27T10:51:55Z"}, {"id": 187004, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Сколько нейтронов содержится в ядре <img alt=\"60\n27Co  \" class=\"math\" src=\"index-25347347cbb23ba6baea2e27fab2dfc5.svg\"/>?\n</p>", "solution_html": "<p class=\"noindent\">Число нейтронов равно разности массового и зарядового чисел, то есть оно равно 60-27=33.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-25347347cbb23ba6baea2e27fab2dfc5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412223/index-25347347cbb23ba6baea2e27fab2dfc5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2017", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Демоверсия 2017"], "created_at": "2026-06-27T10:50:4  "solution_html": "<p class=\"noindent\">Число электронов равно зарядовому числу и равно 8, а число нейтронов равно разности массового числа\nи зарядового и равно 21-8=13.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f0295fd2dcd9a9faf33f5c9aad590829.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197726/index-f0295fd2dcd9a9faf33f5c9aad590829.svg", "index-aebd1a05e4911858c8af65ce1c454a62.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197726/index-aebd1a05e4911858c8af65ce1c454a62.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика атома. Линейчатые спектры. Постулаты Бора"], "sources": ["Демидова 2019"], "created_at": "2024-09-18T17:56:53Z", "updated_at": "2026-06-27T11:07:03Z"}, {"id": 13643, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Определите число электронов в электронной оболочке нейтрального атома <img alt=\"65\n30Zn  \" class=\"math\" src=\"index-f9f254c8b4b355d97a25e451aed0eda1.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">Заряд ядра атома цинка равен 30, следовательно в ядре 30 протонов. В нейтральном атоме число\nпротонов равно числу электронов. Следовательно, вокруг ядра вращается 30 электронов.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f9f254c8b4b355d97a25e451aed0eda1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27559/index-f9f254c8b4b355d97a25e451aed0eda1.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2021-12-07T12:31:59Z", "updated_at": "2026-04-08T17:26:47Z"}, {"id": 13641, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Определите число электронов в электронной оболочке нейтрального атома <img alt=\"89\n39Y  \" class=\"math\" src=\"index-dd284dc2675898a1993c7ee0b6afdd9a.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">Заряд ядра равен <img alt=\"Z = 39  \" class=\"math\" src=\"index-7f2206ca866048a62445d1f5f7ee5029.svg\"/>. Количество электронов в нейтрально заряженном атоме равно количеству протонов. Значит, кол-во\nэлектронов равно 39.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-dd284dc2675898a1993c7ee0b6afdd9a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27555/index-dd284dc2675898a1993c7ee0b6afdd9a.svg", "index-7f2206ca866048a62445d1f5f7ee5029.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27556/index-7f2206ca866048a62445d1f5f7ee5029.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2021-12-07T12:31:05Z", "updated_at": "2026-05-26T18:26:58Z"}, {"id": 13640, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Каков заряд ядра <img alt=\"11\n5 B  \" class=\"math\" src=\"index-e2218069cd347fb21e39a441f022723a.svg\"/> (в единицах элементарного заряда)?\n</p>", "solution_html": "<p class=\"noindent\">Заряд ядра равен <img alt=\"Z = 5  \" class=\"math\" src=\"index-04204764c9898c7b3f14e593ee58069d.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e2218069cd347fb21e39a441f022723a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27553/index-e2218069cd347fb21e39a441f022723a.svg", "index-04204764c9898c7b3f14e593ee58069d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27554/index-04204764c9898c7b3f14e593ee58069d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2021-12-07T12:30:25Z", "updated_at": "2026-04-08T17:26:32Z"}, { : "", "images": {"index-f413b942dc7264a056719a92dd836be4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27551/index-f413b942dc7264a056719a92dd836be4.svg", "index-bfa01a7f8e7227b47b86df597464663d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27551/index-bfa01a7f8e7227b47b86df597464663d.svg", "index-2227e5925586a747a78e98ed8ccc0853.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27552/index-2227e5925586a747a78e98ed8ccc0853.svg", "index-0a6e33a030b69894d596e9fb098ce3f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27552/index-0a6e33a030b69894d596e9fb098ce3f2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": [], "created_at": "2021-12-07T12:29:55Z", "updated_at": "2026-01-27T11:40:39Z"}, {"id": 13642, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Электронная оболочка электрически нейтрального атома криптона содержит 36 электронов. Сколько\nнейтронов содержится в ядрах изотопов криптона–78 и криптона–86? В ответе запишите только числа,\nне разделяя их пробелом или другим знаком.\n</p>", "solution_html": "<p class=\"noindent\">Нейтральный атом криптона содержит 36 протонов. Значит в изотопе–78 количество нейтронов <img alt=\"n1 = 78− 36= 42  \" class=\"math\" src=\"index-275003e2ceff4d9f146874489ea1e209.svg\"/>, а в изотопе–86\nколичество нейтронов <img alt=\"n2 = 86− 36= 50  \" class=\"math\" src=\"index-6eadb7f82231cbe72c7d2bf51577cfd0.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-275003e2ceff4d9f146874489ea1e209.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27558/index-275003e2ceff4d9f146874489ea1e209.svg", "index-6eadb7f82231cbe72c7d2bf51577cfd0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27558/index-6eadb7f82231cbe72c7d2bf51577cfd0.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": [], "created_at": "2021-12-07T12:31:33Z", "updated_at": "2026-04-24T07:22:59Z"}, {"id": 20425, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Модель атома и атомного ядра", "question_html": "<p class=\"noindent\">Ядро атома содержит 16 нейтронов и 15 протонов, вокруг него обращаются 15 электронов. Эта система частиц –\n</p><p class=\"indent\">   1) ион <img alt=\"3112P  \" class=\"math\" src=\"index-450c229a252bcfab23398f972d6615ec.svg\"/><br/>2) ион <img alt=\"3116S  \" class=\"math\" src=\"index-0801fa12d6ba222ed7cd369acf6a5ef5.svg\"/><br/>3) атом <img alt=\"3116S  \" class=\"math\" src=\"index-8c3443fae87e12083735a319925c44ef.svg\"/><br/>4) атом <img alt=\"31P\n15  \" class=\"math\" src=\"index-8fba8e0006db602ebbc36b7d9c4f5b0d.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Ядро атома содержит 15 протонов, следовательно, это ядро фосфора (количество протонов записывается внизу перед наименованием\nэлемента). Поскольку число электронов совпадает с числом протонов, система является электрически нейтральной. Таким образом,\nописанная система частиц представляет собой атом <img alt=\"3115P.  \" class=\"math\" src=\"index-ddd9b6c45f7c209010a7c7450739493b.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-450c229a252bcfab23398f972d6615ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39675/index-450c229a252bcfab23398f972d6615ec.svg", "index-0801fa12d6ba222ed7cd369acf6a5ef5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39675/index-0801fa12d6ba222ed7cd369acf6a5ef5.svg", "index-8c3443fae87e12083735a319925c44ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39675/index-8c3443fae87e12083735a319925c44ef.svg", "index-8fba8e0006db602ebbc36b7d9c4f5b0d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39675/index-8fba8e0006db602ebbc36b7d9c4f5b0d.svg", "index-ddd9b6c45f7c209010a7c7450739493b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39676/index-ddd9b6c45f7c209010a7c7450739493b.svg"}, "tags": ["Средняя скорость", "Формат ЕГЭ", "Квантовая физика", "Физика ядра. Радиоактивность"], "sources": [], "created_at": "2022-02-23T17:22:21Z", "updated_at": "2026-01-27T11:41:55Z"}, {"id": 96020, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Радиоактивный изотоп висмута <img alt=\"28123 Bi.  \" class=\"math\" src=\"index-e86d261e5c1544313ba145a6ea0b210e.svg\"/> претерпевает <img alt=\"β  \" class=\"math\" src=\"index-9c70f73194a51df93c67f1eaf2af8d36.svg\"/>-распад. Укажите число протонов и число нейтронов в\nобразовавшемся ядре.\n</p> <div class=\"math-display\">\n<img alt=\"|---------------|----------------|\n|Ч-исло-протон-ов-|Ч-исло н-ейтронов|\n---------------------------------|\n\" class=\"math-display\" src=\"index-6e2a4efc8980a37d5ed4137ba0037d30.svg\"/></div>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"212     212     0\n83 Bi = 84 X  + −1 e + ν\n\" class=\"math-display\" src=\"index-c7e2a68230fa3ab659e1e5bf4278127f.svg\"/></div>\n<p class=\"indent\">   Число протонов равно зарядовому числу и равно 84, а число нейтронов равно разности массового\nчисла и зарядового и равно 212-84=128.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e86d261e5c1544313ba145a6ea0b210e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195651/index-e86d261e5c1544313ba145a6ea0b210e.svg", "index-9c70f73194a51df93c67f1eaf2af8d36.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195651/index-9c70f73194a51df93c67f1eaf2af8d36.svg", "index-6e2a4efc8980a37d5ed4137ba0037d30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195651/index-6e2a4efc8980a37d5ed4137ba0037d30.svg", "index-c7e2a68230f 45Z"}, {"id": 13654, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате цепной реакции деления урана образуется ядро химического элемента. Каковы заряд образовавшегося ядра (в\nединицах элементарного заряда) и его массовое число ?\n</p> <div class=\"math-display\">\n<img alt=\"10n +29325U →AZ X +15369Ba +310n\n\" class=\"math-display\" src=\"index-ad5fc182e0656c89dd60885868d6221d.svg\"/></div>\n<p class=\"indent\">   В ответе запишите числа слитно без пробела.\n</p>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа и заряда получаем:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{ 1+ 235= A +139 +3 ⋅1\n( 0+ 92= Z + 56 + 0\n\" class=\"math-display\" src=\"index-1720abb2dd6370cd5c22815469c2217f.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\"><br/>Получим, А=94, Z=36.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ad5fc182e0656c89dd60885868d6221d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27581/index-ad5fc182e0656c89dd60885868d6221d.svg", "index-1720abb2dd6370cd5c22815469c2217f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27582/index-1720abb2dd6370cd5c22815469c2217f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2021-12-07T12:41:08Z", "updated_at": "2026-07-03T10:45:57Z"}, {"id": 188310, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате цепной реакции деления урана образуется ядро химического элемента. Каков заряд образовавшегося ядра (в единицах\nэлементарного заряда)?\n</p> <div class=\"math-display\">\n<img alt=\"10n +29325U →AZ X +15369Ba +310n\n\" class=\"math-display\" src=\"index-1b48c0cc02d897d54729f1 dex-d62aa42cb422fa140a22dd987c655bec.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3164d5ff0bd8ff6c31d16c75615ee58f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-3164d5ff0bd8ff6c31d16c75615ee58f.svg", "index-2483dd373aa49a192ef61d2b3e969d4c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-2483dd373aa49a192ef61d2b3e969d4c.svg", "index-9fee2186111294247937ceb253648579.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-9fee2186111294247937ceb253648579.svg", "index-beefc7d0258c6e6e7ef73b4c980ec9ab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-beefc7d0258c6e6e7ef73b4c980ec9ab.svg", "index-ab7fc90d37f157d3c2385068ff5b31be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-ab7fc90d37f157d3c2385068ff5b31be.svg", "index-0479ed2d8bd93e2ebed699f7395603dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344159/index-0479ed2d8bd93e2ebed699f7395603dd.svg", "index-3e9ad259e8f579da0c924d3e29464087.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344160/index-3e9ad259e8f579da0c924d3e29464087.svg", "index-0dbd88feefb46aeca14e9879f2f1f578.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344160/index-0dbd88feefb46aeca14e9879f2f1f578.svg", "index-277697c0872ddb8f384a38fceca5ada8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344160/index-277697c0872ddb8f384a38fceca5ada8.svg", "index-d62aa42cb422fa140a22dd987c655bec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/344160/index-d62aa42cb422fa140a22dd987c655bec.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-01-08T10:49:32Z", "updated_at": "2026-09-02T20:26:19Z"}, {"id": 170680, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Чему равно зарядовое число ядра, из которого после двух последовательных <img alt=\"α  \" class=\"math\" src=\"index-0a5f97af28bf5bd2f4525f0eba66cb68.svg\"/>–распадов образуется ядро Цезия\n<img alt=\"15480 Ce.  \" class=\"math\" src=\"index-0e81104e68e9e8c39297fb82537dde8a.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Реакция:\n</p> <div class=\"math-display\">\n<img alt=\"A     4    140\nZX → 22He +58 Ce.\n\" class=\"math-display\" src=\"index-c4b852e01b41191928eb6ca668c5b32f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Z = 2 ⋅2 +58\n\" class=\"math-display\" src=\"index-77e8e021630b45b1c183b283a4686174.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Z = 62\n\" class=\"math-display\" src=\"index-25b7a90382e3f0a43801af24ff1aabba.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0a5f97af28bf5bd2f4525f0eba66cb68.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368037/index-0a5f97af28bf5bd2f4525f0eba66cb68.svg", "index-0e81104e68e9e8c39297fb82537dde8a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368037/index-0e81104e68e9e8c39297fb82537dde8a.svg", "index-c4b852e01b41191928eb6ca668c5b32f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368038/index-c4b852e01b41191928eb6ca668c5b32f.svg", "index-77e8e021630b45b1c183b283a4686174.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368038/index-77e8e021630b45b1c183b283a4686174.svg", "index-25b7a90382e3f0a43801af24ff1aabba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/368038/index-25b7a90382e3f0a43801af24ff1aabba.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2026-02-25T12:08:59Z", "updated_at": "2026-09-02T20:29:46Z"}, {"id": 91782, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Ядро бора может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"42He +115 B →AZ X +10 n  \" class=\"math\" src=\"index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg\"/> с\nобразованием ядра химического элемента Каковы заряд образовавшегося ядра Z (в единицах элементарного заряда) и его\nмассовое число А?\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|---------------------|\n|З аряд ядра Z |М ассовое число ядра A|\n|--------------|---------------------|\n-------------------------------------|\n\" class=\"math-display\" src=\"index-851f749e6557408e89c247d238fe3fb7.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p> <div class=\"math-display\">\n<img alt=\"Z = 2+ 5− 0= 7\n\" class=\"math-display\" src=\"index-792c1b10c072c27260593a3de5ad1163.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A = 4+ 11− 1= 14\n\" class=\"math-display\" src=\"index-76ae7b3c387c29db4f7d752b0c728b32.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/183000/index-8e15ea3fe6dd1c66ae0171864d9bca8e.svg", "index-851f749e6557408e89c247d238fe3fb7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/183000/index-851f749e6557408e89c247d238fe3fb7.svg", "index-792c1b10c072c27260593a3de5ad1163.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/192309/index-792c1b10c072c27260593a3de5ad1163.svg", "index-76ae7b3c387c29db4f7d752b0c728b32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/192309/index-76ae7b3c387c29db4f7d752b0c728b32.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Демидова 2019"], "created_at": "2024-07-09T10:09:07Z", "updated_at": "2026-07-03T11:09:30Z"}, {"id": 188360, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">При попадании <img alt=\"α  \" class=\"math\" src=\"index-1b5913567ebd4250ee120d900f3bd4b6.svg\"/>-частицы в ядро бора <img alt=\"11\n5 B  \" class=\"math\" src=\"index-040eb0fd23dcbf60f6f55494a8703a64.svg\"/> происходит реакция, в результате которой образуется некоторый элемент и вылетает\nнейтрон. Найти зарядовое число получающегося элемента.\n</p>", "solution_html": "<p class=\"noindent\"><img alt=\"α  \" class=\"math\" src=\"index-3e9ad259e8f579da0c924d3e29464087.svg\"/>-частица – гелий <img alt=\"4\n2He  \" class=\"math\" src=\"index-885897cf1514fcbbd449b9daf9df199b.svg\"/>. Запишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"11   4     A    1\n5 B +2 He →Z X +0n.\n\" class=\"math-display\" src=\"index-bfe5169c05aa83e1339d59e5776053d7.svg\"/></div>\n<p class=\"indent\">   В ходе ядерной реакции должен выполняться закон сохранения зарядового числа.\n</p> <div class=\"math-display\">\n<img alt=\"5+ 2= Z +0 ⇒ Z = 7.\n\" class=\"math-display\" src=\"index-1336d5db444792661d7a4a6066ba74c5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1b5913567ebd4250ee120d900f3bd4b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415292/index-1b5913567ebd4250ee120d900f3bd4b6.svg", "index-040eb0fd23dcbf60f6f55494a8703a64.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415292/index-040eb0fd23dcbf60f6f55494a8703a64.svg", "index-3e9ad259e8f579da0c924d3e29464087.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415293/index-3e9ad259e8f579da0c924d3e29464087.svg", "index-885897cf1514fcbbd449b9daf9df199b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415293/index-885897cf1514fcbbd449b9daf9df199b.svg", "index-bfe5169c05aa83e1339d59e5776053d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415293/index-bfe5169c05aa83e1339d59e5776053d7.svg", "index-1336d5db444792661d7a4a6066ba74c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415293/index-1336d5db444792661d7a4a6066ba74c5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2026-07-03T11:27:46Z", "updated_at": "2026-09-02T20:28:25Z"}, {"id": 94026, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Ядро бериллия может захватить гамма-квант, в результате чего происходит ядерная реакция <img alt=\"9    0   A    1\n4Be+ 0γ →Z X +0n  \" class=\"math\" src=\"index-c8468e5ddd217748fb5c6954476b81bf.svg\"/> с образованием\nядра химического элемента <img alt=\"AZX.  \" class=\"math\" src=\"index-27a5c5ef6f4d1c53c4895b6b676421fc.svg\"/> Каковы заряд образовавшегося ядра Z (в единицах элементарного заряда) и его массовое число\nА?\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|--------------------|\n|Заряд ядра-Z|Массовое число ядра A\n|            |                    |\n----------------------------------\n\" class=\"math-display\" src=\"index-63563f8ac84e33904d0f6032d4a766fd.svg\"/></div>", "solution_html": "<p class=\"noindent\">\n</p> <div class=\"math-display\">\n<img alt=\"4+ 0= Z + 0⇒ Z = 4\n\" class=\"math-display\" src=\"index-3a73356961d7fab19841e303ba055319.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"9+ 0= A + 1⇒ A = 8\n\" class=\"math-display\" src=\"index-9af9b0b5a0cfc1312a4e58d8f351eccc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c8468e5ddd217748fb5c6954476b81bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189648/index-c8468e5ddd217748fb5c6954476b81bf.svg", "index-27a5c5ef6f4d1c53c4895b6b676421fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189648/index-27a5c5ef6f4d1c53c4895b6b676421fc.svg", "index-63563f8ac84e33904d0f6032d4a766fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189648/index-63563f8ac84e33904d0f6032d4a766fd.svg", "index-3a73356961d7fab19841e303ba055319.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198633/index-3a73356961d7fab19841e303ba055319.svg", "index-9af9b0b5a0cfc1312a4e58d8f351eccc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198633/index-9af9b0b5a0cfc1312a4e58d8f351eccc.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2024-08-03T05:44:22Z", "updated_at": "2026-07-03T11:12:11Z"}, {"id": 96874, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Элемент менделевий был получен при бомбардировке а-частицами ядер элемента X в соответствии с реакцией <img alt=\"   4     256     1\nX + 2He → 101 Md +0n  \" class=\"math\" src=\"index-05f0c2d4f7d0af52977b2a8a6de57762.svg\"/>\nУкажите зарядовое число и массовое число элемента X.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|--------------|\n|Зарядовое-число-|М-ассовое число|\n-------------------------------\n\" class=\"math-display\" src=\"index-a001c93b8376ae23927ee719f6797d54.svg\"/></div>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма массовых и зарядовых чисел до реакции равны соответствующим суммам\nмассовых и зарядовых чисел после реакции. То есть для данной ядерной реакции можно записать\nравенства:\n</p> <div class=\"math-display\">\n<img alt=\"A +  4 = 256 + 1\n\" class=\"math-display\" src=\"index-81672efa81505429f59030be4e4432d5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Z +  2 = 101 + 0\n\" class=\"math-display\" src=\"index-74eaa50d2a402c6b20c8b348d0a1fa03.svg\"/></div>\n<p class=\"indent\">   A=253, Z=99\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-05f0c2d4f7d0af52977b2a8a6de57762.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198198/index-05f0c2d4f7d0af52977b2a8a6de57762.svg", "index-a001c93b8376ae23927ee719f6797d54.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198198/index-a001c93b8376ae23927ee719f6797d54.svg", "index-81672efa81505429f59030be4e4432d5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206383/index-81672efa81505429f59030be4e4432d5.svg", "index-74eaa50d2a402c6b20c8b348d0a1fa03.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206383/index-74eaa50d2a402c6b20c8b348d0a1fa03.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2024-09-22T11:36:52Z", "updated_at": "2026-07-03T11:13:01Z"}, {"id": 97907, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате реакции синтеза ядра дейтерия с ядром <img alt=\"A\nZX  \" class=\"math\" src=\"index-608bdafa000fbf67e202a17e89020ffc.svg\"/> образуется ядро бора и нейтрон в соответствии с реакцией:\n<img alt=\"21H +AZ X →105 B +10n.  \" class=\"math\" src=\"index-30b012744018acb9fbc7e7957968fdab.svg\"/>\n</p><p class=\"indent\">   Укажите зарядовое число Z и массовое число А ядра X.\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|--------------|\n|Зарядовое-число-|М-ассовое число|\n-------------------------------\n\" class=\"math-display\" src=\"index-a001c93b8376ae23927ee719f6797d54.svg\"/></div>", "solution_html": "<p class=\"noindent\">Учитывая закон сохранения массовых и зарядовых чисел до реакции и после нее, можно записать равенства:\n</p> <div class=\"math-display\">\n<img alt=\"2+ A = 10+ 1\n\" class=\"math-display\" src=\"index-365488a2a84030ba1629225941e65fbc.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"1+ Z = 5 +0\n\" class=\"math-display\" src=\"index-ca8c41ffea1fc88e5baa308abedbae42.svg\"/></div>\n<p class=\"indent\">   A=9;Z=4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-608bdafa000fbf67e202a17e89020ffc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200470/index-608bdafa000fbf67e202a17e89020ffc.svg", "index-30b012744018acb9fbc7e7957968fdab.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200470/index-30b012744018acb9fbc7e7957968fdab.svg", "index-a001c93b8376ae23927ee719f6797d54.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/200470/index-a001c93b8376ae23927ee719f6797d54.svg", "index-365488a2a84030ba1629225941e65fbc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206429/index-365488a2a84030ba1629225941e65fbc.svg", "index-ca8c41ffea1fc88e5baa308abedbae42.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206429/index-ca8c41ffea1fc88e5baa308abedbae42.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2024-10-08T17:37:41Z", "updated_at": "2026-07-03T11:14:52Z"}, {"id": 96924, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Деление ядра урана тепловыми нейтронами описывается реакцией <img alt=\"1   235    A    139      1\n0n+ 92 U → Z X + 56 Ba + 30n+ 7γ.  \" class=\"math\" src=\"index-db314b79e3512964e4098e3727840b0e.svg\"/> При этом образовалось ядро\nхимического элемента Укажите зарядовое число Z и массовое число А элемента X.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|--------------|--------------|\n|Зарядовое-число-|М-ассовое число|\n-------------------------------\n\" class=\"math-display\" src=\"index-a001c93b8376ae23927ee719f6797d54.svg\"/></div>", "solution_html": "<p class=\"noindent\">При ядерных реакциях сумма массовых и зарядовых чисел до реакции равны соответствующим суммам\nмассовых и зарядовых чисел после реакции. То есть для данной ядерной реакции можно записать\nравенства:\n</p> <div class=\"math-display\">\n<img alt=\"1 + 235 = A + 139 + 1 ⋅ 3\n\" class=\"math-display\" src=\"index-7377122503c9a9c66155e049596dacb7.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"0 + 92 = Z +  56 + 0\n\" class=\"math-display\" src=\"index-28aaf061b008fa580b4eeef362f3eadb.svg\"/></div>\n<p class=\"indent\">   A=94, Z=36.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-db314b79e3512964e4098e3727840b0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198317/index-db314b79e3512964e4098e3727840b0e.svg", "index-a001c93b8376ae23927ee719f6797d54.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/198317/index-a001c93b8376ae23927ee719f6797d54.svg", "index-7377122503c9a9c66155e049596dacb7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206386/index-7377122503c9a9c66155e049596dacb7.svg", "index-28aaf061b008fa580b4eeef362f3eadb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206386/index-28aaf061b008fa580b4eeef362f3eadb.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика"], "sources": ["Демидова 2019"], "created_at": "2024-09-23T16:31:26Z", "updated_at": "2026-07-03T11:16:03Z"}, {"id": 109850, "name": "Треки частиц", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">На рисунке изображены треки <img alt=\"α  \" class=\"math\" src=\"index-556745c286f622c54be3611926f8bb22.svg\"/>-частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном\nмагнитном поле, линии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент\nих попадания в поле одинаковые. Определите массовое и зарядовое число частицы, которая обозначена номером\n1.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"109850.png\" width=\"526\"/></p></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|-------------|---------------|\n|Массовое число|З-арядовое число\n-------------------------------\n\" class=\"math-display\" src=\"index-8a4a5ae7dd6f9db2b7a94676b8e6c0ba.svg\"/></div>", "solution_html": "<p class=\"noindent\">Частица 1 не имеет заряда, так как не отклоняется магнитным полем. Следовательно, данная частица является нейтроном, у\nкоторого массовое число равно 1, зарядовое число 0.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-556745c286f622c54be3611926f8bb22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/226112/index-556745c286f622c54be3611926f8bb22.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/226112/109850.png", "index-8a4a5ae7dd6f9db2b7a94676b8e6c0ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/226112/index-8a4a5ae7dd6f9db2b7a94676b8e6c0ba.svg"}, "tags": [], "sources": [], "created_at": "2025-03-15T01:14:57Z", "updated_at": "2026-07-03T11:17:06Z"}, {"id": 188349, "name": "Треки частиц", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">На рисунке изображены треки <img alt=\"α  \" class=\"math\" src=\"index-5f1f9bdb304f05576721d637808a7aea.svg\"/>-частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном магнитном поле,\nлинии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент их попадания в поле одинаковые.\nОпределите массовое число частицы, которая обозначена номером 1.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"109850.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">Частица 1 не имеет заряда, так как не отклоняется магнитным полем. Следовательно, данная частица является нейтроном, у\nкоторого массовое число равно 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f1f9bdb304f05576721d637808a7aea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415271/index-5f1f9bdb304f05576721d637808a7aea.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415271/109850.png"}, "tags": [], "sources": [], "created_at": "2026-07-03T11:16:48Z", "updated_at": "2026-07-03T13:02:02Z"}, {"id": 188350, "name": "Треки частиц", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">На рисунке изображены треки <img alt=\"α  \" class=\"math\" src=\"index-5f1f9bdb304f05576721d637808a7aea.svg\"/>-частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном магнитном поле,\nлинии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент их попадания в поле одинаковые.\nОпределите массовое число частицы, которая обозначена номером 2.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"109850.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">Сила Лоренца:\n</p> <div class=\"math-display\">\n<img alt=\"FL =Bvqsinα,\n\" class=\"math-display\" src=\"index-44ae4777854f4e6905420ac8594ce48b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"B  \" class=\"math\" src=\"index-d77e76b4566880a4ddc27198329f3f4b.svg\"/> – модуль вектора магнитной индукции, <img alt=\"v  \" class=\"math\" src=\"index-537f91ab64e1254b6e719dbb434eda9c.svg\"/> – скорость заряда, <img alt=\"q  \" class=\"math\" src=\"index-77e01252043eb76f9842151c5956166a.svg\"/> – заряд, <img alt=\"α  \" class=\"math\" src=\"index-396c3c99cdda29c06491cf1e8003c271.svg\"/> – угол между вектором магнитного поля и\nскоростью движения частицы. Ее направление определяется по правилу левой руки и направлена в сторону положительного заряда.\nДля отрицательного заряда она имеет противоположное направление. Итак, по правилу левой руки сила Лоренца будет направлена\nвлево для положительных зарядов и вправо – для отрицательных.<br/>Запишем второй закон Ньютона для частицы, находящейся в магнитном поле\n</p> <div class=\"math-display\">\n<img alt=\"F  = ma,\n L\n\" class=\"math-display\" src=\"index-de1f2e2b1c714a652fec1ccc58cd39ae.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Bvqsinα= m v2. (1)\n            r\n\" class=\"math-display\" src=\"index-e9d39618be06fc3e4e1b9f10909fcf24.svg\"/></div>\n<p class=\"indent\">   Тогда радиус окружности, по которой будет двигаться частица\n</p> <div class=\"math-display\">\n<img alt=\"r = mv-.\n    |q|B\n\" class=\"math-display\" src=\"index-dbf7988ad969fc8442532173f4eb277a.svg\"/></div>\n<p class=\"indent\">   Рассмотрим положительно заряженные частицы по отдельности<br/>1) <img alt=\"α  \" class=\"math\" src=\"index-483ba87f31967db093bd5bda21a7e7f7.svg\"/>-частица(<img alt=\"4\n2He  \" class=\"math\" src=\"index-d2e000144a1d1710a83e4fb211373cca.svg\"/>): Ее масса 4 а.е.м., заряд <img alt=\"2|e| \" class=\"math\" src=\"index-a354b64fffe6013b702337f36fed82de.svg\"/>.<br/>2) Протон Его масса 1 а.е.м., заряд <img alt=\"|e| \" class=\"math\" src=\"index-b22b78a373fa5f60c7cfec1f6d8c7a01.svg\"/>.<br/>3) Позитрон Масса практически 0, заряд <img alt=\"|e| \" class=\"math\" src=\"index-9c24aef913930a557bb2451e5b508e16.svg\"/>.<br/>Из (1) можно сделать вывод, что чем больше масса и чем меньше заряд, тем больше радиус кривизны. А чем больше радиус\nкривизны, тем меньше частица отклоняется.<br/>Тогда 2 соответствует <img alt=\"α  \" class=\"math\" src=\"index-6d0c06ede164b435803882246fcaf857.svg\"/>-частице, 3 - протону, 4 - позитрону.<br/>Массовое число <img alt=\"α  \" class=\"math\" src=\"index-8008288d813a61c45c7517aa1f6154bd.svg\"/>-частицы равно 4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f1f9bdb304f05576721d637808a7aea.svg": "https://3.shkolkovo.online/api/latex-ser 20ac8594ce48b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"B  \" class=\"math\" src=\"index-d77e76b4566880a4ddc27198329f3f4b.svg\"/> – модуль вектора магнитной индукции, <img alt=\"v  \" class=\"math\" src=\"index-537f91ab64e1254b6e719dbb434eda9c.svg\"/> – скорость заряда, <img alt=\"q  \" class=\"math\" src=\"index-77e01252043eb76f9842151c5956166a.svg\"/> – заряд, <img alt=\"α  \" class=\"math\" src=\"index-396c3c99cdda29c06491cf1e8003c271.svg\"/> – угол между вектором магнитного поля и\nскоростью движения частицы. Ее направление определяется по правилу левой руки и направлена в сторону положительного заряда.\nДля отрицательного заряда она имеет противоположное направление. Итак, по правилу левой руки сила Лоренца будет направлена\nвлево для положительных зарядов и вправо – для отрицательных.<br/>Запишем второй закон Ньютона для частицы, находящейся в магнитном поле\n</p> <div class=\"math-display\">\n<img alt=\"F  = ma,\n L\n\" class=\"math-display\" src=\"index-de1f2e2b1c714a652fec1ccc58cd39ae.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Bvqsinα= m v2. (1)\n            r\n\" class=\"math-display\" src=\"index-e9d39618be06fc3e4e1b9f10909fcf24.svg\"/></div>\n<p class=\"indent\">   Тогда радиус окружности, по которой будет двигаться частица\n</p> <div class=\"math-display\">\n<img alt=\"r = mv-.\n    |q|B\n\" class=\"math-display\" src=\"index-dbf7988ad969fc8442532173f4eb277a.svg\"/></div>\n<p class=\"indent\">   Рассмотрим положительно заряженные частицы по отдельности<br/>1) <img alt=\"α  \" class=\"math\" src=\"index-483ba87f31967db093bd5bda21a7e7f7.svg\"/>-частица(<img alt=\"4\n2He  \" class=\"math\" src=\"index-d2e000144a1d1710a83e4fb211373cca.svg\"/>): Ее масса 4 а.е.м., заряд <img alt=\"2|e| \" class=\"math\" src=\"index-a354b64fffe6013b702337f36fed82de.svg\"/>.<br/>2) Протон Его масса 1 а.е.м., заряд <img alt=\"|e| \" class=\"math\" src=\"index-b22b78a373fa5f60c7cfec1f6d8c7a01.svg\"/>.<br/>3) Позитрон Масса практически 0, заряд <img alt=\"|e| \" class=\"math\" src=\"index-9c24aef913930a557bb2451e5b508e16.svg\"/>.<br/>Из (1) можно сделать вывод, что чем больше масса и чем меньше заряд, тем больше радиус кривизны. А чем больше радиус\nкривизны, тем меньше частица отклоняется.<br/>Тогда 2 соответствует <img alt=\"α  \" class=\"math\" src=\"index-6d0c06ede164b435803882246fcaf857.svg\"/>-частице, 3 - протону, 4 - позитрону.<br/>Значит ответ будет 11\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-556745c286f622c54be3611926f8bb22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231413/index-556745c286f622c54be3611926f8bb22.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231413/109850.png", "index-8a4a5ae7dd6f9db2b7a94676b8e6c0ba.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231413/index-8a4a5ae7dd6f9db2b7a94676b8e6c0ba.svg", "index-44ae4777854f4e6905420ac8594ce48b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-44ae4777854f4e6905420ac8594ce48b.svg", "index-d77e76b4566880a4ddc27198329f3f4b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-d77e76b4566880a4ddc27198329f3f4b.svg", "index-537f91ab64e1254b6e719dbb434eda9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-537f91ab64e1254b6e719dbb434eda9c.svg", "index-77e01252043eb76f9842151c5956166a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-77e01252043eb76f9842151c5956166a.svg", "index-396c3c99cdda29c06491cf1e8003c271.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-396c3c99cdda29c06491cf1e8003c271.svg", "index-de1f2e2b1c714a652fec1ccc58cd39ae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-de1f2e2b1c714a652fec1ccc58cd39ae.svg", "index-e9d39618be06fc3e4e1b9f10909fcf24.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/231414/index-e9d39618be06fc3e4 \"/>.<br/>2) Протон Его масса 1 а.е.м., заряд <img alt=\"|e| \" class=\"math\" src=\"index-b22b78a373fa5f60c7cfec1f6d8c7a01.svg\"/>.<br/>3) Позитрон Масса практически 0, заряд <img alt=\"|e| \" class=\"math\" src=\"index-9c24aef913930a557bb2451e5b508e16.svg\"/>.<br/>Из (1) можно сделать вывод, что чем больше масса и чем меньше заряд, тем больше радиус кривизны. А чем больше радиус\nкривизны, тем меньше частица отклоняется.<br/>Тогда 2 соответствует <img alt=\"α  \" class=\"math\" src=\"index-6d0c06ede164b435803882246fcaf857.svg\"/>-частице, 3 - протону, 4 - позитрону.<br/>Следовательно, зарядовое число равно 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f1f9bdb304f05576721d637808a7aea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415396/index-5f1f9bdb304f05576721d637808a7aea.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415396/109850.png", "index-44ae4777854f4e6905420ac8594ce48b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-44ae4777854f4e6905420ac8594ce48b.svg", "index-d77e76b4566880a4ddc27198329f3f4b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-d77e76b4566880a4ddc27198329f3f4b.svg", "index-537f91ab64e1254b6e719dbb434eda9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-537f91ab64e1254b6e719dbb434eda9c.svg", "index-77e01252043eb76f9842151c5956166a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-77e01252043eb76f9842151c5956166a.svg", "index-396c3c99cdda29c06491cf1e8003c271.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-396c3c99cdda29c06491cf1e8003c271.svg", "index-de1f2e2b1c714a652fec1ccc58cd39ae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/index-de1f2e2b1c714a652fec1ccc58cd39ae.svg", "index-e9d39618be06fc3e4e1b9f10909fcf24.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415397/ind lay\" src=\"index-dbf7988ad969fc8442532173f4eb277a.svg\"/></div>\n<p class=\"indent\">   Рассмотрим положительно заряженные частицы по отдельности<br/>1) <img alt=\"α  \" class=\"math\" src=\"index-483ba87f31967db093bd5bda21a7e7f7.svg\"/>-частица(<img alt=\"4\n2He  \" class=\"math\" src=\"index-d2e000144a1d1710a83e4fb211373cca.svg\"/>): Ее масса 4 а.е.м., заряд <img alt=\"2|e| \" class=\"math\" src=\"index-a354b64fffe6013b702337f36fed82de.svg\"/>.<br/>2) Протон Его масса 1 а.е.м., заряд <img alt=\"|e| \" class=\"math\" src=\"index-b22b78a373fa5f60c7cfec1f6d8c7a01.svg\"/>.<br/>3) Позитрон Масса практически 0, заряд <img alt=\"|e| \" class=\"math\" src=\"index-9c24aef913930a557bb2451e5b508e16.svg\"/>.<br/>Из (1) можно сделать вывод, что чем больше масса и чем меньше заряд, тем больше радиус кривизны. А чем больше радиус\nкривизны, тем меньше частица отклоняется.<br/>Тогда 2 соответствует <img alt=\"α  \" class=\"math\" src=\"index-6d0c06ede164b435803882246fcaf857.svg\"/>-частице, 3 - протону, 4 - позитрону.<br/>Следовательно, зарядовое число равно 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f1f9bdb304f05576721d637808a7aea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415392/index-5f1f9bdb304f05576721d637808a7aea.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415392/109850.png", "index-44ae4777854f4e6905420ac8594ce48b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415393/index-44ae4777854f4e6905420ac8594ce48b.svg", "index-d77e76b4566880a4ddc27198329f3f4b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415393/index-d77e76b4566880a4ddc27198329f3f4b.svg", "index-537f91ab64e1254b6e719dbb434eda9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415393/index-537f91ab64e1254b6e719dbb434eda9c.svg", "index-77e01252043eb76f9842151c5956166a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415393/index-77e01252043eb76f9842151c5 8a7aea.svg\"/>-частицы, электрона, позитрона, нейтрона и протона, движущихся в однородном магнитном поле,\nлинии индукции которого перпендикулярны плоскости рисунка. Скорости всех частиц в момент их попадания в поле одинаковые.\nОпределите модуль зарядового числа частицы, которая обозначена номером 5.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"109850.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">Сила Лоренца:\n</p> <div class=\"math-display\">\n<img alt=\"FL =Bvqsinα,\n\" class=\"math-display\" src=\"index-c100446e2685cfd1f8e19f3061f501ad.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"B  \" class=\"math\" src=\"index-2e39baeaa5e2e15169d2559321da2905.svg\"/> – модуль вектора магнитной индукции, <img alt=\"v  \" class=\"math\" src=\"index-9bc7fd5e14da2c395365bd31ce189081.svg\"/> – скорость заряда, <img alt=\"q  \" class=\"math\" src=\"index-d3d86ee38bf026b534b311bd91f3871d.svg\"/> – заряд, <img alt=\"α  \" class=\"math\" src=\"index-70ff4c9360f74918f9352e0ae497f17b.svg\"/> – угол между вектором магнитного поля и\nскоростью движения частицы. Ее направление определяется по правилу левой руки и направлена в сторону положительного заряда.\nДля отрицательного заряда она имеет противоположное направление. Итак, по правилу левой руки сила Лоренца будет направлена\nвлево для положительных зарядов и вправо – для отрицательных.<br/>Из этого следует, что частица под номером 5 - электрон(<img alt=\"−01e  \" class=\"math\" src=\"index-e1944bca45dce3b4a21ee3870a8f299b.svg\"/>).<br/>Его массовое число: 0, зарядовое число: -1 (его модуль равен 1).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f1f9bdb304f05576721d637808a7aea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322234/index-5f1f9bdb304f05576721d637808a7aea.svg", "109850.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322234/109850.png", "index-c100446e2685cfd1f8e19f3061f501ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-c100446e2685cfd1f8e19f3061f501ad.svg", "index-2e39baeaa5e2e15169d2559321da2905.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-2e39baeaa5e2e15169d2559321da2905.svg", "index-9bc7fd5e14da2c395365bd31ce189081.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-9bc7fd5e14da2c395365bd31ce189081.svg", "index-d3d86ee38bf026b534b311bd91f3871d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-d3d86ee38bf026b534b311bd91f3871d.svg", "index-70ff4c9360f74918f9352e0ae497f17b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-70ff4c9360f74918f9352e0ae497f17b.svg", "index-e1944bca45dce3b4a21ee3870a8f299b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/322235/index-e1944bca45dce3b4a21ee3870a8f299b.svg"}, "tags": [], "sources": [], "created_at": "2025-11-15T21:12:29Z", "updated_at": "2026-05-26T18:46:41Z"}, {"id": 13645, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Ядро бора может захватить альфа-частицу, в результате чего происходит ядерная реакция <img alt=\"4    11    A    1\n2He +5 B → Z X + 0n  \" class=\"math\" src=\"index-8631c32b75e379ed1b7b076d746508c1.svg\"/> с образованием\nядра химического элемента <img alt=\"AZX  \" class=\"math\" src=\"index-87cd78f7cc6720f2438ed72f1d083527.svg\"/>. Каковы заряд образовавшегося ядра Z (в единицах элементарного заряда) и его массовое число\nA?\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"|------------|--------------------|\n|Заряд ядра Z|М-ассовое число ядра-A\n|            |                    |\n-----------------------------------\n\" class=\"math-display\" src=\"index-79b516d2b5ce99cd7240c1425d7efe63.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов. То\nесть\n</p> <div class=\"math-display\">\n<img alt=\"2+ 5= Z + 0⇒ Z = 7\n\" class=\"math-display\" src=\"index-ddb523f66bdadf8017a7afaa4a4b197c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"4+ 11= A + 1⇒ A = 14\n\" class=\"math-display\" src=\"index-f23a8c82ee291259b8c05edb03f1b96e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8631c32b75e379ed1b7b076d746508c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27564/index-8631c32b75e379ed1b7b076d746508c1.svg", "index-87cd78f7cc6720f2438ed72f1d083527.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27564/index-87cd78f7cc6720f2438ed72f1d083527.svg", "index-79b516d2b5ce99cd7240c1425d7efe63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27564/index-79b516d2b5ce99cd7240c1425d7efe63.svg", "index-ddb523f66bdadf8017a7afaa4a4b197c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27565/index-ddb523f66bdadf8017a7afaa4a4b197c.svg", "index-f23a8c82ee291259b8c05edb03f1b96e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27565/index-f23a8c82ee291259b8c05edb03f1b96e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2019", "Квантовая физика", "Ядерные реакции"], "sources": ["Демоверсия 2019"], "created_at": "2021-12-07T12:33:53Z", "updated_at": "2026-07-03T11:25:46Z"}, {"id": 13652, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите, сколько <img alt=\"α  \" class=\"math\" src=\"index-d9927fdfdb1a608f607604fccb5c5329.svg\"/>–частиц и сколько протонов получается в результате реакции термоядерного синтеза\n</p> <div class=\"math-display\">\n<img alt=\"3    3       4     1\n2He +2He →? ⋅2He+? ⋅1 p\n\" class=\"math-display\" src=\"index-dc2d1847891a1fe31f96be643b153b94.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе реакции синтеза выполняется закон сохранения зарядового и массового числа. Таким образом, при осуществлении этой\nреакции должно получится 1 <img alt=\"α  \" class=\"math\" src=\"index-9558f46a24c148b210d2bbb87bf4c590.svg\"/>-частица и 2 протона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d9927fdfdb1a608f607604fccb5c5329.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27577/index-d9927fdfdb1a608f607604fccb5c5329.svg", "index-dc2d1847891a1fe31f96be643b153b94.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27577/index-dc2d1847891a1fe31f96be643b153b94.svg", "index-9558f46a24c148b210d2bbb87bf4c590.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27578/index-9558f46a24c148b210d2bbb87bf4c590.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2021-12-07T12:40:07Z", "updated_at": "2026-07-03T11:26:36Z"}, {"id": 188359, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите число протонов в атомном ядре неизвестного элемента X, участвующего в ядерной реакции. В ответе запишите число\nпротонов.\n</p> <div class=\"math-display\">\n<img alt=\"AZX +11H →32 He +42He\n\" class=\"math-display\" src=\"index-4ff1f3c2d5605c2a539803ed8cd06332.svg\"/></div>", "solution_html": "<p class=\"noindent\">В соответствии с законом сохранения заряда получаем:\n</p> <div class=\"math-display\">\n<img alt=\"Z + 1= 2 +2\n\" class=\"math-display\" src=\"index-f50ea4dcc86c3de266d7857c704582d4.svg\"/></div>\n<p class=\"indent\">   Отсюда следует, что в неизвестном ядре Z=3 протона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4ff1f3c2d5605c2a539803ed8cd06332.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415290/index-4ff1f3c2d5605c2a539803ed8cd06332.svg", "index-f50ea4dcc86c3de266d7857c704582d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415291/index-f50ea4dcc86c3de266d7857c704582d4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-07-03T11:27:01Z", "updated_at": "2026-09-02T20:28:02Z"}, {"id": 188406, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите, сколько протонов получается в результате реакции термоядерного синтеза\n</p> <div class=\"math-display\">\n<img alt=\"3    3       4     1\n2He +2He →? ⋅2He+? ⋅1 p\n\" class=\"math-display\" src=\"index-c900cf1c7915482049721d8d6aa95380.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе реакции синтеза выполняется закон сохранения зарядового и массового числа. Таким образом, при осуществлении этой\nреакции должно получится 2 протона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c900cf1c7915482049721d8d6aa95380.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415386/index-c900cf1c7915482049721d8d6aa95380.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-07-03T12:44:57Z", "updated_at": "2026-07-03T15:08:36Z"}, {"id": 13653, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите число протонов и нейтронов в атомном ядре неизвестного элемента X, участвующего в ядерной реакции В ответе\nзапишите число протонов и число нейтронов слитно без знаков препинания между ними.\n</p> <div class=\"math-display\">\n<img alt=\"AZX +11H →32 He +42He\n\" class=\"math-display\" src=\"index-4ff1f3c2d5605c2a539803ed8cd06332.svg\"/></div>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа и заряда получаем:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{A + 1= 3+ 4\n(Z + 1= 2+ 2\n\" class=\"math-display\" src=\"index-5db9d6fb38f11284f5b23f75610495f2.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\"><br/>Отсюда, следует, что в неизвестном ядре Z=3 протона и A-Z=3 нейтрона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4ff1f3c2d5605c2a539803ed8cd06332.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27579/index-4ff1f3c2d5605c2a539803ed8cd06332.svg", "index-5db9d6fb38f11284f5b23f75610495f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27580/index-5db9d6fb38f11284f5b23f75610495f2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2021-12-07T12:40:37Z", "updated_at": "2026-07-03T11:27:20Z"}, {"id": 112170, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите, сколько нейтронов получается в результате реакции термоядерного синтеза\n</p> <div class=\"math-display\">\n<img alt=\"2   3    4     1\n1H +1H  →2 He+?0n.\n\" class=\"math-display\" src=\"index-5842350dabd9626e14e0578a4d554bc0.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе реакции синтеза выполняется закон сохранения зарядового и массового числа. Таким образом, при осуществлении этой\nреакции должен получится 1 нейтрон.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5842350dabd9626e14e0578a4d554bc0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/230902/index-5842350dabd9626e14e0578a4d554bc0.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-03-24T11:48:56Z", "updated_at": "2026-09-22T08:42:26Z"}, {"id": 188405, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите число нейтронов в атомном ядре неизвестного элемента X, участвующего в ядерной реакции.\n</p> <div class=\"math-display\">\n<img alt=\"A   1    3     4\nZX +1H → 2 He + 2He\n\" class=\"math-display\" src=\"index-270cb7d2102e71e5e18c458f8e7d8fed.svg\"/></div>", "solution_html": "<p class=\"noindent\">В соответствии с законами сохранения массового числа и заряда получаем:\n</p> <table class=\"equation-star\"><tbody><tr><td> <div class=\"math-display\">\n<img alt=\"(\n{A + 1= 3+ 4\n(Z + 1= 2+ 2\n\" class=\"math-display\" src=\"index-5db9d6fb38f11284f5b23f75610495f2.svg\"/></div> </td></tr></tbody></table>\n<p class=\"nopar\"><br/>Отсюда, следует, что в неизвестном ядре A-Z=3 нейтрона.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-270cb7d2102e71e5e18c458f8e7d8fed.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415382/index-270cb7d2102e71e5e18c458f8e7d8fed.svg", "index-5db9d6fb38f11284f5b23f75610495f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415383/index-5db9d6fb38f11284f5b23f75610495f2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2026-07-03T12:41:57Z", "updated_at": "2026-07-03T15:10:25Z"}, {"id": 195397, "name": "Копия #15650 - Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Определите массовое число ядра <img alt=\"X,  \" class=\"math\" src=\"index-db4cb5c7dcc9e6d17dfa65fce6a74913.svg\"/> образующегося в результате указанной ядерной реакции: <img alt=\"6   1    4\n3Li +1H → 2 He + X.  \" class=\"math\" src=\"index-ac285efe4fc7292f82c91e6b48acce0e.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Применим закон сохранения массы:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"6 +1 = 4+ x⇒ x = 3\n\" class=\"math-display\" src=\"index-13d3f8c6efc85ed2b9ee9d2aa965e2ee.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-db4cb5c7dcc9e6d17dfa65fce6a74913.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433163/index-db4cb5c7dcc9e6d17dfa65fce6a74913.svg", "index-ac285efe4fc7292f82c91e6b48acce0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433163/index-ac285efe4fc7292f82c91e6b48acce0e.svg", "index-13d3f8c6efc85ed2b9ee9d2aa965e2ee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433164/index-13d3f8c6efc85ed2b9ee9d2aa965e2ee.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T18:00:40Z", "updated_at": "2026-08-16T18:04:55Z"}, {"id": 21472, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">При попадании <img alt=\"α  \" class=\"math\" src=\"index-1b5913567ebd4250ee120d900f3bd4b6.svg\"/>-частицы в ядро бора <img alt=\"11\n5 B  \" class=\"math\" src=\"index-040eb0fd23dcbf60f6f55494a8703a64.svg\"/> происходит реакция, в результате которой образуется некоторый элемент и вылетает\nнейтрон. Найти зарядовое и массовое числа получающегося элемента. В ответ дайте зарядовое и массовое число элемента без\nпробела\n</p>", "solution_html": "<p class=\"noindent\"><img alt=\"α  \" class=\"math\" src=\"index-3e9ad259e8f579da0c924d3e29464087.svg\"/>-частица – гелий <img alt=\"4\n2He  \" class=\"math\" src=\"index-885897cf1514fcbbd449b9daf9df199b.svg\"/>. Запишем реакцию:\n</p> <div class=\"math-display\">\n<img alt=\"11   4     A    1\n5 B +2 He →Z X +0n.\n\" class=\"math-display\" src=\"index-bfe5169c05aa83e1339d59e5776053d7.svg\"/></div>\n<p class=\"indent\">   В ходе ядерной реакции должен выполняться закон сохранения зарядового числа.\n</p> <div class=\"math-display\">\n<img alt=\"5+ /> - массовое число.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9693b5fc74bb2cbd4e770bb3bda17d08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415372/index-9693b5fc74bb2cbd4e770bb3bda17d08.svg", "index-d5ac6f55e3f18591c1891368ca7b576c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415372/index-d5ac6f55e3f18591c1891368ca7b576c.svg", "index-870ddf6bda86c39f90b8d9ed6b4c7759.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415372/index-870ddf6bda86c39f90b8d9ed6b4c7759.svg", "index-8a5798ab1537818942577ba51e536136.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415372/index-8a5798ab1537818942577ba51e536136.svg", "index-3137a29de332efae2812acae042dd7c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415373/index-3137a29de332efae2812acae042dd7c4.svg", "index-b6aa57ffea51f1d7f21f9237f7fd30f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415373/index-b6aa57ffea51f1d7f21f9237f7fd30f3.svg", "index-9e581f3f4170fd83fc6dbde57a12be2f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415373/index-9e581f3f4170fd83fc6dbde57a12be2f.svg", "index-cd3f12b5e55e9449477d801cf3a27d2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415373/index-cd3f12b5e55e9449477d801cf3a27d2b.svg"}, "tags": ["Школково. Тренировочные задания"], "sources": ["Демидова 2022"], "created_at": "2026-07-03T12:34:29Z", "updated_at": "2026-07-03T15:16:50Z"}, {"id": 188470, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">В результате цепной реакции деления урана образуется ядро химического элемента. Каково массовое число образовавшегося\nядра?\n</p> <div class=\"math-display\">\n<img alt=\"10n +29325U →AZ X +15369Ba +310n\n\" class=\"math-display\" src=\"index-1b48c0cc02d897d54729f1a54d158077.svg\"/></div>", "solution_html": "<p class=\"noindent\">В соответствии с законом сохранения массового числа получаем:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"1+ 235= A + 139 + 3⋅1\n\" class=\"math-display\" src=\"index-a583133f14db8a2ad73d606f9c524bb2.svg\"/></div>\n<p class=\"indent\">   Получим А=94.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1b48c0cc02d897d54729f1a54d158077.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415513/index-1b48c0cc02d897d54729f1a54d158077.svg", "index-a583133f14db8a2ad73d606f9c524bb2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/415514/index-a583133f14db8a2ad73d606f9c524bb2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Квантовая физика", "Ядерные реакции"], "sources": [], "created_at": "2026-07-03T13:46:30Z", "updated_at": "2026-09-02T20:33:24Z"}, {"id": 13650, "name": "Задача на квантовую физику. Первая часть", "theme_path": "№16 Квантовая физика -> Ядерные реакции", "question_html": "<p class=\"noindent\">Каково массовое число ядра <img alt=\"X  \" class=\"math\" src=\"index-1a68d24296b52cfabece1e9b355c5685.svg\"/> в реакции деления урана?\n</p> <div class=\"math-display\">\n<img alt=\"1   235    141          1\n0n+ 92 U → 56 Ba+ X + 30n\n\" class=\"math-display\" src=\"index-7cacac48eec07bdeb8adbdbe4e3095c0.svg\"/></div>", "solution_html": "<p class=\"noindent\">В ходе ядерной реакции выполняется закон сохранения массового числа, то есть суммарного числа протонов и нейтронов.\nСледовательно, массовое число неизвестного ядра равно\n</p> <div class=\"math-display\">\n<img alt=\"A = 1+ 235− 141 − 3 ⋅1= 92\n\" class=\"math-display\" src=\"index-04b23886b634afa7b32ad9d8e3d5ebe1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1a68d24296b52cfabece1e9b355c5685.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/27573/index-1a68d24296b52cfabece1e9b355c5685.svg", "index-7cacac48eec07bdeb8adbdbe4e3095c0.svg": "https://3.shkolkovo.online/api/latex-service/
