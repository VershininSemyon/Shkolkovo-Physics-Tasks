hkolkovo.online/api/latex-service/v1/GetSession/25299/index-86e6d86dd2d3c8b1ce94bcc579f8da48.svg", "index-417bda84b16efde1a541d8b652d17939.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25299/index-417bda84b16efde1a541d8b652d17939.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:05:08Z", "updated_at": "2026-05-15T17:48:49Z"}, {"id": 60868, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">Какую работу совершает газ при переходе из состояния 1 в состояние 4 (см. рисунок)? Ответ дайте в кДж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"394\" src=\"60868.png\" width=\"394\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа газа пропорциональна изменению объема, то есть на участках 1-2 и 3-4 газ не совершает работу. Работа на участке 2-3\nнаходится по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"A =p(V3− V2),\n\" class=\"math-display\" src=\"index-b7106dbc9098e9e23448f1e5da87fe21.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-8178e67cfb645440e8cc013738655000.svg\"/> – давление газа, <img alt=\"V3  \" class=\"math\" src=\"index-c3eecf0b082007cbcbe570de085572df.svg\"/> – объём газа в состоянии 3, <img alt=\"V2  \" class=\"math\" src=\"index-54135525c4624c9f5389da1ea0347d41.svg\"/> – объём газа в состоянии 2.\n</p><p class=\"indent\">   Тогда работа, которую совершает газ при переходе из состояния 1 в состояние 4:\n</p> <div class=\"math-display\">\n<img alt=\"A= 5 ⋅103 Па(0,5 м3− 0,1 м3)= 2 кД ж\n\" class=\"math-display\" src=\"index-ba9e9c6ca44abab3bbde3b7a6400254c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"60868.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110467/60868.png", "index-b7106dbc9098e9e23448f1e5da87fe21.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110466/index-b7106dbc9098e9e23448f1e5da87fe21.svg", "index-8178e67cfb645440e8cc013738655000.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110466/index-8178e67cfb645440e8cc013738655000.svg", "index-c3eecf0b082007cbcbe570de085572df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110466/index-c3eecf0b082007cbcbe570de085572df.svg", "index-54135525c4624c9f5389da1ea0347d41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110466/index-54135525c4624c9f5389da1ea0347d41.svg", "index-ba9e9c6ca44abab3bbde3b7a6400254c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/110466/index-ba9e9c6ca44abab3bbde3b7a6400254c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": ["Демидова 2022"], "created_at": "2023-05-14T09:05:35Z", "updated_at": "2026-09-21T17:03:16Z"}, {"id": 12423, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">Давление постоянного количества идеального газа падает прямо пропорционально уменьшению объёма от значения <img alt=\"    5\n4 ⋅10  \" class=\"math\" src=\"index-29c4fa150bbf8e1d186d6722565d58c1.svg\"/> Па до\nзначения <img alt=\"2⋅105 П а.  \" class=\"math\" src=\"index-cda6fd74a20d7f8b8d066b026ae4b94d.svg\"/> Объём газа при этом уменьшается от <img alt=\"3 м3 до 1,5 м3.  \" class=\"math\" src=\"index-890ccc6cd6b5416d3b47fd7c27d4d804.svg\"/> Найдите работу, совершённую над газом внешними\nсилами. Ответ дайте в кДж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"12423.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа над газом ЧИСЛЕННО равна площади под графиком в координатах p-V:\n</p> <div class=\"math-display\">\n<img alt=\" ′  1\nA = 2 ⋅(p1+ p2)⋅(V1 − V2)\n\" class=\"math-display\" src=\"index-6126a977de0b22754048afd52aff4eae.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A′ = 1 ⋅(4 ⋅105 Па+ 2⋅105 П а)⋅(3 м3− 1,5 м3)= 450 кДж\n    2\n\" class=\"math-display\" src=\"index-fb96502728b425ac8dd1e2299fa291bc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-29c4fa150bbf8e1d186d6722565d58c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25306/index-29c4fa150bbf8e1d186d6722565d58c1.svg", "index-cda6fd74a20d7f8b8d066b026ae4b94d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25306/index-cda6fd74a20d7f8b8d066b026ae4b94d.svg", "index-890ccc6cd6b5416d3b47fd7c27d4d804.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25306/index-890ccc6cd6b5416d3b47fd7c27d4d804.svg", "12423.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25306/12423.png", "index-6126a977de0b22754048afd52aff4eae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25307/index-6126a977de0b22754048afd52aff4eae.svg", "index-fb96502728b425ac8dd1e2299fa291bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25307/index-fb96502728b425ac8dd1e2299fa291bc.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": [], "created_at": "2021-12-01T11:07:23Z", "updated_at": "2026-05-15T17:50:35Z"}, {"id": 129510, "name": "Работа газа", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-4ae199786c1cf02740562c578da60dd6.svg\"/>-диаграмме (см. рисунок) показано, как изменялось давление газа при его переходе из состояния 1 в состояние 2. Найдите\nработу процесса 1-2. Ответ дайте в Дж. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"129510 (1).png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V. Поэтому работа газа вычисляется, как площадь\nтрапеции\n</p> <div class=\"math-display\">\n<img alt=\"     300⋅103+ 100⋅103\nA = −-------2--------⋅0,15 ⋅10−3 = −30 Д ж.\n\" class=\"math-display\" src=\"index-ea29241cf626a756db741390523454c7.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4ae199786c1cf02740562c578da60dd6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/267908/index-4ae199786c1cf02740562c578da60dd6.svg", "129510 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/267908/129510 (1).png", "index-ea29241cf626a756db741390523454c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/267909/index-ea29241cf626a756db741390523454c7.svg"}, "tags": [], "sources": ["Школково. Тренировочные задания"], "created_at": "2025-07-10T12:27:49Z", "updated_at": "2026-05-15T17:50:48Z"}, {"id": 86285, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На графике показан процесс, проведённый над газом. Найдите работу газа в этом процессе. Ответ дайте в кДж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-9-2-pict16.png\" width=\"157\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V, тогда\n</p> <div class=\"math-display\">\n<img alt=\"    300 кП а+ 150 кПа    3       3\nA = -------2-------(0,6 м − 0,2 м ) =90 кДж\n\" class=\"math-display\" src=\"index-c5532ee67eabab320cb5267ef231dfa7.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"f-9-2-pict16.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170977/f-9-2-pict16.png", "index-c5532ee67eabab320cb5267ef231dfa7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170978/index-c5532ee67eabab320cb5267ef231dfa7.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Банк ФИПИ"], "created_at": "2024-04-27T17:37:30Z", "updated_at": "2026-06-02T14:53:37Z"}, {"id": 195578, "name": "Копия #126763 - Работа газа", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-4ae199786c1cf02740562c578da60dd6.svg\"/>-диаграмме (см. рисунок) показано, как изменялось давление газа при его переходе из состояния 1 в состояние 2. Найдите\nработу газа за процесс 1-2. Ответ дайте в Дж. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"126763_1.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V. Поэтому работа газа вычисляется, как площадь\nтрапеции\n</p> <div class=\"math-display\">\n<img alt=\"    300⋅103+ 100⋅103\nA = -------2--------⋅0,15 ⋅10−3 = 30 Дж.\n\" class=\"math-display\" src=\"index-786d3cec8da439dc18ec085a762f68fd.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4ae199786c1cf02740562c578da60dd6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433533/index-4ae199786c1cf02740562c578da60dd6.svg", "126763_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433533/126763_1.png", "index-786d3cec8da439dc18ec085a762f68fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433534/index-786d3cec8da439dc18ec085a762f68fd.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T07:02:05Z", "updated_at": "2026-08-17T07:02:26Z"}, {"id": 27094, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На рисунке показано, как менялось давление газа в зависимости от его объёма при переходе из состояния 1 в состояние 2, а затем в\nсостояние 3. Каково отношение работ <img alt=\"A12∕A23  \" class=\"math\" src=\"index-6f060996fdcf60a28287514da443939e.svg\"/> газа на этих двух отрезках pV-диаграммы?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"27094.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V, тогда\n</p> <div class=\"math-display\">\n<img alt=\"      4+ 2\nA12 = -2--⋅1= 3.\n\" class=\"math-display\" src=\"index-3ea47a8cf5afb7550e58cf7e26f2935d.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A23 = 2 ⋅2 = 4\n\" class=\"math-display\" src=\"index-4b3d1bb114a27f7e2413b217cbea5fa5.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"A\nA12= 0,75\n 23\n\" class=\"math-display\" src=\"index-a020494495ed3749199f713edb55add2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6f060996fdcf60a28287514da443939e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/50188/index-6f060996fdcf60a28287514da443939e.svg", "27094.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/50188/27094.png", "index-3ea47a8cf5afb7550e58cf7e26f2935d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/50189/index-3ea47a8cf5afb7550e58cf7e26f2935d.svg", "index-4b3d1bb114a27f7e2413b217cbea5fa5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/50189/index-4b3d1bb114a27f7e2413b217cbea5fa5.svg", "index-a020494495ed3749199f713edb55add2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/50189/index-a020494495ed3749199f713edb55add2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Банк ФИПИ"], "created_at": "2022-05-04T11:39:12Z", "updated_at": "2026-09-19T13:03:23Z"}, {"id": 64765, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На рисунке показано, как менялось давление газа в зависимости от его объёма при переходе из состояния 1 в состояние 2, а затем в\nсостояние 3. Чему равно отношение работ газа <img alt=\"A12\nA23  \" class=\"math\" src=\"index-0807254304e06171bcbcda96f096cdee.svg\"/> при этих переходах\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-9-2-pict13.png\" width=\"157\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V, тогда\n</p> <div class=\"math-display\">\n<img alt=\"      4+ 1\nA12 = -2--⋅2= 5.\n\" class=\"math-display\" src=\"index-4ed82d9cc4dbb870b5a51e73bc6c6f3a.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A23 = 1 ⋅1 = 1\n\" class=\"math-display\" src=\"index-6b8b729c0f1aaf61e91b2c28a2d6d7d9.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"A\nA12= 5\n 23\n\" class=\"math-display\" src=\"index-df8b7c27c125aa580c4380c9504b9637.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0807254304e06171bcbcda96f096cdee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116958/index-0807254304e06171bcbcda96f096cdee.svg", "f-9-2-pict13.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116958/f-9-2-pict13.png", "index-4ed82d9cc4dbb870b5a51e73bc6c6f3a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116959/index-4ed82d9cc4dbb870b5a51e73bc6c6f3a.svg", "index-6b8b729c0f1aaf61e91b2c28a2d6d7d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116959/index-6b8b729c0f1aaf61e91b2c28a2d6d7d9.svg", "index-df8b7c27c125aa580c4380c9504b9637.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116959/index-df8b7c27c125aa580c4380c9504b9637.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": [], "created_at": "2023-07-01T11:11:46Z", "updated_at": "2026-05-15T17:52:49Z"}, {"id": 12418, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">Идеальный газ расширяется до удвоенного объема в процессе 1–2 с линейной зависимостью давления от объема. Затем его\nизобарически сжимают в процессе 2–3 до первоначального объема. Найдите отношение модулей работ, совершаемых газом в\nпроцессах расширения и сжатия. Известно, что температура в состояниях 1 и 2 одинакова.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"1241.png\" width=\"157\"/></p></div>", "solution_html": "<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"12418.png\" width=\"157\"/></p></div>\n<p class=\"noindent\">Так как температуры в точках 1 и 2 равны, то из уравнения Менделеева – Клапейрона (<img alt=\"pV = νRT  \" class=\"math\" src=\"index-6303b5a8e4976114751db7d374b43b86.svg\"/>) можно сделать вывод,\nчто\n</p> <div class=\"math-display\">\n<img alt=\"p1V1 = p2V2\n\" class=\"math-display\" src=\"index-c71cec15a864e3accd2a025c65ea78f7.svg\"/></div>\n<p class=\"indent\">   В условии сказано, что <img alt=\"V2 =2V1  \" class=\"math\" src=\"index-7a41ec4a40f42fe8e639a01806978251.svg\"/>, следовательно, <img alt=\"p1 = 2p2  \" class=\"math\" src=\"index-3da0d2d95d20ef2482832d97243bb0f0.svg\"/>. <br/>Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V:\n</p> <div class=\"math-display\">\n<img alt=\"      1                     3\nA1−2 = 2 ⋅(2p2+ p2)⋅(2V1− V1)= 2 ⋅p2V1\n\" class=\"math-display\" src=\"index-e151c787444aed4581fccd971a44a19f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A2−3 = p2⋅(V1− 2V1)= − p2V1\n\" class=\"math-display\" src=\"index-4ecde4dab7b922e86556fc6f48760e92.svg\"/></div>\n<p class=\"indent\">   Отношение модулей работ:\n</p> <div class=\"math-display\">\n<img alt=\"        ||3      ||\n||A1−2||  ||2-⋅p2V1-|| ||  3||\n||A2−3|| =|| −p2V1 ||=||− 2||= 1,5\n        |       |\n\" class=\"math-display\" src=\"index-71461fce6dd6ed5819686a8bc164997e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"1241.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25296/1241.png", "12418.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/12418.png", "index-6303b5a8e4976114751db7d374b43b86.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-6303b5a8e4976114751db7d374b43b86.svg", "index-c71cec15a864e3accd2a025c65ea78f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-c71cec15a864e3accd2a025c65ea78f7.svg", "index-7a41ec4a40f42fe8e639a01806978251.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-7a41ec4a40f42fe8e639a01806978251.svg", "index-3da0d2d95d20ef2482832d97243bb0f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-3da0d2d95d20ef2482832d97243bb0f0.svg", "index-e151c787444aed4581fccd971a44a19f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-e151c787444aed4581fccd971a44a19f.svg", "index-4ecde4dab7b922e86556fc6f48760e92.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-4ecde4dab7b922e86556fc6f48760e92.svg", "index-71461fce6dd6ed5819686a8bc164997e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25297/index-71461fce6dd6ed5819686a8bc164997e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": [], "created_at": "2021-12-01T11:04:34Z", "updated_at": "2026-05-15T17:53:22Z"}, {"id": 64741, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На рисунке показаны различные процессы изменения состояния идеального газа. Масса газа постоянна. В каком из процессов (1, 2, 3\nили 4) работа внешних сил равна нулю?\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-9-2-pict12.png\" width=\"157\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа внешних сил зависит от <img alt=\"ΔV  \" class=\"math\" src=\"index-6649d841ecbef1150374be2bad997e9b.svg\"/>, то есть если <img alt=\"ΔV = 0  \" class=\"math\" src=\"index-9966199d3942c52399d0dcb23f6f44dd.svg\"/> , то работа внешних сила равна нулю. В данном случае работа внешних\nсил равна нулю в процессе 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-9-2-pict12.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116920/f-9-2-pict12.png", "index-6649d841ecbef1150374be2bad997e9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116921/index-6649d841ecbef1150374be2bad997e9b.svg", "index-9966199d3942c52399d0dcb23f6f44dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116921/index-9966199d3942c52399d0dcb23f6f44dd.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": [], "created_at": "2023-07-01T10:01:44Z", "updated_at": "2026-09-21T17:06:31Z"}, {"id": 171957, "name": " Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На рисунке показаны различные процессы изменения состояния идеального газа. Масса газа постоянна. В каком из процессов (1, 2, 3\nили 4) модуль работы газа максимален? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"177180.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V. Из рисунка видно, что наибольшая площадь будет у\nграфика 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"177180.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/371213/177180.png"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Работа газа"], "sources": ["Апробация 2026"], "created_at": "2026-03-04T17:50:51Z", "updated_at": "2026-05-09T09:07:40Z"}, {"id": 27726, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На <img alt=\"pT− \" class=\"math\" src=\"index-5f65f68c583672299a831d6a3d541860.svg\"/>диаграмме показан процесс изменения состояния 4 моль идеального газа. Внутренняя энергия газа увеличилась на 40 кДж.\nКакую работу совершил газ в этом процессе? Ответ дайте в Дж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"27726.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Давление и температуру имеют линейную зависимость. Тогда <img alt=\"p = αT  \" class=\"math\" src=\"index-8b9fea414e82ceffd5f659ac4733fd97.svg\"/>, где <img alt=\"α  \" class=\"math\" src=\"index-43eee28d78ff3a1e5401388992809eb9.svg\"/> – некоторый коэффициент.<br/>Запишем уравнение Менделеева–Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV =νRT\n\" class=\"math-display\" src=\"index-c4f1e53a17b748ebc41f5a0665416dd2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-511bafe17ab71c5c536c7948d9867a83.svg\"/>—давление газа, <img alt=\"V  \" class=\"math\" src=\"index-00d9d4496828edf6594501089286d15d.svg\"/>—объем газа, <img alt=\"ν  \" class=\"math\" src=\"index-f4dd57adfa3c6afc884061d207ecf6c5.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-7b10048d212c8afed406c315ab1ffcf2.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-5e2d9edcbdf5dbdf62974499dbed20cf.svg\"/> —\nтемпература. <br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"νR = pV.\n     T\n\" class=\"math-display\" src=\"index-0e7fd8ba7131b7bb882ef984acaac5ef.svg\"/></div>\n<p class=\"indent\">   Для нашего процесса:\n</p> <div class=\"math-display\">\n<img alt=\"     pV-  αT-⋅V-\nνR =  T =   T   = αV = const,\n\" class=\"math-display\" src=\"index-e6a02e547f6c1831f84472a463e39607.svg\"/></div>\n<p class=\"indent\">   то есть объем газа остается неизменным. Так как работа газа связана с изменением его объема, то в данном случае она равна\n0.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f65f68c583672299a831d6a3d541860.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51213/index-5f65f68c583672299a831d6a3d541860.svg", "27726.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51213/27726.png", "index-8b9fea414e82ceffd5f659ac4733fd97.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-8b9fea414e82ceffd5f659ac4733fd97.svg", "index-43eee28d78ff3a1e5401388992809eb9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-43eee28d78ff3a1e5401388992809eb9.svg", "index-c4f1e53a17b748ebc41f5a0665416dd2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-c4f1e53a17b748ebc41f5a0665416dd2.svg", "index-511bafe17ab71c5c536c7948d9867a83.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-511bafe17ab71c5c536c7948d9867a83.svg", "index-00d9d4496828edf6594501089286d15d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-00d9d4496828edf6594501089286d15d.svg", "index-f4dd57adfa3c6afc884061d207ecf6c5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-f4dd57adfa3c6afc884061d207ecf6c5.svg", "index-7b10048d212c8afed406c315ab1ffcf2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-7b10048d212c8afed406c315ab1ffcf2.svg", "index-5e2d9edcbdf5dbdf62974499dbed20cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-5e2d9edcbdf5dbdf62974499dbed20cf.svg", "index-0e7fd8ba7131b7bb882ef984acaac5ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-0e7fd8ba7131b7bb882ef984acaac5ef.svg", "index-e6a02e547f6c1831f84472a463e39607.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/51214/index-e6a02e547f6c1831f84472a463e39607.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона", "Работа газа"], "sources": [], "created_at": "2022-05-11T09:28:48Z", "updated_at": "2026-07-03T07:39:32Z"}, {"id": 12425, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-2fba42136b7be160e04c7dc4c06eb327.svg\"/>-диаграмме изображены циклические процессы, совершаемые идеальным газом в количестве 1 моль. Определите отношение\nработы газа в циклическом процессе <img alt=\"B  \" class=\"math\" src=\"index-3a8cedb25a8fb29e4b78ef530e18cc43.svg\"/>-<img alt=\"C  \" class=\"math\" src=\"index-452a2ad64614b009322f1a5a88b47b25.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-d5ec319da217fe398b8433eb9c0b868a.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-30637d3e0d934e6f09c431742f067dec.svg\"/> к работе газа в циклическом процессе <img alt=\"A  \" class=\"math\" src=\"index-7b2fe084bf88938150e4237c9387bdea.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-17a374bf321d4fa7afde84dad5adfe23.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-e73692dad6fa9eafe34c841aeaee0157.svg\"/>-<img alt=\"F  \" class=\"math\" src=\"index-1d2f9e792c98b157d6e68d22eef2999a.svg\"/>-<img alt=\"A  \" class=\"math\" src=\"index-283b1df14ee67e1148e6dea1bbeec1b4.svg\"/>.<br/></p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"12425_1.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V.<br/></p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"12425_2.png\" width=\"210\"/> </p> </figure>\n<p class=\"indent\">   Работу газа за цикл <img alt=\"B  \" class=\"math\" src=\"index-7dde22afdf861183f18c45de39970b96.svg\"/>-<img alt=\"C  \" class=\"math\" src=\"index-2756982b4ffbe0030749c8a64c550974.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-59569b30999710b587a23d7ef5ab6284.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-b81df9c6e8f311ce301da4c264622d83.svg\"/> можно найти как площадь треугольника <img alt=\"BCD  \" class=\"math\" src=\"index-611d0a4605d3cf2c0c8b567f63894262.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"        1\nABCDB = 2 ⋅BC ⋅CD\n\" class=\"math-display\" src=\"index-1f308714ce8ba44b73b390893ead6a3f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ABCDB = 1 ⋅3⋅5= 7,5 Д ж\n        2\n\" class=\"math-display\" src=\"index-651da418f9aa931f2cc93e4a0dc63186.svg\"/></div>\n<p class=\"indent\">   Работу газа за цикл <img alt=\"A  \" class=\"math\" src=\"index-d2fcc33c1fe430a9a3f86fb07ee4ba3d.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-5378b88341691e0fa35b5dd79fac75f6.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-8acacfddbc5d61e3a0a21b65e2b11906.svg\"/>-<img alt=\"F  \" class=\"math\" src=\"index-99f279c467c93cc7294de4595880bf1b.svg\"/>-<img alt=\"A  \" class=\"math\" src=\"index-94adb17ca4f5b8a1b7b3262dfa40f6e7.svg\"/> можно найти как разность площадей трапеции <img alt=\"ABDE  \" class=\"math\" src=\"index-3f05941e981bb59cb49d0ae725d76d1d.svg\"/> и треугольника\n<img alt=\"F DE  \" class=\"math\" src=\"index-c77c472956d56514290c77e41b4d83f9.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"AABDFA  =SABDF = SABDE − SFDE\n\" class=\"math-display\" src=\"index-ae04de00f4ba05d956c8f486e0610957.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"AABDFA  = AB-+-ED-⋅AE − 1 ⋅DE ⋅FE\n             2          2\n\" class=\"math-display\" src=\"index-ce155fbe3115f17da32cdf7f34623c8b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"AABDFA  = 2+-5⋅5− 1 ⋅5⋅3= 10 Дж\n           2      2\n\" class=\"math-display\" src=\"index-d99f4aa15189d09a9ae4646e5bb9198a.svg\"/></div>\n<p class=\"indent\">   Найдем отношение работы газа в циклическом процессе <img alt=\"B  \" class=\"math\" src=\"index-8cabc7019344918ee208ba53b44cc406.svg\"/>-<img alt=\"C  \" class=\"math\" src=\"index-8b8c33a376f9723491b85cd80346609f.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-80111c2fb082f4ac7e218e59dd69a23c.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-23977626bc5fae93e5ec4d7ab43c5582.svg\"/> к работе газа в циклическом процессе\n<img alt=\"A  \" class=\"math\" src=\"index-9d7f0fd2020cd5ca04275b361dc48bfb.svg\"/>-<img alt=\"B  \" class=\"math\" src=\"index-66c46036d2eebd3f60aa98da6c3381d9.svg\"/>-<img alt=\"D  \" class=\"math\" src=\"index-8c427a9feafaa38b418f40eebaeb0858.svg\"/>-<img alt=\"F  \" class=\"math\" src=\"index-8f71e40314a7dbaa991ac52f5687fa0e.svg\"/>-<img alt=\"A  \" class=\"math\" src=\"index-cf0b9c701d85d37b94a6f1684af937c0.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\" ABCDB    7,5 Дж\nAABDFA- = 10-Дж- =0,75\n\" class=\"math-display\" src=\"index-5ebebe5f1c2a23d34fc9aa08851b8e67.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2fba42136b7be160e04c7dc4c06eb327.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25310/index-2fba42136b7be160e04c7dc4c06eb327.svg", "index-3a8cedb25a8fb29e4b78ef530e18cc43.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25310/index-3a8cedb25a8fb29e4b78ef530e18cc43.svg", "index-452a2ad64614b009322f1a5a88b47b25.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25310/index-452a2ad64614b009322f1a5a88b47b25.svg", "index-d5ec319da217fe398b8433eb9c0b868a.svg": "https://3.shkolkovo.online/api/latex-servi 18ee208ba53b44cc406.svg", "index-8b8c33a376f9723491b85cd80346609f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-8b8c33a376f9723491b85cd80346609f.svg", "index-80111c2fb082f4ac7e218e59dd69a23c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-80111c2fb082f4ac7e218e59dd69a23c.svg", "index-23977626bc5fae93e5ec4d7ab43c5582.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-23977626bc5fae93e5ec4d7ab43c5582.svg", "index-9d7f0fd2020cd5ca04275b361dc48bfb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-9d7f0fd2020cd5ca04275b361dc48bfb.svg", "index-66c46036d2eebd3f60aa98da6c3381d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-66c46036d2eebd3f60aa98da6c3381d9.svg", "index-8c427a9feafaa38b418f40eebaeb0858.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-8c427a9feafaa38b418f40eebaeb0858.svg", "index-8f71e40314a7dbaa991ac52f5687fa0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-8f71e40314a7dbaa991ac52f5687fa0e.svg", "index-cf0b9c701d85d37b94a6f1684af937c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-cf0b9c701d85d37b94a6f1684af937c0.svg", "index-5ebebe5f1c2a23d34fc9aa08851b8e67.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25311/index-5ebebe5f1c2a23d34fc9aa08851b8e67.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Тренировочные задания Школково"], "created_at": "2021-12-01T11:08:20Z", "updated_at": "2026-04-21T19:10:07Z"}, {"id": 12426, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В цилиндр с подвижным поршнем накачали <img alt=\"ν = 2  \" class=\"math\" src=\"index-223691f38f862c222537463d92cf20d6.svg\"/> моля идеального одноатомного газа при температуре <img alt=\"t1 = 50  \" class=\"math\" src=\"index-ad289877b65223fa652ab69498e82d07.svg\"/> <img alt=\"∘\n C  \" class=\"math\" src=\"index-b5b02177324418e42b448910d99ad987.svg\"/>. Накачивание\nвели так, что давление газа было постоянным. Затем накачку прекратили и дали газу в цилиндре расшириться без теплообмена с\nокружающей средой до давления <img alt=\"p= 1  \" class=\"math\" src=\"index-bc18ed3639f7093ee17cf9cb223c82f3.svg\"/> атм. При этом газ остыл до температуры <img alt=\"t2 =20∘C  \" class=\"math\" src=\"index-a192f86b283dae4b5fe9ebe7cb84b6e2.svg\"/>. Какую суммарную работу совершил\nгаз в этих двух процессах? В исходном состоянии цилиндр был пуст и поршень касался дна. Ответ дайте в кДж и округлите до\nцелых.\n</p>", "solution_html": "<p class=\"noindent\">В первом процессе газ расширяется при постоянном давлении от объема 0 до <img alt=\"V1  \" class=\"math\" src=\"index-16b53503efb1c4b444e12db665e084b7.svg\"/>. Так как <img alt=\"p= const  \" class=\"math\" src=\"index-b561b1599d9be7932b89bd6431b84f8c.svg\"/>, то процесс изобарный и\nработу газа, совершенную за этот процесс можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"A1 = p(V1 − 0)= pV1  (1)\n\" class=\"math-display\" src=\"index-0ddc9e7f670317c1bf9ffc42d9212446.svg\"/></div>\n<p class=\"indent\">   Запишем уравнение Менделеева – Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV1 = νRT1, (2)\n\" class=\"math-display\" src=\"index-b36c9ff258190e60612d14507da0ad3c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-8936a745f3a07debd9f94a3d29799e56.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-1f1da4ff4fea8e34b27b3a777ec9ab26.svg\"/> — универсальная газовая постоянная, <img alt=\"T1 = (273+ t1)  \" class=\"math\" src=\"index-4a746c64fa77a80da0c6f0f879026150.svg\"/>.<br/>Подставим (2) в (1):\n</p> <div class=\"math-display\">\n<img alt=\"A1 = νRT1\n\" class=\"math-display\" src=\"index-e226665add47c457cdc2541becc58f5e.svg\"/></div>\n<p class=\"indent\">   Рассмотрим второй процесс. В условии сказано, что газ расширялся без теплообмена с окружающей средой, то есть второй\nпроцесс был адиабатическим.<br/>Запишем первое начало термодинамики для адиабатического процесса (с учетом того, что <img alt=\"Q2 = 0  \" class=\"math\" src=\"index-f795458a1b19d97f039ba97dc18deffc.svg\"/>):\n</p> <div class=\"math-display\">\n<img alt=\"Q2 = ΔU2 + A2,\n\" class=\"math-display\" src=\"index-a03f3b90291f5dea9490a650f8a9e70f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q2  \" class=\"math\" src=\"index-c16601287f9d7cdbc4221bef37f7e1e5.svg\"/> — количество теплоты, <img alt=\"ΔU2  \" class=\"math\" src=\"index-5eea049920e3f85a94c3137c77d49835.svg\"/> — изменение внутренней энергии газа. Выразим работу газа, совершенную во втором\nпроцессе:\n</p> <div class=\"math-display\">\n<img alt=\"A2 = −ΔU2   (3)\n\" class=\"math-display\" src=\"index-15c6c0b9dc9e25f81070e2c8073a3ab4.svg\"/></div>\n<p class=\"indent\">   Изменение внутренней энергии одноатомного газа во втором процессе равно:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU2 = 3νR ΔT,   (4)\n      2\n\" class=\"math-display\" src=\"index-5b4880ef8bd84972a4eeeda492af2df6.svg\"/></div>\n<p class=\"indent\">   где изменение абсолютной температуры газа во втором процессе <img alt=\"ΔT = T2− T1  \" class=\"math\" src=\"index-78197e3fc41ed415d68207359c562ed0.svg\"/>, причем <img alt=\"T2 = (273 +t2)  \" class=\"math\" src=\"index-b460c59fbb7b73ce897f53b813a2719a.svg\"/>.<br/>Подставим (4) в (3):\n</p> <div class=\"math-display\">\n<img alt=\"      3\nA2 = − 2νR(T2− T1)\n\" class=\"math-display\" src=\"index-32fe0f0a104656533b36dc001614b15e.svg\"/></div>\n<p class=\"indent\">   Найдем суммарную работу, которую совершил газ в этих двух процессах:\n</p> <div class=\"math-display\">\n<img alt=\"A = A1+ A2\n\" class=\"math-display\" src=\"index-42cd4af81f6431edaaab1ff789be0178.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"          (  3          )\nA = νRT1 +  −2νR (T2 − T1)\n\" class=\"math-display\" src=\"index-fb0d06c3a08baee7f59435b157520e6a.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"      (         )\nA = νR  5T − 3T\n        2 1  2 2\n\" class=\"math-display\" src=\"index-763903add31308809b100ca21623b3ef.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"                 Дж    (5         3      )\nA = 2 м оля ⋅8,31 моль⋅К-⋅ 2 ⋅323 К − 2 ⋅293 К =6116,16 Дж ≈ 6 кДж\n\" class=\"math-display\" src=\"index-34c68c76ed385736091c2cc8a77451d9.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-223691f38f862c222537463d92cf20d6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25315/index-223691f38f862c222537463d92cf20d6.svg", "index-ad289877b65223fa652ab69498e82d07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25315/index-ad289877b65223fa652ab69498e82d07.svg", "index-b5b02177324418e42b448910d99ad987.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25315/index-b5b02177324418e42b448910d99ad987.svg", "index-bc18ed3639f7093ee17cf9cb223c82f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25315/index-bc18ed3639f7093ee17cf9cb223c82f3.svg", "index-a192f86b283dae4b5fe9ebe7cb84b6e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25315/index-a192f86b283dae4b5fe9ebe7cb84b6e2.svg", "index-16b53503efb1c4b444e12db665e084b7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-16b53503efb1c4b444e12db665e084b7.svg", "index-b561b1599d9be7932b89bd6431b84f8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-b561b1599d9be7932b89bd6431b84f8c.svg", "index-0ddc9e7f670317c1bf9ffc42d9212446.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-0ddc9e7f670317c1bf9ffc42d9212446.svg", "index-b36c9ff258190e60612d14507da0ad3c.  "index-32fe0f0a104656533b36dc001614b15e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-32fe0f0a104656533b36dc001614b15e.svg", "index-42cd4af81f6431edaaab1ff789be0178.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-42cd4af81f6431edaaab1ff789be0178.svg", "index-fb0d06c3a08baee7f59435b157520e6a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-fb0d06c3a08baee7f59435b157520e6a.svg", "index-763903add31308809b100ca21623b3ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-763903add31308809b100ca21623b3ef.svg", "index-34c68c76ed385736091c2cc8a77451d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25316/index-34c68c76ed385736091c2cc8a77451d9.svg"}, "tags": ["Формат ЕГЭ", "Сложнее ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона", "Первый закон термодинамики", "Работа газа"], "sources": [], "created_at": "2021-12-01T11:09:44Z", "updated_at": "2026-01-24T07:07:26Z"}, {"id": 12421, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Идеальный газ получил количество теплоты 100 Дж и при этом внутренняя энергия газа уменьшилась на 100 Дж. Какова работа,\nсовершенная газом? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-550b2f4f58bf195c3fed20a9b1f193a7.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-dd732c76a17d6cffc3edad87c952bb76.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-4da3f23998bfd509c163f184d031b3f4.svg\"/> — работа газа. Выразим работу\nгаза:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU\n\" class=\"math-display\" src=\"index-08a0bfcffaf6aae6cf4069c3e717aae5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A = 100 Д ж− (−100 Д ж) =200 Дж\n\" class=\"math-display\" src=\"index-bed34c539267e43f2df6dbb8428b0887.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-550b2f4f58bf195c3fed20a9b1f193a7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-550b2f4f58bf195c3fed20a9b1f193a7.svg", "index-dd732c76a17d6cffc3edad87c952bb76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-dd732c76a17d6cffc3edad87c952bb76.svg", "index-4da3f23998bfd509c163f184d031b3f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-4da3f23998bfd509c163f184d031b3f4.svg", "index-08a0bfcffaf6aae6cf4069c3e717aae5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-08a0bfcffaf6aae6cf4069c3e717aae5.svg", "index-bed34c539267e43f2df6dbb8428b0887.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25304/index-bed34c539267e43f2df6dbb8428b0887.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:06:06Z", "updated_at": "2026-07-01T14:32:05Z"}, {"id": 12427, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В некотором процессе газ отдал окружающей среде количество теплоты, равное 10 кДж. При этом внутренняя энергия газа\nувеличилась на 30 кДж. Определите работу, которую совершили внешние силы, сжав газ. Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f4a013411d68d6747016696faf83ab56.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-b7b5a560333c1c30a8bdee0c340feba5.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-c5023c03143b180bcc5ea355774133c3.svg\"/> — работа газа. Выразим отсюда работу\nгаза:\n</p> <div class=\"math-display\">\n<img alt=\"A =Q − ΔU   (1)\n\" class=\"math-display\" src=\"index-99575eb55a585c3f15d431980012c010.svg\"/></div>\n<p class=\"indent\">   Работа внешних сил над газом равна:\n</p> <div class=\"math-display\">\n<img alt=\"A внешсил = −A  ⇒   A =− Aвнеш сил   (2)\n\" class=\"math-display\" src=\"index-bac40a65c7029226db1c28a9944cdd18.svg\"/></div>\n<p class=\"indent\">   Подставим (2) в (1) и выразим работу внешних сил:\n</p> <div class=\"math-display\">\n<img alt=\"− Aвнеш сил = Q − ΔU\n\" class=\"math-display\" src=\"index-8cd9c4d3f13bed9fe6eda2bcf2792d66.svg\"/></div>\n<p class=\"indent\"> </p> <div class=\"math-display\">\n<img alt=\"Aвнеш сил =ΔU  − Q\n\" class=\"math-display\" src=\"index-8a122cc156f6b10cba49e7e5edeb8ea6.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A внешсил = 30 кД ж− (−10 кДж) =40 кДж\n\" class=\"math-display\" src=\"index-837ce66b5b844f9734a279d9f418d58d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25319/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f4a013411d68d6747016696faf83ab56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25319/index-f4a013411d68d6747016696faf83ab56.svg", "index-b7b5a560333c1c30a8bdee0c340feba5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25319/index-b7b5a560333c1c30a8bdee0c340feba5. ss=\"math\" src=\"index-9205a42c3a9ba723fff9b195242ef4bd.svg\"/> — количество теплоты (т.к. по условию газ отдает количество теплоты, то при подстановке значений мы\nбудем писать его со знаком &#34;<img alt=\"− \" class=\"math\" src=\"index-503950566778afdd732abb1f5218ec8f.svg\"/>&#34;), <img alt=\"ΔU  \" class=\"math\" src=\"index-3e510cf261a14550d3a327a71f52489d.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-4224305395d6f3d98bc0201969be3938.svg\"/> — работа, совершенная газом.\n<br/><br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU   (1)\n\" class=\"math-display\" src=\"index-99e6b5426104e8c0702bb51ee22c9264.svg\"/></div>\n<p class=\"indent\">   Известно, что:\n</p> <div class=\"math-display\">\n<img alt=\"A= − A  ,\n      вн\n\" class=\"math-display\" src=\"index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Aвн  \" class=\"math\" src=\"index-634beed2703b3d6bf91541376732f374.svg\"/> — работа внешних сил над газом. Подставим сюда (1) и выразим <img alt=\"A вн  \" class=\"math\" src=\"index-87f8e6883dca7800e38f5b59bba8f22e.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"Aвн =− A =− (Q− ΔU )= −Q + ΔU =\n\" class=\"math-display\" src=\"index-5f01653b5f24fbccdb5443de993bed00.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"=− (− 39 Д ж)+ 4,7 Дж = 39 Д ж +4,7 Дж = 43,7 Дж\n\" class=\"math-display\" src=\"index-f1af08974fb571c0a51a9e1d4c42150e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c458117cd0f732eeb814fc6ae61f0108.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25327/index-c458117cd0f732eeb814fc6ae61f0108.svg", "index-4abed63a3f8ddc10a802cfc1cb480cf1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25327/index-4abed63a3f8ddc10a802cfc1cb480cf1.svg", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-9205a42c3a9ba723fff9b195242ef4bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-9205a42c3a9ba723fff9b195242ef4bd.svg", "index-503950566778afdd732abb1f5218ec8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-503950566778afdd732abb1f5218ec8f.svg", "index-3e510cf261a14550d3a327a71f52489d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-3e510cf261a14550d3a327a71f52489d.svg", "index-4224305395d6f3d98bc0201969be3938.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-4224305395d6f3d98bc0201969be3938.svg", "index-99e6b5426104e8c0702bb51ee22c9264.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-99e6b5426104e8c0702bb51ee22c9264.svg", "index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg", "index-634beed2703b3d6bf91541376732f374.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-634beed2703b3d6bf91541376732f374.svg", "index-87f8e6883dca7800e38f5b59bba8f22e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-87f8e6883dca7800e38f5b59bba8f22e.svg", "index-5f01653b5f24fbccdb5443de993bed00.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-5f01653b5f24fbccdb5443de993bed00.svg", "index-f1af08974fb571c0a51a9e1d4c42150e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25328/index-f1af08974fb571c0a51a9e1d4c42150e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:15:58Z", "updated_at": "2026-07-01T14:36:29Z"}, {"id": 12440, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Идеальный газ совершил работу 161 кДж и при этом внутренняя энергия газа уменьшилась на 140 кДж.\nКакое количество теплоты получил газ в этом процессе? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-0a2246a98e14b97fda314e5b5813d2f9.svg\"/> — количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-727cd7c9bfe55a79a7e7bb3882c033d4.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-5a91857b837d2b0226e9660cd8273214.svg\"/> — работа, совершенная\nгазом.\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Q =− 140 кДж + 161 кД ж =− 140⋅103 Дж + 161⋅103 Дж = 21000 Дж = 21 кДж\n\" class=\"math-display\" src=\"index-77ee5a2f6c36fcef7469a216e8e1101b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25342/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-0a2246a98e14b97fda314e5b5813d2f9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25342/index-0a2246a98e14b97fda314e5b5813d2f9.svg", "index-727cd7c9bfe55a79a7e7bb3882c033d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25342/index-727cd7c9bfe55a79a7e7bb3882c033d4.svg", "index-5a91857b837d2b0226e9660cd8273214.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25342/index-5a91857b837d2b0226e9660cd8273214.svg", "index-77ee5a2f6c36fcef7469a216e8e1101b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25342/index-77ee5a2f6c36fcef7469a216e8e1101b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:25:57Z", "updated_at": "2026-09-21T17:06:50Z"}, {"id": 12443, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В процессе адиабатного расширения четырех молей идеального одноатомного газа газ совершил работу\n100 Дж. Определите изменение внутренней энергии газа в этом процессе. Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   В адиабатном процессе газ не получает теплоты от внешней среды:\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A ⇒ ΔU = −A = −100 Дж\n\" class=\"math-display\" src=\"index-77e09144f17beb34354b7a365fb10146.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25348/index-bd94ff284644b2773b552a8c5529b561.svg", "index-77e09144f17beb34354b7a365fb10146.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25348/index-77e09144f17beb34354b7a365fb10146.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["основная волна 2024"], "created_at": "2021-12-01T11:27:39Z", "updated_at": "2026-07-01T14:35:10Z"}, {"id": 12446, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Внутренняя энергия газа в процессе эксперимента увеличилась на 33 кДж, при этом внешние силы\nсовершили работу над газом, равную 51 кДж. Какое количество теплоты газ отдал окружающей среде?\nОтвет дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-c9351e888e6723f3c4066e42a570d2dc.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> — работа, совершенная газом.\n</p> <div class=\"math-display\">\n<img alt=\"A= − Aвн,\n\" class=\"math-display\" src=\"index-8d0fe274df5c67f6c476ace4a79a7c72.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Aвн  \" class=\"math\" src=\"index-20b9ace39e4e66f540e6ac8d664fd1a0.svg\"/> — работа внешних сил над газом. <br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU − Aвн =33 кДж − 51 кДж = − 18 кДж\n\" class=\"math-display\" src=\"index-75400ca536c62fd7af570dfe2e673168.svg\"/></div>\n<p class=\"indent\">   Значит, газ отдал окружающей среде количество теплоты, равное 18 кДж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-c9351e888e6723f3c4066e42a570d2dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-c9351e888e6723f3c4066e42a570d2dc.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-8d0fe274df5c67f6c476ace4a79a7c72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-8d0fe274df5c67f6c476ace4a79a7c72.svg", "index-20b9ace39e4e66f540e6ac8d664fd1a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-20b9ace39e4e66f540e6ac8d664fd1a0.svg", "index-75400ca536c62fd7af570dfe2e673168.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25355/index-75400ca536c62fd7af570dfe2e673168.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:29:09Z", "updated_at": "2026-07-01T14:37:40Z"}, {"id": 64381, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Газ получил извне количество теплоты, равное 200 Дж, и при этом внешние силы совершили над ним работу, равную 80 Дж. Масса\nгаза не менялась. На сколько увеличилась внутренняя энергия газа? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.\n</p><p class=\"indent\">   В данном случае работа совершается над газом, значит, работа газа отрицательна.\n</p><p class=\"indent\">   Выразим изменение внутренней энергии:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  = Q− A = 200 Дж − (−80 Д ж)= 280 Дж\n\" class=\"math-display\" src=\"index-0b13bb1d674bc6272fe6f0f70a41bb81.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116295/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116295/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116295/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116295/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-0b13bb1d674bc6272fe6f0f70a41bb81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116295/index-0b13bb1d674bc6272fe6f0f70a41bb81.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": [], "created_at": "2023-06-21T16:43:48Z", "updated_at": "2026-07-01T14:34:29Z"}, {"id": 65192, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Газ получил количество теплоты, равное 300 Дж, при этом внутренняя энергия газа уменьшилась на 100 Дж. Масса газа не\nменялась. Какую работу совершил газ в этом процессе? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.\n</p><p class=\"indent\">   Тогда газ совершил в этом процессе работу, равную:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU = 300 Дж − (− 100 Дж )= 400 Дж\n\" class=\"math-display\" src=\"index-88590ff4652505c324467af5e74a2258.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117865/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117865/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117865/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117865/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-88590ff4652505c324467af5e74a2258.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117865/index-88590ff4652505c324467af5e74a2258.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2023-07-08T07:13:00Z", "updated_at": "2026-07-01T14:33:03Z"}, {"id": 65303, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В процессе эксперимента внутренняя энергия газа уменьшилась на 20 кДж, при этом в процессе расширения он совершил работу 12\nкДж. Какое количество теплоты газ отдал окружающей среде? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.<br/>В данном случае\n</p> <div class=\"math-display\">\n<img alt=\"Q = −20кДж + 12кДж = −8кД ж,\n\" class=\"math-display\" src=\"index-81df3e0124fb79ef20d93e25ba150a7b.svg\"/></div>\n<p class=\"indent\">   то есть газ отдал 8 кДж энергии.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118121/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118121/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118121/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118121/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-81df3e0124fb79ef20d93e25ba150a7b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118121/index-81df3e0124fb79ef20d93e25ba150a7b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Демидова 2022"], "created_at": "2023-07-09T08:28:15Z", "updated_at": "2026-07-01T14:37:59Z"}, {"id": 86102, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В изохорном процессе внутренняя энергия неона увеличилась на 320 Дж Какое количество теплоты было сообщено неону в этом\nпроцессе? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f9715b7933269c9721cd22eb7fb59a7e.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-1a8a5fb4f8a04b9f13af71a2961403d4.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-1b2284017c3bcc57630ece7698974996.svg\"/> — работа газа.<br/>Так как процесс изохорный, то работа газа равна нулю и <img alt=\"Q =320  \" class=\"math\" src=\"index-9e4826051951acb26675f6fd2f776979.svg\"/> Дж\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170585/index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg", "index-f9715b7933269c9721cd22eb7fb59a7e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170585/index-f9715b7933269c9721cd22eb7fb59a7e.svg", "index-1a8a5fb4f8a04b9f13af71a2961403d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170585/index-1a8a5fb4f8a04b9f13af71a2961403d4.svg", "index-1b2284017c3bcc57630ece7698974996.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170585/index-1b2284017c3bcc57630ece7698974996.svg", "index-9e4826051951acb26675f6fd2f776979.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/170585/index-9e4826051951acb26675f6fd2f776979.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2024-04-25T15:08:57Z", "updated_at": "2026-07-01T14:39:47Z"}, {"id": 121856, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В процессе эксперимента газ совершил работу, равную 35 кДж. При этом внутренняя энергия газа уменьшилась на 40 кДж.\nКоличество вещества газа не изменялось. Какое количество теплоты газ отдал окружающей среде? Ответ дайте в\nкДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.<br/>В данном случае\n</p> <div class=\"math-display\">\n<img alt=\"Q = −40кДж + 35кДж = −5кД ж,\n\" class=\"math-display\" src=\"index-484b0a52108dd81500776fb065d79572.svg\"/></div>\n<p class=\"indent\">   то есть газ отдал 5 кДж энергии.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250852/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250852/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250852/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250852/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-484b0a52108dd81500776fb065d79572.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/250852/index-484b0a52108dd81500776fb065d79572.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2025-05-04T18:04:07Z", "updated_at": "2026-07-01T14:37:21Z"}, {"id": 177729, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В процессе адиабатного расширения двух молей аргона газ совершил работу 75 Дж. Определите\nизменение внутренней энергии аргона в этом процессе. Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   В адиабатном процессе газ не получает теплоты от внешней среды:\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU  +A ⇒ ΔU  = −A = −75 Д ж\n\" class=\"math-display\" src=\"index-819ffbb4237b0b05bb764223df3e1252.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387216/index-bd94ff284644b2773b552a8c5529b561.svg", "index-819ffbb4237b0b05bb764223df3e1252.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387216/index-819ffbb4237b0b05bb764223df3e1252.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["основная волна 2024"], "created_at": "2026-04-12T20:31:37Z", "updated_at": "2026-07-01T14:35:31Z"}, {"id": 195373, "name": "Копия #12443 - Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Четыре моля идеального одноатомного газа расширяются адиабатно и выполняют работу 100 Дж. Чему\nравно изменение внутренней энергии газа? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   В адиабатном процессе газ не получает теплоты от внешней среды:\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A ⇒ ΔU = −A = −100 Дж\n\" class=\"math-display\" src=\"index-77e09144f17beb34354b7a365fb10146.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433102/index-bd94ff284644b2773b552a8c5529b561.svg", "index-77e09144f17beb34354b7a365fb10146.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433102/index-77e09144f17beb34354b7a365fb10146.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T16:47:00Z", "updated_at": "2026-08-16T16:48:37Z"}, {"id": 195428, "name": "Копия #12432 - Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В ходе эксперимента внутренняя энергия газа возросла на <img alt=\"4,7  \" class=\"math\" src=\"index-71b1107fafb1abab7687b1cc9bf63d8e.svg\"/> Дж, при этом газ отдал окружающей среде количество\nтеплоты, равное <img alt=\"39  \" class=\"math\" src=\"index-332963033ec6b9acb10efdb98c03080f.svg\"/> Дж. Какую работу над газом совершили внешние силы в этом эксперименте? Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-9205a42c3a9ba723fff9b195242ef4bd.svg\"/> — количество теплоты (т.к. по условию газ отдает количество теплоты, то при подстановке значений мы\nбудем писать его со знаком &#34;<img alt=\"− \" class=\"math\" src=\"index-503950566778afdd732abb1f5218ec8f.svg\"/>&#34;), <img alt=\"ΔU  \" class=\"math\" src=\"index-3e510cf261a14550d3a327a71f52489d.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-4224305395d6f3d98bc0201969be3938.svg\"/> — работа, совершенная газом.\n<br/><br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU   (1)\n\" class=\"math-display\" src=\"index-99e6b5426104e8c0702bb51ee22c9264.svg\"/></div>\n<p class=\"indent\">   Известно, что:\n</p> <div class=\"math-display\">\n<img alt=\"A= − A  ,\n      вн\n\" class=\"math-display\" src=\"index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Aвн  \" class=\"math\" src=\"index-634beed2703b3d6bf91541376732f374.svg\"/> — работа внешних сил над газом. Подставим сюда (1) и выразим <img alt=\"A вн  \" class=\"math\" src=\"index-87f8e6883dca7800e38f5b59bba8f22e.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"Aвн =− A =− (Q− ΔU )= −Q + ΔU =\n\" class=\"math-display\" src=\"index-5f01653b5f24fbccdb5443de993bed00.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"=− (− 39 Д ж)+ 4,7 Дж = 39 Д ж +4,7 Дж = 43,7 Дж\n\" class=\"math-display\" src=\"index-f1af08974fb571c0a51a9e1d4c42150e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-71b1107fafb1abab7687b1cc9bf63d8e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433229/index-71b1107fafb1abab7687b1cc9bf63d8e.svg", "index-332963033ec6b9acb10efdb98c03080f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433229/index-332963033ec6b9acb10efdb98c03080f.svg", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-9205a42c3a9ba723fff9b195242ef4bd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-9205a42c3a9ba723fff9b195242ef4bd.svg", "index-503950566778afdd732abb1f5218ec8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-503950566778afdd732abb1f5218ec8f.svg", "index-3e510cf261a14550d3a327a71f52489d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-3e510cf261a14550d3a327a71f52489d.svg", "index-4224305395d6f3d98bc0201969be3938.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-4224305395d6f3d98bc0201969be3938.svg", "index-99e6b5426104e8c0702bb51ee22c9264.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-99e6b5426104e8c0702bb51ee22c9264.svg", "index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-08af5c5e0cc7ba9fa85d74ff60db68fd.svg", "index-634beed2703b3d6bf91541376732f374.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-634beed2703b3d6bf91541376732f374.svg", "index-87f8e6883dca7800e38f5b59bba8f22e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-87f8e6883dca7800e38f5b59bba8f22e.svg", "index-5f01653b5f24fbccdb5443de993bed00.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-5f01653b5f24fbccdb5443de993bed00.svg", "index-f1af08974fb571c0a51a9e1d4c42150e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433230/index-f1af08974fb571c0a51a9e1d4c42150e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T19:42:10Z", "updated_at": "2026-08-16T19:43:43Z"}, {"id": 12420, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Идеальный газ получил количество теплоты 300 Дж и при этом внутренняя энергия газа увеличилась на 100 Дж. Какова работа,\nсовершенная газом? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-550b2f4f58bf195c3fed20a9b1f193a7.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-dd732c76a17d6cffc3edad87c952bb76.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-4da3f23998bfd509c163f184d031b3f4.svg\"/> — работа газа. Выразим работу\nгаза:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU\n\" class=\"math-display\" src=\"index-08a0bfcffaf6aae6cf4069c3e717aae5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A= 300 Дж − 100 Дж = 200 Д ж\n\" class=\"math-display\" src=\"index-2d9c154fd7807c8e5fcc8a648f0921aa.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-550b2f4f58bf195c3fed20a9b1f193a7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-550b2f4f58bf195c3fed20a9b1f193a7.svg", "index-dd732c76a17d6cffc3edad87c952bb76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-dd732c76a17d6cffc3edad87c952bb76.svg", "index-4da3f23998bfd509c163f184d031b3f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-4da3f23998bfd509c163f184d031b3f4.svg", "index-08a0bfcffaf6aae6cf4069c3e717aae5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-08a0bfcffaf6aae6cf4069c3e717aae5.svg", "index-2d9c154fd7807c8e5fcc8a648f0921aa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25302/index-2d9c154fd7807c8e5fcc8a648f0921aa.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": [], "created_at": "2021-12-01T11:05:40Z", "updated_at": "2026-04-04T05:44:13Z"}, {"id": 12429, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В некотором процессе газ отдал окружающей среде количество теплоты, равное 10 кДж. При этом внутренняя энергия газа\nувеличилась на 30 кДж. Определите работу, которую совершили внешние силы, сжав газ. Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону Термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU − A ⇒ A = ΔU − Q = 30 кДж − (−10 кД ж)= 40 кДж\n\" class=\"math-display\" src=\"index-6503e2facf32e6fc7336af16d35e9f0f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-e37de49c36306d101a69493ed9f89168.svg\"/> – переданное количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-0ed058ceed268b2b30ac51f11b0c0fa5.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-570aed7e9abb53d4412fcd3baf018fd6.svg\"/> – работа над газом.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6503e2facf32e6fc7336af16d35e9f0f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25321/index-6503e2facf32e6fc7336af16d35e9f0f.svg", "index-e37de49c36306d101a69493ed9f89168.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25321/index-e37de49c36306d101a69493ed9f89168.svg", "index-0ed058ceed268b2b30ac51f11b0c0fa5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25321/index-0ed058ceed268b2b30ac51f11b0c0fa5.svg", "index-570aed7e9abb53d4412fcd3baf018fd6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25321/index-570aed7e9abb53d4412fcd3baf018fd6.svg"}, "tags": ["Демоверсия", "2017", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Демоверсия 2017"], "created_at": "2021-12-01T11:12:39Z", "updated_at": "2026-04-04T05:45:55Z"}, {"id": 22573, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">Внутреннюю энергию 2 молей одноатомного идеального газа уменьшили на 800 Дж, а внешние силы\nсоверш
