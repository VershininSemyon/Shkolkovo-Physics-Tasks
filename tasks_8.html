воды.<br/>При этом при плавлении лёд &#34;заберёт&#34;количество теплоты, равное:\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm1,\n\" class=\"math-display\" src=\"index-d092c2977c2c1bbb56a6c39e48f55b9f.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"λ  \" class=\"math\" src=\"index-e33e0d673878baeb411fe7a6978de981.svg\"/> – искомая величина, <img alt=\"m1  \" class=\"math\" src=\"index-08a96d69e68298d695be5750784e0e2b.svg\"/> – масса льда.<br/>Из последних двух уравнений:\n</p> <div class=\"math-display\">\n<img alt=\"λ = cm(t−-t0) = 4200-⋅0,3⋅20-= 300 кДж/ кг\n       m1         0,084\n\" class=\"math-display\" src=\"index-e1845417b41577c01646ff815ccce638.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-acf476b04de4d300f929727be715a011.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39663/index-acf476b04de4d300f929727be715a011.svg", "index-6de1f4346645f90da08daf675b93e5b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-6de1f4346645f90da08daf675b93e5b2.svg", "index-1b506270bc61f245df8c8dd7802fb579.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-1b506270bc61f245df8c8dd7802fb579.svg", "index-182bb7ccb0133edf2b44a3616dae81fc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-182bb7ccb0133edf2b44a3616dae81fc.svg", "index-f5c6784c8456c4caa71a10b9f243b4a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-f5c6784c8456c4caa71a10b9f243b4a0.svg", "index-5a978740cc0e8c7b91f9b7031191248f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-5a978740cc0e8c7b91f9b7031191248f.svg", "index-f820c22d25640d59cb9793f0472a0f16.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-f820c22d25640d59cb9793f0472a0f16.svg", "index-d092c2977c2c1bbb56a6c39e48f55b9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-d092c2977c2c1bbb56a6c39e48f55b9f.svg", "index-e33e0d673878baeb411fe7a6978de981.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-e33e0d673878baeb411fe7a6978de981.svg", "index-08a96d69e68298d695be5750784e0e2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-08a96d69e68298d695be5750784e0e2b.svg", "index-e1845417b41577c01646ff815ccce638.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/39664/index-e1845417b41577c01646ff815ccce638.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2022-02-23T15:31:30Z", "updated_at": "2026-01-24T07:50:32Z"}, {"id": 64430, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Температура тела А равна 400 К, температура тела Б равна <img alt=\"    ∘\n− 23 C  \" class=\"math\" src=\"index-51ee040a06eb6482229d5974ae550648.svg\"/>. Какова разность температур между телами? Ответ дайте в\nК.\n</p>", "solution_html": "<p class=\"noindent\">Переведём градусы Цельсия в Кельвины:\n</p> <div class=\"math-display\">\n<img alt=\"TБ = 273− 23= 250 К\n\" class=\"math-display\" src=\"index-fc386f5aee7f9541e8d9332b55a1c6ff.svg\"/></div>\n<p class=\"indent\">   Тогда разность 150 К.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-51ee040a06eb6482229d5974ae550648.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116393/index-51ee040a06eb6482229d5974ae550648.svg", "index-fc386f5aee7f9541e8d9332b55a1c6ff.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116394/index-fc386f5aee7f9541e8d9332b55a1c6ff.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Тренировочные задания Школково"], "created_at": "2023-06-23T08:18:11Z", "updated_at": "2026-03-21T17:41:14Z"}]};

const searchTypeEl = document.getElementById('searchType');
const searchInput  = document.getElementById('searchInput');
const searchBtn    = document.getElementById('searchBtn');
const resetBtn     = document.getElementById('resetBtn');
const countEl      = document.getElementById('count');
const noResults    = document.getElementById('noResults');
const noResMsg     = document.getElementById('noResultsMsg');
const listEl       = document.getElementById('list');
const initMsg      = document.getElementById('initialMessage');

const PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const MAX_CONCURRENT = 6;
let activeLoads = 0;
const loadQueue = [];

function pumpQueue() {
  while (activeLoads < MAX_CONCURRENT && loadQueue.length > 0) {
    const img = loadQueue.shift();
    if (!img.isConnected || !img.hasAttribute('data-src')) continue;
    activeLoads++;
    startLoad(img);
  }
}

function startLoad(img) {
  const url = img.getAttribute('data-src');
  const attempt = Number(img.getAttribute('data-attempt') || 0);
  img.onload = function () {
    img.removeAttribute('data-src');
    activeLoads--;
    pumpQueue();
  };
  img.onerror = function () {
    activeLoads--;
    if (attempt < 3) {
      img.setAttribute('data-attempt', String(attempt + 1));
      setTimeout(function () {
        loadQueue.unshift(img);
        pumpQueue();
      }, 400 * (attempt + 1));
    } else {
      img.removeAttribute('data-src');
    }
    pumpQueue();
  };
  img.src = url;
}

const lazyObserver = new IntersectionObserver(function (entries) {
  entries.forEach(function (entry) {
    if (entry.isIntersecting) {
      lazyObserver.unobserve(entry.target);
      loadQueue.push(entry.target);
      pumpQueue();
    }
  });
}, { rootMargin: '400px 0px' });

function observeImages(root) {
  root.querySelectorAll('img[data-src]').forEach(function (img) {
    lazyObserver.observe(img);
  });
}

tasksData.questions.forEach((task, idx) => {
  task._seq = String(idx + 1);
  task._id = String(task.id);
  
  let searchText = '';
  searchText += (task.name || '') + ' ';
  searchText += (task.theme_path || '') + ' ';
  searchText += (task.tags || []).join(' ') + ' ';
  searchText += (task.sources || []).join(' ') + ' ';
  
  const extractText = (html) => {
    if (!html) return '';
    const div = document.createElement('div');
    div.innerHTML = html;
    return div.textContent || '';
  };
  
  searchText += extractText(task.question_html) + ' ';
  searchText += extractText(task.solution_html) + ' ';
  searchText += extractText(task.answer_html) + ' ';
  searchText += extractText(task.grade_criteria_html) + ' ';
  
  task._search = searchText.toLowerCase().replace(/\s+/g, ' ');
});

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function rewriteImages(html, images) {
  if (!html) return '';
  const imgMap = {};
  for (const [fname, url] of Object.entries(images || {})) {
    imgMap[fname] = url;
  }
  return html.replace(/src=(["'])([^"']+)\1/g, function (match, quote, src) {
    const fname = src.split('/').pop();
    const url = imgMap[fname] || (src.startsWith('http') ? src : '');
    if (!url) return match;
    return 'src=' + quote + PLACEHOLDER + quote +
           ' data-src=' + quote + url + quote +
           ' referrerpolicy="no-referrer"';
  });
}

function renderTask(task) {
  const tid = task.id;
  const name = escapeHtml(task.name || 'Без названия');
  const themePath = escapeHtml(task.theme_path || '');

  const tags = task.tags || [];
  const tagChips = tags.map(t => `<span class="chip">${escapeHtml(t)}</span>`).join('');
  
  const sources = task.sources || [];
  const srcChips = sources.map(s => `<span class="chip chip-src">${escapeHtml(s)}</span>`).join('');

  const qHtml = rewriteImages(task.question_html || '', task.images);
  const sHtml = rewriteImages(task.solution_html || '', task.images);
  const aHtml = rewriteImages(task.answer_html || '', task.images);
  const cHtml = rewriteImages(task.grade_criteria_html || '', task.images);

  function section(title, content, opened = false) {
    if (!content.trim()) return '';
    const openAttr = opened ? ' open' : '';
    return `
      <details class="section"${openAttr}>
        <summary>${title}</summary>
        <div class="tex-content">${content}</div>
      </details>
    `;
  }

  const sections = 
    section('Условие', qHtml, true) +
    section('Решение', sHtml) +
    section('Ответ', aHtml) +
    section('Критерии оценивания', cHtml);

  return `
    <div class="task-card" data-seq="${task._seq}" data-id="${tid}">
      <div class="task-head">
        <span class="badge badge-num">№${task._seq}</span>
        <span class="badge badge-id">ID ${tid}</span>
        <span class="task-name">${name}</span>
      </div>
      ${themePath ? `<div class="theme-path">${themePath}</div>` : ''}
      <div class="task-meta">
        ${tagChips ? `<div class="chips">${tagChips}</div>` : ''}
        ${srcChips ? `<div class="chips">${srcChips}</div>` : ''}
      </div>
      ${sections}
    </div>
  `;
}

function doSearch() {
  const type  = searchTypeEl.value;
  const query = searchInput.value.trim();

  if (!query) {
    listEl.innerHTML = '';
    initMsg.style.display = 'block';
    noResults.style.display = 'none';
    countEl.textContent = '';
    return;
  }

  initMsg.style.display = 'none';

  const filtered = tasksData.questions.filter(task => {
    if (type === 'number') {
      const num = query;
      return (task._seq === num) || (task._id === num) ||
             task._id.startsWith(num) || task._seq.startsWith(num);
    } else {
      const needle = query.toLowerCase();
      return task._search.includes(needle);
    }
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '';
    noResults.style.display = 'block';
    if (type === 'number') {
      noResMsg.textContent = `Задачи с номером «${query}» нет`;
    } else {
      noResMsg.textContent = `По запросу «${query}» ничего не найдено`;
    }
    countEl.textContent = `Показано 0 из ${tasksData.questions.length}`;
  } else {
    noResults.style.display = 'none';
    listEl.innerHTML = filtered.map(renderTask).join('');
    observeImages(listEl);
    countEl.textContent = `Показано ${filtered.length} из ${tasksData.questions.length}`;
  }
}

function doReset() {
  searchInput.value = '';
  listEl.innerHTML = '';
  initMsg.style.display = 'block';
  noResults.style.display = 'none';
  countEl.textContent = '';
  searchInput.focus();
}

searchBtn.addEventListener('click', doSearch);
resetBtn.addEventListener('click', doReset);

searchInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    doSearch();
  }
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = true);
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('details.section').forEach(d => d.open = false);
});

initMsg.style.display = 'block';
noResults.style.display = 'none';
</script>
