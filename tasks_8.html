b115e5561930f208cc69.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25323/index-ad3d266f490fb115e5561930f208cc69.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2018", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики", "Работа газа"], "sources": ["Демоверсия 2018"], "created_at": "2021-12-01T11:14:31Z", "updated_at": "2026-05-15T18:02:14Z"}, {"id": 95509, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Кусок металла удельной теплоёмкостью <img alt=\"500 Дж/ (кг ⋅К)  \" class=\"math\" src=\"index-f4f228287fd1a64233bae7253e1c5ef1.svg\"/> нагрели от <img alt=\"20∘C  \" class=\"math\" src=\"index-49542836215173dbacbddc363c652943.svg\"/> до <img alt=\"100∘C,  \" class=\"math\" src=\"index-b5da01c61a5fd07ef6dfd217a864c623.svg\"/> затратив количество теплоты,\nравное 160 кДж. Чему равна масса этого куска металла? Ответ дайте в кг.\n</p>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты для нагрева вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm (t2− t1),\n\" class=\"math-display\" src=\"index-307695bab1eb53e860fca9cdaef3a053.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-8f8632e5f9092ef8ff2a3106c7bca055.svg\"/> – теплоёмкость, <img alt=\"m  \" class=\"math\" src=\"index-756e609757ce9121fc78ae586e282d33.svg\"/> – масса, <img alt=\"t2  \" class=\"math\" src=\"index-6b7dbcfe3117284a0cabbb3a1bad831e.svg\"/> и <img alt=\"t1  \" class=\"math\" src=\"index-ab01f5315f0a29a757ea979226cc5769.svg\"/> – конечная и начальная температура.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"       Q      160⋅103\nm = c(t-−-t)-= 500⋅80-= 4 кг\n      2  1\n\" class=\"math-display\" src=\"index-6f6d159f9a59d3a599ae51990d076721.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f4f228287fd1a64233bae7253e1c5ef1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/194133/index-f4f228287fd1a64233bae7253e1c5ef1.svg", "index-49542836215173dbacbddc363c652943.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/194133/index-49542836215173dbacbddc363c652943.svg", "index-b5da01c61a5fd07ef6dfd217a864c623.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/194133/index-b5da01c61a5fd07ef6dfd217a864c623.svg", "index-307695bab1eb53e860fca9cdaef3a053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-307695bab1eb53e860fca9cdaef3a053.svg", "index-8f8632e5f9092ef8ff2a3106c7bca055.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-8f8632e5f9092ef8ff2a3106c7bca055.svg", "index-756e609757ce9121fc78ae586e282d33.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-756e609757ce9121fc78ae586e282d33.svg", "index-6b7dbcfe3117284a0cabbb3a1bad831e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-6b7dbcfe3117284a0cabbb3a1bad831e.svg", "index-ab01f5315f0a29a757ea979226cc5769.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-ab01f5315f0a29a757ea979226cc5769.svg", "index-6f6d159f9a59d3a599ae51990d076721.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/204120/index-6f6d159f9a59d3a599ae51990d076721.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2019"], "created_at": "2024-08-29T15:23:28Z", "updated_at": "2026-05-03T11:13:08Z"}, {"id": 92326, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">У идеального теплового двигателя Карно температура нагревателя 500 К, а температура холодильника 300 К. Определите\nКПД теплового двигателя. Ответ дайте в %.\n</p>", "solution_html": "<p class=\"noindent\">Начнем с определения КПД идеального двигателя:\n</p> <div class=\"math-display\">\n<img alt=\"    Tн− Tх\nη = --Tн--⋅100%\n\" class=\"math-display\" src=\"index-d53018feca4f45dcab9cf8e7b2b3b740.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"η = 500−-300⋅100% = 40%\n      500\n\" class=\"math-display\" src=\"index-52550dbcecc78b21c8fc7de5f74e0d7b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d53018feca4f45dcab9cf8e7b2b3b740.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196232/index-d53018feca4f45dcab9cf8e7b2b3b740.svg", "index-52550dbcecc78b21c8fc7de5f74e0d7b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196232/index-52550dbcecc78b21c8fc7de5f74e0d7b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика"], "sources": ["Демидова 2019"], "created_at": "2024-07-21T06:42:10Z", "updated_at": "2026-04-18T14:15:13Z"}, {"id": 94353, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На TV-диаграмме показан процесс изменения состояния идеального одноатомного газа. В ходе этого процесса газ совершил работу,\nравную 80 кДж. Какое количество теплоты получил газ в этом процессе, если его масса не меняется? Ответ дайте в\nкДж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"94353.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Первый закон термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   Заметим, что процесс 1-2 изотермический, температура не меняется, следовательно изменение внутренней энергии равно\n0.<br/>Первый закон термодинамики примет вид\n</p> <div class=\"math-display\">\n<img alt=\"Q = A= 80 кДж.\n\" class=\"math-display\" src=\"index-6c37848d110a8b6f1b7b3de2fd8f8f9b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"94353.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190769/94353.png", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199709/index-bd94ff284644b2773b552a8c5529b561.svg", "index-6c37848d110a8b6f1b7b3de2fd8f8f9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/199709/index-6c37848d110a8b6f1b7b3de2fd8f8f9b.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Демидова 2019"], "created_at": "2024-08-11T05:54:48Z", "updated_at": "2026-07-11T23:14:27Z"}, {"id": 92491, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">У идеального теплового двигателя Карно температура нагревателя 600 К. Определите температуру холодильника, если\nКПД теплового двигателя составляет 25 %. Ответ дайте в К.\n</p>", "solution_html": "<p class=\"noindent\">Начнем с определния КПД идеального двигателя:\n</p> <div class=\"math-display\">\n<img alt=\"    Tн− Tх\nη = --Tн--⋅100%\n\" class=\"math-display\" src=\"index-d53018feca4f45dcab9cf8e7b2b3b740.svg\"/></div>\n<p class=\"indent\">   Выразим температуру холодильника:\n</p> <div class=\"math-display\">\n<img alt=\"Tх = Tн⋅(1− η)= 600⋅(1− 0,25)= 450 К\n\" class=\"math-display\" src=\"index-96eea76c0f64d39f05d56cfff3f63222.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d53018feca4f45dcab9cf8e7b2b3b740.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196897/index-d53018feca4f45dcab9cf8e7b2b3b740.svg", "index-96eea76c0f64d39f05d56cfff3f63222.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196897/index-96eea76c0f64d39f05d56cfff3f63222.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-07-24T15:01:14Z", "updated_at": "2026-04-18T14:15:37Z"}, {"id": 177446, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">У идеальной тепловой машины Карно температура холодильника равна 300 К. Какой должна быть температура её\nнагревателя, чтобы КПД машины был равен 40%? Ответ дайте в К.\n</p>", "solution_html": "<p class=\"noindent\">КПД идеального двигателя: <img alt=\"   Tн-− Tх\nη =  Tн  \" class=\"math\" src=\"index-230893c0ce575df365069ecfef775617.svg\"/>. Выразим температуру нагревателя: <img alt=\"     -Tх-   -300--  300\nTн = 1− η = 1− 0,4 = 0,6 = 500  \" class=\"math\" src=\"index-925aa60f5a9cfc0312cf27e11d08fb22.svg\"/>\nК.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-230893c0ce575df365069ecfef775617.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386173/index-230893c0ce575df365069ecfef775617.svg", "index-925aa60f5a9cfc0312cf27e11d08fb22.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386173/index-925aa60f5a9cfc0312cf27e11d08fb22.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ФИПИ"], "created_at": "2026-04-10T19:31:16Z", "updated_at": "2026-04-10T19:37:39Z"}, {"id": 103093, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ участвует в процессе 1-2-3, показанном на рисунке (<img alt=\"T  \" class=\"math\" src=\"index-5b2cd6ad0a09fa8aa7a905e46e5f2ee4.svg\"/> – абсолютная температура газа, <img alt=\"p  \" class=\"math\" src=\"index-70a849a0e997aba3e1fd72b7bbef75e3.svg\"/> – давление\nгаза). Масса газа в ходе процесса не меняется. В процессе 1-2 газ отдаёт количество теплоты, равное 20 кДж. Какую работу\nсовершают над газом в процессе 1-2 внешние силы? Ответ дайте в кДж.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"526\" src=\"103093.png\" width=\"526\"/></p></div>", "solution_html": "<p class=\"noindent\">1-2 – изотермическое сжатие, значит, совершается работа над газом, при этом из-за постоянства температуры внутренняя энергия\nгаза не изменяется <img alt=\"(ΔU = 0)  \" class=\"math\" src=\"index-0f6a94e666f44b4ead5c79b9e1dc7dca.svg\"/>. Т.е. по первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q =ΔU  + A= A,\n\" class=\"math-display\" src=\"index-1d6132836158a23fc3f23f4f23c96d61.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-9c071e661b54ee099e1202be1476e9ea.svg\"/> – количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-07300110ddb4479c076a4979ca1f5c53.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-acc8dc629225e879b24ce4a657e37be7.svg\"/> – работа газа.<br/>Газ отдает количество теплоты, причем все это происходит из-за работы над газом, т.е.\n</p> <div class=\"math-display\">\n<img alt=\"A = 20 кДж\n\" class=\"math-display\" src=\"index-f6ff0c4a923bc7c0e5086a27d5723db4.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5b2cd6ad0a09fa8aa7a905e46e5f2ee4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220938/index-5b2cd6ad0a09fa8aa7a905e46e5f2ee4.svg", "index-70a849a0e997aba3e1fd72b7bbef75e3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220938/index-70a849a0e997aba3e1fd72b7bbef75e3.svg", "103093.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220938/103093.png", "index-0f6a94e666f44b4ead5c79b9e1dc7dca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-0f6a94e666f44b4ead5c79b9e1dc7dca.svg", "index-1d6132836158a23fc3f23f4f23c96d61.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-1d6132836158a23fc3f23f4f23c96d61.svg", "index-9c071e661b54ee099e1202be1476e9ea.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-9c071e661b54ee099e1202be1476e9ea.svg", "index-07300110ddb4479c076a4979ca1f5c53.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-07300110ddb4479c076a4979ca1f5c53.svg", "index-acc8dc629225e879b24ce4a657e37be7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-acc8dc629225e879b24ce4a657e37be7.svg", "index-f6ff0c4a923bc7c0e5086a27d5723db4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212537/index-f6ff0c4a923bc7c0e5086a27d5723db4.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T08:57:05Z", "updated_at": "2026-07-03T07:42:55Z"}, {"id": 126763, "name": "Работа газа", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-4ae199786c1cf02740562c578da60dd6.svg\"/>-диаграмме (см. рисунок) показано, как изменялось давление газа при его переходе из состояния 1 в состояние 2. Найдите\nработу газа за процесс 1-2. Ответ дайте в Дж. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"126763_1.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V. Поэтому работа газа вычисляется, как площадь\nтрапеции\n</p> <div class=\"math-display\">\n<img alt=\"    300⋅103+ 100⋅103\nA = -------2--------⋅0,15 ⋅10−3 = 30 Дж.\n\" class=\"math-display\" src=\"index-786d3cec8da439dc18ec085a762f68fd.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4ae199786c1cf02740562c578da60dd6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261963/index-4ae199786c1cf02740562c578da60dd6.svg", "126763_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261963/126763_1.png", "index-786d3cec8da439dc18ec085a762f68fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/261964/index-786d3cec8da439dc18ec085a762f68fd.svg"}, "tags": ["ЕГЭ 2025. Резерв"], "sources": ["ЕГЭ 2025. Резерв"], "created_at": "2025-06-16T08:59:07Z", "updated_at": "2026-05-15T17:51:14Z"}, {"id": 96349, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Определите, каково должно быть примерное отношение масс <img alt=\"mmFAel-  \" class=\"math\" src=\"index-e75c15f9d2880c794a7b90c6bca9006a.svg\"/> железного и алюминиевого тел, чтобы при получении\nодного и того же количества теплоты они нагрелись на одно и то же число градусов. Ответ округлите до\nцелых.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, необходимое для изменения температуры тела, определяется выражением:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm Δt\n\" class=\"math-display\" src=\"index-15e3e53ee8a79ad05753bace826528a9.svg\"/></div>\n<p class=\"indent\">   Обозначим величины с индексом 1 - для железного тела, а с индексом 2 - для алюминиевого.<br/>По условию <img alt=\"Q1 = Q2  \" class=\"math\" src=\"index-432ca609436fc539de0f63ad17decc10.svg\"/>\n</p><p class=\"indent\">   Выразим отношение масс:\n</p> <div class=\"math-display\">\n<img alt=\"m1-= c2 = 900-≈ 2\nm2   c1   460\n\" class=\"math-display\" src=\"index-03ee78df8cbe061da83fd1630a57dad5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e75c15f9d2880c794a7b90c6bca9006a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/196524/index-e75c15f9d2880c794a7b90c6bca9006a.svg", "index-15e3e53ee8a79ad05753bace826528a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206351/index-15e3e53ee8a79ad05753bace826528a9.svg", "index-432ca609436fc539de0f63ad17decc10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206351/index-432ca609436fc539de0f63ad17decc10.svg", "index-03ee78df8cbe061da83fd1630a57dad5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206351/index-03ee78df8cbe061da83fd1630a57dad5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2019"], "created_at": "2024-09-10T09:56:30Z", "updated_at": "2026-05-19T16:37:35Z"}, {"id": 103123, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-e3bee3e4c440d4d7ec3f762d12f6a728.svg\"/>-диаграмме (см. рисунок) показано, как изменялось давление газа при его переходе из состояния 1 в состояние 3. Каково\nотношение<img alt=\"A12\nA23  \" class=\"math\" src=\"index-464885b280980eba18a71c38c1ef1917.svg\"/> работ газа в процессах 1–2 и 2–3? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"103123.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V, тогда:\n</p> <div class=\"math-display\">\n<img alt=\"      4+ 2\nA12 = -2--⋅2= 6.\n\" class=\"math-display\" src=\"index-d8ec083debf328e5ba7bb1f724e7dd91.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A23 = 2 ⋅2 = 4\n\" class=\"math-display\" src=\"index-4b3d1bb114a27f7e2413b217cbea5fa5.svg\"/></div>\n<p class=\"indent\">   Тогда:\n</p> <div class=\"math-display\">\n<img alt=\"A     6\nA12=  4 = 1,5.\n 23\n\" class=\"math-display\" src=\"index-f59e755729d3f23851dfba6c5405f266.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e3bee3e4c440d4d7ec3f762d12f6a728.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212598/index-e3bee3e4c440d4d7ec3f762d12f6a728.svg", "index-464885b280980eba18a71c38c1ef1917.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212598/index-464885b280980eba18a71c38c1ef1917.svg", "103123.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212598/103123.png", "index-d8ec083debf328e5ba7bb1f724e7dd91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212600/index-d8ec083debf328e5ba7bb1f724e7dd91.svg", "index-4b3d1bb114a27f7e2413b217cbea5fa5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212600/index-4b3d1bb114a27f7e2413b217cbea5fa5.svg", "index-f59e755729d3f23851dfba6c5405f266.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212600/index-f59e755729d3f23851dfba6c5405f266.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T18:21:05Z", "updated_at": "2026-05-15T17:52:36Z"}, {"id": 29296, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния постоянной массы одноатомного\nидеального газа. На каком участке работа газа положительна и равна полученному газом количеству\nтеплоты\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"29296.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.<br/>Так как <img alt=\"Q = A  \" class=\"math\" src=\"index-0a2eaeffec746828a73c4e152d5ab562.svg\"/>, то <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-a6a2d39618bbc9810e57daa364a552f6.svg\"/>, при этом изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2νR ΔT,\n\" class=\"math-display\" src=\"index-cef7bd6f0291871d41210ec99e50c3e7.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-7936f88a3412e50e52e33f6072925459.svg\"/> – количество вещества, <img alt=\"ΔT  \" class=\"math\" src=\"index-a004ae334e14e43abb2260e163b29df8.svg\"/> – изменение температуры.<br/>Следовательно, температура не изменялась.<br/>Работа газа положительна, если объём газа увеличивается. По закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const,\n\" class=\"math-display\" src=\"index-5ded8cec2407adf3f8a33cc921b1520c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-00fda5fe4397acdc4285700be47141f0.svg\"/> – объём, то есть объём увеличивается при уменьшении давления, что соответствует графику 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"29296.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54073/29296.png", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-0a2eaeffec746828a73c4e152d5ab562.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-0a2eaeffec746828a73c4e152d5ab562.svg", "index-a6a2d39618bbc9810e57daa364a552f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-a6a2d39618bbc9810e57daa364a552f6.svg", "index-cef7bd6f0291871d41210ec99e50c3e7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index-cef7bd6f0291871d41210ec99e50c3e7.svg", "index-7936f88a3412e50e52e33f6072925459.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/54074/index- ce/v1/GetSession/197292/index-37dbb3c65f1a6b1fc5bb570bf5718e53.svg", "index-15e3e53ee8a79ad05753bace826528a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206362/index-15e3e53ee8a79ad05753bace826528a9.svg", "index-432ca609436fc539de0f63ad17decc10.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206362/index-432ca609436fc539de0f63ad17decc10.svg", "index-16c80043c99ff886d366472442b16773.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206362/index-16c80043c99ff886d366472442b16773.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Демидова 2019"], "created_at": "2024-09-15T14:45:01Z", "updated_at": "2026-04-18T14:18:01Z"}, {"id": 136698, "name": "Демка ЕГЭ 2026 - 8", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показано, как менялось давление газа в зависимости от его объёма при переходе из состояния 1 в состояние 2, а затем в\nсостояние 3. Каково отношение работ газа <img alt=\"A23∕A12  \" class=\"math\" src=\"index-d22ee4694e6e5e23f5088c2c1fedaa66.svg\"/> в этих двух процессах? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"136698.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V, тогда\n</p> <div class=\"math-display\">\n<img alt=\"A12 = 4 ⋅2 = 8\n\" class=\"math-display\" src=\"index-0b901414c496e69993963a9a9921ca53.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"      4+-2\nA12 =  2  ⋅2 =6\n\" class=\"math-display\" src=\"index-ac1adad74922a19dfa69fbf372d8a32a.svg\"/></div>\n<p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"A\nA23= 0,75\n 12\n\" class=\"math-display\" src=\"index-6d97a4e40e9a13d6f2d20b833b3b6e7c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d22ee4694e6e5e23f5088c2c1fedaa66.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286041/index-d22ee4694e6e5e23f5088c2c1fedaa66.svg", "136698.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286041/136698.png", "index-0b901414c496e69993963a9a9921ca53.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286042/index-0b901414c496e69993963a9a9921ca53.svg", "index-ac1adad74922a19dfa69fbf372d8a32a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286042/index-ac1adad74922a19dfa69fbf372d8a32a.svg", "index-6d97a4e40e9a13d6f2d20b833b3b6e7c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286042/index-6d97a4e40e9a13d6f2d20b833b3b6e7c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["Демоверсия 2026"], "created_at": "2025-08-22T12:21:05Z", "updated_at": "2026-09-21T17:03:34Z"}, {"id": 34587, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния 1 моль одноатомного идеального газа. На каком участке\nцикла изменение внутренней энергии газа равно полученному газом количеству теплоты?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"f-ege-8-3-1.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-c9351e888e6723f3c4066e42a570d2dc.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-a7e7541c210f58b8d4c45834766266b8.svg\"/> — работа газа.<br/>То есть работа газа должна быть равна нулю, значит, объём постоянен. По уравнению Клапейрона-Менделеева:\n</p> <div class=\"math-display\">\n<img alt=\"pV\n-T-= νR,\n\" class=\"math-display\" src=\"index-449faef80ec38389c793c2926cb22e0d.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-59ab94700cf7db2f272b9533f90ba30c.svg\"/> – объём газа.<br/>При постоянном давлении имеем:\n</p> <div class=\"math-display\">\n<img alt=\"p-= νR = const⇒  p= const⋅T,\nT\n\" class=\"math-display\" src=\"index-00a872b3830e2a019625cb0d90579be9.svg\"/></div>\n<p class=\"indent\">   то есть прямая линия под некоторым наклоном (2)\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-8-3-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66537/f-ege-8-3-1.png", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-c9351e888e6723f3c4066e42a570d2dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-c9351e888e6723f3c4066e42a570d2dc.svg", "index-a7e7541c210f58b8d4c45834766266b8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-a7e7541c210f58b8d4c45834766266b8.svg", "index-449faef80ec38389c793c2926cb22e0d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-449faef80ec38389c793c2926cb22e0d.svg", "index-59ab94700cf7db2f272b9533f90ba30c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-59ab94700cf7db2f272b9533f90ba30c.svg", "index-00a872b3830e2a019625cb0d90579be9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/66538/index-00a872b3830e2a019625cb0d90579be9.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "МКТ. Термодинамика", "Первый закон термодинамики", "2022"], "sources": ["Демоверсия 2022", "Демидова 2019"], "created_at": "2022-08-31T06:44:41Z", "updated_at": "2026-04-18T14:05:00Z"}, {"id": 169649, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния постоянной массы одноатомного идеального газа. На каком участке\nмодуль работы внешних сил над газом равен модулю отданного газом количества теплоты? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"169649.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Запишем первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A.\n\" class=\"math-display\" src=\"index-d06162f9050b49abd706c9157232c7f0.svg\"/></div>\n<p class=\"indent\">   Нам нужен такой участок циклического процесса, где <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-899d904ea246ae48206baeea92bc2c15.svg\"/>. Тогда в этом случае <img alt=\"Q = A  \" class=\"math\" src=\"index-a2a04996ad0c753fcc367aef7f73af3d.svg\"/>. Для такого подходит\nизотермический процесс, который представлен участком 3 на графике.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"169649.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364703/169649.png", "index-d06162f9050b49abd706c9157232c7f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364704/index-d06162f9050b49abd706c9157232c7f0.svg", "index-899d904ea246ae48206baeea92bc2c15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364704/index-899d904ea246ae48206baeea92bc2c15.svg", "index-a2a04996ad0c753fcc367aef7f73af3d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/364704/index-a2a04996ad0c753fcc367aef7f73af3d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Работа газа"], "sources": ["ЕГКР 21.12.2023-1"], "created_at": "2026-02-20T16:54:21Z", "updated_at": "2026-05-15T17:55:56Z"}, {"id": 93785, "name": "Задача на молекулярную физику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния 1 моль одноатомного идеального газа. На каком участке\nцикла работа внешних сил над газом равна отданному газом количеству теплоты? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"f-ege-8-3-1.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f9715b7933269c9721cd22eb7fb59a7e.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-1a8a5fb4f8a04b9f13af71a2961403d4.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-1b2284017c3bcc57630ece7698974996.svg\"/> — работа газа.<br/>То есть изменение внутренней энергии газа должно быть равно нулю, значит, температура постоянна. <br/>Значит это прямая линия под номером 1.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-8-3-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/189033/f-ege-8-3-1.png", "index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197245/index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg", "index-f9715b7933269c9721cd22eb7fb59a7e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197245/index-f9715b7933269c9721cd22eb7fb59a7e.svg", "index-1a8a5fb4f8a04b9f13af71a2961403d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197245/index-1a8a5fb4f8a04b9f13af71a2961403d4.svg", "index-1b2284017c3bcc57630ece7698974996.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/197245/index-1b2284017c3bcc57630ece7698974996.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["Демидова 2019"], "created_at": "2024-07-31T15:11:26Z", "updated_at": "2026-04-18T14:18:52Z"}, {"id": 177732, "name": "Задача на молекулярную физику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния 1 моль одноатомного идеального газа. На каком участке\nцикла изменение внутренней энергии газа равно полученному количеству теплоты? </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"f-ege-8-3-1.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f9715b7933269c9721cd22eb7fb59a7e.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-1a8a5fb4f8a04b9f13af71a2961403d4.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-1b2284017c3bcc57630ece7698974996.svg\"/> — работа газа.<br/>То есть работа газа должна быть равна нулю, значит, объем постоянный. <br/>Значит это прямая линия под номером 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-8-3-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387221/f-ege-8-3-1.png", "index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387222/index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg", "index-f9715b7933269c9721cd22eb7fb59a7e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387222/index-f9715b7933269c9721cd22eb7fb59a7e.svg", "index-1a8a5fb4f8a04b9f13af71a2961403d4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387222/index-1a8a5fb4f8a04b9f13af71a2961403d4.svg", "index-1b2284017c3bcc57630ece7698974996.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387222/index-1b2284017c3bcc57630ece7698974996.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ"], "sources": ["Демидова 2019"], "created_at": "2026-04-12T20:33:44Z", "updated_at": "2026-05-15T17:58:08Z"}, {"id": 177180, "name": "ФИПИ 8 ", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показана последовательность процессов изменения состояния идеального газа. В каком из процессов <img alt=\"(1,2,3 или 4)  \" class=\"math\" src=\"index-1ef8432c87999969386e38a9e70b522e.svg\"/> газ\nсовершает наибольшую по модулю работу?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"177180.png\" width=\"421\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа ЧИСЛЕННО равна площади под графиком в координатах p-V<br/>\n</p><p class=\"indent\">   В процессах 1 и 4 изменение объёма мало, поэтому и работа по модулю меньше.\n</p><p class=\"indent\">   В процессах 2 и 3 изменение объёма значительно, но процесс 2 идёт при больших давлениях, чем процесс 3, и объём изменяется\nсильнее. Следовательно, площадь под графиком в процессе 2 наибольшая.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-1ef8432c87999969386e38a9e70b522e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385336/index-1ef8432c87999969386e38a9e70b522e.svg", "177180.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/385336/177180.png"}, "tags": [], "sources": ["ФИПИ", "ЕГЭ 2026 основная волна, Юг"], "created_at": "2026-04-09T00:46:31Z", "updated_at": "2026-06-22T02:35:58Z"}, {"id": 103124, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Твёрдое тело остывает. На рисунке изображён график ed_at": "2025-01-26T20:04:01Z", "updated_at": "2026-04-18T14:22:15Z"}, {"id": 106688, "name": "Задача по термодинамике", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Какую работу совершает газ при переходе из состояния 1 в состояние 3 (см. рисунок)? Ответ дайте в кДж. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"8.4.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Работу газа можно найти как площадь под графиком, тогда\n</p> <div class=\"math-display\">\n<img alt=\"               3      3\nA= 100 кПа(0,2 м − 0,1 м )= 10 кД ж\n\" class=\"math-display\" src=\"index-540a259dbf6de5fb02baa930e56e9cae.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"8.4.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221004/8.4.png", "index-540a259dbf6de5fb02baa930e56e9cae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221044/index-540a259dbf6de5fb02baa930e56e9cae.svg"}, "tags": [], "sources": ["Отличник"], "created_at": "2025-02-25T16:29:25Z", "updated_at": "2025-02-26T10:11:06Z"}, {"id": 120739, "name": "Первое начало термодинамики", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В некотором процессе идеальный газ получил количество теплоты 50 Дж. При этом внутренняя энергия газа увеличилась на 20 Дж.\nЧему равна работа, совершённая газом в этом процессе? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Применим первый закон термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = A+ ΔU\n\" class=\"math-display\" src=\"index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg\"/></div>\n<p class=\"indent\">   Выразим искомую работу:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q − ΔU =50 − 20 =30 Дж\n\" class=\"math-display\" src=\"index-e352dfad81c61f8f5372dc64938026c3.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bdab2eee7  часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке приведена зависимость температуры T однородного твёрдого тела массой 2 кг от времени t в процессе нагревания. Чему\nравна удельная теплоёмкость вещества этого тела? Подводимую к телу тепловую мощность можно считать постоянной и равной 450\nВт.<br/>Ответ дайте в <img alt=\"Дж/(кг⋅К )  \" class=\"math\" src=\"index-08be40cbda52ab6f69b131ece246e64e.svg\"/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"130849.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты, подводимое телу при его нагревании, равно <img alt=\"Q = cm ΔT  \" class=\"math\" src=\"index-f56a4e0e7bb38e3b9976ee4fc7efc264.svg\"/>. Тепловая мощность равна <img alt=\"    Q-\nP = t  \" class=\"math\" src=\"index-efcd538026dec1aae0ecdadfb00c87a9.svg\"/>. По графику\nвидно, что нагревание тела на 10 К происходило в течение 40 с.Тогда удельная теплоемкость данного вещества\nравна:\n</p> <div class=\"math-display\">\n<img alt=\"c=  -Pt--= 450-⋅40-= 900 Дж/ (кг ⋅К)\n    mΔT    2 ⋅10\n\" class=\"math-display\" src=\"index-52a3ff9180e80406d84ad496acb310f2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-08be40cbda52ab6f69b131ece246e64e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270956/index-08be40cbda52ab6f69b131ece246e64e.svg", "130849.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270956/130849.png", "index-f56a4e0e7bb38e3b9976ee4fc7efc264.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270957/index-f56a4e0e7bb38e3b9976ee4fc7efc264.svg", "index-efcd538026dec1aae0ecdadfb00c87a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270957/index-efcd538026dec1aae0ecdadfb00c87a9.svg", "index-52a3ff9180e80406d84ad496acb310f2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270957/index-52a3ff9180e80406d84ad496acb310f2.svg"}, "tags": ["Статград 07.03.2023 Физика 1"], "sources": ["CтатГрад 07.03.2023 Физика 1"], "created_at": "2025-07-19T18:59:39Z", "updated_at": "2026-04-18T14:23:25Z"}, {"id": 130851, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"T − p  \" class=\"math\" src=\"index-a0023437d1bfc5aa0aa8d79181daf19a.svg\"/>-диаграмме показан процесс изменения состояния идеального одноатомного газа. Газ отдал в этом процессе количество\nтеплоты 80 кДж. Масса газа не менялась. Определите работу, совершённую внешними силами над газом в этом процессе, если <img alt=\"    p1  \" class=\"math\" src=\"index-7be720da6e9cfb4f8f4b7559a6ce7b46.svg\"/> =\n80 кПа, <img alt=\"p2  \" class=\"math\" src=\"index-073a5517325eaa33dca9b1cf07795907.svg\"/> = 200 кПа, <img alt=\"T0  \" class=\"math\" src=\"index-4b4bc95d17215eb7a181b7bff54a8ec5.svg\"/> = 300 К.<br/>Ответ дайте в кДж\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"130851.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Так как процесс изотермический, то внутренняя энергия газа не изменялась <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-26dc7ec648f5de3804847da13a9a65ad.svg\"/>. Из первого закона термодинамики следует,\nчто <img alt=\"Q= A + ΔU  \" class=\"math\" src=\"index-0e52b29b3a99f33d9cdac79fe1a39065.svg\"/>, где <img alt=\"Q = −80 кД ж  \" class=\"math\" src=\"index-61b8dd509ddce63d07b787ba9f876393.svg\"/>. Тогда работа, совершенная внешними силами над газом, равна <img alt=\"A′ = −A = 80 кДж  \" class=\"math\" src=\"index-7ddab4c5587e87abc3085dfc7362b4d1.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a0023437d1bfc5aa0aa8d79181daf19a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270958/index-a0023437d1bfc5aa0aa8d79181daf19a.svg", "index-7be720da6e9cfb4f8f4b7559a6ce7b46.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270958/index-7be720da6e9cfb4f8f4b7559a6ce7b46.svg", "index-073a5517325eaa33dca9b1cf07795907.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270958/index-073a5517325eaa33dca9b1cf07795907.svg", "index-4b4bc95d17215eb7a181b7bff54a8ec5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270958/index-4b4bc95d17215eb7a181b7bff54a8ec5.svg", "130851.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270958/130851.png", "index-26dc7ec648f5de3804847da13a9a65ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270959/index-26dc7ec648f5de3804847da13a9a65ad.svg", "index-0e52b29b3a99f33d9cdac79fe1a39065.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270959/index-0e52b29b3a99f33d9cdac79fe1a39065.svg", "index-61b8dd509ddce63d07b787ba9f876393.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270959/index-61b8dd509ddce63d07b787ba9f876393.svg", "index-7ddab4c5587e87abc3085dfc7362b4d1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/270959/index-7ddab4c5587e87abc3085dfc7362b4d1.svg"}, "tags": ["Статград 07.03.2023 Физика 1"], "sources": ["CтатГрад 07.03.2023 Физика 1"], "created_at": "2025-07-19T19:07:28Z", "updated_at": "2026-04-28T11:28:20Z"}, {"id": 131306, "name": "МКТ. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В сосуде объёмом 8,31 л находится 0,35 моль идеального газа при давлении 100 кПа. Газ сначала изотермически расширяют в 2 раза,\nа затем изохорически нагревают на 24 К. Чему равен объём газа в конечном состоянии? <br/>Ответ дайте в л и округлите до целого числа.\n</p>", "solution_html": "<p class=\"noindent\">Запишем уравнение Менделеева - Клапейрона для каждого состояния газа:\n</p> <div class=\"math-display\">\n<img alt=\"p1V1 = νRT1\n\" class=\"math-display\" src=\"index-4179a4de8098ea1128b14b4ba338e41b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"p2V2 = νRT1\n\" class=\"math-display\" src=\"index-2ce30b0fccf469f624b566c2c6f8dc06.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"p2V3 = νR(T1+ ΔT)\n\" class=\"math-display\" src=\"index-c3cdbe9849720d6b9fc1b3d45a65f19a.svg\"/></div>\n<p class=\"indent\">   Из этих уравнений получаем объём газа в конечном состоянии:\n</p> <div class=\"math-display\">\n<img alt=\"    νR-(T1+-ΔT-)  νR-(T1-+ΔT-)\nV3 =     p2     =     νRT1   V2\n\" class=\"math-display\" src=\"index-9e9bad6ba831467f480359205bda8577.svg\"/></div>\n<p class=\"indent\">   Учитывая, что <img alt=\"νRT1 = p1V1  \" class=\"math\" src=\"index-9f1fd566e1209f488692a75a5282b22f.svg\"/> и <img alt=\"V2 = 2V1  \" class=\"math\" src=\"index-8ad56b7d393159508be8d7a6a4800587.svg\"/>, находим объём в конечном состоянии:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"     p1V1+ νRΔT    2⋅(100 ⋅103 ⋅8,31⋅10−3+ 0,35 ⋅8,31⋅24)\nV3 = 2----p1---- = -------------100⋅103------------- ≈18 л\n\" class=\"math-display\" src=\"index-e75f3b3293d2509893c8829efaf7111a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-4179a4de8098ea1128b14b4ba338e41b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-4179a4de8098ea1128b14b4ba338e41b.svg", "index-2ce30b0fccf469f624b566c2c6f8dc06.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-2ce30b0fccf469f624b566c2c6f8dc06.svg", "index-c3cdbe9849720d6b9fc1b3d45a65f19a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-c3cdbe9849720d6b9fc1b3d45a65f19a.svg", "index-9e9bad6ba831467f480359205bda8577.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-9e9bad6ba831467f480359205bda8577.svg", "index-9f1fd566e1209f488692a75a5282b22f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-9f1fd566e1209f488692a75a5282b22f.svg", "index-8ad56b7d393159508be8d7a6a4800587.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-8ad56b7d393159508be8d7a6a4800587.svg", "index-e75f3b3293d2509893c8829efaf7111a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/271877/index-e75f3b3293d2509893c8829efaf7111a.svg"}, "tags": ["Статград 07.03.2023 Физика 2"], "sources": ["CтатГрад 07.03.2023 Физика 2"], "created_at": "2025-07-22T16:56:15Z", "updated_at": "2026-04-18T14:23:46Z"}, {"id": 132430, "name": "Задача на теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке приведена зависимость температуры t однородного твёрдого тела массой 5 кг от времени t в процессе нагревания. Чему\nравна удельная теплоёмкость вещества этого тела? Подводимую к телу тепловую мощность можно считать постоянной и равной 520\nВт.<br/>Ответ дайте в <img alt=\"Дж/(кг⋅К )  \" class=\"math\" src=\"index-08be40cbda52ab6f69b131ece246e64e.svg\"/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"132430.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты, подводимое телу при его нагревании, равно <img alt=\"Q = cm Δt  \" class=\"math\" src=\"index-85a042d33336f3bde6212113137326f9.svg\"/>. Тепловая мощность равна <img alt=\"    Q-\nP = t  \" class=\"math\" src=\"index-9a1d54882662be4d4a889b7865e6c515.svg\"/>. По графику\nвидно, что нагревание тела на 40 К происходило в течение 50 с.Тогда удельная теплоемкость данного вещества\nравна:\n</p> <div class=\"math-display\">\n<img alt=\"c = -Pt-= 520⋅50 = 130 Дж/(кг⋅К )\n    mΔt    5⋅40\n\" class=\"math-display\" src=\"index-034c7daf9f9752dbfd5355d324c7187b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-08be40cbda52ab6f69b131ece246e64e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274431/index-08be40cbda52ab6f69b131ece246e64e.svg", "132430.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274431/132430.png", "index-85a042d33336f3bde6212113137326f9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274432/index-85a042d33336f3bde6212113137326f9.svg", "index-9a1d54882662be4d4a889b7865e6c515.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274432/index-9a1d54882662be4d4a889b7865e6c515.svg", "index-034c7daf9f9752dbfd5355d324c7187b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274432/index-034c7daf9f9752dbfd5355d324c7187b.svg"}, "tags": ["Статград 07.03.2023 Физика 2"], "sources": ["CтатГрад 07.03.2023 Физика 2"], "created_at": "2025-07-27T17:22:03Z", "updated_at": "2026-04-18T14:23:57Z"}, {"id": 132431, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"T − V  \" class=\"math\" src=\"index-a9178109f59b1ba77ac7aa90102d2f2f.svg\"/>-диаграмме показан процесс изменения состояния идеального одноатомного газа. Газ отдал в этом процессе количество\nтеплоты 120 кДж. Масса газа не менялась. Определите работу, совершённую внешними силами над газом в этом процессе, если <img alt=\"     V1  \" class=\"math\" src=\"index-fca8535c5c1f8fe5351337ef49bc0464.svg\"/>\n= 8 л, <img alt=\"V2  \" class=\"math\" src=\"index-900f4371fca04a31fba013098a45bc9b.svg\"/> = 20 л, <img alt=\"T0  \" class=\"math\" src=\"index-87173fe73563190bfce357798b60f1c6.svg\"/> = 300 К.<br/>Ответ дайте в кДж\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"132431_1.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Так как процесс изотермический, то внутренняя энергия газа не изменялась <img alt=\"ΔU  =0  \" class=\"math\" src=\"index-20a51a997762da8fcccbfa49ac5da14f.svg\"/>. Из первого закона термодинамики\nследует, что <img alt=\"Q =A + ΔU  \" class=\"math\" src=\"index-85fe98ef6f2d0d2d2d5be77b08699477.svg\"/>, где <img alt=\"Q = −120 кДж  \" class=\"math\" src=\"index-1ecef797cae952273509038747679b0e.svg\"/>. Тогда работа, совершенная внешними силами над газом, равна\n<img alt=\"A ′ =− A =120 кДж  \" class=\"math\" src=\"index-49bf70f6168cbcf8f8396aaa75758920.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a9178109f59b1ba77ac7aa90102d2f2f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274433/index-a9178109f59b1ba77ac7aa90102d2f2f.svg", "index-fca8535c5c1f8fe5351337ef49bc0464.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274433/index-fca8535c5c1f8fe5351337ef49bc0464.svg", "index-900f4371fca04a31fba013098a45bc9b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274433/index-900f4371fca04a31fba013098a45bc9b.svg", "index-87173fe73563190bfce357798b60f1c6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274433/index-87173fe73563190bfce357798b60f1c6.svg", "132431_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274433/132431_1.png", "index-20a51a997762da8fcccbfa49ac5da14f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274434/index-20a51a997762da8fcccbfa49ac5da14f.svg", "index-85fe98ef6f2d0d2d2d5be77b08699477.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274434/index-85fe98ef6f2d0d2d2d5be77b08699477.svg", "index-1ecef797cae952273509038747679b0e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274434/index-1ecef797cae952273509038747679b0e.svg", "index-49bf70f6168cbcf8f8396aaa75758920.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/274434/index-49bf70f6168cbcf8f8396aaa75758920.svg"}, "tags": ["Статград 07.03.2023 Физика 2"], "sources": ["CтатГрад 07.03.2023 Физика 2"], "created_at": "2025-07-27T17:27:21Z", "updated_at": "2026-04-18T14:24:15Z"}, {"id": 132871, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Чему равна работа, совершённая газом в процессе СD (см. рисунок), если он получил в этом процессе количество теплоты 40\nкДж?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"132871_1.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Участок <img alt=\"CD  \" class=\"math\" src=\"index-5486db40d875d1cba2b1037606795afc.svg\"/> соответствует изохорному процессу, при котором газ работу не совершает.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"132871_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275642/132871_1.png", "index-5486db40d875d1cba2b1037606795afc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275643/index-5486db40d875d1cba2b1037606795afc.svg"}, "tags": ["Статград 20.04.2023 Физика 1"], "sources": ["CтатГрад 20.04.2023 Физика 1"], "created_at": "2025-07-30T07:40:24Z", "updated_at": "2026-05-09T13:16:13Z"}, {"id": 132872, "name": "КПД. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">За один цикл своей работы в тепловом двигателе газ отдал холодильнику количество теплоты, равное 30 кДж. Какую работу\nсовершает этот двигатель за 3 цикла, если его КПД равен <img alt=\"40%  \" class=\"math\" src=\"index-c37952616b61073fe1633b94426ddee9.svg\"/>?<br/>Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Из формулы для КПД теплового двигателя <img alt=\"   -A-\nη = Q1  \" class=\"math\" src=\"index-06c0efde9e88b8564d61681b585ca3c3.svg\"/> и формулы <img alt=\"A = Q1− Q2  \" class=\"math\" src=\"index-e2378f12eb4dc0a7d57b085f224a7311.svg\"/> выразим работу газа за один цикл:\n</p> <div class=\"math-display\">\n<img alt=\"     ηQ2   0,4⋅30\nA = 1-− η = 1−-0,4 = 20 кДж\n\" class=\"math-display\" src=\"index-3fe989d707a57d7422fee131f6978330.svg\"/></div>\n<p class=\"indent\">   Тогда за 3 цикла двигатель совершит работу 60 кДж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c37952616b61073fe1633b94426ddee9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275644/index-c37952616b61073fe1633b94426ddee9.svg", "index-06c0efde9e88b8564d61681b585ca3c3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275645/index-06c0efde9e88b8564d61681b585ca3c3.svg", "index-e2378f12eb4dc0a7d57b085f224a7311.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275645/index-e2378f12eb4dc0a7d57b085f224a7311.svg", "index-3fe989d707a57d7422fee131f6978330.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/275645/index-3fe989d707a57d7422fee131f6978330.svg"}, "tags": ["Статград 20.04.2023 Физика 1"], "sources": ["CтатГрад 20.04.2023 Физика 1"], "created_at": "2025-07-30T07:43:22Z", "updated_at": "2026-04-18T14:24:44Z"}, {"id": 133162, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В процессе <img alt=\"BC  \" class=\"math\" src=\"index-3d803dc19c05c5f23a9d5526437c7956.svg\"/> (см. рисунок) идеальный одноатомный газ совершил работу 60 кДж. Чему равно изменение его внутренней энергии\nв этом процессе?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"132871_1.png\" width=\"315\"/></p></div>\n<p class=\"indent\">   Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Уравнение Менделеева-Клайперона\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-e883d248326a194051db5cec315ad015.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-3e9467bb3220942265bf8129ad5f90ac.svg\"/> - давление газа;<br/><img alt=\"V  \" class=\"math\" src=\"index-9406fad6521216f797b9601af54a8f6a.svg\"/> - объём газа;<br/><img alt=\"ν  \" class=\"math\" src=\"index-52f31f43633adfa6a90f67145351dbfe.svg\"/> - количества вещества;<br/><img alt=\"T  \" class=\"math\" src=\"index-ebdd6a947c32b890718a498328d21675.svg\"/> - температура газа.<br/>Процесс <img alt=\"BC  \" class=\"math\" src=\"index-c29cd8e684cb82a7e0b5d021838f4714.svg\"/> является изобарным. Тогда для одноатомного идеального газа изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 3νRΔT  = 3pΔV = 3A = 1,5⋅60= 90 кД ж\n     2        2      2\n\" class=\"math-display\" src=\"index-d130f328bd9003669303970fba328359.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3d803dc19c05c5f23a9d5526437c7956.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276297/index-3d803dc19c05c5f23a9d5526437c7956.svg", "132871_1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276297/132871_1.png", "index-e883d248326a194051db5cec315ad015.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-e883d248326a194051db5cec315ad015.svg", "index-3e9467bb3220942265bf8129ad5f90ac.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-3e9467bb3220942265bf8129ad5f90ac.svg", "index-9406fad6521216f797b9601af54a8f6a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-9406fad6521216f797b9601af54a8f6a.svg", "index-52f31f43633adfa6a90f67145351dbfe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-52f31f43633adfa6a90f67145351dbfe.svg", "index-ebdd6a947c32b890718a498328d21675.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-ebdd6a947c32b890718a498328d21675.svg", "index-c29cd8e684cb82a7e0b5d021838f4714.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-c29cd8e684cb82a7e0b5d021838f4714.svg", "index-d130f328bd9003669303970fba328359.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276298/index-d130f328bd9003669303970fba328359.svg"}, "tags": ["Статград 20.04.2023 Физика 2"], "sources": ["CтатГрад 20.04.2023 Физика 2"], "created_at": "2025-07-31T13:58:28Z", "updated_at": "2026-05-09T13:16:43Z"}, {"id": 133164, "name": "КПД. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">За 4 цикла своей работы тепловой двигатель совершил работу 120 кДж. Какое количество теплоты газ отдаёт холодильнику за один\nцикл, если КПД двигателя равен 60<img alt=\"%  \" class=\"math\" src=\"index-5849bc98c7a14864a8b6e858520a2e35.svg\"/>?<br/>Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">За один цикл газ совершил работу 30 кДж. Из формулы для КПД теплового двигателя <img alt=\"    A--\nη = Q1  \" class=\"math\" src=\"index-95860171a5f05b4171a695e840a32b8b.svg\"/> и формулы <img alt=\"A = Q1 − Q2  \" class=\"math\" src=\"index-fd88988eddadab63a32302e2c3b14121.svg\"/> выразим\nколичество теплоты, отданное газом холодильнику за один цикл:\n</p> <div class=\"math-display\">\n<img alt=\"     (1− η)A    (1 − 0,6)⋅30\nQ2 = ---η--- = ---0,6----= 20 кДж\n\" class=\"math-display\" src=\"index-32684691a20bfc7e642375645e36bb5b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-5849bc98c7a14864a8b6e858520a2e35.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276301/index-5849bc98c7a14864a8b6e858520a2e35.svg", "index-95860171a5f05b4171a695e840a32b8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276302/index-95860171a5f05b4171a695e840a32b8b.svg", "index-fd88988eddadab63a32302e2c3b14121.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276302/index-fd88988eddadab63a32302e2c3b14121.svg", "index-32684691a20bfc7e642375645e36bb5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/276302/index-32684691a20bfc7e642375645e36bb5b.svg"}, "tags": ["Статград 20.04.2023 Физика 2"], "sources": ["CтатГрад 20.04.2023 Физика 2"], "created_at": "2025-07-31T14:05:20Z", "updated_at": "2026-04-18T14:25:40Z"}, {"id": 134180, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Каким должно быть отношение масс чугунного и алюминиевого тел, чтобы при получении одного и того же количества теплоты они\nнагрелись на одно и то же число градусов? Ответ округлите до десятых долей.\n</p>", "solution_html": "<p class=\"noindent\">При нагреве любое тело поулчает количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm Δt\n\" class=\"math-display\" src=\"index-15e3e53ee8a79ad05753bace826528a9.svg\"/></div>\n<p class=\"indent\">   Тела получили одинаковое количество теплоты и нагрелись на одну и ту же температуру:\n</p> <div class=\"math-display\">\n<img alt=\"cчm ч = cаmа\n\" class=\"math-display\" src=\"index-0188c95b114cd3f6f2cc2b55061dc0be.svg\"/></div>\n<p class=\"indent\">   Выразим нужное нам отношение:\n</p> <div class=\"math-display\">\n<img alt=\"m-ч  -cа   900\nm а = cч = 500 = 1,8\n\" class=\"math-display\" src=\"index-a9ab50a78dd682f7c9d1ecdf870a4864.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-15e3e53ee8a79ad05753bace826528a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280690/index-15e3e53ee8a79ad05753bace826528a9.svg", "index-0188c95b114cd3f6f2cc2b55061dc0be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280690/index-0188c95b114cd3f6f2cc2b55061dc0be.svg", "index-a9ab50a78dd682f7c9d1ecdf870a4864.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280690/index-a9ab50a78dd682f7c9d1ecdf870a4864.svg"}, "tags": ["Статград 09.12.2022 Физика 1"], "sources": ["CтатГрад 09.12.2022 Физика 1"], "created_at": "2025-08-06T12:58:49Z", "updated_at": "2026-04-18T14:26:14Z"}, {"id": 135332, "name": "Удельная теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Твёрдый образец массой 0,4 кг поместили в калориметр и стали нагревать. На графике представлена зависимость температуры <img alt=\"     T  \" class=\"math\" src=\"index-0809d33cda80945dc105eff2a44945c2.svg\"/>\nэтого образца от времени <img alt=\"t  \" class=\"math\" src=\"index-f68968da98e5a2338e1b8e01c3105bc3.svg\"/> нагревания. Мощность нагревателя равна 1,5 кДж/мин. Чему равна удельная теплоёмкость вещества,\nиз которого сделан образец? Потерями количества теплоты при нагревании и теплоёмкостью калориметра можно пренебречь. Ответ\nдайте в <img alt=\"Дж/ (кг⋅К )  \" class=\"math\" src=\"index-5120e3ee1fd56e0ddb6c9f14b0bca030.svg\"/>.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"135332.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Из графика следует, что за 4 минуты температура увеличилась на 60 К. Количество теплоты, полученное от нагревателя, равно\n<img alt=\"Q = Pt  \" class=\"math\" src=\"index-206b00ed7bb007fbea8fecfe3f8f012a.svg\"/>. Количество теплоты, необходимое для нагревания стали равно <img alt=\"Q = cmΔT  \" class=\"math\" src=\"index-1c9b7722feabb814e6eb74b44b24b012.svg\"/>. Откуда\n</p> <div class=\"math-display\">\n<img alt=\"     Pt    1500 ⋅4\nc=  mΔT--= 0,4-⋅60-= 250 Дж/ (кг ⋅К)\n\" class=\"math-display\" src=\"index-c1e0c45e81878d4dc4d3cf713657bb9c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-0809d33cda80945dc105eff2a44945c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282218/index-0809d33cda80945dc105eff2a44945c2.svg", "index-f68968da98e5a2338e1b8e01c3105bc3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282218/index-f68968da98e5a2338e1b8e01c3105bc3.svg", "index-5120e3ee1fd56e0ddb6c9f14b0bca030.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282218/index-5120e3ee1fd56e0ddb6c9f14b0bca030.svg", "135332.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282218/135332.png", "index-206b00ed7bb00
