инамика", "Циклы. КПД теплового двигателя", "Демидова 2019"], "sources": ["ЕГЭ 2024, основная волна"], "created_at": "2025-01-08T07:44:28Z", "updated_at": "2026-07-01T14:30:28Z"}, {"id": 177367, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловая машина с КПД 40% за цикл работы получает от нагревателя количество теплоты, равное 200 Дж. Какую работу машина\nсовершает за цикл. Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">КПД цикла можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    A\nη = Q-н\n\" class=\"math-display\" src=\"index-67c2873c855a11cc4f3e5ce5088c31c1.svg\"/></div>\n<p class=\"indent\">   Тогда работа газа за цикл равна:\n</p> <div class=\"math-display\">\n<img alt=\"A= ηQ н = 0,4 ⋅200 Дж = 80 Д ж\n\" class=\"math-display\" src=\"index-cf43ca5ef95e8fa1a75285d7997c8ab7.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-67c2873c855a11cc4f3e5ce5088c31c1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386013/index-67c2873c855a11cc4f3e5ce5088c31c1.svg", "index-cf43ca5ef95e8fa1a75285d7997c8ab7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/386013/index-cf43ca5ef95e8fa1a75285d7997c8ab7.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ФИПИ"], "created_at": "2026-04-10T10:42:59Z", "updated_at": "2026-07-01T14:34:07Z"}, {"id": 195171, "name": "Копия #103091 - Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">За один цикл работы тепловая машина получает от нагревателя 64 Дж теплоты и совершает работу 16 Дж. Определите КПД\nтепловой машины. Ответ дайте в %.\n</p>", "solution_html": "<p class=\"noindent\">КПД цикла можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    A\nη = Q-н\n\" class=\"math-display\" src=\"index-b6a7dde09b77856c972bf73652e18b4a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-f5a659244817594737d65b5d3a22af8a.svg\"/> – работа за цикл, <img alt=\"Qн  \" class=\"math\" src=\"index-1412e3469a58ca7570841510ff0ce004.svg\"/> – количество теплоты, полученное от нагревателя.\n</p><p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"η = 16= 0,25= 25%\n    64\n\" class=\"math-display\" src=\"index-bd200b265ecef2ee7fe41769e7ab0633.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b6a7dde09b77856c972bf73652e18b4a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432458/index-b6a7dde09b77856c972bf73652e18b4a.svg", "index-f5a659244817594737d65b5d3a22af8a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432458/index-f5a659244817594737d65b5d3a22af8a.svg", "index-1412e3469a58ca7570841510ff0ce004.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432458/index-1412e3469a58ca7570841510ff0ce004.svg", "index-bd200b265ecef2ee7fe41769e7ab0633.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/432458/index-bd200b265ecef2ee7fe41769e7ab0633.svg"}, "tags": [], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-15T11:55:15Z", "updated_at": "2026-08-15T11:58:14Z"}, {"id": 39103, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ получил количество теплоты, равное 300 Дж, при этом внутренняя энергия газа уменьшилась на 100\nДж. Масса газа не менялась. Какую работу совершил газ в этом процессе? Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-550b2f4f58bf195c3fed20a9b1f193a7.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-dd732c76a17d6cffc3edad87c952bb76.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-4da3f23998bfd509c163f184d031b3f4.svg\"/> — работа газа. Выразим работу\nгаза:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU\n\" class=\"math-display\" src=\"index-08a0bfcffaf6aae6cf4069c3e717aae5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"A = 300 Д ж− (−100 Д ж) =400 Дж\n\" class=\"math-display\" src=\"index-322d65162f11b909529a122ea14fbbfc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-550b2f4f58bf195c3fed20a9b1f193a7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-550b2f4f58bf195c3fed20a9b1f193a7.svg", "index-dd732c76a17d6cffc3edad87c952bb76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-dd732c76a17d6cffc3edad87c952bb76.svg", "index-4da3f23998bfd509c163f184d031b3f4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-4da3f23998bfd509c163f184d031b3f4.svg", "index-08a0bfcffaf6aae6cf4069c3e717aae5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-08a0bfcffaf6aae6cf4069c3e717aae5.svg", "index-322d65162f11b909529a122ea14fbbfc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75378/index-322d65162f11b909529a122ea14fbbfc.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "МКТ. Термодинамика", "Первый закон термодинамики", "2023"], "sources": ["Демоверсия 2023"], "created_at": "2022-10-15T10:20:52Z", "updated_at": "2026-07-01T14:33:27Z"}, {"id": 96667, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Находясь в цилиндре двигателя, газ получил от нагревателя количество теплоты, равное 10 кДж. При этом он\nрасширился, совершив работу 15 кДж. На сколько при этом уменьшилась внутренняя энергия газа? Ответ дайте в\nкДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики можно записать равенство\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   Найдем изменение энергии:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  = Q− A = 10− 15= −5 кДж\n\" class=\"math-display\" src=\"index-acb307ac98076ee8a7a7269f4a21f22f.svg\"/></div>\n<p class=\"indent\">   Знак минус говорит о том, что внутренняя энергия уменьшилась. В ответе записываем по модулю, так как в вопросе задачи уже\nучли этот минус - &#34;на сколько уменьшилась&#34;.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206821/index-bd94ff284644b2773b552a8c5529b561.svg", "index-acb307ac98076ee8a7a7269f4a21f22f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206821/index-acb307ac98076ee8a7a7269f4a21f22f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-09-17T17:32:54Z", "updated_at": "2026-07-01T14:33:48Z"}, {"id": 96713, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Находясь в цилиндре двигателя, газ получил от нагревателя количество теплоты, равное 30 кДж, при этом его внутренняя\nэнергия увеличилась на 20 кДж. Какую работу при этом совершил газ? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики можно записать равенство\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   Найдем работу:\n</p> <div class=\"math-display\">\n<img alt=\"A= Q − ΔU = 30− 20= 10 кД ж\n\" class=\"math-display\" src=\"index-b83f9cd6d4828fd75323ee6dc01e7516.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206835/index-bd94ff284644b2773b552a8c5529b561.svg", "index-b83f9cd6d4828fd75323ee6dc01e7516.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206835/index-b83f9cd6d4828fd75323ee6dc01e7516.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-09-18T17:42:48Z", "updated_at": "2026-07-01T14:31:29Z"}, {"id": 96819, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ в сосуде сжали, совершив работу, равную 30 кДж. Внутренняя энергия газа при этом увеличилась на 25 кДж. Какое\nколичество теплоты отдал газ окружающей среде? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-c9351e888e6723f3c4066e42a570d2dc.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> — работа, совершенная газом.\n</p> <div class=\"math-display\">\n<img alt=\"A= − Aвн,\n\" class=\"math-display\" src=\"index-8d0fe274df5c67f6c476ace4a79a7c72.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Aвн  \" class=\"math\" src=\"index-20b9ace39e4e66f540e6ac8d664fd1a0.svg\"/> — работа внешних сил над газом. <br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU − Aвн = 25 кД ж− 30 кД ж = −5 кД ж\n\" class=\"math-display\" src=\"index-d94420fed6cecf6e73a8eb929bc9e9cf.svg\"/></div>\n<p class=\"indent\">   Значит, газ отдал окружающей среде количество теплоты, равное 5 кДж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-c9351e888e6723f3c4066e42a570d2dc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-c9351e888e6723f3c4066e42a570d2dc.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-8d0fe274df5c67f6c476ace4a79a7c72.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-8d0fe274df5c67f6c476ace4a79a7c72.svg", "index-20b9ace39e4e66f540e6ac8d664fd1a0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-20b9ace39e4e66f540e6ac8d664fd1a0.svg", "index-d94420fed6cecf6e73a8eb929bc9e9cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206620/index-d94420fed6cecf6e73a8eb929bc9e9cf.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-09-20T18:10:49Z", "updated_at": "2026-07-01T14:39:24Z"}, {"id": 121345, "name": "Первое начало термодинамики", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В некотором процессе идеальный газ получил количество теплоты 50 Дж. При этом внешние силы совершили работу 20 Дж. На\nсколько увеличилась внутренняя энергия газа в этом процессе? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Применим первый закон термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = A+ ΔU\n\" class=\"math-display\" src=\"index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg\"/></div>\n<p class=\"indent\">   Выразим искомую работу:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = Q − A = 50− (−20)= 70 Д ж\n\" class=\"math-display\" src=\"index-f165f327864754bada0c2bbed18c4cf5.svg\"/></div>\n<p class=\"indent\">   Мы учитываем, что работа газа отрицательна, так как работа внешних сил положительна.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249363/index-bdab2eee78ff4a5e8c293151dbcaf7dd.svg", "index-f165f327864754bada0c2bbed18c4cf5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/249363/index-f165f327864754bada0c2bbed18c4cf5.svg"}, "tags": ["СтатГрад 11.02.2022 Физика 2"], "sources": ["СтатГрад 11.02.2022 Физика 2"], "created_at": "2025-04-30T10:53:04Z", "updated_at": "2026-07-01T14:43:34Z"}, {"id": 134166, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Какое количество теплоты было передано газу, если его внутренняя энергия увеличилась на 500 Дж, а внешние силы совершили над\nгазом работу, равную 150 Дж? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Применим первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"                   ′\nQ = ΔU + A = ΔU − A = 500− 150 = 350 Дж\n\" class=\"math-display\" src=\"index-c47c9290b5ae8b792746c5f1d795d6a8.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c47c9290b5ae8b792746c5f1d795d6a8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/280691/index-c47c9290b5ae8b792746c5f1d795d6a8.svg"}, "tags": ["Статград 09.12.2022 Физика 1"], "sources": ["CтатГрад 09.12.2022 Физика 1"], "created_at": "2025-08-06T10:17:32Z", "updated_at": "2026-07-01T14:44:04Z"}, {"id": 136854, "name": "СтатГрад ЕГЭ 18.10.2023 Термодинамика 1 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Внешние силы совершили над газом работу 400 Дж, а внутренняя энергия газа увеличилась при этом на 700 Дж. Какое количество\nтеплоты газ получил от окружающей среды? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Над газом совершили работу <img alt=\"  ′\nA \" class=\"math\" src=\"index-e13859ebda479427d4895b8874140fb7.svg\"/> = 400 Дж. Запишем первое начало термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A,  (1)\n\" class=\"math-display\" src=\"index-b09fed7ef295cd3a798f79b630729ba2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-8b726a22501f25fab4806a51515eed30.svg\"/> – количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-32704a2f0bb9445b1509acbd38d2243b.svg\"/> – работа газа. <br/>Так как над газом совершили работу, то <img alt=\"A = −A′ \" class=\"math\" src=\"index-46db1f4148d9d7f88388c90b46437409.svg\"/>, и (1) преобразуется к виду\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU − A′ = 700− 400= 300 Д ж.\n\" class=\"math-display\" src=\"index-1f309fe165fb729b95cf09c7f52ed1b0.svg\"/></div>\n<p class=\"indent\">   Таким образом, газ получил от окружающей среды 300 Дж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e13859ebda479427d4895b8874140fb7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-e13859ebda479427d4895b8874140fb7.svg", "index-b09fed7ef295cd3a798f79b630729ba2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-b09fed7ef295cd3a798f79b630729ba2.svg", "index-8b726a22501f25fab4806a51515eed30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-8b726a22501f25fab4806a51515eed30.svg", "index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg", "index-32704a2f0bb9445b1509acbd38d2243b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-32704a2f0bb9445b1509acbd38d2243b.svg", "index-46db1f4148d9d7f88388c90b46437409.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-46db1f4148d9d7f88388c90b46437409.svg", "index-1f309fe165fb729b95cf09c7f52ed1b0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286352/index-1f309fe165fb729b95cf09c7f52ed1b0.svg"}, "tags": ["СтатГрад ЕГЭ 18.10.2023 1 вариант"], "sources": ["СтатГрад ЕГЭ 18.10.2023 1 вариант"], "created_at": "2025-08-22T17:20:25Z", "updated_at": "2026-07-01T14:44:25Z"}, {"id": 136952, "name": "СтатГрад ЕГЭ 18.10.2023 Термодинамика 2 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Внешние силы совершили над газом работу 200 Дж, при этом газ получил от окружающей среды количество теплоты 600 Дж. На\nсколько увеличилась внутренняя энергия газа? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Над газом совершили работу <img alt=\"  ′\nA \" class=\"math\" src=\"index-e13859ebda479427d4895b8874140fb7.svg\"/> = 400 Дж. Запишем первое начало термодинамики\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A,  (1)\n\" class=\"math-display\" src=\"index-b09fed7ef295cd3a798f79b630729ba2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-8b726a22501f25fab4806a51515eed30.svg\"/> – количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-32704a2f0bb9445b1509acbd38d2243b.svg\"/> – работа газа. <br/>Выразим <img alt=\"ΔU  \" class=\"math\" src=\"index-da0bd6004c9ed23d855308f2a805934a.svg\"/> из (1)\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = Q − A. (2)\n\" class=\"math-display\" src=\"index-a45d341b9af8ba125f3a2c8cbfe14be3.svg\"/></div>\n<p class=\"indent\">   Так как над газом совершили работу, то <img alt=\"A= − A′ \" class=\"math\" src=\"index-329b3a4c3312d31a0864b86f0d46d56e.svg\"/>, и (2) преобразуется к виду\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  =Q + A′ = 600+ 200= 800 Д ж.\n\" class=\"math-display\" src=\"index-f78aae0160ac00a713867f993100a8a2.svg\"/></div>\n<p class=\"indent\">   Таким образом, внутренняя энергия газа увеличилась на 800 Дж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e13859ebda479427d4895b8874140fb7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-e13859ebda479427d4895b8874140fb7.svg", "index-b09fed7ef295cd3a798f79b630729ba2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-b09fed7ef295cd3a798f79b630729ba2.svg", "index-8b726a22501f25fab4806a51515eed30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-8b726a22501f25fab4806a51515eed30.svg", "index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-ea6ac9ff9a25037a708d4a2a8eb8de56.svg", "index-32704a2f0bb9445b1509acbd38d2243b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-32704a2f0bb9445b1509acbd38d2243b.svg", "index-da0bd6004c9ed23d855308f2a805934a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-da0bd6004c9ed23d855308f2a805934a.svg", "index-a45d341b9af8ba125f3a2c8cbfe14be3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-a45d341b9af8ba125f3a2c8cbfe14be3.svg", "index-329b3a4c3312d31a0864b86f0d46d56e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-329b3a4c3312d31a0864b86f0d46d56e.svg", "index-f78aae0160ac00a713867f993100a8a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286579/index-f78aae0160ac00a713867f993100a8a2.svg"}, "tags": ["СтатГрад ЕГЭ 18.10.2023 2 вариант"], "sources": ["СтатГрад ЕГЭ 18.10.2023 2 вариант"], "created_at": "2025-08-23T07:30:45Z", "updated_at": "2026-07-01T14:44:46Z"}, {"id": 143769, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Какое количество теплоты было передано газу, если его внутренняя энергия уменьшилась на 450 Дж, а газ совершил работу, равную\n600 Дж? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Применим первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q =ΔU  +A = 450+ 600= 150 Д ж\n\" class=\"math-display\" src=\"index-47e92d0e23c733d241c4a4e71c51a652.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-47e92d0e23c733d241c4a4e71c51a652.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302523/index-47e92d0e23c733d241c4a4e71c51a652.svg"}, "tags": ["Статград 09.12.2022 Физика 2"], "sources": ["CтатГрад 09.12.2022 Физика 2"], "created_at": "2025-09-27T18:07:27Z", "updated_at": "2026-07-01T14:46:26Z"}, {"id": 155609, "name": "Статград 2.12 Вар 1 №8", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ получил количество теплоты 4,5 кДж, при этом внутренняя энергия газа уменьшилась на 3,2 кДж. Какую работу совершил при\nэтом газ? Ответ дайте в кДж.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" class=\"graphics\" src=\"index-642d67d10bb328dd2dec5f60b98cd25e.svg\"/><!--  tex4ht:graphics  \nname=\"in0x.svg\" src=\"...\"  \n  --></p></div>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ΔU  \" class=\"math\" src=\"index-69fafe1fcb881af5c88a16b70c532e7d.svg\"/> - изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg\"/> - работа, совершённая газом.<br/>Так как внутренняя энергия газа уменьшилась, то:\n</p> <div class=\"math-display\">\n<img alt=\"A = −ΔU + Q = −(−3,2 ⋅103 Дж )+4,5⋅103 Д ж= 7,7⋅103 Дж = 7,7 кДж\n\" class=\"math-display\" src=\"index-1d5010a862f0b67f6323d40c6ca107a2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-642d67d10bb328dd2dec5f60b98cd25e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330823/index-642d67d10bb328dd2dec5f60b98cd25e.svg", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330856/index-bd94ff284644b2773b552a8c5529b561.svg", "index-69fafe1fcb881af5c88a16b70c532e7d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330856/index-69fafe1fcb881af5c88a16b70c532e7d.svg", "index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330856/index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg", "index-1d5010a862f0b67f6323d40c6ca107a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/330856/index-1d5010a862f0b67f6323d40c6ca107a2.svg"}, "tags": ["Уровень ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики"], "sources": ["СтатГрад 02.12.2025"], "created_at": "2025-12-02T06:24:06Z", "updated_at": "2026-07-01T14:46:53Z"}, {"id": 155750, "name": "Статград 2.12 Вар 2 №8", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ совершил работу 15 кДж и получил количество теплоты 6,2 кДж. На сколько уменьшилась при этом внутренняя энергия газа?\nОтвет дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ΔU  \" class=\"math\" src=\"index-69fafe1fcb881af5c88a16b70c532e7d.svg\"/> - изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg\"/> - работа, совершённая газом.<br/>Так как газ совершил работу, то:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = Q − A = 6,2 ⋅103 Дж − 15 ⋅103 Дж = −8,8⋅103 Дж = − 8,8 кД ж\n\" class=\"math-display\" src=\"index-372d3d31968b7901aa4d83e48bf53c51.svg\"/></div>\n<p class=\"indent\">   Значит внутренняя энергия газа уменьшилась на <img alt=\"8,8 кД ж  \" class=\"math\" src=\"index-1c637a30a79dede98424bafb2ec00d41.svg\"/>.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331105/index-bd94ff284644b2773b552a8c5529b561.svg", "index-69fafe1fcb881af5c88a16b70c532e7d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331105/index-69fafe1fcb881af5c88a16b70c532e7d.svg", "index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331105/index-6a15dd3f8d0f75ef2b042a5dcfbb9a31.svg", "index-372d3d31968b7901aa4d83e48bf53c51.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331105/index-372d3d31968b7901aa4d83e48bf53c51.svg", "index-1c637a30a79dede98424bafb2ec00d41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/331105/index-1c637a30a79dede98424bafb2ec00d41.svg"}, "tags": ["Уровень ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики"], "sources": ["СтатГрад 02.12.2025"], "created_at": "2025-12-02T18:32:43Z", "updated_at": "2026-07-01T14:47:08Z"}, {"id": 176004, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ в сосуде сжали, совершив работу, равную 500 Дж. Внутренняя энергия газа при этом увеличилась на 150 Дж. Какое количество\nтеплоты отдал газ окружающей среде? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Запишем первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-3adab50db8ec36a459e8b490a7649831.svg\"/> — количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-ad89f2bb6ad700f0eeaa21aef6b5cb86.svg\"/> — изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-4db84cfc40a000d2edd7781ef57fcde3.svg\"/> — работа, совершённая\nгазом.\n</p><p class=\"indent\">   По условию газ сжали, совершив над ним работу <img alt=\"Aвн = 500  \" class=\"math\" src=\"index-c2f1464f709419949d0c5c2060d10fb6.svg\"/> Дж. Следовательно, работа газа <img alt=\"A= − Aвн = −500  \" class=\"math\" src=\"index-de270ec748e6318f66f8524c8074860b.svg\"/> Дж.\nВнутренняя энергия увеличилась на <img alt=\"ΔU  = 150  \" class=\"math\" src=\"index-4066280057fc3b547c9c2bed663e20dd.svg\"/> Дж.\n</p><p class=\"indent\">   Тогда количество теплоты, полученное газом:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 150 +(−500)= −350 Дж.\n\" class=\"math-display\" src=\"index-edb84ba29520f4651bff50b3a189fee5.svg\"/></div>\n<p class=\"indent\">   Отрицательное значение количества теплоты означает, что газ отдал окружающей среде <img alt=\"350  \" class=\"math\" src=\"index-f312aac9f00c7f8fa182a12328812f50.svg\"/> Дж теплоты.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382180/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-3adab50db8ec36a459e8b490a7649831.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/382180/index-3adab50db8ec36a459e8b490a7649831.svg", "index-ad89f2bb6ad700f0eeaa21aef6b5cb86.svg": "https://3.shkolkovo.online/ap 9f2bb6ad700f0eeaa21aef6b5cb86.svg\"/> — изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-4db84cfc40a000d2edd7781ef57fcde3.svg\"/> — работа, совершённая\nгазом.\n</p><p class=\"indent\">   По условию газ сжали, совершив над ним работу <img alt=\"Aвн = 400  \" class=\"math\" src=\"index-51c26b2973a095a7c6a03f40e7c25654.svg\"/> Дж. Следовательно, работа газа <img alt=\"A= − Aвн = −400  \" class=\"math\" src=\"index-26c836099a07888e988e8bdf06ef565c.svg\"/> Дж.\nВнутренняя энергия увеличилась на <img alt=\"ΔU  = 150  \" class=\"math\" src=\"index-4066280057fc3b547c9c2bed663e20dd.svg\"/> Дж.\n</p><p class=\"indent\">   Тогда количество теплоты, полученное газом:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 150 +(−400)= −250 Дж.\n\" class=\"math-display\" src=\"index-851e9931aad3f7998e11dbb7d9b669e2.svg\"/></div>\n<p class=\"indent\">   Отрицательное значение количества теплоты означает, что газ отдал окружающей среде <img alt=\"250  \" class=\"math\" src=\"index-e3260d3347ddbca7956e683ea6860cad.svg\"/> Дж теплоты.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-3adab50db8ec36a459e8b490a7649831.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-3adab50db8ec36a459e8b490a7649831.svg", "index-ad89f2bb6ad700f0eeaa21aef6b5cb86.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-ad89f2bb6ad700f0eeaa21aef6b5cb86.svg", "index-4db84cfc40a000d2edd7781ef57fcde3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-4db84cfc40a000d2edd7781ef57fcde3.svg", "index-51c26b2973a095a7c6a03f40e7c25654.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-51c26b2973a095a7c6a03f40e7c25654.svg", "index-26c836099a07888e988e8bdf06ef565c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-26c836099a07888e988e8bdf06ef565c.svg", "index-4066280057fc3b547c9c2bed663e20dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-4066280057fc3b547c9c2bed663e20dd.svg", "index-851e9931aad3f7998e11dbb7d9b669e2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-851e9931aad3f7998e11dbb7d9b669e2.svg", "index-e3260d3347ddbca7956e683ea6860cad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/412102/index-e3260d3347ddbca7956e683ea6860cad.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2026-06-25T14:12:13Z", "updated_at": "2026-07-17T13:04:05Z"}, {"id": 11258, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Для плавления куска льда при температуре его плавления требуется количество теплоты, равное 3 кДж. Этот кусок льда внесли в\nтёплое помещение. Зависимость температуры льда от времени представлена на рисунке. Определите среднюю тепловую мощность,\nподводимую к куску льда в процессе плавления. Ответ дайте в Вт.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"11258.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты равно:\n</p> <div class=\"math-display\">\n<img alt=\"Q =P t,\n\" class=\"math-display\" src=\"index-07a2c589a87b35a3f8e7594abfc29f49.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"t  \" class=\"math\" src=\"index-d3a8f0fbcec17ee10d9d08c2180ac320.svg\"/> – температура плавления.<br/>Лед плавился 10 минут или 600 с, следовательно, средняя мощность равна\n</p> <div class=\"math-display\">\n<img alt=\"    Q   3000 Д ж\nP = -t =--600 с = 5 В т\n\" class=\"math-display\" src=\"index-4fe2031f65ba34302140a693e61a1935.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"11258.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23386/11258.png", "index-07a2c589a87b35a3f8e7594abfc29f49.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23387/index-07a2c589a87b35a3f8e7594abfc29f49.svg", "index-d3a8f0fbcec17ee10d9d08c2180ac320.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23387/index-d3a8f0fbcec17ee10d9d08c2180ac320.svg", "index-4fe2031f65ba34302140a693e61a1935.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23387/index-4fe2031f65ba34302140a693e61a1935.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Демоверсия 2018"], "created_at": "2021-11-20T10:47:39Z", "updated_at": "2026-07-03T08:30:31Z"}, {"id": 11234, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Если идеальная тепловая машина за цикл совершает полезную работу 50 Дж и отдает холодильнику 50 Дж, то каков ее КПД? Ответ\nдайте в %.\n</p>", "solution_html": "<p class=\"noindent\">КПД:\n</p> <div class=\"math-display\">\n<img alt=\"     A          50 кД ж\nη = A-+-Qx = 50 кДж-+-50 кД-ж-= 50%\n\" class=\"math-display\" src=\"index-20099ae552b6f44a5435df8bef734f32.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-20099ae552b6f44a5435df8bef734f32.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23339/index-20099ae552b6f44a5435df8bef734f32.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "2019", "Досрочная волна", "Задача с реального ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Досрочная волна 2019"], "created_at": "2021-11-19T17:28:59Z", "updated_at": "2026-04-18T14:02:44Z"}, {"id": 97900, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловая машина с КПД 40% за цикл работы отдаёт холодильнику 60 Дж. Какое количество теплоты за цикл машина\nполучает от нагревателя? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       Qх\nη = 1− Qн-\n\" class=\"math-display\" src=\"index-baa8d817cd059063694041b3593a03a1.svg\"/></div>\n<p class=\"indent\">   Выразим отсюда количество теплоты, которое машина получает от нагревателя за цикл:\n</p> <div class=\"math-display\">\n<img alt=\"Q н =-Qх-\n     1− η\n\" class=\"math-display\" src=\"index-226d628aebd4b62c259a8506b3507704.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     60-Дж-\nQ н = 1− 0,4 = 100 Дж\n\" class=\"math-display\" src=\"index-b1734a644fdca6352e2ccacd6ca5e96f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-baa8d817cd059063694041b3593a03a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206421/index-baa8d817cd059063694041b3593a03a1.svg", "index-226d628aebd4b62c259a8506b3507704.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206421/index-226d628aebd4b62c259a8506b3507704.svg", "index-b1734a644fdca6352e2ccacd6ca5e96f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206421/index-b1734a644fdca6352e2ccacd6ca5e96f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-10-08T17:17:42Z", "updated_at": "2026-05-15T18:13:32Z"}, {"id": 11297, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Зависимость температуры 0,2 кг первоначально газообразного вещества от количества выделенной им теплоты представлена на\nрисунке. Рассматриваемый процесс идет при постоянном давлении. Какова удельная теплота парообразования этого вещества?\nОтвет дайте в кДж/кг. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"11297.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Во время процесса конденсации температура вещества не изменяется. Таким образом процессу конденсации соответствует\nгоризонтальный участок графика. Из рисунка видно, что в процессе конденсации вещество успело выделить:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 8 кДж − 2 кД ж = 6 кДж\n\" class=\"math-display\" src=\"index-00937860e5774d5da7e6a651a1783cfc.svg\"/></div>\n<p class=\"indent\">   Следовательно, удельная теплота парообразования этого вещества равна\n</p> <div class=\"math-display\">\n<img alt=\"   Q   6 кДж\nr = m-=-0,2-кг = 30 кДж/кг\n\" class=\"math-display\" src=\"index-a2b81ba5eb2685bd4a2a320807e63e45.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"11297.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23468/11297.png", "index-00937860e5774d5da7e6a651a1783cfc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23466/index-00937860e5774d5da7e6a651a1783cfc.svg", "index-a2b81ba5eb2685bd4a2a320807e63e45.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23466/index-a2b81ba5eb2685bd4a2a320807e63e45.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Задача с реального ЕГЭ", "2020", "Основная волна", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Основная волна 2020"], "created_at": "2021-11-21T09:41:13Z", "updated_at": "2026-04-21T19:22:40Z"}, {"id": 96187, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловая машина с КПД 20% за цикл работы получает от нагревателя количество теплоты, равное 15 кДж. Какое\nколичество теплоты машина отдаёт за цикл холодильнику? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       Qх\nη = 1− Qн-\n\" class=\"math-display\" src=\"index-baa8d817cd059063694041b3593a03a1.svg\"/></div>\n<p class=\"indent\">   Выразим количество теплоты, которое газ отдал холодильнику за цикл:\n</p> <div class=\"math-display\">\n<img alt=\"Q х = Qн⋅(1− η)\n\" class=\"math-display\" src=\"index-1120f7c87ad2774910e344e86ba60b93.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Q х = 15⋅(1− 0,2)= 12 кДж\n\" class=\"math-display\" src=\"index-cbfb49cb514bfdd5b912417192c73492.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-baa8d817cd059063694041b3593a03a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206022/index-baa8d817cd059063694041b3593a03a1.svg", "index-1120f7c87ad2774910e344e86ba60b93.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206022/index-1120f7c87ad2774910e344e86ba60b93.svg", "index-cbfb49cb514bfdd5b912417192c73492.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206022/index-cbfb49cb514bfdd5b912417192c73492.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-09-08T05:46:38Z", "updated_at": "2026-04-18T14:06:31Z"}, {"id": 11259, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показана зависимость температуры металлической детали массой 2 кг от переданного ей количества теплоты. Чему\nравна удельная теплоёмкость металла? Ответ дайте в Дж/(кг<img alt=\"⋅ \" class=\"math\" src=\"index-350b82080d4003c9385a990040fdfdbe.svg\"/>К)\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"11259.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">За 36 кДж температура заготовки поднялась на 20 К, следовательно, теплоёмкость равна:\n</p> <div class=\"math-display\">\n<img alt=\"                 Q    36000 Д ж\nQ = cmΔT  ⇒ c= m-ΔT-= 2-кг⋅20 К-= 900 Д ж/(кг⋅ К )\n\" class=\"math-display\" src=\"index-1a1706f49357640f0f65d9b7ba313e1c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-350b82080d4003c9385a990040fdfdbe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23388/index-350b82080d4003c9385a990040fdfdbe.svg", "11259.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23388/11259.png", "index-1a1706f49357640f0f65d9b7ba313e1c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23389/index-1a1706f49357640f0f65d9b7ba313e1c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Демоверсия", "2020", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Демоверсия 2020"], "created_at": "2021-11-20T10:49:35Z", "updated_at": "2026-05-19T16:27:54Z"}, {"id": 65360, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показана зависимость температуры металлической детали массой 3,6 кг от переданного ей количества теплоты. Чему\nравна удельная теплоёмкость металла? Ответ дайте в Дж/(кг<img alt=\"⋅ \" class=\"math\" src=\"index-350b82080d4003c9385a990040fdfdbe.svg\"/>К)\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"65360.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= cm Δt,\n\" class=\"math-display\" src=\"index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-79e2684d697a3870e7126a3f7c922535.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-fabbf0fc9e30c5b84e56eb1377ba701b.svg\"/> – масса тела, <img alt=\"Δt  \" class=\"math\" src=\"index-9fb53348692a3cbb075de0546fbaa436.svg\"/> – изменение температуры.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"    Q     36⋅103 Д ж\nc= m-Δt = 3,6-кг⋅20 К-= 500 Д ж/(кг⋅К)\n\" class=\"math-display\" src=\"index-c410206c40e42a2d9ca563dec39f37f8.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-350b82080d4003c9385a990040fdfdbe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118225/index-350b82080d4003c9385a990040fdfdbe.svg", "65360.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118225/65360.png", "index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118226/index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg", "index-79e2684d697a3870e7126a3f7c922535.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118226/index-79e2684d697a3870e7126a3f7c922535.svg", "index-fabbf0fc9e30c5b84e56eb1377ba701b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118226/index-fabbf0fc9e30c5b84e56eb1377ba701b.svg", "index-9fb53348692a3cbb075de0546fbaa436.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118226/index-9fb53348692a3cbb075de0546fbaa436.svg", "index-c410206c40e42a2d9ca563dec39f37f8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118226/index-c410206c40e42a2d9ca563dec39f37f8.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2023-07-10T08:14:23Z", "updated_at": "2026-06-22T13:54:16Z"}, {"id": 186536, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке приведена зависимость температуры твердого тела от полученного им количества теплоты. Масса тела 400 г. Какова\nудельная теплоемкость вещества этого тела? Ответ дайте в <img alt=\" Дж\nкг⋅К-  \" class=\"math\" src=\"index-59c677adc7bc11d55902fb80abc9f040.svg\"/>. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"186536.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Проанализируем график. Каждый раз, как тело получает 20 кДж энергии, его температура возрастает на 100 К. Тогда по формуле\nколичества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm Δt\n\" class=\"math-display\" src=\"index-90c4ef8d8fa4b4e196455d6110a578b9.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    Q     20⋅103 Д ж      Д ж\nc= m-Δt = 0,4-кг⋅100-К = 500кг⋅К-\n\" class=\"math-display\" src=\"index-87560f8d3429fb528c8fc3872362669d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-59c677adc7bc11d55902fb80abc9f040.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410820/index-59c677adc7bc11d55902fb80abc9f040.svg", "186536.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410820/186536.png", "index-90c4ef8d8fa4b4e196455d6110a578b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410821/index-90c4ef8d8fa4b4e196455d6110a578b9.svg", "index-87560f8d3429fb528c8fc3872362669d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/410821/index-87560f8d3429fb528c8fc3872362669d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2026-06-22T13:54:24Z", "updated_at": "2026-07-17T11:27:17Z"}, {"id": 103095, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На рисунке показана зависимость температуры металлической детали массой 2 кг от переданного ей количества теплоты. Чему\nравна удельная теплоёмкость металла? Ответ дайте в Дж/(кг<img alt=\"⋅ \" class=\"math\" src=\"index-350b82080d4003c9385a990040fdfdbe.svg\"/>К) </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"11259.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= cm Δt,\n\" class=\"math-display\" src=\"index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-79e2684d697a3870e7126a3f7c922535.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-fabbf0fc9e30c5b84e56eb1377ba701b.svg\"/> – масса тела, <img alt=\"Δt  \" class=\"math\" src=\"index-9fb53348692a3cbb075de0546fbaa436.svg\"/> – изменение температуры.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"     Q    36⋅103 Д ж\nc=  mΔt-= 2-кг⋅20 К-= 900 Дж/ (кг⋅К )\n\" class=\"math-display\" src=\"index-91226a43ef585c98245679983c1bec87.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-350b82080d4003c9385a990040fdfdbe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212540/index-350b82080d4003c9385a990040fdfdbe.svg", "11259.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212540/11259.png", "index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212541/index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg", "index-79e2684d697a3870e7126a3f7c922535.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212541/index-79e2684d697a3870e7126a3f7c922535.svg", "index-fabbf0fc9e30c5b84e56eb1377ba701b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212541/index-fabbf0fc9e30c5b84e56eb1377ba701b.svg", "index-9fb53348692a3cbb075de0546fbaa436.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212541/index-9fb53348692a3cbb075de0546fbaa436.svg", "index-91226a43ef585c98245679983c1bec87.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/212541/index-91226a43ef585c98245679983c1bec87.svg"}, "tags": [], "sources": ["Банк ФИПИ ЕГЭ"], "created_at": "2025-01-02T09:01:27Z", "updated_at": "2026-07-08T08:16:34Z"}, {"id": 84271, "name": "Задача на термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">При сжатии идеального одноатомного газа при постоянном давлении внешние силы совершили работу 800 Дж. Чему равно\nизменение внутренней энергии газа? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-66fe0db3af3a0fd99aae3fe801d981e1.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-94114f17378982d19aa67e6389ebcf57.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-afdd756677abdb74585490f892bdaf76.svg\"/> — работа газа. Запишем уравнение\nМенделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-a20e6285b66b0ced3003d969cf79c773.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-b0bee5eb0fcbeec54e97e2f247162d0b.svg\"/> – объём, <img alt=\"ν  \" class=\"math\" src=\"index-63250f9147ad152cef5feb7446ddf681.svg\"/> – количество вещества.<br/>Изменение внутренней энергии\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 3νR ΔT.\n     2\n\" class=\"math-display\" src=\"index-e44293b6823d74af9dca40c5381610c0.svg\"/></div>\n<p class=\"indent\">   Работа газа в изобарном процессе\n</p> <div class=\"math-display\">\n<img alt=\"A = pΔV = νRΔT.\n\" class=\"math-display\" src=\"index-1e40072119b004068e226a2edef620ec.svg\"/></div> <p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2A\n\" class=\"math-display\" src=\"index-670740c2a5e3ffa3025ad579429ae013.svg\"/></div>\n<p class=\"indent\">   При этом работа над газом равна <img alt=\" ′\nA = −A  \" class=\"math\" src=\"index-eb9e8118555f71659d828e412025557a.svg\"/>. Тогда\n</p> <div class=\"math-display\">\n<img alt=\"       3      3\nΔU  = −2A ′ = −2 ⋅800 Дж = −1200 Д ж\n\" class=\"math-display\" src=\"index-b8f5919e2209d2a46bb19491a9fcf6a4.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-66fe0db3af3a0fd99aae3fe801d981e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-66fe0db3af3a0fd99aae3fe801d981e1.svg", "index-94114f17378982d19aa67e6389ebcf57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-94114f17378982d19aa67e6389ebcf57.svg", "index-afdd756677abdb74585490f892bdaf76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-afdd756677abdb74585490f892bdaf76.svg", "index-a20e6285b66b0ced3003d969cf79c773.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-a20e6285b66b0ced3003d969cf79c773.svg", "index-b0bee5eb0fcbeec54e97e2f247162d0b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-b0bee5eb0fcbeec54e97e2f247162d0b.svg", "index-63250f9147ad152cef5feb7446ddf681.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-63250f9147ad152cef5feb7446ddf681.svg", "index-e44293b6823d74af9dca40c5381610c0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-e44293b6823d74af9dca40c5381610c0.svg", "index-1e40072119b004068e226a2edef620ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-1e40072119b004068e226a2edef620ec.svg", "index-670740c2a5e3ffa3025ad579429ae013.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-670740c2a5e3ffa3025ad579429ae013.svg", "index-eb9e8118555f71659d828e412025557a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/163095/index-eb9e8118555f71659d828e412025557a.svg", "index-b8f5919e2209d2a46bb19491a9fcf6a4.svg": "htt    ∘\n120 C  \" class=\"math\" src=\"index-fa24402175e86f8fee6d429ba6a1b24b.svg\"/> до <img alt=\"  ∘\n40 C  \" class=\"math\" src=\"index-5f8feb2e42ce614d911962c2750b7451.svg\"/>. Масса детали равна 200 г. Какое количество теплоты отдала деталь при\nостывании? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, отданное телом при нагревании определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm(t1− t2),\n\" class=\"math-display\" src=\"index-11d247a16c3bdcd6609bfa1b227ad62e.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-1b59902541b6aa0e9898e59de592296f.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-eda0bd3a8c12691ccd5f751c865d8208.svg\"/> – масса детали, <img alt=\"t1  \" class=\"math\" src=\"index-a522bc06099ca0ddc48bd28ded083b27.svg\"/> – начальная температура, <img alt=\"t2  \" class=\"math\" src=\"index-ba266fc1e484bc2f2e8eeae402f21b85.svg\"/> – конечная\nтемпература.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"Q =500 Дж/(кг⋅∘C )⋅0,2 кг(120∘C − 40∘C)= 8000 Д ж\n\" class=\"math-display\" src=\"index-34de6fd22f1ab1713297a13967e07c11.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-fa24402175e86f8fee6d429ba6a1b24b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117335/index-fa24402175e86f8fee6d429ba6a1b24b.svg", "index-5f8feb2e42ce614d911962c2750b7451.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117335/index-5f8feb2e42ce614d911962c2750b7451.svg", "index-11d247a16c3bdcd6609bfa1b227ad62e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117336/index-11d247a16c3bdcd6609bfa1b227ad62e.svg", "index-1b59902541b6aa0e9898e59de592296f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117336/index-1b59902541b6aa0e9898e59de592296f.svg", "index-eda0bd3a8c12691ccd5f751c865d8208.svg": "https://3.shkolkovo.online/api/latex-service/v1/G плоты получено от нагревателя за цикл работы этой машины? Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины определяется по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"   Q н− |Q х|\nη =---Q-н--,\n\" class=\"math-display\" src=\"index-e16aee91bcb270dda0ff9549667e0d76.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Qн  \" class=\"math\" src=\"index-580071e711d1350b5ad1fa355abbd72c.svg\"/> – количество теплоты, которое тепловая машина получает от нагревателя; <img alt=\"|Qх| \" class=\"math\" src=\"index-390b99ee4958db25ce36103c1d974984.svg\"/> – количество теплоты, которое тепловая\nмашина отдает холодильнику. <br/>Отсюда <img alt=\"Q\n н  \" class=\"math\" src=\"index-a3cc749590522b45b223268eff204f8b.svg\"/> будет равно:\n</p> <div class=\"math-display\">\n<img alt=\"    --Qх--   300 Дж-\nQн = (1− η) = 1− 0,25 = 400 Дж.\n\" class=\"math-display\" src=\"index-0ecc95443064767ea42b5dc26e3bfa9a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e16aee91bcb270dda0ff9549667e0d76.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390124/index-e16aee91bcb270dda0ff9549667e0d76.svg", "index-580071e711d1350b5ad1fa355abbd72c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390124/index-580071e711d1350b5ad1fa355abbd72c.svg", "index-390b99ee4958db25ce36103c1d974984.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390124/index-390b99ee4958db25ce36103c1d974984.svg", "index-a3cc749590522b45b223268eff204f8b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390124/index-a3cc749590522b45b223268eff204f8b.svg", "index-0ecc95443064767ea42b5dc26e3bfa9a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/390124/index-0ecc95443064767ea42b5dc26e3bfa9a.svg"}, "tags": [], "sources": ["ЕГЭ 2026 резервная волна, Центр"], "created_at": "2026-04-20T17:20:41Z", "updated_at": "2026-07-17T12:45:38Z"}, {"id": 39101, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Температура куска металла с удельной теплоёмкостью 900 Дж/(кг<img alt=\" ∘\n⋅ \" class=\"math\" src=\"index-6ee17470e5c6d99adfe80c1b48030584.svg\"/> C) понизилась со <img alt=\"  ∘\n120 C  \" class=\"math\" src=\"index-57af723bc9a2ef72a9750ef6e9360514.svg\"/> до <img alt=\" ∘\n40 C  \" class=\"math\" src=\"index-b633001a8ccaef8aea1871fab6a446bc.svg\"/>. При этом выделилось\nколичество теплоты, равное 108 кДж. Чему равна масса этого куска металла? Ответ дайте в кг.\n</p>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты для нагрева вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm (t2− t1),\n\" class=\"math-display\" src=\"index-307695bab1eb53e860fca9cdaef3a053.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-8f8632e5f9092ef8ff2a3106c7bca055.svg\"/> – теплоёмкость, <img alt=\"m  \" class=\"math\" src=\"index-756e609757ce9121fc78ae586e282d33.svg\"/> – масса, <img alt=\"t2  \" class=\"math\" src=\"index-6b7dbcfe3117284a0cabbb3a1bad831e.svg\"/> и <img alt=\"t1  \" class=\"math\" src=\"index-ab01f5315f0a29a757ea979226cc5769.svg\"/> – конечная и начальная температура.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"       Q             −108⋅103 Дж\nm = c(t−-t-) = 900 Д-ж/(кг⋅К)(40∘C-−-120∘C-) = 1,5 кг\n      2   1\n\" class=\"math-display\" src=\"index-0cc6cb1989202f0021fdbcdcae726a6b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6ee17470e5c6d99adfe80c1b48030584.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75374/index-6ee17470e5c6d99adfe80c1b48030584.svg", "index-57af723bc9a2ef72a9750ef6e9360514.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75374/index-57af723bc9a2ef72a9750ef6e9360514.svg", "index-b633001a8ccaef8aea1871fab6a446bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/75374/index-b63300 0361b027c9efe88a536f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Qх = Q н− A\n\" class=\"math-display\" src=\"index-78010c0b409e78204e24a326d6210b5b.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Q х = 100 Дж − 40 Д ж =60 Дж\n\" class=\"math-display\" src=\"index-d2c6fff9adcb44d3e9e09c7f115d68df.svg\"/></div>\n<p class=\"indent\">   Найдем КПД тепловой машины:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"       60 Д ж\nη = 1 − 100-Дж-= 0,4\n\" class=\"math-display\" src=\"index-96fe5d46b2b4e9236b46fe14d71c10e5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-baa8d817cd059063694041b3593a03a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190720/index-baa8d817cd059063694041b3593a03a1.svg", "index-d2143057fff60361b027c9efe88a536f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190720/index-d2143057fff60361b027c9efe88a536f.svg", "index-78010c0b409e78204e24a326d6210b5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190720/index-78010c0b409e78204e24a326d6210b5b.svg", "index-d2c6fff9adcb44d3e9e09c7f115d68df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190720/index-d2c6fff9adcb44d3e9e09c7f115d68df.svg", "index-96fe5d46b2b4e9236b46fe14d71c10e5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/190720/index-96fe5d46b2b4e9236b46fe14d71c10e5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя", "Демидова 2019"], "sources": ["Демидова 2019"], "created_at": "2024-07-06T07:41:52Z", "updated_at": "2026-04-18T14:09:17Z"}, {"id": 96918, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Внешние силы совершили работу над газом, равную 300 Дж, при этом его внутренняя энергия увеличилась на 100 Дж.\nКакое количество теплоты отдал газ в этом процессе? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Над газом совершили работу и его внутренняя энергия изменилась, тогда, в соответствии с первым законом термодинамики, газ\nотдал количество теплоты, равное:\n</p> <div class=\"math-display\">\n<img alt=\"Q =A − ΔU = 200 Д ж\n\" class=\"math-display\" src=\"index-b1eb3d7929f5ad8997b962cf6f4e906d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b1eb3d7929f5ad8997b962cf6f4e906d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206745/index-b1eb3d7929f5ad8997b962cf6f4e906d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019", "ЕГЭ 2026 резервная волна, Дальний Восток"], "created_at": "2024-09-23T16:20:36Z", "updated_at": "2026-07-17T11:26:53Z"}, {"id": 98116, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловой двигатель получает за цикл от нагревателя количество теплоты, равное 200 Дж, и отдаёт холодильнику\nколичество теплоты, равное 150 Дж. Определите КПД двигателя. Ответ дайте в %.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"       Qх\nη = 1− Qн-\n\" class=\"math-display\" src=\"index-baa8d817cd059063694041b3593a03a1.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"η = 1− 150= 25%\n       200\n\" class=\"math-display\" src=\"index-9729e1e128b5ebd3f2dd50d9e8ba4173.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-baa8d817cd059063694041b3593a03a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206450/index-baa8d817cd059063694041b3593a03a1.svg", "index-9729e1e128b5ebd3f2dd50d9e8ba4173.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/206450/index-9729e1e128b5ebd3f2dd50d9e8ba4173.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Циклы. КПД теплового двигателя"], "sources": ["Демидова 2019"], "created_at": "2024-10-14T16:18:24Z", "updated_at": "2026-05-15T18:18:48Z"}, {"id": 189729, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Температура свинцовой детали при обработке повысилась с <img alt=\"20∘C  \" class=\"math\" src=\"index-d35b81b0dc4a63294f8251a1b6ba8136.svg\"/> до <img alt=\"70∘C.  \" class=\"math\" src=\"index-ed5abb1b2f88f9fa304a9b918ffe9c50.svg\"/> Масса детали равна 6 кг. Какое количество\nтеплоты получила деталь при нагревании? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, полученное телом при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm (t2− t1),\n\" class=\"math-display\" src=\"index-307695bab1eb53e860fca9cdaef3a053.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-8f8632e5f9092ef8ff2a3106c7bca055.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-3e0017412b7fea0c5a6ea78adbe70e28.svg\"/> – масса тела, <img alt=\"Δt  \" class=\"math\" src=\"index-ab3f80d54d532fd0309d6ea04c3b9964.svg\"/> – изменение температуры.\n</p><p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"                  Д ж\nQ = cm(t2− t1)= 130кг⋅К-⋅6 кг⋅(70∘C − 20∘C) = 39000 Д ж\n\" class=\"math-display\" src=\"index-17fd3fa29fb84e86d05c2b4f3a00a5a1.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d35b81b0dc4a63294f8251a1b6ba8136.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418215/index-d35b81b0dc4a63294f8251a1b6ba8136.svg", "index-ed5abb1b2f88f9fa304a9b918ffe9c50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418215/index-ed5abb1b2f88f9fa304a9b918ffe9c50.svg", "index-307695bab1eb53e860fca9cdaef3a053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418216/index-307695bab1eb53e860fca9cdaef3a053.svg", "index-8f8632e5f9092ef8ff2a3106c7bca055.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418216/index-8f8632e5f9092ef8ff2a3106c7bca055.svg", "index-3e0017412b7fea0c5a6ea78adbe70e28.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418216/index-3e0017412b7fea0c5a6ea78adbe70e28.svg", "index-ab3f80d54d532fd0309d6ea04c3b9964.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418216/index-ab3f80d54d532fd0309d6ea04c3b9964.svg", "index-17fd3fa29fb84e86d05c2b4f3a00a5a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/418216/index-17fd3fa29fb84e86d05c2b4f3a00a5a1.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["ЕГЭ 2026 пересдача, центр"], "created_at": "2026-07-08T12:41:44Z", "updated_at": "2026-07-17T13:34:10Z"}, {"id": 96014, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Кусок алюминия массой 5 кг нагрели от <img alt=\"20∘C  \" class=\"math\" src=\"index-bf36ea7de414878d7ded0894d55096fd.svg\"/> до <img alt=\"100∘C.  \" class=\"math\" src=\"index-5baaee89f5b25ef0ce6ffec4f7e5e239.svg\"/> Какое количество теплоты было затрачено на его нагрев? Ответ\nдайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты для нагрева вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm (t2− t1),\n\" class=\"math-display\" src=\"index-307695bab1eb53e860fca9cdaef3a053.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-8f8632e5f9092ef8ff2a3106c7bca055.svg\"/> – теплоёмкость, <img alt=\"m  \" class=\"math\" src=\"index-756e609757ce9121fc78ae586e282d33.svg\"/> – масса, <img alt=\"t2  \" class=\"math\" src=\"index-6b7dbcfe3117284a0cabbb3a1bad831e.svg\"/> и <img alt=\"t1  \" class=\"math\" src=\"index-ab01f5315f0a29a757ea979226cc5769.svg\"/> – конечная и начальная температура.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = 900 ⋅5⋅80= 360000 Дж\n\" class=\"math-display\" src=\"index-075f0a5423173dadcd8ae10d9341dabb.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-bf36ea7de414878d7ded0894d55096fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195641/index-bf36ea7de414878d7ded0894d55096fd.svg", "index-5baaee89f5b25ef0ce6ffec4f7e5e239.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/195641/index-5baaee89f5b25ef0ce6ffec4f7e5e239.svg", "index-307695bab1eb53e860fca9cdaef3a053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-307695bab1eb53e860fca9cdaef3a053.svg", "index-8f8632e5f9092ef8ff2a3106c7bca055.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-8f8632e5f9092ef8ff2a3106c7bca055.svg", "index-756e609757ce9121fc78ae586e282d33.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-756e609757ce9121fc78ae586e282d33.svg", "index-6b7dbcfe3117284a0cabbb3a1bad831e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-6b7dbcfe3117284a0cabbb3a1bad831e.svg", "index-ab01f5315f0a29a757ea979226cc5769.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-ab01f5315f0a29a757ea979226cc5769.svg", "index-075f0a5423173dadcd8ae10d9341dabb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/205354/index-075f0a5423173dadcd8ae10d9341dabb.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Демидова 2019"], "created_at": "2024-09-05T16:52:59Z", "updated_at": "2026-04-18T14:14:04Z"}, {"id": 161210, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Газ в сосуде сжали, совер
