"math\" src=\"index-ecd536e904b8c7e419201000a834ad9d.svg\"/> - объем\nгаза, <img alt=\"T  \" class=\"math\" src=\"index-2eef78458a470b132730b387af41bd29.svg\"/> - абсолютная температура газа). Масса газа в ходе процесса не меняется. В процессе <img alt=\"1− 2  \" class=\"math\" src=\"index-b81d95f601f09cbf949e67ac591ada41.svg\"/> газу сообщают\nколичество теплоты, равное 8 кДж. Определите изменение внутренней энергии в процессе <img alt=\"1− 2.  \" class=\"math\" src=\"index-c0114fc21e003af42b30dc164d3ebe97.svg\"/> Ответ дайте в\nкДж.<br/>\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"106701.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">При постоянном объёме газ не совершает работы, тогда из первого начала термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A ⇒ ΔU  =Q = 8 кД ж\n\" class=\"math-display\" src=\"index-fb98c5afc3e46f0c44c2bf973e3c4c86.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f705b6877724edd7dbdbc6bbfc8d890a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/index-f705b6877724edd7dbdbc6bbfc8d890a.svg", "index-ecd536e904b8c7e419201000a834ad9d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/index-ecd536e904b8c7e419201000a834ad9d.svg", "index-2eef78458a470b132730b387af41bd29.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/index-2eef78458a470b132730b387af41bd29.svg", "index-b81d95f601f09cbf949e67ac591ada41.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/index-b81d95f601f09cbf949e67ac591ada41.svg", "index-c0114fc21e003af42b30dc164d3ebe97.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/index-c0114fc21e003af42b30dc164d3ebe97.svg", "106701.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/221011/106701.png", "index-fb98c5afc3e46f0c44c2bf973e3c4c86.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/247879/index-fb98c5afc3e46f0c44c2bf973e3c4c86.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ"], "sources": ["Отличный результат"], "created_at": "2025-02-25T20:02:08Z", "updated_at": "2026-07-03T07:46:05Z"}, {"id": 12441, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">На рисунке показан график изменения состояния постоянной массы идеального газа. В этом процессе\nгаз отдал количество теплоты, равное 4 кДж. На сколько уменьшилась внутренняя энергия газа? Ответ\nдайте в кДж. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"12441.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Из графика видно, что данный процесс является изохорным. Поскольку объем газа не изменялся, газ не совершал работы.\nСледовательно, согласно первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU  =4 кДж\n\" class=\"math-display\" src=\"index-f3f320fbe57b8be67de95426541f56af.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"12441.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25343/12441.png", "index-f3f320fbe57b8be67de95426541f56af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25344/index-f3f320fbe57b8be67de95426541f56af.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": [], "created_at": "2021-12-01T11:26:38Z", "updated_at": "2026-09-21T17:07:11Z"}, {"id": 84064, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">На рисунке показан циклический процесс изменения состояния постоянной массы одноатомного идеального газа (V – объём газа, T –\nего абсолютная температура). На каком из участков процесса (1, 2, 3 или 4) работа газа положительна и равна полученному газом\nколичеству теплоты?\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"84064.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f9715b7933269c9721cd22eb7fb59a7e.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-65ef85ccb23353f986c627ebb7d9b595.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-6712b5a17df3d29029f4b6d9feef9e0c.svg\"/> – работа газа.<br/>Работа газа положительна при увеличении объёма (только процесс 4).\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"84064.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/162765/84064.png", "index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/162766/index-5f9b96e1ffc35084e37b6d5c1a31ba73.svg", "index-f9715b7933269c9721cd22eb7fb59a7e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/162766/index-f9715b7933269c9721cd22eb7fb59a7e.svg", "index-65ef85ccb23353f986c627ebb7d9b595.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/162766/index-65ef85ccb23353f986c627ebb7d9b595.svg", "index-6712b5a17df3d29029f4b6d9feef9e0c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/162766/index-6712b5a17df3d29029f4b6d9feef9e0c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Первый закон термодинамики"], "sources": ["Демидова 2019"], "created_at": "2024-04-02T15:33:56Z", "updated_at": "2026-07-03T07:46:36Z"}, {"id": 64803, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">На рисунке показан график изменения состояния постоянной массы одноатомного идеального газа. В этом процессе газ получил\nколичество теплоты, равное 3 кДж. Насколько в результате этого увеличилась его внутренняя энергия? Ответ дайте в\nкДж.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"f-9-3-pict5.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.<br/>Из графика:\n</p> <div class=\"math-display\">\n<img alt=\"p= αT,\n\" class=\"math-display\" src=\"index-de3cc9aae850e8d2e73ca0e661b12088.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-c0060ca65497e4f60936efb5d325abce.svg\"/> – некоторый коэффициент.<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-91cfa80e1e8b13122f962cfedb13bfc3.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-b232b8afb3e9283914a241eda0c5ebb4.svg\"/> – объём, <img alt=\"ν  \" class=\"math\" src=\"index-351e73e8ccb464e3abd6e53b5165963a.svg\"/> – количество вещества.<br/>Отсюда объём\n</p> <div class=\"math-display\">\n<img alt=\"V = νRT-= νRT-=  νR--=const,\n     p     αT    α\n\" class=\"math-display\" src=\"index-3b325e2e8b87f25c00e0bd2eb5880fd3.svg\"/></div>\n<p class=\"indent\">   то есть объём math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-66fe0db3af3a0fd99aae3fe801d981e1.svg\"/> — количество теплоты, <img alt=\"ΔU  \" class=\"math\" src=\"index-94114f17378982d19aa67e6389ebcf57.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-afdd756677abdb74585490f892bdaf76.svg\"/> — работа газа. Запишем уравнение\nМенделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-a20e6285b66b0ced3003d969cf79c773.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-b0bee5eb0fcbeec54e97e2f247162d0b.svg\"/> – объём, <img alt=\"ν  \" class=\"math\" src=\"index-63250f9147ad152cef5feb7446ddf681.svg\"/> – количество вещества.<br/>Так как по условию:\n</p> <div class=\"math-display\">\n<img alt=\"T =αp,\n\" class=\"math-display\" src=\"index-a1d9d6fab6de28ee05c46b4ddb760e62.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"α  \" class=\"math\" src=\"index-6c1cf4fd2fde4101cb3279e6bfe8d53d.svg\"/> – некоторый коэффициент.<br/>То\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRαp ⇒ V = ανR =const\n\" class=\"math-display\" src=\"index-beed84ee3776ad441e2fea1595ff2980.svg\"/></div>\n<p class=\"indent\">   То есть объём газа постоянен и работа газа не совершается.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU = 30 кДж\n\" class=\"math-display\" src=\"index-2c33847e2ccd4dfe85c3c3b193b2a216.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"f-ege-8-3-1.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115986/f-ege-8-3-1.png", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115987/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-66fe0db3af3a0fd99aae3fe801d981e1.svg": "https://3.shkolkovo.onl томного идеального газа.\nНа каком участке <span class=\"labx-0900\">работа внешних сил над газом </span>положительна и равна отданному газом количеству теплоты\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"12431.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">По первому началу термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-f0fa58798ed9c365e2df1d357596c2be.svg\"/> – количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-37bcabf32aed130ae3f7d2a0057a2b47.svg\"/> – изменение внутренней энергии, <img alt=\"A  \" class=\"math\" src=\"index-626dad04d91f60a30ba25a3859bd29e1.svg\"/> – работа газа.<br/>Так как <img alt=\"Q = A  \" class=\"math\" src=\"index-0a2eaeffec746828a73c4e152d5ab562.svg\"/>, то <img alt=\"ΔU = 0  \" class=\"math\" src=\"index-a6a2d39618bbc9810e57daa364a552f6.svg\"/>, при этом изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2νR ΔT,\n\" class=\"math-display\" src=\"index-cef7bd6f0291871d41210ec99e50c3e7.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-7936f88a3412e50e52e33f6072925459.svg\"/> – количество вещества, <img alt=\"ΔT  \" class=\"math\" src=\"index-a004ae334e14e43abb2260e163b29df8.svg\"/> – изменение температуры.<br/>Следовательно, температура не изменялась.<br/>Работа внешних сил положительна, если объём газа уменьшается. По закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const,\n\" class=\"math-display\" src=\"index-5ded8cec2407adf3f8a33cc921b1520c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-00fda5fe4397acdc4285700be47141f0.svg\"/> – объём, то есть объём уменьшается при увеличении давления, что соответствует графику 4.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"12431.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25324/12431.png", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-0a2eaeffec746828a73c4e152d5ab562.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-0a2eaeffec746828a73c4e152d5ab562.svg", "index-a6a2d39618bbc9810e57daa364a552f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-a6a2d39618bbc9810e57daa364a552f6.svg", "index-cef7bd6f0291871d41210ec99e50c3e7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-cef7bd6f0291871d41210ec99e50c3e7.svg", "index-7936f88a3412e50e52e33f6072925459.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-7936f88a3412e50e52e33f6072925459.svg", "index-a004ae334e14e43abb2260e163b29df8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-a004ae334e14e43abb2260e163b29df8.svg", "index-5ded8cec2407adf3f8a33cc921b1520c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-5ded8cec2407adf3f8a33cc921b1520c.svg", "index-00fda5fe4397acdc4285700be47141f0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25326/index-00fda5fe4397acdc4285700be47141f0.svg"}, "tags": ["Демоверсия", "2019", "МКТ. Термодинамика", "Молекулярная физика. МКТ", ельна, если объём газа увеличивается. По закону Бойля-Мариотта:\n</p> <div class=\"math-display\">\n<img alt=\"pV = const,\n\" class=\"math-display\" src=\"index-5ded8cec2407adf3f8a33cc921b1520c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"V  \" class=\"math\" src=\"index-00fda5fe4397acdc4285700be47141f0.svg\"/> – объём, то есть объём увеличивается при уменьшении давления, что соответствует графику 2.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"12431.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387219/12431.png", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-f0fa58798ed9c365e2df1d357596c2be.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-f0fa58798ed9c365e2df1d357596c2be.svg", "index-37bcabf32aed130ae3f7d2a0057a2b47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-37bcabf32aed130ae3f7d2a0057a2b47.svg", "index-626dad04d91f60a30ba25a3859bd29e1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-626dad04d91f60a30ba25a3859bd29e1.svg", "index-0a2eaeffec746828a73c4e152d5ab562.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-0a2eaeffec746828a73c4e152d5ab562.svg", "index-a6a2d39618bbc9810e57daa364a552f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-a6a2d39618bbc9810e57daa364a552f6.svg", "index-cef7bd6f0291871d41210ec99e50c3e7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-cef7bd6f0291871d41210ec99e50c3e7.svg", "index-7936f88a3412e50e52e33f6072925459.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-7936f88a3412e50e52e33f6072925459.svg", "index-a004ae334e14e43abb2260e163b29df8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/387220/index-a004ae334e14e43abb2260e163b29df8.svg", "index-5 "/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-883f5b46c65fe70db9a549b6bc52ef58.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-cf10bd63936299609cef6555bfac202f.svg\"/> — изменение абсолютной температуры газа,\n<img alt=\"i  \" class=\"math\" src=\"index-6e161013cd657c144f7850c168eeb9dd.svg\"/> — число степеней свободы (так как газ одноатомный, то <img alt=\"i= 3  \" class=\"math\" src=\"index-291ffd8a1968e7bfcadaf7d644ece4b8.svg\"/>). <br/>Подставим (2) в (1):\n</p> <div class=\"math-display\">\n<img alt=\"    3\nQ = 2νRΔT  +A\n\" class=\"math-display\" src=\"index-48f697d45f896247826ff4983f0bb26c.svg\"/></div>\n<p class=\"indent\">   Работа внешних сил равна:\n</p> <div class=\"math-display\">\n<img alt=\"A внеш. сил = −A\n\" class=\"math-display\" src=\"index-7bc4b43acf4df8356d19de4dcbf2c22b.svg\"/></div>\n<p class=\"indent\">   С учетом этого получаем, что:\n</p> <div class=\"math-display\">\n<img alt=\"    3\nQ = 2νRΔT − Aвнеш. сил\n\" class=\"math-display\" src=\"index-993b4dd08c6375833864429acf7c2110.svg\"/></div>\n<p class=\"indent\">   Подставим известные значения (с учетом того, что изменение температуры в градусах Цельсия и Кельвина одинаково):\n</p> <div class=\"math-display\">\n<img alt=\"Q = 3 ⋅1,5 моль⋅8,31 Дж/ ( моль⋅ К)-Дж-⋅230 К− 3600 Д ж ≈700 Дж\n    2                          моль ⋅К\n\" class=\"math-display\" src=\"index-f25e649972e10337166a665db21ebd6a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-478b1e6da166ca0bec042daefa5ee416.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25285/index-478b1e6da166ca0bec042daefa5ee416.svg", "index-864bf70887badfa2b2bd0e36909ab3af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25286/index-864bf70887badfa2b2bd0e36909ab3af.svg", "index-8b726a22501f25fab4806a51515eed30.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25286/index-8b726a22501f25fab4806a51515e Тренировочные задания Школково"], "created_at": "2021-12-01T10:55:44Z", "updated_at": "2026-03-21T17:28:53Z"}, {"id": 12438, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В процессе адиабатного сжатия над 2 молями идеального одноатомного газа совершают\nработу 997,2 Дж. Определите модуль изменения температуры данной порции газа в результате этого\nпроцесса. Универсальную газовую постоянную принять <img alt=\"R  = 8,31 Д ж/ (мо ль⋅К)  \" class=\"math\" src=\"index-ac0403dbe7226314d64d461fc2cb00fd.svg\"/> Ответ дайте в\nК.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   В адиабатном процессе газ не получает теплоты от внешней среды:\n</p> <div class=\"math-display\">\n<img alt=\"0= ΔU + A ⇒ U = −A\n\" class=\"math-display\" src=\"index-58f5dd55b99e220ed36cac6a775e74d2.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2 νRΔT\n\" class=\"math-display\" src=\"index-809692215aa4126a15a063f296a7edee.svg\"/></div>\n<p class=\"indent\">   Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"     3\n− A= 2 νRΔT\n\" class=\"math-display\" src=\"index-09522be5281057405059ff78a3c0b24b.svg\"/></div>\n<p class=\"indent\"> </p> <div class=\"math-display\">\n<img alt=\"       2A           2⋅997,2 Дж\n|ΔT|= 3νR-= 3-⋅2 моль⋅8,31 Д-ж/(моль⋅ К) = 40 К\n\" class=\"math-display\" src=\"index-0628d8f2f80f3be5f17fd4dcd00960b5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ac0403dbe7226314d64d461fc2cb00fd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25338/index-ac0403dbe7226314d64d461fc2cb00fd.svg", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25339/index-bd94ff284644b2773b552a8c5529b561.svg", "index-58f5dd55b99e220ed36cac6a775e74d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25339/index-58f5dd55b99e220ed36cac6a775e74d2.svg", "index-809692215aa4126a15a063f296a7edee.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25339/index-809692215aa4126a15a063f296a7edee.svg", "index-09522be5281057405059ff78a3c0b24b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25339/index-09522be5281057405059ff78a3c0b24b.svg", "index-0628d8f2f80f3be5f17fd4dcd00960b5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25339/index-0628d8f2f80f3be5f17fd4dcd00960b5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики"], "sources": ["Тренировочные задания Школково"], "created_at": "2021-12-01T11:25:29Z", "updated_at": "2026-03-21T17:33:21Z"}, {"id": 12442, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В некотором процессе газ получает количество теплоты 97 Дж, внутренняя энергия газа увеличивается,\nпричём изменение его внутренней энергии составляет 4/7 от работы газа. Какую работу совершает газ в\nэтом процессе? Ответ дайте в Дж и округлите до целых.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-40105edf6ed66a6b3056385a347f21d7.svg\"/> — количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-108ebadfb183acbbae34ee84c7a13ab2.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-ef7ffbb947901a32daab42036b5d5fec.svg\"/> — работа, совершенная газом.\n<br/><br/>По условию <img alt=\"ΔU  = 4A\n      7  \" class=\"math\" src=\"index-ce171c4df923b0cf5bf7b53ee6eb8f08.svg\"/>. Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 4A + A= 11A\n    7        7\n\" class=\"math-display\" src=\"index-4acd0fe4df33d4426f1db675393b0c9c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    7-    7-\nA=  11 Q=  11 ⋅97 Дж ≈ 62 Дж\n\" class=\"math-display\" src=\"index-72ea6ce1b4ddb42cfc645e5802045a61.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-40105edf6ed66a6b3056385a347f21d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-40105edf6ed66a6b3056385a347f21d7.svg", "index-108ebadfb183acbbae34ee84c7a13ab2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-108ebadfb183acbbae34ee84c7a13ab2.svg", "index-ef7ffbb947901a32daab42036b5d5fec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-ef7ffbb947901a32daab42036b5d5fec.svg", "index-ce171c4df923b0cf5bf7b53ee6eb8f08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-ce171c4df923b0cf5bf7b53ee6eb8f08.svg", "index-4acd0fe4df33d4426f1db675393b0c9c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-4acd0fe4df33d4426f1db675393b0c9c.svg", "index-72ea6ce1b4ddb42cfc645e5802045a61.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25346/index-72ea6ce1b4ddb42cfc645e5802045a61.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Первый закон термодинамики"], "sources": ["Банк ФИПИ"], "created_at": "2021-12-01T11:27:08Z", "updated_at": "2026-03-21T17:34:30Z"}, {"id": 12444, "name": "Задача на первое начало термодинамики. Первая часть", "theme_path": "№8 Термодинамика -> Первое начало термодинамики", "question_html": "<p class=\"noindent\">В некотором процессе идеальный газ совершает работу 140 Дж, причем полученное газом количество теплоты составляет 16/7 от\nизменения внутренней энергии газа (внутренняя энергия увеличивается). Чему равно изменение внутренней энергии газа в этом\nпроцессе? Ответ дайте в Дж и округлите до целых.\n</p>", "solution_html": "<p class=\"noindent\">По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  +A,\n\" class=\"math-display\" src=\"index-95fd1385c011c757ec4a2b07be81c0a2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q  \" class=\"math\" src=\"index-40105edf6ed66a6b3056385a347f21d7.svg\"/> — количество теплоты, полученное газом, <img alt=\"ΔU  \" class=\"math\" src=\"index-108ebadfb183acbbae34ee84c7a13ab2.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-ef7ffbb947901a32daab42036b5d5fec.svg\"/> — работа, совершенная газом.\n<br/><br/>По условию <img alt=\"Q = 16ΔU\n     7  \" class=\"math\" src=\"index-fcdb4f52f087d78f080bbb2d92b76ab3.svg\"/>. Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"16ΔU  =ΔU  +A\n 7\n\" class=\"math-display\" src=\"index-ed73e5fa4f1c4a14110a30f466dc541f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    9           7    7\nA=  7ΔU ⇒ ΔU  = 9A = 9 ⋅140 Д ж ≈109 Дж\n\" class=\"math-display\" src=\"index-095d17b60dfbdeeda4f20bfb793d3bbf.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25351/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-40105edf6ed66a6b3056385a347f21d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25351/index-40105edf6ed66a6b3056385a347f21d7.svg", "index-108ebadfb183acbbae34ee84c7a13ab2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25351/index-108ebadfb183acbbae34ee84c7a13ab2.svg", "index-ef7ffbb947901a 84a47.svg\"/> — изменение внутренней энергии газа, а <img alt=\"A  \" class=\"math\" src=\"index-ef3afa8c29428e2ac6610498afb7e92f.svg\"/> — работа,\nсовершенная газом. <br/><br/><img alt=\"A = 0  \" class=\"math\" src=\"index-389a95e702ac92fdc9c988bdea7462ef.svg\"/>, т.к. по условию <img alt=\"V = const  \" class=\"math\" src=\"index-a50a14023fd66864ec237f92dad28153.svg\"/> (сосуд плотно закрыт). <br/>Отсюда:\n</p> <div class=\"math-display\">\n<img alt=\"Q= ΔU  = 3m-RΔT\n         2M\n\" class=\"math-display\" src=\"index-6431159e9fe481877048e5ebbda46a86.svg\"/></div>\n<p class=\"indent\">   Осталось выразить <img alt=\"ΔT  \" class=\"math\" src=\"index-03b638ebf1aeb0f46a919f7be04197ba.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"      2QM       2⋅900 Дж ⋅0,04 кг/моль\nΔT  = 3mR-=  3⋅0,2-кг⋅8,31-Дж/-(моль-⋅ К)-≈ 14 K\n\" class=\"math-display\" src=\"index-f25663e360452a550883638e7657d1ed.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-37935ea74c235c3a4fae9fe7ab206d8d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25352/index-37935ea74c235c3a4fae9fe7ab206d8d.svg", "index-b3c3dcafa146f3af8d16dd34ac62e082.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25352/index-b3c3dcafa146f3af8d16dd34ac62e082.svg", "index-e7065ee47e8a89922d2f72dc184885bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25352/index-e7065ee47e8a89922d2f72dc184885bf.svg", "index-95fd1385c011c757ec4a2b07be81c0a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25353/index-95fd1385c011c757ec4a2b07be81c0a2.svg", "index-99964ec3d5542ed4ca8b5832f9b91a31.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25353/index-99964ec3d5542ed4ca8b5832f9b91a31.svg", "index-6f645c7ead9f60ed18564ea67cf84a47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25353/index-6f645c7ead9f60ed18564ea67cf84a47.svg", "index-ef3afa8c29428e2ac6610498afb7e92f.svg": "https://3.shkolkovo.online ce/v1/GetSession/116396/index-338dabb5379baf6320a7b47fb7017cd4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": [], "created_at": "2023-06-23T08:19:41Z", "updated_at": "2026-07-11T23:25:23Z"}, {"id": 195553, "name": "Копия #64431 - Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">Рабочее тело теплового двигателя за цикл совершает работу, равную 15 кДж, и отдаёт холодильнику количество\nтеплоты, равное 75 кДж. Какое количество теплоты рабочее тело получает от нагревателя за цикл? Ответ дайте в\nкДж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, полученное от нагревателя идет на работу газа и отдачу теплоты холодильнику, то есть:\n</p> <div class=\"math-display\">\n<img alt=\"Qн = A+ Q х = 15 кДж + 75 кД ж = 90 кДж\n\" class=\"math-display\" src=\"index-338dabb5379baf6320a7b47fb7017cd4.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-338dabb5379baf6320a7b47fb7017cd4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433486/index-338dabb5379baf6320a7b47fb7017cd4.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-17T06:50:08Z", "updated_at": "2026-08-17T06:50:25Z"}, {"id": 84719, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">Рабочее тело тепловой машины за цикл совершает работу 45 Дж. Какое количество теплоты отдаёт холодильнику рабочее тело, если\nКПД тепловой машины равен 15%? Ответ дайте в Дж\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"    A      A\nη = Qн-= A-+Q-х,\n\" class=\"math-display\" src=\"index-78d4abfb4ff8df37479a6e9bd390b121.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"A  \" class=\"math\" src=\"index-178a022058481c77aec3de9539e589f3.svg\"/> – работа газа, <img alt=\"Qн  \" class=\"math\" src=\"index-2a14aa38c09e01517d419ff83ec5e021.svg\"/> – количество теплоты, полученное от нагревателя, <img alt=\"Qх  \" class=\"math\" src=\"index-a881465417139c691e3607e2478c1f08.svg\"/> – количество теплоты, отданное рабочим\nтелом.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"     A-     45-Дж-\nQх = η − A=  0,15 − 45 Д ж = 255 Дж\n\" class=\"math-display\" src=\"index-142736b94b69d507d48e26005e531af0.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-78d4abfb4ff8df37479a6e9bd390b121.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167585/index-78d4abfb4ff8df37479a6e9bd390b121.svg", "index-178a022058481c77aec3de9539e589f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167585/index-178a022058481c77aec3de9539e589f3.svg", "index-2a14aa38c09e01517d419ff83ec5e021.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167585/index-2a14aa38c09e01517d419ff83ec5e021.svg", "index-a881465417139c691e3607e2478c1f08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167585/index-a881465417139c691e3607e2478c1f08.svg", "index-142736b94b69d507d48e26005e531af0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/167585/index-142736b94b69d507d48e26005e531af0.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": [], "created_at": "2024-04-10T16:03:05Z", "updated_at": "2026-07-03T08:13:09Z"}, {"id": 125567, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">Идеальная тепловая машина с КПД <img alt=\"30%  \" 27a50.svg\"/> – количество теплоты, полученное от нагревателя.\n</p><p class=\"indent\">   Тогда\n</p> <div class=\"math-display\">\n<img alt=\"η =1 − 120 Дж-=0,2= 20%\n       150 Дж\n\" class=\"math-display\" src=\"index-34a3dee0e324dd7fc857ae1b48f4352a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-cf958c1469d1d25e3e1052bc12d474a2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116493/index-cf958c1469d1d25e3e1052bc12d474a2.svg", "index-0bfb677d48a1d4c631e7ee4c27d5cc37.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116493/index-0bfb677d48a1d4c631e7ee4c27d5cc37.svg", "index-69a66561ff6e4c6e394194906a627a50.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116493/index-69a66561ff6e4c6e394194906a627a50.svg", "index-34a3dee0e324dd7fc857ae1b48f4352a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116493/index-34a3dee0e324dd7fc857ae1b48f4352a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Молекулярная физика. МКТ", "Циклы. КПД теплового двигателя"], "sources": ["Банк ФИПИ"], "created_at": "2023-06-26T07:26:42Z", "updated_at": "2026-04-04T06:10:56Z"}, {"id": 11236, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">В цикле Карно абсолютная температура нагревателя в 2,5 раза выше абсолютной температуры холодильника. Какая доля теплоты,\nполученной рабочим телом от нагревателя, передается холодильнику? Ответ дайте в %.\n</p>", "solution_html": "<p class=\"noindent\">Из условия:\n</p> <div class=\"math-display\">\n<img alt=\"Tн = 2,5Tх\n\" class=\"math-display\" src=\"index-578e496c7b8fbc21fbebfbda0b551fe8.svg\"/></div>\n<p class=\"indent\">   КПД в цикле Карно:\n</p> <div class=\"math-display\">\n<img alt=\"      Tх\nη = 1− Tн\n\" class=\"math-display\" src=\"index-323566442960a1b83aa35c2e260b1e65.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"η =1 − -1Tх--= -1-= 0,6\n       2,5Tх   2,5\n\" class=\"math-display\" src=\"index-1702cff2812b4eab4a5df269f1a46f89.svg\"/></div>\n<p class=\"indent\">   Следовательно, холодильнику передается теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"1 − η = 1− 0,6 = 0,4\n\" class=\"math-display\" src=\"index-0628f0f6e97fe6a67d0a2474ffb9f70a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-578e496c7b8fbc21fbebfbda0b551fe8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23343/index-578e496c7b8fbc21fbebfbda0b551fe8.svg", "index-323566442960a1b83aa35c2e260b1e65.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23343/index-323566442960a1b83aa35c2e260b1e65.svg", "index-1702cff2812b4eab4a5df269f1a46f89.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23343/index-1702cff2812b4eab4a5df269f1a46f89.svg", "index-0628f0f6e97fe6a67d0a2474ffb9f70a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23343/index-0628f0f6e97fe6a67d0a2474ffb9f70a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Банк ФИПИ"], "created_at": "2021-11-19T17:31:23Z", "updated_at": "2026-07-03T08:10:55Z"}, {"id": 11246, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">КПД идеальной тепловой машины, работающей по циклу Карно, равен <img alt=\"η = 60%  \" class=\"math\" src=\"index-0408d03db784525da9c8a55d1e8327d9.svg\"/>. Если температуру нагревателя увеличить в два\nраза, а температуру холодильника уменьшить в 2 раза, чему будет равен КПД тепловой машины? Ответ дайте в\n%.\n</p>", "solution_html": "<p class=\"noindent\">КПД идеальной тепловой машины в первом случае:\n</p> <div class=\"math-display\">\n<img alt=\"       Tхo\nηo = 1− Tнo\n\" class=\"math-display\
