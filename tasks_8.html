y\">\n<img alt=\"     Pt    50000 ⋅10\nc = mΔT--= -5⋅200--= 500 Дж/ (кг ⋅К )\n\" class=\"math-display\" src=\"index-e026f54d421f1f7ff252d5859d3e73cb.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-93161af31ec9877e86ab38e2bdccb761.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282745/index-93161af31ec9877e86ab38e2bdccb761.svg", "index-6f8a248e98369f3a55dacdd5a74d26b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282745/index-6f8a248e98369f3a55dacdd5a74d26b3.svg", "index-5120e3ee1fd56e0ddb6c9f14b0bca030.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282745/index-5120e3ee1fd56e0ddb6c9f14b0bca030.svg", "135531.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282745/135531.png", "index-206b00ed7bb007fbea8fecfe3f8f012a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282746/index-206b00ed7bb007fbea8fecfe3f8f012a.svg", "index-1c9b7722feabb814e6eb74b44b24b012.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282746/index-1c9b7722feabb814e6eb74b44b24b012.svg", "index-e026f54d421f1f7ff252d5859d3e73cb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/282746/index-e026f54d421f1f7ff252d5859d3e73cb.svg"}, "tags": ["Статград 16.05.2022 Физика 2"], "sources": ["CтатГрад 16.05.2022 Физика 2"], "created_at": "2025-08-14T05:09:00Z", "updated_at": "2026-04-18T14:26:56Z"}, {"id": 136194, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Каким должно быть отношение масс медного и чугунного тел, чтобы при получении одного и того же количества теплоты они\nнагрелись на одно и то же число градусов? Ответ округлите до десятых долей.\n</p>", "solution_html": "<p class=\"noindent\">При нагреве любое тело поулчает количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cm Δt\n\" class=\"math-display\" src=\"index-15e3e53ee8a79ad05753bace826528a9.svg\"/></div>\n<p class=\"indent\">   Тела получили одинаковое количество теплоты и нагрелись на одну и ту же температуру:\n</p> <div class=\"math-display\">\n<img alt=\"cчm ч = cмmм\n\" class=\"math-display\" src=\"index-8a0aad958d63f1f9c6b413465fb6a8fe.svg\"/></div>\n<p class=\"indent\">   Выразим нужное нам отношение:\n</p> <div class=\"math-display\">\n<img alt=\"m-м  -cч   500\nm ч = cм = 380 ≈ 1,3\n\" class=\"math-display\" src=\"index-f9344394eb7082f6420dbd8458aab11f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-15e3e53ee8a79ad05753bace826528a9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/284917/index-15e3e53ee8a79ad05753bace826528a9.svg", "index-8a0aad958d63f1f9c6b413465fb6a8fe.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/284917/index-8a0aad958d63f1f9c6b413465fb6a8fe.svg", "index-f9344394eb7082f6420dbd8458aab11f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/284917/index-f9344394eb7082f6420dbd8458aab11f.svg"}, "tags": ["Статград 09.12.2022 Физика 2"], "sources": ["CтатГрад 09.12.2022 Физика 2"], "created_at": "2025-08-19T09:03:17Z", "updated_at": "2026-04-18T14:27:05Z"}, {"id": 136484, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В ходе некоторого процесса температура 1 моля аргона повышается на 100 К. В этом процессе удельная теплоёмкость аргона\nпостоянна и равна 1236,6 <img alt=\"Д ж∕(кг⋅∘C ).  \" class=\"math\" src=\"index-76e8c21e4404a0310b45b40c80de9cc4.svg\"/> Какую работу совершает аргон в этом процессе? Ответ дайте в Дж и округлите до целого\nчисла.\n</p>", "solution_html": "<p class=\"noindent\">Применим первый закон термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   Полученное количество теплоты распишем как: <img alt=\"Q = cmΔT  \" class=\"math\" src=\"index-f92c868180724ae72fb68cfccfc1b8d3.svg\"/>, где масса аргона равна <img alt=\"m = M ν  \" class=\"math\" src=\"index-fd6a50b7d3629beca12d180e6cb55d03.svg\"/><br/>Внутреннюю энергию распишем как <img alt=\"      3\nΔU  = 2νRΔT  \" class=\"math\" src=\"index-3322a23e0e02c3fc8f576e7982386209.svg\"/><br/>Тогда искомая работа газа:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU  =νΔT (cM − 1,5R) = 1⋅100 ⋅(1236,6⋅40⋅10−3− 1,5⋅8,31)≈ 3700 Дж\n\" class=\"math-display\" src=\"index-2c697c543299a94c3d0ff1ee30c3bff5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-76e8c21e4404a0310b45b40c80de9cc4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/285548/index-76e8c21e4404a0310b45b40c80de9cc4.svg", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290725/index-bd94ff284644b2773b552a8c5529b561.svg", "index-f92c868180724ae72fb68cfccfc1b8d3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290725/index-f92c868180724ae72fb68cfccfc1b8d3.svg", "index-fd6a50b7d3629beca12d180e6cb55d03.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290725/index-fd6a50b7d3629beca12d180e6cb55d03.svg", "index-3322a23e0e02c3fc8f576e7982386209.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290725/index-3322a23e0e02c3fc8f576e7982386209.svg", "index-2c697c543299a94c3d0ff1ee30c3bff5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290725/index-2c697c543299a94c3d0ff1ee30c3bff5.svg"}, "tags": ["Статград 19.10.2021 Физика 1"], "sources": ["CтатГрад 19.10.2021 Физика 1"], "created_at": "2025-08-21T07:14:07Z", "updated_at": "2026-04-18T14:35:13Z"}, {"id": 137057, "name": "КПД. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловой двигатель, работающий по циклу Карно, имеет нагреватель с температурой +127 <img alt=\"∘\n C  \" class=\"math\" src=\"index-f2bc5ffbcf7596139f1a657ac5b4a170.svg\"/> и холодильник с температурой +27\n<img alt=\"∘C  \" class=\"math\" src=\"index-819d98572b6af250a4ab268759996333.svg\"/>. Какую работу совершает этот двигатель за три цикла работы, если за каждый цикл он получает от нагревателя количество\nтеплоты, равное 2 кДж? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины найдем по формулам <img alt=\"   T1−-T2\nη =  T1  \" class=\"math\" src=\"index-527888d33e835fded26c1daae811607c.svg\"/> и <img alt=\"   A--\nη = Q1  \" class=\"math\" src=\"index-6a6e464f4718234ffa8183220dc3af52.svg\"/>. Объединяя их, найдем работу теплового двигателя за один\nцикл работы:\n</p> <div class=\"math-display\">\n<img alt=\"   (T − T )Q    (400− 300)⋅2\nA= --1-T-2--1 = ----400----= 0,5 кД ж\n        1\n\" class=\"math-display\" src=\"index-860877a74b7deaf205867e65a249d4d8.svg\"/></div>\n<p class=\"indent\">   Тогда за три цикла работа теплового двигателя будет равна 1,5 кДж.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f2bc5ffbcf7596139f1a657ac5b4a170.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286868/index-f2bc5ffbcf7596139f1a657ac5b4a170.svg", "index-819d98572b6af250a4ab268759996333.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286868/index-819d98572b6af250a4ab268759996333.svg", "index-527888d33e835fded26c1daae811607c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286869/index-527888d33e835fded26c1daae811607c.svg", "index-6a6e464f4718234ffa8183220dc3af52.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286869/index-6a6e464f4718234ffa8183220dc3af52.svg", "index-860877a74b7deaf205867e65a249d4d8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286869/index-860877a74b7deaf205867e65a249d4d8.svg"}, "tags": ["Статград 20.12.2021 Физика 1"], "sources": ["CтатГрад 20.12.2021 Физика 1"], "created_at": "2025-08-23T18:39:27Z", "updated_at": "2026-04-18T14:50:43Z"}, {"id": 137059, "name": "КПД. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Тепловой двигатель, работающий по циклу Карно, имеет нагреватель с температурой +127 <img alt=\"∘\n C  \" class=\"math\" src=\"index-f2bc5ffbcf7596139f1a657ac5b4a170.svg\"/> и холодильник с температурой +27\n<img alt=\"∘C  \" class=\"math\" src=\"index-819d98572b6af250a4ab268759996333.svg\"/>. Какое количество теплоты этот двигатель отдаёт холодильнику за один цикл работы, если за каждый цикл он получает от\nнагревателя количество теплоты, равное 2 кДж? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">КПД тепловой машины найдем по формулам <img alt=\"      T2\nη = 1− T1  \" class=\"math\" src=\"index-336662c284fd3582906d8e4296d8c9a1.svg\"/> и <img alt=\"      Q2-\nη = 1− Q1  \" class=\"math\" src=\"index-90d6fd9267a66a49cb66569a0794f6b3.svg\"/>. Найдем количество теплоты, отданное холодильнику за\nцикл:\n</p> <div class=\"math-display\">\n<img alt=\"     T Q   300 ⋅2\nQ2 = -2T-1= --400- = 1,5 кДж\n       1\n\" class=\"math-display\" src=\"index-943270f2084d134fe1aa89e3c132da4b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f2bc5ffbcf7596139f1a657ac5b4a170.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286872/index-f2bc5ffbcf7596139f1a657ac5b4a170.svg", "index-819d98572b6af250a4ab268759996333.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286872/index-819d98572b6af250a4ab268759996333.svg", "index-336662c284fd3582906d8e4296d8c9a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286873/index-336662c284fd3582906d8e4296d8c9a1.svg", "index-90d6fd9267a66a49cb66569a0794f6b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286873/index-90d6fd9267a66a49cb66569a0794f6b3.svg", "index-943270f2084d134fe1aa89e3c132da4b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286873/index-943270f2084d134fe1aa89e3c132da4b.svg"}, "tags": ["Статград 20.12.2021 Физика 2"], "sources": ["CтатГрад 20.12.2021 Физика 2"], "created_at": "2025-08-23T18:43:50Z", "updated_at": "2026-04-18T14:50:34Z"}, {"id": 137061, "name": "Теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Для нагревания на 20 <img alt=\"∘\nC  \" class=\"math\" src=\"index-f19dbd4fcdb363d8b6c2d72fae79bf85.svg\"/> алюминиевой детали потребовалось сообщить ей некоторое количество теплоты. На сколько\nградусов нагреется чугунная деталь той же массы, если сообщить ей такое же количество теплоты? Ответ дайте в\n<img alt=\"∘C  \" class=\"math\" src=\"index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, необходимое для нагревания тела <img alt=\"Q = cm Δt  \" class=\"math\" src=\"index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg\"/>. Учитывая, что массы тел одинаковые, количество теплоты\nполучено обоими телами одинаковое, получаем <img alt=\"cаΔtа = cчΔtч  \" class=\"math\" src=\"index-58710f0522f134a79fdae24302e8c801.svg\"/>. Откуда\n</p> <div class=\"math-display\">\n<img alt=\"      cΔt    900⋅20\nΔtч = аc-а-= -500--= 36 ∘C\n        ч\n\" class=\"math-display\" src=\"index-1934f3528ec53828c05fe54150c2b940.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f19dbd4fcdb363d8b6c2d72fae79bf85.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286876/index-f19dbd4fcdb363d8b6c2d72fae79bf85.svg", "index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286876/index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg", "index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286877/index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg", "index-58710f0522f134a79fdae24302e8c801.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286877/index-58710f0522f134a79fdae24302e8c801.svg", "index-1934f3528ec53828c05fe54150c2b940.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286877/index-1934f3528ec53828c05fe54150c2b940.svg"}, "tags": ["Статград 20.12.2021 Физика 1"], "sources": ["CтатГрад 20.12.2021 Физика 1"], "created_at": "2025-08-23T18:57:30Z", "updated_at": "2026-04-18T14:50:27Z"}, {"id": 137064, "name": "Теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Для нагревания на 72 <img alt=\"∘\n C  \" class=\"math\" src=\"index-de9aadc03b0901f18dc7a9dd69915f77.svg\"/> чугунной детали потребовалось сообщить ей некоторое количество теплоты. На сколько\nградусов нагреется алюминиевая деталь той же массы, если сообщить ей такое же количество теплоты? Ответ дайте в\n<img alt=\"∘C  \" class=\"math\" src=\"index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, необходимое для нагревания тела <img alt=\"Q = cm Δt  \" class=\"math\" src=\"index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg\"/>. Учитывая, что массы тел одинаковые, количество теплоты\nполучено обоими телами одинаковое, получаем <img alt=\"cаΔtа = cчΔtч  \" class=\"math\" src=\"index-58710f0522f134a79fdae24302e8c801.svg\"/>. Откуда\n</p> <div class=\"math-display\">\n<img alt=\"     c Δt    500⋅72\nΔtа =-чc-ч = -900--= 40 ∘C\n        а\n\" class=\"math-display\" src=\"index-e72bc1b4fb3b088b4293b87fe7050368.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-de9aadc03b0901f18dc7a9dd69915f77.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286882/index-de9aadc03b0901f18dc7a9dd69915f77.svg", "index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286882/index-4c197a08e1e537b5ce3c842a8eb3ac8f.svg", "index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286883/index-7ae1b6f8d6d8598eb53902cbed4caf5c.svg", "index-58710f0522f134a79fdae24302e8c801.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286883/index-58710f0522f134a79fdae24302e8c801.svg", "index-e72bc1b4fb3b088b4293b87fe7050368.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/286883/index-e72bc1b4fb3b088b4293b87fe7050368.svg"}, "tags": ["Статград 20.12.2021 Физика 2"], "sources": ["CтатГрад 20.12.2021 Физика 2"], "created_at": "2025-08-23T19:02:41Z", "updated_at": "2026-04-18T14:50:18Z"}, {"id": 137541, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Чему равна работа, совершённая двумя молями идеального газа в процессе 1–2–3–4, показанном на рисунке, если в состоянии 1\nдавление равно 60 кПа, а объём - 1 л? Ответ дайте в Дж.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"137541.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа за цикл ЧИСЛЕННО равна площади фигуры:\n</p> <div class=\"math-display\">\n<img alt=\"             3          −3\nA= (60− 15)⋅10 ⋅(4− 1)⋅10  = 135 Д ж\n\" class=\"math-display\" src=\"index-b2a58024e35c72e18bfabc2a2ade49d9.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"137541.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287843/137541.png", "index-b2a58024e35c72e18bfabc2a2ade49d9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/287844/index-b2a58024e35c72e18bfabc2a2ade49d9.svg"}, "tags": ["Статград 07.12.2023 Физика 1"], "sources": ["CтатГрад 07.12.2023 Физика 1"], "created_at": "2025-08-26T08:52:23Z", "updated_at": "2026-04-18T14:52:06Z"}, {"id": 137804, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Чему равна работа, совершённая тремя молями идеального газа в процессе 1–2–3–4, показанном на рисунке, если в состоянии 1\nдавление равно 80 кПа, а объём – 2 л? Ответ дайте в Дж.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"137541.png\" width=\"315\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа за цикл равна площади фигуры:\n</p> <div class=\"math-display\">\n<img alt=\"             3          −3\nA= (80− 20)⋅10 ⋅(8− 2)⋅10  = 360 Д ж\n\" class=\"math-display\" src=\"index-5be82c6cda855a192c860f8a5271694e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"137541.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/288428/137541.png", "index-5be82c6cda855a192c860f8a5271694e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/288429/index-5be82c6cda855a192c860f8a5271694e.svg"}, "tags": ["Статград 07.12.2023 Физика 2"], "sources": ["CтатГрад 07.12.2023 Физика 2"], "created_at": "2025-08-26T18:06:10Z", "updated_at": "2026-04-18T14:52:24Z"}, {"id": 138693, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ занимал объём 3 л при давлении 400 кПа. Затем газ расширился и стал занимать объём 5 л при\nдавлении 200 кПа. В этом процессе газ совершил работу 500 Дж. Какое количество теплоты получил газ в этом процессе, если масса\nгаза в сосуде неизменна? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Найдем изменение внутренней энергии идеального газа <img alt=\"                                    5     −3      5     −3\nΔU = U2− U1 = 1,5(p2V2− p1V1)= 1,5(2⋅10 ⋅5⋅10 − 4⋅10 ⋅3⋅10  )= −300 Д ж  \" class=\"math\" src=\"index-e1c1e313bff4ea1daaf1680848662b86.svg\"/><br/>По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU = 500− 300= 200 Д ж\n\" class=\"math-display\" src=\"index-fcfac052c9851aa1efbe15e96d3581b3.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e1c1e313bff4ea1daaf1680848662b86.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290458/index-e1c1e313bff4ea1daaf1680848662b86.svg", "index-fcfac052c9851aa1efbe15e96d3581b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290458/index-fcfac052c9851aa1efbe15e96d3581b3.svg"}, "tags": ["Статград 17.05.2021 Физика 1"], "sources": ["CтатГрад 17.05.2021 Физика 1"], "created_at": "2025-08-30T07:19:52Z", "updated_at": "2026-07-01T14:45:28Z"}, {"id": 138694, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Идеальный одноатомный газ занимал объём 4 л при давлении 300 кПа. Затем газ расширился и стал занимать объём 6 л при\nдавлении 150 кПа. В этом процессе газ совершил работу 550 Дж. Какое количество теплоты получил газ в этом процессе, если масса\nгаза в сосуде неизменна? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Найдем изменение внутренней энергии идеального газа <img alt=\"                                     5     − 3     5     −3\nΔU = U2− U1 = 1,5(p2V2− p1V1)= 1,5(1,5⋅10 ⋅6⋅10 − 3 ⋅10 ⋅4 ⋅10 )= − 450 Дж  \" class=\"math\" src=\"index-96ffbc94d8fd0979c55908c9667673a1.svg\"/><br/>По первому закону термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q =A + ΔU = 550− 450= 100 Д ж\n\" class=\"math-display\" src=\"index-6b6896700059c1fd562fb4319b4ef49d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-96ffbc94d8fd0979c55908c9667673a1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290460/index-96ffbc94d8fd0979c55908c9667673a1.svg", "index-6b6896700059c1fd562fb4319b4ef49d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290460/index-6b6896700059c1fd562fb4319b4ef49d.svg"}, "tags": ["Статград 17.05.2021 Физика 2"], "sources": ["CтатГрад 17.05.2021 Физика 2"], "created_at": "2025-08-30T07:23:46Z", "updated_at": "2026-04-18T14:53:05Z"}, {"id": 138696, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В медный калориметр массой 500 г, находившийся при температуре <img alt=\"  ∘\n20 C  \" class=\"math\" src=\"index-8e0d017e60672ea30bcf45577c5ef5da.svg\"/>, налили 200 г воды, температура которой была равна\n<img alt=\"50∘C  \" class=\"math\" src=\"index-e67c8d633f66aa7a22fc4bb327ef393f.svg\"/>. Через некоторое время, когда между водой и калориметром установилось тепловое равновесие, температура воды в нём\nоказалась равной <img alt=\"40∘C  \" class=\"math\" src=\"index-340dea76ca447db1a4c3cd87260fc004.svg\"/>. Какое количество теплоты было отдано водой и калориметром в окружающую среду? Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">Теплота, полученная калориметром, равна <img alt=\"Q1 = m1c1(t− t1)= 0,5⋅380⋅(40 − 20)= 3800 Д ж  \" class=\"math\" src=\"index-3d4485a56f70236d56f216265acf2bf4.svg\"/><br/>Теплота, отданная водой, равна <img alt=\"Q2 =m2c2(t− t2)= 0,2⋅4200⋅(40 − 50)= − 8400 Дж  \" class=\"math\" src=\"index-a4ca9f85da2079286866c9ed70b9be3e.svg\"/><br/>Теплота, отданная в окружающую среду, равна <img alt=\"Q =|Q2|− Q1 = 8400− 3800= 4600 Дж  \" class=\"math\" src=\"index-6ab687c14a303988f45dab5d85299698.svg\"/>\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-8e0d017e60672ea30bcf45577c5ef5da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290462/index-8e0d017e60672ea30bcf45577c5ef5da.svg", "index-e67c8d633f66aa7a22fc4bb327ef393f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290462/index-e67c8d633f66aa7a22fc4bb327ef393f.svg", "index-340dea76ca447db1a4c3cd87260fc004.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290462/index-340dea76ca447db1a4c3cd87260fc004.svg", "index-3d4485a56f70236d56f216265acf2bf4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290463/index-3d4485a56f70236d56f216265acf2bf4.svg", "index-a4ca9f85da2079286866c9ed70b9be3e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290463/index-a4ca9f85da2079286866c9ed70b9be3e.svg", "index-6ab687c14a303988f45dab5d85299698.svg": "https://3.shkolkovo.online/ap       5         5\nQ2 = mλ = 0,9 ⋅3,3 ⋅10 = 2,97⋅10 Дж,\n\" class=\"math-display\" src=\"index-3b6e0ee73207e71d194473b9f051f01a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-8bd76e942f2d5ac31e878b71ed27639f.svg\"/> – масса льда, <img alt=\"λ  \" class=\"math\" src=\"index-3d3fb444712f1c0e94893c2c41c4c3f7.svg\"/> – удельная теплоты плавления льда. <br/>КПД тепловой машины через количество теплоты <img alt=\"Q1  \" class=\"math\" src=\"index-49d2d121bb7203da8893229c9277edd5.svg\"/>, полученное от нагревателя, и количество теплоты <img alt=\"Q2  \" class=\"math\" src=\"index-0a325aca9cdefde0de44109ab40b6c2b.svg\"/>, отданное\nхолодильнику, определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"η =1 − Q2,\n       Q1\n\" class=\"math-display\" src=\"index-639393ea2f87d85b7d46dabd1b50c598.svg\"/></div>\n<p class=\"indent\">   откуда получаем, что\n</p> <div class=\"math-display\">\n<img alt=\"     -Q2-   2,97⋅105-\nQ1 = 1− η =  1− 0,1  = 330 кДж.\n\" class=\"math-display\" src=\"index-0664f4b5e050d36c6e7e9caf24728fbb.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3b6e0ee73207e71d194473b9f051f01a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290921/index-3b6e0ee73207e71d194473b9f051f01a.svg", "index-8bd76e942f2d5ac31e878b71ed27639f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290921/index-8bd76e942f2d5ac31e878b71ed27639f.svg", "index-3d3fb444712f1c0e94893c2c41c4c3f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290921/index-3d3fb444712f1c0e94893c2c41c4c3f7.svg", "index-49d2d121bb7203da8893229c9277edd5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290921/index-49d2d121bb7203da8893229c9277edd5.svg", "index-0a325aca9cdefde0de44109ab40b6c2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/290921/index-0a325aca9cdefde0de44109ab40b6c2b.svg", "index-639393ea2f87d85b7d46dabd1b50c598.svg": "https:// г упал в холодное северное море, температура воды в котором равна <img alt=\" ∘\n0 C  \" class=\"math\" src=\"index-9fa5288033f66f31f10a5168bf9c197e.svg\"/>. Перед попаданием в воду\nметеорит двигался со скоростью 2 км/с и был разогрет до температуры <img alt=\"1000∘C  \" class=\"math\" src=\"index-185b829255ba3ec6fa84cc3130881d87.svg\"/>. Какое коли- чество теплоты выделилось при\nторможении и остывании метеорита в воде? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Из уравнения теплообмена следует, что количество теплоты, полученное водой, равно по модулю сумме изменения кинетической\nэнергии железного метеорита при торможении и выделившегося при охлаждении количества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"    mV 2           ( V2     )     ( 20002          )\nQ = --2- + mcΔt =m   2--+cΔt  = 1⋅  -2--+ 460⋅1000 = 2460 кД ж\n\" class=\"math-display\" src=\"index-1326bca998d92a87fd117bbe57a75afc.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9fa5288033f66f31f10a5168bf9c197e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291293/index-9fa5288033f66f31f10a5168bf9c197e.svg", "index-185b829255ba3ec6fa84cc3130881d87.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291293/index-185b829255ba3ec6fa84cc3130881d87.svg", "index-1326bca998d92a87fd117bbe57a75afc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291294/index-1326bca998d92a87fd117bbe57a75afc.svg"}, "tags": ["Статград 04.02.2021 Физика 1"], "sources": ["CтатГрад 04.02.2021 Физика 1"], "created_at": "2025-08-31T07:23:33Z", "updated_at": "2026-04-18T14:55:17Z"}, {"id": 139072, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Железный метеорит массой 1,5 кг упал в холодное северное море, температура воды в котором равна <img alt=\" ∘\n0C  \" class=\"math\" src=\"index-e760ea0a0c0cf9c5e861214edefac7c3.svg\"/>. Перед попаданием в\nводу метеорит двигался со скоростью 3 км/с и был разогрет до температуры <img alt=\"1200∘C  \" class=\"math\" src=\"index-53d0c90b5d304d81562f9445fdeb623d.svg\"/>. Какое коли- чество теплоты выделилось при\nторможении и остывании метеорита в воде? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Из уравнения теплообмена следует, что количество теплоты, полученное водой, равно по модулю сумме изменения кинетической\nэнергии железного метеорита при торможении и выделившегося при охлаждении количества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"    mV 2          ( V2     )       (30002          )\nQ = -2--+ mcΔt = m  -2-+ cΔt  = 1,5⋅ --2--+ 460⋅1200 = 7578 кД ж\n\" class=\"math-display\" src=\"index-19914b0d33c485cd84a19be17d318425.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e760ea0a0c0cf9c5e861214edefac7c3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291295/index-e760ea0a0c0cf9c5e861214edefac7c3.svg", "index-53d0c90b5d304d81562f9445fdeb623d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291295/index-53d0c90b5d304d81562f9445fdeb623d.svg", "index-19914b0d33c485cd84a19be17d318425.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/291296/index-19914b0d33c485cd84a19be17d318425.svg"}, "tags": ["Статград 04.02.2021 Физика 2"], "sources": ["CтатГрад 04.02.2021 Физика 2"], "created_at": "2025-08-31T07:26:52Z", "updated_at": "2026-04-18T14:55:29Z"}, {"id": 139109, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-b38cff065df04a68688e910527f0c551.svg\"/>-диаграмме изображены два цикла, рабочим телом в каждом из которых служит идеальный газ. Найдите модуль отношения\nработы, совершаемой газом за цикл 1, к работе, совершаемой газом за цикл 2. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"139109.png\" width=\"210\"/> < ay\">\n<img alt=\"                                              6\nQ = Q1+ Q2 = m(c(Tk − T )+ L)= 2⋅(4200 ⋅50 +2,3⋅10 )= 5020 кДж\n\" class=\"math-display\" src=\"index-68124eb467f94777642769507966193e.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d29c5dd0dbe346160b2a8aa575365b92.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292806/index-d29c5dd0dbe346160b2a8aa575365b92.svg", "index-a369c66f591231b8f9da32642ba696cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292807/index-a369c66f591231b8f9da32642ba696cf.svg", "index-8c201c390b392256cd688bb25c3eb20b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292807/index-8c201c390b392256cd688bb25c3eb20b.svg", "index-68124eb467f94777642769507966193e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292807/index-68124eb467f94777642769507966193e.svg"}, "tags": ["Статград 17.01.2023 Физика 1"], "sources": ["CтатГрад 17.01.2023 Физика 1"], "created_at": "2025-09-04T07:44:47Z", "updated_at": "2026-04-18T14:58:17Z"}, {"id": 139627, "name": "Задача на теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Какое количество теплоты нужно сообщить 2 кг воды, нагретой до температуры <img alt=\" ∘\n40 C  \" class=\"math\" src=\"index-75f2c195b54d7037b4da3d13472a792f.svg\"/>, чтобы ровно половина воды выкипела?\nОтвет дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Для нагревания воды от начальной температуры до температуры кипения потребуется количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q1 = cm (Tk − T)\n\" class=\"math-display\" src=\"index-a369c66f591231b8f9da32642ba696cf.svg\"/></div>\n<p class=\"indent\">   При кипении потраченное количество теплоты равно <img alt=\"      m-\nQ2 = L 2  \" class=\"math\" src=\"index-652cdd04eff33695a57b1d0ac99637b6.svg\"/>. Тогда общее количество теплоты равно:\n</p> <div class=\"math-display\">\n<img alt=\"                        L                2,3⋅106\nQ =Q1 + Q2 = m (c(Tk − T)+ 2-)= 2⋅(4200 ⋅60 +-2---)= 2804 кД ж\n\" class=\"math-display\" src=\"index-d800adfe6158b5b400834fb997647a04.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-75f2c195b54d7037b4da3d13472a792f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292808/index-75f2c195b54d7037b4da3d13472a792f.svg", "index-a369c66f591231b8f9da32642ba696cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292809/index-a369c66f591231b8f9da32642ba696cf.svg", "index-652cdd04eff33695a57b1d0ac99637b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292809/index-652cdd04eff33695a57b1d0ac99637b6.svg", "index-d800adfe6158b5b400834fb997647a04.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/292809/index-d800adfe6158b5b400834fb997647a04.svg"}, "tags": ["Статград 17.01.2023 Физика 2"], "sources": ["CтатГрад 17.01.2023 Физика 2"], "created_at": "2025-09-04T07:47:32Z", "updated_at": "2026-04-18T14:58:39Z"}, {"id": 139628, "name": "Задача на теплоёмкость. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Температура холодильника <img alt=\"  ∘\n27 C  \" class=\"math\" src=\"index-85f14ebfb10e0cdfda9ee670e63207ff.svg\"/>, температура нагревателя на 300 К больше, чем у холодильника. Чему равен\nмаксимально возможный КПД теплового двигателя, работающего с этими холодильником и нагревателем? Ответ дайте в\n<img alt=\"%  \" class=\"math\" src=\"index-08f72cb5a4fac964d66642c4ce7c068e.svg\"/>.\n</p>", "solution_html": "<p class=\"noindent\">Температура холодильника равна 300 К, а нагревателя – 600 К. КПД идеального теплового двигателя равно\n</p> <div class=\"math-display\">\n<img alt=\"    T1− T2        300\nη = --T1--⋅100% = 600-⋅100% = 50%\n\" class=\"math-display\" src=\"index-2f266c4e76da8b3f96570ade7185824c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-85f14ebfb10e0cdfda9e 23e6.svg"}, "tags": ["Статград 17.01.2023 Физика 1"], "sources": ["CтатГрад 17.01.2023 Физика 1"], "created_at": "2025-09-04T07:51:50Z", "updated_at": "2026-04-28T11:29:10Z"}, {"id": 141125, "name": "СтатГрад ЕГЭ 25.09.2020 Термодинамика 2 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Идеальная тепловая машина, обладающая КПД 10%, использует в качестве холодильника резервуар со льдом при температуре 0 <span class=\"tcrm-0900\">°</span>C.\nЗа один цикл работы этой машины в холодильнике тает 1,8 кг льда. Какое количество теплоты потребляет эта машина от\nнагревателя за один цикл работы? <br/>Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Для плавления льда требуется количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"                   5         5\nQ2 = mλ = 1,8 ⋅3,3 ⋅10 = 5,94⋅10 Дж,\n\" class=\"math-display\" src=\"index-e03cb8d5d775b98a53e350beea59182e.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"m  \" class=\"math\" src=\"index-8bd76e942f2d5ac31e878b71ed27639f.svg\"/> – масса льда, <img alt=\"λ  \" class=\"math\" src=\"index-3d3fb444712f1c0e94893c2c41c4c3f7.svg\"/> – удельная теплоты плавления льда. <br/>КПД тепловой машины через количество теплоты <img alt=\"Q1  \" class=\"math\" src=\"index-49d2d121bb7203da8893229c9277edd5.svg\"/>, полученное от нагревателя, и количество теплоты <img alt=\"Q2  \" class=\"math\" src=\"index-0a325aca9cdefde0de44109ab40b6c2b.svg\"/>, отданное\nхолодильнику, определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"η =1 − Q2,\n       Q1\n\" class=\"math-display\" src=\"index-639393ea2f87d85b7d46dabd1b50c598.svg\"/></div>\n<p class=\"indent\">   откуда получаем, что\n</p> <div class=\"math-display\">\n<img alt=\"     -Q2-   5,94⋅105-\nQ1 = 1− η =  1− 0,1  = 660 кДж.\n\" class=\"math-display\" src=\"index-b0485a9eceaf5e72924ad03ccbc19539.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-e03cb8d5d775b98a53e350beea59182e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-e03cb8d5d775b98a53e350beea59182e.svg", "index-8bd76e942f2d5ac31e878b71ed27639f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-8bd76e942f2d5ac31e878b71ed27639f.svg", "index-3d3fb444712f1c0e94893c2c41c4c3f7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-3d3fb444712f1c0e94893c2c41c4c3f7.svg", "index-49d2d121bb7203da8893229c9277edd5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-49d2d121bb7203da8893229c9277edd5.svg", "index-0a325aca9cdefde0de44109ab40b6c2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-0a325aca9cdefde0de44109ab40b6c2b.svg", "index-639393ea2f87d85b7d46dabd1b50c598.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-639393ea2f87d85b7d46dabd1b50c598.svg", "index-b0485a9eceaf5e72924ad03ccbc19539.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/296148/index-b0485a9eceaf5e72924ad03ccbc19539.svg"}, "tags": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "sources": ["СтатГрад ЕГЭ 25.09.2020 2 вариант"], "created_at": "2025-09-11T09:08:49Z", "updated_at": "2026-04-18T14:59:10Z"}, {"id": 141691, "name": "СтатГрад ЕГЭ 14.12.2020 Термодинамика 1 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Для приведения в действие паровой машины в топке сжигают каменный уголь. Температура в топке составляет 1200 <span class=\"tcrm-0900\">°</span>C.\nСчитая, что в качестве холодильника паровая машина использует атмосферу, температура которой равна 20 <span class=\"tcrm-0900\">°</span>C,\nопределите максимальный теоретически возможный КПД этой паровой машины. Ответ дайте в % и округлите до целого\nчисла.\n</p>", "solution_html": "<p class=\"noindent\">Максимальным теоретически возможным КПД тепловой машины будет КПД тепловой машины Карно, который имеет\nформулу:\n</p> <div class=\"math-display\">\n<img alt=\"   T  − T\nη =-+T---−⋅100%,\n       +\n\" class=\"math-display\" src=\"index-05d52a4276644304015fb563d7a2f305.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"T+  \" class=\"math\" src=\"index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg\"/> – температура нагревателя (в К), <img alt=\"T− \" class=\"math\" src=\"index-7cc3c1c6e69ba2b51a226a46d5e1f0f8.svg\"/> – температура холодильника (в К). <br/>В нашем случае КПД будет равняться:\n</p> <div class=\"math-display\">\n<img alt=\"    (1200-+273)−-(20-+273)\nη =       1200 +273      ⋅100% ≈ 80%.\n\" class=\"math-display\" src=\"index-ef6d38839db7c54bb9fe5e10c266915f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-05d52a4276644304015fb563d7a2f305.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297363/index-05d52a4276644304015fb563d7a2f305.svg", "index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297363/index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg", "index-7cc3c1c6e69ba2b51a226a46d5e1f0f8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297363/index-7cc3c1c6e69ba2b51a226a46d5e1f0f8.svg", "index-ef6d38839db7c54bb9fe5e10c266915f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297363/index-ef6d38839db7c54bb9fe5e10c266915f.svg"}, "tags": ["СтатГрад ЕГЭ 14.12.2020 1 вариант"], "sources": ["СтатГрад ЕГЭ 14.12.2020 1 вариант"], "created_at": "2025-09-14T09:00:06Z", "updated_at": "2026-04-18T14:59:21Z"}, {"id": 141692, "name": "СтатГрад ЕГЭ 14.12.2020 Термодинамика. Количество теплоты 1 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Два моля идеального одноатомного газа находятся в состоянии 1 (см. рис.) при температуре 200 К. Газ совершает циклический\nпроцесс, изображённый на диаграмме. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"315\" src=\"141692.png\" width=\"315\"/></p></div>\n<p class=\"noindent\">Какое количество теплоты получает газ на участке 1–2 этого циклического процесса? Ответ дайте в кДж. Округлите до целого\nчисла.\n</p>", "solution_html": "<p class=\"noindent\">Запишем первое начало термодинамики для процесса 1-2:\n</p> <div class=\"math-display\">\n<img alt=\"Q1−2 = ΔU1− 2+ A1−2,\n\" class=\"math-display\" src=\"index-40e2b7b83d038d1c9065a03df4b782e8.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"Q1−2  \" class=\"math\" src=\"index-93ae35d2bcd3103c8d7fb35d55fcc2bc.svg\"/> – количество теплоты, которое получается газ в процессе 1-2, <img alt=\"ΔU1 −2  \" class=\"math\" src=\"index-aa007a50bb0df321dcb591c8fea7412e.svg\"/> – изменение внутренней энергии газа в процессе\n1-2, <img alt=\"A1−2  \" class=\"math\" src=\"index-ced9f696d6912486c26d31d05521ce1b.svg\"/> – работа газа в процессе 1-2. <br/>Так как процесс 1-2 происходит при постоянном объеме, то <img alt=\"A1−2 = 0  \" class=\"math\" src=\"index-f1ac85ea581a2053b74a51463eb213f3.svg\"/>. В общем случае для изменения внутренней энергии газа\nсправедлива формула:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 3νR ΔT,\n     2\n\" class=\"math-display\" src=\"index-36aea099a28a9887f6b82fbed670e9d9.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-be8757da9d9d1483f7e5c2f637cf3d7b.svg\"/> – количество вещества, <img alt=\"R  \" class=\"math\" src=\"index-00b7a83240ad8710ca32dc4b03916cb5.svg\"/> – универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-85388cbfbb09a6c959db8223ea74bde1.svg\"/> – изменение абсолютной температуры газа.\n<br/>Запишем уравнение Менделеева-Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT,\n\" class=\"math-display\" src=\"index-c6b31c56f5437a267f864b1df81c1335.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-358aa8c33fff927fbfb31881b6d6c160.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-9cb0e059e277c3630cbab1e73a8b8a8f.svg\"/> – объем газа. <br/>Для состояния системы в точке 1 справедливо: <img alt=\"1p0V0 = νRT1\n2  \" class=\"math\" src=\"index-44bfa4409f8aaccee4093e472424dd1e.svg\"/>, а для состояния системы в точке 2: <img alt=\"5p0V0 = νRT2  \" class=\"math\" src=\"index-28a205842839549d0345bf8da4707ce8.svg\"/>. Найдем из\nотношения этих уравнений <img alt=\"T2  \" class=\"math\" src=\"index-60ae63d002f429e624d9413562fe5a17.svg\"/> следующим образом:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"1\n2p0V0  νRT1-\n5p0V0 = νRT2 ⇒ T2 =10T1 =10 ⋅200 =2000 К.\n\" class=\"math-display\" src=\"index-fb7209f6952be32dd9e0a144d7bcecfc.svg\"/></div>\n<p class=\"indent\">   Тогда количество теплоты равняется:\n</p> <div class=\"math-display\">\n<img alt=\"Q1−2 = ΔU1− 2 = 3νR(T2− T1)= 3 ⋅2 ⋅8,31⋅(2000− 200)⋅10−3 ≈ 45 кДж.\n              2            2\n\" class=\"math-display\" src=\"index-0d2fd0b976864b283b1a2935e3573ad2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"141692.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297364/141692.png", "index-40e2b7b83d038d1c9065a03df4b782e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297365/index-40e2b7b83d038d1c9065a03df4b782e8.svg", "index-93ae35d2bcd3103c8d7fb35d55fcc2bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297365/index-93ae35d2bcd3103c8d7fb35d55fcc2bc.svg", "index-aa007a50bb0df321dcb591c8fea7412e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297365/index-aa007a50bb0df321dcb591c8fea7412e.svg", "index-ced9f696d6912486c26d31d05521ce1b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/297365/index-ced9f696d6912486c26d31d05521ce1b.svg", "index-f1ac85ea581a2053b74a51463eb213f3.svg": "https://3.shkolkovo.online/api/latex-s 020 1 вариант"], "sources": ["СтатГрад ЕГЭ 14.12.2020 1 вариант"], "created_at": "2025-09-14T09:05:47Z", "updated_at": "2026-04-18T15:00:18Z"}, {"id": 143447, "name": "СтатГрад ЕГЭ 14.12.2020 Термодинамика 2 вариант", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">Для приведения в действие паровой машины в топке сжигают дрова. Температура в топке составляет 850 <span class=\"tcrm-0900\">°</span>C. Считая, что в качестве\nхолодильника паровая машина использует атмосферу, температура которой равна 20 <span class=\"tcrm-0900\">°</span>C, определите максимальный теоретически\nвозможный КПД этой паровой машины. Ответ дайте в %. Округлите до целого числа.\n</p>", "solution_html": "<p class=\"noindent\">Максимальным теоретически возможным КПД тепловой машины будет КПД тепловой машины Карно, который имеет\nформулу:\n</p> <div class=\"math-display\">\n<img alt=\"   T  − T\nη =-+T---−⋅100%,\n       +\n\" class=\"math-display\" src=\"index-05d52a4276644304015fb563d7a2f305.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"T+  \" class=\"math\" src=\"index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg\"/> – температура нагревателя (в К), <img alt=\"T− \" class=\"math\" src=\"index-7cc3c1c6e69ba2b51a226a46d5e1f0f8.svg\"/> – температура холодильника (в К). <br/>В нашем случае КПД будет равняться:\n</p> <div class=\"math-display\">\n<img alt=\"   (850+-273)-− (20+-273)\nη =      850+ 273      ⋅100% ≈ 74%.\n\" class=\"math-display\" src=\"index-46d384e73d8a739a912be33f36fddc04.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-05d52a4276644304015fb563d7a2f305.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301823/index-05d52a4276644304015fb563d7a2f305.svg", "index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301823/index-b22cb79d15bdbdd3c7d9fc4eb1b2f5d2.svg", "index-7cc3c1c6e69ba2b51a226a46d5e1f0f8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession h-display\" src=\"index-1b28eb4734b4feb3df9f109e00faea2b.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-c7ba3031c39e283a4bfefaf500191830.svg\"/> – давление газа, <img alt=\"V  \" class=\"math\" src=\"index-090163bf8ae32cf44abb6ded13e0c53d.svg\"/> – объем газа. <br/>Тогда для точки 2 имеем: <img alt=\"5p0V0 = νRT2  \" class=\"math\" src=\"index-4420e21098ebc474a93c2dd617be48c8.svg\"/>, где <img alt=\"T2 = 2000 К  \" class=\"math\" src=\"index-0bf69ace931a14f3c86384748cf66729.svg\"/>.<br/>Для состояния системы в точке 3 справедливо: <img alt=\"5p ⋅2V = νRT\n  0   0     3  \" class=\"math\" src=\"index-3b76e00956155ca5f64884d82a1eaef9.svg\"/>. Найдем из отношения этих уравнений <img alt=\"T\n 3  \" class=\"math\" src=\"index-2bbaa430d6a97f55c4a14ce260d860a8.svg\"/> следующим\nобразом:\n</p> <div class=\"math-display\">\n<img alt=\"5p0⋅2V0  νRT3\n-5p0V0-= νRT2-⇒  T3 = 2T2 = 2⋅2000= 4000 К.\n\" class=\"math-display\" src=\"index-7cf7bae14ffe9309d1eb0774649dc168.svg\"/></div>\n<p class=\"indent\">   В общем случае для изменения внутренней энергии газа справедлива формула:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 3νR ΔT,\n     2\n\" class=\"math-display\" src=\"index-1ce3fdfdc3f57cf382d5c23df8f17e15.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-f0b89a8c9866e92ad78abb749f448a65.svg\"/> – количество вещества, <img alt=\"R  \" class=\"math\" src=\"index-35c94ba452a738ef1168cd9204c87d57.svg\"/> – универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-eca16cdd84b94f64e51fe3f80f58455c.svg\"/> – изменение абсолютной температуры газа.\n<br/>Тогда количество теплоты равняется:\n</p> <div class=\"math-display\">\n<img alt=\"Q2−3 = 3νR(T3− T2) +νRT2 = 3 ⋅2 ⋅8,31⋅(4000− 2000)+ 2⋅8,31⋅2000 = 5⋅2 ⋅8,31⋅2000⋅10−3 = 83,1 кДж ≈ 83 кД ж.\n       2                  2                                  2\n\" class=\"math-display\" src=\"index-6e7c8f34414da8cd426471018ad726e8.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"141692.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301824/141692.png", "index-dcdc63dfa4771c3271ab8fa9f2533906.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-dcdc63dfa4771c3271ab8fa9f2533906.svg", "index-d7a68f31f3147d97b6a77c6f65cb67d6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-d7a68f31f3147d97b6a77c6f65cb67d6.svg", "index-ebdcf001ed8300c3557dfb62938a5590.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-ebdcf001ed8300c3557dfb62938a5590.svg", "index-cf8b17e79e89f9b8745bfe2f8d6259de.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-cf8b17e79e89f9b8745bfe2f8d6259de.svg", "index-5ede253ee9c20946138c3ee5e02bd751.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-5ede253ee9c20946138c3ee5e02bd751.svg", "index-1b28eb4734b4feb3df9f109e00faea2b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-1b28eb4734b4feb3df9f109e00faea2b.svg", "index-c7ba3031c39e283a4bfefaf500191830.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-c7ba3031c39e283a4bfefaf500191830.svg", "index-090163bf8ae32cf44abb6ded13e0c53d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-090163bf8ae32cf44abb6ded13e0c53d.svg", "index-4420e21098ebc474a93c2dd617be48c8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-4420e21098ebc474a93c2dd617be48c8.svg", "index-0bf69ace931a14f3c86384748cf66729.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-0bf69ace931a14f3c86384748cf66729.svg", "index-3b76e00956155ca5f64884d82a1eaef9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-3b76e00956155ca5f64884d82a1eaef9.svg", "index-2bbaa430d6a97f55c4a14ce260d860a8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-2bbaa430d6a97f55c4a14ce260d860a8.svg", "index-7cf7bae14ffe9309d1eb0774649dc168.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-7cf7bae14ffe9309d1eb0774649dc168.svg", "index-1ce3fdfdc3f57cf382d5c23df8f17e15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-1ce3fdfdc3f57cf382d5c23df8f17e15.svg", "index-f0b89a8c9866e92ad78abb749f448a65.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-f0b89a8c9866e92ad78abb749f448a65.svg", "index-35c94ba452a738ef1168cd9204c87d57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-35c94ba452a738ef1168cd9204c87d57.svg", "index-eca16cdd84b94f64e51fe3f80f58455c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-eca16cdd84b94f64e51fe3f80f58455c.svg", "index-6e7c8f34414da8cd426471018ad726e8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/301825/index-6e7c8f34414da8cd426471018ad726e8.svg"}, "tags": ["СтатГрад ЕГЭ 14.12.2020 2 вариант"], "sources": ["СтатГрад ЕГЭ 14.12.2020 2 вариант"], "created_at": "2025-09-25T19:55:23Z", "updated_at": "2026-04-18T15:00:56Z"}, {"id": 143858, "name": "Термодинамика. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">На <img alt=\"pV  \" class=\"math\" src=\"index-b38cff065df04a68688e910527f0c551.svg\"/>-диаграмме изображены два цикла, рабочим телом в каждом из которых служит идеальный газ. Найдите модуль отношения\nработы, совершаемой газом за цикл 1, к работе, совершаемой газом за цикл 2. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"143858.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Работа газа за цикл ЧИСЛЕННО равна площади фигуры. Найдем работу газа в обоих циклах:\n</p> <div class=\"math-display\">\n<img alt=\"     2+ 4\nS1 = -2--⋅4 = 12\n\" class=\"math-display\" src=\"index-b935ae1949a0a81a9d715f40080b5d98.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"S2 = 2-+4 ⋅2= 6\n      2\n\" class=\"math-display\" src=\"index-b3843511fc2c17b23bed56afc6fdd972.svg\"/></div>\n<p class=\"indent\">   Найдем искомое отношение:\n</p> <div class=\"math-display\">\n<img alt=\"S1 = 12= 2\nS2   6\n\" class=\"math-display\" src=\"index-eec35c3ed641166c7c04ab2b937da78b.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b38cff065df04a68688e910527f0c551.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302761/index-b38cff065df04a68688e910527f0c551.svg", "143858.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302761/143858.png", "index-b935ae1949a0a81a9d715f40080b5d98.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302762/index-b935ae1949a0a81a9d715f40080b5d98.svg", "index-b3843511fc2c17b23bed56afc6fdd972.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302762/index-b3843511fc2c17b23bed56afc6fdd972.svg", "index-eec35c3ed641166c7c04ab2b937da78b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/302762/index-eec35c3ed641166c7c04ab2b937da78b.svg"}, "tags": ["Статград 01.04.2021 Физика 2"], "sources": ["CтатГрад 01.04.2021 Физика 2"], "created_at": "2025-09-28T16:13:48Z", "updated_at": "2026-04-18T15:01:52Z"}, {"id": 146770, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика", "question_html": "<p class=\"noindent\">В ходе некоторого процесса температура 1 моля гелия повышается на 200 К. В этом процессе удельная теплоёмкость гелия\nпостоянна и равна 4991,3 <img alt=\"Д ж∕(кг⋅∘C ).  \" class=\"math\" src=\"index-03c2f3e0680f6364528c4956cf61ae15.svg\"/> Какую работу совершает гелий в этом процессе? Ответ дайте в Дж и округлите до целого\nчисла.\n</p>", "solution_html": "<p class=\"noindent\">Применим первый закон термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-bd94ff284644b2773b552a8c5529b561.svg\"/></div>\n<p class=\"indent\">   Полученное количество теплоты распишем как: <img alt=\"Q = cmΔT  \" class=\"math\" src=\"index-f92c868180724ae72fb68cfccfc1b8d3.svg\"/>, где масса гелия равна <img alt=\"m = M ν  \" class=\"math\" src=\"index-fd6a50b7d3629beca12d180e6cb55d03.svg\"/><br/>Внутреннюю энергию распишем как <img alt=\"      3\nΔU  = 2νRΔT  \" class=\"math\" src=\"index-3322a23e0e02c3fc8f576e7982386209.svg\"/><br/>Тогда искомая работа газа:\n</p> <div class=\"math-display\">\n<img alt=\"A = Q− ΔU  =νΔT (cM − 1,5R) = 1⋅200 ⋅(4991,63 ⋅4⋅10−3− 1,5⋅8,31)≈ 1500 Дж\n\" class=\"math-display\" src=\"index-e0475e26bce0dd2a61ae709973edf071.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-03c2f3e0680f6364528c4956cf61ae15.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309638/index-03c2f3e0680f6364528c4956cf61ae15.svg", "index-bd94ff284644b2773b552a8c5529b561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309639/index-bd94ff284644b2773b552a8c5529b561.svg", "index-f92c868180724ae72fb68cfccfc1b8d3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309639/index-f92c868180724ae72fb68cfccfc1b8d3.svg", "index-fd6a50b7d3629beca12d180e6cb55d03.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309639/index-fd6a50b7d3629beca12d180e6cb55d03.svg", "index-3322a23e0e02c3fc8f576e7982386209.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309639/index-3322a23e0e02c3fc8f576e7982386209.svg", "index-e0475e26bce0dd2a61ae709973edf071.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/309639/index-e0475e26bce0dd2a61ae709973edf071.svg"}, "tags": ["Статград 19.10.2021 Физика 2"], "sources": ["CтатГрад 19.10.2021 Физика 2"], "created_at": "2025-10-14T06:33:03Z", "updated_at": "2026-04-18T15:02:17Z"}, {"id": 12409, "name": "Задача на внутреннюю энергию. Первая часть", "theme_path": "№8 Термодинамика -> Внутренняя энергия газа", "question_html": "<p class=\"noindent\">В сосуде с небольшой трещиной находится воздух. Воздух может медленно просачиваться сквозь\nтрещину. Во время опыта объем сосуда уменьшили в 8 раз, давление воздуха в сосуде увеличилось в 2\nраза, а его абсолютная температура увеличилась в 1,5 раза. Во сколько раз уменьшилась внутренняя\nэнергия газа в сосуде? (Воздух считать идеальным газом.)\n</p>", "solution_html": "<p class=\"noindent\">Внутренняя энергия газа равна:\n</p> <div class=\"math-display\">\n<img alt=\"     i\nU = 2νRT   (1)\n\" class=\"math-display\" src=\"index-a7aaa6ce407f4e07a7bc4320ea85a9b2.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-c1ffccb8b9b7604c0ed82cf69925ed75.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-edf949ed225155a38cdef67b634cd5c9.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-fcf33f631784ea3912c467900a20abf9.svg\"/> — абсолютная температура газа, <img alt=\"i  \" class=\"math\" src=\"index-6a921db2c4686b1525b8c8a8bbc70933.svg\"/> — число\nстепеней свободы. <br/>Запишем уравнение Менделеева – Клапейрона:\n</p> <div class=\"math-display\">\n<img alt=\"pV = νRT  (2)\n\" class=\"math-display\" src=\"index-fcfb2279155bfa9aabb3ec4435f7de56.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-82011547ea0086e4d4ed783154bbdffa.svg\"/> — давление газа, <img alt=\"V  \" class=\"math\" src=\"index-47e3f7eb4d7fe72088085f1bf98e1df7.svg\"/> — объем, занимаемый газом.<br/>Из (2) выразим <img alt=\"νRT = pV  \" class=\"math\" src=\"index-d97dd6fbdfb8fb51bf22c2f3723555a8.svg\"/> и подставим в (1), получим:\n</p> <div class=\"math-display\">\n<img alt=\"    i\nU = 2pV   (3)\n\" class=\"math-display\" src=\"index-6685375fa9dbda68eaae7ad96eafae4d.svg\"/></div>\n<p class=\"indent\">   Запишем (3) для первого и второго состояния с учетом того, что по условию <img alt=\"    1\nV2 = 8 V1  \" class=\"math\" src=\"index-412d6131582a13a79582df12b5666c07.svg\"/> и <img alt=\"p2 = 2p1  \" class=\"math\" src=\"index-14b35412dbcd73c6f3134ff0af155c94.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"U1 = ip1V1          U2 = ip2V2\n     2                   2\n\" class=\"math-display\" src=\"index-bab3e0c79873d428313d64c9da216039.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"U1 =-ip1V1           U2 =-i⋅2p1⋅ 1V1\n    2                   2      8\n\" class=\"math-display\" src=\"index-0e8045be9f61297850d3dc07538301dc.svg\"/></div>\n<p class=\"indent\">   Найдем, во сколько раз уменьшилась внутренняя энергия газа:\n</p> <div class=\"math-display\">\n<img alt=\"     i     1\nU2 = 2 ⋅2p1⋅8V1-= 1\nU1     ip1V1     4\n       2\n\" class=\"math-display\" src=\"index-84dd6472559922a8f884bee71ed8010e.svg\"/></div>\n<p class=\"indent\">   Таким образом, внутренняя энергия газа уменьшилась в 4 раза.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a7aaa6ce407f4e07a7bc4320ea85a9b2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-a7aaa6ce407f4e07a7bc4320ea85a9b2.svg", "index-c1ffccb8b9b7604c0ed82cf69925ed75.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-c1ffccb8b9b7604c0ed82cf69925ed75.svg", "index-edf949ed225155a38cdef67b634cd5c9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-edf949ed225155a38cdef67b634cd5c9.svg", "index-fcf33f631784ea3912c467900a20abf9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-fcf33f631784ea3912c467900a20abf9.svg", "index-6a921db2c4686b1525b8c8a8bbc70933.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-6a921db2c4686b1525b8c8a8bbc70933.svg", "index-fcfb2279155bfa9aabb3ec4435f7de56.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25274/index-fcfb2279155bfa9aabb3ec4435f7de56.svg", "index-82011547ea0086e4d4ed783154bbdffa.svg": "https://3.shkolkovo.online/api/ Внутренняя энергия газа", "question_html": "<p class=\"noindent\">Некоторое число молей одноатомного идеального газа расширяется изотермически из состояния <img alt=\"      5\np1 = 10  \" class=\"math\" src=\"index-c3e8fabe597bcab10ec739740b001b08.svg\"/> Па и <img alt=\"V1  \" class=\"math\" src=\"index-adafc342fed2e61f0fcf5145629f5dc1.svg\"/> = 1 литр до\nобъема <img alt=\"V2 = 2V1  \" class=\"math\" src=\"index-96adaa80946dc1a91f71af8db26259ab.svg\"/>. Чему равно изменение внутренней энергии этого газа? Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Изменение внутренней энергии равно:\n</p> <div class=\"math-display\">\n<img alt=\"     3\nΔU = 2 νRΔT\n\" class=\"math-display\" src=\"index-7a7899bbfa54359ab50bb3cc43b71439.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-dc88a1c3e392405c2d8775c0de7c4652.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-26451f530af2b727e5d2854e9516afa1.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-d766f3f58c5edcb4b8419fec96237cd8.svg\"/> — изменение абсолютной температуры газа.\n<br/>По условию задачи процесс изотермический, следовательно:\n</p> <div class=\"math-display\">\n<img alt=\"T  =T  = const ⇒   ΔT = 0\n 1   2\n\" class=\"math-display\" src=\"index-696bfb3a78aed05f992fddf6f5c69e95.svg\"/></div>\n<p class=\"indent\">   Подставим в формулу:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  = 3νR ⋅0\n      2\n\" class=\"math-display\" src=\"index-98e1ca6b58dcf181f816a0ace1b351d5.svg\"/></div>\n<p class=\"indent\">   Получим, что изменение внутренней энергии также равно нулю:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = 0\n\" class=\"math-display\" src=\"index-42ce4268b0b9e003dadaecb124541023.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c3e8fabe597bcab10ec739740b001b08.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25269/index-c3e8fabe597bc  газа равно:\n</p> <div class=\"math-display\">\n<img alt=\"      i\nΔU = 2 νRΔT\n\" class=\"math-display\" src=\"index-c1c44aa76393a5c47f0ef61fa6541564.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-b8f3127fed601a9d38b296dedac235df.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-d10bc96c85b305b38c35a6b530a55561.svg\"/> — универсальная газовая постоянная, <img alt=\"T  \" class=\"math\" src=\"index-ba89d95c2a6fbad3d1cbf530040a6b87.svg\"/> — абсолютная температура газа, <img alt=\"i  \" class=\"math\" src=\"index-0a039f407fc36e78b43e9663e8b448af.svg\"/> — число\nстепеней свободы. <br/>Изменение внутренней энергии газа прямо пропорционально изменению его температуры. Так как температура газа увеличилась в 2\nраза, то и внутренняя энергия газа изменилась в 2 раза.\n</p>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c1c44aa76393a5c47f0ef61fa6541564.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25278/index-c1c44aa76393a5c47f0ef61fa6541564.svg", "index-b8f3127fed601a9d38b296dedac235df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25278/index-b8f3127fed601a9d38b296dedac235df.svg", "index-d10bc96c85b305b38c35a6b530a55561.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25278/index-d10bc96c85b305b38c35a6b530a55561.svg", "index-ba89d95c2a6fbad3d1cbf530040a6b87.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25278/index-ba89d95c2a6fbad3d1cbf530040a6b87.svg", "index-0a039f407fc36e78b43e9663e8b448af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25278/index-0a039f407fc36e78b43e9663e8b448af.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа"], "sources": [], "created_at": "2021-12-01T10:53:55Z", "updated_at": "2026-04-04T05:37:36Z"}, {"id": 12410, "name": "Задача на внутреннюю энергию. Первая часть", "theme_path": "№8 Термодинамика -> Внутренняя энергия газа", "question_html": "<p class=\"noindent\">В процессе адиабатного сжатия двух молей идеального одноатомного газа внешние силы совершили\nработу 575 Дж. Определите изменение температуры данной порции газа в результате этого процесса.\nОтвет дайте в К и округлите до целых.\n</p>", "solution_html": "<p class=\"noindent\">При адиабатном процессе количество теплоты равно нулю: <img alt=\"Q = 0  \" class=\"math\" src=\"index-2e93956234be8da69b55fdedeb29d8df.svg\"/>. <br/>Запишем первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-2c7a5abe572986116e68fa543f1da50d.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ΔU  \" class=\"math\" src=\"index-b039efc1600a71c4481fcdad974331af.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-753ff0898cc572b96e7dc41a9bfb795a.svg\"/> — работа газа.<br/>Для адиабатного процесса имеем:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = −A\n\" class=\"math-display\" src=\"index-d00a24d65bcc30f56252041824c7d511.svg\"/></div>\n<p class=\"indent\">   Работа внешних сил равна:\n</p> <div class=\"math-display\">\n<img alt=\"A внеш. сил = −A\n\" class=\"math-display\" src=\"index-01980317757dcf403f9bde8dc8743b3d.svg\"/></div>\n<p class=\"indent\">   С учетом этого получаем, что:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  =A внеш. сил  (1)\n\" class=\"math-display\" src=\"index-de18798b517344a7b01e68c18d8478b8.svg\"/></div> <p class=\"indent\">   Изменение внутренней энергии газа равно:\n</p> <div class=\"math-display\">\n<img alt=\"     -i\nΔU = 2νR ΔT   (2)\n\" class=\"math-display\" src=\"index-fd4f5601da5eb63d1576c52919957421.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-de36135a3326c0b2b2229c5f18b8510b.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-0f951c7a949759b9c8fef44ccb0d7292.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-cfed798ccf900c0554bafd5f95cb5419.svg\"/> — изменение абсолютной температуры газа,\n<img alt=\"i  \" class=\"math\" src=\"index-59eaeb3d32627d77f62a7ec7f7ee4897.svg\"/> — число степеней свободы (так как газ одноатомный, то <img alt=\"i= 3  \" class=\"math\" src=\"index-3f8dc00bfd993174d8c3317784dac2e5.svg\"/>). <br/>Приравняем (1) и (2) и выразим изменение температуры газа:\n</p> <div class=\"math-display\">\n<img alt=\"3νRΔT = A внеш. сил\n2\n\" class=\"math-display\" src=\"index-a1973ffdd349450b8c2b1e77559873c2.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     2  Aвнеш. сил\nΔT = 3 ⋅   νR\n\" class=\"math-display\" src=\"index-c85d49e00c5b9c23dfc81ce630998d8c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     2        575 Дж\nΔT = 3 ⋅-------------Дж---≈ 23 К\n        2 моль ⋅8,31 моль⋅К\n                                                                                                    \n                                                                                                    \n\" class=\"math-display\" src=\"index-4e0b84a0f3c1859d13feb4e23ec7b49c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-2e93956234be8da69b55fdedeb29d8df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25276/index-2e93956234be8da69b55fdedeb29d8df.svg", "index-2c7a5abe572986116e68fa543f1da50d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25276/index-2c7a5abe572986116e68fa543f1da50d.svg", "index-b039efc1600a71c4481fcdad974331af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25276/index-b039efc1600a71c4481fcdad974331af.svg", "index-753ff0898cc572b96e7dc41a9bfb795a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25276/index-753ff0898cc572b96e7dc41a9bfb795a.svg", "index-d00a24d65bcc30f56252041824c7d511.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25276/index-d00a24d65bcc d": 12414, "name": "Задача на внутреннюю энергию. Первая часть", "theme_path": "№8 Термодинамика -> Внутренняя энергия газа", "question_html": "<p class=\"noindent\">Один моль аргона, находящийся в цилиндре при температуре <img alt=\"T1 = 600  \" class=\"math\" src=\"index-ce0f4ee0613a5d67286619e33949a6bc.svg\"/> К и давлении <img alt=\"        5\np1 = 4⋅10  \" class=\"math\" src=\"index-25ee3b57ef1ff6a20b3bad2899f162c4.svg\"/> Па, расширяется и\nодновременно охлаждается так, что его температура при расширении обратно пропорциональна объёму. Конечное давление\nгаза <img alt=\"p2 = 1 ⋅105  \" class=\"math\" src=\"index-849180bc40a8a981ed717e23ca438850.svg\"/> Па. Чему равна внутренняя энергия газа после расширения? Ответ дайте в Дж и округлите до\nцелых.\n</p>", "solution_html": "<p class=\"noindent\">По условию температура газа при расширении обратно пропорциональна объёму:\n</p> <div class=\"math-display\">\n<img alt=\"    1\nT ∼ V-\n\" class=\"math-display\" src=\"index-8c8e1fb968a045ddcc144cb07ff18a07.svg\"/></div>\n<p class=\"indent\">   Тогда справедливо следующее отношение:\n</p> <div class=\"math-display\">\n<img alt=\"T1= V2   (1)\nT2  V1\n\" class=\"math-display\" src=\"index-7eb2e44d252dff9ea16d864b3b4481ef.svg\"/></div>\n<p class=\"indent\">   Запишем уравнение Менделеева – Клапейрона для двух случаев (до расширения газа и после):\n</p> <div class=\"math-display\">\n<img alt=\"pV  = νRT   (2)\n 11      1\n\" class=\"math-display\" src=\"index-e1242f884702025dc057aefa8934e690.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"pV  = νRT   (3)\n 22      2\n\" class=\"math-display\" src=\"index-6a7983635c17db47d4365fa85d184a12.svg\"/></div>\n<p class=\"indent\">   Разделим (3) на (2):\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"p2V2   T2\np1V1-= T1   (4)\n\" class=\"math-display\" src=\"index-b468faee68ddcafb6d315d9fafa66c65.svg\"/></div>\n<p class=\"indent\">   Подставим (1) в (4) и выразим температуру газа <img alt=\"T2  \" class=\"math\" src=\"index-a878dc79e6be7324ede1bf246d725d4f.svg\"/> после расширения:\n</p> <div class=\"math-display\">\n<img alt=\"p2T1-= T2\np1T2   T1\n\" class=\"math-display\" src=\"index-fd3a08f4f8df1ab41c341e677b55f3d0.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"(T )2   p             ∘ p--\n T2   = p2  ⇒   T2 = T1 p2\n  1      1               1\n\" class=\"math-display\" src=\"index-0e7f9dbc70e16bff09148d64ec8b8366.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"         ∘ ---------\n           1⋅105 П-а\nT2 = 600 К 4⋅105 П а = 300 К\n\" class=\"math-display\" src=\"index-45ef6c3b482a241dd93980c672d04dae.svg\"/></div>\n<p class=\"indent\">   Найдем внутреннюю энергию газа после расширения:\n                                                                                                    \n                                                                                                    \n</p> <div class=\"math-display\">\n<img alt=\"     3              Дж\nU2 = 2 ⋅1 м оль ⋅8,31 моль⋅К-⋅300 К = 3740 Дж\n\" class=\"math-display\" src=\"index-06b714eac6c66dee491dee5f52413481.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-ce0f4ee0613a5d67286619e33949a6bc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25287/index-ce0f4ee0613a5d67286619e33949a6bc.svg", "index-25ee3b57ef1ff6a20b3bad2899f162c4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25287/index-25ee3b57ef1ff6a20b3bad2899f162c4.svg", "index-849180bc40a8a981ed717e23ca438850.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25287/index-849180bc40a8a981ed717e23ca438850.svg", "index-8c8e1fb968a045ddcc144cb07ff18a07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-8c8e1fb968a045ddcc144cb07ff18a07.svg", "index-7eb2e44d252dff9ea16d864b3b4481ef.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-7eb2e44d252dff9ea16d864b3b4481ef.svg", "index-e1242f884702025dc057aefa8934e690.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-e1242f884702025dc057aefa8934e690.svg", "index-6a7983635c17db47d4365fa85d184a12.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-6a7983635c17db47d4365fa85d184a12.svg", "index-b468faee68ddcafb6d315d9fafa66c65.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-b468faee68ddcafb6d315d9fafa66c65.svg", "index-a878dc79e6be7324ede1bf246d725d4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-a878dc79e6be7324ede1bf246d725d4f.svg", "index-fd3a08f4f8df1ab41c341e677b55f3d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-fd3a08f4f8df1ab41c341e677b55f3d0.svg", "index-0e7f9dbc70e16bff09148d64ec8b8366.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-0e7f9dbc70e16bff09148d64ec8b8366.svg", "index-45ef6c3b482a241dd93980c672d04dae.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-45ef6c3b482a241dd93980c672d04dae.svg", "index-06b714eac6c66dee491dee5f52413481.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/25288/index-06b714eac6c66dee491dee5f52413481.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Уравнение Менделеева-Клапейрона", "Внутренняя энергия газа"], "sources": ["Основная волна 2013"], "created_at": "2021-12-01T10:56:51Z", "updated_at": "2026-03-21T17:29:15Z"}, {"id": 106599, "name": "Задача на внутреннюю энергию. Первая часть", "theme_path": "№8 Термодинамика -> Внутренняя энергия газа", "question_html": "<p class=\"noindent\">В процессе адиабатного сжатия двух молей идеального одноатомного газа внешние силы совершили\nработу 575 Дж. Определите изменение температуры данной порции газа в результате этого процесса.\nОтвет дайте в К и округлите до целых.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" class=\"graphics\" src=\"index-628a76560ddc24e3a1d13dd37ed2f2fa.svg\"/><!--  tex4ht:graphics  \nname=\"in0x.svg\" src=\"...\"  \n  --></p></div>", "solution_html": "<p class=\"noindent\">При адиабатном процессе количество теплоты равно нулю: <img alt=\"Q = 0  \" class=\"math\" src=\"index-2e93956234be8da69b55fdedeb29d8df.svg\"/>. <br/>Запишем первое начало термодинамики:\n</p> <div class=\"math-display\">\n<img alt=\"Q = ΔU + A\n\" class=\"math-display\" src=\"index-2c7a5abe572986116e68fa543f1da50d.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ΔU  \" class=\"math\" src=\"index-b039efc1600a71c4481fcdad974331af.svg\"/> — изменение внутренней энергии газа, <img alt=\"A  \" class=\"math\" src=\"index-753ff0898cc572b96e7dc41a9bfb795a.svg\"/> — работа газа.<br/>Для адиабатного процесса имеем:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU = −A\n\" class=\"math-display\" src=\"index-d00a24d65bcc30f56252041824c7d511.svg\"/></div>\n<p class=\"indent\">   Работа внешних сил равна:\n</p> <div class=\"math-display\">\n<img alt=\"A внеш. сил = −A\n\" class=\"math-display\" src=\"index-01980317757dcf403f9bde8dc8743b3d.svg\"/></div>\n<p class=\"indent\">   С учетом этого получаем, что:\n</p> <div class=\"math-display\">\n<img alt=\"ΔU  =A внеш. сил  (1)\n\" class=\"math-display\" src=\"index-de18798b517344a7b01e68c18d8478b8.svg\"/></div> <p class=\"indent\">   Изменение внутренней энергии газа равно:\n</p> <div class=\"math-display\">\n<img alt=\"     -i\nΔU = 2νR ΔT   (2)\n\" class=\"math-display\" src=\"index-fd4f5601da5eb63d1576c52919957421.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"ν  \" class=\"math\" src=\"index-de36135a3326c0b2b2229c5f18b8510b.svg\"/> — количество вещества газа, <img alt=\"R  \" class=\"math\" src=\"index-0f951c7a949759b9c8fef44ccb0d7292.svg\"/> — универсальная газовая постоянная, <img alt=\"ΔT  \" class=\"math\" src=\"index-cfed798ccf900c0554bafd5f95cb5419.svg\"/> — изменение абсолютной температуры газа,\n<img alt=\"i  \" class=\"math\" src=\"index-59eaeb3d32627d77f62a7ec7f7ee4897.svg\"/> — число степеней свободы (так как газ одноатомный, то <img alt=\"i= 3  \" class=\"math\" src=\"index-3f8dc00bfd993174d8c3317784dac2e5.svg\"/>). <br/>Приравняем (1) и (2) и выразим изменение температуры газа:\n</p> <div class=\"math-display\">\n<img alt=\"3νRΔT = A внеш. сил\n2\n\" class=\"math-display\" src=\"index-a1973ffdd349450b8c2b1e77559873c2.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     2  Aвнеш. сил\nΔT = 3 ⋅   νR\n\" class=\"math-display\" src=\"index-c85d49e00c5b9c23dfc81ce630998d8c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"     2        575 Дж\nΔT = 3 ⋅-------------Дж---≈ 23 К\n        2 моль ⋅8,31 моль⋅К\n                                                                                                    \n                                                                                                    \n\" class=\"math-display\" src=\"index-4e0b84a0f3c1859d13feb4e23ec7b49c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-628a76560ddc24e3a1d13dd37ed2f2fa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220781/index-628a76560ddc24e3a1d13dd37ed2f2fa.svg", "index-2e93956234be8da69b55fdedeb29d8df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220782/index-2e93956234be8da69b55fdedeb29d8df.svg", "index-2c7a5abe572986116e68fa543f1da50d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220782/index-2c7a5abe572986116e68fa543f1da50d.svg", "index-b039efc1600a71c4481fcdad974331af.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/220782/index-b039efc1600a71c4481fcdad974331af.svg", "index-753ff0898cc572b96e7dc41a9 3feb4e23ec7b49c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Внутренняя энергия газа", "Первый закон термодинамики"], "sources": [], "created_at": "2025-02-24T08:44:21Z", "updated_at": "2026-03-03T16:57:32Z"}, {"id": 24178, "name": "Задача на работу газа. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">В гладкой горизонтальной трубе с площадью поперечного сечения 75 <img alt=\"  2\nсм  \" class=\"math\" src=\"index-9781854e67c55ac2d33f6e245c6fb93a.svg\"/> расположен поршень. Слева от поршня\nвсё время поддерживается постоянное давление 100 кПа, а справа от него всё время поддерживается постоянное\nдавление 300 кПа. В исходном состоянии к поршню прикладывают некоторую силу, удерживая его в равновесии. Какую\nработу нужно совершить для того, чтобы очень медленно переместить поршень на 20 см вправо? Ответ дайте в\nДж.\n</p>", "solution_html": "<p class=\"noindent\">При постоянном давлении и медленном перемещении сила, которую необходимо прикладывать для перемещения,\nравна:\n</p> <div class=\"math-display\">\n<img alt=\"F = (p2− p1)S,\n\" class=\"math-display\" src=\"index-b07ed81d879656c6223a6ebfd5cabc1e.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p2  \" class=\"math\" src=\"index-c926206833c2602bbde614678f9b962a.svg\"/> – давление справа, <img alt=\"p1  \" class=\"math\" src=\"index-63293dcd856b5222da2f479e4d18870b.svg\"/> – давление слева, <img alt=\"S  \" class=\"math\" src=\"index-f3772b9f1b6432c7178ec257f662a5e6.svg\"/> – площадь поперечного сечения.<br/>При этом совершается работа, равна:\n</p> <div class=\"math-display\">\n<img alt=\"A =F l = (p2− p1)Sl = (300⋅103 П а− 100⋅103 Па)75⋅10−4 м2⋅0,2 м = 300 Д ж\n\" class=\"math-display\" src=\"index-bb4abdde2d39bdf46cec90fcd13533bf.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9781854e67c55ac2d33f6e245c6fb93a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45988/index-9781854e67c55ac2d33f6e245c6fb93a.svg", "index-b07ed81d879656c6223a6ebfd5cabc1e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45989/index-b07ed81d879656c6223a6ebfd5cabc1e.svg", "index-c926206833c2602bbde614678f9b962a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45989/index-c926206833c2602bbde614678f9b962a.svg", "index-63293dcd856b5222da2f479e4d18870b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45989/index-63293dcd856b5222da2f479e4d18870b.svg", "index-f3772b9f1b6432c7178ec257f662a5e6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45989/index-f3772b9f1b6432c7178ec257f662a5e6.svg", "index-bb4abdde2d39bdf46cec90fcd13533bf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/45989/index-bb4abdde2d39bdf46cec90fcd13533bf.svg"}, "tags": ["Механика", "Формат ЕГЭ", "Сложнее ЕГЭ", "Динамика", "МКТ. Термодинамика", "Работа газа"], "sources": [], "created_at": "2022-04-13T16:20:27Z", "updated_at": "2026-01-24T06:39:04Z"}, {"id": 85593, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Работа идеального газа", "question_html": "<p class=\"noindent\">Идеальный газ участвует в процессе 1–2, график которого показан на рисунке. Какую работу совершил газ в этом процессе? Ответ\nдайте в кДж.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"f-ege-8-2-1.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Работа газа в изобарном процессе равна:\n</p> <div class=\"math-display\">\n<img alt=\"A = pΔV,\n\" class=\"math-display\" src=\"index-9b620c7e8e544cde96075ae4fb5e399a.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"p  \" class=\"math\" src=\"index-3e9467bb3220942265bf8129ad5f90ac.svg\"/> – давление, <img alt=\"ΔV  \" class=\"math\" src=\"index-46ceb075824d290e32c5138d113bf16a.svg\"/> – изменение объёма.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=
