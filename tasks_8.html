svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23348/index-4d3063c037f7b81af0eadcce0fe7499d.svg", "index-d46c12b22cdfc10d004988e53c057129.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23351/index-d46c12b22cdfc10d004988e53c057129.svg", "index-957f7442ca5948973f9bd5a6b5c312fa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23351/index-957f7442ca5948973f9bd5a6b5c312fa.svg", "index-7ae25d4847d314a19dc707ed4b556b8c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23351/index-7ae25d4847d314a19dc707ed4b556b8c.svg", "index-861f00a3e98d4065278667174374a54e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23351/index-861f00a3e98d4065278667174374a54e.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Банк ФИПИ"], "created_at": "2021-11-19T17:33:38Z", "updated_at": "2026-05-15T18:23:15Z"}, {"id": 11240, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">Температура холодильника тепловой машины 600 К, температура нагревателя на 200 К больше, чем у холодильника. Каков\nмаксимально возможный КПД машины? Ответ дайте в <img alt=\"%.  \" class=\"math\" src=\"index-d3dd628a58fde48f4231715a0d3f93dd.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Из условия:\n</p> <div class=\"math-display\">\n<img alt=\"Tн = Tх+ 200 К\n\" class=\"math-display\" src=\"index-2f7580e9fdbb03b82553f05884a1be78.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Tн = 600 К + 200 К = 800 К\n\" class=\"math-display\" src=\"index-96bca12dfd0695ba08aa7de6d6cfc59f.svg\"/></div>\n<p class=\"indent\">   КПД цикла Карно можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"      Tх\nη = 1− Tн\n\" class=\"math-display\" src=\"index-13ebc38bcc242a0ae8acdbf569dbb6c2.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"      600 К\nη = 1− 800 К-= 0,25= 25%\n\" class=\"math-display\" src=\"index-58163265d3303e173b4c4da2ea644985.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-d3dd628a58fde48f4231715a0d3f93dd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23354/index-d3dd628a58fde48f4231715a0d3f93dd.svg", "index-2f7580e9fdbb03b82553f05884a1be78.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23355/index-2f7580e9fdbb03b82553f05884a1be78.svg", "index-96bca12dfd0695ba08aa7de6d6cfc59f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23355/index-96bca12dfd0695ba08aa7de6d6cfc59f.svg", "index-13ebc38bcc242a0ae8acdbf569dbb6c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23355/index-13ebc38bcc242a0ae8acdbf569dbb6c2.svg", "index-58163265d3303e173b4c4da2ea644985.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23355/index-58163265d3303e173b4c4da2ea644985.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Банк ФИПИ"], "created_at": "2021-11-19T17:35:17Z", "updated_at": "2026-07-29T12:59:22Z"}, {"id": 11239, "name": "Задача на КПД цикла и тепловых машин. Первая часть", "theme_path": "№8 Термодинамика -> Термодинамические циклы. КПД тепловых машин", "question_html": "<p class=\"noindent\">Тепловая машина за один цикл совершает работу 20 Дж и отдаёт холодильнику количество теплоты 80 Дж. Температура\nнагревателя этой машины 600 К, а температура холодильника 300 К. Во сколько раз КПД идеальной тепловой\nмашины, работающей при тех же температурах нагревателя и холодильника, больше КПД рассматриваемой тепловой\nмашины?\n</p>", "solution_html": "<p class=\"noindent\">КПД идеальной тепловой машины в цикле Карно можно найти по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"          Tх\nηmax = 1 − Tн\n\" class=\"math-display\" src=\"index-9df1683ac8769d3c3b15d6e6e303abad.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"ηmax =1 − 300 К-= 1− 0,5= 0,5\n          600 К\n\" class=\"math-display\" src=\"index-a893bad3e88d08e75c3900511e5e370d.svg\"/></div>\n<p class=\"indent\">   КПД рассматриваемой тепловой машины:\n</p> <div class=\"math-display\">\n<img alt=\"η = A-цикл\n    Q н\n\" class=\"math-display\" src=\"index-5fb5429c86642384635ffce789323dd8.svg\"/></div>\n<p class=\"indent\">   Зная работу тепловой машины за цикл и количество теплоты, отданное холодильнику, можно найти количество теплоты,\nпринятое нагревателем:\n</p> <div class=\"math-display\">\n<img alt=\"Aцикл = Qн − Q х\n\" class=\"math-display\" src=\"index-abb61da87273064dc1ad2cccca1764ca.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Q н = Aцикл +Q х\n\" class=\"math-display\" src=\"index-0f13c2a8f58cb00a4ae65c36bc298fb1.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Qн = 20 Дж + 80 Д ж = 100 Дж\n\" class=\"math-display\" src=\"index-55d35e87ec11cd754eee3b4fa30198d5.svg\"/></div>\n<p class=\"indent\">   Найдем КПД рассматриваемой машины:\n</p> <div class=\"math-display\">\n<img alt=\"   20-Дж--\nη = 100 Д ж = 0,2\n\" class=\"math-display\" src=\"index-e3be6d344eff6553a9e4f4628aee52ad.svg\"/></div>\n<p class=\"indent\">   Найдем, во сколько раз КПД идеальной тепловой машины, работающей при тех же температурах нагревателя и холодильника,\nбольше КПД рассматриваемой тепловой машины:\n</p> <div class=\"math-display\">\n<img alt=\"ηmax= 0,5 = 2,5\n η    0,2\n\" class=\"math-display\" src=\"index-c70003b9730343029608f2eb2a374b2a.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9df1683ac8769d3c3b15d6e6e303abad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-9df1683ac8769d3c3b15d6e6e303abad.svg", "index-a893bad3e88d08e75c3900511e5e370d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-a893bad3e88d08e75c3900511e5e370d.svg", "index-5fb5429c86642384635ffce789323dd8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-5fb5429c86642384635ffce789323dd8.svg", "index-abb61da87273064dc1ad2cccca1764ca.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-abb61da87273064dc1ad2cccca1764ca.svg", "index-0f13c2a8f58cb00a4ae65c36bc298fb1.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-0f13c2a8f58cb00a4ae65c36bc298fb1.svg", "index-55d35e87ec11cd754eee3b4fa30198d5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-55d35e87ec11cd754eee3b4fa30198d5.svg", "index-e3be6d344eff6553a9e4f4628aee52ad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-e3be6d344eff6553a9e4f4628aee52ad.svg", "index-c70003b9730343029608f2eb2a374b2a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23353/index-c70003b9730343029608f2eb2a374b2a.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["Банк ФИПИ"], "created_at": "2021-11-19T17:34:19Z", "updated_at": "2026-03-21T17:19:34Z"}, {"id": 175121, "name": "Конденсация", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты выделяется при конденсации 250 г водяного пара, взятого при температуре кипения? Ответ дайте в\nкДж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, выделяемое при конденсации, рассчитывается по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"Q = Lm,\n\" class=\"math-display\" src=\"index-11926295418b3172c72f31ea10fdb89c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"         6\nL = 2,3 ⋅10  Дж/кг  \" class=\"math\" src=\"index-b02c26662ac0ce4b61566913f6832c34.svg\"/> – удельная теплота парообразования воды, <img alt=\"m  \" class=\"math\" src=\"index-4feabe37d5629b750ea44d46d52caa9f.svg\"/> – масса пара.<br/>Тогда:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 2,3⋅106⋅0,25= 575 кД ж\n\" class=\"math-display\" src=\"index-3c47c4e6f3c26d09a8cfd5f2db8de456.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-11926295418b3172c72f31ea10fdb89c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379699/index-11926295418b3172c72f31ea10fdb89c.svg", "index-b02c26662ac0ce4b61566913f6832c34.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379699/index-b02c26662ac0ce4b61566913f6832c34.svg", "index-4feabe37d5629b750ea44d46d52caa9f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379699/index-4feabe37d5629b750ea44d46d52caa9f.svg", "index-3c47c4e6f3c26d09a8cfd5f2db8de456.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379699/index-3c47c4e6f3c26d09a8cfd5f2db8de456.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ЕГКР 955 Физика 26.03.2026"], "created_at": "2026-03-26T09:09:35Z", "updated_at": "2026-07-03T08:27:01Z"}, {"id": 185840, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты поглощается в процессе кипения и обращения в пар 0,2 кг воды, происходящем при <img alt=\"  ∘\n100 C  \" class=\"math\" src=\"index-a5690b61d30740385f5d91125079aa09.svg\"/> и\nатмосферном давлении <img alt=\"105  \" class=\"math\" src=\"index-8260d2798da603083255152deb263850.svg\"/> Па? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, поглощаемое при обращении в пар\n</p> <div class=\"math-display\">\n<img alt=\"Q = Lm,\n\" class=\"math-display\" src=\"index-11926295418b3172c72f31ea10fdb89c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"L  \" class=\"math\" src=\"index-93f3c2b98996e93a9eaab996745a47b4.svg\"/> – удельная теплота парообразования, <img alt=\"m  \" class=\"math\" src=\"index-2f6e67fdb77de7b145bd7309173701b3.svg\"/> – масса воды.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"Q = 2,3 ⋅106 Дж/кг ⋅0,2 кг= 460 кДж\n\" class=\"math-display\" src=\"index-81c3ef7a94198425b816f1712d0792a5.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a5690b61d30740385f5d91125079aa09.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408297/index-a5690b61d30740385f5d91125079aa09.svg", "index-8260d2798da603083255152deb263850.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408297/index-8260d2798da603083255152deb263850.svg", "index-11926295418b3172c72f31ea10fdb89c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408298/index-11926295418b3172c72f31ea10fdb89c.svg", "index-93f3c2b98996e93a9eaab996745a47b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408298/index-93f3c2b98996e93a9eaab996745a47b4.svg", "index-2f6e67fdb77de7b145bd7309173701b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408298/index-2f6e67fdb77de7b145bd7309173701b3.svg", "index-81c3ef7a94198425b816f1712d0792a5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/408298/index-81c3ef7a94198425b816f1712d0792a5.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["ЕГЭ 2026 основная волна, Сибирь"], "created_at": "2026-06-11T07:26:36Z", "updated_at": "2026-07-03T08:26:29Z"}, {"id": 65212, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты поглощается в процессе кипения и обращения в пар 0,5 кг воды, происходящем при <img alt=\"  ∘\n100 C  \" class=\"math\" src=\"index-a5690b61d30740385f5d91125079aa09.svg\"/> и\nатмосферном давлении <img alt=\"105  \" class=\"math\" src=\"index-8260d2798da603083255152deb263850.svg\"/> Па? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, выделяемое при обращении в пар\n</p> <div class=\"math-display\">\n<img alt=\"Q = Lm,\n\" class=\"math-display\" src=\"index-11926295418b3172c72f31ea10fdb89c.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"L  \" class=\"math\" src=\"index-93f3c2b98996e93a9eaab996745a47b4.svg\"/> – удельная теплота парообразования, <img alt=\"m  \" class=\"math\" src=\"index-2f6e67fdb77de7b145bd7309173701b3.svg\"/> – масса воды.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"Q= 2,3⋅106 Д ж/кг⋅0,5 кг= 1150 кД ж\n\" class=\"math-display\" src=\"index-338a2b56ce3bcbd13b7209c0c7191d5f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-a5690b61d30740385f5d91125079aa09.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117904/index-a5690b61d30740385f5d91125079aa09.svg", "index-8260d2798da603083255152deb263850.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117904/index-8260d2798da603083255152deb263850.svg", "index-11926295418b3172c72f31ea10fdb89c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117905/index-11926295418b3172c72f31ea10fdb89c.svg", "index-93f3c2b98996e93a9eaab996745a47b4.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117905/index-93f3c2b98996e93a9eaab996745a47b4.svg", "index-2f6e67fdb77de7b145bd7309173701b3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117905/index-2f6e67fdb77de7b145bd7309173701b3.svg", "index-338a2b56ce3bcbd13b7209c0c7191d5f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117905/index-338a2b56ce3bcbd13b7209c0c7191d5f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2023-07-08T10:13:58Z", "updated_at": "2026-07-03T08:26:08Z"}, {"id": 114707, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты необходимо для плавления 3 кг льда при <img alt=\" ∘\n0 C  \" class=\"math\" src=\"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg\"/>? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Формула для расчёта количества теплоты, необходимого для плавления\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm,\n\" class=\"math-display\" src=\"index-77aecc330f075cc690fba8588d8b0f07.svg\"/></div>\n<p class=\"indent\"> <img alt=\"         5 Д-ж\nλ= 3,3⋅10  кг  \" class=\"math\" src=\"index-2aa065020429aae7ad860491161b5b63.svg\"/> – удельная теплота плавления льда, <img alt=\"m  \" class=\"math\" src=\"index-4554717c26a3df805d90f0fa28c63c17.svg\"/> - масса тела.<br/>Тогда количество теплоты, требуемое для плавления 3 кг, равно\n</p> <div class=\"math-display\">\n<img alt=\"Q = 3,3⋅105⋅3 =990 кДж.\n\" class=\"math-display\" src=\"index-63c787372d9240b941201303e4221d81.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235540/index-eabeb6276d04aa1cab6a2d580a7c67f3.svg", "index-77aecc330f075cc690fba8588d8b0f07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235542/index-77aecc330f075cc690fba8588d8b0f07.svg", "index-2aa065020429aae7ad860491161b5b63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235542/index-2aa065020429aae7ad860491161b5b63.svg", "index-4554717c26a3df805d90f0fa28c63c17.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235542/index-4554717c26a3df805d90f0fa28c63c17.svg", "index-63c787372d9240b941201303e4221d81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/235542/index-63c787372d9240b941201303e4221d81.svg"}, "tags": ["ЕГКР 954 Физика 27.03.2025"], "sources": ["ЕГКР 954 Физика 27.03.2025"], "created_at": "2025-04-02T17:55:41Z", "updated_at": "2026-05-19T16:41:40Z"}, {"id": 195398, "name": "Копия #114707 - Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты требуется, чтобы расплавить 3 кг льда при <img alt=\" ∘\n0 C  \" class=\"math\" src=\"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg\"/>? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Формула для расчёта количества теплоты, необходимого для плавления\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm,\n\" class=\"math-display\" src=\"index-77aecc330f075cc690fba8588d8b0f07.svg\"/></div>\n<p class=\"indent\"> <img alt=\"         5 Д-ж\nλ= 3,3⋅10  кг  \" class=\"math\" src=\"index-2aa065020429aae7ad860491161b5b63.svg\"/> – удельная теплота плавления льда, <img alt=\"m  \" class=\"math\" src=\"index-4554717c26a3df805d90f0fa28c63c17.svg\"/> - масса тела.<br/>Тогда количество теплоты, требуемое для плавления 3 кг, равно\n</p> <div class=\"math-display\">\n<img alt=\"Q = 3,3⋅105⋅3 =990 кДж.\n\" class=\"math-display\" src=\"index-63c787372d9240b941201303e4221d81.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433165/index-eabeb6276d04aa1cab6a2d580a7c67f3.svg", "index-77aecc330f075cc690fba8588d8b0f07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433166/index-77aecc330f075cc690fba8588d8b0f07.svg", "index-2aa065020429aae7ad860491161b5b63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433166/index-2aa065020429aae7ad860491161b5b63.svg", "index-4554717c26a3df805d90f0fa28c63c17.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433166/index-4554717c26a3df805d90f0fa28c63c17.svg", "index-63c787372d9240b941201303e4221d81.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433166/index-63c787372d9240b941201303e4221d81.svg"}, "tags": ["ЕГКР 954 Физика 27.03.2025"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T18:02:03Z", "updated_at": "2026-08-16T18:04:25Z"}, {"id": 11311, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Помощнику кузнеца дали задание переплавить кусок свинца массой 3,7 т. Какое количество теплоты для этого потребуется? Свинец\nнаходится при температуре плавления. Ответ дайте в МДж.\n</p>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты плавления:\n</p> <div class=\"math-display\">\n<img alt=\"               4            3           7\nQ = λm = 2,5⋅10 Дж/ кг⋅3,7 ⋅10  кг= 9,25 ⋅10  Дж = 92,5 М Дж\n\" class=\"math-display\" src=\"index-9521252d0b9a59ecf7efcc79612ec258.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-9521252d0b9a59ecf7efcc79612ec258.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23494/index-9521252d0b9a59ecf7efcc79612ec258.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:49:41Z", "updated_at": "2026-05-19T16:40:56Z"}, {"id": 112686, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты необходимо для плавления 5 кг льда при <img alt=\" ∘\n0 C  \" class=\"math\" src=\"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg\"/>? Ответ дайте в кДж.\n</p>", "solution_html": "<p class=\"noindent\">Формула для расчёта количества теплоты, необходимого для плавления\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm,\n\" class=\"math-display\" src=\"index-77aecc330f075cc690fba8588d8b0f07.svg\"/></div>\n<p class=\"indent\"> <img alt=\"         5 Д-ж\nλ= 3,3⋅10  кг  \" class=\"math\" src=\"index-2aa065020429aae7ad860491161b5b63.svg\"/> – удельная теплота плавления льда, <img alt=\"m  \" class=\"math\" src=\"index-4554717c26a3df805d90f0fa28c63c17.svg\"/> - масса тела.<br/>\n</p> <div class=\"math-display\">\n<img alt=\"Q =λm = 3,3⋅105⋅5= 16,5⋅105 Дж = 1650 кД ж\n\" class=\"math-display\" src=\"index-179fdd0fb453a3684a87b86a7ddb436c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-eabeb6276d04aa1cab6a2d580a7c67f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232013/index-eabeb6276d04aa1cab6a2d580a7c67f3.svg", "index-77aecc330f075cc690fba8588d8b0f07.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232014/index-77aecc330f075cc690fba8588d8b0f07.svg", "index-2aa065020429aae7ad860491161b5b63.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232014/index-2aa065020429aae7ad860491161b5b63.svg", "index-4554717c26a3df805d90f0fa28c63c17.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232014/index-4554717c26a3df805d90f0fa28c63c17.svg", "index-179fdd0fb453a3684a87b86a7ddb436c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/232014/index-179fdd0fb453a3684a87b86a7ddb436c.svg"}, "tags": [], "sources": ["ЕГКР 2025"], "created_at": "2025-03-27T23:03:18Z", "updated_at": "2026-04-18T12:59:38Z"}, {"id": 175128, "name": "Плавление", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какое количество теплоты необходимо для того, чтобы расплавить 80 г льда, взятого при температуре плавления? Ответ дайте в\nкДж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты, необходимое для плавления льда, взятом при температуре плавления, рассчитывается по формуле:\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm,\n\" class=\"math-display\" src=\"index-77488c79b23128784538bd3068c8fb57.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"         5\nλ =3,3⋅10 Д ж/кг  \" class=\"math\" src=\"index-d68ebf5e8266a13fda7a13fac829d127.svg\"/> – удельная теплота плавления льда, <img alt=\"m  \" class=\"math\" src=\"index-fab3ed07174bad338f1ba8604fa7ad02.svg\"/> – масса льда.<br/>Тогда:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 3,3⋅105⋅0,08 = 26,4 кДж\n\" class=\"math-display\" src=\"index-97936e8d15d8dab523c0389f66e14e8f.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-77488c79b23128784538bd3068c8fb57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379712/index-77488c79b23128784538bd3068c8fb57.svg", "index-d68ebf5e8266a13fda7a13fac829d127.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379712/index-d68ebf5e8266a13fda7a13fac829d127.svg", "index-fab3ed07174bad338f1ba8604fa7ad02.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379712/index-fab3ed07174bad338f1ba8604fa7ad02.svg", "index-97936e8d15d8dab523c0389f66e14e8f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379712/index-97936e8d15d8dab523c0389f66e14e8f.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ЕГКР 956 Физика 26.03.2026"], "created_at": "2026-03-26T09:46:40Z", "updated_at": "2026-04-06T11:07:31Z"}, {"id": 195466, "name": "Копия #34588 - Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">В закрытом сосуде находится вещество массой 0,5 кг. На графике показано, как изменяется его температура при поглощении\nтеплоты. Изначально вещество было в жидком состоянии. Найдите удельную теплоту парообразования этого вещества. Ответ дайте\nв кДж/кг. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"368\" src=\"34588.png\" width=\"368\"/></p></div>", "solution_html": "<p class=\"noindent\">Парообразование происходит на горизонтальном участке, при этом веществом было получено <img alt=\"    5\n3⋅10  \" class=\"math\" src=\"index-2a500498440b363924774509d8666ea8.svg\"/> Дж. Откуда удельная теплота\nпарообразования:\n</p> <div class=\"math-display\">\n<img alt=\"    Q   300 кД ж\nL = m-= -0,5 кг-= 600 кДж/ кг\n\" class=\"math-display\" src=\"index-c2d80a176fbccc3d9e52af5b16b9d31d.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"34588.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433303/34588.png", "index-2a500498440b363924774509d8666ea8.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433304/index-2a500498440b363924774509d8666ea8.svg", "index-c2d80a176fbccc3d9e52af5b16b9d31d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/433304/index-c2d80a176fbccc3d9e52af5b16b9d31d.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Тепловые явления"], "sources": ["Тренировочные задания Школково"], "created_at": "2026-08-16T22:19:17Z", "updated_at": "2026-08-16T22:49:55Z"}, {"id": 11315, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Твердому телу массой 1,6 кг начали сообщать тепло как показано на графике. Найдите удельную теплоту плавления этого тела.\nОтвет дайте в Дж/кг.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"11315.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Проанализируем график. Вначале вещество нагревают до температуры плавления, после чего начинается сам процесс плавления в\nпромежутке между 50 кДж и 100 кДж. Дальше происходит процесс нагревания жидкости вплоть до отметки в 125 кДж, после чего\nначинается процесс парообразования, который продолжается вплоть до окончания графика. Нам необходим процесс плавления, для\nкоторого необходимо количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = 100 кДж − 50 кД ж = 50 кДж\n\" class=\"math-display\" src=\"index-5753631648cb770685659c114ffe462a.svg\"/></div>\n<p class=\"indent\">   По формуле количества теплоты плавления:\n</p> <div class=\"math-display\">\n<img alt=\"Q =λm\n\" class=\"math-display\" src=\"index-f5b0dcd59c74562f8d2f5158fe2086f5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"             3\nλ= -Q = 50⋅10-Дж--=31250 Д ж/кг\n   m      1,6 кг\n\" class=\"math-display\" src=\"index-cb02456ede75be57b6d0e2c6204ecda2.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"11315.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23502/11315.png", "index-5753631648cb770685659c114ffe462a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23503/index-5753631648cb770685659c114ffe462a.svg", "index-f5b0dcd59c74562f8d2f5158fe2086f5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23503/index-f5b0dcd59c74562f8d2f5158fe2086f5.svg", "index-cb02456ede75be57b6d0e2c6204ecda2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23503/index-cb02456ede75be57b6d0e2c6204ecda2.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:53:24Z", "updated_at": "2026-07-01T14:31:05Z"}, {"id": 11300, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">На рисунке показана зависимость температуры <img alt=\"T  \" class=\"math\" src=\"index-15aa7801b8581faadc68eaa2029add66.svg\"/> от выделенной теплоты <img alt=\"Q  \" class=\"math\" src=\"index-0d0031adf47829ea6fdd8e340bde174d.svg\"/> для 0,4 кг вещества, первоначально бывшего\nжидкостью. Найдите удельную теплоту плавления вещества. Ответ дайте в кДж/кг.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"11300.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Во время плавления/кристализации температура вещества не изменяется. На графике такой участок один: от <img alt=\"Q1 = 5  \" class=\"math\" src=\"index-38b70941d84a9bcb3b9edd03cb85f6d0.svg\"/> кДж до\n<img alt=\"Q2 = 15  \" class=\"math\" src=\"index-24affe03b80d44eb4e82dc5004248578.svg\"/> кДж. Следовательно, всего за процесс кристализации вещества выделилось количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q= Q2 − Q1 = 15 кД ж − 5 кДж = 10 кД ж\n\" class=\"math-display\" src=\"index-b8df820ee510f46da2423d4c7c6d4eda.svg\"/></div>\n<p class=\"indent\">   .\n</p><p class=\"indent\">   По формуле количества теплоты плавления (кристализации) вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q =λm\n\" class=\"math-display\" src=\"index-7369e5dc532c7b016c6f9fa2df3fa5b5.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"λ = Q-= 10 кД-ж-= 25 кД ж/кг\n    m    0,4 кг\n\" class=\"math-display\" src=\"index-d6395f228c8d3eebab4853aad668af01.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-15aa7801b8581faadc68eaa2029add66.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23472/index-15aa7801b8581faadc68eaa2029add66.svg", "index-0d0031adf47829ea6fdd8e340bde174d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23472/index-0d0031adf47829ea6fdd8e340bde174d.svg", "11300.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23472/11300.png", "index-38b70941d84a9bcb3b9edd03cb85f6d0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23475/index-38b70941d84a9bcb3b9edd03cb85f6d0.svg", "index-24affe03b80d44eb4e82dc5004248578.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23475/index-24affe03b80d44eb4e82dc5004248578.svg", "index-b8df820ee510f46da2423d4c7c6d4eda.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23475/index-b8df820ee510f46da2423d4c7c6d4eda.svg", "index-7369e5dc532c7b016c6f9fa2df3fa5b5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23475/index-7369e5dc532c7b016c6f9fa2df3fa5b5.svg", "index-d6395f228c8d3eebab4853aad668af01.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23475/index-d6395f228c8d3eebab4853aad668af01.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Банк ФИПИ"], "created_at": "2021-11-21T09:42:02Z", "updated_at": "2026-07-01T14:32:24Z"}, {"id": 64739, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Брусок из неизвестного металла массой 2 кг поместили в печь и стали его нагревать. На рисунке приведён график зависимости\nтемпературы металла <img alt=\"t  \" class=\"math\" src=\"index-193d2db59dfd0d5c521b95dda28cb508.svg\"/> от переданного ему количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-99acd7622d0a96234ca0e2157c306c05.svg\"/>. Чему равна удельная теплота плавления металла? Ответ дайте\nв кДж/кг.\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"64739.png\" width=\"263\"/></p></div>", "solution_html": "<p class=\"noindent\">При плавлении получено 500000 Дж, откуда удельная теплота плавления:\n</p> <div class=\"math-display\">\n<img alt=\"    Q   500 кД ж\nλ = m-= --2-кг--= 250 кДж/ кг\n\" class=\"math-display\" src=\"index-3300f8786f9662ea5a91a23312ea4198.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-193d2db59dfd0d5c521b95dda28cb508.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116917/index-193d2db59dfd0d5c521b95dda28cb508.svg", "index-99acd7622d0a96234ca0e2157c306c05.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116917/index-99acd7622d0a96234ca0e2157c306c05.svg", "64739.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116917/64739.png", "index-3300f8786f9662ea5a91a23312ea4198.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/116918/index-3300f8786f9662ea5a91a23312ea4198.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Банк ФИПИ"], "created_at": "2023-07-01T09:59:14Z", "updated_at": "2026-07-01T14:29:39Z"}, {"id": 103436, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Брусок из неизвестного металла массой 2 кг поместили в печь и стали его нагревать. На рисунке приведён график зависимости\nтемпературы металла <img alt=\"t  \" class=\"math\" src=\"index-193d2db59dfd0d5c521b95dda28cb508.svg\"/> от переданного ему количества теплоты <img alt=\"Q.  \" class=\"math\" src=\"index-b09f64b3da86a405df1a410ee32cea4f.svg\"/> Чему равна удельная теплота плавления металла? Ответ дайте\nв кДж/кг. </p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"157\" src=\"103436.png\" width=\"157\"/></p></div>", "solution_html": "<p class=\"noindent\">Плавление – горизонтальный участок графика. При плавлении получено 500000 Дж, откуда удельная теплота плавления:\n</p> <div class=\"math-display\">\n<img alt=\"    Q   500 кД ж\nλ = m-= --2-кг--= 250 кДж/ кг\n\" class=\"math-display\" src=\"index-3300f8786f9662ea5a91a23312ea4198.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-193d2db59dfd0d5c521b95dda28cb508.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213307/index-193d2db59dfd0d5c521b95dda28cb508.svg", "index-b09f64b3da86a405df1a410ee32cea4f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213307/index-b09f64b3da86a405df1a410ee32cea4f.svg", "103436.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213307/103436.png", "index-3300f8786f9662ea5a91a23312ea4198.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/213308/index-3300f8786f9662ea5a91a23312ea4198.svg"}, "tags": [], "sources": ["Банк ФИПИ"], "created_at": "2025-01-10T04:23:21Z", "updated_at": "2026-07-01T14:30:45Z"}, {"id": 11295, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">На рисунке показан график изменения температуры вещества <img alt=\"t  \" class=\"math\" src=\"index-dbb92d944a21d6ffe87de76f29668acb.svg\"/> по мере поглощения им количества теплоты <img alt=\"Q  \" class=\"math\" src=\"index-aa142c75e3789eab867781e4e87a2138.svg\"/>. Масса вещества\nравна 2 кг. Первоначально вещество было в твёрдом состоянии. Какова удельная теплота плавления вещества? Ответ дайте в\nкДж/кг\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"102720.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">При плавлении получено 400000 Дж, откуда удельная теплота плавления:\n</p> <div class=\"math-display\">\n<img alt=\"    Q   400 кДЖ\nλ=  m-= --2-кг--= 200 кД ж/кг\n\" class=\"math-display\" src=\"index-18880140a661b1a46c638f9b159c602c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-dbb92d944a21d6ffe87de76f29668acb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23458/index-dbb92d944a21d6ffe87de76f29668acb.svg", "index-aa142c75e3789eab867781e4e87a2138.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23458/index-aa142c75e3789eab867781e4e87a2138.svg", "102720.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23458/102720.png", "index-18880140a661b1a46c638f9b159c602c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23463/index-18880140a661b1a46c638f9b159c602c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления", "Демидова 2019"], "sources": ["Основная волна 2019"], "created_at": "2021-11-21T09:40:19Z", "updated_at": "2026-05-19T16:22:37Z"}, {"id": 11310, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Определите удельную теплоту плавления изначально твердого вещества массой 4 кг по графику зависимости количества теплоту <img alt=\"      Q  \" class=\"math\" src=\"index-902f1612ba1b91cdf9b11e63db2947da.svg\"/>\nот температуры <img alt=\"t  \" class=\"math\" src=\"index-616c400c9fd3f7d9619c3c20a80ae067.svg\"/>, если температура в точке 1 равна <img alt=\"700∘C  \" class=\"math\" src=\"index-6961cf5cc5ea6017af04c6cfc30739cc.svg\"/>. Ответ дайте в кДж/кг.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"11310.png\" width=\"421\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Проанализируем график. В промежутке от <img alt=\" ∘\n0 \" class=\"math\" src=\"index-81959819ca935082237c250b792fccad.svg\"/>С до <img alt=\"   ∘\n700 \" class=\"math\" src=\"index-b85d7f526b375b5194550ae9081508d7.svg\"/>С твердое тело нагревают. Как только график достигает отметки в\n<img alt=\"700∘ \" class=\"math\" src=\"index-b9b1f129e4da354e2e29f30ec79e3ad6.svg\"/>С, тело начинает плавиться до тех пор, пока количество теплоты не достигнет отметки в 600 кДж/кг. После этого начинается\nнагрев жидкости вплоть до <img alt=\"1500∘ \" class=\"math\" src=\"index-9904e44ec1fe8e53a7dd67afd3bbaba6.svg\"/>С. Как только график достигает значения в <img alt=\"1500∘ \" class=\"math\" src=\"index-7cfc404479972030b360c6f6554b359d.svg\"/>С, начинается процесс парообразования,\nкоторый продолжается вплоть до конца графика. Таким образом, необходимый нам промежуток находятся от 200 кДж до 600 кДж.\nТо есть, на плавление было затрачено:\n</p> <div class=\"math-display\">\n<img alt=\"                                     3\nQ = 600 кДж − 200 кД ж =400 кДж = 400⋅10 Дж\n\" class=\"math-display\" src=\"index-0041532a616b2be11cc7ec2930767cbd.svg\"/></div>\n<p class=\"indent\">   По формуле количества теплоты плавления:\n</p> <div class=\"math-display\">\n<img alt=\"Q =λm\n\" class=\"math-display\" src=\"index-c1897e5119dba153cd33bd71d9af842e.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"λ = Q-= 400⋅103 Дж/-кг= 100⋅103 Д ж/кг= 100 кД ж/кг\n    m         4\n\" class=\"math-display\" src=\"index-f61ef27c18ce7ca726ca1036b77e0090.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-902f1612ba1b91cdf9b11e63db2947da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23492/index-902f1612ba1b91cdf9b11e63db2947da.svg", "index-616c400c9fd3f7d9619c3c20a80ae067.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23492/index-616c400c9fd3f7d9619c3c20a80ae067.svg", "index-6961cf5cc5ea6017af04c6cfc30739cc.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23492/index-6961cf5cc5ea6017af04c6cfc30739cc.svg", "11310.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23492/11310.png", "index-81959819ca935082237c250b792fccad.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-81959819ca935082237c250b792fccad.svg", "index-b85d7f526b375b5194550ae9081508d7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-b85d7f526b375b5194550ae9081508d7.svg", "index-b9b1f129e4da354e2e29f30ec79e3ad6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-b9b1f129e4da354e2e29f30ec79e3ad6.svg", "index-9904e44ec1fe8e53a7dd67afd3bbaba6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-9904e44ec1fe8e53a7dd67afd3bbaba6.svg", "index-7cfc404479972030b360c6f6554b359d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-7cfc404479972030b360c6f6554b359d.svg", "index-0041532a616b2be11cc7ec2930767cbd.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-0041532a616b2be11cc7ec2930767cbd.svg", "index-c1897e5119dba153cd33bd71d9af842e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-c1897e5119dba153cd33bd71d9af842e.svg", "index-f61ef27c18ce7ca726ca1036b77e0090.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23493/index-f61ef27c18ce7ca726ca1036b77e0090.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:49:03Z", "updated_at": "2026-07-03T08:29:36Z"}, {"id": 65302, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">В котелок насыпали кусочки свинца и поставили на электрическую плитку. В минуту плитка передаёт свинцу в среднем количество\nтеплоты, равное 500 Дж. Диаграмма изменения температуры свинца с течением времени показана на рисунке. Какая масса свинца\nучаствовала в эксперименте? Ответ дайте в кг.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"65302 (1).png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Рассмотрим процесс плавления свинца, он идёт за 10 минут. Количество теплоты, необходимое для плавления равно:\n</p> <div class=\"math-display\">\n<img alt=\"Q = λm,\n\" class=\"math-display\" src=\"index-77488c79b23128784538bd3068c8fb57.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"λ  \" class=\"math\" src=\"index-fed2f970d6c38d0e480ad890875f9094.svg\"/> – удельная теплота плавления, <img alt=\"m  \" class=\"math\" src=\"index-9f4589646c457a117c158e80bd678f9a.svg\"/> – масса свинца.<br/>С другой стороны:\n</p> <div class=\"math-display\">\n<img alt=\"Q =P t,\n\" class=\"math-display\" src=\"index-07b4edee9737f4cf16b123decf6599cf.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"P  \" class=\"math\" src=\"index-4c3aec8013629eaaa89de35eecd14d0b.svg\"/> – средняя мощность, передаваемая свинцу, <img alt=\"t  \" class=\"math\" src=\"index-2a5fef8d69477bff3a0bb28e0844d14e.svg\"/> – время плавления.<br/>Тогда:\n</p> <div class=\"math-display\">\n<img alt=\"P t= λm ⇒ m = P-t= 500 Д-ж/ми4н⋅10-мин =0,2 кг\n               λ     2,5⋅10 Д ж/кг\n\" class=\"math-display\" src=\"index-7d2d8c250875706398a0d1f07093a564.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"65302 (1).png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118118/65302 (1).png", "index-77488c79b23128784538bd3068c8fb57.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-77488c79b23128784538bd3068c8fb57.svg", "index-fed2f970d6c38d0e480ad890875f9094.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-fed2f970d6c38d0e480ad890875f9094.svg", "index-9f4589646c457a117c158e80bd678f9a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-9f4589646c457a117c158e80bd678f9a.svg", "index-07b4edee9737f4cf16b123decf6599cf.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-07b4edee9737f4cf16b123decf6599cf.svg", "index-4c3aec8013629eaaa89de35eecd14d0b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-4c3aec8013629eaaa89de35eecd14d0b.svg", "index-2a5fef8d69477bff3a0bb28e0844d14e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-2a5fef8d69477bff3a0bb28e0844d14e.svg", "index-7d2d8c250875706398a0d1f07093a564.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/118119/index-7d2d8c250875706398a0d1f07093a564.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Демидова 2022"], "created_at": "2023-07-09T08:27:23Z", "updated_at": "2026-07-03T08:29:50Z"}, {"id": 17836, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Образец массой 7,2 кг находящийся в твёрдом состоянии, поместили в электропечь и начали нагревать. На рисунке приведён\nграфик зависимости температуры <img alt=\"t  \" class=\"math\" src=\"index-c1d5d44b59c173ead581ab4b4079f212.svg\"/> этого образца от времени <img alt=\"τ  \" class=\"math\" src=\"index-06095d8f61055beb8bdd30566992b65d.svg\"/>. Известно, что мощность электропечи равна 0,6\nкВт. Какова удельная теплота плавления образца? Потерями теплоты при нагревании пренебречь. Ответ дайте в\nкДж/кг\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"421\" src=\"17836.png\" width=\"421\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">Удельную теплоту плавления найдем по формуле <img alt=\"    Q-  P-τ\nλ = m =  m  \" class=\"math\" src=\"index-2e57d22c4b0348a85ff0371d0a2160da.svg\"/><br/>Плавление происходит в промежутке времени от 20 до 40 минут, значит:\n</p> <div class=\"math-display\">\n<img alt=\"    0,6 ⋅(40− 20)⋅60\nλ = -----7,2------= 100 кД ж/кг\n\" class=\"math-display\" src=\"index-af3e2054786a7761b37902071418c7df.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-c1d5d44b59c173ead581ab4b4079f212.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35130/index-c1d5d44b59c173ead581ab4b4079f212.svg", "index-06095d8f61055beb8bdd30566992b65d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35130/index-06095d8f61055beb8bdd30566992b65d.svg", "17836.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35130/17836.png", "index-2e57d22c4b0348a85ff0371d0a2160da.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35131/index-2e57d22c4b0348a85ff0371d0a2160da.svg", "index-af3e2054786a7761b37902071418c7df.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/35131/index-af3e2054786a7761b37902071418c7df.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Банк ФИПИ"], "created_at": "2022-01-16T14:23:13Z", "updated_at": "2026-07-03T08:30:11Z"}, {"id": 11314, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">На рисунке показана зависимость температуры <img alt=\"T  \" class=\"math\" src=\"index-3e3e284794adae66da611ddaf628b4d2.svg\"/> от выделенной теплоты <img alt=\"Q  \" class=\"math\" src=\"index-c310410732463b38b2d779decf258d5b.svg\"/> для 0,8 кг первоначально газообразного вещества.\nНайдите удельную теплоту парообразования вещества. Ответ дайте в кДж/кг. </p><figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"263\" src=\"11314.png\" width=\"263\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">В процессе конденсации температура вещества не меняется. На графике есть лишь один такой кусок в промежутке от 20 кДж до 60\nкДж. Следовательно, за весь процесс конденсации выделяется количество теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = Q2− Q1 = 60 кДж − 20 кД ж = 40 кДж\n\" class=\"math-display\" src=\"index-ad8292451ed5519e8a8f8aa6da072399.svg\"/></div>\n<p class=\"indent\">   По формуле количества теплоты:\n</p> <div class=\"math-display\">\n<img alt=\"Q = rm\n\" class=\"math-display\" src=\"index-a88a2d7ce7ebee485f7ae37950c9064f.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"    Q   40 кД ж\nr = m-= -0,8-кг-= 50 кДж/ кг\n\" class=\"math-display\" src=\"index-d30c9f127219da8de8666577764d9e99.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-3e3e284794adae66da611ddaf628b4d2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23501/index-3e3e284794adae66da611ddaf628b4d2.svg", "index-c310410732463b38b2d779decf258d5b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23501/index-c310410732463b38b2d779decf258d5b.svg", "11314.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23501/11314.png", "index-ad8292451ed5519e8a8f8aa6da072399.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23500/index-ad8292451ed5519e8a8f8aa6da072399.svg", "index-a88a2d7ce7ebee485f7ae37950c9064f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23500/index-a88a2d7ce7ebee485f7ae37950c9064f.svg", "index-d30c9f127219da8de8666577764d9e99.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23500/index-d30c9f127219da8de8666577764d9e99.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:52:40Z", "updated_at": "2026-07-03T08:25:06Z"}, {"id": 117353, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">На рисунке изображён график зависимости температуры тела от подводимого к нему количества теплоты. Масса тела равна 1,25 кг.\nЧему равна удельная теплоёмкость вещества этого тела? Ответ дайте в Дж/(кг <img alt=\"⋅ \" class=\"math\" src=\"index-460aafb2ca72876744c7423b5bcb8c91.svg\"/> К).\n</p>\n<div class=\"center\">\n<p class=\"noindent\">\n</p><p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"117353.png\" width=\"210\"/></p></div>", "solution_html": "<p class=\"noindent\">Количество теплоты при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= cm Δt,\n\" class=\"math-display\" src=\"index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-79e2684d697a3870e7126a3f7c922535.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-fabbf0fc9e30c5b84e56eb1377ba701b.svg\"/> – масса тела, <img alt=\"Δt  \" class=\"math\" src=\"index-9fb53348692a3cbb075de0546fbaa436.svg\"/> – изменение температуры.<br/>Тогда\n</p> <div class=\"math-display\">\n<img alt=\"     Q     60⋅103 Д ж\nc = mΔt-= 1,25 кг⋅60-К =800 Дж/(кг⋅К )\n\" class=\"math-display\" src=\"index-616043eaca48541e16b71c9c8471c033.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-460aafb2ca72876744c7423b5bcb8c91.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/241045/index-460aafb2ca72876744c7423b5bcb \n<img alt=\"    Q     350⋅103 Дж           Дж        Д ж\nc= mΔt-= 2,5 кг-⋅100-К = 1,4 ⋅103кг⋅К-= 1400кг⋅К-\n\" class=\"math-display\" src=\"index-93326c1116fee5ea90938a8c9c5168c7.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-f057db355b31f461e8cf26090a72199d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23498/index-f057db355b31f461e8cf26090a72199d.svg", "11313.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23498/11313.png", "index-90c4ef8d8fa4b4e196455d6110a578b9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23499/index-90c4ef8d8fa4b4e196455d6110a578b9.svg", "index-93326c1116fee5ea90938a8c9c5168c7.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23499/index-93326c1116fee5ea90938a8c9c5168c7.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:51:24Z", "updated_at": "2026-04-21T19:21:00Z"}, {"id": 64219, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">На рисунке приведён график зависимости температуры твёрдого тела от отданного им количества теплоты. Масса тела 4 кг. Какова\nудельная теплоёмкость вещества этого тела? Ответ дайте в <img alt=\"Дж/ (кг⋅К )  \" class=\"math\" src=\"index-45576ad33ba3ae4761b5a7c00c244834.svg\"/>.\n</p> <figure class=\"figure\"> <p class=\"noindent\"><img alt=\"PIC\" height=\"210\" src=\"64219.png\" width=\"210\"/> </p> </figure>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты для нагрева вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm (t2− t1),\n\" class=\"math-display\" src=\"index-307695bab1eb53e860fca9cdaef3a053.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-8f8632e5f9092ef8ff2a3106c7bca055.svg\"/> – теплоёмкость, <img alt=\"m  \" class=\"math\" src=\"index-756e609757ce9121fc78ae586e282d33.svg\"/> – масса, <img alt=\"t2  \" class=\"math\" src=\"index-6b7dbcfe3117284a0cabbb3a1bad831e.svg\"/> и <img alt=\"t1  \" class=\"math\" src=\"index-ab01f5315f0a29a757ea979226cc5769.svg\"/> – конечная и начальная температура.<br/>Отсюда\n</p> <div class=\"math-display\">\n<img alt=\"       Q         200⋅103 Д ж\nc = m(t-− t-) = 4-кг(400-К−-300 К-) = 500 Дж/ кг⋅К\n      2   1\n\" class=\"math-display\" src=\"index-cb253d27ab7bdb6abd87b685a86c6eb9.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-45576ad33ba3ae4761b5a7c00c244834.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115988/index-45576ad33ba3ae4761b5a7c00c244834.svg", "64219.png": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115988/64219.png", "index-307695bab1eb53e860fca9cdaef3a053.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-307695bab1eb53e860fca9cdaef3a053.svg", "index-8f8632e5f9092ef8ff2a3106c7bca055.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-8f8632e5f9092ef8ff2a3106c7bca055.svg", "index-756e609757ce9121fc78ae586e282d33.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-756e609757ce9121fc78ae586e282d33.svg", "index-6b7dbcfe3117284a0cabbb3a1bad831e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-6b7dbcfe3117284a0cabbb3a1bad831e.svg", "index-ab01f5315f0a29a757ea979226cc5769.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-ab01f5315f0a29a757ea979226cc5769.svg", "index-cb253d27ab7bdb6abd87b685a86c6eb9.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/115989/index-cb253d27ab7bdb6abd87b685a86c6eb9.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Банк ФИПИ"], "created_at": "2023-06-19T07:22:16Z", "updated_at": "2026-04-21T18:45:14Z"}, {"id": 64403, "name": "Задача на тепловые явлени service/v1/GetSession/379742/index-183d399afc384676cee50e5ec02d5755.svg", "index-1a032081bb8544d89d84584737e08fa5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-1a032081bb8544d89d84584737e08fa5.svg", "index-d40363e984146ec671187639b48a256f.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-d40363e984146ec671187639b48a256f.svg", "index-1314344a6b9f15c53a1c11855fa92566.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-1314344a6b9f15c53a1c11855fa92566.svg", "index-d08724455066ace3753e3a86e346632e.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-d08724455066ace3753e3a86e346632e.svg", "index-64ac993a0ef77b6dea6abe2fe45ad055.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-64ac993a0ef77b6dea6abe2fe45ad055.svg", "index-f03996b07447e2cea721aa8bc73862f6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/379743/index-f03996b07447e2cea721aa8bc73862f6.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "МКТ. Термодинамика", "Циклы. КПД теплового двигателя"], "sources": ["ЕГКР 954 Физика 26.03.2026"], "created_at": "2026-03-26T10:30:50Z", "updated_at": "2026-04-24T08:43:30Z"}, {"id": 64802, "name": "Задача на МКТ и термодинамику. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Какова удельная теплоёмкость металла, из которого сделана деталь массой 100 г, если при сообщении ей количества теплоты,\nравного 840 Дж, она нагрелась на <img alt=\"15∘C  \" class=\"math\" src=\"index-71c6cc0ed7edbc82c9d3243d24cb54eb.svg\"/>? Ответ дайте в <img alt=\"Дж/(кг⋅∘C)  \" class=\"math\" src=\"index-7516fdb0ac96871613eefff34657565a.svg\"/>\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"Q= cm Δt,\n\" class=\"math-display\" src=\"index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg\"/></div>\n<p class=\"indent\">   где <img alt=\"c  \" class=\"math\" src=\"index-79e2684d697a3870e7126a3f7c922535.svg\"/> – удельная теплоёмкость вещества, <img alt=\"m  \" class=\"math\" src=\"index-fabbf0fc9e30c5b84e56eb1377ba701b.svg\"/> – масса тела, <img alt=\"Δt  \" class=\"math\" src=\"index-9fb53348692a3cbb075de0546fbaa436.svg\"/> – изменение температуры.\n</p><p class=\"indent\">   Тогда удельная теплоёмкость металла, из которого сделана деталь\n</p> <div class=\"math-display\">\n<img alt=\"     Q      840 Д ж\nc=  mΔt-= 0,1 кг⋅15∘C-= 560 Дж/ (кг⋅∘C )\n\" class=\"math-display\" src=\"index-189125e6adf07a3c1a9d28dde7e7c401.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-71c6cc0ed7edbc82c9d3243d24cb54eb.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117019/index-71c6cc0ed7edbc82c9d3243d24cb54eb.svg", "index-7516fdb0ac96871613eefff34657565a.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117019/index-7516fdb0ac96871613eefff34657565a.svg", "index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117020/index-9bf14dce3fef60eb68bfaa72c7fae0e0.svg", "index-79e2684d697a3870e7126a3f7c922535.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117020/index-79e2684d697a3870e7126a3f7c922535.svg", "index-fabbf0fc9e30c5b84e56eb1377ba701b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117020/index-fabbf0fc9e30c5b84e56eb1377ba701b.svg", "index-9fb53348692a3cbb075de0546fbaa436.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117020/index-9fb53348692a3cbb075de0546fbaa436.svg", "index-189125e6adf07a3c1a9d28dde7e7c401.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/117020/index-189125e6adf07a3c1a9d28dde7e7c401.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": ["Демидова 2021"], "created_at": "2023-07-02T11:31:41Z", "updated_at": "2026-04-07T18:16:14Z"}, {"id": 11312, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Андрей решил провести опыт. Он сообщил чугунной сковородке массой 3 кг определенное количество теплоты, в результате чего\nсковородка нагрелась от 290 К до 333 К. Какое количество теплоты сообщил сковородке Андрей? Ответ дайте в\nкДж\n</p>", "solution_html": "<p class=\"noindent\">По формуле количества теплоты для нагрева вещества:\n</p> <div class=\"math-display\">\n<img alt=\"Q = cmΔt = cm(t2 − t1)\n\" class=\"math-display\" src=\"index-16e81d8ea192c8e6a7a2f703184a09ec.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"       Д ж\nQ = 500 кг⋅К-⋅3 кг⋅(333 К− 290 К )= 64500 Дж = 64,5 кДж\n\" class=\"math-display\" src=\"index-4bb9ce6f230a096ee8d0d35e6ea2516c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-16e81d8ea192c8e6a7a2f703184a09ec.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23497/index-16e81d8ea192c8e6a7a2f703184a09ec.svg", "index-4bb9ce6f230a096ee8d0d35e6ea2516c.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23497/index-4bb9ce6f230a096ee8d0d35e6ea2516c.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:50:26Z", "updated_at": "2026-05-19T16:35:19Z"}, {"id": 11302, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Кузнец Грегор грел кусок железа массой <img alt=\"m = 350  \" class=\"math\" src=\"index-b9f95a2105d4c466385c86d2d805db88.svg\"/> г в печи. При этом он нагрелся с <img alt=\"      ∘\nt1 = 35C  \" class=\"math\" src=\"index-079c7d25c9d32dec6ddd591ddae06e40.svg\"/> до <img alt=\"     ∘\nt2 = 90C  \" class=\"math\" src=\"index-10b37d26667a9be297d5342525e75be3.svg\"/>. Определите\nколичество теплоты, полученное куском железа. Ответ дайте в Дж.\n</p>", "solution_html": "<p class=\"noindent\">Количество теплоты при нагреве определяется формулой:\n</p> <div class=\"math-display\">\n<img alt=\"                         Дж            ∘     ∘\nQ = cmΔt = cm (t2 − t1)= 460кг⋅К-⋅0,35 кг⋅(90 C − 35 C )= 8855 Дж\n\" class=\"math-display\" src=\"index-6a454bd6834908a39f0dd4b4cb804a47.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-b9f95a2105d4c466385c86d2d805db88.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23477/index-b9f95a2105d4c466385c86d2d805db88.svg", "index-079c7d25c9d32dec6ddd591ddae06e40.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23477/index-079c7d25c9d32dec6ddd591ddae06e40.svg", "index-10b37d26667a9be297d5342525e75be3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23477/index-10b37d26667a9be297d5342525e75be3.svg", "index-6a454bd6834908a39f0dd4b4cb804a47.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23476/index-6a454bd6834908a39f0dd4b4cb804a47.svg"}, "tags": ["Уровень ЕГЭ", "Формат ЕГЭ", "Молекулярная физика. МКТ", "Тепловые явления"], "sources": [], "created_at": "2021-11-21T09:43:12Z", "updated_at": "2026-04-07T18:15:53Z"}, {"id": 11305, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">Кузнец дал своему помощнику задание расплавить кусок алюминия, изначально находящийся при температуре <img alt=\"       ∘\nt1 = 60,3 \" class=\"math\" src=\"index-6ccb7f60aa4cd404a8bd7a44d3c14500.svg\"/>C. Через\n18 с алюминий достиг температуры плавления <img alt=\"t2 =660,3∘ \" class=\"math\" src=\"index-8b9a4d4519c32f129da58aa7dc7eb199.svg\"/>C. Сколько секунд понадобится помощнику, чтобы расплавить этот\nкусок, находящийся при температуре плавления? Удельная теплота плавления алюминия 390 кДж/кг. Ответ дайте в\nс.\n</p>", "solution_html": "<p class=\"noindent\">По формуле мощности нагревателя:\n</p> <div class=\"math-display\">\n<img alt=\"    A\nP = τ-\n\" class=\"math-display\" src=\"index-72beefff10adfe59f12dd5b246e858c2.svg\"/></div>\n<p class=\"indent\">   Мощность нагревателя остается неизменной, т.е. меняется только работа <img alt=\"A  \" class=\"math\" src=\"index-b6d8172354108e651f4ceb7e182f023f.svg\"/> и время, на неё затраченное. То\nесть:\n</p> <div class=\"math-display\">\n<img alt=\"P = Qнагр-= Qпл-\n    τнагр   τпл\n\" class=\"math-display\" src=\"index-be55533730bb0fc0079c353060ba8d7e.svg\"/></div>\n<p class=\"indent\">   По формуле количества теплоты нагрева:\n</p> <div class=\"math-display\">\n<img alt=\"Qнагр =cm Δt= cm (t2− t1)\n\" class=\"math-display\" src=\"index-41a5f0fabdc20b5894d1473eeb893355.svg\"/></div>\n<p class=\"indent\">   По формуле количества теплоты плавления:\n</p> <div class=\"math-display\">\n<img alt=\"Qпл = λm\n\" class=\"math-display\" src=\"index-b7e8233bf3c4392b9e54d32854ca7eaf.svg\"/></div> <p class=\"indent\">   Из имеющихся данных найдем время плавления <img alt=\"τпл  \" class=\"math\" src=\"index-4534b7481c7c7d491f79034de512e12e.svg\"/>:\n</p> <div class=\"math-display\">\n<img alt=\"     Qплτнагр  --λmτнагр-   -λτнагр--  ----390-⋅103-Дж/кг⋅18-с----\nτпл =  Qнагр = cm (t2− t1) = c(t2− t1) =    Д-ж--     ∘       ∘   = 13 с\n                                    900кг⋅К  ⋅(660,3C − 60,3 C)\n\" class=\"math-display\" src=\"index-1bf41ca2d2ff8c2b4d9f4e145561c32c.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-6ccb7f60aa4cd404a8bd7a44d3c14500.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23481/index-6ccb7f60aa4cd404a8bd7a44d3c14500.svg", "index-8b9a4d4519c32f129da58aa7dc7eb199.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23481/index-8b9a4d4519c32f129da58aa7dc7eb199.svg", "index-72beefff10adfe59f12dd5b246e858c2.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23483/ ового баланса: :\n</p> <div class=\"math-display\">\n<img alt=\"Q в = Qл\n\" class=\"math-display\" src=\"index-fdf6dd80eac4ccf628e16dc7e94ab312.svg\"/></div>\n<p class=\"indent\">   Проверим, какое количество теплоты выделяется при кристализации воды и при нагревании льда до <img alt=\" ∘\n0 \" class=\"math\" src=\"index-b2fdbd6be13df01bddf2cd7ea28e47f4.svg\"/>C:\n</p> <div class=\"math-display\">\n<img alt=\"               3                    3\nQв = λm в = 330⋅10 Дж/ кг⋅4 кг= 1320⋅10 Дж = 1320 кД ж\n\" class=\"math-display\" src=\"index-2006f562d6b5a078d5d6493467c4c74c.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"                     Дж          ∘        ∘\nQл = cm л(t1− t2)= 2100кг⋅К-⋅0,5 кг⋅(0С − (− 99С ))= 103950 Д ж =103,95 кД ж\n\" class=\"math-display\" src=\"index-b70c45769fa3af6603649fc6181e9169.svg\"/></div>\n<p class=\"indent\">   Количество теплоты, выделившиеся при кристализации воды намного больше, чем количество теплоты для нагрева льда,\nследовательно, тепловое равновесие наступит при <img alt=\"0∘ \" class=\"math\" src=\"index-0c44b80dab4b92ee2148115c77be00fd.svg\"/>C, а вода выделит на нагрев льда количество теплоты численно равное\nзначению <img alt=\"Q  \" class=\"math\" src=\"index-9819c07f60a39f6ccc9c2efa10899525.svg\"/>. В процессе этого часть воды превратится в лёд, то есть:\n</p> <div class=\"math-display\">\n<img alt=\"Qл = λm пр.в.\n\" class=\"math-display\" src=\"index-5eec4e8cad447051b7966fe3d30a0b3f.svg\"/></div> <p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"       Qл-  --103950-Дж---\nmпр.в. = λ = 330⋅103 Дж/ кг = 0,315 кг= 315 г\n\" class=\"math-display\" src=\"index-72b46f40cb10b44db5e5e6112f4cc839.svg\"/></div>\n<p class=\"indent\">   Общая масса льда в калориметре:\n</p> <div class=\"math-display\">\n<img alt=\"m = mпр.в.+ mл = 315 г+ 500 г= 815 г\n\" class=\"math-display\" src=\"index-27a1d3153044949df0604a908f6bdf68.svg\"/></div>", "answer_html": "", "grade_criteria_h s": [], "created_at": "2021-11-21T09:45:42Z", "updated_at": "2026-01-24T07:57:47Z"}, {"id": 11316, "name": "Задача на тепловые явления. Первая часть", "theme_path": "№8 Термодинамика -> Тепловые явления. Теплообмен", "question_html": "<p class=\"noindent\">В калориметре смешали 10 кг воды при температуре <img alt=\"  ∘\n54C  \" class=\"math\" src=\"index-1c42d306c65926b7deae807d5e5b4bc1.svg\"/> и 7 кг воды при температуре <img alt=\" ∘\n17C  \" class=\"math\" src=\"index-7d33d73872e2472950095a617636a408.svg\"/>. Найдите температуру смеси.\nТеплоемкостью калориметра пренебречь. Ответ дайте в <span class=\"tcrm-0900\">°</span>C и округлите до десятых.\n</p>", "solution_html": "<p class=\"noindent\">Пусть <img alt=\"Q1  \" class=\"math\" src=\"index-6ec563975c92edf1fb99626722557425.svg\"/> — количество теплоты, отданное водой массой <img alt=\"m1  \" class=\"math\" src=\"index-d202ddceceddaf7167f603b8080cd468.svg\"/>=10кг, а <img alt=\"Q2  \" class=\"math\" src=\"index-53b16e51e33e64aefb546d33007d45f3.svg\"/> — количество теплоты, полученное водой массой <img alt=\"   m2  \" class=\"math\" src=\"index-48c9afa7d46017e48f55e6ae406705d2.svg\"/>=7\nкг. Составим уравнение теплового баланса:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"Q1 = Q2\n\" class=\"math-display\" src=\"index-475e06619cc279d003a9784c0aa66139.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"cm1ΔT1 = cm2ΔT2\n\" class=\"math-display\" src=\"index-d29b8a94798c7e3b3631290e15b947a5.svg\"/></div>\n<p class=\"indent\">   Пусть температура смеси равна <img alt=\"T0  \" class=\"math\" src=\"index-a41e8e282a0a1d7dfbddc9d27527466d.svg\"/>. Тогда:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"m1 (T1− T0)= m2(T0− T2)\n\" class=\"math-display\" src=\"index-464fb25132bfeac6626daeb0e58fd514.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"m1T1 − m1T0 = m2T0 − m2T2\n\" class=\"math-display\" src=\"i  \" class=\"math\" src=\"index-a41e8e282a0a1d7dfbddc9d27527466d.svg\"/>. Тогда:\n</p><p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"m1 (T1− T0)= m2(T0− T2)\n\" class=\"math-display\" src=\"index-464fb25132bfeac6626daeb0e58fd514.svg\"/></div>\n<p class=\"indent\">\n</p> <div class=\"math-display\">\n<img alt=\"                          ∘     ∘\nm2 = m1(T0−-T1)= 100 кг⋅(∘20-C −∘12-C)≈ 10,26 кг\n      (T2− T0)       (98C − 20 C)\n\" class=\"math-display\" src=\"index-1659c13bff704e61bf8a27966fa7aa46.svg\"/></div>", "answer_html": "", "grade_criteria_html": "", "images": {"index-aba727310987c3ff9c99cee03dcc05f3.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23506/index-aba727310987c3ff9c99cee03dcc05f3.svg", "index-0b00bceaf681cacebd2e8d77b7a37951.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23506/index-0b00bceaf681cacebd2e8d77b7a37951.svg", "index-5e9fc15f3d93bfe5a46a4e46ee523caa.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23506/index-5e9fc15f3d93bfe5a46a4e46ee523caa.svg", "index-04a49164c776463c8457a1f0cb02419b.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-04a49164c776463c8457a1f0cb02419b.svg", "index-8a6eef7cdbabc44e845eb3790591d3b6.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-8a6eef7cdbabc44e845eb3790591d3b6.svg", "index-1c1528bef6189f6454aab54ddf1ed587.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-1c1528bef6189f6454aab54ddf1ed587.svg", "index-475e06619cc279d003a9784c0aa66139.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-475e06619cc279d003a9784c0aa66139.svg", "index-d29b8a94798c7e3b3631290e15b947a5.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-d29b8a94798c7e3b3631290e15b947a5.svg", "index-a41e8e282a0a1d7dfbddc9d27527466d.svg": "https://3.shkolkovo.online/api/latex-service/v1/GetSession/23507/index-a41e8e282a0a1d7dfbddc9d2752746
